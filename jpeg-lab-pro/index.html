<script>

const $=(s,r=document)=>r.querySelector(s);

const TAU=Math.PI*2;

const C={};
function readC(){const cs=getComputedStyle(document.documentElement);['orange','orange-t','bg','card','ink','ink2','line','line2','scope','analog','cream','bad','good','blue'].forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim())}
const REM=()=>parseFloat(getComputedStyle(document.documentElement).fontSize)||16;
function setup(cv){
 const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
 const w=Math.max(20,Math.round(r.width)),h=Math.max(20,Math.round(r.height));
 if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
 const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);
 return{x,w,h,R:REM()};
}

function TH(x,s,px,py,size,col,al='left'){T(x,s,px,py,size,col,al,'Montserrat',700)}

function ptr(e,cv){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,h:r.height}}

 let on=false;

const lg=(L,a,b,p0,p1)=>p0+(log10(Math.max(L,1e-12))-log10(a))/(log10(b)-log10(a))*(p1-p0);

/* ========== stav ========== */
const MAPS={},IMAP={};
const S={tab:0,
 q:50,sub:'s420',img:'foto',
 st:4,mp:12,                       // 1 Cesta obrazu
 blk:'img',bx:9,by:7,nc:10,qt:'y',   // 3–5 blok
 grid:false,rx:104,ry:60,rx7:20,ry7:6,            // 6 Laboratoř

const OUT={},ACT={},TABS=[];
function set(k,v){S[k]=v;refresh()}
let _rq=0;
function refresh(){if(_rq)return;_rq=requestAnimationFrame(()=>{_rq=0;sync();const t=TABS[S.tab];t&&t.render&&t.render()})}
function sync(){
 $$('[data-k][data-v]').forEach(el=>el.classList.toggle('on',String(S[el.dataset.k])===el.dataset.v));
 $$('input[data-k]').forEach(el=>{let v=S[el.dataset.k];if(el.dataset.map)v=IMAP[el.dataset.map](v);el.value=v;el.style.setProperty('--p',((el.value-el.min)/(el.max-el.min)*100)+'%')});
 $$('[data-o]').filter(el=>{const t=el.closest('.tab');return !t||!t.hidden}).forEach(el=>{const f=OUT[el.dataset.o];if(f){const h=f();if(el.innerHTML!==h)el.innerHTML=h}});
}
document.addEventListener('click',e=>{

 if(el.dataset.act){ACT[el.dataset.act]&&ACT[el.dataset.act](el.dataset.v,el);return}
 let v=el.dataset.v;if(/^-?\d+(\.\d+)?$/.test(v))v=+v;else if(v==='true')v=true;else if(v==='false')v=false;set(el.dataset.k,v);
});

 let v=+el.value;if(el.dataset.map)v=MAPS[el.dataset.map](v);set(el.dataset.k,v);
});

/* ========== rámec aplikace ========== */
const ICON={
 theme:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>',

};
const PLAYI='<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
const STOPI='<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
function go(i){
 if(S.play)ACT.play();
 S.tab=i;
 $$('#stage>.tab').forEach((s,j)=>s.hidden=j!==i);
 $$('#tabs .tab-b').forEach((b,j)=>b.setAttribute('aria-selected',j===i));

}

function boot(){

/* --- kodér --- */
const MEMO=new Map();
function toPlanes(im){
 const {w,h,d}=im,n=w*h,Y=new Float32Array(n),Cb=new Float32Array(n),Cr=new Float32Array(n);
 for(let i=0,j=0;i<n;i++,j+=4){const r=d[j],g=d[j+1],b=d[j+2];Y[i]=.299*r+.587*g+.114*b;Cb[i]=128-.168736*r-.331264*g+.5*b;Cr[i]=128+.5*r-.418688*g-.081312*b}
 return{Y,Cb,Cr};
}
function shrink(p,w,h,fx,fy){
 if(fx===1&&fy===1)return{p,w,h};
 const nw=w/fx,nh=h/fy,o=new Float32Array(nw*nh),k=1/(fx*fy);
 for(let y=0;y<nh;y++)for(let x=0;x<nw;x++){let s=0;for(let dy=0;dy<fy;dy++)for(let dx=0;dx<fx;dx++)s+=p[(y*fy+dy)*w+x*fx+dx];o[y*nw+x]=s*k}
 return{p:o,w:nw,h:nh};
}
function grow(s,W,H,fx,fy){
 if(fx===1&&fy===1)return s.p;
 const o=new Float32Array(W*H),p=s.p,sw=s.w;
 for(let y=0;y<H;y++){const sy=clamp((y+.5)/fy-.5,0,s.h-1),y0=sy|0,y1=Math.min(y0+1,s.h-1),ty=sy-y0;
  for(let x=0;x<W;x++){const sx=clamp((x+.5)/fx-.5,0,sw-1),x0=sx|0,x1=Math.min(x0+1,sw-1),tx=sx-x0;
   o[y*W+x]=lerp(lerp(p[y0*sw+x0],p[y0*sw+x1],tx),lerp(p[y1*sw+x0],p[y1*sw+x1],tx),ty)}}
 return o;
}
function codePlane(p,pw,ph,qt){
 const nbx=pw>>3,nby=ph>>3,Q=new Int16Array(nbx*nby*64),rec=new Float32Array(pw*ph),b=new Float32Array(64),c=new Float32Array(64),r=new Float32Array(64);
 for(let by=0;by<nby;by++)for(let bx=0;bx<nbx;bx++){
  const o=(by*nbx+bx)*64;
  for(let y=0;y<8;y++)for(let x=0;x<8;x++)b[y*8+x]=p[(by*8+y)*pw+bx*8+x]-128;
  fdct(b,c);
  for(let i=0;i<64;i++){const q=rnd0(c[i]/qt[i]);Q[o+i]=q;c[i]=q*qt[i]}
  idct(c,r);
  for(let y=0;y<8;y++)for(let x=0;x<8;x++)rec[(by*8+y)*pw+bx*8+x]=r[y*8+x]+128;
 }
 return{Q,rec};
}
function entropyBits(Qy,Qcs){
 const dcY=new Int32Array(16),dcC=new Int32Array(16),acY=new Int32Array(256),acC=new Int32Array(256);let ex=0;
 const run=(Q,dc,ac)=>{let prev=0;for(let o=0;o<Q.length;o+=64){const dd=Q[o]-prev;prev=Q[o];const c=cat(dd);dc[c]++;ex+=c;let r=0;
  for(let k=1;k<64;k++){const v=Q[o+ZZ[k]];if(!v){r++;continue}while(r>15){ac[0xF0]++;r-=16}const s=cat(v);ac[(r<<4)|s]++;ex+=s;r=0}
  if(r)ac[0]++}};
 run(Qy,dcY,acY);Qcs.forEach(Q=>run(Q,dcC,acC));
 const H=a=>{let n=0,b=0;for(const v of a)n+=v;for(const v of a)if(v)b-=v*Math.log2(v/n);return b};
 return H(dcY)+H(acY)+H(dcC)+H(acC)+ex;
}
function psnrRGB(a,b){let e=0,n=0;for(let i=0;i<a.length;i+=4){for(let k=0;k<3;k++){const d=a[i+k]-b[i+k];e+=d*d}n+=3}e/=n;return e<1e-9?99:10*Math.log10(65025/e)}
function codec(im,q,sub){
 const key=im.id?im.id+'|'+q+'|'+sub:null;if(key&&MEMO.has(key))return MEMO.get(key);
 const {w,h}=im,sb=SUB[sub],P=toPlanes(im),qy=scaleQ(QL,q),qc=scaleQ(QC,q);
 const py=codePlane(P.Y,w,h,qy),cb=shrink(P.Cb,w,h,sb.fx,sb.fy),cr=shrink(P.Cr,w,h,sb.fx,sb.fy);
 const pcb=codePlane(cb.p,cb.w,cb.h,qc),pcr=codePlane(cr.p,cr.w,cr.h,qc);
 const Cb2=grow({p:pcb.rec,w:cb.w,h:cb.h},w,h,sb.fx,sb.fy),Cr2=grow({p:pcr.rec,w:cr.w,h:cr.h},w,h,sb.fx,sb.fy);
 const d=new Uint8ClampedArray(w*h*4);
 for(let i=0,j=0;i<w*h;i++,j+=4){const y=py.rec[i],cbv=Cb2[i]-128,crv=Cr2[i]-128;d[j]=y+1.402*crv;d[j+1]=y-.344136*cbv-.714136*crv;d[j+2]=y+1.772*cbv;d[j+3]=255}
 const bits=entropyBits(py.Q,[pcb.Q,pcr.Q])+8*623,bytes=bits/8;
 const res={d,w,h,bits,bytes,psnr:psnrRGB(im.d,d),ratio:w*h*3/bytes};
 if(key){MEMO.set(key,res);if(MEMO.size>40)MEMO.delete(MEMO.keys().next().value)}
 return res;
}
function errImg(a,b,k){const o=new Uint8ClampedArray(a.length);for(let i=0;i<a.length;i+=4){o[i]=Math.abs(a[i]-b[i])*k;o[i+1]=Math.abs(a[i+1]-b[i+1])*k;o[i+2]=Math.abs(a[i+2]-b[i+2])*k;o[i+3]=255}return o}
function shift1(im){const {w,h,d}=im,o=new Uint8ClampedArray(d.length);for(let y=0;y<h;y++){const sy=Math.max(0,y-1);for(let x=0;x<w;x++){const sx=Math.max(0,x-1),a=(sy*w+sx)*4,b=(y*w+x)*4;o[b]=d[a];o[b+1]=d[a+1];o[b+2]=d[a+2];o[b+3]=255}}return{w,h,d:o}}
const putCv=(d,w,h)=>{const c=cvs(w,h);c.getContext('2d').putImageData(new ImageData(d,w,h),0,0);return c};

const gridSel=()=>`<div class="ctl"><div class="hd"><span class="lbl">${tx('Mřížka 8 × 8 v lupě','8 × 8 grid in zoom')}</span></div><div class="seg"><button class="chip" data-k="grid" data-v="true">${tx('Zapnuto','On')}</button><button class="chip" data-k="grid" data-v="false">${tx('Vypnuto','Off')}</button></div></div>`;

<script>
/* ===== 1 Cesta obrazu ===== */
(function(){
const MPS=[2,12,24,48];
function stages(){
 const P=S.mp*1e6,raw=P*3,sv=SUB[S.sub].v/3,fin=P*bppQ(S.q,S.sub)/8,sn=SUB[S.sub].n;
 return[
 {n:[tx('Snímek','Picture'),'RGB'],lossy:0,B:raw,g:'rgb',note:tx('3 čísla na pixel','3 numbers per pixel'),
  d:tx(`Barevný snímek je mřížka pixelů. Každý pixel má tři čísla 0 až 255: červenou, zelenou a modrou. ${nf(S.mp)} milionů pixelů je ${fS(raw)} dat.`,`A colour picture is a grid of pixels. Each pixel has three numbers 0 to 255: red, green and blue. ${nf(S.mp)} million pixels make ${fS(raw)} of data.`)},
 {n:[tx('Jas a barva','Luma and'),'YCbCr'],lossy:0,B:raw,g:'ycc',note:tx('přeskupení, jen zaokrouhlení','rearranged, only rounding'),
  d:tx('Barvy se přepočítají na jas Y a dvě barevné složky Cb a Cr. Oko vnímá hlavně jas, a proto se barvy mohou v dalším kroku zhrubit. Samotný převod je vratný, jen se zaokrouhluje na celá čísla (chyba nejvýš o jednu úroveň), což není vidět.','Colours are converted to luma Y and two chroma components Cb and Cr. The eye sees mostly luma, so colour can be coarsened in the next step. The conversion itself is reversible, it only rounds to integers (an error of at most one level), which is invisible.')},
 {n:[tx('Podvzorkování','Chroma'),tx('barev','subsampling')],lossy:1,B:raw*sv,g:'sub',note:sn,
  d:tx(`Barevné složky se uloží v nižším rozlišení (${sn}). Několik pixelů sdílí jednu barvu, jas zůstane celý. Data klesnou na ${nf(sv*100,0)} % a oko si téměř ničeho nevšimne. První ztráta.`,`The chroma components are stored at lower resolution (${sn}). Several pixels share one colour, luma stays complete. Data drops to ${nf(sv*100,0)} % and the eye hardly notices. The first loss.`)},
 {n:[tx('Bloky 8 × 8','8 × 8 blocks'),tx('a DCT','and DCT')],lossy:0,B:raw*sv,g:'dct',note:tx('stejný počet čísel','same count of numbers'),
  d:tx('Každá složka se rozdělí na bloky 8 × 8 pixelů. Kosinová transformace (DCT) z nich udělá 64 koeficientů: kolik pomalých a rychlých změn jasu blok obsahuje. Počet čísel se nemění a výpočet jde téměř vrátit.','Each component is split into 8 × 8 pixel blocks. The discrete cosine transform (DCT) turns each into 64 coefficients: how much slow and fast brightness change the block holds. The count of numbers is unchanged and the step is almost reversible.')},
 {n:[tx('Kvantování','Quantization')],lossy:1,B:raw*sv,g:'q',note:tx('většina čísel je nula','most numbers are zero'),
  d:tx('Koeficienty se vydělí hodnotami z tabulky a zaokrouhlí na celá čísla. Jemné detaily tím zmizí a z koeficientů zbudou samé nuly. Tady vzniká hlavní ztráta a tady působí posuvník kvality.','Coefficients are divided by values from a table and rounded to integers. Fine detail vanishes and the coefficients become mostly zeros. This is the main loss, and this is where the quality slider acts.')},
 {n:[tx('Kódování','Entropy'),tx('cik-cak, RLE','coding')],lossy:0,B:fin,g:'enc',note:tx('data se opravdu zmenší','data really shrinks'),
  d:tx(`Koeficienty se čtou cik-cak od pomalých změn k rychlým. Dlouhé řady nul se zapíší jako jedno číslo (RLE) a čísla dostanou Huffmanovy kódy: častá kratší, vzácná delší. Výsledek je ${fS(fin)}, tedy asi ${nf(raw/fin,0)}× menší.`,`Coefficients are read in zigzag from slow to fast changes. Long runs of zeros are written as one number (RLE) and numbers get Huffman codes: frequent ones short, rare ones long. The result is ${fS(fin)}, about ${nf(raw/fin,0)} times smaller.`)}];
}
let G1=[];
OUT.k1a=()=>fS(S.mp*3e6);
OUT.k1b=()=>`<span class="or">${fS(S.mp*1e6*bppQ(S.q,S.sub)/8)}</span>`;
OUT.k1c=()=>`1 : ${nf(24/bppQ(S.q,S.sub),0)}`;
OUT.k1b_s=()=>tx('Orientačně pro typickou fotografii. Skutečný soubor závisí na obsahu.','Approximate for a typical photograph. A real file depends on content.');
OUT.k1c_s=()=>tx('Surových 24 bitů na pixel proti '+nf(bppQ(S.q,S.sub),2)+' bitu po JPEG.','Raw 24 bits per pixel against '+nf(bppQ(S.q,S.sub),2)+' bits after JPEG.');
OUT.d1=()=>{const s=stages()[S.st];return`<b class="l">${tx('Krok','Step')} ${S.st+1}: ${s.n.join(' ')} · ${s.lossy?tx('ztrátový','lossy'):tx('bez ztráty','lossless')}</b>${s.d}`};
OUT.mpc=()=>MPS.map(v=>`<button class="chip${S.mp===v?' on':''}" data-k="mp" data-v="${v}">${v} MP</button>`).join('');
TABS.push({name:tx('Cesta obrazu','Image path'),side:'27rem',
 build(){return `<div class="split"><div class="col">
  <div class="scope grow"><canvas id="c1"></canvas>
   <div class="tag"><span><i class="b"></i>${tx('Bez ztráty','Lossless')}</span><span><i></i>${tx('Ztrátový krok','Lossy step')}</span></div>
   <div class="badge">${tx('velikost dat po každém kroku · klepni na krok','data size after each step · tap a step')}</div></div>
  <div class="kpis">
   <div class="card kpi"><span class="lbl">${tx('Surový obraz','Raw picture')}</span><div class="big" data-o="k1a"></div><small>${tx('Počet pixelů × 3 bajty.','Pixels × 3 bytes.')}</small></div>
   <div class="card kpi"><span class="lbl">${tx('Soubor JPEG','JPEG file')}</span><div class="big" data-o="k1b"></div><small data-o="k1b_s"></small></div>
   <div class="card kpi"><span class="lbl">${tx('Komprese','Compression')}</span><div class="big" data-o="k1c"></div><small data-o="k1c_s"></small></div>
  </div></div>
  <div class="side card">
   <div class="ctl"><div class="hd"><span class="lbl">${tx('Rozlišení snímku','Picture size')}</span></div><div class="chips g4" data-o="mpc"></div></div>
   ${qSel('q')}
   ${subSel('sub')}
   <div class="callout" data-o="d1"></div>
  </div></div>`},
 init(){const cv=$('#c1');cv.addEventListener('pointerdown',e=>{const p=ptr(e,cv);G1.forEach((r,i)=>{if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h)set('st',i)})})},
 render(){
  const cv=$('#c1');if(!cv)return;const {x,w,h,R}=setup(cv);
  const st=stages(),n=st.length,pad=R*1.1,gap=R*.9,cw=(w-2*pad-(n-1)*gap)/n,top=R*2.4,bot=h-R*1.2,raw=st[0].B;
  G1=[];
  st.forEach((s,i)=>{
   const x0=pad+i*(cw+gap),sel=S.st===i;
   x.fillStyle=sel?'rgba(255,151,46,.13)':'rgba(244,241,234,.05)';x.beginPath();x.roundRect(x0,top,cw,bot-top,R*.8);x.fill();
   if(sel){x.strokeStyle=C.orange;x.lineWidth=2;x.stroke()}
   G1.push({x:x0,y:top,w:cw,h:bot-top});
   dot(x,x0+R*1.2,top+R*1.3,R*.8,sel?C.orange:C.line2);TH(x,String(i+1),x0+R*1.2,top+R*1.35,R*.85,sel?'#17140F':C.cream,'center');
   const tg=s.lossy?tx('ztrátově','lossy'):tx('bez ztráty','lossless');
   x.font=`700 ${R*.62*PZ}px Montserrat,sans-serif`;const tw=x.measureText(tg.toUpperCase()).width+R*.9;
   x.fillStyle=s.lossy?C.orange:'rgba(110,168,224,.35)';x.beginPath();x.roundRect(x0+cw-tw-R*.5,top+R*.7,tw,R*1.2,R*.6);x.fill();
   TH(x,tg.toUpperCase(),x0+cw-tw/2-R*.5,top+R*1.33,R*.62,s.lossy?'#17140F':C.cream,'center');
   s.n.forEach((l,j)=>TH(x,l,x0+R*.8,top+R*3.5+j*R*1.15,R*(i===3||i===5?.9:.98),C.cream));
   glyph(x,s.g,x0+cw/2,top+R*7.2,R,cw);
   // sloupec dat
   const by0=top+R*10.9,bh=bot-by0-R*2.6,fr=Math.max(.012,s.B/raw),hh=Math.max(3,bh*fr);
   line(x,x0+R*.8,by0+bh,x0+cw-R*.8,by0+bh,GR2,1);
   x.fillStyle=i===n-1?C.orange:s.lossy?C.analog:C.blue;x.beginPath();x.roundRect(x0+cw*.25,by0+bh-hh,cw*.5,hh,R*.3);x.fill();
   TH(x,fS(s.B),x0+cw/2,by0+bh-hh-R*.8,R*1.0,i===n-1?C.orange:C.cream,'center');
   if(i>0&&i<n-1&&Math.abs(s.B-st[i-1].B)<1)T(x,'= '+nf(st[i-1].B/raw*100,0)+' %',x0+cw/2,by0+bh-hh-R*2.1,R*.66,TXT,'center');
   const nt=s.note.split(' ');let l1='',l2='';nt.forEach(wd=>{if((l1+' '+wd).length<=17&&!l2)l1+=(l1?' ':'')+wd;else l2+=(l2?' ':'')+wd});
   T(x,l1,x0+cw/2,bot-R*1.45,R*.62,TXT,'center');if(l2)T(x,l2,x0+cw/2,bot-R*.7,R*.62,TXT,'center');
   if(i<n-1)TH(x,'›',x0+cw+gap/2,top+(bot-top)/2,R*1.4,C.line2,'center');
  });
 }});
function glyph(x,g,cx,cy,R,cw){
 const sq=(px,py,s,col,t,tc)=>{x.fillStyle=col;x.beginPath();x.roundRect(px,py,s,s,R*.25);x.fill();if(t)TH(x,t,px+s/2,py+s/2+R*.05,R*.6,tc||'#17140F','center')};
 const s=R*1.9;
 if(g==='rgb'){[['#e4423a','R'],['#4fae5a','G'],['#4a7fd6','B']].forEach((k,i)=>sq(cx-s*1.65+i*(s*1.15),cy-s/2,s,k[0],k[1],'#fff'))}
 if(g==='ycc'){[['#c9c4b8','Y'],['#6ea8e0','Cb'],['#e08a6e','Cr']].forEach((k,i)=>sq(cx-s*1.65+i*(s*1.15),cy-s/2,s,k[0],k[1]))}
 if(g==='sub'){for(let j=0;j<2;j++)for(let i=0;i<2;i++){x.fillStyle=C.analog;x.beginPath();x.arc(cx-R*2.4+i*R*1.2,cy-R*.6+j*R*1.2,R*.38,0,TAU);x.fill()}TH(x,'→',cx,cy,R*1.1,C.cream,'center');x.fillStyle=C.blue;x.beginPath();x.arc(cx+R*2.2,cy,R*.9,0,TAU);x.fill()}
 if(g==='dct'){const c=R*.5,ox=cx-c*4,oy=cy-c*4;for(let j=0;j<8;j++)for(let i=0;i<8;i++){const a=.15+.85*Math.exp(-(i+j)/3);x.fillStyle=`rgba(255,151,46,${a})`;x.fillRect(ox+i*c,oy+j*c,c-1,c-1)}}
 if(g==='q'){TH(x,'48 ÷ 16 → 3',cx,cy-R*1.1,R*.85,C.cream,'center');TH(x,'5 ÷ 24 → 0',cx,cy,R*.85,C.orange,'center');TH(x,'2 ÷ 40 → 0',cx,cy+R*1.1,R*.85,C.orange,'center')}
 if(g==='enc'){TH(x,'0 0 0 0 0 5',cx,cy-R*.8,R*.85,C.cream,'center');TH(x,'↓',cx,cy+R*.1,R*.85,C.orange,'center');TH(x,'(5×0, 5)',cx,cy+R*1.1,R*.85,C.orange,'center')}
}
})();
</script>
<script>
/* ===== 2 Barvy ===== */
(function(){
let K='',RR=null;
function comp(){
 const im=img(S.img),k=S.img+'|'+S.sub+'|'+im.w+'|'+im.h+'|'+IMV;if(k===K)return RR;K=k;
 const sb=SUB[S.sub],P=toPlanes(im),w=im.w,h=im.h,n=w*h;
 const cb=shrink(P.Cb,w,h,sb.fx,sb.fy),cr=shrink(P.Cr,w,h,sb.fx,sb.fy),Cb2=grow(cb,w,h,sb.fx,sb.fy),Cr2=grow(cr,w,h,sb.fx,sb.fy);
 const yD=new Uint8ClampedArray(n*4),cbD=new Uint8ClampedArray(n*4),crD=new Uint8ClampedArray(n*4),rec=new Uint8ClampedArray(n*4);
 const put=(o,j,y,b,r)=>{b-=128;r-=128;o[j]=y+1.402*r;o[j+1]=y-.344136*b-.714136*r;o[j+2]=y+1.772*b;o[j+3]=255};
 for(let i=0,j=0;i<n;i++,j+=4){
  const px=i%w,py=(i/w)|0,si=((py/sb.fy)|0)*cb.w+((px/sb.fx)|0);
  yD[j]=yD[j+1]=yD[j+2]=P.Y[i];yD[j+3]=255;
  put(cbD,j,128,cb.p[si],128);put(crD,j,128,128,cr.p[si]);put(rec,j,P.Y[i],Cb2[i],Cr2[i]);
 }
 RR={im,yD,cbD,crD,rec,err:errImg(im.d,rec,5),psnr:psnrRGB(im.d,rec),cw:cb.w,ch:cb.h};return RR;
}
OUT.k2a=()=>`${nf(SUB[S.sub].v,1)}<u>${tx('hodnoty / pixel','values / pixel')}</u>`;
OUT.k2b=()=>`${nf(SUB[S.sub].v/3*100,0)} %`;
OUT.k2c=()=>{const r=comp();return`<span class="or">${d1(r.psnr)}</span><u>dB</u>`};
OUT.k2b_s=()=>tx('Podíl surových dat proti 4:4:4. Jas zůstává celý, ubývají jen barvy.','Share of raw data against 4:4:4. Luma stays complete, only colour is reduced.');
OUT.k2c_s=()=>tx('Shoda s originálem jen po podvzorkování, bez DCT a kvantování.','Match with the original after subsampling only, without DCT and quantization.');
OUT.d2=()=>{
 const t={foto:tx('Na fotografii je rozdíl téměř neviditelný: přírodní barvy se mění pomalu.','On a photograph the difference is almost invisible: natural colours change slowly.'),
  text:tx('Černobílý text nemá barvu, a proto podvzorkování vůbec nevadí.','Black and white text has no colour, so subsampling does no harm.'),
  barvy:tx('Na ostrých barevných hranách se barva rozlévá do okolí. V chybové mapě vznikají barevné lemy.','On sharp colour edges the colour bleeds into the neighbourhood. The error map shows coloured fringes.'),
  prechod:tx('Plynulé přechody barev snesou podvzorkování bez potíží.','Smooth colour gradients tolerate subsampling well.'),
  vlastni:tx('Zkus hledat ostré barevné hrany, třeba červený nápis na modrém. Tam je chyba největší.','Look for sharp colour edges, such as red lettering on blue. That is where the error is largest.')};
 return`<b class="l">${tx('Co je vidět','What to look for')}</b>`+(S.sub==='s444'?tx('Beze změny: každý pixel má vlastní barvu. Žádná úspora, žádná chyba.','No change: every pixel has its own colour. No saving, no error.'):t[S.img]||t.foto)};
function six(cv,items,im){
 const {x,w,h,R}=setup(cv);const W=im.w,H=im.h,gap=R*1.2,padX=R*1.2,labH=R*2.4;
 let pw=(w-2*padX-2*gap)/3,ph=pw*H/W;const mh=(h-2*labH-R*.4)/2;if(ph>mh){ph=mh;pw=ph*W/H}
 const x0=(w-3*pw-2*gap)/2,y0=(h-(2*(labH+ph)+R*.4))/2+labH;
 x.imageSmoothingEnabled=false;
 items.forEach((it,i)=>{const cx=x0+(i%3)*(pw+gap),cy=y0+((i/3)|0)*(ph+labH+R*.4);
  x.drawImage(putCv(it.d,W,H),cx,cy,pw,ph);x.strokeStyle=C.line2;x.lineWidth=1;x.strokeRect(cx,cy,pw,ph);
  TH(x,it.l,cx,cy-R*1.5,R*.95,it.c||C.cream);T(x,it.s,cx,cy-R*.55,R*.7,TXT)});
}
OUT.h2=()=>{const L=tx('Jak to funguje','How it works'),n=SUB[S.sub].n;
 const t={s444:tx('Zápis 4:4:4 znamená: na každý pixel připadá jas i obě barvy, Cb a Cr. Nic se nezhrubuje, ale také se nic neušetří: na pixel jsou tři hodnoty, tedy 100 % surových dat.','The notation 4:4:4 means: every pixel has its luma and both colours, Cb and Cr. Nothing is coarsened, but nothing is saved either: three values per pixel, that is 100 % of the raw data.'),
  s422:tx('Zápis 4:2:2 znamená: na čtyři pixely jas čtyřikrát, ale barvu Cb a Cr jen dvakrát. Dva sousední pixely ve vodorovném směru sdílejí jednu barvu, svisle se rozlišení zachovává. Na pixel jsou dvě hodnoty, tedy asi dvě třetiny dat.','The notation 4:2:2 means: for four pixels luma four times, but colour Cb and Cr only twice. Two horizontal neighbours share one colour, vertically the resolution is kept. That is two values per pixel, about two thirds of the data.'),
  s420:tx('Zápis 4:2:0 znamená: na čtyři pixely jas čtyřikrát, barvu Cb a Cr jen jednou. Čtveřice pixelů 2 × 2 sdílí jednu barvu. Oko je na jas mnohem citlivější než na barvu, proto se tak ušetří polovina dat.','The notation 4:2:0 means: for four pixels luma four times, colour Cb and Cr only once. A 2 × 2 group of pixels shares one colour. The eye is far more sensitive to luma than to colour, so this saves half of the data.')}[S.sub];
 return `<b class="l">${L} · ${n}</b>${t}`};
function subDiagram(sb){
 const cv=$('#c2s');if(!cv)return;const {x,w,h,R}=setup(cv);
 const N=16/(sb.fx*sb.fy),vals=16+2*N;
 TH(x,tx('4 × 4 pixely: co se uloží','4 × 4 pixels: what is stored'),R*.9,R*1.2,R*.8,TXT);
 const top=R*2.3,cell=Math.min((h-top-R*.9)/4,(w-R*2)*.5/4),gx=R*.9,gy=top;
 for(let j=0;j<4;j++)for(let i=0;i<4;i++){
  x.strokeStyle=GR2;x.lineWidth=1;x.strokeRect(gx+i*cell,gy+j*cell,cell,cell);
  const m=cell*.39;x.fillStyle=C.cream;x.fillRect(gx+i*cell+m,gy+j*cell+m,cell*.22,cell*.22)}
 for(let j=0;j<4;j+=sb.fy)for(let i=0;i<4;i+=sb.fx){
  const px=gx+i*cell+cell*.05,py=gy+j*cell+cell*.05,pw=cell*sb.fx-cell*.1,ph=cell*sb.fy-cell*.1;
  x.fillStyle='rgba(255,138,26,.16)';x.strokeStyle=C.orange;x.lineWidth=2;
  x.beginPath();x.roundRect(px,py,pw,ph,cell*.1);x.fill();x.stroke();
  x.beginPath();x.strokeStyle=C.orange;x.lineWidth=2;x.arc(gx+(i+sb.fx/2)*cell,gy+(j+sb.fy/2)*cell,cell*.2,0,TAU);x.stroke()}
 const lx=gx+cell*4+R*1.2,sq=R*.7,fs=R*.8;let ly=gy+cell*.4;
 x.fillStyle=C.cream;x.fillRect(lx,ly-sq/2,sq,sq);
 T(x,tx('jas Y','luma Y'),lx+sq+R*.5,ly,fs,C.cream);
 T(x,tx('16 hodnot, každý pixel svou','16 values, one per pixel'),lx,ly+R*1.3,fs*.9,TXT);
 ly+=cell*1.25;x.beginPath();x.strokeStyle=C.orange;x.lineWidth=2;x.arc(lx+sq/2,ly,sq/2,0,TAU);x.stroke();
 T(x,'Cb + Cr',lx+sq+R*.5,ly,fs,C.orange);
 T(x,tx(N+' vzorků × 2 = '+(2*N)+' hodnot',N+' samples × 2 = '+(2*N)+' values'),lx,ly+R*1.3,fs*.9,TXT);
 ly+=cell*1.25;

<script>

const PRE={
 hladka:(x,y)=>126+x*.6+y*.4+(((x*7+y*13)%5)-2),
 prechod:(x,y)=>40+(x+y)*12.5,
 hrana:(x,y)=>x<3?58:x>4?206:132,
 pruhy:(x,y)=>((x>>1)&1)?205:55,
 sum:(x,y)=>40+((((x+1)*73856093)^((y+1)*19349663))>>>0)%181};
function getBlock(){
 const o=new Float32Array(64);
 if(S.blk==='img'){const im=img(S.img),bx=clamp(S.bx,0,(im.w>>3)-1),by=clamp(S.by,0,(im.h>>3)-1);
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){const j=((by*8+y)*im.w+bx*8+x)*4;o[y*8+x]=Math.round(.299*im.d[j]+.587*im.d[j+1]+.114*im.d[j+2])}return o}
 const f=PRE[S.blk]||PRE.hrana;for(let y=0;y<8;y++)for(let x=0;x<8;x++)o[y*8+x]=clamp(Math.round(f(x,y)),0,255);return o;
}
function blockCoefs(b){const s=new Float32Array(64),c=new Float32Array(64);for(let i=0;i<64;i++)s[i]=b[i]-128;fdct(s,c);return c}
function blockBack(c){const o=new Float32Array(64);idct(c,o);for(let i=0;i<64;i++)o[i]=clamp(Math.round(o[i]+128),0,255);return o}
const qtab=(which)=>scaleQ(which==='c'?QC:QL,S.q);
function quantBlock(co,qt){const q=new Int16Array(64);for(let i=0;i<64;i++)q[i]=rnd0(co[i]/qt[i]);return q}
const gray=v=>{v=clamp(Math.round(v),0,255);return`rgb(${v},${v},${v})`};
const cofC=(v,m)=>{const a=Math.min(1,Math.sqrt(Math.abs(v)/Math.max(m,1)));return v>=0?`rgba(255,151,46,${(.1+.8*a).toFixed(2)})`:`rgba(110,168,224,${(.1+.8*a).toFixed(2)})`};
function mat(x,ox,oy,c,R,fn){
 for(let j=0;j<8;j++)for(let i=0;i<8;i++){const o=fn(i,j);x.fillStyle=o[0];x.fillRect(ox+i*c,oy+j*c,c-1,c-1);if(o[1]!=null&&c>=R*1.6)T(x,String(o[1]),ox+i*c+c/2,oy+j*c+c/2,R*.74,o[2]||C.cream,'center')}

function lumaCv(im){let c=LUM.get(im);if(!c){const d=new Uint8ClampedArray(im.w*im.h*4);for(let i=0;i<im.w*im.h;i++){const v=.299*im.d[i*4]+.587*im.d[i*4+1]+.114*im.d[i*4+2];d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255}c=putCv(d,im.w,im.h);LUM.set(im,c)}return c}

 x.imageSmoothingEnabled=false;x.drawImage(lumaCv(im),ox,oy,im.w*s,im.h*s);

const BAS=[];

 for(let k=1;k<64;k++){const v=q[ZZ[k]];if(!v){r++;continue}while(r>15){ac.push({k,run:15,s:0,v:0,l:acLen(15,0),zrl:1});r-=16}const s=cat(v);ac.push({k,run:r,s,v,l:acLen(r,s)});r=0}

 let bits=dc.l+dc.s;ac.forEach(a=>bits+=a.l+a.s);if(eob)bits+=4;
 let nz=0;for(let k=1;k<64;k++)if(q[k])nz++;
 return{q,dc,ac,eob,bits,nz};
}

<script>

const GC={};
const regionDims=im=>[32,Math.max(8,Math.round(32*im.h/im.w))];
function compView(id,A,B,E,labs,rk=''){
 const cv=$('#'+id);if(!cv)return;const {x,w,h,R}=setup(cv),W=A.w,H=A.h,[rw,rh]=regionDims(A);
 const KX='rx'+rk,KY='ry'+rk;S[KX]=clamp(S[KX],0,W-rw);S[KY]=clamp(S[KY],0,H-rh);const RX=S[KX],RY=S[KY];
 const gap=R*1.2,padX=R*1.2,labH=R*2.4;
 let pw=(w-2*padX-2*gap)/3,ph=pw*H/W;const mh=(h-2*labH-R*.6)/2;if(ph>mh){ph=mh;pw=ph*W/H}
 const zs=pw/rw,zh=rh*zs,x0=(w-3*pw-2*gap)/2,y0=(h-(2*labH+ph+zh+R*.6))/2+labH,y1=y0+ph+labH+R*.6,s=pw/W;
 const cs=[putCv(A.d,W,H),putCv(B.d,W,H),putCv(E,W,H)];
 x.imageSmoothingEnabled=false;
 cs.forEach((c,i)=>{const px=x0+i*(pw+gap);
  x.drawImage(c,px,y0,pw,ph);x.strokeStyle=C.line2;x.lineWidth=1;x.strokeRect(px,y0,pw,ph);
  x.strokeStyle=C.orange;x.lineWidth=2;x.strokeRect(px+RX*s,y0+RY*s,rw*s,rh*s);
  TH(x,labs[i].l,px,y0-R*1.5,R*.95,labs[i].c||C.cream);T(x,labs[i].s,px,y0-R*.55,R*.7,TXT);
  x.drawImage(c,RX,RY,rw,rh,px,y1,pw,zh);x.strokeStyle=C.line2;x.lineWidth=1;x.strokeRect(px,y1,pw,zh);
  if(S.grid){x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=1;x.beginPath();
   for(let gx=Math.ceil(RX/8)*8;gx<RX+rw;gx+=8){const X=px+(gx-RX)*zs;x.moveTo(X,y1);x.lineTo(X,y1+zh)}
   for(let gy=Math.ceil(RY/8)*8;gy<RY+rh;gy+=8){const Y=y1+(gy-RY)*zs;x.moveTo(px,Y);x.lineTo(px+pw,Y)}x.stroke()}
  T(x,labs[i].z,px,y1-R*.6,R*.7,TXT)});
 GC[id]={x0,y0,pw,ph,gap,W,H,rw,rh,R,KX,KY};
}
function lensInit(id){
 const cv=$('#'+id);let ok=false;
 drag(cv,(p,e)=>{const g=GC[id];if(!g)return;
  if(e.type==='pointerdown')ok=p.x>=g.x0&&p.y>=g.y0&&p.y<=g.y0+g.ph+g.R;
  if(!ok)return;
  const i=clamp(Math.floor((p.x-g.x0)/(g.pw+g.gap)),0,2),s=g.pw/g.W,px=g.x0+i*(g.pw+g.gap);
  const nx=clamp(Math.round((p.x-px)/s-g.rw/2),0,g.W-g.rw),ny=clamp(Math.round((p.y-g.y0)/s-g.rh/2),0,g.H-g.rh);
  if(nx!==S[g.KX]||ny!==S[g.KY]){S[g.KX]=nx;S[g.KY]=ny;refresh()}});
}

  d:tx('Bezeztrátový. Skvělý na text, loga a snímky obrazovky. Fotografie vyjdou velké, protože šum se bezeztrátově stlačit nedá.','Lossless. Great for text, logos and screenshots. Photographs come out large because noise cannot be compressed losslessly.')},
 {id:'jpg',n:'JPEG',yr:1992,ls:true,bpp:()=>bppQ(S.q,S.sub),tf:tx('DCT 8 × 8','DCT 8 × 8'),sup:tx('všude','everywhere'),
  d:tx('Standard fotografie. Podporuje ho každé zařízení a program. Tento formát jsi právě zkoumal.','The standard for photographs. Every device and program supports it. This is the format you have just explored.')},
 {id:'jpp',n:tx('JPEG progresivní','JPEG progressive'),yr:1992,ls:true,bpp:()=>bppQ(S.q,S.sub)*.93,tf:tx('DCT, jiné pořadí zápisu','DCT, different write order'),sup:tx('všude','everywhere'),
  d:tx('Stejné koeficienty, jen v jiném pořadí: nejdřív hrubý obraz, pak detaily. Soubor je o několik procent menší a na webu se zobrazí postupně.','The same coefficients in a different order: first a rough picture, then details. The file is a few percent smaller and shows progressively on the web.')},
 {id:'webp',n:'WebP',yr:2010,ls:true,bpp:()=>bppQ(S.q,S.sub)*.75,tf:tx('predikce + DCT (VP8)','prediction + DCT (VP8)'),sup:tx('prohlížeče, aplikace','browsers, apps'),
  d:tx('Odhadovaný pixel se předpoví ze sousedů a kóduje se jen rozdíl. Soubor bývá asi o čtvrtinu menší než JPEG.','A pixel is predicted from its neighbours and only the difference is coded. The file is typically about a quarter smaller than JPEG.')},
 {id:'heic',n:'HEIC',yr:2015,ls:true,bpp:()=>bppQ(S.q,S.sub)*.55,tf:tx('HEVC, bloky do 64 × 64','HEVC, blocks up to 64 × 64'),sup:tx('telefony, systémy','phones, systems'),
  d:tx('Snímek kódovaný videokodekem HEVC v kontejneru HEIF. Výchozí formát fotek v mnoha telefonech, ale patentově zatížený.','A picture coded by the HEVC video codec in a HEIF container. The default photo format on many phones, but burdened by patents.')},
 {id:'avif',n:'AVIF',yr:2019,ls:true,bpp:()=>bppQ(S.q,S.sub)*.5,tf:tx('AV1, bloky do 128 × 128','AV1, blocks up to 128 × 128'),sup:tx('prohlížeče, aplikace','browsers, apps'),
  d:tx('Snímek z videokodeku AV1, bez licenčních poplatků. Soubor bývá asi poloviční proti JPEG. Kódování je pomalé.','A picture from the AV1 video codec, with no licence fees. The file is typically about half of a JPEG. Encoding is slow.')},
 {id:'jxl',n:'JPEG XL',yr:2021,ls:true,bpp:()=>bppQ(S.q,S.sub)*.62,tf:tx('větší transformace','larger transforms'),sup:tx('různě podle prohlížeče','varies by browser'),
  d:tx('Nástupce JPEG bez patentů. Umí bezeztrátově překódovat staré JPEG a ušetřit asi pětinu. Podpora v prohlížečích se zatím liší.','A successor to JPEG without patents. It can losslessly recode old JPEGs and save about a fifth. Browser support still varies.')}];
const px8=()=>S.mp*1e6,sz=f=>px8()*f.bpp()/8,cur=()=>FM.find(f=>f.id===S.fmt)||FM[2];
let G8=null;
OUT.mpc8=()=>MPS.map(v=>`<button class="chip${S.mp===v?' on':''}" data-k="mp" data-v="${v}">${v} MP</button>`).join('');
OUT.k8a=()=>`<span class="or">${fS(sz(FM[2]))}</span>`;
OUT.k8b=()=>nf(Math.floor(64e9/sz(FM[2])),0);
OUT.k8c=()=>nf(Math.floor(25e6/sz(FM[2])),0);
OUT.d8=()=>{const f=cur();return`<b class="l">${f.n} · ${f.yr}</b>${f.d}<div class="rd" style="margin-top:.5rem"><span>${tx('Ztráta','Loss')}</span><b>${f.ls?tx('ztrátový','lossy'):tx('bez ztráty','lossless')}</b><span>${tx('Princip','Principle')}</span><b>${f.tf}</b><span>${tx('Podpora','Support')}</span><b>${f.sup}</b><span>${nf(S.mp)} MP</span><b class="hot">${fS(sz(f))}</b></div>`};
TABS.push({name:tx('Praxe','Practice'),side:'27rem',
 build(){return `<div class="split"><div class="col">
  <div class="scope grow"><canvas id="c8"></canvas>
   <div class="badge">${tx('stejný snímek v různých formátech · logaritmická osa','the same picture in various formats · log axis')}</div></div>
  <div class="kpis">
   <div class="card kpi"><span class="lbl">${tx('Fotka v JPEG','Photo as JPEG')}</span><div class="big" data-o="k8a"></div><small>${tx('Orientačně podle kvality a velikosti snímku.','Approximate for the chosen quality and picture size.')}</small></div>
   <div class="card kpi"><span class="lbl">${tx('Na kartu 64 GB','On a 64 GB card')}</span><div class="big" data-o="k8b"></div><small>${tx('fotografií', 'photographs')}</small></div>
   <div class="card kpi"><span class="lbl">${tx('Do e-mailu 25 MB','In a 25 MB e-mail')}</span><div class="big" data-o="k8c"></div><small>${tx('fotografií', 'photographs')}</small></div>
  </div></div>
  <div class="side card">
   <div class="ctl"><div class="hd"><span class="lbl">${tx('Rozlišení snímku','Picture size')}</span></div><div class="chips g4" data-o="mpc8"></div></div>
   ${qSel('q')}
   <div class="callout" data-o="d8"></div>
   <div class="callout" style="margin-top:auto"><b class="l">${tx('Pozor','Note')}</b>${tx('Poměry formátů jsou orientační pro stejný vizuální dojem. Skutečné soubory závisí na obsahu a kodéru.','Format ratios are approximate for the same visual quality. Real files depend on content and encoder.')}</div>
  </div></div>`},
 init(){const cv=$('#c8');cv.addEventListener('pointerdown',e=>{const p=ptr(e,cv);if(!G8)return;const i=Math.floor((p.y-G8.top)/G8.rowH);if(i>=0&&i<FM.length)set('fmt',FM[i].id)})},
 render(){
  const cv=$('#c8');if(!cv)return;const {x,w,h,R}=setup(cv);
  const A=1e5,B=3e8,x0=R*13,x1=w-R*7.5,X=b=>lg(b,A,B,x0,x1);
  const top=R*3.2,axisY=h-R*2.4,rowH=(axisY-top)/FM.length;G8={top,rowH};
  [[1e5,'100 kB'],[1e6,'1 MB'],[1e7,'10 MB'],[1e8,'100 MB']].forEach(([b,l])=>{const p=X(b);line(x,p,top-R*.4,p,axisY,GR2,1);T(x,l,p,axisY+R*.95,R*.72,TXT,'center')});
  [3e5,3e6,3e7].forEach(b=>line(x,X(b),top-R*.4,X(b),axisY,GR,1));
  line(x,x0,axisY,x1,axisY,GR2,1.2);
  const jb=sz(FM[2]);
  FM.forEach((f,i)=>{
   const y=top+i*rowH,cy=y+rowH/2,bh=Math.min(rowH*.6,R*2.2),sel=S.fmt===f.id,b=sz(f),xb=X(b);
   if(sel){x.fillStyle='rgba(255,151,46,.13)';x.fillRect(R*.6,y+rowH*.04,w-R*1.2,rowH*.92)}
   TH(x,f.n,R*1.2,cy-R*.4,R*.98,sel?C.orange:C.cream);T(x,f.yr+' · '+(f.ls?tx('ztrátový','lossy'):tx('bez ztráty','lossless')),R*1.2,cy+R*.7,R*.66,TXT);
   x.fillStyle=sel?C.orange:f.ls?C.blue:C.analog;x.beginPath();x.roundRect(x0,cy-bh/2,Math.max(3,xb-x0),bh,bh*.28);x.fill();
   TH(x,fS(b),xb+R*.7,cy,R*.95,sel?C.orange:C.cream);
   if(f.ls&&f.id!=='jpg')TH(x,nf(b/jb*100,0)+' %',w-R*1.2,cy,R*.9,TXT,'right');
  });
  TH(x,tx('proti JPEG','vs JPEG'),w-R*1.2,top-R*.9,R*.75,TXT,'right');
 }});
})();
</script>
