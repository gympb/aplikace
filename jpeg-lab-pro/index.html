<script>
/* ===== Nápověda ke kapitolám ===== */
(function(){
const H=[
{t:tx('Cesta obrazu','Image path'),
 a:tx('Fotografie je v paměti jen mřížka <b>pixelů</b>, u každého tři čísla 0 až 255 (červená, zelená, modrá). Obraz 12 Mpx (4000 × 3000) tak zabere 12 000 000 × 3 B = <b>36 MB</b>. JPEG ho zmenší zhruba na desetinu až dvacetinu tím, že vyhodí to, co oko skoro nevidí.','A photo in memory is just a grid of <b>pixels</b>, each with three numbers 0 to 255 (red, green, blue). A 12 Mpx image (4000 × 3000) therefore takes 12,000,000 × 3 B = <b>36 MB</b>. JPEG shrinks it roughly ten to twenty times by throwing away what the eye barely sees.'),
 b:tx('Postup má pět kroků: převod na jas a barvu (<b>YCbCr</b>), zhrubení barev (<b>podvzorkování</b>, první ztráta), rozdělení na bloky 8 × 8 a <b>DCT</b>, <b>kvantování</b> (hlavní ztráta, nejvíc informace se ztrácí tady) a bezeztrátové <b>kódování</b>. Dekodér běží pozpátku, ale ztracené se už nevrátí.','The pipeline has five steps: conversion to brightness and colour (<b>YCbCr</b>), coarsening the colour (<b>subsampling</b>, the first loss), splitting into 8 × 8 blocks and the <b>DCT</b>, <b>quantization</b> (the main loss, most information is lost here) and lossless <b>coding</b>. The decoder runs backwards, but what was lost does not come back.'),
 eh:tx("Proč JPEG vznikl a jak se s ním pracuje","Why JPEG exists and how it is used"),
 e:[tx("<b>Proč vůbec komprimovat.</b> Surová fotografie 12 Mpx zabere 36 MB. Na paměťovou kartu 64 GB by se jich vešlo jen asi 1 800, a odeslat jednu e-mailem by nešlo. JPEG ji zmenší obvykle na desetinu až dvacetinu při vzhledu, který je pro běžné použití dobrý. Bezeztrátová komprese to nedokáže: fotografie obsahuje jemný šum snímače, který se bezeztrátově stlačit nedá, a proto bezeztrátové formáty dosahují u fotek jen asi 1,5 : 1 až 2 : 1. JPEG vyhazuje právě tuto část, kterou oko stejně nevnímá.","<b>Why compress at all.</b> A raw 12 Mpx photo takes 36 MB. Only about 1,800 of them would fit on a 64 GB card, and sending one by e-mail would be impossible. JPEG usually shrinks it to a tenth or a twentieth with an appearance that is good for everyday use. Lossless compression cannot do that: a photograph contains fine sensor noise that cannot be compressed losslessly, so lossless formats reach only about 1.5 : 1 to 2 : 1 on photos. JPEG throws away exactly this part, which the eye does not notice anyway."),
 tx("<b>Odkud se vzal.</b> Název je jméno komise: <b>Joint Photographic Experts Group</b>, společná skupina organizací ISO a CCITT (dnes ITU-T), která vznikla v roce 1986. Norma vyšla v roce 1992 jako ITU-T T.81 a ISO/IEC 10918-1. Soubor s příponou .jpg má kolem dat ještě obal, nejčastěji <b>JFIF</b> (1992) nebo <b>Exif</b> (fotoaparáty a telefony, nese i datum, typ přístroje a někdy polohu). Přípony .jpg a .jpeg jsou totéž.","<b>Where it came from.</b> The name is the name of a committee: the <b>Joint Photographic Experts Group</b>, a joint body of ISO and CCITT (today ITU-T) formed in 1986. The standard was published in 1992 as ITU-T T.81 and ISO/IEC 10918-1. A file ending in .jpg also has a wrapper around the data, most often <b>JFIF</b> (1992) or <b>Exif</b> (cameras and phones; it also carries the date, the device and sometimes the location). The extensions .jpg and .jpeg are the same thing."),
 tx("<b>Proč právě těchto pět kroků.</b> Každý využívá jinou slabinu. Oddělení jasu od barvy a zhrubení barev využívá vlastnost zraku. DCT využívá to, že sousední pixely si jsou podobné. Kvantování zahodí detaily, které oko nepozná. Kódování využívá, že některé hodnoty jsou mnohem častější než jiné. Žádný krok nezná ostatní, takže se dají vylepšovat nezávisle. Ztrátové jsou dva kroky: zhrubení barev (podvzorkování) a hlavně kvantování. Ostatní kroky jdou vrátit, až na drobná zaokrouhlení na celá čísla.","<b>Why these five steps.</b> Each exploits a different weakness. Separating luma from colour and coarsening the colour exploits a property of vision. The DCT exploits the fact that neighbouring pixels are alike. Quantization drops detail the eye cannot see. Coding exploits the fact that some values are far more frequent than others. No step knows about the others, so they can be improved independently. Two steps are lossy: the coarsening of colour (subsampling) and, above all, quantization. The other steps can be reversed, apart from small rounding to integers."),
 tx("<b>Co norma určuje a co ne.</b> Standard přesně popisuje, jak se soubor čte, tedy dekodér. Jak se vyrábí, nechává kodéru: tabulky, způsob zaokrouhlování i volbu podvzorkování. Proto dva programy při „kvalitě 80“ vyrobí různé soubory a proto lze stejný obraz uložit menším souborem chytřejším kodérem (například mozjpeg), který se čte stejně jako každý jiný JPEG.","<b>What the standard fixes and what it does not.</b> The standard describes exactly how a file is read, that is the decoder. How it is produced is left to the encoder: tables, rounding and the choice of subsampling. That is why two programs produce different files at “quality 80”, and why the same picture can be stored in a smaller file by a smarter encoder (for example mozjpeg) that any viewer reads like any other JPEG.")],
 c:[tx('Klepej na jednotlivé kroky a sleduj, jak se mění velikost dat.','Tap the individual steps and watch how the data size changes.'),
    tx('Změň kvalitu a obrázek a porovnej, který krok ušetří nejvíc.','Change the quality and the picture and compare which step saves the most.'),
    tx('Posuň lupu na hranu nebo na hladkou plochu a porovnej s původním obrazem.','Move the lens over an edge or a smooth area and compare with the original.')],
 d:tx('Bezeztrátově se komprimuje jen kódování. Všechna velká úspora vzniká ztrátou, kterou vybíráme tak, aby ji oko nepoznalo.','Only the coding step is lossless. All the big saving comes from loss, chosen so the eye does not notice it.')},
{t:tx('Barvy','Colour'),
 a:tx('Oko má mnohem víc buněk pro jas než pro barvu, takže ostrost vnímáme hlavně z jasu. JPEG proto přepočte RGB na <b>Y</b> (jas) a dvě barevné složky <b>Cb</b> a <b>Cr</b> (rozdíl modré a červené proti jasu).','The eye has far more cells for brightness than for colour, so we perceive sharpness mainly from brightness. JPEG therefore converts RGB to <b>Y</b> (luma) and two chroma components <b>Cb</b> and <b>Cr</b> (blue and red differences from luma).'),
 b:tx('Barevné složky pak stačí ukládat s menším rozlišením. <b>4:4:4</b> nechává všechno, <b>4:2:2</b> půlí barvu vodorovně, <b>4:2:0</b> vodorovně i svisle (barva má čtvrtinu vzorků). Surová data tím klesnou na polovinu, a to téměř bez viditelné změny. Problémem jsou jen ostré barevné hrany, třeba červený text na modrém pozadí, kde barva „vytéká“.','The chroma components can then be stored at lower resolution. <b>4:4:4</b> keeps everything, <b>4:2:2</b> halves the colour horizontally, <b>4:2:0</b> both horizontally and vertically (colour has a quarter of the samples). Raw data drops to half with almost no visible change. The only trouble is sharp colour edges, such as red text on blue, where the colour bleeds.'),
 eh:tx("Proč se barva ukládá hrubě","Why colour is stored coarsely"),
 e:[tx("<b>Oko vidí jas ostřeji než barvu.</b> Na sítnici je asi 120 milionů tyčinek, které vnímají jen jas, a asi 6 milionů čípků pro barvu. Jemné detaily rozlišíme hlavně podle jasu. Změna, při které se mění jen barva a jas zůstává stejný, je pro oko mnohem hůř rozeznatelná. Obraz tedy působí ostře, pokud je ostrý jas, i když je barva rozmazaná.","<b>The eye sees luma sharper than colour.</b> The retina has about 120 million rods, which sense only brightness, and about 6 million cones for colour. We resolve fine detail mainly by brightness. A change in which only the colour varies and the brightness stays the same is much harder for the eye to resolve. An image therefore looks sharp when the luma is sharp, even if the colour is blurred."),
 tx("<b>Princip z televize.</b> Barevná televize (NTSC, USA, 1953) musela zůstat použitelná pro černobílé přijímače. Jas se proto vysílal jako dřív a barva se přidala jako doplňkový signál s mnohem užším pásmem: jas asi 4 MHz, barva jen zlomek z toho. Stejný trik převzal JPEG i video. Souřadnicím se říká <b>YCbCr</b> (Y je jas, Cb a Cr jsou barevné rozdíly modré a červené oproti jasu).","<b>A principle from television.</b> Colour television (NTSC, USA, 1953) had to remain usable on black-and-white sets. Luma was therefore broadcast as before and colour was added as a supplementary signal with a much narrower band: luma about 4 MHz, colour only a fraction of that. JPEG and video adopted the same trick. The coordinates are called <b>YCbCr</b> (Y is luma, Cb and Cr are the blue and red differences from luma)."),
 tx("<b>Vzorce.</b> JPEG (formát JFIF) používá váhy z normy BT.601: <b>Y = 0,299 R + 0,587 G + 0,114 B</b>, dále <b>Cb = 128 + 0,564 (B − Y)</b> a <b>Cr = 128 + 0,713 (R − Y)</b>. Zelená má největší váhu, protože oko je na ni nejcitlivější, modrá jen 11 %. Šedý pixel (R = G = B) má Cb = Cr = 128, tedy žádnou barvu. Proto jsou v panelech Cb a Cr šedé plochy vyplněné středně šedou a barva se projeví jen odchylkami od ní.","<b>The formulas.</b> JPEG (the JFIF format) uses the weights from BT.601: <b>Y = 0.299 R + 0.587 G + 0.114 B</b>, then <b>Cb = 128 + 0.564 (B − Y)</b> and <b>Cr = 128 + 0.713 (R − Y)</b>. Green has the largest weight because the eye is most sensitive to it, blue only 11 %. A grey pixel (R = G = B) has Cb = Cr = 128, that is no colour. That is why in the Cb and Cr panels grey areas are filled with mid-grey and colour shows only as deviations from it."),
 tx("<b>Co znamená zápis 4:2:0.</b> Je to popis pole širokého čtyři pixely a vysokého dva řádky. Druhé číslo říká, kolik vzorků barvy je v prvním řádku (2), třetí kolik v druhém řádku (0 znamená, že barvu druhého řádku sdílí první). Nula tedy neznamená „žádná barva“. Fotoaparáty a web používají nejčastěji 4:2:0, profesionální video 4:2:2, grafika a střih často 4:4:4. DVD, Blu-ray i většina streamování používá 4:2:0, starý formát DV pro NTSC 4:1:1.","<b>What the notation 4:2:0 means.</b> It describes a field four pixels wide and two rows high. The second number says how many colour samples are in the first row (2), the third how many in the second row (0 means the second row shares the colour of the first). The zero therefore does not mean “no colour”. Cameras and the web most often use 4:2:0, professional video 4:2:2, graphics and editing often 4:4:4. DVD, Blu-ray and most streaming use 4:2:0, the old DV format for NTSC 4:1:1."),
 tx("<b>Kdy to selže.</b> Problém dělají sytá barva na hraně s podobným jasem: červený text na modrém pozadí, tenké barevné čáry, grafika a snímky obrazovky. Barva se při zobrazení doplní interpolací (aplikace používá bilineární), takže hrana barevně „vytéká“. K tomu přistupuje drobnost: podvzorkování se dělá na hodnotách po gama kódování, nikoli na lineárním světle, takže hranice dvou sytých barev může být o něco tmavší, než by měla být. U přírodních fotografií se to téměř neprojeví.","<b>When it fails.</b> The trouble comes from saturated colour on an edge with similar luma: red text on blue, thin coloured lines, graphics and screenshots. The colour is filled in by interpolation when displayed (the app uses bilinear), so the edge bleeds. There is also a subtlety: subsampling is done on gamma-encoded values, not on linear light, so the border between two saturated colours can be a little darker than it should be. On natural photographs this hardly shows.")],
 c:[tx('Vyber obrázek s barevnými poli a sleduj, jak se mění shoda s originálem.','Pick the picture with colour patches and watch the match with the original change.'),
    tx('Přepni podvzorkování na 4:2:0 a zobraz obrázek s barevným textem.','Switch subsampling to 4:2:0 and show the image with coloured text.'),
    tx('Sleduj, kolik procent dat podvzorkování ušetří.','Watch what percentage of data subsampling saves.')],
 d:tx('Podvzorkování je nejlevnější úspora: polovina dat za cenu, kterou u fotek nepoznáš, u barevných hran ano.','Subsampling is the cheapest saving: half of the data at a cost you cannot see in photos but can on colour edges.')},
{t:tx('DCT','DCT'),
 a:tx('Obraz se rozdělí na bloky <b>8 × 8 pixelů</b>. Každý blok je 64 čísel jasu. <b>Diskrétní kosinová transformace</b> (DCT) je přepíše na 64 koeficientů: kolik je v bloku průměrného jasu (DC) a kolik jednotlivých vlnění s rostoucí hustotou (AC).','The image is split into <b>8 × 8 pixel</b> blocks. Each block is 64 brightness numbers. The <b>discrete cosine transform</b> (DCT) rewrites them as 64 coefficients: how much average brightness (DC) the block has and how much of each wave pattern of increasing density (AC).'),
 b:tx('Transformace sama nic neztrácí, jde o jiný zápis stejné informace. Výhoda je, že u běžných obrázků jsou většinou významné jen koeficienty vlevo nahoře (hrubé vzory), kdežto vpravo dole (jemné vzory) jsou blízko nuly. Hladký blok má skoro jen DC, blok s hranou potřebuje víc koeficientů. Bloky se zpracovávají samostatně, proto později vznikají viditelné čtverečky.','The transform itself loses nothing, it is a different notation for the same information. The advantage is that in typical images only the coefficients at top left (coarse patterns) are significant, while those at bottom right (fine patterns) are close to zero. A smooth block has almost only DC, a block with an edge needs more coefficients. Blocks are processed independently, which is why visible squares appear later.'),
 eh:tx("Odkud se DCT vzala a proč zrovna 8 × 8","Where the DCT comes from and why 8 × 8"),
 e:[tx("<b>Původ.</b> Diskrétní kosinovou transformaci popsali v roce 1974 Nasir Ahmed, T. Natarajan a K. R. Rao. Je příbuzná Fourierově transformaci, ale používá jen kosiny a reálná čísla. Je to jako by se blok zrcadlově prodloužil, takže na jeho okraji nevzniká skok a energie se soustředí do menšího počtu koeficientů než při Fourierově transformaci. U běžných obrazů se přibližuje optimu pro stlačení.","<b>Origin.</b> The discrete cosine transform was described in 1974 by Nasir Ahmed, T. Natarajan and K. R. Rao. It is related to the Fourier transform but uses only cosines and real numbers. It behaves as if the block were mirrored, so no jump appears at its edge and the energy concentrates in fewer coefficients than with the Fourier transform. On typical images it comes close to the optimum for compression."),
 tx("<b>Co koeficienty znamenají.</b> Existuje 64 základních vzorů, každý je součin vodorovné a svislé kosinovky. Koeficient říká, kolik toho vzoru v bloku je. Vzor vlevo nahoře je rovná plocha: koeficient <b>DC</b> je po odečtení 128 osminásobek průměrného jasu bloku (F(0,0) = 8 × průměr). Když jsou všechny pixely stejné, vyjde jen DC a ostatních 63 koeficientů je nulových. Čím dál doprava, tím jemnější svislé pruhy, čím dál dolů, tím jemnější vodorovné, a vpravo dole je šachovnice.","<b>What the coefficients mean.</b> There are 64 basis patterns, each a product of a horizontal and a vertical cosine. A coefficient says how much of that pattern is in the block. The pattern at top left is a flat area: the <b>DC</b> coefficient is, after subtracting 128, eight times the average brightness of the block (F(0,0) = 8 × average). When all pixels are equal, only DC results and the other 63 coefficients are zero. The further right, the finer the vertical stripes, the further down, the finer the horizontal ones, and bottom right is a checkerboard."),
 tx("<b>Proč 8 × 8.</b> Je to kompromis. Malý blok zachytí málo souvislostí, velký blok stlačí hladké plochy lépe, ale detail nebo hrana v jeho části zhorší celý blok a výpočet roste. Na počátku 90. let zvládl 8 × 8 tehdejší hardware i paměť. Novější kodeky (HEVC, AV1) používají bloky od 4 × 4 po 64 × 64, popřípadě 128 × 128, a velikost volí podle obsahu: velké na hladké plochy, malé na detail. JPEG 2000 bloky nemá a používá vlnku.","<b>Why 8 × 8.</b> It is a compromise. A small block captures few relationships; a large block compresses smooth areas better, but a detail or edge in part of it worsens the whole block and the computation grows. In the early 1990s 8 × 8 was what hardware and memory could handle. Newer codecs (HEVC, AV1) use blocks from 4 × 4 up to 64 × 64 or 128 × 128 and choose the size by content: large for smooth areas, small for detail. JPEG 2000 has no blocks and uses a wavelet."),
 tx("<b>Rychlost.</b> DCT je oddělitelná: nejdřív se počítá po řádcích, pak po sloupcích. Místo 4 096 násobení na blok stačí 1 024, a rychlé algoritmy (například AAN) potřebují jen asi 80. Díky tomu šel JPEG v 90. letech počítat i v levných přístrojích. DCT je matematicky vratná. V praxi se počítá s omezenou přesností, takže dva dekodéry se mohou lišit o jednu úroveň jasu, což je neviditelné.","<b>Speed.</b> The DCT is separable: first computed along rows, then along columns. Instead of 4,096 multiplications per block 1,024 are enough, and fast algorithms (for example AAN) need only about 80. This allowed JPEG to run on cheap devices in the 1990s. The DCT is mathematically reversible. In practice it is computed with limited precision, so two decoders can differ by one brightness level, which is invisible.")],
 c:[tx('Vyber různé bloky (nebe, hrana, text) a sleduj, kam se koeficienty soustředí.','Pick different blocks (sky, edge, text) and see where the coefficients concentrate.'),
    tx('Přepínej, kolik koeficientů se použije (jen DC, několik, všech 64), a sleduj chybu bloku.','Switch how many coefficients are used (DC only, a few, all 64) and watch the block error.'),
    tx('Klepni do obrázku na jiný blok a porovnej hladkou plochu s hranou.','Tap another block in the picture and compare a smooth area with an edge.')],
 d:tx('DCT nic nekomprimuje, ale seřadí informaci podle důležitosti, takže jde nepodstatnou část vyhodit.','DCT compresses nothing, but it sorts information by importance so the unimportant part can be dropped.')},
{t:tx('Kvantování','Quantization'),
 a:tx('Každý koeficient se vydělí číslem z <b>kvantizační tabulky</b> a zaokrouhlí na celé číslo. Tady vzniká ztráta: z 63,7 se stane 64 a z 0,4 nula. Dekodér pak vynásobí zpět a dostane jen přibližnou hodnotu.','Each coefficient is divided by a number from the <b>quantization table</b> and rounded to an integer. This is where the loss happens: 63.7 becomes 64 and 0.4 becomes zero. The decoder multiplies back and gets only an approximate value.'),
 b:tx('Tabulka má vpravo dole velká čísla (jemné detaily se ruší silně) a vlevo nahoře malá. Posuvník <b>kvality</b> tabulku násobí: nízká kvalita znamená velká čísla, hodně nul a malý soubor. Barevné složky mají vlastní, hrubší tabulku. Chyba se měří jako <b>PSNR</b> v decibelech: nad zhruba 40 dB je rozdíl těžko znatelný, pod zhruba 28 dB je zřejmý. Číslo kvality nemá přesný význam, každý program ho může počítat jinak.','The table has large numbers at bottom right (fine detail is suppressed strongly) and small at top left. The <b>quality</b> slider scales the table: low quality means large numbers, many zeros and a small file. The chroma components have their own, coarser table. Error is measured as <b>PSNR</b> in decibels: above roughly 40 dB the difference is hard to notice, below roughly 28 dB it is obvious. The quality number has no exact meaning, every program may compute it differently.'),
 eh:tx("Kvantizační tabulka a číslo kvality","The quantization table and the quality number"),
 e:[tx("<b>Odkud jsou tabulky.</b> Norma obsahuje v příloze K ukázkové tabulky, které vznikly pokusy s pozorovateli: hledal se pro každý ze 64 vzorů nejmenší krok, který lidé při běžném pohledu ještě nepoznají. Proto jsou vlevo nahoře malá čísla (16, 11, 10, …) a vpravo dole velká (až 99). Pro jas a pro barvu jsou dvě různé tabulky, barva smí být hrubší.","<b>Where the tables come from.</b> The standard contains sample tables in Annex K that came from experiments with observers: for each of the 64 patterns the smallest step that people still cannot notice at normal viewing was sought. That is why the numbers at top left are small (16, 11, 10, …) and at bottom right large (up to 99). Luma and colour have two different tables; colour may be coarser."),
 tx("<b>Co znamená číslo kvality.</b> Číslo 1 až 100 není součást formátu. Knihovna Independent JPEG Group (libjpeg) ho převádí na násobek základní tabulky: pro kvalitu pod 50 je měřítko 5 000 / q procent, od 50 je 200 − 2q procent. Při 50 se tabulka použije beze změny (dělitel DC je 16), při 10 je pětkrát hrubší (80), při 90 pětkrát jemnější (asi 3) a při 100 jsou všechny dělitele rovny 1. Jiné programy (telefon, Photoshop, mozjpeg) používají vlastní tabulky, takže stejné číslo neznamená stejnou kvalitu. Tabulky jsou uloženy v každém souboru (značka DQT), proto je dekodér vždy zná.","<b>What the quality number means.</b> The number 1 to 100 is not part of the format. The Independent JPEG Group library (libjpeg) converts it to a multiple of the base table: below 50 the scale is 5,000 / q percent, from 50 it is 200 − 2q percent. At 50 the table is used unchanged (the DC divisor is 16), at 10 it is five times coarser (80), at 90 five times finer (about 3) and at 100 all divisors equal 1. Other programs (phones, Photoshop, mozjpeg) use their own tables, so the same number does not mean the same quality. The tables are stored in every file (the DQT marker), so the decoder always knows them."),
 tx("<b>Jak velká je chyba.</b> Každý koeficient se zaokrouhlí na násobek dělitele, takže se zmýlí nejvýše o polovinu dělitele. Koeficienty menší než polovina dělitele se zaokrouhlí na nulu a zmizí, a právě proto kvantování vyrobí tolik nul a soubor tak zmenší. Ztracené se nevrátí. Chyba se měří jako <b>PSNR</b>: 10 · log₁₀(255² / MSE), kde MSE je střední kvadratická chyba, a vyšší je lepší. Každých 6 dB znamená dvakrát menší efektivní chybu. U běžných fotografií bývá 30 až 40 dB.","<b>How large the error is.</b> Each coefficient is rounded to a multiple of the divisor, so it is off by at most half the divisor. Coefficients smaller than half the divisor are rounded to zero and vanish, and that is exactly why quantization produces so many zeros and shrinks the file. What is lost does not come back. The error is measured as <b>PSNR</b>: 10 · log₁₀(255² / MSE), where MSE is the mean squared error, and higher is better. Every 6 dB means half the effective error. On ordinary photographs it is typically 30 to 40 dB."),
 tx("<b>Co PSNR neříká.</b> Číslo neodpovídá přesně vjemu: text s malou chybou může vypadat hůř než fotografie se stejným PSNR, protože chyba v ostré hraně nebo v hladké ploše je viditelnější než v textuře. Proto se používají i míry blíž zraku (SSIM, Butteraugli). Kodér také nemusí jen zaokrouhlovat: může koeficient u hranice zaokrouhlit dolů, pokud tím ušetří hodně bitů (tzv. trellis kvantování). Tím mozjpeg při stejném vzhledu vyrobí soubor asi o desetinu menší.","<b>What PSNR does not say.</b> The number does not match perception exactly: text with a small error can look worse than a photograph with the same PSNR, because an error in a sharp edge or a smooth area is more visible than in texture. That is why measures closer to vision are also used (SSIM, Butteraugli). An encoder does not have to simply round, either: it can round a coefficient down near the boundary if that saves many bits (so-called trellis quantization). This lets mozjpeg make a file about a tenth smaller at the same appearance.")],
 c:[tx('Posouvej kvalitu a sleduj, kolik koeficientů zůstane nenulových.','Move the quality and watch how many coefficients stay non-zero.'),
    tx('Přepni mezi tabulkou jasu a barev a porovnej dělitele.','Switch between the luma and chroma tables and compare the divisors.'),
    tx('Najdi kvalitu, při které se začnou objevovat čtverečky (mřížku zapneš v kapitole Laboratoř).','Find the quality at which squares begin to appear (the grid is switched on in the Laboratory chapter).')],
 d:tx('Kvantování je hlavní zdroj ztráty a to, co řídí posuvník kvality. Druhou, menší ztrátou je podvzorkování barev.','Quantization is the main source of loss and what the quality slider controls. Colour subsampling is a second, smaller loss.')},
{t:tx('Kódování','Coding'),
 a:tx('Po kvantování je v bloku většina nul. Koeficienty se přečtou <b>cik-cak</b> od vlevo nahoře, takže nuly skončí pospolu na konci. Pak se místo dlouhé řady nul zapíše jen „<b>kolik nul, jaká hodnota</b>“ a konec bloku jedním znakem.','After quantization most of a block is zeros. The coefficients are read in a <b>zigzag</b> from top left, so the zeros end up together at the end. Instead of a long run of zeros, only “<b>how many zeros, what value</b>” is written, and the end of the block with a single symbol.'),
 b:tx('Tyto dvojice se pak zapíšou <b>Huffmanovým kódem</b>: časté symboly dostanou krátké kódy, vzácné dlouhé. DC koeficienty sousedních bloků se ukládají jako rozdíl od předchozího, protože se málo liší. Tato fáze je bezeztrátová, rozbalením dostaneš přesně stejná čísla. Velikost v aplikaci je odhad podle ideálního Huffmanova kódu, skutečný soubor se liší hlavičkou a volbou kodéru.','These pairs are written with a <b>Huffman code</b>: frequent symbols get short codes, rare ones long codes. The DC coefficients of neighbouring blocks are stored as a difference from the previous one, because they differ little. This stage is lossless, unpacking gives exactly the same numbers. The size in the app is an estimate from an ideal Huffman code, a real file differs by header and encoder choice.'),
 eh:tx("Z čeho se skládá soubor","What a file is made of"),
 e:[tx("<b>Dvojice (nuly, velikost).</b> Po cik-cak čtení jsou nuly pospolu na konci a nahradí je jediný znak <b>EOB</b> (konec bloku). Každý nenulový koeficient se zapíše jako dvojice: <b>kolik nul bylo před ním</b> a <b>velikost</b>, tedy kolik bitů potřebuje jeho hodnota (hodnota 1 má velikost 1, hodnoty 2 a 3 velikost 2, hodnoty 4 až 7 velikost 3 a tak dále). Následují bity samotné hodnoty, záporná čísla se zapisují jako doplněk. Pro více než 15 nul je zvláštní symbol ZRL. Dvojice se vejde do jednoho bajtu: čtyři bity pro nuly, čtyři pro velikost.","<b>The (zeros, size) pairs.</b> After the zigzag read the zeros are together at the end and are replaced by a single <b>EOB</b> symbol (end of block). Each non-zero coefficient is written as a pair: <b>how many zeros came before it</b> and the <b>size</b>, that is how many bits its value needs (value 1 has size 1, values 2 and 3 size 2, values 4 to 7 size 3 and so on). The bits of the value itself follow, negative numbers written as a complement. For more than 15 zeros there is a special ZRL symbol. A pair fits in one byte: four bits for zeros, four for size."),
 tx("<b>Koeficient DC zvlášť.</b> Sousední bloky mají podobný průměrný jas, proto se DC neukládá celý, ale jako rozdíl od DC předchozího bloku (DPCM). Rozdíl bývá malý, a tedy ho stačí zapsat několika bity. Ostatních 63 koeficientů se kóduje samostatně v každém bloku.","<b>The DC coefficient separately.</b> Neighbouring blocks have similar average brightness, so DC is not stored in full but as a difference from the DC of the previous block (DPCM). The difference is usually small, so a few bits are enough to write it. The other 63 coefficients are coded separately in each block."),
 tx("<b>Huffmanův kód.</b> Vymyslel ho David Huffman v roce 1952 jako student na MIT: nejčastější symboly dostanou nejkratší kódy. Norma obsahuje ukázkové tabulky, ale kodér smí spočítat tabulky přímo pro daný obraz, což soubor obvykle zmenší o 5 až 10 %. Tabulky jsou uloženy v souboru (značka DHT). Norma zná i aritmetické kódování, které bývá ještě asi o desetinu úspornější, ale kvůli dřívějším patentům a menší podpoře se téměř nepoužívá. Odhad velikosti v aplikaci je spočten jako ideální Huffman nad symboly skutečného obrazu, plus hlavička kolem 600 bajtů.","<b>The Huffman code.</b> It was devised by David Huffman in 1952 as an MIT student: the most frequent symbols get the shortest codes. The standard contains sample tables, but an encoder may compute tables for the particular image, which usually shrinks the file by 5 to 10 %. The tables are stored in the file (the DHT marker). The standard also knows arithmetic coding, which is about a tenth more economical still, but because of earlier patents and less support it is hardly used. The size estimate in the app is computed as an ideal Huffman code over the symbols of the real image plus a header of about 600 bytes."),
 tx("<b>Stavba souboru.</b> Soubor je řada úseků, z nichž každý začíná bajtem FF a kódem: FFD8 je začátek, pak následují údaje JFIF nebo Exif, kvantizační tabulky (DQT), rozměry a podvzorkování (SOF), Huffmanovy tabulky (DHT), vlastní data (SOS) a nakonec FFD9. Bajt FF v datech se kvůli odlišení zapisuje jako FF 00. Metadata Exif mohou přidat desítky kilobajtů, barevný profil ICC asi 3 kB. Proto je soubor z prohlížeče větší než model v aplikaci.","<b>The structure of the file.</b> A file is a series of segments, each beginning with the byte FF and a code: FFD8 is the start, followed by JFIF or Exif data, quantization tables (DQT), dimensions and subsampling (SOF), Huffman tables (DHT), the data itself (SOS) and finally FFD9. An FF byte in the data is written as FF 00 to tell it apart. Exif metadata may add tens of kilobytes, an ICC colour profile about 3 kB. That is why a file from the browser is larger than the model in the app."),
 tx("<b>Progresivní JPEG.</b> Stejné koeficienty se zapíší v jiném pořadí: v prvním průchodu DC všech bloků (hrubý obraz), pak postupně další frekvence. Obraz se na pomalém připojení zobrazí nejdřív rozmazaně a pak se zostřuje. Protože jde o stejná čísla, dá se standardní JPEG na progresivní převést bez ztráty a zpět.","<b>Progressive JPEG.</b> The same coefficients are written in a different order: in the first pass the DC of all blocks (a rough picture), then gradually further frequencies. On a slow connection the picture first appears blurred and then sharpens. Because it is the same numbers, a baseline JPEG can be converted to progressive and back without loss.")],
 c:[tx('Klepni do obrázku na blok a sleduj pořadí cik-cak a délku zápisu v bitech.','Tap a block in the picture and watch the zigzag order and the length of the code in bits.'),
    tx('Sniž kvalitu: nul přibude, zápis se zkrátí.','Lower the quality: more zeros, a shorter code.'),
    tx('Porovnej odhad velikosti se skutečným souborem z prohlížeče.','Compare the size estimate with the real file from the browser.')],
 d:tx('Kódování je jako zkratkopis: stejná informace, méně znaků. Čím víc nul kvantování vyrobilo, tím víc ušetří.','Coding is like shorthand: same information, fewer characters. The more zeros quantization produced, the more it saves.')},
{t:tx('Laboratoř','Laboratory'),
 a:tx('Tady se všechny kroky spojí. Nastavíš <b>kvalitu</b> a <b>podvzorkování</b> a vidíš výsledek vedle originálu: velikost, <b>kompresní poměr</b> (kolikrát je soubor menší než surová data), PSNR a rozdílový obraz.','Here all the steps come together. You set <b>quality</b> and <b>subsampling</b> and see the result next to the original: size, <b>compression ratio</b> (how many times smaller than the raw data), PSNR and a difference image.'),
 b:tx('Závislost velikosti na kvalitě není přímá: při vysoké kvalitě přidáš hodně dat za malé zlepšení, při nízké malé množství dat rozhoduje o viditelnosti čtverečků. Různé obrázky se chovají různě. Hladký přechod je malý, ale blokuje ho banding, fotografie s drobnou texturou je velká a špatně se komprimuje, text a ostré hrany dělají artefakty už při střední kvalitě. Proto neexistuje jedno „správné“ nastavení.','The dependence of size on quality is not linear: at high quality you add a lot of data for a small improvement, at low quality a small amount of data decides whether squares are visible. Different images behave differently. A smooth gradient is small, but banding spoils it; a photo with fine texture is large and compresses badly; text and sharp edges produce artefacts already at medium quality. That is why there is no single “right” setting.'),
 eh:tx("Jak se kvalita hodnotí a volí","How quality is judged and chosen"),
 e:[tx("<b>Čím se měří velikost.</b> Kromě kompresního poměru (kolikrát je soubor menší než surová data) se používají <b>bity na pixel</b> (bpp). Surový obraz má 24 bpp. Fotografie na webu mívají zhruba 1 až 2 bpp, pod 0,5 bpp je ztráta u většiny fotografií zřetelná. Údaj bpp je užitečný proto, že nezávisí na rozměrech obrazu.","<b>How size is measured.</b> Besides the compression ratio (how many times smaller than the raw data), <b>bits per pixel</b> (bpp) are used. A raw image has 24 bpp. Photographs on the web typically have roughly 1 to 2 bpp; below 0.5 bpp the loss is clear on most photographs. The bpp figure is useful because it does not depend on the image dimensions."),
 tx("<b>Křivka kvalita a velikost.</b> Velikost souboru roste s kvalitou rychle, kvalita obrazu pomalu. Soubor při kvalitě 95 bývá několikanásobně větší než při 75, a rozdíl málokdo pozná. Nad 95 už rostou data prudce kvůli dělitelům 1 až 2, ale zlepšení je téměř neviditelné. Naopak pod 50 se začínají objevovat bloky. Rozumná oblast je proto uprostřed: nejčastěji 70 až 85.","<b>The quality and size curve.</b> File size grows quickly with quality, image quality slowly. A file at quality 95 is typically several times larger than at 75, and few people see the difference. Above 95 the data grows steeply because of divisors of 1 to 2, but the improvement is almost invisible. Below 50, on the other hand, blocks begin to appear. The sensible range is therefore in the middle: most often 70 to 85."),
 tx("<b>Na obsahu záleží.</b> Hladké nebe nebo přechod je malý a bloky na něm vynikají. Fotografie s jemnou texturou (listí, květy, tráva) je velká a špatně se stlačuje. Text a ostré hrany dělají artefakty už při střední kvalitě. Ukázkové obrázky v aplikaci mají jen 256 pixelů na šířku: stejná scéna je v nich mnohem „hustší“ než na snímku s milionem pixelů, kde si sousední pixely jsou podobnější. Proto je u nich při stejné kvalitě vyšší ztráta a nižší stlačení, než jaké znáš z reálných fotografií.","<b>Content matters.</b> A smooth sky or gradient is small and blocks stand out on it. A photograph with fine texture (leaves, flowers, grass) is large and compresses badly. Text and sharp edges make artefacts already at medium quality. The sample pictures in the app are only 256 pixels wide: the same scene is much “denser” in them than in a picture with a million pixels, where neighbouring pixels are more alike. That is why at the same quality they show a higher loss and lower compression than you know from real photographs."),
 tx("<b>Co volit v praxi.</b> Web a e-mail: 70 až 85. Sdílení fotek: 80 až 90. Archiv a další úpravy: 90 až 95, ještě lépe bezeztrátový formát nebo originál (RAW, TIFF). Pod 60 už se u fotografií obvykle dají vidět bloky. Podvzorkování 4:2:0 se u fotografií vyplatí, u grafiky a textu s barevnými hranami raději 4:4:4.","<b>What to choose in practice.</b> Web and e-mail: 70 to 85. Sharing photos: 80 to 90. Archive and further editing: 90 to 95, even better a lossless format or the original (RAW, TIFF). Below 60 blocks can usually be seen on photographs. Subsampling 4:2:0 pays off for photographs, for graphics and text with coloured edges rather 4:4:4."),
 tx("<b>Odhad a skutečný soubor.</b> Model v aplikaci počítá ideální Huffmanův kód a nezná rozhodnutí konkrétního kodéru. Velikost, kterou vrací prohlížeč, se proto o něco liší. Aplikace ukazuje obě hodnoty, aby bylo vidět, že odhad je dobrý, ale není přesný.","<b>Estimate and the real file.</b> The model in the app computes an ideal Huffman code and does not know the decisions of a particular encoder. The size returned by the browser therefore differs somewhat. The app shows both values so you can see the estimate is good but not exact.")],
 c:[tx('Najdi nejnižší kvalitu, při které nepoznáš rozdíl oproti originálu.','Find the lowest quality at which you cannot tell the difference from the original.'),
    tx('Totéž udělej pro fotku, text a barevné plochy a porovnej výsledky.','Do the same for the photo, text and colour patches and compare.'),
    tx('Táhni lupou po obrázku a v pohledu „chyba“ zjisti, kde JPEG chybuje nejvíc.','Drag the lens over the picture and in the “error” view see where JPEG errs the most.')],
 d:tx('Kvalitu je třeba volit podle obrázku. Fotka zvládne 75, text nebo kresba s ostrými hranami často potřebuje víc nebo jiný formát.','Quality has to be chosen per image. A photo copes with 75, text or a line drawing with sharp edges often needs more, or a different format.')},
{t:tx('Artefakty','Artefacts'),
 a:tx('<b>Artefakt</b> je viditelná chyba, kterou komprese vyrobila. Nejtypičtější jsou <b>čtverečky</b> (hranice bloků 8 × 8 se rozejdou), <b>prstence</b> kolem ostrých hran (ztracené jemné vlnění se vrací jako šum) a <b>barevné skvrny</b> od podvzorkování.','An <b>artefact</b> is a visible error produced by compression. The most typical are <b>blocks</b> (the boundaries of 8 × 8 blocks drift apart), <b>ringing</b> around sharp edges (lost fine waves come back as noise) and <b>colour smudges</b> from subsampling.'),
 b:tx('Na hladkých přechodech vznikají <b>schody</b>, protože sousední bloky zaokrouhlí jas každý trochu jinak. Když obrázek opakovaně ukládáš jako JPEG, ztráty se <b>sčítají</b>: každé uložení znovu kvantuje a chyby se hromadí. Nejhorší je posun o pár pixelů, protože se pak změní rozdělení na bloky. Proto se upravuje originál nebo bezeztrátový formát a JPEG je až poslední krok.','On smooth gradients <b>steps</b> appear, because neighbouring blocks round brightness each a little differently. When you save an image as JPEG repeatedly, the losses <b>add up</b>: each save quantizes again and the errors accumulate. A shift of a few pixels is worst, because the division into blocks then changes. That is why you edit the original or a lossless format and JPEG is the last step.'),
 eh:tx("Proč artefakty vznikají a proč se hromadí","Why artefacts appear and why they accumulate"),
 e:[tx("<b>Bloky.</b> Každý blok se kvantuje samostatně. Sousední bloky zaokrouhlí svůj průměr (DC) trochu jinak a na hranici vznikne skok. Oko je na pravidelné hrany a čáry velmi citlivé, proto mřížka vynikne už při malé chybě, nejvíc v hladkých plochách (obloha, kůže). Video kodeky mají proti tomu vyhlazení hran bloků (deblocking) přímo v normě, JPEG ho v normě nemá, i když ho některé dekodéry přidávají.","<b>Blocks.</b> Each block is quantized separately. Neighbouring blocks round their average (DC) a little differently and a jump appears at the boundary. The eye is very sensitive to regular edges and lines, so the grid stands out even at a small error, most in smooth areas (sky, skin). Video codecs have smoothing of block edges (deblocking) in their standards; JPEG does not, although some decoders add it."),
 tx("<b>Prstence.</b> Ostrá hrana potřebuje mnoho vysokých frekvencí. Po jejich zaokrouhlení (často na nulu) zbude součet jen nízkých kosinů a ten kolem hrany kmitá. Tomu se říká <b>Gibbsův jev</b> a popsal ho J. W. Gibbs kolem roku 1899. U videa se mu říká komáří šum (mosquito noise). Nejvíc vynikne u textu, kreseb a log, proto se pro ně hodí PNG.","<b>Ringing.</b> A sharp edge needs many high frequencies. After they are rounded (often to zero) only the sum of the low cosines remains and it oscillates around the edge. This is the <b>Gibbs phenomenon</b>, described by J. W. Gibbs around 1899. In video it is called mosquito noise. It stands out most on text, drawings and logos, which is why PNG suits them."),
 tx("<b>Schody a barva.</b> Plynulý přechod je v každém bloku jen několik různých hodnot. Po kvantování zbude DC a pár nízkých koeficientů, takže sousední bloky mají lehce odlišný odstín a přechod se rozpadne na schody. Barevné lemy u hran vznikají podvzorkováním barev, jak ukazuje kapitola 2.","<b>Steps and colour.</b> A smooth gradient is only a few different values in each block. After quantization DC and a few low coefficients remain, so neighbouring blocks have a slightly different tone and the gradient breaks into steps. Coloured fringes at edges come from colour subsampling, as chapter 2 shows."),
 tx("<b>Proč se ztráty hromadí.</b> Každé uložení obraz znovu dekóduje (zaokrouhlí na celá čísla 0 až 255) a znovu kvantuje. Když jsou tabulky i mřížka bloků stejné, druhé uložení téměř nic nezmění, protože koeficienty už leží blízko násobků dělitelů, a změny se rychle zmenšují. Stačí ale, aby se obraz posunul (ořez o pixel), otočil o jiný úhel, zmenšil, upravil nebo uložil s jinými tabulkami, a bloky se rozdělí jinak: chyby se pak sčítají. To ukazuje volba „Posun o 1 px“. V praxi takto trpí obrázky přeposílané přes sociální sítě nebo snímky obrazovky snímků obrazovky.","<b>Why losses accumulate.</b> Each save decodes the picture again (rounds to integers 0 to 255) and quantizes again. When the tables and the block grid are the same, the second save changes almost nothing, because the coefficients already lie near multiples of the divisors, and the changes shrink quickly. But if the picture is shifted (cropped by a pixel), rotated by another angle, resized, edited or saved with different tables, the blocks divide differently and the errors add up. This is what the “Shift by 1 px” option shows. In practice pictures forwarded through social networks, or screenshots of screenshots, suffer this way."),
 tx("<b>Jak se bránit.</b> Upravuj originál (RAW, TIFF, PNG) a JPEG vytvoř až nakonec, jednou. Otočení o 90° a ořez na hranice bloků lze udělat bezeztrátově přímo s koeficienty (nástroj jpegtran), bez nového kvantování. Nepřeposílej obrázky přes služby, které je znovu komprimují.","<b>How to defend against it.</b> Edit the original (RAW, TIFF, PNG) and create the JPEG only at the end, once. Rotation by 90° and cropping to block boundaries can be done losslessly directly on the coefficients (the jpegtran tool), without new quantization. Do not forward pictures through services that recompress them.")],
 c:[tx('Zvol předvolbu (Bloky, Prstence, Barvy, Přechod) a posuň lupu na místo, kde se chyba projeví.','Choose a preset (Blocks, Ringing, Colour, Gradient) and move the lens to where the error shows.'),
    tx('Zvyšuj počet opakovaných uložení a sleduj, jak se obraz zhoršuje.','Increase the number of repeated saves and watch the picture get worse.'),
    tx('Přepni „Posun o 1 px“ a porovnej s volbou „Stejná mřížka“.','Switch “Shift by 1 px” and compare with “Same grid”.')],
 d:tx('JPEG ztrácí při každém uložení. Originál si uschovej a upravený soubor ukládej jednou.','JPEG loses with every save. Keep the original and save the edited file only once.')},
{t:tx('Praxe','Practice'),
 a:tx('Která volba je nejlepší, závisí na účelu. <b>JPEG</b> se hodí na fotografie, <b>PNG</b> na text, schémata a snímky obrazovky (bezeztrátové), <b>BMP</b> je prakticky nekomprimované. Novější formáty (<b>WebP, HEIC, AVIF, JPEG XL</b>) dosáhnou při stejné kvalitě menšího souboru, ale mají omezenější podporu.','Which choice is best depends on the purpose. <b>JPEG</b> suits photographs, <b>PNG</b> suits text, diagrams and screenshots (lossless), <b>BMP</b> is practically uncompressed. Newer formats (<b>WebP, HEIC, AVIF, JPEG XL</b>) reach a smaller file at the same quality, but have more limited support.'),
 b:tx('Osa je logaritmická, takže každý dílek je o řád větší. Čísla jsou orientační a platí pro typickou fotku, skutečný poměr závisí na obrázku a kodéru. <b>Progresivní JPEG</b> se načítá postupně od hrubého obrazu k jemnému a bývá o něco menší. Praktické otázky: kolik fotek se vejde na kartu 64 GB a jestli se příloha vejde do e-mailu s limitem 25 MB.','The axis is logarithmic, so each division is an order of magnitude larger. The numbers are indicative and apply to a typical photo, the real ratio depends on the image and encoder. <b>Progressive JPEG</b> loads gradually from a coarse picture to a fine one and is usually slightly smaller. Practical questions: how many photos fit on a 64 GB card and whether an attachment fits into an e-mail with a 25 MB limit.'),
 eh:tx("Který formát kdy a proč","Which format when and why"),
 e:[tx("<b>Bezeztrátové a ztrátové.</b> Bezeztrátové formáty (PNG, 1996) zapíšou obraz tak, aby se dal vrátit přesně: pixel se předpovídá ze sousedů a kóduje se jen rozdíl, pak následuje DEFLATE. PNG vznikl jako volná náhrada za GIF (1987), který byl zatížen patentem. Hodí se na text, schémata a snímky obrazovky, kde ztrátová komprese dělá viditelné prstence. Fotografie vyjdou velké. Ztrátové formáty jsou pro fotky, kde na přesnosti pixelů nezáleží.","<b>Lossless and lossy.</b> Lossless formats (PNG, 1996) write the image so that it can be restored exactly: a pixel is predicted from its neighbours and only the difference is coded, followed by DEFLATE. PNG came as a free replacement for GIF (1987), which was burdened by a patent. It suits text, diagrams and screenshots, where lossy compression produces visible ringing. Photographs come out large. Lossy formats are for photos, where the exactness of pixels does not matter."),
 tx("<b>Co přinesly novější formáty.</b> Převzaly zlepšení z videokodeků: předpověď bloku ze sousedů, proměnné velikosti bloků, lepší entropické kódování a vyhlazení hran bloků. <b>WebP</b> (Google, 2010) vychází z videokodeku VP8, <b>HEIC</b> z HEVC (Apple ho používá jako výchozí od roku 2017, ale je zatížen patenty), <b>AVIF</b> z AV1 (2019, bez licenčních poplatků, pomalé kódování) a <b>JPEG XL</b> (norma 2021 až 2022) je nástupce JPEG, který umí staré JPEG převést bez ztráty a ušetřit asi pětinu. Uváděné úspory proti JPEG při stejném vzhledu jsou orientačně čtvrtina (WebP) až polovina (AVIF) a závisejí na obrázku i nastavení.","<b>What newer formats brought.</b> They adopted improvements from video codecs: predicting a block from its neighbours, variable block sizes, better entropy coding and smoothing of block edges. <b>WebP</b> (Google, 2010) is based on the VP8 video codec, <b>HEIC</b> on HEVC (Apple uses it by default since 2017, but it is burdened by patents), <b>AVIF</b> on AV1 (2019, royalty-free, slow encoding) and <b>JPEG XL</b> (standard 2021 to 2022) is a successor of JPEG that can convert old JPEGs without loss and save about a fifth. The stated savings against JPEG at the same appearance are indicatively a quarter (WebP) to a half (AVIF) and depend on the image and settings."),
 tx("<b>Proč JPEG stále vede.</b> Nejde o kvalitu, ale o kompatibilitu: JPEG otevře každý telefon, program, tiskárna i web po více než 30 let. Nový formát musí nabídnout větší úsporu, než kolik stojí nejistota, že ho příjemce otevře. Podpora nových formátů v prohlížečích a programech se stále mění, proto je před nasazením vždy ověř (například na caniuse.com).","<b>Why JPEG still leads.</b> It is not about quality but about compatibility: every phone, program, printer and web has opened JPEG for more than 30 years. A new format must offer a saving greater than the cost of the uncertainty whether the recipient can open it. Support for new formats in browsers and programs keeps changing, so always check it before using them (for example at caniuse.com)."),
 tx("<b>Karta a e-mail.</b> Počet fotografií na kartě je kapacita dělená velikostí jedné: u 12 Mpx a střední kvality jde o desítky tisíc. Limit e-mailové přílohy 25 MB se u mnoha systémů vztahuje na už zakódovanou zprávu. Příloha se totiž posílá jako text (kódování Base64), které data zvětší zhruba o třetinu, takže 25 MB je jen asi 18 MB skutečných souborů.","<b>Card and e-mail.</b> The number of photos on a card is the capacity divided by the size of one: for 12 Mpx and medium quality it is tens of thousands. The 25 MB limit of an e-mail attachment applies in many systems to the already encoded message. An attachment is sent as text (Base64 encoding), which enlarges the data by about a third, so 25 MB is only about 18 MB of real files."),
 tx("<b>Web a soukromí.</b> Nejvíc ušetříš tím, že obrázek zmenšíš na velikost, v jaké se zobrazí: snímek 4 000 px zobrazený na šířku 600 px zbytečně stahuje desetkrát víc dat. Pak stačí kvalita 75 až 85 a progresivní zápis. Pozor na metadata Exif: fotografie z telefonu obsahuje datum, typ zařízení a často <b>polohu GPS</b>, kde byla pořízena. Před zveřejněním nebo odesláním mimo školu ji odstraň. Sociální sítě ji většinou odstraní samy, e-mail a přímé sdílení souboru ne.","<b>Web and privacy.</b> The most you save is by resizing the picture to the size in which it is displayed: a 4,000 px picture shown at 600 px wide needlessly downloads ten times more data. Then quality 75 to 85 and progressive writing are enough. Beware of Exif metadata: a photo from a phone contains the date, the device and often the <b>GPS location</b> where it was taken. Remove it before publishing or sending outside the school. Social networks usually remove it themselves, e-mail and direct file sharing do not."),
 tx("<b>Shrnutí výběru.</b> Fotografie: JPEG, nebo novější formát tam, kde ho příjemce otevře. Text, schémata, snímky obrazovky: PNG. Archiv: originál (RAW, TIFF) a z něj JPEG. Web: WebP nebo AVIF se záložním JPEG.","<b>Summary of the choice.</b> Photographs: JPEG, or a newer format where the recipient can open it. Text, diagrams, screenshots: PNG. Archive: the original (RAW, TIFF) and a JPEG made from it. Web: WebP or AVIF with a JPEG fallback.")],
 c:[tx('Změň rozlišení a kvalitu a sleduj počet fotek na kartě i velikost přílohy.','Change resolution and quality and watch the number of photos on the card and the attachment size.'),
    tx('Porovnej JPEG a PNG na textu a na fotce.','Compare JPEG and PNG on text and on a photo.'),
    tx('Najdi formát, který se vejde pod 25 MB, a zvaž, zda ho příjemce otevře.','Find a format that fits under 25 MB and consider whether the recipient can open it.')],
 d:tx('Fotky jako JPEG (nebo novější formát, pokud ho všichni otevřou), grafiku a text jako PNG. Nejlepší formát je ten, který příjemce skutečně otevře.','Photos as JPEG (or a newer format if everyone can open it), graphics and text as PNG. The best format is the one the recipient can really open.')}];

<script>
const A=(u,t)=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`;
window.LXC={ns:'jlp',num:true,min:tx('asi 45 minut','about 45 minutes'),
PRE:[
 {t:tx('Kolik zabere nekomprimovaná fotka','How much an uncompressed photo takes'),d:tx('Kapitola 1: 12 Mpx, tři bajty na pixel, výsledek kolem 36 MB. Porovnejte s hotovým JPEG.','Chapter 1: 12 Mpx, three bytes per pixel, about 36 MB. Compare with the finished JPEG.'),f:()=>{Object.assign(S,{mp:12,q:50,sub:'s420'});go(0)}},
 {t:tx('Podvzorkování barev 4:2:0','Chroma subsampling 4:2:0'),d:tx('Kapitola 2: barvy v polovičním rozlišení, jas v plném. Zkuste barevný obrázek.','Chapter 2: colour at half resolution, luma at full. Try the colour test image.'),f:()=>{Object.assign(S,{sub:'s420',img:'barvy'});go(1)}},
 {t:tx('DCT jednoho bloku 8 × 8','DCT of one 8 × 8 block'),d:tx('Kapitola 3: vybraný blok krajiny rozložený na 64 vzorů.','Chapter 3: a chosen landscape block decomposed into 64 patterns.'),f:()=>{Object.assign(S,{blk:'img',img:'foto'});go(2)}},
 {t:tx('Kvantování při nízké kvalitě','Quantization at low quality'),d:tx('Kapitola 4: kvalita 10, většina koeficientů se vynuluje. Tady vzniká hlavní ztráta.','Chapter 4: quality 10, most coefficients become zero. This is where the main loss happens.'),f:()=>{Object.assign(S,{q:10,qt:'y'});go(3)}},
 {t:tx('Laboratoř: mřížka bloků','Laboratory: block grid'),d:tx('Kapitola 6: při nízké kvalitě zapněte mřížku; chyby sedí přesně v blocích 8 × 8.','Chapter 6: at low quality turn on the grid; errors sit exactly in the 8 × 8 blocks.'),f:()=>{Object.assign(S,{q:20,grid:true});go(5)}},
 {t:tx('Artefakty: bloky','Artefacts: blocks'),d:tx('Kapitola 7: kvalita 8, krajina, bez podvzorkování. Typické kostičky.','Chapter 7: quality 8, landscape, no subsampling. Typical blocks.'),f:()=>{Object.assign(S,{art:'blok',img7:'foto',q7:8,sub7:'s444',gen:1,shift:false,rx7:20,ry7:6});go(6)}},
 {t:tx('Artefakty: opakované ukládání','Artefacts: repeated saving'),d:tx('Kapitola 7: dvanáct uložení s posunem o pixel. Chyby se hromadí.','Chapter 7: twelve saves with a one pixel shift. Errors accumulate.'),f:()=>{Object.assign(S,{art:'gen',img7:'foto',q7:55,sub7:'s420',gen:12,shift:true,rx7:56,ry7:48});go(6)}},
 {t:tx('Praxe: AVIF a JPEG XL','Practice: AVIF and JPEG XL'),d:tx('Kapitola 8: srovnání novějších formátů při stejné kvalitě.','Chapter 8: comparing newer formats at the same quality.'),f:()=>{Object.assign(S,{fmt:'avif',q:75,sub:'s420'});go(7)}}],

 [tx('Cesta obrazu a velikost fotky','Image path and photo size'),'6 min',tx('Kap. 1, předvolba nekomprimované fotky.','Ch. 1, the uncompressed photo preset.')],

 const html=`<h3 id="lxG" class="lxh">${tx('Slovníček','Glossary')}${allGl?'':' · '+tx('této kapitoly','of this chapter')}</h3><dl class="gl">${gl.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl><button class="lnk" data-act="lxgl">${allGl?tx('Jen pojmy této kapitoly','Only this chapter\'s terms'):tx('Zobrazit celý slovníček','Show the whole glossary')}</button>`+(src.length?`<h3 id="lxS" class="lxh">${tx('Zdroje','Sources')}</h3><ul class="srcl">${src.map(s=>`<li>${s}</li>`).join('')}</ul><p class="srcn">${tx('Údaje v nápovědě byly porovnány s těmito zdroji 13. 11. 2026. Čísla v simulaci jsou orientační.','The facts in the help were checked against these sources on 13 Nov 2026. Numbers in the simulation are indicative.')}</p>`:'');
 anchor?anchor.insertAdjacentHTML('beforebegin',html):c.insertAdjacentHTML('beforeend',html);
}
ACT.lxgo=v=>{const e=document.getElementById(v);e&&e.scrollIntoView({block:'start'})};
ACT.lxgl=()=>{allGl=!allGl;ACT.hnav('0');requestAnimationFrame(()=>ACT.lxgo('lxG'))};
['help','hnav'].forEach(k=>{const f=ACT[k];ACT[k]=function(){const r=f.apply(this,arguments);enhance();return r}});
/* ---- popisy grafů pro čtečky ---- */
function a11y(){
 Object.keys(C.D).forEach(id=>{const c=document.getElementById(id);if(c){c.setAttribute('role','img');try{c.setAttribute('aria-label',C.D[id]())}catch(e){}}});
}
const _sync=window.sync;window.sync=sync=function(){_sync();a11y()};
/* GL má u pojmu [cs,en] jako tx() texty, v lang už je rozhodnuto */
})();
</script>

<script>boot();</script>
