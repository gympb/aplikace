<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="640" height="240" role="img"><title>Březové Hory 31. května 1892: z šachet stoupá kouř, před kostelem stojí řada rakví</title><defs>
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="wash" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="0.7"/></filter>
<filter id="smoke" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="1.6"/></filter>
<filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .42  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .12 0"/></filter>
<pattern id="sraf" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><path d="M0 0v3.2" stroke="#2a1e14" stroke-width=".6" opacity=".55"/></pattern>
</defs>
<rect width="320" height="120" fill="#ece0c2"/><rect width="320" height="120" filter="url(#paper)"/>

<!-- kouř z šachet -->
<g filter="url(#smoke)" opacity=".75">
<path d="M58 54 C50 40 62 30 54 18 C48 8 66 2 80 6 C96 10 92 24 104 28 C88 32 76 40 72 54z" fill="#7d7a78"/>
<path d="M232 50 C226 36 240 28 236 16 C232 6 252 0 266 6 C282 12 276 24 292 26 C278 34 262 38 254 50z" fill="#6f6c6a"/>
<path d="M112 6 C130 0 150 8 170 4 C190 0 210 6 226 4 L224 14 C200 18 160 12 130 16z" fill="#8c8986" opacity=".6"/>
</g>

<!-- krajina a stavby: vodové barvy -->
<g filter="url(#wash)" opacity=".85">
<path d="M0 82 Q60 72 130 78 T320 74V120H0z" fill="#9aa06a"/>
<path d="M0 90 Q60 86 130 89 T320 87V120H0z" fill="#a98f6c"/>
<!-- šachta vlevo -->
<path d="M50 80V54h28v26z" fill="#c98a5a"/><path d="M47 56l17-12 17 12z" fill="#8f6f55"/>
<!-- kostel -->
<path d="M128 84V58h50v26z" fill="#d9c9a4"/><path d="M124 60l29-14 29 14z" fill="#8a5a44"/>
<path d="M150 84V40h14v44z" fill="#d9c9a4"/><path d="M147 41l10-16 10 16z" fill="#4f5d5a"/>
<!-- šachta vpravo -->
<path d="M224 78V50h30v28z" fill="#c98a5a"/><path d="M221 52l18-12 18 12z" fill="#8f6f55"/>
<path d="M272 80l14-20 14 20z" fill="#a08a6c"/>
</g>


<!-- podzemí: šachty, patra a komíny -->
<g fill="url(#sraf)" opacity=".3"><path d="M0 90 Q60 86 130 89 T320 87V120H0z"/></g>
<g filter="url(#wash)" opacity=".8">
<path d="M61 80h6v40h-6zM236 78h6v42h-6z" fill="#3a2e24"/>
<path d="M30 99h232v2.5H30zM20 108h242v2.5H20zM40 116.5h210v2.5H40z" fill="#3a2e24"/>
<ellipse cx="64" cy="117" rx="9" ry="3.5" fill="#d9772e"/>
</g>
<g fill="none" stroke="#3b2a1c" stroke-width=".8" stroke-linecap="round" filter="url(#ink)">
<path d="M61 80v40M67 80v40M236 78v42M242 78v42"/>
<path d="M30 99h31M67 99h169M242 99h20M20 108h41M67 108h169M242 108h20M40 116.5h21M67 116.5h169M242 116.5h8"/>
<path d="M118 101.5v6.5M121 101.5v6.5M188 110.5v6M191 110.5v6"/>
</g>
<g fill="#e9a14e" opacity=".9"><path d="M61 117l2-5 2 3 1.5-4 1.5 6z"/></g>

<!-- šrafování stínů -->
<g opacity=".8">
<path d="M66 80V56h12v24z" fill="url(#sraf)"/><path d="M164 84V42h-6v42z" fill="url(#sraf)"/>
<path d="M240 78V52h14v26z" fill="url(#sraf)"/><path d="M286 60l14 20h-14z" fill="url(#sraf)"/>
</g>

<!-- perokresba -->
<g fill="none" stroke="#3b2a1c" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round" filter="url(#ink)">
<path d="M0 82 Q60 72 130 78 T320 74"/>
<!-- šachta vlevo s těžní věží -->
<path d="M50 80V55M78 80V55M47 56l17-12 17 12"/><path d="M58 80v-10h8v10"/><path d="M60 44V34h8v10M60 34l4-4 4 4"/>
<!-- kostel sv. Vojtěcha -->
<path d="M128 84V59M178 84V59M124 60l29-14 29 14"/><path d="M150 84V41M164 84V41M147 41l10-16 10 16M157 25v-5M154.5 22h5"/>
<path d="M155 52a2 3 0 0 1 4 0v5h-4zM137 66a2 3 0 0 1 4 0v6h-4zM167 66a2 3 0 0 1 4 0v6h-4z"/><path d="M154 84v-8a3 3 0 0 1 6 0v8"/>
<!-- šachta vpravo -->
<path d="M224 78V51M254 78V51M221 52l18-12 18 12"/><path d="M234 78v-10h9v10"/><path d="M235 40V30h8v10M235 30l4-4 4 4"/>
<path d="M272 80l14-20 14 20"/>
<!-- břízy -->
<path d="M104 82V64M104 70l-4-4M104 67l4-5M300 78V62M300 68l-3-4M300 66l4-4"/>
</g>
<g fill="#d8e0cc" opacity=".9"><path d="M103.3 64h1.4v18h-1.4zM299.3 62h1.4v16h-1.4z"/></g>
<g fill="#5f6f3a" opacity=".55" filter="url(#wash)"><circle cx="104" cy="64" r="6"/><circle cx="300" cy="63" r="5"/></g>

<text x="314" y="116" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="9.5" fill="#efe4c8">31. května 1892</text>
</svg>
