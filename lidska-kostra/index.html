body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 'Outfit',system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.zpet{display:block;width:100%;max-width:596px;margin:0 auto;padding-block:10px 8px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));font-size:13px;font-weight:500;color:var(--mut);text-decoration:none}
.zpet:hover{color:var(--pri)}
header{background:var(--hd);color:var(--hdtx);padding-block:16px 30px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));flex-shrink:0}
header .in{max-width:560px;margin:0 auto}
header h1{margin:0;font-size:31px;line-height:1.02;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
header h1 span{color:var(--pri)}
header p{margin:8px 0 0;color:var(--hdmut);font-size:15px}
main{flex:1;display:flex;flex-direction:column;position:relative;z-index:1;background:var(--bg);border-radius:30px 30px 0 0;margin-top:-26px;padding-block:16px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:0}
.wrap{width:100%;max-width:560px;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.bar{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;flex:1}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:8px 4px;border-radius:10px;font:inherit;font-size:15px;font-weight:500;min-height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--tile);color:#fff;font-weight:600}
.seg button:focus-visible,.ib:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.stage{position:relative;flex:1;min-height:440px;background:var(--paper);border:1px solid var(--paperbd);border-radius:18px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;perspective:1400px;cursor:default}
.stage.grab{cursor:grab}.stage.grabbing{cursor:grabbing}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .32s ease-in}
.flip.out{transform:rotateY(90deg)}
.flip.pre{transform:rotateY(-90deg);transition:none}
.cam{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.cam img,.cam canvas{position:absolute;left:0;top:0;display:block;max-width:none;pointer-events:none}
.cam canvas{mix-blend-mode:multiply}
.tip{position:absolute;left:0;top:0;z-index:4;pointer-events:none;background:var(--hd);color:#fff;border-radius:12px;padding:8px 12px 9px;box-shadow:0 8px 22px #0000004d;transform:translate(-50%,calc(-100% - 16px));white-space:nowrap;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--hd);border-bottom:0}
.tip b{display:block;font-size:17px;font-weight:700;line-height:1.15}
.tip i{display:block;font-size:12.5px;color:var(--hdmut);margin-top:2px;letter-spacing:.01em}
.tip.below{transform:translate(-50%,22px)}.tip.below::after{bottom:auto;top:-7px;border-top:0;border-bottom:7px solid var(--hd)}
.view{position:absolute;left:12px;top:12px;z-index:3;background:var(--tile);color:#fff;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:9px;pointer-events:none}
.zoom{position:absolute;right:10px;top:10px;z-index:3;display:flex;flex-direction:column;gap:6px}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid #E3E5E9;background:#fff;color:#1F2329;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 3px #0000001a;padding:0}
.ib:disabled{opacity:.4;cursor:default}
.ib:hover:not(:disabled){border-color:#C9CED6}
.pct{position:absolute;right:10px;bottom:10px;z-index:3;font-size:12px;color:#646B76;background:#ffffffd9;padding:3px 8px;border-radius:8px;font-variant-numeric:tabular-nums;pointer-events:none}
.hint{font-size:13px;color:var(--mut);text-align:center;margin:0}
footer{font-size:11px;color:var(--mut);text-align:center;padding-block:4px 10px;background:var(--bg)}
@media (max-width:420px){header h1{font-size:27px}header p{font-size:14px}.stage{min-height:400px}}
@media (prefers-reduced-motion:reduce){.flip{transition:none}.tip{transition:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
</head>

<header><div class="in"><h1>Lidská <span>kostra</span></h1><p>Najeď na kost nebo na ni klepni a uvidíš její název.</p></div></header>
<main><div class="wrap">
  <div class="bar">
    <div class="seg" role="group" aria-label="Pohled na kostru">

    </div>
  </div>
  <div class="stage" id="stage" aria-label="Kostra – najeď nebo klepni na kost">
    <div class="flip" id="flip"><div class="cam" id="cam"><img id="img" alt="Lidská kostra"><canvas id="hl"></canvas></div></div>
    <span class="view" id="viewLbl">Zepředu</span>
    <div class="zoom">
      <button class="ib" id="zIn" aria-label="Přiblížit" title="Přiblížit"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"/></svg></button>
      <button class="ib" id="zOut" aria-label="Oddálit" title="Oddálit"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6"/></svg></button>
      <button class="ib" id="zFit" aria-label="Zobrazit celou kostru" title="Celá kostra"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <span class="pct" id="pct">100 %</span>
    <div class="tip" id="tip"><b id="tCz"></b><i id="tLa"></i></div>
  </div>
  <p class="hint" id="hint">Přibližuj lupou, kolečkem myši nebo roztažením prstů. Přiblíženou kostru posuneš tažením.</p>
</div></main>

stage.addEventListener('dblclick',e=>{if(e.target.closest('.zoom'))return;const p=stagePt(e);zoomAt(2,p[0],p[1])});
function centerZoom(f){const r=stage.getBoundingClientRect();zoomAt(f,r.width/2,r.height/2)}
zIn.onclick=()=>centerZoom(1.6);zOut.onclick=()=>centerZoom(1/1.6);zFit.onclick=()=>{hideTip();fitView()};

// rotation
let busy=false;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function turn(to){
  if(busy||to===cur)return;
  if(reduce){setView(to);return}
  busy=true;hideTip();flip.classList.add('out');
  setTimeout(()=>{
    setView(to);flip.classList.remove('out');flip.classList.add('pre');
    void flip.offsetWidth;flip.classList.remove('pre');
    setTimeout(()=>busy=false,330);
  },320);
}
bFront.onclick=()=>turn('front');bBack.onclick=()=>turn('back');bFlip.onclick=()=>turn(cur==='front'?'back':'front');
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='+'||e.key==='=')centerZoom(1.6);else if(e.key==='-')centerZoom(1/1.6);else if(e.key==='0')fitView();else if(e.key==='r'||e.key==='R')bFlip.click();
});
let rz;new ResizeObserver(()=>{clearTimeout(rz);rz=setTimeout(()=>{const z=scale/fit;const r=stage.getBoundingClientRect();const cx=r.width/2,cy=r.height/2;fitView();if(z>1.001)zoomAt(z,cx,cy)},60)}).observe(stage);
setView('front');
})();
</script>
