<!DOCTYPE html>
<html lang="cs">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NETRUNNER 2088: prolom mainframe</title>
<link rel="stylesheet" href="../../../../../../assets/portfolio/pisma/pisma.css">
<style>
:root{--bg:#0d0e15;--cy:#00f3ff;--mg:#ff0055;--lm:#c6ff3d;--ink:#cfeff3;--dim:#7d90a2;--pn:#121521}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:1.35rem/1.35 VT323,ui-monospace,Menlo,Consolas,monospace;background-image:linear-gradient(rgba(0,243,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,243,255,.05) 1px,transparent 1px);background-size:32px 32px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.crt{position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);animation:fl 5s infinite}
.crt:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6))}
#app{max-width:820px;margin:0 auto;padding:14px;min-height:100vh}
.hud{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;border:1px solid var(--cy);padding:8px 12px;background:var(--pn);box-shadow:0 0 14px rgba(0,243,255,.25)}
.hud b{color:var(--cy);font-weight:400}
.hb{flex:1;min-width:110px;height:14px;border:1px solid var(--cy);position:relative}
.hb i{position:absolute;inset:0 auto 0 0;background:var(--lm);box-shadow:0 0 8px var(--lm);transition:width .3s}
#tm.warn{color:var(--mg);animation:bl .5s infinite}
h1,h2{font-weight:400;color:var(--cy);text-shadow:2px 0 var(--mg),-2px 0 rgba(255,255,255,.25);letter-spacing:2px;margin:16px 0 6px;line-height:1.05}
h1{font-size:3.2rem}h2{font-size:2.1rem}
h1.red{color:var(--mg);text-shadow:2px 0 var(--cy)}
.panel{border-left:3px solid var(--mg);background:var(--pn);padding:10px 14px;margin:10px 0}
.dim{color:var(--dim)}
.lm{color:var(--lm)}
.b{font:inherit;color:var(--cy);background:transparent;border:1px solid var(--cy);padding:7px 14px;cursor:pointer;margin:4px 4px 4px 0;text-transform:uppercase}
.b:hover:not(:disabled),.b:focus-visible{background:var(--cy);color:var(--bg);box-shadow:0 0 14px var(--cy);outline:none}
.b:disabled{opacity:.55;cursor:default}
.b.okb{border-color:var(--lm);color:var(--lm);opacity:1;box-shadow:0 0 12px var(--lm)}
#arena{position:relative;height:190px;border:1px dashed var(--dim);overflow:hidden;margin:10px 0;background:rgba(0,243,255,.03)}
.pk{position:absolute;left:6%;right:6%;top:0;border:1px solid var(--lm);color:var(--lm);padding:8px;text-align:center;background:rgba(13,14,21,.9);box-shadow:0 0 10px rgba(198,255,61,.4)}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bins .b{margin:0}
.two{display:flex;gap:18px;flex-wrap:wrap}.two>div{flex:1;min-width:200px}
.sw{height:70px;border:1px solid var(--ink);box-shadow:0 0 12px rgba(255,255,255,.3)}
.sl{display:flex;gap:10px;align-items:center;margin:6px 0}.sl input{flex:1}.sl output{width:3ch;text-align:right}
.sig{margin:12px auto;width:min(100%,360px);border:2px solid var(--cy);background:repeating-linear-gradient(45deg,var(--pn) 0 10px,#1b2036 10px 20px);display:grid;place-items:center;color:var(--cy);filter:blur(12px);transition:filter .6s;font-size:1.8rem}
#app.good{animation:gd .6s}
#app.bad{animation:bd .5s}
@keyframes gd{0%{box-shadow:inset 0 0 90px rgba(0,243,255,.55)}100%{box-shadow:inset 0 0 0 transparent}}
@keyframes bd{0%{box-shadow:inset 0 0 120px rgba(255,0,85,.8);transform:translateX(-6px)}25%{transform:translateX(6px)}50%{transform:translateX(-4px)}75%{transform:translateX(4px)}100%{box-shadow:inset 0 0 0 transparent;transform:none}}
@keyframes bl{50%{opacity:.3}}
@keyframes fl{0%,100%{opacity:1}50%{opacity:.88}52%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<!-- gp-ramec:css --><style>
.gp-bar,.gp-foot{align-self:stretch;width:100%;box-sizing:border-box;background:#111;color:#c9c9c9;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:10px 16px;text-align:left}
.gp-bar a,.gp-foot a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.gp-bar a:hover,.gp-foot a:hover{color:#ff972e}
.gp-bar{background:transparent;color:inherit;padding:10px 16px 0}
.gp-bar a{color:inherit;opacity:.85}
.gp-bar a:hover{opacity:1;color:inherit}
.gp-foot{margin-top:32px;position:relative;z-index:1}
.gp-in{max-width:720px;margin:0 auto;display:flex;flex-wrap:wrap;gap:2px 14px}
</style><!-- /gp-ramec:css -->
</head>
<body>
<!-- gp-ramec:bar --><div class="gp-bar"><div class="gp-in"><a href="../../../../../#/2026-27/informatika/4b-bst/bitmapova-grafika">← Zpět do portfolia</a></div></div><!-- /gp-ramec:bar -->

<div id="app">
<div class="hud" role="status">
<span>UZEL <b id="nd">--</b></span>
<span>INTEGRITA <b id="hpn">100%</b></span><div class="hb" aria-hidden="true"><i id="hp" style="width:100%"></i></div>
<span>CREDITS <b id="cr">0</b></span>
<span>ČAS <b id="tm">--</b></span>
<button class="b" id="mu" style="margin:0" aria-label="Zvuk">🔊</button>
</div>
<main id="scr"></main>
</div>
<div class="crt"></div>
<script>
const $=i=>document.getElementById(i);
const F=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const hex=v=>'#'+v.map(x=>('0'+x.toString(16)).slice(-2)).join('').toUpperCase();
let S,AC,mute=false,tm=null,raf=0;
const scr=h=>{$('scr').innerHTML=h};
function beep(f,d=.12,t='square'){if(mute)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function fx(ok){const a=$('app');a.classList.remove('good','bad');void a.offsetWidth;a.classList.add(ok?'good':'bad');ok?(beep(660,.08),setTimeout(()=>beep(990,.1),90)):beep(120,.3,'sawtooth')}
function hud(){$('hp').style.width=S.hp+'%';$('hpn').textContent=S.hp+'%';$('cr').textContent=F(S.cr);$('nd').textContent=S.n==null?'--':'0'+(S.n+1)+'/0'+N.length}
function stop(){clearInterval(tm);cancelAnimationFrame(raf)}
function hit(n){S.hp=Math.max(0,S.hp-n);S.miss++;fx(0);hud();if(S.hp<=0){end(true);return true}return false}
function gain(n){S.cr+=n;fx(1);hud()}
function clock(sec,cb){clearInterval(tm);let t=sec;const u=()=>{$('tm').textContent=String(t).padStart(2,'0')+'s';$('tm').classList.toggle('warn',t<=10)};u();tm=setInterval(()=>{t--;u();if(t<=0){clearInterval(tm);cb()}},1000);return()=>t}
$('mu').onclick=()=>{mute=!mute;$('mu').textContent=mute?'🔇':'🔊'};

const N=[
{t:'PIXEL & FILE MATRIX',th:`<b class="lm">PIXEL = picture element</b>, nejmenší bod obrazu.<br>JPG: ztrátová komprese, malé fotky.<br>PNG: bez ztrát, průhlednost.<br>GIF: 256 barev, jednoduchá animace.<br>RAW: surová data z čipu fotoaparátu.<br><span class="dim">Úkol: 8 datových balíčků padá dolů. Roztřiď je do kontejnerů dřív, než dopadnou. Balíčky padají pomalu, na čtení máš čas. Chyba = −20 % integrity.</span>`,run:n1},
{t:'RGB FREQUENCY MIXER',th:`Světlo displeje se míchá z <b style="color:var(--mg)">R</b>ed, <b class="lm">G</b>reen a <b style="color:var(--cy)">B</b>lue.<br>8 bitů na barvu, 3 barvy = <b class="lm">24 bitů</b>.<br>2²⁴ = 256 · 256 · 256 = <b class="lm">16 777 216</b> odstínů.<br><span class="dim">Úkol: namíchej 3 cílové frekvence (tolerance ±4 na kanál). Chyba = −10 %.</span>`,run:n2},
{t:'RESOLUTION OVERDRIVE',th:`VGA 640 × 480 · HD ready 1280 × 720 · Full HD 1920 × 1080 · 4K 3840 × 2160.<br>Poměry stran: 3:2 (fotoaparát 📷), 4:3, 16:9. Megapixely = šířka × výška ÷ 1 000 000.<br><span class="dim">Úkol: správnou odpovědí zaostříš rozmazaný signál. 5 signálů. Chyba = −15 %.</span>`,run:n3},
{t:'DENSITY CALCULATOR',th:`<b class="lm">1″ = 25,4 mm</b>. PPI = pixely na palec obrazovky, DPI = body na palec při tisku.<br>PPI = √(šířka² + výška²) ÷ úhlopříčka. Stejné rozlišení na větší úhlopříčce (55″ → 65″) znamená nižší PPI.<br><span class="dim">Úkol: 5 výpočtů, každý do 20 s. Chyba nebo čas = −15 až −20 %.</span>`,run:n4},
{t:'RGB COMBINATION LOCK',th:`Zámek zná jen číselnou kombinaci R, G, B. Každá hodnota je 0 až 255 (8 bitů, např. 165 = 10100101).<br>24 bitů = 3 × 8 bitů, 2²⁴ = 256 · 256 · 256 = <b class="lm">16 777 216</b> odstínů.<br><span class="dim">Úkol: přesně nastav posuvníky podle kombinace (tolerance ±2). 3 kódy. Chyba = −10 %.</span>`,run:n5}];

function intro(){stop();S={hp:100,cr:0,n:null,miss:0};hud();$('tm').textContent='--';
scr(`<h1>NETRUNNER 2088</h1><div class="panel">Rok 2088. Jsi Netrunner a vnikáš do mainframe megakorporace <b class="lm">PIXELCORP</b>. Každý uzel je chráněn šifrou postavenou na principech digitálního obrazu. Vyřeš 5 úkolů, než ti systém zničí integritu terminálu.</div><p class="dim">Pozn.: „HD ready 720×“ z tabule znamená 1280 × 720.</p><button class="b" id="go">▶ Zahájit průnik</button>`);$('go').onclick=()=>node(0)}
function node(i){stop();S.n=i;hud();$('tm').textContent='--';const x=N[i];
scr(`<h2>UZEL 0${i+1}: ${x.t}</h2><div class="panel">${x.th}</div><button class="b" id="go">▶ Spustit hack</button>`);$('go').onclick=x.run}
function done(m){stop();scr(`<h2>UZEL PROLOMEN ✔</h2><div class="panel">${m}<br>Credits: <b class="lm">${F(S.cr)}</b> · Integrita: <b class="lm">${S.hp}%</b></div><button class="b" id="nx">${S.n<N.length-1?'▶ Další uzel':'▶ Výsledky'}</button>`);$('nx').onclick=()=>S.n<N.length-1?node(S.n+1):end(false)}
function end(dead){stop();$('tm').textContent='--';const c=S.cr,rk=c<900?'NOVICE':c<1700?'SCRIPT KIDDIE':c<2500?'NETRUNNER':'CYBER-DECK MASTER';
scr(`<h1 class="${dead?'red':''}">${dead?'SPOJENÍ PŘERUŠENO':'MAINFRAME PROLOMEN'}</h1><div class="panel">${dead?'Terminál byl zničen v uzlu 0'+(S.n+1)+'.<br>':''}CREDITS: <b class="lm">${F(c)}</b><br>INTEGRITA: <b class="lm">${S.hp}%</b><br>CHYB: <b class="lm">${S.miss}</b><br>HODNOST: <b class="lm">${rk}</b></div><button class="b" id="rs">↻ Restart</button>`);$('rs').onclick=intro}

function n1(){const B=['JPG','PNG','GIF','RAW'],P=sh([['Potřebujeme průhledné pozadí loga',1],['Beztrátový záznam z čipu fotoaparátu',3],['Animovaný efekt, jen 256 barev',2],['Malá fotka na web',0],['Screenshot bez ztráty kvality',1],['Smyčka animace do chatu',2],['Surová data pro profi retuš',3],['Fotka z dovolené do e-mailu',0]]);let i=0,y=0,c;
scr(`<h2>UZEL 01: PIXEL & FILE MATRIX</h2><div id="arena"><div id="pk" class="pk"></div></div><div class="bins" id="bn"></div><p class="dim" id="msg">Balíček 1/8</p>`);
const get=clock(120,()=>{if(!hit(25))done('Čas vypršel, část balíčků zůstala nezpracována.')});
const spawn=()=>{if(i>=8){const b=get()*3;gain(b);return done('Matrix roztříděna. Bonus za čas: +'+b+' CR')}c=P[i];y=-10;$('pk').textContent=c[0];$('msg').textContent='Balíček '+(i+1)+'/8'};
const tick=()=>{if(!$('pk'))return;y+=.2+i*.015;$('pk').style.transform='translateY('+y+'px)';if(y>135){if(hit(20))return;i++;spawn()}raf=requestAnimationFrame(tick)};
B.forEach((n,k)=>{const b=document.createElement('button');b.className='b';b.textContent=n;b.onclick=()=>{if(k==c[1])gain(100);else if(hit(20))return;i++;spawn()};$('bn').appendChild(b)});
spawn();raf=requestAnimationFrame(tick)}

function n2(){let r=0;const rnd=()=>Math.floor(Math.random()*256),get=clock(100,()=>{if(!hit(25))done('Čas vypršel, frekvence nesladěna.')});
const round=()=>{if(r==3){const b=get()*3;gain(b);return done('Všechny frekvence sladěny. Bonus za čas: +'+b+' CR')}
const T=[rnd(),rnd(),rnd()],A=['#ff0055','#39ff14','#00f3ff'];
scr(`<h2>UZEL 02: RGB FREQUENCY MIXER</h2><p class="dim">Frekvence ${r+1}/3. Namíchej cílovou barvu.</p><div class="two"><div><p>CÍL: <b class="lm">rgb(${T.join(', ')})</b> · <b class="lm">${hex(T)}</b></p><div class="sw" style="background:rgb(${T})"></div></div><div><p>TVŮJ SIGNÁL: <b id="yv"></b></p><div class="sw" id="ys"></div></div></div>`+
['R','G','B'].map((c,i)=>`<label class="sl">${c}<input type="range" min="0" max="255" value="0" id="s${i}" style="accent-color:${A[i]}"><output id="o${i}">0</output></label>`).join('')+
`<div class="panel" id="bd"></div><button class="b" id="ck">▶ Prolomit frekvenci</button><p id="msg"></p>`);
const v=()=>[0,1,2].map(i=>+$('s'+i).value);
const up=()=>{const a=v();a.forEach((x,i)=>$('o'+i).textContent=x);$('ys').style.background='rgb('+a+')';$('yv').textContent='rgb('+a.join(', ')+') · '+hex(a);
$('bd').innerHTML='R 8 bit + G 8 bit + B 8 bit = <b class="lm">24 bit</b><br>2²⁴ = 256 · 256 · 256 = <b class="lm">16 777 216</b> odstínů<br>Tvůj odstín: č. <b class="lm">'+F(a[0]*65536+a[1]*256+a[2]+1)+'</b> z 16 777 216'};
[0,1,2].forEach(i=>$('s'+i).oninput=up);up();
$('ck').onclick=()=>{const bad=v().map((x,i)=>Math.abs(x-T[i])>4?'RGB'[i]+(x>T[i]?' ▼ méně':' ▲ více'):'').filter(Boolean);
if(!bad.length){gain(150);r++;$('ck').disabled=true;setTimeout(round,700)}else{if(hit(10))return;$('msg').textContent='CHYBA FREKVENCE: '+bad.join(' | ')}}};
round()}

function n3(){const RL=['VGA 640 × 480','HD ready 1280 × 720','Full HD 1920 × 1080','4K 3840 × 2160'],RT=['3:2','4:3','16:9'];
const Q=[{s:'Poměr 16:9, asi 2 Mpx. Které je to rozlišení?',ar:'16/9',o:RL,a:2},{s:'Rozlišení 640 × 480. Jaký je poměr stran?',ar:'4/3',o:RT,a:1},{s:'Poměr 16:9, asi 8,3 Mpx. Které je to rozlišení?',ar:'16/9',o:RL,a:3},{s:'Rozlišení 1280 × 720 se jmenuje…',ar:'16/9',o:['VGA','HD ready','Full HD','4K'],a:1},{s:'Typický poměr stran fotoaparátu 📷 je…',ar:'3/2',o:RT,a:0}];
let r=0;const get=clock(80,()=>{if(!hit(25))done('Čas vypršel, signál zůstal rozmazaný.')});
const round=()=>{if(r==Q.length){const b=get()*3;gain(b);return done('Obraz zaostřen. Bonus za čas: +'+b+' CR')}
const q=Q[r];scr(`<h2>UZEL 03: RESOLUTION OVERDRIVE</h2><p>Signál ${r+1}/${Q.length}: ${q.s}</p><div class="sig" id="sg" style="aspect-ratio:${q.ar}">SIGNÁL PORUŠEN</div><div id="op"></div>`);
q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='b';b.textContent=t;b.onclick=()=>{if(i==q.a){gain(120);$('sg').style.filter='blur(0)';$('sg').textContent='ZAOSTŘENO';[...$('op').children].forEach(x=>x.disabled=true);b.classList.add('okb');r++;setTimeout(round,900)}else if(hit(15))return};$('op').appendChild(b)})};
round()}

function n4(){const Rs=[[1920,1080,'Full HD'],[3840,2160,'4K']],pp=(w,h,d)=>Math.round(Math.hypot(w,h)/d),d0=[32,43,50,55,65][Math.floor(Math.random()*5)];
const Q=[{s:`Úhlopříčka ${d0}″ je kolik milimetrů? (1″ = 25,4 mm)`,a:+(d0*25.4).toFixed(1),w:[d0*2.54,d0*25,d0*24].map(x=>+x.toFixed(1)),u:' mm'}];
[[0,55],[1,55],[1,65],[0,65]].forEach(([k,d])=>{const R=Rs[k],a=pp(R[0],R[1],d);Q.push({s:`Displej ${R[2]} (${R[0]} × ${R[1]}) s úhlopříčkou ${d}″. Kolik má PPI?`,a,w:[Math.round(a*2),Math.round(a/2),Math.round(a*1.4)],u:' PPI'})});
let i=0,get;
const ask=()=>{if(i==Q.length){return done('Displej zkalibrován.')}
const q=Q[i],o=sh([q.a,...q.w]);scr(`<h2>UZEL 04: DENSITY CALCULATOR</h2><p class="dim">Výpočet ${i+1}/${Q.length}. Limit 20 s.</p><p>${q.s}</p><div id="op">`+o.map(v=>`<button class="b" data-v="${v}">${String(v).replace('.',',')}${q.u}</button>`).join('')+`</div><div class="panel dim">PPI = √(šířka² + výška²) ÷ úhlopříčka · 1″ = 25,4 mm</div>`);
const ans=v=>{clearInterval(tm);const t=get();document.querySelectorAll('[data-v]').forEach(b=>{b.disabled=true;if(+b.dataset.v==q.a)b.classList.add('okb')});
if(v===q.a)gain(100+t*5);else if(hit(v===null?15:20))return;i++;setTimeout(ask,1000)};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>ans(+b.dataset.v));
get=clock(20,()=>ans(null))};
ask()}

function n5(){const C=[[255,165,0,'oranžová'],[75,0,130,'indigo'],[0,255,127,'jarně zelená']],A=['#ff0055','#39ff14','#00f3ff'];let r=0;const get=clock(120,()=>{if(!hit(25))done('Čas vypršel, zámek zůstal zavřený.')});
const round=()=>{if(r==3){const b=get()*3;gain(b);return done('Zámek otevřen. Bonus za čas: +'+b+' CR')}
const T=C[r],bin=T.slice(0,3).map(x=>x.toString(2).padStart(8,'0')).join(' · ');
scr(`<h2>UZEL 05: RGB COMBINATION LOCK</h2><p class="dim">Kód ${r+1}/3. Nastav posuvníky přesně podle kombinace (±2).</p><div class="panel">KOMBINACE: R = <b class="lm">${T[0]}</b> · G = <b class="lm">${T[1]}</b> · B = <b class="lm">${T[2]}</b><br><span class="dim">V bitech: ${bin}<br>Nápověda: odstín se jmenuje ${T[3]}.</span></div><p>TVŮJ ODSTÍN: <b id="yv"></b></p><div class="sw" id="ys"></div>`+
['R','G','B'].map((c,i)=>`<label class="sl">${c}<input type="range" min="0" max="255" value="0" id="s${i}" style="accent-color:${A[i]}"><output id="o${i}">0</output></label>`).join('')+
`<button class="b" id="ck">▶ Odemknout</button><p id="msg"></p>`);
const v=()=>[0,1,2].map(i=>+$('s'+i).value);
const up=()=>{const a=v();a.forEach((x,i)=>$('o'+i).textContent=x);$('ys').style.background='rgb('+a+')';$('yv').textContent='rgb('+a.join(', ')+') · '+hex(a)};
[0,1,2].forEach(i=>$('s'+i).oninput=up);up();
$('ck').onclick=()=>{const bad=v().map((x,i)=>Math.abs(x-T[i])>2?'RGB'[i]+(x>T[i]?' ▼ méně':' ▲ více'):'').filter(Boolean);
if(!bad.length){gain(150);r++;$('ck').disabled=true;setTimeout(round,700)}else{if(hit(10))return;$('msg').textContent='ZÁMEK ODMÍTL: '+bad.join(' | ')}}};
round()}

intro();
</script>
