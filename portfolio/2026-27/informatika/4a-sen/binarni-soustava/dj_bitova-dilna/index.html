<!doctype html>
<html lang="cs">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitová dílna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interaktivní výuka dvojkové a šestnáctkové soustavy: 18 lekcí od úplných základů, nástroje s postupem, 12 her, denní výzvy, vstupní test a laboratoř s logickými obvody, procesorem a qubity.">
<link rel="stylesheet" href="vendor/pisma/pisma.css">
<style>
/* Layout: pracovní sešit na milimetrovém papíře – úzký čtecí sloupec pro lekce,
   širší „pracovní deska" pro nástroje a hry. Hrdinou je modrý DIP přepínač s LED
   a sedmisegmentovým displejem. */
:root {
  --paper: #FAF8F3;
  --paper-2: #F1ECE1;
  --panel: #FFFFFF;
  --grid: rgba(210, 120, 60, .075);
  --grid-major: rgba(210, 120, 60, .15);
  --ink: #18202F;
  --ink-2: #485065;
  --ink-3: #6F7688;
  --line: #DED6C6;
  --line-2: #C7BCA7;
  --led: #E5432A;
  --led-hi: #FF8A66;
  --led-glow: rgba(229, 67, 42, .45);
  --led-off: #E9E1D3;
  --led-off-ink: #9A9282;
  --on-led: #FFFFFF;
  --dip: #2247B3;
  --dip-deep: #172F7A;
  --dip-knob: #FBFAF6;
  --dip-ink: #E8EEFF;
  --tape: #18202F;
  --tape-ink: #F7F2E8;
  --ok: #16784A;
  --ok-bg: #E2F1E7;
  --on-ok: #FFFFFF;
  --bad: #B0233D;
  --bad-bg: #FBE5E8;
  --on-bad: #FFFFFF;
  --warn: #8F5E00;
  --warn-bg: #FAEFD6;
  --hl: #FFE58F;
  --nib-a: rgba(34, 71, 179, .09);
  --nib-b: rgba(229, 67, 42, .09);
  --seg-bg: #1B1412;
  --seg-on: #FF5533;
  --seg-off: rgba(255, 85, 51, .11);
  --wheel-1: #2E2824;
  --wheel-2: #0F0C0B;
  --wheel-ink: #F5F0E6;
  --key-border: #18202F;
  --key-shadow: #18202F;
  --focus: #2247B3;
  --ch-r: #C81E3A;
  --bench-shadow: #18202F;
  --ch-g: #17803F;
  --ch-b: #2554D0;
  --shadow: 0 1px 0 rgba(24, 32, 47, .04), 0 10px 28px -16px rgba(24, 32, 47, .35);

  --font-display: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;

  --max: 1160px;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F131C; --paper-2: #161C28; --panel: #181F2C;
    --grid: rgba(255, 140, 80, .04); --grid-major: rgba(255, 140, 80, .08);
    --ink: #ECE6DA; --ink-2: #B3B8C5; --ink-3: #8A90A0;
    --line: #283043; --line-2: #3A4459;
    --led: #FF5A3C; --led-hi: #FF9C80; --led-glow: rgba(255, 90, 60, .55);
    --led-off: #262D3B; --led-off-ink: #6E7586; --on-led: #FFFFFF;
    --dip: #3560DD; --dip-deep: #1D3A94; --dip-knob: #F1EDE4; --dip-ink: #E8EEFF;
    --tape: #ECE6DA; --tape-ink: #0F131C;
    --ok: #4CC08A; --ok-bg: rgba(76, 192, 138, .14); --on-ok: #06140D;
    --bad: #FF6F86; --bad-bg: rgba(255, 111, 134, .14); --on-bad: #1A0508;
    --warn: #F0B44C; --warn-bg: rgba(240, 180, 76, .14);
    --hl: rgba(255, 214, 102, .3);
    --nib-a: rgba(90, 130, 255, .16); --nib-b: rgba(255, 90, 60, .14);
    --seg-bg: #0A0C11; --seg-on: #FF5A3C; --seg-off: rgba(255, 90, 60, .09);
    --wheel-1: #262A33; --wheel-2: #090B0F; --wheel-ink: #F5F0E6;
    --key-border: #4A5570; --key-shadow: #05070B; --focus: #8FA9FF;
    --ch-r: #FF6B7F; --ch-g: #4CD07D; --ch-b: #7FA2FF; --bench-shadow: #2A4FBF;
    --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 12px 30px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F131C; --paper-2: #161C28; --panel: #181F2C;
  --grid: rgba(255, 140, 80, .04); --grid-major: rgba(255, 140, 80, .08);
  --ink: #ECE6DA; --ink-2: #B3B8C5; --ink-3: #8A90A0;
  --line: #283043; --line-2: #3A4459;
  --led: #FF5A3C; --led-hi: #FF9C80; --led-glow: rgba(255, 90, 60, .55);
  --led-off: #262D3B; --led-off-ink: #6E7586; --on-led: #FFFFFF;
  --dip: #3560DD; --dip-deep: #1D3A94; --dip-knob: #F1EDE4; --dip-ink: #E8EEFF;
  --tape: #ECE6DA; --tape-ink: #0F131C;
  --ok: #4CC08A; --ok-bg: rgba(76, 192, 138, .14); --on-ok: #06140D;
  --bad: #FF6F86; --bad-bg: rgba(255, 111, 134, .14); --on-bad: #1A0508;
  --warn: #F0B44C; --warn-bg: rgba(240, 180, 76, .14);
  --hl: rgba(255, 214, 102, .3);
  --nib-a: rgba(90, 130, 255, .16); --nib-b: rgba(255, 90, 60, .14);
  --seg-bg: #0A0C11; --seg-on: #FF5A3C; --seg-off: rgba(255, 90, 60, .09);
  --wheel-1: #262A33; --wheel-2: #090B0F; --wheel-ink: #F5F0E6;
  --key-border: #4A5570; --key-shadow: #05070B; --focus: #8FA9FF;
  --ch-r: #FF6B7F; --ch-g: #4CD07D; --ch-b: #7FA2FF; --bench-shadow: #2A4FBF;
  --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 12px 30px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

/* ---------- základ ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 96px; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
  background-position: -1px -1px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--paper);
}
[hidden] { display: none !important; }
img, svg { max-width: 100%; }
a { color: inherit; text-decoration-thickness: 1.5px; text-underline-offset: 3px; text-decoration-color: var(--led); }
a:hover { color: var(--led); }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }
::selection { background: var(--hl); color: var(--ink); }
button { font: inherit; color: inherit; }
p { margin: 0; }
h1, h2, h3, h4 {
  font-family: var(--font-display); font-stretch: 125%; font-weight: 800;
  line-height: 1.08; letter-spacing: -.01em; text-wrap: balance; margin: 0;
}
h1 { font-size: clamp(2rem, 1.35rem + 2.9vw, 3.1rem); }
h2 { font-size: clamp(1.4rem, 1.15rem + 1.1vw, 1.85rem); }
h3, .h3 { font-size: 1.15rem; font-stretch: 112%; font-weight: 800; }
.lead { font-size: 1.14rem; color: var(--ink-2); max-width: 62ch; }
.small { font-size: .875rem; }
.muted { color: var(--ink-2); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }
code, kbd {
  font-family: var(--font-mono); font-size: .86em; background: var(--paper-2);
  border: 1px solid var(--line); border-radius: 4px; padding: .05em .35em;
}
kbd { border-bottom-width: 2px; }
sub { font-size: .6em; vertical-align: -.34em; line-height: 0; font-family: var(--font-mono); letter-spacing: 0; font-weight: 600; }
sup { font-size: .62em; line-height: 0; }
dfn { font-style: normal; font-weight: 700; background: linear-gradient(transparent 58%, var(--hl) 58%); }
.lbl {
  font: 600 .68rem/1.15 var(--font-mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3);
}
.tape {
  display: inline-block; justify-self: start; align-self: start;
  font: 700 .7rem/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase;
  background: var(--tape); color: var(--tape-ink); padding: .46em .72em .4em; border-radius: 2px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -1px 0 rgba(0, 0, 0, .3);
  white-space: nowrap;
}
.tape.red { background: var(--led); color: var(--on-led); }
.tape.blue { background: var(--dip); color: var(--dip-ink); }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

.wrap {
  max-width: var(--max); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { display: block; padding-block: 28px 72px; outline: none; }

/* ---------- tlačítka ---------- */
.key {
  font: 650 .95rem/1.15 var(--font-body); color: var(--ink); background: var(--panel);
  border: 1.5px solid var(--key-border); border-radius: 6px; padding: .6em 1em; min-height: 44px;
  box-shadow: 0 3px 0 var(--key-shadow); cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: .45em;
  transition: transform .06s ease, box-shadow .06s ease, background .15s;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; text-align: center;
}
.key:hover { color: var(--ink); background: var(--paper-2); }
.key:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-shadow); }
.key.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.key.primary:hover { color: var(--paper); background: var(--ink); filter: brightness(1.15); }
.key.sm { min-height: 36px; padding: .38em .75em; font-size: .86rem; }
.key.big { min-height: 52px; padding: .7em 1.3em; font-size: 1.02rem; }
.key:disabled { opacity: .42; cursor: not-allowed; }
.key kbd { background: transparent; border-color: currentColor; opacity: .7; font-size: .72em; }
@media (hover: none) and (pointer: coarse) { .key kbd { display: none; } }
.chip {
  font: 600 .85rem/1 var(--font-body); padding: .55em .85em; border-radius: 999px; cursor: pointer;
  background: var(--panel); color: var(--ink-2); border: 1.5px solid var(--line-2);
  display: inline-flex; align-items: center; gap: .45em; min-height: 36px;
}
.chip:hover { color: var(--ink); border-color: var(--ink); }
.chip.on, .chip[aria-checked="true"], .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid var(--line-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.seg-mini { display: flex; flex-wrap: wrap; gap: 6px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 6px; border: 1.5px solid var(--line-2); background: var(--panel);
  display: grid; place-items: center; cursor: pointer; color: var(--ink);
}
.icon-btn:hover { border-color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn .off-line { display: none; }
.icon-btn[aria-pressed="false"] .off-line { display: inline; }
.icon-btn[aria-pressed="false"] .wave { display: none; }

/* ---------- hlavička ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--paper); border-bottom: 1.5px solid var(--ink);
}
.top-in { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 18px; min-height: 62px; }
.brand {
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink);
  font-family: var(--font-display); font-stretch: 125%; font-weight: 900; font-size: 1.12rem;
  letter-spacing: -.01em; padding-block: 10px; white-space: nowrap;
}
.brand:hover { color: var(--ink); }
.brand-leds { display: inline-flex; gap: 3px; padding: 5px 6px; background: var(--dip); border-radius: 3px; box-shadow: inset 0 -2px 0 var(--dip-deep); }
.brand-leds i { width: 8px; height: 8px; border-radius: 50%; background: var(--dip-deep); }
.brand-leds i.on { background: var(--led); box-shadow: 0 0 6px var(--led-glow); }
.nav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  font-weight: 600; font-size: .95rem; text-decoration: none; color: var(--ink-2);
  padding: 8px 12px; border-radius: 5px; white-space: nowrap;
}
.nav a:hover { color: var(--ink); background: var(--paper-2); }
.nav a.active { color: var(--ink); background: var(--paper-2); box-shadow: inset 0 -2.5px 0 var(--led); }
.top-tools { display: flex; gap: 6px; }
@media (max-width: 760px) {
  .top-in { min-height: 54px; }
  .nav { order: 3; flex-basis: 100%; margin-left: 0; padding-bottom: 6px; }
  .top-tools { margin-left: auto; }
}

/* ---------- patička ---------- */
.foot { border-top: 1.5px solid var(--ink); background: var(--paper); }
.foot .wrap { padding-block: 22px 30px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; font-size: .88rem; color: var(--ink-2); }
.foot .reset { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- obecné bloky ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; min-width: 0; }
.pg-head { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding-block: 6px 28px; max-width: 780px; }
.crumbs { font-size: .9rem; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.crumbs a { color: var(--ink-2); }
.sec { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; margin-top: 56px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; }
.sec-head p { color: var(--ink-2); max-width: 60ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .7rem; padding: .3em .55em; border-radius: 3px; background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.formula {
  font-family: var(--font-mono); font-size: .98rem; background: var(--paper-2); border-radius: 5px;
  padding: 12px 16px; text-align: center; overflow-x: auto; white-space: nowrap; max-width: 100%;
}
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); max-width: 100%; }
.tbl-wrap.tall { max-height: 460px; overflow-y: auto; }
table.data { border-collapse: collapse; width: 100%; font-size: .95rem; }
table.data th, table.data td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data th { font: 600 .68rem/1.2 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); background: var(--paper-2); position: sticky; top: 0; }
table.data td.mono, table.data .mono { font-size: .9rem; }
table.data tr:last-child td { border-bottom: 0; }
table.data tbody tr:hover td { background: var(--paper-2); }
table.data tr.mark td { background: var(--hl); }
.inp {
  font: 600 1rem/1.2 var(--font-mono); padding: .6em .75em; border: 1.5px solid var(--line-2);
  border-radius: 6px; background: var(--panel); color: var(--ink); min-width: 0; width: 13em; max-width: 100%;
}
.inp.big { font-size: 1.25rem; width: 14em; }
.inp.wide { width: 22em; }
.inp:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.inp:disabled { opacity: .75; }
.inp.ok { border-color: var(--ok); background: var(--ok-bg); }
.inp.bad { border-color: var(--bad); background: var(--bad-bg); }
details.more { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 12px 16px; background: var(--paper-2); }
details.more summary { cursor: pointer; font-weight: 700; }
details.more[open] { display: grid; gap: 10px; }
.shake { animation: shake .38s; }
.center { text-align: center; }
.mt { margin-top: 14px; }
.w-input .inp.short { width: 8.5em; }

/* ---------- úvod ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.02fr); gap: 44px; align-items: center; padding-block: 18px 12px; }
.hero-text { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; min-width: 0; }
.hero-bits { font-size: .78rem; letter-spacing: .18em; color: var(--led); font-weight: 600; }
.hero h1 { font-size: clamp(2.7rem, 1.4rem + 5vw, 5.1rem); font-weight: 900; line-height: .94; letter-spacing: -.025em; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }
.hero-bench {
  background: var(--panel); border: 1.5px solid var(--ink); border-radius: 10px; padding: 20px 16px 18px;
  box-shadow: 7px 7px 0 var(--bench-shadow); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0;
}
.bench-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.bench-task { font-size: .98rem; }
.bench-task b { font-family: var(--font-mono); background: var(--hl); padding: 0 .3em; border-radius: 3px; }
.bench-tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; gap: 30px; } }

.path { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; counter-reset: path; }
.path li { list-style: none; counter-increment: path; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.path li > a { margin-top: auto; padding-top: 4px; }
.path li::before { content: counter(path); width: 30px; height: 30px; display: grid; place-items: center; background: var(--dip); color: var(--dip-ink); font: 700 .85rem/1 var(--font-mono); border-radius: 3px; }
.path { padding: 0; margin: 0; }
@media (max-width: 760px) { .path { grid-template-columns: 1fr; } }

.parts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1000px) { .parts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .parts { grid-template-columns: 1fr; } }
.part-card { display: grid; gap: 10px; align-content: start; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.part-card h3 { display: flex; gap: 10px; align-items: baseline; }
.part-n { font-family: var(--font-mono); color: var(--led); font-size: .95rem; }
.part-bar { height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; }
.part-bar i { display: block; height: 100%; background: var(--led); border-radius: 3px; }
.part-card ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .92rem; }
.part-card ol a { text-decoration: none; display: flex; gap: 8px; align-items: baseline; color: var(--ink-2); }
.part-card ol a:hover { color: var(--ink); }
.part-card ol a .mono { font-size: .75rem; color: var(--ink-3); }
.part-card ol a.done { color: var(--ink); }
.part-card ol a.done .mono { color: var(--ok); }

.gcards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .gcards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .gcards { grid-template-columns: minmax(0, 1fr); } }
.gcard {
  display: grid; grid-template-rows: auto 1fr; text-decoration: none; color: inherit; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; transition: border-color .15s, transform .15s;
}
.gcard:hover { color: inherit; border-color: var(--ink); transform: translateY(-2px); }
.gcard-pv { height: 96px; background: var(--seg-bg); display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; overflow: hidden; color: var(--wheel-ink); }
.gcard-body { padding: 16px 18px 16px; display: grid; gap: 8px; align-content: start; }
.gcard-body p { font-size: .93rem; color: var(--ink-2); }
.gbest { display: flex; gap: 10px; margin-top: 4px; }
.gbest span { display: inline-flex; align-items: center; gap: 4px; font: 600 .7rem/1 var(--font-mono); color: var(--ink-3); }
.gbest i { width: 8px; height: 8px; border-radius: 50%; background: var(--led-off); }
.gbest .has { color: var(--ink); }
.gbest .has i { background: var(--led); box-shadow: 0 0 5px var(--led-glow); }

/* náhledy her */
.pv-t { font-size: 1.05rem; font-weight: 700; color: var(--wheel-ink); }
.pv-t sub, .pv-q { color: var(--seg-on); }
.pv-q { margin-inline: .25em; }
.pv-dip { display: flex; gap: 4px; background: var(--dip); padding: 8px 6px; border-radius: 3px; }
.pv-dip i { width: 14px; height: 22px; background: var(--dip-deep); border-radius: 2px; position: relative; }
.pv-dip i::after { content: ""; position: absolute; left: 2px; right: 2px; height: 9px; bottom: 2px; background: var(--dip-knob); border-radius: 1px; }
.pv-dip i.on::after { bottom: auto; top: 2px; }
.pv-card { font-size: .85rem; font-weight: 700; background: var(--panel); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 5px; padding: 18px 10px; }
.pv-drop { position: absolute; left: var(--x); top: var(--y); font-size: .85rem; font-weight: 700; background: var(--panel); color: var(--ink); padding: 3px 7px; border-radius: 4px; }
.pv-pix { display: grid; grid-template-columns: repeat(8, 8px); gap: 2px; }
.pv-pix i { width: 8px; height: 8px; background: rgba(255, 255, 255, .08); border-radius: 1px; }
.pv-pix i.on { background: var(--seg-on); }
.pv-sw { width: 54px; height: 54px; border-radius: 6px; background: var(--c); border: 2px solid var(--wheel-ink); }
.pv-col { font-size: .78rem; line-height: 1.35; white-space: pre; color: var(--wheel-ink); text-align: right; }

.progress-box { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 14px; }
@media (max-width: 860px) { .progress-box { grid-template-columns: 1fr; } }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--paper-2); border-radius: 5px; padding: 12px 14px; display: grid; gap: 4px; }
.stat b { font: 700 1.5rem/1 var(--font-mono); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 10px; }
.badge { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 5px; border: 1.5px dashed var(--line-2); color: var(--ink-3); }
.badge i { grid-row: span 2; width: 16px; height: 16px; border-radius: 50%; background: var(--led-off); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .2); }
.badge b { color: var(--ink-2); font-size: .92rem; }
.badge span { font-size: .8rem; }
.badge.got { border-style: solid; border-color: var(--ink); color: var(--ink-2); background: var(--panel); }
.badge.got b { color: var(--ink); }
.badge.got i { background: radial-gradient(circle at 35% 30%, var(--led-hi), var(--led) 62%); box-shadow: 0 0 10px var(--led-glow); }

/* ---------- seznam lekcí ---------- */
.lpart { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 34px; }
.lpart h2 { display: flex; gap: 12px; align-items: baseline; font-size: 1.4rem; }
.lpart-n { font: 700 .95rem/1 var(--font-mono); color: var(--led); }
.lrows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.lrow {
  display: grid; grid-template-columns: 54px minmax(0, 1fr) auto 18px; gap: 16px; align-items: center;
  padding: 14px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  text-decoration: none; color: inherit; transition: border-color .15s;
}
.lrow:hover { color: inherit; border-color: var(--ink); }
.lrow-n { font: 700 1.25rem/1 var(--font-mono); color: var(--ink-3); }
.lrow-t { display: grid; gap: 2px; }
.lrow-t b { font-size: 1.05rem; }
.lrow-t span { color: var(--ink-2); font-size: .92rem; }
.lrow-m { color: var(--ink-3); white-space: nowrap; font-family: var(--font-mono); font-size: .75rem; }
.lrow-led { width: 14px; height: 14px; border-radius: 50%; background: var(--led-off); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .2); }
.lrow.done .lrow-led { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.lrow.done .lrow-n { color: var(--ok); }
@media (max-width: 560px) {
  .lrow { grid-template-columns: 40px minmax(0, 1fr) 14px; gap: 12px; padding: 12px 14px; }
  .lrow-m { display: none; }
}
.prog-line { display: flex; align-items: center; gap: 12px; font-size: .92rem; color: var(--ink-2); }
.prog-line .part-bar { flex: 1; max-width: 280px; }

/* ---------- lekce ---------- */
.lesson-layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 52px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); max-height: calc(100vh - 110px); overflow: auto; padding: 4px 6px 20px 0; display: grid; gap: 16px; font-size: .88rem; }
.toc-part { display: grid; gap: 2px; }
.toc-part .lbl { margin-bottom: 4px; }
.toc a { text-decoration: none; color: var(--ink-2); display: grid; grid-template-columns: 26px 1fr; gap: 4px; padding: 5px 8px; border-radius: 4px; line-height: 1.3; }
.toc a .mono { font-size: .72rem; color: var(--ink-3); padding-top: 2px; }
.toc a:hover { background: var(--paper-2); color: var(--ink); }
.toc a.cur { background: var(--ink); color: var(--paper); }
.toc a.cur .mono { color: var(--paper); }
.toc a.done .mono { color: var(--ok); }
.toc a.cur.done .mono { color: var(--paper); }
@media (max-width: 1020px) { .lesson-layout { grid-template-columns: minmax(0, 1fr); } .toc { display: none; } }
.article { max-width: 780px; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
.lesson-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; min-width: 0; }
.lesson-body > p, .lesson-body > ul, .lesson-body > ol { max-width: 68ch; }
.lesson-body > h2 { margin-top: 26px; }
.lesson-body ul, .lesson-body ol { margin: 0; padding-left: 1.3em; display: grid; gap: 7px; }
.lesson-body > .w { margin-block: 4px; min-width: 0; }
.meta { color: var(--ink-3); }
.done-tag { color: var(--ok); font-weight: 700; }
.goals, .summary { display: grid; gap: 10px; padding: 18px 20px; border-radius: var(--r); }
.goals { background: var(--panel); border: 1px solid var(--line); }
.goals ul, .summary ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.goals li, .summary li { padding-left: 24px; position: relative; }
.goals li::before { content: ""; position: absolute; left: 3px; top: .62em; width: 9px; height: 9px; border-radius: 50%; background: var(--led-off); box-shadow: inset 0 0 0 2px var(--line-2); }
.summary { background: var(--panel); border: 1.5px solid var(--ink); margin-top: 10px; }
.summary li::before { content: ""; position: absolute; left: 2px; top: .5em; width: 11px; height: 6px; border-left: 2.5px solid var(--ok); border-bottom: 2.5px solid var(--ok); transform: rotate(-45deg); }
ol.steps { list-style: none; padding: 0; counter-reset: st; display: grid; gap: 10px; }
ol.steps > li { counter-increment: st; position: relative; padding-left: 42px; min-height: 28px; }
ol.steps > li::before { content: counter(st); position: absolute; left: 0; top: -1px; width: 28px; height: 28px; display: grid; place-items: center; background: var(--dip); color: var(--dip-ink); font: 700 .82rem/1 var(--font-mono); border-radius: 3px; }
.note { position: relative; border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 24px 18px 16px; background: var(--paper-2); margin-top: 10px; display: grid; gap: 8px; }
.note > .tape:first-child { position: absolute; top: -11px; left: 14px; }
.pn { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 22px; border-top: 1.5px solid var(--ink); }
.pn .key { max-width: 100%; white-space: normal; }

.practice { display: grid; gap: 10px; margin-top: 6px; }
.practice-list { display: flex; flex-wrap: wrap; gap: 10px; }
.practice-a { display: grid; gap: 2px; text-decoration: none; padding: 10px 14px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--panel); box-shadow: 0 3px 0 var(--key-shadow); }
.practice-a:hover { color: inherit; background: var(--paper-2); }
.practice-a span { font-size: .8rem; color: var(--ink-2); }

/* ---------- bitový panel ---------- */
.bp { --cell: clamp(30px, 8.4vw, 46px); display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 14px; }
.bp.sm { --cell: clamp(25px, 6.6vw, 36px); }
.bp-byte { display: grid; justify-items: start; gap: 7px; }
.bp-row { display: flex; padding-inline: 5px; }
.bp-row > *, .bp-house > .sw-cell { width: var(--cell); flex: none; display: flex; justify-content: center; }
.bp-row > .ng, .bp-house > .ng { margin-left: 10px; }
.bp-house {
  display: flex; background: var(--dip); padding: 17px 5px 7px; border-radius: 3px; position: relative;
  box-shadow: inset 0 -3px 0 var(--dip-deep), 0 2px 0 rgba(0, 0, 0, .18);
}
.bp-house::before { content: "ON ▲"; position: absolute; top: 4px; left: 8px; font: 700 8px/1 var(--font-mono); letter-spacing: .1em; color: var(--dip-ink); opacity: .9; }
.sw {
  appearance: none; -webkit-appearance: none; border: 0; padding: 0; margin: 0;
  width: calc(var(--cell) - 10px); height: calc(var(--cell) * 1.32); border-radius: 2px;
  background: var(--dip-deep); box-shadow: inset 0 2px 4px rgba(0, 0, 0, .45);
  position: relative; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.sw::after {
  content: ""; position: absolute; left: 3px; right: 3px; top: 52%; bottom: 3px;
  background: var(--dip-knob); border-radius: 1.5px;
  box-shadow: 0 1px 0 rgba(0, 0, 0, .35), inset 0 -2px 0 rgba(0, 0, 0, .1);
  transition: top .13s cubic-bezier(.3, 1.5, .5, 1), bottom .13s cubic-bezier(.3, 1.5, .5, 1);
}
.sw[aria-pressed="true"]::after { top: 3px; bottom: 52%; }
.sw:focus-visible { outline: 2.5px solid var(--led-hi); outline-offset: 2px; }
.sw:disabled { cursor: default; }
.led {
  width: calc(var(--cell) - 10px); max-width: 32px; aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center; font: 700 clamp(.68rem, 2.4vw, .92rem)/1 var(--font-mono);
  background: var(--led-off); color: var(--led-off-ink); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .2);
  transition: background .12s, box-shadow .12s, color .12s;
}
.led.on { background: radial-gradient(circle at 35% 30%, var(--led-hi), var(--led) 62%); color: var(--on-led); box-shadow: 0 0 12px 1px var(--led-glow), inset 0 -2px 3px rgba(0, 0, 0, .2); }
.bp-w > span { font: 600 clamp(.58rem, 2.1vw, .76rem)/1.1 var(--font-mono); color: var(--ink-2); text-align: center; font-stretch: 85%; white-space: nowrap; }
.bp-w .neg { color: var(--led); }
.bp.sm .bp-w > span { font-size: clamp(.52rem, 1.8vw, .66rem); }
.bp.flash-ok .bp-house { animation: flashok .5s; }
.bp.flash-bad { animation: shake .38s; }
.bp-out { display: flex; flex-wrap: wrap; gap: 12px 18px; justify-content: center; align-items: flex-end; margin-top: 16px; }
.bp-o { display: grid; gap: 6px; justify-items: center; min-width: 0; }
.bp-o:empty { display: none; }
.bp-sum { font-family: var(--font-mono); font-size: .84rem; color: var(--ink-2); text-align: center; overflow-wrap: anywhere; }
.bp-sum b { color: var(--ink); font-size: 1.05em; }
.bp-o[data-o="sum"] { flex-basis: 100%; }
.bp-bin { font-size: 1.05rem; font-weight: 700; }

/* sedmisegmentovka */
.segs { display: inline-flex; gap: 4px; background: var(--seg-bg); padding: 9px 12px; border-radius: 5px; box-shadow: inset 0 2px 7px rgba(0, 0, 0, .55); }
.seg { width: clamp(15px, 4.2vw, 23px); height: auto; aspect-ratio: 56 / 100; transform: skewX(-6deg); }
.seg polygon { fill: var(--seg-off); }
.seg polygon.on { fill: var(--seg-on); filter: drop-shadow(0 0 2px var(--seg-on)); }
.segs.big .seg { width: clamp(22px, 6vw, 34px); }
.segs.sm .seg { width: 13px; }

/* počítadlo */
.odo { --h: clamp(46px, 11vw, 64px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; justify-items: center; padding: 20px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.odo-win { display: flex; gap: 5px; padding: 10px 12px 8px; background: var(--seg-bg); border-radius: 8px; box-shadow: inset 0 3px 8px rgba(0, 0, 0, .6); max-width: 100%; overflow-x: auto; }
.odo-col { display: grid; gap: 6px; justify-items: center; }
.odo-cell { width: calc(var(--h) * .74); height: var(--h); overflow: hidden; position: relative; border-radius: 4px; background: linear-gradient(var(--wheel-1), var(--wheel-2) 50%, var(--wheel-1)); }
.odo-cell::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(0, 0, 0, .5), transparent 28%, transparent 72%, rgba(0, 0, 0, .5)); }
.odo-cell.tick { box-shadow: 0 0 0 2px var(--led); }
.odo-strip { display: flex; flex-direction: column; transition: transform .26s cubic-bezier(.35, 1.35, .5, 1); }
.odo-strip span { height: var(--h); flex: none; display: grid; place-items: center; font: 700 calc(var(--h) * .6)/1 var(--font-mono); color: var(--wheel-ink); }
.odo-w { font: 600 .66rem/1 var(--font-mono); color: var(--wheel-ink); opacity: .6; }
.odo-read { font-size: 1rem; text-align: center; min-height: 1.6em; }
.odo-read b { font-family: var(--font-mono); }
.odo-read .over { color: var(--led); font-weight: 700; }
.odo-ctrl { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* krokovač */
.sp { border: 1.5px solid var(--ink); border-radius: var(--r); background: var(--panel); overflow: hidden; min-width: 0; }
.sp-stage { padding: 20px 16px; min-height: 140px; overflow-x: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: center; }
.sp-note { padding: 13px 16px; background: var(--paper-2); border-top: 1px solid var(--line); font-size: .98rem; min-height: 3.3em; }
.sp-ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.sp-count { font-size: .72rem; color: var(--ink-3); margin-inline: auto; padding-inline: 6px; }
.w-input { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
.w-input label { font-weight: 600; font-size: .95rem; }
.w-input .inp { width: 11em; }
.w-err { color: var(--bad); font-size: .88rem; }
.calc-line { font-family: var(--font-mono); text-align: center; font-size: 1rem; overflow-wrap: anywhere; }
.calc-line b { background: var(--hl); padding: 0 .3em; border-radius: 3px; }

/* tabulka vah */
.wt-scroll { overflow-x: auto; }
.wt { border-collapse: separate; border-spacing: 4px; font-family: var(--font-mono); margin-inline: auto; }
.wt th { font: 600 .64rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); text-align: right; padding-right: 8px; white-space: nowrap; }
.wt td { min-width: 2.7em; text-align: center; padding: 6px 5px; border-radius: 4px; background: var(--paper-2); font-size: .86rem; white-space: nowrap; }
.wt .wt-d td { font-size: 1.3rem; font-weight: 700; background: var(--panel); border: 1.5px solid var(--line-2); }
.wt .wt-d td.hot { background: var(--led); color: var(--on-led); border-color: var(--led); }
.wt td.dim { opacity: .38; }
.wt .wt-exp td { background: transparent; font-size: .72rem; color: var(--ink-3); padding-block: 0; }
.wt .wt-v td { background: transparent; color: var(--ink-2); font-size: .8rem; padding-block: 0; }
.wt .wt-p td { line-height: 1.35; }

/* Horner */
.hn { display: grid; gap: 12px; justify-items: center; }
.hn-digits { display: flex; gap: 6px; font-size: 1.3rem; font-weight: 700; }
.hn-digits span { width: 1.7em; text-align: center; padding: 4px 0; border-radius: 4px; border: 1.5px solid var(--line-2); }
.hn-digits .used { background: var(--paper-2); color: var(--ink-3); }
.hn-digits .cur { background: var(--led); color: var(--on-led); border-color: var(--led); }
.hn-t { border-collapse: collapse; font-family: var(--font-mono); font-size: .95rem; }
.hn-t td { padding: 4px 8px; text-align: right; }
.hn-t tr.new td { background: var(--hl); }
.hn-t td:first-child { text-align: right; }

/* dělení */
.dv-wrap { overflow-x: auto; }
.dv { border-collapse: collapse; font-family: var(--font-mono); margin-inline: auto; font-size: .98rem; }
.dv td, .dv th { padding: 6px 12px; text-align: right; white-space: nowrap; }
.dv th { font: 600 .64rem/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.dv td.rem { color: var(--led); border-left: 2px solid var(--ink); text-align: center; min-width: 4em; }
.dv tr.new td { background: var(--hl); }
.dv td.up { position: relative; min-width: 36px; padding: 0; }
.dv td.up::before { content: ""; position: absolute; left: 50%; top: 16px; bottom: 8px; width: 2.5px; margin-left: -1px; background: var(--led); }
.dv td.up::after { content: ""; position: absolute; left: 50%; top: 4px; margin-left: -7px; border: 7px solid transparent; border-top: 0; border-bottom: 12px solid var(--led); }

/* mince */
.coins { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.coin { min-width: 50px; height: 50px; padding: 0 8px; border-radius: 999px; display: grid; place-items: center; font: 700 .9rem/1 var(--font-mono); border: 2px solid var(--line-2); background: var(--panel); color: var(--ink-2); }
.coin.take { background: var(--led); border-color: var(--led); color: var(--on-led); }
.coin.skip { opacity: .35; text-decoration: line-through; }
.coin.cur { outline: 3px solid var(--hl); outline-offset: 2px; }
.coin-bits { display: flex; gap: 8px; justify-content: center; font-size: 1.3rem; font-weight: 700; }
.coin-bits span { min-width: 50px; text-align: center; }
.coin-bits .bq { color: var(--ink-3); opacity: .5; }
.coin-bits .b1 { color: var(--led); }

/* písemné počty */
.cols-scroll { overflow-x: auto; text-align: center; padding-bottom: 4px; }
.cols { display: inline-grid; grid-template-columns: 1.6em repeat(var(--w), 1.9em); font-family: var(--font-mono); font-size: 1.32rem; font-weight: 600; row-gap: 2px; text-align: center; }
.cols .c, .cols .c-sign { height: 1.75em; display: grid; place-items: center; border-radius: 4px; }
.cols .c-sign { color: var(--ink-2); }
.cols .carry { font-size: .66em; height: 1.5em; color: var(--led); font-weight: 800; }
.cols .c.act { background: var(--hl); }
.cols .c-rule { grid-column: 1 / -1; height: 2px; background: var(--ink); margin-block: 4px; }
.cols .part { color: var(--ink-2); }
.cols .ph { color: var(--ink-3); opacity: .5; }
.cols .res { color: var(--ink); font-weight: 800; }
.cols .drop { text-decoration: line-through; color: var(--ink-3); }
@media (max-width: 560px) { .cols { font-size: 1.08rem; } }

/* čtveřice */
.nibs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.nib { display: grid; gap: 6px; justify-items: center; padding: 8px 10px 8px; border-radius: 6px; background: var(--nib-a); min-width: 0; }
.nib:nth-child(even) { background: var(--nib-b); }
.nib .ws, .nib .bits { display: grid; grid-auto-flow: column; grid-auto-columns: 1.55rem; text-align: center; }
.nib .ws { font: 600 .58rem/1 var(--font-mono); color: var(--ink-3); }
.nib .ws i { font-style: normal; }
.nib .bits { font: 700 1.2rem/1 var(--font-mono); }
.nib .bits .pad { color: var(--ink-3); opacity: .55; }
.nib .eq { font: 500 .7rem/1 var(--font-mono); color: var(--ink-3); }
.nib .hexd { font: 800 1.55rem/1 var(--font-mono); }
.nib.flip .hexd { order: -1; }
.nib-res { text-align: center; font-family: var(--font-mono); margin-top: 12px; overflow-wrap: anywhere; }
.nib-res b { background: var(--hl); padding: 0 .3em; border-radius: 3px; }

/* pruh vah */
.wstrip { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.wcell { display: grid; gap: 4px; justify-items: center; padding: 10px 10px 8px; min-width: 58px; background: var(--panel); border: 1.5px solid var(--line-2); border-radius: 5px; }
.wcell .we { font: 500 .72rem/1 var(--font-mono); color: var(--ink-3); }
.wcell b { font: 700 1.05rem/1 var(--font-mono); }
.wcell.neg { border-color: var(--led); }
.wcell.neg b { color: var(--led); }

/* tabulky v lekcích */

.m16 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; font-family: var(--font-mono); font-size: .82rem; }
.m16 span { background: var(--panel); border-radius: 4px; padding: 6px 8px; text-align: center; white-space: nowrap; }
@media (max-width: 480px) { .m16 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.rule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.rule { display: grid; gap: 4px; padding: 12px 14px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); }

.rule span { font-size: .82rem; color: var(--ink-2); }

.truth { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.truth table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-family: var(--font-mono); }
.truth caption { font: 700 .95rem/1 var(--font-display); font-stretch: 112%; text-align: left; padding: 0 0 6px; }
.truth td, .truth th { padding: 4px 8px; text-align: center; border-bottom: 1px solid var(--line); }
.truth th { font-size: .68rem; color: var(--ink-3); }
.truth td.r { font-weight: 800; }
.truth td.r.one { color: var(--led); }

/* cvičení */
.ex { border: 1.5px solid var(--ink); border-radius: var(--r); background: var(--panel); padding: 20px 18px 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; position: relative; margin-top: 14px; }
.ex-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-right: 96px; }

.ex-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: ex; }
.ex-item { counter-increment: ex; display: grid; gap: 8px; padding: 12px 14px 12px 48px; border-radius: 6px; background: var(--paper-2); position: relative; min-width: 0; }
.ex-item::before { content: counter(ex); position: absolute; left: 13px; top: 12px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 .74rem/1 var(--font-mono); background: var(--ink); color: var(--paper); }
.ex-item.ok { background: var(--ok-bg); }
.ex-item.ok::before { content: "✓"; background: var(--ok); color: var(--on-ok); }
.ex-item.shown::before { content: "–"; background: var(--ink-3); }
.ex-q { font-size: 1rem; overflow-wrap: anywhere; }
.ex-a { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ex-a .inp { width: 12em; }
.ex-fb { font-size: .9rem; flex-basis: 100%; }
.ex-fb.ok { color: var(--ok); font-weight: 600; }
.ex-fb.bad { color: var(--bad); }
.ex-fb .hint { color: var(--ink-2); }
.ex-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.stamp {
  position: absolute; right: 16px; top: -26px; width: 96px; height: 96px; border-radius: 50%;
  border: 3.5px solid var(--led); color: var(--led); display: grid; place-items: center; text-align: center;
  transform: rotate(-12deg); background: color-mix(in srgb, var(--panel) 70%, transparent);
  animation: stampIn .4s cubic-bezier(.2, 1.6, .4, 1) both; pointer-events: none; z-index: 2;
}
.stamp b { font: 900 2.7rem/.8 var(--font-display); font-stretch: 125%; display: block; }
.stamp span { font: 700 .58rem/1.1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; display: block; margin-top: 2px; }
.stamp.rec { right: 20px; top: -22px; }
.stamp.rec span { font-size: .78rem; margin: 0; line-height: 1.15; }

/* barvy, ASCII, IP */
.cmix { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 20px; align-items: start; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
@media (max-width: 620px) { .cmix { grid-template-columns: minmax(0, 1fr); } .cmix-sw { aspect-ratio: 2.6; max-width: 100%; } }
.cmix-sw { aspect-ratio: 1; width: 100%; max-width: 200px; border-radius: 8px; border: 1.5px solid var(--ink); box-shadow: inset 0 0 0 4px var(--panel); }
.cmix-ctrls { display: grid; gap: 12px; min-width: 0; }
.cmix-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 12px; align-items: center; }
.cmix-row label { font-weight: 600; font-size: .9rem; }

.cmix-code .r { color: var(--ch-r); } .cmix-code .g { color: var(--ch-g); } .cmix-code .b { color: var(--ch-b); }
@media (max-width: 420px) { .cmix-row { grid-template-columns: 1fr; } .cmix-v { grid-column: 1; } }
input[type="range"].rng { width: 100%; accent-color: var(--ink); }
input[type="range"].rng-r { accent-color: var(--ch-r); }
input[type="range"].rng-g { accent-color: var(--ch-g); }
input[type="range"].rng-b { accent-color: var(--ch-b); }
.ascii-w, .ipv4-w, .brange, .signed-w, .logic-w, .nib-w { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.ascii-w .tbl-wrap, .ipv4-w .tbl-wrap { border-color: var(--line); }
.na { color: var(--warn); font-size: .78rem; font-family: var(--font-body); }
.brange-out { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 8px; }
.brange-out div { background: var(--paper-2); border-radius: 5px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.brange-out b { font: 700 1.05rem/1.25 var(--font-mono); overflow-wrap: anywhere; }
.logic-ops { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.lres { display: grid; gap: 8px; justify-items: center; padding: 12px; border-radius: 6px; background: var(--paper-2); }
.lres-leds { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.lres-leds .led { width: 26px; }
.lres-leds .ng { margin-left: 8px; }
.row-label { font: 700 .8rem/1 var(--font-mono); color: var(--ink-2); text-align: center; }
.signed-read { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center; font-size: .95rem; }
.signed-read b { font-family: var(--font-mono); }
.ctrl-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* ---------- nástroje a tahák ---------- */
.jump { display: flex; flex-wrap: wrap; gap: 8px; }
.tool { margin-top: 22px; gap: 16px; padding: 22px; }
.tool > h2 { font-size: 1.45rem; }
.tool-in { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; }
.field { display: grid; gap: 6px; min-width: 0; }

.conv-card { background: var(--paper-2); border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.conv-card.src { outline: 2px solid var(--ink); background: var(--panel); }
.conv-val { font: 700 1.15rem/1.3 var(--font-mono); overflow-wrap: anywhere; }
.conv-card .key { justify-self: start; }
.err { color: var(--bad); font-size: .92rem; min-height: 1.2em; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.ts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; align-items: start; }
.ts-grid .panel h2 { font-size: 1.2rem; font-stretch: 112%; }
.ts-grid ol, .ts-grid ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: .95rem; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: .93rem; }
.kv dt { font-family: var(--font-mono); font-weight: 700; white-space: nowrap; }
.kv dd { margin: 0; color: var(--ink-2); }

/* ---------- hry: rám ---------- */
.g-head.compact { padding-bottom: 14px; }
.g-head.compact .lead { display: none; }
.g-head.compact h1 { font-size: clamp(1.45rem, 1.1rem + 1.6vw, 2.1rem); }
.g-setup { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 880px) { .g-setup { grid-template-columns: minmax(0, 1fr); } }
.g-rules p + p { margin-top: 2px; }
.seg-btns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1.5px solid var(--ink); border-radius: 7px; overflow: hidden; }
.seg-btns button { appearance: none; border: 0; border-left: 1.5px solid var(--ink); background: var(--panel); color: var(--ink); font: 650 .9rem/1.1 var(--font-body); padding: 11px 4px; cursor: pointer; display: grid; gap: 6px; justify-items: center; min-width: 0; }
.seg-btns button:first-child { border-left: 0; }
.seg-btns button[aria-checked="true"] { background: var(--ink); color: var(--paper); }
.seg-btns .dots { display: flex; gap: 3px; }
.seg-btns .dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .22; }
.seg-btns .dots i.on { opacity: 1; background: var(--led); }
.lvl-desc { min-height: 3.2em; }
.lvl-best { color: var(--ink-2); }
.g-opts fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 12px; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 14px; }
.g-opts legend { padding: 0 6px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--ink); }
.hud { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; padding: 10px 14px; background: var(--panel); border: 1.5px solid var(--ink); border-radius: 7px; margin-bottom: 14px; }
.hud-i { display: grid; gap: 3px; }
