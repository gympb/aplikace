@media (max-width: 560px) { .hud { gap: 6px 14px; padding: 8px 10px; margin-bottom: 10px; } .hud-i b { font-size: 1.02rem; } .hud .key.sm { min-height: 32px; padding: .3em .6em; font-size: .8rem; } .timebar { margin-top: -4px; margin-bottom: 10px; } }
.lives { display: inline-flex; gap: 4px; vertical-align: middle; }
.lives i { width: 12px; height: 12px; border-radius: 50%; background: var(--led-off); }
.lives i.on { background: var(--led); box-shadow: 0 0 6px var(--led-glow); }
.timebar { height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; margin: -6px 0 14px; border: 1px solid var(--line); }
.timebar i { display: block; height: 100%; background: var(--led); transform-origin: left center; transition: transform .12s linear; }
.g-fb { min-height: 1.6em; font-size: .98rem; text-align: center; }
.g-fb.ok { color: var(--ok); font-weight: 600; }
.g-fb.bad { color: var(--bad); }
.g-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.board { display: grid; gap: 18px; justify-items: center; padding: 22px 14px; }
.target { display: grid; justify-items: center; gap: 6px; }
.target-num { font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 800; line-height: 1; }
.result { position: relative; justify-items: center; text-align: center; padding: 34px 20px 26px; gap: 14px; }
.result-score { display: grid; justify-items: center; gap: 8px; }
.result-info { color: var(--ink-2); max-width: 60ch; display: grid; gap: 8px; justify-items: center; }
.result-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.result .tape { justify-self: center; }

/* kvíz */
.quiz { justify-items: center; text-align: center; padding: 26px 16px; gap: 16px; }
.quiz-q { display: grid; gap: 8px; justify-items: center; }
.quiz-num { font-size: clamp(1.7rem, 6vw, 2.8rem); font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }
.quiz-a { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
.quiz-a .inp { width: 12em; text-align: center; }
.quiz-sub { font-size: 1.4rem; color: var(--ink-2); margin-left: -6px; }
.quiz-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; min-height: 36px; }
.combo { font: 700 .8rem/1 var(--font-mono); padding: .45em .7em; border-radius: 999px; background: var(--led); color: var(--on-led); }
.combo:empty { display: none; }
.quiz-hint { background: var(--paper-2); border-radius: 6px; padding: 12px; font-size: .9rem; max-width: 100%; overflow-x: auto; }
.why { color: var(--ink-2); display: block; margin-top: 4px; font-family: var(--font-mono); font-size: .86rem; overflow-wrap: anywhere; }

/* pexeso */
.pex { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 780px; margin-inline: auto; }
@media (max-width: 600px) { .pex { grid-template-columns: repeat(var(--cols-m), minmax(0, 1fr)); gap: 7px; } }
.pcard { aspect-ratio: 4 / 5; perspective: 800px; border: 0; padding: 0; background: none; cursor: pointer; min-width: 0; -webkit-tap-highlight-color: transparent; }
.pcard .in { position: relative; display: block; width: 100%; height: 100%; transition: transform .38s; transform-style: preserve-3d; }
.pcard.up .in, .pcard.done .in { transform: rotateY(180deg); }
.pcard .b, .pcard .f { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 7px; display: grid; place-items: center; border: 1.5px solid var(--ink); }
.pcard .b { background: var(--dip); box-shadow: inset 0 -4px 0 var(--dip-deep); }
.pcard .b span { display: grid; grid-template-columns: repeat(2, 10px); gap: 5px; }
.pcard .b i { width: 10px; height: 10px; border-radius: 50%; background: var(--dip-deep); }
.pcard .b i:nth-child(1), .pcard .b i:nth-child(4) { background: var(--led); box-shadow: 0 0 6px var(--led-glow); }
.pcard .f { background: var(--panel); transform: rotateY(180deg); font: 700 clamp(.8rem, 3vw, 1.15rem)/1.25 var(--font-mono); padding: 6px; text-align: center; overflow-wrap: anywhere; color: var(--ink); }
.pcard.done .f { background: var(--ok-bg); border-color: var(--ok); }
.pcard.nope .f { background: var(--bad-bg); border-color: var(--bad); }
.pex-log { display: grid; gap: 4px; justify-items: center; margin-top: 14px; font-family: var(--font-mono); font-size: .85rem; color: var(--ink-2); min-height: 1.4em; }

/* déšť */
.rain-wrap { display: grid; gap: 14px; }
.rain { position: relative; height: clamp(200px, calc(100vh - 470px), 440px); background-color: var(--seg-bg); background-image: linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .04) 1px, transparent 1px); background-size: 24px 24px; border-radius: 9px; overflow: hidden; border: 1.5px solid var(--ink); touch-action: manipulation; }
.rain-ground { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--led); box-shadow: 0 0 14px var(--led-glow); }
.rain-msg { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 700 .85rem/1.2 var(--font-mono); color: var(--wheel-ink); pointer-events: none; padding-inline: 10px; }
.drop { position: absolute; top: 0; left: 0; padding: 7px 10px; border-radius: 6px; background: var(--panel); color: var(--ink); font: 700 1.02rem/1 var(--font-mono); border: 1.5px solid var(--ink); white-space: nowrap; box-shadow: 0 3px 0 var(--key-shadow); will-change: transform; }
.drop.hit { animation: dropHit .32s forwards; }
.drop.miss { background: var(--bad); color: var(--on-bad); border-color: var(--bad); }
.drop.near { border-color: var(--led); }
.rain.hurt { animation: hurt .4s; }
.rain-ctrl { display: grid; gap: 12px; justify-items: center; }
.rain-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.hexpad { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; width: min(100%, 520px); }
@media (max-width: 520px) { .hexpad { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.hexpad .key { min-height: 46px; font-family: var(--font-mono); font-size: 1.1rem; padding: .4em; }
.hexbuf { font: 800 2rem/1 var(--font-mono); letter-spacing: .2em; min-height: 1.1em; }

/* pixely */
.pix-board { justify-items: center; padding: 20px 12px; gap: 16px; }
.pix-scroll { max-width: 100%; overflow-x: auto; padding: 4px; }
.pix { --px: clamp(24px, 6.6vw, 36px); display: inline-grid; grid-template-columns: repeat(var(--n), var(--px)) auto 18px; gap: 3px; align-items: center; touch-action: none; user-select: none; -webkit-user-select: none; }
.pix.n12 { --px: clamp(18px, 4.6vw, 30px); }
.pxh { font: 600 .56rem/1 var(--font-mono); color: var(--ink-3); text-align: center; padding-bottom: 2px; white-space: nowrap; }
.px { width: var(--px); height: var(--px); border: 1px solid var(--line-2); background: var(--panel); border-radius: 3px; padding: 0; cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; }
.px.on { background: var(--ink); border-color: var(--ink); }
.px.nb::before { content: ""; position: absolute; left: -3px; top: -2px; bottom: -2px; width: 1.5px; background: var(--ink-3); opacity: .55; }
.pxh.nb { box-shadow: -2px 0 0 -0.5px var(--ink-3); }
.clue { font: 700 .92rem/1 var(--font-mono); padding-left: 10px; white-space: nowrap; display: flex; gap: 8px; align-items: baseline; }
.clue .cur { font-size: .7rem; color: var(--ink-3); font-weight: 500; }
.rowlamp { width: 12px; height: 12px; border-radius: 50%; background: var(--led-off); justify-self: center; }
.rowlamp.ok { background: var(--ok); box-shadow: 0 0 7px var(--ok); }
.rowlamp.bad { background: var(--bad); }
.pix.solved .px { border-color: transparent; }
.pix.solved .px.on { background: var(--pic); border-color: var(--pic); animation: pop .4s both; }
.pix-title { font: 800 1.3rem/1.1 var(--font-display); font-stretch: 112%; min-height: 1.3em; text-align: center; }
.mini-pic { display: inline-grid; grid-template-columns: repeat(var(--n), 10px); gap: 2px; padding: 8px; background: var(--paper-2); border-radius: 6px; }
.mini-pic i { width: 10px; height: 10px; border-radius: 2px; background: transparent; }
.mini-pic i.on { background: var(--pic); }
details.cheat { width: 100%; max-width: 640px; justify-self: center; border: 1px dashed var(--line-2); border-radius: 6px; padding: 10px 14px; }
details.cheat summary { cursor: pointer; font-weight: 600; font-size: .92rem; }
details.cheat[open] summary { margin-bottom: 10px; }

/* barvy */
.colg { justify-items: center; padding: 22px 14px; gap: 18px; text-align: center; }
.code-big { font: 800 clamp(1.8rem, 7vw, 2.8rem)/1 var(--font-mono); letter-spacing: .04em; }
.swatches { display: grid; grid-template-columns: repeat(2, minmax(0, 180px)); gap: 12px; width: 100%; justify-content: center; }
.swatch { aspect-ratio: 1.3; border-radius: 9px; border: 2px solid var(--ink); cursor: pointer; padding: 0; position: relative; box-shadow: 0 3px 0 var(--key-shadow); max-width: 100%; }
.swatch:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-shadow); }
.swatch .sw-code { position: absolute; left: 6px; bottom: 6px; font: 700 .72rem/1 var(--font-mono); background: var(--panel); color: var(--ink); padding: 3px 6px; border-radius: 4px; }
.swatch.right { outline: 4px solid var(--ok); outline-offset: 3px; }
.swatch.wrong { outline: 4px solid var(--bad); outline-offset: 3px; }
.big-swatch { width: min(100%, 260px); aspect-ratio: 1.6; border-radius: 10px; border: 2px solid var(--ink); }
.codes { display: grid; grid-template-columns: repeat(2, minmax(0, 200px)); gap: 10px; justify-content: center; width: 100%; }
.codes .key { font-family: var(--font-mono); font-size: 1.02rem; }
.codes .key.right { background: var(--ok); color: var(--on-ok); border-color: var(--ok); }
.codes .key.wrong { background: var(--bad); color: var(--on-bad); border-color: var(--bad); }
.mix-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 220px)); gap: 14px; justify-content: center; width: 100%; }
.mix-pair figure { margin: 0; display: grid; gap: 6px; }
.mix-pair .big-swatch { width: 100%; }
.dials { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.dial { display: grid; gap: 6px; justify-items: center; padding: 10px 12px; border-radius: 8px; background: var(--paper-2); }
.dial .lbl { font-weight: 700; }
.dial output { font: 800 2rem/1 var(--font-mono); min-width: 1.2em; text-align: center; }
.dial .key { min-height: 40px; width: 52px; padding: 0; }
.dial .ch-r { color: var(--ch-r); } .dial .ch-g { color: var(--ch-g); } .dial .ch-b { color: var(--ch-b); }
@media (max-width: 560px) { .dials { gap: 8px; } .dial { padding: 8px; } .dial .key { width: 44px; min-height: 38px; } .dial output { font-size: 1.7rem; } }
.diff-list { font-family: var(--font-mono); font-size: .88rem; display: grid; gap: 4px; }

/* počty */
.arith { justify-items: center; padding: 22px 12px; gap: 16px; }
.ar-grid { display: inline-grid; grid-template-columns: 1.6em repeat(var(--w), 2.1em); font-family: var(--font-mono); font-size: 1.35rem; font-weight: 700; row-gap: 4px; text-align: center; }
.ar-grid > div { height: 1.8em; display: grid; place-items: center; }
.ar-grid .ar-rule { grid-column: 1 / -1; height: 2px; background: var(--ink); margin-block: 2px; }
.dc { width: 1.75em; height: 1.75em; text-align: center; font: 800 1em/1 var(--font-mono); border: 1.5px solid var(--line-2); border-radius: 5px; background: var(--panel); color: var(--ink); padding: 0; text-transform: uppercase; }
.dc:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.dc.carry { width: 1.3em; height: 1.3em; font-size: .68em; color: var(--led); border-style: dashed; }
.dc.ok { border-color: var(--ok); background: var(--ok-bg); }
.dc.bad { border-color: var(--bad); background: var(--bad-bg); }
@media (max-width: 560px) { .ar-grid { font-size: 1.1rem; grid-template-columns: 1.3em repeat(var(--w), 1.95em); } }
.ar-info { font-size: .92rem; color: var(--ink-2); text-align: center; max-width: 60ch; }
.ar-steps { width: 100%; }

/* porovnání */
.cmp { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 14px; align-items: stretch; padding: 22px 14px; }
@media (max-width: 600px) { .cmp { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .cmp-mid { grid-column: 1 / -1; order: 3; } }
.cmp-card { display: grid; gap: 10px; place-items: center; padding: 26px 10px; border-radius: 9px; border: 2px solid var(--ink); background: var(--panel); cursor: pointer; box-shadow: 0 4px 0 var(--key-shadow); min-height: 150px; min-width: 0; }
.cmp-card:hover { background: var(--paper-2); }
.cmp-card:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--key-shadow); }
.cmp-num { font-size: clamp(1.05rem, 4.2vw, 2rem); font-weight: 800; overflow-wrap: anywhere; line-height: 1.2; }
.cmp-card.right { border-color: var(--ok); background: var(--ok-bg); }
.cmp-card.wrong { border-color: var(--bad); background: var(--bad-bg); }
.cmp-mid { display: grid; place-items: center; }
.cmp-mid .key { min-width: 120px; }

/* tajná zpráva */
.msg { gap: 16px; padding: 22px 16px; }
.msg-codes { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.mc { display: grid; gap: 6px; justify-items: center; padding: 8px; border-radius: 7px; background: var(--paper-2); min-width: 0; }
.mc-code { font: 700 .86rem/1.2 var(--font-mono); text-align: center; white-space: nowrap; }
.mc-in { width: 2.2em; height: 2.2em; text-align: center; font: 800 1.2rem/1 var(--font-mono); border: 1.5px solid var(--line-2); border-radius: 6px; background: var(--panel); color: var(--ink); text-transform: uppercase; padding: 0; }
.mc-in:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.mc.ok .mc-in { border-color: var(--ok); background: var(--ok-bg); }
.mc.bad .mc-in { border-color: var(--bad); background: var(--bad-bg); }
.mc.rev .mc-in { border-style: dashed; }
.msg-stream { font: 700 .95rem/1.7 var(--font-mono); overflow-wrap: anywhere; word-break: break-all; background: var(--paper-2); border-radius: 6px; padding: 12px 14px; letter-spacing: .06em; }
.msg-inputs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.ascii-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 4px; }
.ascii-grid span { display: grid; gap: 2px; justify-items: center; padding: 5px 2px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); font-family: var(--font-mono); }
.ascii-grid b { font-size: 1rem; }
.ascii-grid small { font-size: .68rem; color: var(--ink-2); }

/* ---------- oznámení ---------- */
.toasts {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: grid; justify-items: center; gap: 8px; pointer-events: none;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.toast { background: var(--ink); color: var(--paper); padding: 11px 16px; border-radius: 7px; font-weight: 600; font-size: .95rem; box-shadow: var(--shadow); animation: toastIn .25s; max-width: 100%; transition: opacity .3s, transform .3s; }
.toast.ok { background: var(--ok); color: var(--on-ok); }
.toast.out { opacity: 0; transform: translateY(8px); }

/* ---------- animace ---------- */
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes pop { 0% { transform: scale(.55); opacity: .2; } 100% { transform: scale(1); opacity: 1; } }
@keyframes flashok { 0% { box-shadow: 0 0 0 0 var(--ok); } 40% { box-shadow: 0 0 0 6px var(--ok); } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes stampIn { 0% { transform: rotate(-12deg) scale(2.3); opacity: 0; } 100% { transform: rotate(-12deg) scale(1); opacity: .95; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes dropHit { 0% { opacity: 1; filter: brightness(1); } 100% { opacity: 0; filter: brightness(2); scale: 1.6; } }
@keyframes hurt { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 30% { box-shadow: inset 0 0 0 6px var(--bad); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

/* =====================================================================
   Rozšíření: nastavení a motivy, vstupní test, otázky s možnostmi,
   denní výzva, nové hry, logické obvody, kvantová laboratoř, procesor.
   Všechny barvy berou tokeny z :root, takže fungují ve všech motivech.
   ===================================================================== */

/* ---------- přepínače z nastavení ---------- */
:root[data-nogrid] body { background-image: none; }
:root[data-calm] *, :root[data-calm] *::before, :root[data-calm] *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }

/* ---------- hlavička, patička, úvod ---------- */
body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
#app { flex: 1 0 auto; }
a.chip { text-decoration: none; }
.cpu-isa { margin-top: 14px; }
@media (max-width: 1100px) {
  .top-in { min-height: 54px; }
  .nav { order: 3; flex-basis: 100%; margin-left: 0; padding-bottom: 6px; }
  .top-tools { margin-left: auto; }
}
.nav a.todo::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--led); margin-left: 6px; vertical-align: 2px; box-shadow: 0 0 6px var(--led-glow); }
.foot-main { display: grid; gap: 4px; }
.foot-title, .foot-author b { color: var(--ink); }
.foot-side { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.path { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1000px) { .path { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .path { grid-template-columns: minmax(0, 1fr); } }
.parts { grid-template-columns: repeat(auto-fill, minmax(min(100%, 205px), 1fr)); }
.lab-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.home-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; margin-top: 34px; }
@media (max-width: 860px) { .home-row { grid-template-columns: minmax(0, 1fr); } }
.home-daily { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 18px; border-radius: var(--r); border: 1.5px solid var(--ink); background: var(--panel); text-decoration: none; color: inherit; box-shadow: 5px 5px 0 var(--bench-shadow); transition: transform .15s; }
.home-daily:hover { color: inherit; transform: translateY(-2px); }
.hd-t { display: grid; gap: 4px; min-width: 0; }
.hd-t b { font-size: 1.08rem; }
@media (max-width: 520px) { .home-daily { grid-template-columns: auto minmax(0, 1fr); } .home-daily > .key { grid-column: 1 / -1; } }
.home-test { gap: 6px; align-content: center; }
.home-test b { font-size: 1.08rem; }
.home-test-a { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.pv-gate { width: 120px; height: 70px; color: var(--wheel-ink); }
.pv-cpu { display: grid; grid-template-columns: repeat(4, 10px); gap: 4px; }
.pv-cpu i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, .12); }
.pv-cpu i.on { background: var(--seg-on); box-shadow: 0 0 6px var(--seg-on); }
.pv-inf { font: 900 3.2rem/1 var(--font-display); color: var(--seg-on); }
.pv-doors { display: flex; gap: 8px; align-items: flex-end; }
.pv-doors i { width: 34px; height: 54px; background: var(--dip); border: 2px solid var(--wheel-ink); border-bottom: 0; border-radius: 4px 4px 0 0; display: grid; place-items: center; }
.pv-doors i.open { background: var(--seg-on); box-shadow: 0 0 14px var(--seg-on); }
.pv-doors b { font: 700 .6rem/1 var(--font-mono); color: var(--wheel-ink); }

/* ---------- okna (dialogy) ---------- */
.modal {
  position: fixed; inset: 0; z-index: 70; background: rgba(10, 12, 18, .55); display: grid; place-items: center; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: toastIn .2s;
}
.modal-box { width: min(100%, 560px); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--panel); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 12px; box-shadow: 8px 8px 0 var(--bench-shadow); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; }
.modal-box.wide { width: min(100%, 760px); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.modal-head h2 { font-size: 1.4rem; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.welcome { display: grid; gap: 14px; justify-items: start; }
.welcome .modal-actions { justify-self: stretch; justify-content: flex-start; }
.brand-leds.big i { width: 14px; height: 14px; }
.set-sec { display: grid; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.set-sec h3 { font-size: 1rem; }
.set-sec .chk { display: flex; }
.set-sec .reset { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.set-sec .key { justify-self: start; }
.skins { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 460px) { .skins { grid-template-columns: minmax(0, 1fr); } }
.skin { display: flex; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border: 1.5px solid var(--line-2); border-radius: 8px; background: var(--panel); color: var(--ink); cursor: pointer; font: inherit; min-width: 0; }
.skin:hover { border-color: var(--ink); }
.skin[aria-checked="true"] { border-color: var(--led); box-shadow: inset 0 0 0 1.5px var(--led); }
.skin b { display: block; font-size: .92rem; }
.skin small { display: block; font-size: .74rem; color: var(--ink-2); line-height: 1.25; }
.skin-pv { position: relative; flex: none; width: 52px; height: 40px; border-radius: 6px; border: 1px solid var(--line-2); overflow: hidden; display: block; }
.skin-pv i { position: absolute; left: 6px; top: 6px; width: 26px; height: 18px; border-radius: 3px; border: 1px solid transparent; }
.skin-pv b { position: absolute; right: 6px; top: 8px; width: 9px; height: 9px; border-radius: 50%; }
.skin-pv u { position: absolute; left: 6px; bottom: 5px; width: 22px; height: 7px; border-radius: 2px; }
.skin-pv em { position: absolute; right: 6px; bottom: 6px; width: 14px; height: 3px; border-radius: 2px; }
.skin-pv.split i { left: 0; top: 0; bottom: 0; width: 50%; height: auto; border-radius: 0; border: 0; }
.skin-pv.split i + i { left: 50%; }
.custom-skin { display: grid; gap: 10px; padding: 12px; border: 1.5px dashed var(--line-2); border-radius: 8px; }
.custom-skin .key { justify-self: start; }
.cust-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cust-f { display: flex; align-items: center; gap: 8px; font-size: .88rem; cursor: pointer; }
.cust-f input[type="color"] { width: 42px; height: 32px; padding: 0; border: 1.5px solid var(--line-2); border-radius: 6px; background: var(--panel); cursor: pointer; flex: none; }
.share-ta { width: 100%; font-size: .9rem; padding: 10px; border-radius: 6px; border: 1.5px solid var(--line-2); background: var(--paper-2); color: var(--ink); resize: vertical; }

/* ---------- vstupní test ---------- */
.pl-root { display: grid; grid-template-columns: minmax(0, 1fr); max-width: 860px; }
.pl-intro { gap: 16px; }
.pl-rules { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.pl-q { padding: 24px 20px; gap: 18px; }
.pl-top { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.pl-leds { display: flex; gap: 4px; }
.pl-leds i { width: 10px; height: 10px; border-radius: 50%; background: var(--led-off); }
.pl-leds i.done { background: var(--dip); }
.pl-leds i.cur { background: var(--led); box-shadow: 0 0 6px var(--led-glow); }
.pl-qt { font-size: clamp(1.25rem, 1rem + 1.2vw, 1.6rem); }
.pl-opts { display: grid; gap: 8px; }
.pl-opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; min-height: 52px; border: 1.5px solid var(--key-border); border-radius: 8px; background: var(--panel); color: var(--ink); box-shadow: 0 3px 0 var(--key-shadow); cursor: pointer; font: 600 1rem/1.35 var(--font-body); }
.pl-opt:hover { background: var(--paper-2); }
.pl-opt:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-shadow); }
.pl-opt.sel { border-color: var(--dip); background: var(--nib-a); }
.pl-opt.nevim { border-style: dashed; color: var(--ink-2); box-shadow: none; }
.pl-key { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 5px; background: var(--paper-2); font-size: .8rem; }
.pl-res { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 14px; align-items: start; }
@media (max-width: 760px) { .pl-res { grid-template-columns: minmax(0, 1fr); } }
.pl-score { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.pl-bar { display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) 2.6em; gap: 10px; align-items: center; font-size: .9rem; }
.pl-review { margin-top: 14px; }
.pl-review ol { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; }
.pl-review li { display: grid; gap: 2px; }
.pl-review li.ok::marker { color: var(--ok); }
.pl-review li.bad::marker, .pl-review li.nevim::marker { color: var(--bad); }

/* ---------- otázky se čtyřmi možnostmi ---------- */
.mcq { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.mcq-q { font-size: 1.15rem; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
.mcq-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .mcq-opts { grid-template-columns: minmax(0, 1fr); } }
.mcq-opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; min-height: 56px; border: 1.5px solid var(--key-border); border-radius: 8px; background: var(--panel); color: var(--ink); box-shadow: 0 3px 0 var(--key-shadow); cursor: pointer; font: 600 1rem/1.3 var(--font-body); min-width: 0; }
.mcq-opt:hover:not(:disabled) { background: var(--paper-2); }
.mcq-opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-shadow); }
.mcq-opt:disabled { cursor: default; opacity: .6; }
.mcq-opt.right { background: var(--ok); border-color: var(--ok); color: var(--on-ok); opacity: 1; }
.mcq-opt.wrong { background: var(--bad); border-color: var(--bad); color: var(--on-bad); opacity: 1; }
.mcq-k { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 5px; background: var(--paper-2); color: var(--ink-2); font-size: .8rem; }
.mcq-opt.right .mcq-k, .mcq-opt.wrong .mcq-k { background: rgba(255, 255, 255, .25); color: inherit; }
.mcq-t { overflow-wrap: anywhere; min-width: 0; }
.mcq.num .mcq-t { font-family: var(--font-mono); font-weight: 700; font-size: 1.05rem; }
.mcq-fb { min-height: 1.5em; }
.mcq-fb.ok b { color: var(--ok); }
.mcq-fb.bad b { color: var(--bad); }
.mcq-why { color: var(--ink-2); }
.sw-dot { display: inline-block; width: 1.1em; height: 1.1em; border-radius: 4px; border: 1.5px solid var(--ink); vertical-align: -.2em; margin-right: .4em; }

/* ---------- Nekonečná výzva a Správné dveře ---------- */
.endless { padding: 22px 18px; gap: 14px; }
.en-prog { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.en-prog .lbl { margin-right: 6px; }
.en-prog i { width: 12px; height: 12px; border-radius: 50%; background: var(--led-off); }
.en-prog i.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.doors-wrap { padding: 22px 16px; gap: 18px; justify-items: center; }
.doors-num { display: grid; gap: 6px; justify-items: center; text-align: center; }
.doors-v { font-size: clamp(1.8rem, 6vw, 2.8rem); font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }
.doors { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 14px; width: 100%; max-width: 680px; }
@media (max-width: 560px) { .doors.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .doors { gap: 10px; } }
.door { appearance: none; -webkit-appearance: none; border: 0; padding: 0; background: none; cursor: pointer; display: block; min-width: 0; -webkit-tap-highlight-color: transparent; color: inherit; font: inherit; }
.door-frame { position: relative; display: block; aspect-ratio: 3 / 4; border: 2.5px solid var(--ink); border-bottom-width: 0; border-radius: 8px 8px 0 0; background: var(--seg-bg); overflow: hidden; perspective: 600px; box-shadow: 0 5px 0 var(--ink); }
@media (max-width: 560px) { .door-frame { aspect-ratio: 4 / 3.8; } }
.door-in { position: absolute; inset: 0; background: radial-gradient(circle at 50% 60%, var(--led-hi), var(--led) 40%, transparent 78%); opacity: 0; transition: opacity .3s; }
.door-leaf { position: absolute; inset: 5px 5px 0 5px; border-radius: 4px 4px 0 0; background: var(--dip); box-shadow: inset 0 0 0 2px var(--dip-deep), inset 0 -10px 0 var(--dip-deep); display: grid; place-items: center; padding: 22px 6px 14px; transform-origin: left center; transition: transform .45s cubic-bezier(.3, .9, .4, 1), background .2s; color: var(--dip-ink); }
.door-k { position: absolute; top: 6px; left: 8px; font-size: .72rem; opacity: .75; }
.door-num { font-size: clamp(.82rem, 2.6vw, 1.15rem); font-weight: 800; overflow-wrap: anywhere; text-align: center; line-height: 1.25; }
.knob { position: absolute; right: 10px; top: 55%; width: 8px; height: 8px; border-radius: 50%; background: var(--dip-knob); }
.door:hover .door-leaf { background: color-mix(in srgb, var(--dip) 85%, white); }
.door:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.door.open .door-leaf { transform: rotateY(-72deg); }
.door.open .door-in { opacity: 1; }
.door.wrong .door-leaf { background: var(--bad); box-shadow: inset 0 0 0 2px var(--bad); color: var(--on-bad); animation: shake .38s; }

/* ---------- logické obvody: schéma ---------- */
.cp-svg { overflow-x: auto; padding: 4px 0; }
.circ-svg { display: block; width: 100%; height: auto; max-width: calc(var(--w) * 1.2px); min-width: calc(var(--w) * .78px); margin-inline: auto; font-family: var(--font-mono); }
.cw path { fill: none; stroke-linecap: round; }
.cw-base { stroke: var(--line-2); stroke-width: 3.5; }
.cw-lit { stroke: var(--led); stroke-width: 3.5; opacity: 0; }
.cw.on .cw-lit { opacity: 1; }
.cw-flow { stroke: var(--led-hi); stroke-width: 1.6; stroke-dasharray: 2 10; opacity: 0; }
.cw.on:not(.anim) .cw-flow { opacity: .9; animation: cflow 1.1s linear infinite; }
.cw.unk .cw-base { stroke-dasharray: 5 5; }
@keyframes cflow { to { stroke-dashoffset: -12; } }
.cn-box { fill: var(--panel); stroke: var(--ink); stroke-width: 1.8; }
.cn-in { cursor: pointer; }
.cn-name { font: 700 14px var(--font-mono); fill: var(--ink); text-anchor: middle; }
.cn-out .cn-name { text-anchor: start; }
.cn-led { fill: var(--led-off); stroke: var(--line-2); }
.cn-v { font: 700 11px var(--font-mono); text-anchor: middle; fill: var(--led-off-ink); pointer-events: none; }
.cn-in.on .cn-led { fill: var(--led); stroke: var(--led); }
.cn-in.on .cn-v { fill: var(--on-led); }
.cn-in:hover .cn-box { stroke-width: 2.6; }
.cn-in:focus { outline: none; }
.cn-in:focus-visible .cn-box { stroke: var(--focus); stroke-width: 3; }
.cn-bulb { fill: var(--led-off); stroke: var(--ink); stroke-width: 1.8; }
.cn-out .cn-v { font-size: 13px; }
.cn-out.on .cn-bulb { fill: var(--led); }
.cn-out.on .cn-v { fill: var(--on-led); }
.cn-out.good .cn-bulb { stroke: var(--ok); stroke-width: 3; }
.cn-out.wrongv .cn-bulb { stroke: var(--bad); stroke-width: 3; stroke-dasharray: 4 3; }
.cg-body { fill: var(--panel); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; }
.cg-back, .cg-stub { fill: none; stroke: var(--ink); stroke-width: 1.8; }
.cg-bub { fill: var(--panel); stroke: var(--ink); stroke-width: 1.8; }
.cg-t { font: 700 8.5px var(--font-mono); fill: var(--ink-2); text-anchor: middle; pointer-events: none; }
.cg-t.sm { font-size: 7.5px; }
.cg-empty { stroke-dasharray: 5 4; fill: var(--paper-2); stroke: var(--dip); }
.cg-q { font: 800 20px var(--font-display); fill: var(--dip); text-anchor: middle; pointer-events: none; }
.cg-ring { fill: none; stroke: var(--dip); stroke-width: 1.5; stroke-dasharray: 3 4; opacity: .55; }
.cg:not(.slot) .cg-ring { display: none; }
.cg.slot { cursor: pointer; }
.cg.slot .cg-body, .cg.slot .cg-bub, .cg.slot .cg-back { stroke: var(--dip); }
.cg.slot:hover .cg-ring { opacity: 1; }
.cg.sel .cg-ring { stroke: var(--led); stroke-width: 2.5; stroke-dasharray: none; opacity: 1; }
.cg:focus { outline: none; }
.cg.slot:focus-visible .cg-ring { stroke: var(--focus); stroke-width: 3; opacity: 1; }
.cg-badge rect { fill: var(--paper-2); stroke: var(--line-2); }
.cg-badge text { font: 700 10px var(--font-mono); fill: var(--ink-2); text-anchor: middle; }
.cg.on .cg-badge rect { fill: var(--led); stroke: var(--led); }
.cg.on .cg-badge text { fill: var(--on-led); }
.novals .cg-badge { display: none; }
.cg.hinted .cg-body { animation: hintPulse 1.5s ease-out; }
@keyframes hintPulse { 0%, 40% { fill: var(--hl); } 100% { fill: var(--panel); } }
.c-toks, .e-temp { pointer-events: none; }
.ctok circle { fill: var(--panel); stroke: var(--ink-3); stroke-width: 1.5; }
.ctok text { font: 800 10px var(--font-mono); text-anchor: middle; fill: var(--ink-2); }
.ctok.on circle { fill: var(--led); stroke: var(--led-hi); }
.ctok.on text { fill: var(--on-led); }

/* ---------- logické obvody: hádanka ---------- */
.cp { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 960px) { .cp { grid-template-columns: minmax(0, 1fr); } }
.cp-story { font-size: 1.02rem; max-width: 70ch; }
.cp-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); }
.cp-legend b { color: var(--ink); margin-right: 4px; }
.cp-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.cp-pal { border: 1.5px solid var(--ink); border-radius: var(--r); padding: 12px; background: var(--paper-2); display: grid; gap: 10px; }
.cp-pal:empty { display: none; }
.pal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pal-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.pal-g { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 10px; border: 1.5px solid var(--line-2); border-radius: 7px; background: var(--panel); cursor: pointer; color: var(--ink); min-height: 52px; font: inherit; min-width: 0; }
.pal-g:hover { border-color: var(--ink); }
.pal-g.on { border-color: var(--led); box-shadow: inset 0 0 0 1.5px var(--led); }
.pal-g b { font-family: var(--font-mono); display: block; font-size: .95rem; }
.pal-g small { display: block; color: var(--ink-2); font-size: .78rem; line-height: 1.3; }
.pal-ico { width: 52px; height: 38px; flex: none; }
.pal-clear { justify-content: center; text-align: center; }
.cp-status { font-size: .95rem; }
.cp-done { margin-bottom: 14px; justify-items: start; }
.tt-wrap { overflow: auto; max-height: 470px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.tt { border-collapse: collapse; width: 100%; font-family: var(--font-mono); font-size: .88rem; text-align: center; }
.tt th { font: 600 .64rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); background: var(--paper-2); padding: 5px 6px; }
.tt td { padding: 5px 6px; border-top: 1px solid var(--line); }
.tt td.v1 { color: var(--led); font-weight: 800; }
.tt td.v0 { color: var(--ink-3); }
.tt .tt-o, .tt td.tgt { border-left: 2px solid var(--line-2); }
.tt td.tgt { background: var(--nib-a); }
.tt tbody tr { cursor: pointer; }
.tt tbody tr:hover td { background: var(--paper-2); }
.tt tr.cur td { background: var(--hl); }
.tt td.mark { font-weight: 800; }
.tt tr.ok td.mark { color: var(--ok); }
.tt tr.bad td.mark, .tt tr.bad td.now { color: var(--bad); }
.tt tbody tr:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.circ-sec { margin-top: 36px; }
.clv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.clv { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: inherit; transition: border-color .15s; }
.clv:hover { color: inherit; border-color: var(--ink); }
.clv-n { font: 700 1.1rem/1 var(--font-mono); color: var(--ink-3); }
.clv-t { display: grid; gap: 2px; min-width: 0; }
.clv-s { font: 700 .78rem/1 var(--font-mono); color: var(--ok); white-space: nowrap; }
.clv.done { border-color: var(--ok); }
.clv.done .clv-n { color: var(--ok); }
.tut { display: grid; gap: 14px; }
.tut-n { font-size: .8rem; color: var(--ink-3); margin-right: 6px; }
.tut-svg { width: 100%; max-width: 260px; height: auto; justify-self: center; }
.tut-gates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tut-gates div { display: grid; justify-items: center; text-align: center; gap: 2px; padding: 8px; border-radius: 6px; background: var(--paper-2); }
.tut-gates small { font-size: .75rem; color: var(--ink-2); line-height: 1.3; }
.tut-gates .pal-ico { width: 60px; height: 44px; }
.cdemo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.cdemo-side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.cdemo-help { display: grid; gap: 8px; justify-items: start; }
@media (max-width: 640px) { .cdemo-side { grid-template-columns: minmax(0, 1fr); } }
.gate-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 10px; }
.gate-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; align-items: start; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.gate-card p { margin-top: 2px; color: var(--ink-2); }
.gc-ico { width: 64px; height: 48px; }
.gc-tt { grid-column: 1 / -1; border-collapse: collapse; font-family: var(--font-mono); font-size: .8rem; justify-self: start; }
.gc-tt th, .gc-tt td { padding: 2px 10px; text-align: center; border-bottom: 1px solid var(--line); }
.gc-tt th { font-size: .66rem; color: var(--ink-3); }
.gc-tt td.r { font-weight: 800; }
.gc-tt td.r.one { color: var(--led); }

/* ---------- logické obvody: volné stavění ---------- */
.ced-tools { gap: 10px; padding: 12px 14px; margin-bottom: 10px; }
.ced-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ced-row .lbl { margin-right: 4px; }
.ced-g { font-family: var(--font-mono); gap: 4px; padding-left: .45em; }
.ced-ico { width: 30px; height: 22px; }
.ced-ex { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
.ced-ex select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1.5px solid var(--line-2); background: var(--panel); color: var(--ink); }
.ced-wrap { overflow-x: auto; border: 1.5px solid var(--ink); border-radius: 9px; background: var(--panel); }
.circ-svg.ced { min-width: 640px; max-width: none; touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none; }
.ced .en, .ced .ep { touch-action: none; }
.ced-bg { fill: url(#ced-dots); }
.ced-dot { fill: var(--line-2); }
.ced .en { cursor: grab; }
.ced .cg-hit { fill: transparent; }
.ep { fill: transparent; cursor: crosshair; }
.ep-dot { fill: var(--panel); stroke: var(--ink); stroke-width: 1.6; pointer-events: none; }
.en:hover .ep-dot { stroke: var(--dip); }
.ep-out.armed + .ep-dot { fill: var(--led); stroke: var(--led); }
.en.sel .cn-box, .en.sel .cg-body, .en.sel .cn-bulb { stroke: var(--focus); stroke-width: 3; }
.e-temp { fill: none; stroke: var(--dip); stroke-width: 3; stroke-dasharray: 6 5; }
.ew .cw-hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
.ew.sel .cw-base { stroke: var(--focus); stroke-width: 5; }
.ced-help { margin: 8px 2px 12px; min-height: 1.4em; }

/* ---------- kvantová laboratoř ---------- */
.qlab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; margin-top: 14px; }
.qlab.compact { grid-template-columns: minmax(0, 1fr); margin-top: 0; }
@media (max-width: 920px) { .qlab { grid-template-columns: minmax(0, 1fr); } }
.qlv { margin-top: -8px; }
.q-sb { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.q-sb .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.q-comp { overflow-x: auto; }
.q-svg { display: block; width: 100%; height: auto; max-width: calc(var(--w) * 1.25px); min-width: calc(var(--w) * .78px); }
.q-lbl { font: 700 13px var(--font-mono); fill: var(--ink); }
.q-ket { font: 500 12px var(--font-mono); fill: var(--ink-3); }
.q-wire { stroke: var(--ink); stroke-width: 1.6; }
.q-stepm { stroke: var(--led); stroke-width: 2; stroke-dasharray: 4 4; }
.q-cl { stroke: var(--dip); stroke-width: 2.5; }
.qcell { cursor: pointer; }
.qcell:focus { outline: none; }
.qc-hit { fill: transparent; stroke: transparent; stroke-width: 1.5; }
.qc-empty { fill: var(--panel); stroke: var(--line-2); stroke-width: 1.4; stroke-dasharray: 3 3; }
.qcell:hover .qc-empty { stroke: var(--ink-3); }
.qcell:hover .qc-hit { stroke: var(--line-2); stroke-dasharray: 3 3; }
.qcell.sel .qc-hit { stroke: var(--led); stroke-width: 2.5; stroke-dasharray: none; }
.qcell:focus-visible .qc-hit { stroke: var(--focus); stroke-width: 3; stroke-dasharray: none; }
.qcell.later { opacity: .4; }
.qg { fill: var(--dip); stroke: var(--dip-deep); stroke-width: 1.5; }
.qg-H { fill: var(--led); stroke: var(--led); }
.qg-t { font: 800 16px var(--font-mono); fill: var(--dip-ink); text-anchor: middle; pointer-events: none; }
.qg-H + .qg-t { fill: var(--on-led); }
.qctl { fill: var(--dip); }
.qtgt { fill: var(--panel); stroke: var(--dip); stroke-width: 2.5; }
.qtgt-x { stroke: var(--dip); stroke-width: 2.5; }
.q-pal { display: grid; gap: 8px; }
.q-pal-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 8px; }
.qp { display: grid; gap: 2px; text-align: left; padding: 8px 10px; border: 1.5px solid var(--line-2); border-radius: 7px; background: var(--panel); color: var(--ink); cursor: pointer; font: inherit; min-width: 0; }
.qp:hover { border-color: var(--ink); }
.qp.on { border-color: var(--led); box-shadow: inset 0 0 0 1.5px var(--led); }
.qp b { font-size: 1rem; }
.qp small { font-size: .76rem; color: var(--ink-2); line-height: 1.3; }
.q-step { display: grid; gap: 4px; }
.qs { display: grid; gap: 3px; font-size: .88rem; }
.qs-row { display: grid; grid-template-columns: 3.8em minmax(0, 1fr) 7.8em 3.2em; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 5px; }
.qs.has-t .qs-row { grid-template-columns: 3.8em minmax(0, 1fr) 7.8em 4.8em 3.2em; }
.qs-head { font: 600 .6rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.qs-row.hit { background: var(--hl); }
.qs-k { font-weight: 700; }
.qs-pb { display: grid; grid-template-columns: minmax(0, 1fr) 4.4em; gap: 6px; align-items: center; }
.qs-bar { position: relative; height: 12px; background: var(--paper-2); border-radius: 3px; border: 1px solid var(--line); }
.qs-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--led); border-radius: 2px; transition: width .25s; }
.qs-tm { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1.5px; background: var(--ok); border-radius: 2px; }
.qs-p { text-align: right; font-size: .8rem; }
.qs-amp { display: inline-flex; gap: 6px; align-items: center; font-size: .8rem; white-space: nowrap; }
.qs-ph { width: 20px; height: 20px; flex: none; }
.qs-ph circle { fill: none; stroke: var(--line-2); }
.qs-ph line { stroke: var(--dip); stroke-width: 2.4; stroke-linecap: round; }
.qs-t { font-size: .78rem; color: var(--ok); white-space: nowrap; }
.qs-cnt { font-size: .8rem; text-align: right; }
.qs-head .qs-cnt { font-size: inherit; }
.q-status.ok { color: var(--ok); }
@media (max-width: 560px) {
  .qs-row, .qs.has-t .qs-row { grid-template-columns: 3.4em minmax(0, 1fr) auto; grid-template-areas: "k pb pb" "k amp t"; row-gap: 2px; }
  .qs-k { grid-area: k; } .qs-pb { grid-area: pb; } .qs-amp { grid-area: amp; } .qs-t { grid-area: t; text-align: right; }
  .qs-cnt, .qs-head { display: none; }
}

/* ---------- procesor BD-8 ---------- */
.cpu { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 980px) { .cpu { grid-template-columns: minmax(0, 1fr); } }
.mem { border-collapse: collapse; width: 100%; font-size: .86rem; }
.mem th { font: 600 .64rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); background: var(--paper-2); padding: 6px 8px; text-align: left; }
.mem td { padding: 3px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
.mem tr.pc td { background: var(--nib-b); }
.mem tr.rd td { background: var(--nib-a); }
.mem tr.wr td { background: var(--hl); }
.pc-ar { color: var(--led); margin-right: 4px; font-size: .8em; }
.mbits { display: inline-flex; gap: 2px; }
.mbit { width: 22px; height: 24px; padding: 0; border: 1px solid var(--line-2); border-radius: 3px; background: var(--paper-2); color: var(--ink-3); font: 700 .78rem/1 var(--font-mono); cursor: pointer; }
.mbit.on { background: var(--dip); border-color: var(--dip-deep); color: var(--dip-ink); }
.mbit.gap { margin-left: 6px; }
@media (max-width: 520px) { .mem .c-hex { display: none; } .mbit { width: 19px; } .mem td { padding-inline: 5px; } }
.regs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 340px) { .regs { grid-template-columns: minmax(0, 1fr); } }
.reg { display: grid; gap: 6px; padding: 10px 12px; background: var(--paper-2); border-radius: 6px; min-width: 0; }
.reg b { font-size: 1rem; }
.rleds { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.rleds i { width: 13px; height: 13px; border-radius: 50%; background: var(--led-off); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .2); }
.rleds i.on { background: radial-gradient(circle at 35% 30%, var(--led-hi), var(--led) 62%); box-shadow: 0 0 6px var(--led-glow); }
.rleds i.gap { margin-left: 6px; }
.reg.flags .rleds span { margin-right: 10px; font-size: .8rem; }
.phases { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; counter-reset: ph; }
.phases li { counter-increment: ph; padding: 8px 6px; border-radius: 6px; border: 1.5px solid var(--line-2); font-weight: 650; font-size: .86rem; text-align: center; color: var(--ink-2); }
.phases li::before { content: counter(ph) ". "; font-family: var(--font-mono); }
.phases li.next { border-style: dashed; border-color: var(--ink-3); }
.phases li.cur { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.cpu-say { min-height: 4.6em; padding: 10px 12px; background: var(--paper-2); border-radius: 6px; font-size: .95rem; }
.cpu-ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cpu-speed { display: inline-flex; gap: 6px; align-items: center; }
.cpu-speed select { font: inherit; padding: 5px 6px; border-radius: 6px; border: 1.5px solid var(--line-2); background: var(--panel); color: var(--ink); }
.cpu-out { display: grid; gap: 6px; justify-items: start; }
.cpu-hist { color: var(--ink-2); overflow-wrap: anywhere; min-height: 1.2em; }
.cpu-asm { margin-top: 14px; }
.asm-src { width: 100%; min-height: 220px; font-size: .9rem; line-height: 1.5; padding: 10px 12px; border: 1.5px solid var(--line-2); border-radius: 6px; background: var(--panel); color: var(--ink); resize: vertical; tab-size: 4; }
.asm-src:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.cpu-ex { display: grid; gap: 6px; }
.cpu-tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.cpu-task .key { justify-self: start; }
.cpu-task.done { border-color: var(--ok); }
.cpu-task.done h3 { color: var(--ok); }
.cpu-res { display: grid; gap: 3px; }
.cpu-res .ok { color: var(--ok); }
.cpu-res .bad { color: var(--bad); }
table.data.isa td { white-space: normal; }

/* ---------- denní výzva ---------- */
.dl-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; align-items: stretch; }
@media (max-width: 860px) { .dl-top { grid-template-columns: minmax(0, 1fr); } }
.flex-card { background: var(--seg-bg); color: var(--wheel-ink); border-radius: 12px; border: 1.5px solid var(--ink); box-shadow: 7px 7px 0 var(--bench-shadow); padding: 22px 18px; display: grid; }
.flex-in { display: grid; gap: 12px; justify-items: center; text-align: center; align-content: center; }
.flex-card .lbl { color: color-mix(in srgb, var(--wheel-ink) 70%, transparent); }
.flex-num .segs { background: transparent; box-shadow: none; padding: 0; }
.flex-num .seg { width: clamp(34px, 9vw, 54px); }
.flex-bits { display: flex; gap: 6px; }
.flex-bits i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255, 255, 255, .1); }
.flex-bits i.on { background: radial-gradient(circle at 35% 30%, var(--led-hi), var(--led) 62%); box-shadow: 0 0 8px var(--led-glow); }
.flex-bin { font-size: .85rem; opacity: .85; }

<!-- ================= LEKCE 1 ================= -->
<template id="tpl-lekce-1">
<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>jaký je rozdíl mezi číslicí a číslem,</li>
<li>co znamená, že je číselná soustava poziční,</li>
<li>co je řád a jeho váha a jak rozložit číslo na součet.</li>
</ul></section>

<p>Než se pustíme do jedniček a nul, podíváme se pořádně na soustavu, kterou znáš odmalička: na desítkovou. Všechno, co v ní funguje, bude fungovat i ve dvojkové a šestnáctkové soustavě. Jen s jiným číslem v roli základu.</p>

<h2>Číslice není číslo</h2>
<p><dfn>Číslice</dfn> jsou znaky, kterými čísla zapisujeme. V běžném životě jich používáme deset: 0, 1, 2, 3, 4, 5, 6, 7, 8 a 9. <dfn>Číslo</dfn> je hodnota, třeba počet žáků ve třídě. Pravidlům, podle kterých číslo pomocí číslic zapíšeme, se říká <dfn>číselná soustava</dfn>.</p>
<p>Deset znaků by samo o sobě nestačilo. Jak zapsat třeba dvanáct, když pro něj nemáme zvláštní znak? Pomáhá jednoduchý trik: <strong>záleží na tom, kde číslice stojí</strong>. Takové soustavě říkáme <dfn>poziční</dfn>.</p>

<h2>Na pozici záleží</h2>
<p>Podívej se na číslo 333. Jsou v něm tři stejné číslice, a přece každá znamená něco jiného: první trojka jsou tři <strong>stovky</strong>, druhá tři <strong>desítky</strong> a poslední tři <strong>jednotky</strong>.</p>
<p>Každé místo v čísle se nazývá <dfn>řád</dfn>. Řády počítáme zprava a začínáme nulou: nultý řád jsou jednotky, první řád desítky, druhý stovky a tak dál. Každý řád má svou <dfn>váhu</dfn>, tedy číslo, kterým se číslice na tom místě násobí. V desítkové soustavě je každá váha desetkrát větší než váha vpravo od ní.</p>
<p>Projdi si rozklad čísla 3507 krok za krokem. Tlačítkem <b>Další krok</b> se posuneš dál.</p>
<div class="w" data-w="todec" data-base="10" data-value="3507"></div>
<p>Váhy 1, 10, 100, 1000 jsou mocniny deseti: 10<sup>0</sup> = 1, 10<sup>1</sup> = 10, 10<sup>2</sup> = 100, 10<sup>3</sup> = 1000. Číslo 3507 tedy ve skutečnosti znamená:</p>
<p class="formula">3507 = 3 · 1000 + 5 · 100 + 0 · 10 + 7 · 1</p>

<div class="note"><span class="tape blue">Proč zrovna deset?</span><p>Nejspíš proto, že máme deset prstů. Číslu 10 říkáme <dfn>základ</dfn> soustavy. Základ určuje dvě věci: kolik má soustava číslic (od 0 do základu minus jedna) a jaké váhy mají řády (mocniny základu).</p></div>

<h2>Počítadlo a přenos</h2>
<p>Představ si mechanické počítadlo, třeba počítadlo kilometrů ve starém autě. Každé kolečko nese deset číslic. Když se kolečko jednotek dostane za devítku, další číslice už není. Kolečko se proto přetočí zpět na nulu a <strong>o jeden dílek pootočí kolečko vlevo</strong>. Tomuto posunu do vyššího řádu říkáme <dfn>přenos</dfn>.</p>
<div class="w" data-w="odometer" data-base="10" data-bases="10" data-value="95"></div>
<p>Klikej na <b>+1</b> a sleduj, co se stane při přechodu z 99 na 100. Přenos se tam „protáhne“ přes dvě kolečka. Přesně tohle chování za chvíli uvidíš i v jiných soustavách, jen se tam kolečka přetáčejí dřív nebo později.</p>

<h2>Obecné pravidlo</h2>
<p>V soustavě se základem <i>z</i> spočítáš hodnotu čísla tak, že každou číslici vynásobíš vahou jejího řádu a všechno sečteš:</p>
<p class="formula">hodnota = číslice · váha + číslice · váha + … &nbsp;(váhy jsou 1, z, z<sup>2</sup>, z<sup>3</sup> …)</p>
<p>Protože stejně vypadající zápis může v různých soustavách znamenat různá čísla, píšeme základ malým číslem vpravo dole. 101<sub>10</sub> je sto jedna, ale 101<sub>2</sub> je pět. Když index chybí, myslí se obvykle desítková soustava.</p>

<div class="w" data-w="exercise"></div>

<section class="summary"><span class="tape">Shrnutí</span><ul>
<li>Číselná soustava je způsob, jak čísla zapisovat pomocí číslic.</li>
<li>V poziční soustavě záleží na tom, kde číslice stojí.</li>
<li>Váhy řádů jsou mocniny základu: 1, z, z<sup>2</sup>, z<sup>3</sup> …</li>
<li>Soustava se základem z má číslice 0 až z − 1.</li>
</ul></section>
</template>

<!-- ================= LEKCE 2 ================= -->
<template id="tpl-lekce-2">
<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>proč počítače používají jen nuly a jedničky,</li>
<li>co je bit,</li>
<li>jaké váhy mají řády ve dvojkové soustavě,</li>
<li>jak se ve dvojkové soustavě počítá od 0 do 15.</li>
</ul></section>

<h2>Počítač zná jen dva stavy</h2>
<p>Uvnitř počítače jsou miliardy drobných elektronických spínačů, <dfn>tranzistorů</dfn>. Každý z nich zná jen dva stavy: proud jím <strong>teče</strong>, nebo <strong>neteče</strong>. Zapnuto, nebo vypnuto. Rozlišit spolehlivě dva stavy je pro elektroniku mnohem jednodušší a odolnější proti rušení než rozlišovat deset různých úrovní napětí.</p>
<p>Tyto dva stavy zapisujeme číslicemi <b>1</b> (zapnuto) a <b>0</b> (vypnuto). Soustava, která si vystačí se dvěma číslicemi, se jmenuje <dfn>dvojková</dfn> neboli <dfn>binární</dfn>.</p>
<div class="note"><span class="tape blue">Bit</span><p>Jedna dvojková číslice se nazývá <dfn>bit</dfn> (z anglického <i lang="en">binary digit</i>, dvojková číslice). Bit je nejmenší jednotka informace. Odpovídá na jednu otázku typu ano/ne.</p></div>

<h2>Váhy ve dvojkové soustavě</h2>
<p>Dvojková soustava funguje stejně jako desítková, jen má základ 2. Má proto jen dvě číslice (0 a 1) a váha každého řádu je <strong>dvojnásobkem</strong> váhy řádu vpravo od něj. Váhy jsou mocniny dvojky:</p>
<div class="w" data-w="weights" data-base="2" data-n="8"></div>
<p>Tato čísla se vyplatí umět nazpaměť: 1, 2, 4, 8, 16, 32, 64, 128. Každé je dvakrát větší než předchozí, takže je snadno odvodíš.</p>

<h2>Vyzkoušej si spínače</h2>
<p>Níže jsou čtyři přepínače, jaké najdeš i na skutečných elektronických deskách. Přepínač nahoře (ON) znamená 1, dole 0. Hodnota čísla je <strong>součet vah</strong> u rozsvícených světýlek.</p>
<div class="w" data-w="bitpanel" data-bits="4" data-value="5" data-out="dec,sum"></div>
<p>Zkus nastavit číslo 6. Potřebuješ váhy 4 a 2, takže zapneš druhý a třetí přepínač zprava: 0110<sub>2</sub> = 6.</p>

<h2>Počítáme dvojkově</h2>
<p>Ve dvojkové soustavě se kolečko počítadla přetočí už po jedničce. Po 0 a 1 tedy hned přijde 10 a to čteme „jedna nula“, ne „deset“. Má hodnotu dva. Přepínat můžeš i na jiné soustavy a porovnávat.</p>
<div class="w" data-w="odometer" data-base="2" data-bases="2,10,16" data-value="0"></div>
<p>Takhle vypadá počítání od nuly do patnácti. Všimni si vzoru ve sloupcích: nejnižší bit se mění pokaždé (0, 1, 0, 1…), druhý bit po dvou, třetí po čtyřech a čtvrtý po osmi.</p>
<div class="w" data-w="count" data-to="15"></div>

<div class="note"><span class="tape red">Pozor</span><p>Bez indexu nepoznáš, co znamená zápis 10. Může to být deset (10<sub>10</sub>), dva (10<sub>2</sub>), nebo šestnáct (10<sub>16</sub>). Proto u čísel v jiných soustavách vždycky piš index.</p></div>
<div class="note"><span class="tape">Zajímavost</span><p>Na prstech jedné ruky napočítáš do pěti. Když ale bude každý prst jeden bit (natažený = 1, skrčený = 0), napočítáš na jedné ruce do 31 a na obou rukou až do 1023.</p></div>

<div class="w" data-w="exercise"></div>

<section class="summary"><span class="tape">Shrnutí</span><ul>
<li>Dvojková soustava má základ 2 a jen dvě číslice: 0 a 1.</li>
<li>Jedna dvojková číslice je bit.</li>
<li>Váhy řádů jsou 1, 2, 4, 8, 16, 32, 64, 128… Každá je dvojnásobkem předchozí.</li>
<li>10<sub>2</sub> čteme „jedna nula“ a znamená dva.</li>
</ul></section>
<div class="w" data-w="games" data-list="spinace:0,pexeso:0"></div>
</template>

<!-- ================= LEKCE 3 ================= -->
<template id="tpl-lekce-3">
<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>převést dvojkové číslo do desítkové soustavy součtem vah,</li>
<li>rychlejší způsob „zdvojnásob a přičti“,</li>
<li>pár triků, jak výsledek rychle zkontrolovat.</li>
</ul></section>

<h2>Způsob 1: sečti váhy jedniček</h2>
<p>Tohle je nejnázornější postup a funguje vždycky.</p>
<ol class="steps">
<li>Nad každou číslici napiš váhu jejího řádu. Začni <strong>zprava</strong>: 1, 2, 4, 8, 16…</li>
<li>Podívej se, kde stojí jedničky. Jejich váhy si vezmi. Nuly přeskoč, protože nula krát cokoli je nula.</li>
<li>Vybrané váhy sečti. Výsledek je hledané desítkové číslo.</li>
</ol>
<p>Projdi si to krok za krokem. Číslo v políčku můžeš přepsat a zkusit vlastní příklad.</p>
<div class="w" data-w="todec" data-base="2" data-value="101101" data-input="1"></div>

<h2>Způsob 2: zdvojnásob a přičti</h2>
<p>U dlouhých čísel se hodí postup, při kterém nemusíš znát váhy. Říká se mu <dfn>Hornerovo schéma</dfn>.</p>
<ol class="steps">
<li>Začni s výsledkem 0.</li>
<li>Ber číslice <strong>zleva</strong>. U každé dosavadní výsledek vynásob dvěma a přičti tu číslici.</li>
<li>Až projdeš všechny číslice, máš hotovo.</li>
</ol>
<div class="w" data-w="todec" data-base="2" data-value="101101" data-method="horner" data-input="1"></div>
<p>Proč to funguje? Každým zdvojnásobením se všechny dosavadní číslice posunou o řád výš. Je to stejné, jako když v desítkové soustavě připíšeš na konec čísla nulu.</p>

<h2>Triky na kontrolu</h2>
<ul>
<li><strong>Sudé, nebo liché?</strong> Dvojkové číslo končící nulou je sudé, končící jedničkou liché. Lichou váhu má totiž jen nejnižší bit (1).</li>
<li><strong>Samé jedničky.</strong> Číslo ze samých jedniček je o 1 menší než následující mocnina dvojky: 1111<sub>2</sub> = 16 − 1 = 15, 11111111<sub>2</sub> = 256 − 1 = 255.</li>
<li><strong>Jednička a nuly.</strong> Jednička a za ní <i>n</i> nul je přesně 2<sup><i>n</i></sup>: 1000<sub>2</sub> = 8, 100000<sub>2</sub> = 32.</li>
<li><strong>Nuly na začátku nevadí.</strong> 00101<sub>2</sub> = 101<sub>2</sub> = 5, stejně jako 007 = 7.</li>
</ul>

<div class="w" data-w="exercise"></div>

<section class="summary"><span class="tape">Shrnutí</span><ul>
<li>Dvojkové číslo převedeš do desítkové soustavy sečtením vah, nad kterými jsou jedničky.</li>
<li>Rychlejší je Hornerovo schéma: zleva, vždy „krát dva a přičti číslici“.</li>
<li>Lichá čísla končí jedničkou, sudá nulou.</li>
</ul></section>
<div class="w" data-w="games" data-list="kviz:0,porovnani:0"></div>
</template>

<!-- ================= LEKCE 4 ================= -->
<template id="tpl-lekce-4">
<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>převést desítkové číslo do dvojkové soustavy postupným dělením,</li>
<li>druhý způsob: odečítání vah, jako když platíš mincemi,</li>
<li>jak si výsledek ověřit.</li>
</ul></section>

<h2>Metoda A: postupné dělení dvěma</h2>
<p>Tahle metoda funguje vždy a hodí se pro každou soustavu. Stačí umět dělit dvěma se zbytkem.</p>
<ol class="steps">
<li>Vyděl číslo dvěma. Zapiš celočíselný <strong>podíl</strong> a <strong>zbytek</strong>. Zbytek je vždy 0, nebo 1.</li>
<li>Podíl znovu vyděl dvěma a zapiš zbytek. Opakuj, dokud podíl nebude 0.</li>
<li>Zbytky přečti <strong>odspodu nahoru</strong>. To je hledané dvojkové číslo.</li>
</ol>
<div class="w" data-w="fromdec" data-base="2" data-value="45" data-method="division" data-input="1"></div>
<div class="note"><span class="tape blue">Proč odspodu?</span><p>První zbytek říká, jestli je číslo liché. A to je přesně nejnižší bit (jednotky). Každé další dělení dvěma posune pohled o jeden řád výš. Poslední zbytek je proto nejvyšší bit a patří na začátek čísla.</p></div>

<h2>Metoda B: odečítání vah</h2>
<p>Představ si, že máš mince v hodnotách 128, 64, 32, 16, 8, 4, 2 a 1, od každé jen jeden kus, a máš zaplatit přesnou částku.</p>
<ol class="steps">
<li>Najdi největší váhu, která se do čísla vejde. Na její místo napiš 1 a odečti ji.</li>
<li>Přejdi k další menší váze. Vejde se do zbytku? Napiš 1 a odečti ji. Nevejde? Napiš 0.</li>
<li>Pokračuj až k váze 1. Na konci musí zbýt nula.</li>
</ol>
<div class="w" data-w="fromdec" data-base="2" data-value="45" data-method="coins" data-input="1"></div>
<p>Tahle metoda je rychlá u malých čísel, která zvládneš v hlavě. U velkých čísel je bezpečnější dělení.</p>
<div class="note"><span class="tape red">Kontrola</span><p>Výsledek si vždycky ověř zpětným převodem z lekce 3. Sečti váhy jedniček a musí ti vyjít původní číslo.</p></div>

<div class="w" data-w="exercise"></div>

<section class="summary"><span class="tape">Shrnutí</span><ul>
<li>Postupné dělení dvěma: zapisuj zbytky a čti je odspodu nahoru.</li>
<li>Odečítání vah: začni největší vahou, která se vejde, a pokračuj k menším.</li>
<li>Výsledek ověř zpětným převodem do desítkové soustavy.</li>
</ul></section>

<!-- ================= LEKCE 5 ================= -->
<template id="tpl-lekce-5">
<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>kolik různých čísel se vejde do daného počtu bitů,</li>
<li>co je bajt a půlbajt,</li>
<li>rozdíl mezi kB a KiB a mezi bitem a bajtem.</li>
</ul></section>

<h2>Kolik čísel se vejde do n bitů?</h2>
<p>Jeden bit má dvě možnosti: 0, nebo 1. Dva bity mají čtyři: 00, 01, 10 a 11. Každý další bit počet kombinací <strong>zdvojnásobí</strong>, protože ke každé dosavadní kombinaci můžeš připsat 0, nebo 1.</p>
<p class="formula">n bitů → 2<sup>n</sup> různých hodnot → čísla od 0 do 2<sup>n</sup> − 1</p>
<p>Proč je největší číslo o jedna menší? Protože jednu z kombinací zabere nula. Ve 4 bitech je 16 hodnot: 0, 1, 2 až 15. Posuvníkem si vyzkoušej, jak rychle počet hodnot roste.</p>
<div class="w" data-w="bitrange"></div>

<div class="tbl-wrap"><table class="data">
<thead><tr><th>Bitů</th><th>Počet hodnot</th><th>Rozsah</th><th>Kde se potkáš</th></tr></thead>
<tbody>
<tr><td class="mono">1</td><td class="mono">2</td><td class="mono">0–1</td><td>bit, ano/ne</td></tr>
<tr><td class="mono">4</td><td class="mono">16</td><td class="mono">0–15</td><td>půlbajt, jedna šestnáctková číslice</td></tr>
<tr><td class="mono">8</td><td class="mono">256</td><td class="mono">0–255</td><td>bajt, jas jedné barvy pixelu</td></tr>
<tr><td class="mono">16</td><td class="mono">65&nbsp;536</td><td class="mono">0–65&nbsp;535</td><td>čísla portů v síti</td></tr>
<tr><td class="mono">24</td><td class="mono">16&nbsp;777&nbsp;216</td><td class="mono">0–16&nbsp;777&nbsp;215</td><td>barvy #RRGGBB</td></tr>
<tr><td class="mono">32</td><td class="mono">4&nbsp;294&nbsp;967&nbsp;296</td><td class="mono">0–4&nbsp;294&nbsp;967&nbsp;295</td><td>adresy IPv4</td></tr>
</tbody></table></div>

<h2>Bajt a půlbajt</h2>
<p>Osm bitů tvoří <dfn>bajt</dfn> (anglicky <i lang="en">byte</i>, značka B). Bajt je základní jednotka, se kterou počítač pracuje. Vejde se do něj číslo od 0 do 255, jedno písmeno anglické abecedy nebo jas jedné barevné složky pixelu.</p>
<p>Polovině bajtu, tedy čtyřem bitům, se říká <dfn>půlbajt</dfn> neboli <i lang="en">nibble</i>. Do půlbajtu se vejdou čísla 0 až 15, a to je přesně jedna šestnáctková číslice, jak uvidíš v lekci 6.</p>

<h2>Kolik bitů potřebuju?</h2>
<p>Hledáš nejmenší n, pro které je 2<sup>n</sup> − 1 aspoň tvoje číslo. Na číslo 100 stačí 7 bitů (největší je 127), ale na 200 už potřebuješ 8 bitů (největší je 255). V praxi to jde i jinak: převedeš číslo do dvojkové soustavy a spočítáš číslice.</p>

<h2>Kilo není vždycky tisíc</h2>
<p>V běžném životě znamená kilo tisíc. Jenže 1000 není mocnina dvojky, a tak se u velikosti paměti historicky počítalo s 1024 = 2<sup>10</sup>. Aby se to nepletlo, vznikly dvojkové předpony:</p>
<div class="tbl-wrap"><table class="data">
<thead><tr><th>Desítková předpona</th><th>Bajtů</th><th>Dvojková předpona</th><th>Bajtů</th></tr></thead>
<tbody>
<tr><td>1 kB (kilobajt)</td><td class="mono">1000</td><td>1 KiB (kibibajt)</td><td class="mono">1024 = 2<sup>10</sup></td></tr>
<tr><td>1 MB (megabajt)</td><td class="mono">1&nbsp;000&nbsp;000</td><td>1 MiB (mebibajt)</td><td class="mono">1&nbsp;048&nbsp;576 = 2<sup>20</sup></td></tr>
<tr><td>1 GB (gigabajt)</td><td class="mono">10<sup>9</sup></td><td>1 GiB (gibibajt)</td><td class="mono">1&nbsp;073&nbsp;741&nbsp;824 = 2<sup>30</sup></td></tr>
<tr><td>1 TB (terabajt)</td><td class="mono">10<sup>12</sup></td><td>1 TiB (tebibajt)</td><td class="mono">2<sup>40</sup></td></tr>
</tbody></table></div>
<p>Výrobci disků používají desítkové předpony, některé operační systémy ukazují dvojkové. Proto disk prodávaný jako 1 TB ukáže Windows jako zhruba 931 GB. Ve skutečnosti tím myslí 931 GiB.</p>
<div class="note"><span class="tape red">Malé b, velké B</span><p>Malé <b>b</b> je bit, velké <b>B</b> je bajt. Rychlost internetu se udává v bitech: 100 Mb/s je 100 megabitů za sekundu, tedy 12,5 MB/s (megabajtů), protože 100 : 8 = 12,5.</p></div>

<li>1 bajt = 8 bitů (0–255), půlbajt = 4 bity (0–15).</li>
<li>1 KiB = 1024 B, ale 1 kB = 1000 B. Malé b je bit, velké B bajt.</li>
</ul></section>

<!-- ================= LEKCE 6 ================= -->
<template id="tpl-lekce-6">
<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>proč programátoři používají šestnáctkovou soustavu,</li>
<li>číslice A až F a jejich hodnoty,</li>
<li>váhy řádů a různé způsoby zápisu.</li>
</ul></section>

<h2>Dvojková čísla jsou dlouhá</h2>
<p>Počítači dvojková soustava vyhovuje, lidem už méně. Čísla jsou dlouhá a snadno se v nich přehlédneš. Oranžová barva je v počítači uložená jako</p>
<p class="formula">1111 1111 1000 1000 0000 0000<sub>2</sub></p>
<p>Šestnáctková neboli <dfn>hexadecimální</dfn> soustava zapíše totéž mnohem kratčeji: <b class="mono">FF8800</b>. Šest znaků místo čtyřiadvaceti.</p>

<h2>Šestnáct číslic</h2>
<p>Základ je 16, takže soustava potřebuje šestnáct číslic. Prvních deset známe, dalších šest si půjčíme z abecedy:</p>
<div class="w" data-w="hexdigits"></div>
<div class="note"><span class="tape blue">Jak si to zapamatovat</span><p>A je 10: první písmeno pro první dvouciferné číslo. F je 15, poslední. Mezi nimi stačí počítat: B = 11, C = 12, D = 13, E = 14. Malá a velká písmena znamenají totéž: 2f = 2F.</p></div>

<h2>Váhy řádů</h2>
<p>Váhy jsou mocniny šestnáctky. Rostou rychle, každá je šestnáctkrát větší než předchozí:</p>
<div class="w" data-w="weights" data-base="16" data-n="5"></div>
<p>Dvě šestnáctkové číslice tedy dávají 16 · 16 = 256 možností (00 až FF), přesně jako jeden bajt.</p>

<h2>Počítáme šestnáctkově</h2>
<p>Po devítce nepřijde 10, ale A, B, C, D, E, F. Teprve po F se kolečko přetočí a přijde 10<sub>16</sub>, což je šestnáct. Zkus <b>+1</b> a sleduj přechod z FF na 100.</p>
<div class="w" data-w="odometer" data-base="16" data-bases="16,10,2" data-value="250"></div>

<h2>Jak se šestnáctková čísla zapisují</h2>
<div class="tbl-wrap"><table class="data">
<thead><tr><th>Zápis</th><th>Kde ho potkáš</th></tr></thead>
<tbody>
<tr><td class="mono">2F<sub>16</sub></td><td>matematika, učebnice</td></tr>
<tr><td class="mono">0x2F</td><td>programovací jazyky (C, Java, Python, JavaScript)</td></tr>
<tr><td class="mono">2Fh</td><td>assembler, starší literatura</td></tr>
<tr><td class="mono">#2F2F2F</td><td>barvy v HTML a CSS (vždy 3, nebo 6 číslic)</td></tr>
<tr><td class="mono">U+002F</td><td>čísla znaků v Unicode</td></tr>
</tbody></table></div>

<h2>Proč zrovna šestnáct?</h2>
<p>Protože 16 = 2<sup>4</sup>. Jedna šestnáctková číslice odpovídá přesně čtyřem bitům, takže bajt zapíšeš přesně dvěma číslicemi. Šestnáctková soustava je vlastně <strong>zkratka pro dvojkovou</strong>. Jak se mezi nimi převádí, uvidíš v lekci 8. Je to až překvapivě snadné.</p>

<div class="w" data-w="exercise"></div>

<section class="summary"><span class="tape">Shrnutí</span><ul>
<li>Šestnáctková soustava má číslice 0–9 a A–F (A = 10 … F = 15).</li>
<li>Váhy řádů jsou 1, 16, 256, 4096…</li>
<li>Zápisy: 2F<sub>16</sub>, 0x2F, 2Fh, #2F2F2F.</li>
<li>Jedna šestnáctková číslice = 4 bity, jeden bajt = 2 číslice.</li>
</ul></section>

<!-- ================= LEKCE 7 ================= -->
<template id="tpl-lekce-7">
<section class="goals"><span class="tape">Co se naučíš</span><ul>

<li>jak dělit šestnácti bez kalkulačky.</li>

<h2>Ze šestnáctkové do desítkové</h2>
<p>Postup je stejný jako u dvojkové soustavy, jen váhy jsou 1, 16, 256, 4096… a číslice můžou být větší než 1. Každou číslici proto vynásobíš vahou a výsledky sečteš. Písmena nejdřív přepiš na čísla (A = 10 … F = 15).</p>
<div class="w" data-w="todec" data-base="16" data-value="1A3" data-input="1"></div>
<p>U dvoumístných čísel to jde i zpaměti: první číslici vynásobíš šestnácti a přičteš druhou. 2F<sub>16</sub> = 2 · 16 + 15 = 47 a FF<sub>16</sub> = 15 · 16 + 15 = 255.</p>
<p>I tady funguje Hornerovo schéma, jen místo dvojkou násobíš šestnáctkou:</p>
<div class="w" data-w="todec" data-base="16" data-value="1A3" data-method="horner"></div>

<h2>Z desítkové do šestnáctkové</h2>
<p>Použiješ postupné dělení, tentokrát šestnácti. Zbytky vyjdou od 0 do 15 a zbytky 10 až 15 zapíšeš písmeny A až F.</p>
<ol class="steps">
<li>Vyděl číslo šestnácti. Zapiš podíl a zbytek.</li>
<li>Podíl děl znovu, dokud nevyjde 0.</li>
<li>Zbytky přepiš na šestnáctkové číslice a přečti odspodu nahoru.</li>
</ol>
<div class="w" data-w="fromdec" data-base="16" data-value="419" data-input="1"></div>

<div class="note"><span class="tape blue">Jak dělit šestnácti bez kalkulačky</span><p>Najdi největší násobek 16, který se do čísla vejde. Pomůže malá šestnáctková násobilka:</p><div class="w" data-w="mult16"></div><p>Například 200 : 16. Největší násobek, který se vejde, je 16 · 12 = 192 a zbývá 8. Takže 200 = C8<sub>16</sub> (C je 12).</p></div>
<div class="note"><span class="tape">Zkratka přes dvojkovou</span><p>Často je nejjednodušší převést desítkové číslo nejdřív do dvojkové soustavy a tu pak po čtveřicích přepsat do šestnáctkové. Jak, to ukazuje další lekce.</p></div>

<!-- ================= LEKCE 9 ================= -->
<template id="tpl-lekce-9">
<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>sčítat pod sebou ve dvojkové soustavě,</li>
<li>co je přenos a kdy vzniká,</li>
<li>co se stane, když se výsledek nevejde do daného počtu bitů.</li>
</ul></section>

<h2>Stejně jako na papíře</h2>
<p>Ve dvojkové soustavě se sčítá stejně jako ve škole pod sebou: čísla zarovnáš vpravo a sčítáš po sloupcích <strong>zprava doleva</strong>. Když součet ve sloupci přeteče, zapíšeš jen poslední číslici a jedničku <dfn>přeneseš</dfn> do dalšího sloupce. Pravidel je ale mnohem méně:</p>
<div class="w" data-w="rules" data-op="add"></div>
<p>Proč 1 + 1 = 10? Jedna a jedna jsou dvě a dvě se dvojkově zapíše jako 10<sub>2</sub>. Je to stejné jako 5 + 5 = 10 v desítkové soustavě: napíšeš 0 a jedničku přeneseš o řád výš.</p>

<h2>Krok za krokem</h2>
<p>Sečteme 1011<sub>2</sub> (to je 11) a 110<sub>2</sub> (to je 6). Přenosy se zapisují malou číslicí nad sloupec, do kterého se přenáší. Čísla v políčkách můžeš změnit.</p>
<div class="w" data-w="colop" data-base="2" data-op="add" data-a="1011" data-b="110" data-input="1"></div>
<p>Výsledek si vždy můžeš ověřit převodem do desítkové soustavy: 11 + 6 = 17 a 10001<sub>2</sub> = 16 + 1 = 17. Sedí.</p>

<h2>Přetečení</h2>
<p>Počítač sčítá v pevném počtu bitů, třeba v osmi. Co když se výsledek nevejde?</p>
<p class="formula">1111 1111 + 1 = 1 0000 0000</p>
<p>Devátý bit se do osmi bitů nevejde a zahodí se. V osmi bitech tak zbyde 0000 0000. Tomu se říká <dfn>přetečení</dfn> (anglicky <i lang="en">overflow</i>). Je to stejné jako u počítadla kilometrů, které po 999 999 ukáže samé nuly. Programátoři si na přetečení musí dávat pozor, jinak se z velkého čísla nečekaně stane malé.</p>
<div class="note"><span class="tape blue">Když sčítáš víc čísel</span><p>Při sčítání tří a více čísel může ve sloupci vyjít i 3 nebo víc. Pak postupuješ stejně jako v desítkové soustavě: 1 + 1 + 1 = 3 = 11<sub>2</sub>, napíšeš 1 a přeneseš 1. Kdyby vyšlo 4 = 100<sub>2</sub>, napíšeš 0 a do dalšího sloupce přeneseš 2. To se hodí u násobení.</p></div>

<div class="w" data-w="exercise"></div>

<section class="summary"><span class="tape">Shrnutí</span><ul>
<li>0 + 0 = 0, 0 + 1 = 1, 1 + 1 = 10 (píšu 0, přenos 1), 1 + 1 + 1 = 11 (píšu 1, přenos 1).</li>
<li>Sčítá se zprava doleva a přenos se přičte v dalším sloupci.</li>
<li>Když se výsledek nevejde do daného počtu bitů, nastane přetečení.</li>
</ul></section>

<!-- ================= LEKCE 10 ================= -->
<template id="tpl-lekce-10">
<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>odčítat pod sebou ve dvojkové soustavě,</li>
<li>jak funguje výpůjčka,</li>
<li>jak si výsledek zkontrolovat sčítáním.</li>
</ul></section>

<h2>Pravidla odčítání</h2>
<div class="w" data-w="rules" data-op="sub"></div>
<p>Jediný zádrhel je 0 − 1. Stejně jako v desítkové soustavě si <dfn>vypůjčíš</dfn> z vyššího řádu. Tam si ovšem půjčuješ desítku, tady dvojku: z 0 se stane 10<sub>2</sub> (dva) a 10<sub>2</sub> − 1 = 1. Vyšší řád si to zapamatuje a odečte o jedničku víc.</p>

<h2>Krok za krokem</h2>
<p>Odečteme 1100<sub>2</sub> (12) − 101<sub>2</sub> (5). Výpůjčky zapisujeme malou jedničkou nad sloupec, který musí odečíst o jedna víc.</p>
<div class="w" data-w="colop" data-base="2" data-op="sub" data-a="1100" data-b="101" data-input="1"></div>
<p>Kontrola: 12 − 5 = 7 a 111<sub>2</sub> = 4 + 2 + 1 = 7.</p>
<div class="note"><span class="tape blue">Zkouška sčítáním</span><p>Odčítání nejlépe zkontroluješ sčítáním: výsledek + menšitel = menšenec. Tady 111<sub>2</sub> + 101<sub>2</sub> = 1100<sub>2</sub>. Sedí.</p></div>
<div class="note"><span class="tape">Jak odčítá procesor</span><p>Procesor nepotřebuje zvláštní obvod na odčítání. Rozdíl spočítá jako součet se záporným číslem zapsaným v takzvaném doplňkovém kódu. Jak to funguje, najdeš v bonusové lekci 14.</p></div>

<div class="w" data-w="exercise"></div>

<section class="summary"><span class="tape">Shrnutí</span><ul>
<li>0 − 1 vyžaduje výpůjčku z vyššího řádu: 10<sub>2</sub> − 1 = 1.</li>
<li>Výpůjčka se v dalším sloupci odečte navíc.</li>
<li>Kontrola: výsledek + menšitel = menšenec.</li>
</ul></section>

<!-- ================= LEKCE 11 ================= -->
<template id="tpl-lekce-11">
<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>proč je násobení ve dvojkové soustavě snadné,</li>
<li>že násobení dvěma je posun doleva,</li>
<li>písemné násobení víceciferných čísel.</li>
</ul></section>

<h2>Nejkratší násobilka na světě</h2>
<div class="w" data-w="rules" data-op="mul"></div>
<p>Násobit jednou dvojkovou číslicí je tedy hračka. Násobíš-li jedničkou, číslo opíšeš. Násobíš-li nulou, vyjde nula.</p>

<h2>Násobení dvěma je posun</h2>
<p>V desítkové soustavě vynásobíš deseti tak, že připíšeš nulu: 37 · 10 = 370. Ve dvojkové soustavě stejně snadno násobíš <strong>dvěma</strong>, protože 2 = 10<sub>2</sub>:</p>
<p class="formula">101<sub>2</sub> · 10<sub>2</sub> = 1010<sub>2</sub> &nbsp;(5 · 2 = 10)</p>
<p>Připsání dvou nul násobí čtyřmi, tří nul osmi. Tomu se říká <dfn>bitový posun doleva</dfn> a procesory ho zvládají bleskově. Vyzkoušej si posuny na panelu:</p>
<div class="w" data-w="bitpanel" data-bits="8" data-value="5" data-out="dec,sum" data-shift="1"></div>

<h2>Písemné násobení</h2>
<ol class="steps">
<li>Procházej číslice druhého čísla zprava doleva.</li>
<li>Za každou jedničku napiš první číslo posunuté o tolik míst doleva, kolikátá je to číslice: první se neposouvá, druhá o jedno místo, třetí o dvě. Za nulu napiš řádek nul, nebo ho rovnou vynech.</li>
<li>Všechny řádky sečti.</li>
</ol>
<div class="w" data-w="colop" data-base="2" data-op="mul" data-a="1011" data-b="101" data-input="1"></div>
<p>Kontrola: 11 · 5 = 55 a 110111<sub>2</sub> = 32 + 16 + 4 + 2 + 1 = 55.</p>

<h2>Dělení dvěma je posun doprava</h2>
<p>Když u dvojkového čísla škrtneš poslední číslici, vydělíš ho dvěma. Škrtnutá číslice je zbytek: 1011<sub>2</sub> (11) → 101<sub>2</sub> (5), zbytek 1. A to je přesně to, co děláš při převodu postupným dělením v lekci 4.</p>
<details class="more"><summary>Pro zvídavé: písemné dělení</summary>
<p>Dělí se jako v desítkové soustavě, jen je to jednodušší. V každém kroku se ptáš jedinou otázkou: vejde se dělitel? Když ano, napíšeš 1 a odečteš ho. Když ne, napíšeš 0.</p>
<p class="formula">1101<sub>2</sub> : 11<sub>2</sub> = 100<sub>2</sub>, zbytek 1 &nbsp;(13 : 3 = 4, zbytek 1)</p>
<ol class="steps">
<li>11 se vejde do prvních dvou číslic 11. Píšeš 1, zbytek 0.</li>
<li>Připíšeš další číslici 0. Do 0 se 11 nevejde, píšeš 0.</li>
<li>Připíšeš poslední číslici 1. Do 1 se 11 nevejde, píšeš 0 a zbytek je 1.</li>
</ol>
</details>

<div class="w" data-w="exercise"></div>

<section class="summary"><span class="tape">Shrnutí</span><ul>
<li>Násobení dvěma = připsání nuly (posun doleva).</li>
<li>Písemně: za každou jedničku druhého čísla posunutá kopie prvního čísla, nakonec všechno sečíst.</li>
<li>Dělení dvěma = škrtnutí poslední číslice (posun doprava).</li>
</ul></section>
<div class="w" data-w="games" data-list="pocty:2"></div>
</template>

<template id="tpl-lekce-12">
<section class="goals"><span class="tape">Co se naučíš</span><ul>

<li>násobit šestnáctkové číslo jednou číslicí,</li>
<li>jak si to celé usnadnit a zkontrolovat.</li>
