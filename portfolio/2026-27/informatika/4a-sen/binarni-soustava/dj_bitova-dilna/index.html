const CIRC_TPL_BY_DL = [[0], [0, 1], [1, 2, 3], [2, 3, 4], [4, 5], [5, 6], [6, 7], [7, 6], [8, 7], [8]];
function circInteresting(P) {
  const rows = circRows(P), n = P.ins.length;
  for (const o of P.outs) if (new Set(rows.map(r => r.tgt[o.id])).size < 2) return false;
  for (let k = 0; k < n; k++) {
    const bit = 1 << (n - 1 - k);
    if (!rows.some((r, i) => P.outs.some(o => r.tgt[o.id] !== rows[i ^ bit].tgt[o.id]))) return false;
  }
  if (P.outs.length > 1 && rows.every(r => P.outs.every(o => r.tgt[o.id] === r.tgt[P.outs[0].id]))) return false;
  return true;
}
/** Vygeneruje hádanku pro úroveň 1–10. Používá rng (v denní výzvě se semínkem). */
function circGen(dl, id = 'nahoda') {
  dl = clamp(Math.round(dl), 1, 10);
  const pal2 = dl <= 2 ? ['AND', 'OR', 'XOR'] : dl <= 5 ? ['AND', 'OR', 'XOR', 'NAND'] : ['AND', 'OR', 'XOR', 'NAND', 'NOR', 'XNOR'];
  for (let tries = 0; tries < 400; tries++) {
    const T = CIRC_TPL[pick(CIRC_TPL_BY_DL[dl - 1])];
    const names = ['A', 'B', 'C', 'D'].slice(0, T.n);
    const P = {
      id, diff: dl <= 3 ? 0 : dl <= 5 ? 1 : dl <= 8 ? 2 : 3, t: 'Neznámý obvod', random: true,
      story: 'Tenhle obvod nemá příběh, jen tabulku. Doplň hradla tak, aby výstupy svítily přesně podle sloupce cíl.',
      ins: names.map(x => cIn(x)), outs: T.o.map(([o, s]) => cOut(o, s)),
      gates: T.g.map(([gid, ins]) => cG(gid, ins, ins.length === 1 ? (rng() < .85 ? 'NOT' : 'BUF') : pick(pal2))),
      pal: [...pal2, 'NOT', 'BUF'],
    };
    P.tgt = v => circValues(P, g => g.sol, v);
    if (circInteresting(P)) return P;
  }
  return Object.assign({}, CIRC_LEVELS[3], { id, random: true });
}

/* ---------- jedna hádanka: schéma, výběr hradel, tabulka, stopky ---------- */
class CircPuzzle {
  constructor(host, P, o = {}) {
    this.P = P;
    this.o = Object.assign({ scope: viewScope, onSolved: null, quit: 'Ukončit' }, o);
    this.descs = P.diff <= 1;
    this.assign = {}; P.gates.forEach(g => { if (!g.fix) this.assign[g.id] = null; });
    this.inVals = {}; P.ins.forEach(i => { this.inVals[i.id] = 0; });
    this.rows = circRows(P); this.hints = 0; this.sel = null; this.solved = false; this.t0 = now(); this.tEnd = 0;
    this.build(host);
  }
  typeOf(g) { return g.fix || this.assign[g.id] || null; }
  build(host) {
    const P = this.P, sc = this.o.scope;
    const legend = [...P.ins, ...P.outs].filter(x => x.t).map(x => `<span><b class="mono">${esc(x.n)}</b> ${esc(x.t)}</span>`).join('');
    host.innerHTML = hud([['time', 'Čas', '0:00'], ['rows', 'Sedí řádků', `0/${this.rows.length}`], ['hints', 'Nápovědy', 0]]) +
      `<div class="cp">
        <section class="panel cp-board">
          <p class="cp-story">${P.story}</p>${legend ? `<p class="cp-legend small">${legend}</p>` : ''}
          <div class="cp-svg" data-svg></div>
          <div class="cp-tools"><button type="button" class="key sm" data-c="replay">▶ Pustit signál</button><button type="button" class="key sm" data-c="hint">Nápověda</button><button type="button" class="key sm" data-c="clear">Vyprázdnit hradla</button><label class="chk small"><input type="checkbox" data-c="vals" checked><span>Hodnoty u hradel</span></label></div>
          <div class="cp-pal" data-pal aria-live="polite"></div>
        </section>
        <section class="panel cp-side"><h2 class="h3">Pravdivostní tabulka</h2>
          <p class="small muted">Sloupec <b>cíl</b> je zadání, <b>teď</b> ukazuje tvůj obvod. Kliknutím na řádek nastavíš vstupy.</p>
          <div class="tt-wrap" data-tt></div><p class="cp-status" aria-live="polite"></p></section>
      </div>`;
    this.host = host;
    this.view = new CircView($('[data-svg]', host), P, {
      scope: sc, titles: this.descs,
      typeOf: g => this.typeOf(g), slots: g => !g.fix && !this.solved,
      onToggle: id => { this.inVals[id] = this.inVals[id] ? 0 : 1; Sound.click(); this.refresh('changed'); },
      onSlot: id => this.openPal(id),
    });
    sc.listen(host, 'click', e => {
      const c = e.target.closest('[data-c]')?.dataset.c;
      if (c === 'replay') this.refresh('all');
      if (c === 'hint') this.hint();
      if (c === 'clear' && !this.solved) { Object.keys(this.assign).forEach(k => { this.assign[k] = null; this.view.setType(k); }); this.refresh('changed'); this.openPal(this.firstEmpty()); }
      if (c === 'pal-close') this.closePal();
      const t = e.target.closest('[data-t]'); if (t && this.sel) this.setGate(this.sel, t.dataset.t || null);
      const row = e.target.closest('tr[data-r]'); if (row) this.setRow(+row.dataset.r);
    });
    sc.listen(host, 'change', e => { if (e.target.dataset.c === 'vals') this.view.svg.classList.toggle('novals', !e.target.checked); });
    sc.listen(host, 'keydown', e => { const row = e.target.closest && e.target.closest('tr[data-r]'); if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); this.setRow(+row.dataset.r); } });
    sc.every(500, () => { if (!this.solved) setH(host, 'time', fmtTime((now() - this.t0) / 1000)); });
    this.refresh(false);
    this.openPal(this.firstEmpty());
  }
  elapsed() { return ((this.tEnd || now()) - this.t0) / 1000; }
  firstEmpty() { const g = this.P.gates.find(x => !x.fix && !this.assign[x.id]); return g ? g.id : null; }
  setRow(r) { const row = this.rows[r]; if (!row) return; Object.assign(this.inVals, row.ins); Sound.click(); this.refresh('changed'); }
  rowNow(r) { return circValues(this.P, g => this.typeOf(g), this.rows[r].ins); }
  curRow() { const n = this.P.ins.length; return this.P.ins.reduce((s, inp, k) => s + (this.inVals[inp.id] << (n - 1 - k)), 0); }
  refresh(animate) {
    const vals = circValues(this.P, g => this.typeOf(g), this.inVals);
    this.view.update(vals, animate);
    const cr = this.curRow(), P = this.P;
    let okRows = 0;
    const body = this.rows.map((row, r) => {
      const nowV = this.rowNow(r), ok = P.outs.every(o => nowV[o.id] === row.tgt[o.id]);

    }).join('');

    P.outs.forEach(o => { const el = this.view.nodeEls[o.id]; if (!el) return; const ok = vals[o.id] === this.rows[cr].tgt[o.id]; el.classList.toggle('good', ok); el.classList.toggle('wrongv', !ok); });
    const empty = Object.values(this.assign).filter(x => !x).length;

    if (!this.solved) st.innerHTML = empty ? `Prázdná hradla: ${empty}. Sedí ${okRows} z ${this.rows.length} řádků.` : `Sedí ${okRows} z ${this.rows.length} řádků.${okRows < this.rows.length ? ' Najdi červené řádky a zkus jiné hradlo.' : ''}`;

  openPal(id) {

  }

  }
  hint() {
    if (this.solved) return;

    this.hints++; setH(this.host, 'hints', this.hints);
    toast(`Nápověda doplnila hradlo ${g.sol} (${CIRC_GATES[g.sol].cz}).`);
    this.assign[g.id] = g.sol; this.view.setType(g.id);
    const el = this.view.nodeEls[g.id];
    if (el) { el.classList.remove('hinted'); void el.getBoundingClientRect(); el.classList.add('hinted'); this.o.scope.later(1600, () => el.classList.remove('hinted')); }

  }
  win() {

    Sound.win();
    this.refresh('all');
    if (this.o.onSolved) this.o.onSolved({ sec, hints: this.hints });
  }
}

const CED_W = 1000, CED_H = 600;
const CED_EXAMPLES = {
  pul: { t: 'Půlsčítačka', nodes: [['in', 'A', 90, 200], ['in', 'B', 90, 380], ['XOR', '', 430, 200], ['AND', '', 430, 380], ['out', 'S', 820, 200], ['out', 'P', 820, 380]], wires: [[0, 2, 0], [1, 2, 1], [0, 3, 0], [1, 3, 1], [2, 4, 0], [3, 5, 0]] },

  mux: { t: 'Výhybka (multiplexor)', nodes: [['in', 'A', 90, 150], ['in', 'B', 90, 330], ['in', 'S', 90, 480], ['NOT', '', 290, 480], ['AND', '', 500, 200], ['AND', '', 500, 380], ['OR', '', 720, 290], ['out', 'Y', 900, 290]], wires: [[2, 3, 0], [0, 4, 0], [3, 4, 1], [1, 5, 0], [2, 5, 1], [4, 6, 0], [5, 6, 1], [6, 7, 0]] },
};
class CircEditor {
  constructor(host, o = {}) {

    this.sel = null; this.armed = null; this.drag = null; this.wiring = null; this.wave = null; this.shown = {};

  }
  example(k) {
    const E = CED_EXAMPLES[k], c = { seq: 0, nodes: [], wires: [] };
    E.nodes.forEach(([kind, name, x, y]) => { c.seq++; c.nodes.push({ id: 'n' + c.seq, k: kind === 'in' || kind === 'out' ? kind : 'g', t: kind === 'in' || kind === 'out' ? null : kind, name, x, y, v: 0 }); });
    E.wires.forEach(([a, b, p]) => c.wires.push({ f: c.nodes[a].id, t: c.nodes[b].id, p }));
    return c;
  }
  load() {
    try {
      const s = Store.d.circ.sandbox;
      if (!s || !Array.isArray(s.nodes) || !Array.isArray(s.wires)) return null;
      const ids = new Set();
      const nodes = s.nodes.filter(n => n && typeof n.id === 'string' && ['in', 'out', 'g'].includes(n.k) && (n.k !== 'g' || CIRC_GATES[n.t]) && isFinite(n.x) && isFinite(n.y)).map(n => { ids.add(n.id); return { id: n.id, k: n.k, t: n.k === 'g' ? n.t : null, name: String(n.name || '').slice(0, 3), x: clamp(+n.x, 40, CED_W - 40), y: clamp(+n.y, 30, CED_H - 30), v: n.v ? 1 : 0 }; });
      const wires = s.wires.filter(w => w && ids.has(w.f) && ids.has(w.t) && Number.isInteger(w.p));
      return { seq: Math.max(+s.seq || 0, nodes.length), nodes, wires };
    } catch (e) { return null; }
  }
  save() { Store.d.circ.sandbox = this.c; Store.save(); }
  node(id) { return this.c.nodes.find(n => n.id === id); }
  nIns(n) { return n.k === 'g' ? CIRC_GATES[n.t].n : n.k === 'out' ? 1 : 0; }
  outPt(n) { return { x: n.x + (n.k === 'in' ? 27 : 32), y: n.y }; }

  wirePath(a, b) { const dx = Math.max(30, Math.abs(b.x - a.x) / 2); return `M${a.x} ${a.y}C${a.x + dx} ${a.y} ${b.x - dx} ${b.y} ${b.x} ${b.y}`; }
  build(host) {

/* =====================================================================

  Z: { m: [[[1, 0], [0, 0]], [[0, 0], [-1, 0]]], d: 'Otočí znaménko amplitudy u |1⟩. Pravděpodobnosti se nezmění.' },
  S: { m: [[[1, 0], [0, 0]], [[0, 0], [0, 1]]], d: 'Vynásobí amplitudu u |1⟩ číslem i, tedy pootočí fázi o čtvrt kruhu.' },

function renderQuantum(main, id) {
  const sandbox = id === 'volne';
  const L = sandbox ? null : (Q_LEVELS.find(l => l.id === id) || Q_LEVELS.find(l => !Store.d.quant.solved[l.id]) || Q_LEVELS[0]);
  const idx = L ? Q_LEVELS.indexOf(L) : -1, next = L ? Q_LEVELS[idx + 1] : null;
  main.innerHTML = `<div class="wrap">
    <nav class="crumbs" aria-label="Drobečková navigace"><a href="#laborator">Laboratoř</a><span aria-hidden="true">/</span><span>Kvantová laboratoř</span></nav>

      <p class="lead">Qubit může být nula i jednička zároveň, dokud ho nezměříš. Skládej kvantové obvody z bran a sleduj, jak se mění amplitudy a pravděpodobnosti. Jestli jsou pro tebe qubity novinka, začni <a href="#lekce-18">lekcí 18</a>.</p></header>
    <nav class="chips qlv" aria-label="Úlohy">${Q_LEVELS.map((l, i) => `<a class="chip${l === L ? ' on' : ''}" href="#kvantum-${l.id}"${l === L ? ' aria-current="page"' : ''}>${Store.d.quant.solved[l.id] ? '✓ ' : ''}${i + 1}. ${l.t}</a>`).join('')}<a class="chip${sandbox ? ' on' : ''}" href="#kvantum-volne">Volný režim</a></nav>
    ${sandbox ? `<div class="q-sb"><span class="lbl">Počet qubitů</span>${[1, 2, 3].map(k => `<button type="button" class="chip" data-qn="${k}">${k}</button>`).join('')}</div>` : ''}
    <div class="q-host"></div><div class="q-done"></div></div>`;
  const host = $('.q-host', main);
  if (sandbox) {
    const sv = Store.d.quant.sandbox;
    let n = sv && [1, 2, 3].includes(sv.n) ? sv.n : 2, labScope = null;
    const mount = init => {
      if (labScope) labScope.dispose();
      labScope = new Scope(viewScope);
      $$('[data-qn]', main).forEach(b => b.setAttribute('aria-pressed', +b.dataset.qn === n));
      new QLab(host, { n, cols: 6, pal: ['X', 'H', 'Z', 'S', 'CNOT'], init, t: `Volný režim: ${n} ${plural(n, 'qubit', 'qubity', 'qubitů')}`, story: 'Žádný cíl, jen zkoumání. Zkus třeba H a potom CNOT a pak měř stokrát.' }, { scope: labScope, onChange: cols => { Store.d.quant.sandbox = { n, cols }; Store.save(); } });
    };
    mount(sv && sv.n === n && Array.isArray(sv.cols) ? sv.cols : null);
    $('.q-sb', main).addEventListener('click', e => { const b = e.target.closest('[data-qn]'); if (!b) return; n = +b.dataset.qn; Store.d.quant.sandbox = { n, cols: null }; Store.save(); mount(null); });
  } else {
    new QLab(host, { ...L, t: `Úloha ${idx + 1}: ${L.t}` }, {
      scope: viewScope,
      onSolved: () => {
        const first = !Store.d.quant.solved[L.id];
        Store.d.quant.solved[L.id] = true; Store.save(); checkBadges();
        $('.q-done', main).innerHTML = `<section class="panel cp-done"><span class="tape blue">Vyřešeno</span><h2>${first ? 'Kvantová úloha splněna!' : 'Zase správně!'}</h2><div class="g-actions">${next ? `<a class="key primary" href="#kvantum-${next.id}">Další úloha: ${next.t} →</a>` : '<a class="key primary" href="#kvantum-volne">Zkus volný režim →</a>'}</div></section>`;
        const chip = $(`.qlv a[href="#kvantum-${L.id}"]`, main); if (chip && !chip.textContent.startsWith('✓')) chip.textContent = '✓ ' + chip.textContent;
      },
    });
  }
  vlna(main);
}

   Procesor BD-8: zjednodušený osmibitový procesor se 16 bajty paměti.
   Instrukce = horní 4 bity kód operace, dolní 4 bity adresa nebo číslo.
   Krokování po fázích (načtení, dekódování, provedení), překladač
   z jazyka symbolických adres, ukázkové programy a úkoly.
   ===================================================================== */

const CPU_OPS = {
  0: { m: 'NOP', a: false, d: 'Nedělá nic.' },
  1: { m: 'LDA', a: true, d: 'Načte do registru A číslo z paměťové buňky.' },
  2: { m: 'ADD', a: true, d: 'Přičte k A číslo z buňky. Když se součet nevejde do bajtu, nastaví příznak C.' },
  3: { m: 'SUB', a: true, d: 'Odečte od A číslo z buňky. Když by vyšlo záporné číslo, nastaví příznak C.' },
  4: { m: 'STA', a: true, d: 'Uloží A do paměťové buňky.' },
  5: { m: 'LDI', a: true, imm: true, d: 'Vloží do A přímo číslo 0 až 15 zapsané v instrukci.' },
  6: { m: 'JMP', a: true, d: 'Skočí na zadanou adresu.' },
  7: { m: 'JC', a: true, d: 'Skočí, když je nastavený příznak C (přenos).' },
  8: { m: 'JZ', a: true, d: 'Skočí, když je nastavený příznak Z (v A je nula).' },
  14: { m: 'OUT', a: false, d: 'Pošle A na výstupní displej.' },
  15: { m: 'HLT', a: false, d: 'Zastaví procesor.' },
};
const CPU_MN = {}; Object.entries(CPU_OPS).forEach(([k, o]) => { CPU_MN[o.m] = +k; });
const b8 = v => grp(toB(v, 2, 8));
const b4 = v => toB(v, 2, 4);
function cpuDis(byte) { const o = CPU_OPS[byte >> 4]; if (!o) return '—'; return o.a ? `${o.m} ${byte & 15}` : o.m; }

/** Stav procesoru. Nic nevykresluje, jen počítá. */
class Cpu {
  constructor(mem) { this.mem = (mem || []).slice(0, 16); while (this.mem.length < 16) this.mem.push(0); this.reset(); }
  reset() { this.A = 0; this.PC = 0; this.IR = 0; this.C = 0; this.Z = 0; this.OUT = null; this.halted = false; this.phase = 0; this.outs = []; this.steps = 0; this.last = null; }
  /** Jedna fáze. Vrací popis toho, co se stalo: { phase, text, read, write }. */
  step() {
    if (this.halted) return { phase: -1, text: 'Procesor stojí. Pro nový běh zmáčkni Reset.' };
    if (this.phase === 0) {
      const at = this.PC;
      this.IR = this.mem[at]; this.PC = (at + 1) & 15; this.phase = 1;
      return this.last = { phase: 0, read: at, text: `Načtení: z adresy ${at} se do registru instrukce IR zkopíroval bajt ${b8(this.IR)}. Čítač instrukcí PC se posunul na ${this.PC}.` };
    }
    const op = this.IR >> 4, arg = this.IR & 15, o = CPU_OPS[op];
    if (this.phase === 1) {
      this.phase = 2;
      if (!o) return this.last = { phase: 1, text: `Dekódování: kód ${b4(op)} nepatří žádné instrukci, procesor ho přeskočí jako NOP.` };
      return this.last = { phase: 1, text: `Dekódování: horní čtyři bity ${b4(op)} jsou instrukce ${o.m}${o.a ? `, dolní čtyři bity ${b4(arg)} jsou ${o.imm ? 'číslo' : 'adresa'} ${arg}` : ''}. ${o.d}` };
    }
    this.phase = 0; this.steps++;
    const r = { phase: 2, text: '' };
    const m = this.mem[arg];
    switch (o ? o.m : 'NOP') {
      case 'NOP': r.text = 'Provedení: nic se neděje.'; break;
      case 'LDA': this.A = m; this.Z = +(m === 0); r.read = arg; r.text = `Provedení: do A se načetlo číslo z buňky ${arg}: ${m}.`; break;
      case 'ADD': { const a = this.A, s = a + m; this.C = +(s > 255); this.A = s & 255; this.Z = +(this.A === 0); r.read = arg; r.text = `Provedení: A = ${a} + ${m} = ${s}${this.C ? `. To se do bajtu nevejde, zůstane ${this.A} a nastaví se přenos C` : ''}.`; break; }
      case 'SUB': { const a = this.A, s = a - m; this.C = +(s < 0); this.A = s & 255; this.Z = +(this.A === 0); r.read = arg; r.text = `Provedení: A = ${a} − ${m} = ${s}${this.C ? `. Záporné číslo je v bajtu ${this.A} (doplňkový kód) a nastaví se příznak C` : ''}.`; break; }
      case 'STA': this.mem[arg] = this.A; r.write = arg; r.text = `Provedení: číslo ${this.A} se uložilo do buňky ${arg}.`; break;
      case 'LDI': this.A = arg; this.Z = +(arg === 0); r.text = `Provedení: do A se vložilo číslo ${arg}.`; break;
      case 'JMP': this.PC = arg; r.text = `Provedení: skok na adresu ${arg}.`; break;
      case 'JC': if (this.C) this.PC = arg; r.text = this.C ? `Provedení: příznak C je 1, takže skok na adresu ${arg}.` : 'Provedení: příznak C je 0, takže se neskáče.'; break;
      case 'JZ': if (this.Z) this.PC = arg; r.text = this.Z ? `Provedení: příznak Z je 1 (v A je nula), takže skok na adresu ${arg}.` : 'Provedení: příznak Z je 0, takže se neskáče.'; break;
      case 'OUT': this.OUT = this.A; this.outs.push(this.A); r.text = `Provedení: na výstup šlo číslo ${this.A}.`; break;
      case 'HLT': this.halted = true; r.text = 'Provedení: procesor se zastavil.'; break;
    }
    return this.last = r;
  }
  /** Provede celou instrukci (dokončí rozpracované fáze). */
  instr() { let r; do r = this.step(); while (this.phase !== 0 && !this.halted && r.phase !== -1); return r; }
  /** Běží do zastavení, nejvýš max instrukcí. */
  run(max = 3000) { while (!this.halted && this.steps < max) this.instr(); return this.halted; }
}

/* ---------- překladač z jazyka symbolických adres ---------- */
function asmNum(s) { s = String(s).trim(); if (/^0x[0-9a-f]+$/i.test(s)) return parseInt(s.slice(2), 16); if (/^0b[01]+$/i.test(s)) return parseInt(s.slice(2), 2); if (/^\d+$/.test(s)) return parseInt(s, 10); return NaN; }
function cpuAssemble(text) {
  const mem = Array(16).fill(0), errs = [];
  let addr = 0;
  String(text).split('\n').forEach((raw, li) => {
    let line = raw.replace(/;.*$/, '').trim(); if (!line) return;
    const ln = `Řádek ${li + 1}`;
    const m = /^(0x[0-9a-f]+|0b[01]+|\d+)\s*:\s*(.*)$/i.exec(line);
    if (m) { const a = asmNum(m[1]); if (isNaN(a) || a > 15) { errs.push(`${ln}: adresa ${esc(m[1])} neexistuje, paměť má buňky 0 až 15.`); return; } addr = a; line = m[2].trim(); if (!line) return; }
    if (addr > 15) { errs.push(`${ln}: paměť už je plná (má jen buňky 0 až 15).`); return; }
    const parts = line.split(/[\s,]+/).filter(Boolean), mn = parts[0].toUpperCase();
    if (CPU_MN[mn] != null) {
      const code = CPU_MN[mn], o = CPU_OPS[code];
      let arg = 0;
      if (o.a) {
        if (parts.length < 2) { errs.push(`${ln}: ${mn} potřebuje ${o.imm ? 'číslo' : 'adresu'} 0 až 15.`); return; }
        arg = asmNum(parts[1]);
        if (isNaN(arg) || arg > 15) { errs.push(`${ln}: „${esc(parts[1])}“ není číslo 0 až 15.`); return; }
      } else if (parts.length > 1) { errs.push(`${ln}: ${mn} žádné číslo nepotřebuje.`); return; }
      mem[addr] = code << 4 | arg;
    } else {
      const v = asmNum(parts[0]);
      if (isNaN(v) || v > 255 || parts.length > 1) { errs.push(`${ln}: nerozumím „${esc(line)}“. Napiš instrukci (třeba LDA 14) nebo číslo 0 až 255.`); return; }
      mem[addr] = v;
    }
    addr++;
  });
  return { mem, errs };
}
/** Paměť zpátky na text. Buňky za první instrukcí HLT bere jako data. */
function cpuDisasm(mem) {
  const hlt = mem.findIndex(b => b >> 4 === 15), lines = [];
  mem.forEach((b, a) => {
    if (!b) return;
    const asData = (hlt >= 0 && a > hlt) || !CPU_OPS[b >> 4] || (CPU_OPS[b >> 4] && !CPU_OPS[b >> 4].a && (b & 15));
    lines.push(`${a}: ${asData ? b : cpuDis(b)}`);
  });
  return lines.join('\n') || '; prázdná paměť';
}

const CPU_EXAMPLES = [
  { id: 'soucet', t: 'Součet 28 + 14', src: '; Sečte dvě čísla z paměti a výsledek pošle na výstup.\n0: LDA 14   ; A = obsah buňky 14\n1: ADD 15   ; A = A + obsah buňky 15\n2: OUT      ; zobraz A\n3: HLT      ; konec\n14: 28      ; data\n15: 14' },
  { id: 'nasobeni', t: 'Násobení 7 · 6', src: '; Procesor neumí násobit, tak sčítá: 7 + 7 + 7 + 7 + 7 + 7.\n0: LDA 13   ; A = mezivýsledek\n1: ADD 14   ; přičti 7\n2: STA 13   ; ulož mezivýsledek\n3: LDA 15   ; A = kolikrát ještě\n4: SUB 12   ; odečti 1\n5: STA 15\n6: JZ 8     ; hotovo? skoč na konec\n7: JMP 0    ; jinak znovu\n8: LDA 13\n9: OUT\n10: HLT\n12: 1       ; jednička na odčítání\n13: 0       ; mezivýsledek\n14: 7       ; co násobíme\n15: 6       ; kolikrát' },
  { id: 'trojky', t: 'Po trojkách', src: '; Vypisuje 0, 3, 6, 9… dokud se číslo vejde do bajtu.\n0: LDI 0\n1: OUT\n2: ADD 15   ; +3\n3: JC 5     ; přeteklo přes 255? konec\n4: JMP 1\n5: HLT\n15: 3' },
  { id: 'fib', t: 'Fibonacciho čísla', src: '; 0, 1, 1, 2, 3, 5, 8… každé je součtem dvou předchozích.\n0: LDA 14   ; a\n1: OUT\n2: ADD 15   ; a + b\n3: JC 10    ; nevejde se do bajtu? konec\n4: STA 13   ; t = a + b\n5: LDA 15\n6: STA 14   ; a = b\n7: LDA 13\n8: STA 15   ; b = t\n9: JMP 0\n10: HLT\n13: 0       ; t\n14: 0       ; a\n15: 1       ; b' },
  { id: 'odpocet', t: 'Odpočet 10 až 0', src: '; Start rakety: 10, 9, 8… 0.\n0: LDI 10\n1: OUT\n2: JZ 6     ; je v A nula? konec\n3: SUB 15   ; A = A − 1\n4: JMP 1\n6: HLT\n15: 1' },

  { id: 'c3', t: 'Odpočet od pěti', d: 'Vypiš postupně 5, 4, 3, 2, 1, 0 a zastav se.', tests: [{ out: [5, 4, 3, 2, 1, 0] }] },

  { id: 'c5', t: 'Násobilka', d: 'V buňkách 14 a 15 jsou dvě čísla (obě aspoň 1). Vypiš jejich součin a zastav se. Vyzkouší se 5 · 9, 3 · 4 a 6 · 1.', tests: [{ set: { 14: 5, 15: 9 }, out: [45] }, { set: { 14: 3, 15: 4 }, out: [12] }, { set: { 14: 6, 15: 1 }, out: [6] }] },

function cpuCheck(task, mem) {
  return task.tests.map(T => {
    const m = mem.slice(); Object.entries(T.set || {}).forEach(([a, v]) => { m[+a] = v; });
    const c = new Cpu(m), halted = c.run(3000);
    const ok = halted && c.outs.length === T.out.length && c.outs.every((v, i) => v === T.out[i]);
    return { ok, halted, outs: c.outs, T };
  });
}

function isaTableHtml() {
  return `<div class="tbl-wrap"><table class="data isa"><thead><tr><th>Kód</th><th>Instrukce</th><th>Co dělá</th></tr></thead><tbody>${Object.entries(CPU_OPS).filter(([k]) => +k).map(([k, o]) => `<tr><td class="mono">${b4(+k)} <span class="muted">(${toB(+k, 16)})</span></td><td class="mono"><b>${o.m}</b>${o.a ? (o.imm ? ' n' : ' adr') : ''}</td><td class="small">${o.d}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- stránka procesoru ---------- */
function renderCpu(main) {
  const saved = Store.d.cpu.prog;

  const cpu = new Cpu(start.mem.map(v => clamp(+v || 0, 0, 255)));
  let running = false, speed = 3, flashR = -1, flashW = -1;
  main.innerHTML = `<div class="wrap">

      <section class="panel cpu-core"><h2 class="h3">Uvnitř procesoru</h2>

      </section>
    </div>

  </div>`;
  const asm = $('[data-asm]', main);
  asm.value = start.src || cpuDisasm(cpu.mem);
  const save = () => { Store.d.cpu.prog = { mem: cpu.mem.slice(), src: asm.value }; Store.save(); };
  const leds = (v, n) => Array.from({ length: n }, (_, i) => `<i class="${(v >> (n - 1 - i)) & 1 ? 'on' : ''}${i === 4 && n === 8 ? ' gap' : ''}"></i>`).join('');
  const drawMem = () => {
    $('[data-mem]', main).innerHTML = cpu.mem.map((b, a) => `<tr class="${a === cpu.PC ? 'pc' : ''}${a === flashR ? ' rd' : ''}${a === flashW ? ' wr' : ''}"><td class="mono">${a === cpu.PC ? '<span class="pc-ar" title="Sem ukazuje čítač instrukcí PC">▶</span>' : ''}${a}</td><td><span class="mbits">${Array.from({ length: 8 }, (_, i) => { const on = (b >> (7 - i)) & 1; return `<button type="button" class="mbit${on ? ' on' : ''}${i === 4 ? ' gap' : ''}" data-a="${a}" data-b="${7 - i}" aria-label="Adresa ${a}, bit ${7 - i}: ${on}" aria-pressed="${!!on}">${on}</button>`; }).join('')}</span></td><td class="mono c-hex">${toB(b, 16, 2)}</td><td class="mono">${b}</td><td class="mono small">${cpuDis(b)}</td></tr>`).join('');
  };
  const drawRegs = () => {

    $$('[data-ph] li', main).forEach((li, i) => { li.classList.toggle('cur', !cpu.halted && i === (cpu.last ? cpu.last.phase : -1)); li.classList.toggle('next', !cpu.halted && i === cpu.phase); });
    $('[data-out]', main).innerHTML = segText(cpu.OUT == null ? '   ' : String(cpu.OUT).padStart(3, ' '), 'big');
    $('[data-hist]', main).textContent = cpu.outs.length ? `Všechny výstupy: ${cpu.outs.slice(-24).join(', ')}${cpu.outs.length > 24 ? ' …' : ''}` : '';
    $('[data-k="run"]', main).textContent = running ? '■ Zastavit' : '▶ Spustit';
  };
  const draw = () => { drawMem(); drawRegs(); };
  const doStep = full => {
    const r = full ? cpu.instr() : cpu.step();
    flashR = r.read ?? -1; flashW = r.write ?? -1;
    $('[data-say]', main).innerHTML = esc(r.text);
    if (r.write != null) save();
    if (cpu.halted) { running = false; Sound.pop(); }
    draw();
  };
  let acc = 0, looping = false;
  /* Smyčka běží jen při spuštěném programu, jinak procesor nezatěžuje počítač. */
  const runLoop = () => {
    if (looping) return; looping = true; acc = 1;
    viewScope.loop(dt => {
      if (!running) { looping = false; return false; }
      acc += dt * speed;
      let guard = 0;
      while (acc >= 1 && running && guard++ < 200) { acc -= 1; doStep(false); }
      if (!running) { looping = false; return false; }
    });
  };
  viewScope.listen(main, 'click', e => {
    const bit = e.target.closest('.mbit');
    if (bit) { const a = +bit.dataset.a, b = +bit.dataset.b; cpu.mem[a] ^= 1 << b; Sound.click(); save(); draw(); return; }

    if (k === 'instr') { running = false; doStep(true); }
    if (k === 'run') { if (cpu.halted) cpu.reset(); running = !running; if (running) runLoop(); drawRegs(); }
    if (k === 'reset') { running = false; cpu.reset(); flashR = flashW = -1; $('[data-say]', main).textContent = 'Registry jsou vynulované, paměť zůstala. Procesor začne znovu od adresy 0.'; draw(); }
    if (k === 'wipe') { running = false; cpu.mem.fill(0); cpu.reset(); asm.value = ''; save(); $('[data-say]', main).textContent = 'Paměť je prázdná. Napiš program nebo vyber ukázku.'; draw(); }
    if (k === 'asm') {
      const { mem, errs } = cpuAssemble(asm.value), err = $('[data-asm-err]', main);
      if (errs.length) { err.innerHTML = errs.slice(0, 4).join('<br>'); Sound.bad(); return; }
      err.textContent = ''; running = false; cpu.mem = mem; cpu.reset(); save(); draw(); Sound.ok();
      $('[data-say]', main).textContent = 'Program je v paměti. Zmáčkni Krok nebo Spustit.';
    }
    if (k === 'dis') { asm.value = cpuDisasm(cpu.mem); save(); }
    const ex = e.target.closest('[data-ex]')?.dataset.ex;
    if (ex) { const X = CPU_EXAMPLES.find(x => x.id === ex); asm.value = X.src; running = false; cpu.mem = cpuAssemble(X.src).mem; cpu.reset(); $('[data-asm-err]', main).textContent = ''; save(); draw(); $('[data-say]', main).textContent = `Nahrán program „${X.t}“. Zmáčkni Krok nebo Spustit.`; }
    const chk = e.target.closest('[data-check]')?.dataset.check;
    if (chk) {
      const T = CPU_TASKS.find(x => x.id === chk), res = cpuCheck(T, cpu.mem), box = $(`[data-task="${chk}"] .cpu-res`, main);
      const all = res.every(r => r.ok);
      box.innerHTML = res.map((r, i) => `<div class="${r.ok ? 'ok' : 'bad'}">${r.ok ? '✓' : '✗'} Test ${i + 1}${r.T.set ? ` (${Object.entries(r.T.set).map(([a, v]) => `[${a}] = ${v}`).join(', ')})` : ''}: ${r.halted ? `vypsáno ${r.outs.length ? r.outs.join(', ') : 'nic'}` : 'program se nezastavil (chybí HLT, nebo běží pořád dokola)'}${r.ok ? '' : `, má být ${r.T.out.join(', ')}`}</div>`).join('');
      if (all) {
        if (!Store.d.cpu.done[chk]) { Store.d.cpu.done[chk] = true; Store.save(); checkBadges(); }
        const card = $(`[data-task="${chk}"]`, main); card.classList.add('done'); $('h3', card).textContent = `✓ ${T.t}`;
        Sound.win(); toast(`Úkol „${T.t}“ splněn!`, 'ok');
      } else Sound.bad();
    }
  });
  viewScope.listen(main, 'change', e => { if (e.target.dataset.k === 'speed') speed = +e.target.value; });
  asm.addEventListener('input', () => { Store.d.cpu.prog = { mem: cpu.mem.slice(), src: asm.value }; Store.save(); });
  draw();
  vlna(main);
}


/* =====================================================================
   Denní výzva: každý den pět otázek a hra dne. Pro daný den a úroveň
   má každý stejné úlohy (náhoda se semínkem podle data). Počítá série
   odehraných a vyhraných dní, ukazuje kalendář a umí se pochlubit.
   ===================================================================== */

const DAILY_GAMES = ['obvod', 'dvere', 'spinace', 'pixely', 'porovnani', 'zprava', 'kviz'];
const DAILY_NAMES = { obvod: 'Logický obvod', dvere: 'Správné dveře', spinace: 'Bitové spínače', pixely: 'Pixelový obrázek', porovnani: 'Větší, nebo menší?', zprava: 'Tajná zpráva', kviz: 'Rychlokvíz převodů' };
const dailyGameOf = date => DAILY_GAMES[((dayNum(date) % 7) + 7) % 7];

/** Úroveň denní výzvy 1–10: podle vstupního testu a počtu vyhraných dní. */
function dailyLevel() {
  const p = Store.d.placement, off = p && p.done && PLACE_LEVELS[p.level] ? PLACE_LEVELS[p.level].daily : 0;
  const won = Object.values(Store.d.daily.hist).filter(h => h && h.won).length;
  return clamp(1 + off + Math.floor(won / 2), 1, 10);
}
/** Nastavení hry dne podle úrovně a pravidlo, kdy je vyhraná. */
function dailyGameCfg(id, dl) {
  switch (id) {
    case 'spinace': return { cfg: { bits: dl <= 2 ? 4 : dl <= 8 ? 8 : 12, rounds: 8, live: dl <= 5, hex: dl >= 4 ? .5 : 0, pts: 10, pen: dl >= 6 ? 5 : 0 }, rule: 'Nastav na spínačích správně aspoň 6 z 8 čísel.', win: s => s.ok >= 6 };
    case 'kviz': return { cfg: { count: 8, min: dl <= 2 ? 0 : 16, max: lvMax(dl), dirs: dl <= 2 ? ['b2d', 'd2b'] : dl <= 4 ? ['b2d', 'd2b', 'h2d', 'd2h'] : QUIZ_DIRS.map(d => d.id), hint: dl <= 3 }, rule: 'Převeď správně aspoň 6 z 8 čísel.', win: s => s.right >= 6 };
    case 'porovnani': return { cfg: { max: lvMax(dl), bases: dl <= 2 ? [2, 10] : [2, 10, 16], diff: dl <= 2 ? 5 : dl <= 5 ? 20 : 8, eq: .15, time: 45, pen: dl >= 5 ? 3 : 0, fancy: dl >= 9 }, rule: 'Za 45 sekund aspoň 10 správných odpovědí a nejvýš 3 chyby.', win: s => s.right >= 10 && s.wrong <= 3 };
    case 'zprava': return { cfg: dl <= 3 ? { words: 'easy', code: 16, live: true, count: 1 } : dl <= 6 ? { words: 'mid', code: 2, count: 1 } : dl <= 8 ? { words: 'phrase', code: 'mix', count: 1 } : { words: 'phrase', code: 'stream', count: 1 }, rule: 'Rozlušti zprávu a nasbírej nejvýš 40 trestných bodů (špatný znak −5 nebo −10, prozrazený znak −15).', win: s => s.pen <= 40 };
    case 'pixely': return { cfg: dl <= 3 ? { n: 8, clue: 10, heads: 'full', live: true, cur: true } : dl <= 6 ? { n: 8, clue: 16, heads: 'nib', live: true } : dl <= 8 ? { n: 8, clue: 'mix', heads: 'nib' } : { n: 12, clue: 'mix', heads: 'nib' }, rule: 'Odhal celý obrázek.', win: s => !!s.solved };
    case 'dvere': { const target = 6 + dl; return { cfg: { pairs: dl <= 2 ? DOOR_PAIRS.easy : dl <= 5 ? DOOR_PAIRS.mid : DOOR_PAIRS.all, start: 3 + dl * 3, grow: 1.1, maxN: lvMax(dl), doors: dl <= 4 ? 3 : 4, t0: Math.max(7, 13 - dl * .5), tMin: Math.max(2.5, 5 - dl * .25), f: .95, lives: 3, similar: dl >= 7, target }, rule: `Projdi ${target} pater. Máš 3 životy.`, win: s => s.passed >= target }; }
    default: return { cfg: {}, rule: 'Vyřeš logický obvod. Použít smíš nejvýš jednu nápovědu.', win: s => !!s.solved && (s.hints || 0) <= 1 };
  }
}
/** Pět otázek dne: dva převody, počítání, další dovednost a teorie. */
function dailyTasks(L) {
  const arith = ['addbin', 'logic', ...(L >= 3 ? ['subbin'] : []), ...(L >= 4 ? ['hexcalc'] : []), ...(L >= 5 ? ['mulbin'] : [])];
  const other = ['logic', ...(L >= 4 ? ['color'] : []), ...(L >= 6 ? ['twos'] : [])];
  const kinds = shuffle(['conv', 'conv', pick(arith), pick(other), 'theory']), out = [];
  for (const k of kinds) { let t, g = 0; do t = genTask(L, k); while (out.some(o => o.q === t.q) && g++ < 10); out.push(t); }
  return out;
}
function withSeed(seed, fn) { const prev = rng; rng = seeded(seed); try { return fn(); } finally { rng = prev; } }

/** Série: kolik dní v kuse je odehráno a vyhráno (dnešek se počítá, jen když už je hotový). */
function dailyStreaks(today = todayStr()) {
  const D = Store.d.daily, H = D.hist, t = dayNum(today);
  const at = d => H[strFromDayNum(d)];
  let play = 0, d = at(t) ? t : t - 1;
  while (at(d)) { play++; d--; }
  let win = 0; const th = at(t);
  if (!th || th.won) { d = th ? t : t - 1; while (at(d) && at(d).won) { win++; d--; } }
  const vals = Object.values(H);
  return { play, win, bestPlay: Math.max(D.bestPlay || 0, play), bestWin: Math.max(D.bestWin || 0, win), total: vals.length, wins: vals.filter(h => h && h.won).length, today: th || null };
}
/** Rozehraná výzva z minulého dne se počítá jako odehraná, ale nevyhraná. */
function dailyFinalizeStale(today) {
  const D = Store.d.daily, c = D.cur;
  if (c && c.date && c.date !== today) {
    if (!D.hist[c.date]) D.hist[c.date] = { won: false, q: (c.answers || []).filter(Boolean).length, qa: (c.answers || []).slice(0, 5), g: false, game: c.game, lvl: c.lvl, quit: true };
    D.cur = null;
    const st = dailyStreaks(today); D.bestPlay = Math.max(D.bestPlay || 0, st.play);
    Store.save();
  }
}

function dailyShareText(today = todayStr()) {
  const st = dailyStreaks(today), h = Store.d.daily.hist[today];
  const lines = [`Bitová dílna · denní výzva ${czShort(today)}`];
  if (h) lines.push(`Otázky: ${(h.qa || []).map(x => x ? '🟩' : '🟥').join('')} ${h.q}/5`, `Hra dne (${DAILY_NAMES[h.game] || 'hra'}): ${h.g ? '✅' : '❌'}`, h.won ? 'Výzva splněna! 🏆' : 'Dnes to nevyšlo, zítra znovu.');
  lines.push(`🔥 Série: ${st.play} ${plural(st.play, 'den', 'dny', 'dní')} v kuse (${toB(st.play, 2)}₂)`, `Vyhrané dny v kuse: ${st.win}`, `Úroveň ${h ? h.lvl : dailyLevel()} z 10`);
  return lines.join('\n');
}
function shareText(text) {
  const fallback = () => {
    const m = openModal(`<header class="modal-head"><h2>Pochlub se</h2><button type="button" class="icon-btn" data-close aria-label="Zavřít">✕</button></header><p class="small muted">Zkopíruj text (Ctrl+C) a pošli ho kamarádům.</p><textarea class="share-ta mono" rows="8" readonly aria-label="Text ke sdílení">${esc(text)}</textarea>`, { label: 'Sdílení' });
    setTimeout(() => { const ta = $('.share-ta', m.el); if (ta) { ta.focus(); ta.select(); } }, 60);
  };
  const copy = () => {
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Zkopírováno. Teď to vlož kamarádům.', 'ok'), fallback); else fallback(); } catch (e) { fallback(); }
  };
  try { if (navigator.share) { navigator.share({ title: 'Bitová dílna', text }).catch(err => { if (!err || err.name !== 'AbortError') copy(); }); return; } } catch (e) { /* sdílení není dostupné */ }
  copy();
}

function flexCardHtml(st) {
  return `<div class="flex-in"><span class="lbl">Série dní v kuse</span>
    <div class="flex-num">${segText(String(st.play).padStart(3, ' '), 'big')}</div>

    <p class="mono flex-bin">${st.play} = ${toB(st.play, 2)}<sub>2</sub> = ${toB(st.play, 16)}<sub>16</sub></p>
    <div class="flex-stats"><div><b class="mono">${st.win}</b><span>vyhraných v kuse</span></div><div><b class="mono">${st.bestPlay}</b><span>nejdelší série</span></div><div><b class="mono">${st.wins}</b><span>výher celkem</span></div></div>
    <button type="button" class="key flex-share" data-share>Pochlubit se sérií</button></div>`;
}
function calHtml(today) {
  const t = dayNum(today), H = Store.d.daily.hist;
  const dow = d => (new Date(d * 86400000).getUTCDay() + 6) % 7;
  let s0 = t - 27; s0 -= dow(s0);

  }

    <div class="cal-legend small"><span><i class="won"></i>vyhráno</span><span><i class="lost"></i>odehráno</span><span><i class="none"></i>nehráno</span></div>`;

function calSideHtml(st, dl) {
  const p = Store.d.placement, off = p && p.done && PLACE_LEVELS[p.level] ? PLACE_LEVELS[p.level].daily : 0;
  const lvl = dailyLevel(), need = lvl >= 10 ? 0 : 2 * (lvl - off) - st.wins;
  const rate = st.total ? Math.round(st.wins / st.total * 100) : 0;

      <div class="stat"><span class="lbl">Odehrané dny</span><b>${st.total}</b></div>
      <div class="stat"><span class="lbl">Vyhrané dny</span><b>${st.wins}</b></div>
      <div class="stat"><span class="lbl">Úspěšnost</span><b>${rate} %</b></div>
      <div class="stat"><span class="lbl">Úroveň</span><b>${lvl}/10</b></div></div>
    <p class="small muted">${need > 0 ? `Do úrovně ${lvl + 1} ${need === 1 ? 'chybí jedna vyhraná výzva' : `chybí ${need} vyhrané výzvy`}.` : 'Máš nejvyšší úroveň. Teď jde o to sérii udržet!'}${dl !== lvl ? ` Dnešní výzva je na úrovni ${dl}.` : ''}</p></div>`;
}
function squaresHtml(qa) { return `<span class="sqs" role="img" aria-label="${qa.filter(Boolean).length} z ${qa.length} správně">${qa.map(x => `<i class="${x ? 'ok' : 'bad'}"></i>`).join('')}</span>`; }
function countdownTxt() { const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1); const s = Math.max(0, Math.floor((m - n) / 1000)); return `${pad2(Math.floor(s / 3600))}:${pad2(Math.floor(s / 60) % 60)}:${pad2(s % 60)}`; }

/* ---------- stránka denní výzvy ---------- */
/** Každé překreslení denní výzvy dostane vlastní Scope, aby se posluchače nezdvojovaly. */
function dailyScope(main) { if (main._dScope) main._dScope.dispose(); main._dScope = new Scope(viewScope); return main._dScope; }
function renderDaily(main) {

  } else {

  }

    <section class="panel dl-cal"><div class="dl-cal-main"><h2 class="h3">Poslední čtyři týdny</h2>${calHtml(today)}</div>${calSideHtml(st, dl)}</section>
    <section class="sec"><div class="sec-head"><h2>Jak to funguje</h2></div>
      <div class="dl-how">

        <div class="panel"><h3>Úroveň</h3><p class="small">Začínáš podle vstupního testu. Každé dvě vyhrané výzvy přidají jednu úroveň, nejvýš do 10. Čím vyšší úroveň, tím větší čísla a těžší hry.</p></div>
        <div class="panel"><h3>Hra dne</h3><p class="small">Hry se střídají po dnech: logický obvod, dveře, spínače, obrázek, porovnávání, tajná zpráva a kvíz. Kdo hraje stejný den na stejné úrovni, dostane stejné úlohy.</p></div>
      </div>

  </div>`;
  sc.listen(main, 'click', e => {
    if (e.target.closest('[data-share]')) shareText(dailyShareText(today));
    if (e.target.closest('[data-start]')) runDaily(main, false);
    if (e.target.closest('[data-train]')) runDaily(main, true);

}

/* ---------- průběh výzvy: otázky a hra ---------- */
function runDaily(main, training) {
  const sc = dailyScope(main);
  const today = todayStr(), D = Store.d.daily;
  let cur;
  if (training) cur = { date: today, step: 'quiz', qi: 0, answers: [], lvl: dailyLevel(), game: DAILY_GAMES[rnd(0, DAILY_GAMES.length - 1)], training: true };
  else {
    if (D.hist[today]) { renderDaily(main); return; }
    if (!D.cur || D.cur.date !== today) D.cur = { date: today, step: 'quiz', qi: 0, answers: [], lvl: dailyLevel(), game: dailyGameOf(today) };
    cur = D.cur; Store.save();
  }
  const dl = cur.lvl, seed = training ? (Math.random() * 4294967296) >>> 0 : hashStr(`bitova-dilna:${today}:${dl}`);
  const tasks = withSeed(seed, () => dailyTasks(dl)), G = dailyGameCfg(cur.game, dl);
  main.innerHTML = `<div class="wrap daily-run">
    <nav class="crumbs" aria-label="Drobečková navigace"><a href="#denni">Denní výzva</a><span aria-hidden="true">/</span><span>${training ? 'Trénink' : 'Dnešek'}</span></nav>
    <header class="pg-head g-head compact"><span class="tape red">${training ? 'Trénink, nepočítá se' : 'Denní výzva'} · úroveň ${dl}</span><h1 data-title></h1></header>
    <ol class="dl-steps" aria-label="Postup"></ol><div class="dl-stage"></div></div>`;
  const stage = $('.dl-stage', main), title = t => { $('[data-title]', main).textContent = t; };
  const save = () => { if (!training) { D.cur = cur; Store.save(); } };
  const steps = () => {
    $('.dl-steps', main).innerHTML = [0, 1, 2, 3, 4].map(i => { const a = cur.answers[i]; return `<li class="${a === true ? 'ok' : a === false ? 'bad' : i === cur.qi && cur.step === 'quiz' ? 'cur' : ''}"><span class="sr">Otázka ${i + 1}: ${a === true ? 'správně' : a === false ? 'špatně' : 'zatím ne'}</span><b aria-hidden="true">${i + 1}</b></li>`; }).join('') + `<li class="g${cur.step === 'game' ? ' cur' : ''}"><b>Hra</b></li>`;
  };
  sc.listen(document, 'keydown', e => {
    if (e.key !== 'Enter' || document.querySelector('.modal') || (e.target.closest && e.target.closest('input, textarea, select'))) return;
    const b = $('[data-next]', stage); if (b) { e.preventDefault(); b.click(); }
  });
  const askQ = () => {
    if (cur.qi >= 5) { interlude(); return; }
    steps(); title(`Otázka ${cur.qi + 1} z 5`);
    stage.innerHTML = '<div class="panel dl-q"><div data-q></div><div class="g-actions" data-act></div></div>';
    mountMC($('[data-q]', stage), tasks[cur.qi], {
      scope: sc,
      onAnswer: ok => {
        cur.answers[cur.qi] = ok; cur.qi++; save(); steps();
        $('[data-act]', stage).innerHTML = `<button type="button" class="key primary" data-next>${cur.qi >= 5 ? 'Hotovo, dál →' : 'Další otázka →'} <kbd>Enter</kbd></button>`;
        const nb = $('[data-next]', stage); nb.addEventListener('click', askQ); nb.focus({ preventScroll: true });
      },
    });
  };
  const interlude = () => {
    steps(); title('Otázky jsou hotové');
    const right = cur.answers.filter(Boolean).length;
    stage.innerHTML = `<div class="panel dl-inter"><p class="dl-big">${squaresHtml(cur.answers.slice(0, 5))} ${right} z 5 správně</p>
      <p>${right >= 3 ? 'Paráda, otázky máš splněné. Teď ještě hra dne.' : 'Na výhru by byly potřeba aspoň tři správné odpovědi. Hru si ale zahraj, den se ti započítá do série odehraných dní.'}</p>
      <h2 class="h3">Hra dne: ${DAILY_NAMES[cur.game]}</h2><p><b>Podmínka:</b> ${G.rule}</p>
      <div class="g-actions"><button type="button" class="key primary big" data-next>Spustit hru</button></div></div>`;
    $('[data-next]', stage).addEventListener('click', play);
    $('[data-next]', stage).focus({ preventScroll: true });
  };
  const play = () => {
    cur.step = 'game'; save(); steps(); title(`Hra dne: ${DAILY_NAMES[cur.game]}`);
    stage.innerHTML = `<p class="dl-rule small"><b>Podmínka výhry:</b> ${G.rule}</p><div class="dl-game"></div>`;
    const host = $('.dl-game', stage), gs = new Scope(sc);
    rng = seeded((seed ^ 0x9E3779B9) >>> 0); gs.add(() => { rng = Math.random; });
    let ended = false;
    const end = (score, info = {}) => {
      if (ended) return; ended = true;
      const gWon = !info.gaveUp && !!G.win(info.stats || {});
      gs.dispose();
      finish(gWon, score, info);
    };
    gs.listen(host, 'click', e => {
      if (!e.target.closest('[data-quit]')) return;
      const m = openModal('<header class="modal-head"><h2>Vzdát dnešní hru?</h2></header><p>Den se ti započítá do série odehraných dní, ale nebude vyhraný.</p><div class="modal-actions"><button type="button" class="key" data-close data-autofocus>Hrát dál</button><button type="button" class="key primary" data-giveup>Vzdát</button></div>', { label: 'Vzdát hru' });
      m.el.addEventListener('click', ev => { if (ev.target.closest('[data-giveup]')) { m.close(); end(0, { gaveUp: true }); } });
    });
    try {
      if (cur.game === 'obvod') {
        const P = circGen(dl, 'denni');
        new CircPuzzle(host, P, { scope: gs, onSolved: ({ sec, hints }) => gs.later(1600, () => end(Math.max(50, 600 - Math.round(sec) - hints * 100), { stats: { solved: true, sec, hints } })) });
        if (!Store.d.circ.tut) circTutorial();
      } else {
        const GM = PLAY_GAMES.find(g => g.id === cur.game);
        if (cur.game === 'pixely') { delete lastPic[8]; delete lastPic[12]; }
        GM.mount(host, { scope: gs, level: clamp(Math.floor((dl - 1) / 3), 0, 3), cfg: Object.assign({}, G.cfg), end });
      }
    } catch (e) { console.error(e); host.innerHTML = '<div class="panel"><p>Hru se nepodařilo spustit. Zkus stránku obnovit.</p></div>'; }
    scrollToEl(stage);
  };
  const finish = (gWon, score, info) => {
    const right = cur.answers.filter(Boolean).length, won = right >= 3 && gWon;
    if (won) Sound.win();
    if (training) {
      title('Trénink hotový');
      stage.innerHTML = `<div class="panel dl-inter"><p class="dl-big">${squaresHtml(cur.answers.slice(0, 5))} ${right} z 5</p><p>Hra dne: <b>${gWon ? 'splněno' : 'nesplněno'}</b>. ${won ? 'Tohle by byla výhra!' : 'Na výhru to tentokrát nestačilo.'}</p>
        <div class="g-actions"><button type="button" class="key primary" data-again>Další trénink</button><a class="key" href="#denni">Zpět na denní výzvu</a></div></div>`;
      $('[data-again]', stage).addEventListener('click', () => runDaily(main, true));
      return;
    }
    D.hist[today] = { won, q: right, qa: cur.answers.slice(0, 5), g: gWon, game: cur.game, lvl: dl, score: Math.max(0, Math.round(score || 0)) };
    D.cur = null;
    const st = dailyStreaks(today); D.bestPlay = Math.max(D.bestPlay || 0, st.play); D.bestWin = Math.max(D.bestWin || 0, st.win);
    Store.save(); checkBadges(); updateNavDot();
    toast(won ? `Denní výzva splněna! Série: ${st.play} ${plural(st.play, 'den', 'dny', 'dní')}.` : `Den je odehraný. Série: ${st.play} ${plural(st.play, 'den', 'dny', 'dní')}.`, won ? 'ok' : '');
    renderDaily(main); window.scrollTo(0, 0);
  };
  if (cur.step === 'game') play(); else askQ();
}

/** Červená tečka u odkazu Denní výzva, dokud dnešek není odehraný. */
function updateNavDot() { const a = $('.nav a[data-sec="denni"]'); if (!a) return; const todo = !Store.d.daily.hist[todayStr()]; a.classList.toggle('todo', todo); a.title = todo ? 'Dnešní výzva na tebe čeká' : 'Dnešní výzva je hotová'; }

/** Malá karta na úvodní stránku. */
function dailyTeaserHtml() {
  const today = todayStr(), st = dailyStreaks(today), h = Store.d.daily.hist[today], cur = Store.d.daily.cur && Store.d.daily.cur.date === today;
  const status = h ? (h.won ? 'Dnešek je vyhraný ✓' : 'Dnešek je odehraný') : cur ? 'Máš rozehranou výzvu' : `Dnes: pět otázek a ${DAILY_NAMES[dailyGameOf(today)]}`;
  return `<a class="home-daily" href="#denni"><span class="hd-num">${segText(String(st.play).padStart(2, ' '))}</span><span class="hd-t"><span class="lbl">Denní výzva · série ${st.play} ${plural(st.play, 'den', 'dny', 'dní')}</span><b>${status}</b><span class="small muted">${st.play ? `Vyhraných dní v kuse: ${st.win}. Nejdelší série: ${st.bestPlay}.` : 'Začni sérii ještě dnes. Stačí pár minut.'}</span></span><span class="key primary sm">${h ? 'Výsledek' : cur ? 'Pokračovat' : 'Hrát'}</span></a>`;
}


/* =====================================================================
   Směrování podle # v adrese a spuštění aplikace
   ===================================================================== */

function route() {
  viewScope.dispose(); viewScope = new Scope();
  rng = Math.random;
  if (modalCloser) modalCloser(true);
  const id = (location.hash || '').replace(/^#/, '') || 'uvod';
  const main = $('#app');
  let sec = 'uvod', m;
  try {
    if (id === 'denni') { renderDaily(main); sec = 'denni'; }
    else if (id === 'lekce') { renderLessons(main); sec = 'lekce'; }
    else if (/^lekce-\d+$/.test(id)) { renderLesson(main, +id.slice(6)); sec = 'lekce'; }
    else if (id === 'nastroje') { renderTools(main); sec = 'nastroje'; }
    else if (id === 'hry') { renderHub(main); sec = 'hry'; }
    else if (/^hra-[a-z]+$/.test(id)) { renderGame(main, id.slice(4)); sec = 'hry'; }
    else if (id === 'tahak') { renderCheat(main); sec = 'tahak'; }
    else if (id === 'laborator') { renderLab(main); sec = 'laborator'; }
    else if (id === 'obvody') { renderCircuits(main); sec = 'laborator'; }
    else if (id === 'obvody-volne') { renderCircSandbox(main); sec = 'laborator'; }
    else if ((m = /^obvod-([a-z0-9-]+)$/.exec(id))) { renderCircuit(main, m[1]); sec = 'laborator'; }
    else if (id === 'procesor') { renderCpu(main); sec = 'laborator'; }
    else if ((m = /^kvantum(?:-([a-z0-9]+))?$/.exec(id))) { renderQuantum(main, m[1] || null); sec = 'laborator'; }
    else if (id === 'test') { renderPlacement(main); sec = ''; }
    else renderHome(main);
  } catch (e) {
    console.error(e);
    main.innerHTML = '<div class="wrap"><div class="panel"><h2>Tuhle stránku se nepodařilo zobrazit</h2><p>Zkus se vrátit na <a href="#uvod">úvod</a> nebo stránku obnovit.</p></div></div>';
  }
  $$('.nav a').forEach(a => { const on = a.dataset.sec === sec; a.classList.toggle('active', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  updateNavDot();
  window.scrollTo(0, 0);
}

function initChrome() {
  const sb = $('#sound-btn');
  sb.addEventListener('click', () => { Store.d.sound = !(Store.d.sound !== false); Store.save(); updateSoundBtn(); if (Store.d.sound) Sound.ok(); toast(Store.d.sound ? 'Zvuky jsou zapnuté.' : 'Zvuky jsou vypnuté.'); });
  updateSoundBtn();
  $('#settings-btn').addEventListener('click', openSettings);
  $('#foot-settings').addEventListener('click', openSettings);
  /* Políčka pro jednu číslici: při kliknutí se obsah označí, takže nový znak ten starý přepíše. */
  document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('.dc, .mc-in')) { try { e.target.select(); } catch (err) { /* */ } } });
}

function start(data) {
  document.documentElement.lang = 'cs';
  Store.load();
  dailyFinalizeStale(todayStr());
  applySettings();
  initChrome();
  checkBadges(true);
  try { if (data && data.hash && !location.hash) history.replaceState(null, '', data.hash); } catch (e) { /* */ }
  window.addEventListener('hashchange', route);
  route();
  if (!Store.d.placement && location.hash !== '#test') maybeWelcome();
}

try { window.claude?.hot?.snapshot?.(() => ({ hash: location.hash })); } catch (e) { /* */ }
if (window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});

</script>
