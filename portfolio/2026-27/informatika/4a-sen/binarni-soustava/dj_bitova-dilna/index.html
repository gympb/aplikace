<h2>Sčítání</h2>
<p>Sčítá se pod sebou zprava doleva. Rozdíl je jen v tom, kdy nastává přenos: až když součet ve sloupci dosáhne <strong>16</strong>.</p>
<ol class="steps">
<li>Sečti číslice ve sloupci i s přenosem. Písmena si v duchu přepiš na čísla: A = 10 … F = 15.</li>
<li>Je-li součet menší než 16, zapiš ho jako šestnáctkovou číslici.</li>
<li>Je-li 16 nebo víc, odečti 16, zapiš zbytek a do dalšího sloupce přenes 1.</li>
</ol>
<div class="w" data-w="colop" data-base="16" data-op="add" data-a="3A" data-b="2F" data-input="1"></div>
<p>Kontrola: 3A<sub>16</sub> = 58, 2F<sub>16</sub> = 47 a 58 + 47 = 105 = 6 · 16 + 9 = 69<sub>16</sub>.</p>

<h2>Odčítání</h2>
<p>Když je ve sloupci horní číslice menší než dolní, vypůjčíš si z vyššího řádu. Tentokrát <strong>16</strong>.</p>
<div class="w" data-w="colop" data-base="16" data-op="sub" data-a="52" data-b="2E" data-input="1"></div>

<h2>Násobení</h2>
<p>Při násobení jednou číslicí spočítáš součin desítkově a rozložíš ho na šestnáctky: B · 3 = 11 · 3 = 33 = 2 · 16 + 1. Napíšeš 1 a přeneseš 2.</p>
<div class="w" data-w="colop" data-base="16" data-op="mul" data-a="2B" data-b="3" data-input="1"></div>
<div class="note"><span class="tape blue">Posun o číslici</span><p>Násobení šestnácti je v šestnáctkové soustavě posun o jednu číslici doleva: 2B<sub>16</sub> · 10<sub>16</sub> = 2B0<sub>16</sub>. Stejně jako násobení deseti v desítkové soustavě.</p></div>
<div class="note"><span class="tape">Tip</span><p>Nechce se ti počítat v šestnáctkové soustavě? Převeď čísla do desítkové, spočítej a výsledek převeď zpět. Je to pomalejší, ale skvěle se tím kontroluje.</p></div>

<!-- ================= LEKCE 13 ================= -->
<template id="tpl-lekce-13">
<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>jak se zapisují barvy na webu,</li>
<li>že i písmena jsou v počítači čísla,</li>
<li>kde dál potkáš dvojkovou a šestnáctkovou soustavu.</li>
</ul></section>

<h2>Barvy na webu</h2>
<p>Každá barva na obrazovce se míchá ze tří světel: červeného (<b>R</b>ed), zeleného (<b>G</b>reen) a modrého (<b>B</b>lue). Jas každé složky je jeden bajt, tedy 0 až 255, šestnáctkově 00 až FF. Kód barvy <b class="mono">#RRGGBB</b> jsou prostě tři bajty za sebou.</p>
<div class="w" data-w="colormix"></div>
<p>#FF0000 je čistá červená, #000000 černá (všechno zhasnuté) a #FFFFFF bílá (všechno naplno). Když jsou všechny tři složky stejné, vznikne šedá. Kolik je všech barev? 256 · 256 · 256 = 16 777 216. Odtud pochází známých „16,7 milionu barev“.</p>
<div class="note"><span class="tape blue">Zkrácený zápis</span><p>Když se v každém bajtu opakuje stejná číslice, stačí napsat jen tři: #F80 je totéž co #FF8800.</p></div>

<h2>Písmena jsou taky čísla</h2>
<p>Počítač umí ukládat jen čísla, takže každý znak má svůj číselný kód. Základní tabulka se jmenuje <dfn>ASCII</dfn>. Velké A má kód 65 (41<sub>16</sub>), B je 66 a tak dál. Malá písmena začínají na 97 (61<sub>16</sub>). Malé a velké písmeno se liší přesně o 32, tedy v jediném bitu.</p>
<div class="w" data-w="ascii" data-value="Ahoj, světe!"></div>
<p>ASCII ale nezná háčky ani čárky. Česká písmena se dnes ukládají v kódování <dfn>UTF-8</dfn>, kde zabírají dva bajty: č je C4 8D. Každý znak včetně emoji má v Unicode svoje číslo, které se píše šestnáctkově. Například smajlík 😀 je U+1F600.</p>

<h2>Adresy v síti</h2>
<p>Adresa IPv4 má 32 bitů, tedy čtyři bajty. Pro lidi se zapisuje jako čtyři desítková čísla oddělená tečkami. Zkus zadat jinou adresu:</p>
<div class="w" data-w="ipv4" data-value="192.168.1.10"></div>
<p>Maska sítě 255.255.255.0 je dvojkově 24 jedniček a 8 nul. Novější adresy IPv6 mají 128 bitů a píšou se šestnáctkově, třeba 2001:db8::1. Šestnáctkově se zapisují i fyzické adresy síťových karet (MAC adresy), například 3C:22:FB:9A:01:7E.</p>

<h2>Paměť a chybová hlášení</h2>
<p>Adresy v paměti počítače bývají dlouhé, a proto se píšou šestnáctkově, třeba 0x7FFE4A10. Šestnáctkové kódy uvidíš i v chybových hlášeních programů a systému. Když teď někde uvidíš 0x, víš, co to znamená.</p>

<div class="w" data-w="exercise"></div>

<section class="summary"><span class="tape">Shrnutí</span><ul>
<li>Barva #RRGGBB jsou 3 bajty: červená, zelená, modrá (každá 00–FF).</li>
<li>Znaky mají číselné kódy: A = 65 = 41<sub>16</sub>.</li>
<li>Adresa IPv4 má 4 bajty, MAC adresy a IPv6 se píšou šestnáctkově.</li>
</ul></section>

<!-- ================= LEKCE 14 ================= -->
<template id="tpl-lekce-14">
<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>jak počítač ukládá záporná čísla,</li>
<li>jak zapsat záporné číslo v doplňkovém kódu,</li>
<li>proč se díky tomu odčítání mění ve sčítání.</li>
</ul></section>

<h2>Počítač nemá minus</h2>
<p>V paměti jsou jen bity a znaménko minus tam napsat nejde. Záporná čísla se proto musí zakódovat. Dnes se téměř všude používá <dfn>doplňkový kód</dfn> (anglicky <i lang="en">two's complement</i>, dvojkový doplněk).</p>

<h2>Nejvyšší bit má zápornou váhu</h2>
<p>Myšlenka je jednoduchá: nejvyšší bit dostane <strong>zápornou</strong> váhu. V osmi bitech tedy místo +128 platí −128. Ostatní váhy zůstanou stejné:</p>
<div class="w" data-w="weights" data-base="2" data-n="8" data-signed="1"></div>
<p>Je-li nejvyšší bit 0, je číslo kladné (nebo nula) a čte se úplně normálně. Je-li 1, je číslo záporné. Například:</p>
<p class="formula">1111 1011 = −128 + 64 + 32 + 16 + 8 + 2 + 1 = −5</p>
<div class="w" data-w="signed" data-value="251"></div>
<p>Do osmi bitů se tak vejdou čísla od −128 do +127. V 16 bitech je to −32 768 až 32 767.</p>

<h2>Jak zapsat záporné číslo</h2>
<ol class="steps">
<li>Zapiš kladnou hodnotu v daném počtu bitů: 5 = 0000 0101.</li>
<li>Prohoď všechny bity, nuly na jedničky a naopak: 1111 1010.</li>
<li>Přičti jedničku: 1111 1011. To je −5.</li>
</ol>
<p>Funguje to i obráceně: z −5 stejným postupem (prohodit a přičíst 1) dostaneš zase 5. Na panelu výš to udělá tlačítko <b>Změnit znaménko</b>.</p>

<h2>Proč je to tak chytré</h2>
<p>Odčítání se změní ve sčítání. Chceš spočítat 7 − 5? Sečti 7 a −5:</p>
<div class="w" data-w="colop" data-base="2" data-op="add" data-a="00000111" data-b="11111011" data-bits="8"></div>
<p>Vyjde 1 0000 0010. Devátý bit se do osmi bitů nevejde a zahodí se. Zbyde 0000 0010 = 2, přesně 7 − 5. Procesor si tedy vystačí se sčítačkou a s obvodem, který prohazuje bity.</p>

<div class="w" data-w="exercise"></div>

<section class="summary"><span class="tape">Shrnutí</span><ul>
<li>V doplňkovém kódu má nejvyšší bit zápornou váhu (v 8 bitech −128).</li>
<li>Opačné číslo získáš tak, že prohodíš všechny bity a přičteš 1.</li>
<li>Rozsah 8 bitů je −128 až 127. Odčítání = sčítání se záporným číslem.</li>
</ul></section>
<div class="w" data-w="games" data-list="spinace:3"></div>
</template>

<!-- ================= LEKCE 15 ================= -->
<template id="tpl-lekce-15">
<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>logické operace AND, OR, XOR a NOT,</li>
<li>bitové posuny,</li>
<li>k čemu se to hodí v praxi a v programování.</li>
</ul></section>

<h2>Čtyři základní operace</h2>
<p>Kromě počítání umí procesor s bity dělat i <dfn>logické operace</dfn>. Pracují s každým bitem zvlášť, takže se nic nepřenáší do vedlejších sloupců.</p>
<div class="w" data-w="truth"></div>
<ul>
<li><b>AND</b> (a zároveň): výsledek je 1 jen tehdy, když jsou oba bity 1.</li>
<li><b>OR</b> (nebo): výsledek je 1, když je aspoň jeden bit 1.</li>
<li><b>XOR</b> (buď, anebo): výsledek je 1, když se bity liší.</li>
<li><b>NOT</b> (negace): prohodí 0 a 1.</li>
</ul>

<h2>Vyzkoušej si to</h2>
<p>Nastav dvě osmibitová čísla A a B, vyber operaci a sleduj výsledek.</p>
<div class="w" data-w="logic"></div>

<h2>K čemu to je</h2>
<ul>
<li><strong>Maskování.</strong> AND s maskou 0000 1111 vynuluje horní čtyři bity a nechá jen dolní půlbajt. Tak se z bajtu vytáhne jedna šestnáctková číslice.</li>
<li><strong>Nastavení bitu.</strong> OR s 0010 0000 nastaví šestý bit zprava na 1. Takhle se z velkého písmena udělá malé: A (0100 0001) OR 0010 0000 = a (0110 0001).</li>
<li><strong>Přepínání.</strong> XOR s jedničkou bit přepne. Když na data použiješ XOR se stejným klíčem dvakrát, dostaneš je zpátky. Na tom stojí jednoduché šifry.</li>
<li><strong>Posuny.</strong> Posun doleva o n míst násobí 2<sup>n</sup>, posun doprava o n míst dělí 2<sup>n</sup> (zbytek se zahodí).</li>
</ul>
<div class="note"><span class="tape blue">V programování</span><p>V JavaScriptu, Pythonu, C i Javě najdeš operátory <code>&amp;</code> (AND), <code>|</code> (OR), <code>^</code> (XOR), <code>~</code> (NOT) a <code>&lt;&lt;</code>, <code>&gt;&gt;</code> (posuny). Například <code>0b1100 &amp; 0b1010</code> dá 8.</p></div>

<div class="w" data-w="exercise"></div>

<section class="summary"><span class="tape">Shrnutí</span><ul>
<li>AND: oba bity 1. OR: aspoň jeden bit 1. XOR: bity se liší. NOT: prohodí.</li>
<li>Masky s AND, OR a XOR slouží k vynulování, nastavení a přepnutí bitů.</li>
<li>Posuny násobí a dělí mocninami dvojky.</li>
</ul></section>
<div class="w" data-w="games" data-list="zprava:2"></div>
</template>

<template id="tpl-lekce-16">
<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>co je logické hradlo a jak vypadají jeho značky,</li>
<li>jak číst pravdivostní tabulku,</li>
<li>jak z pár hradel postavit sčítačku, která počítá jako procesor.</li>
</ul></section>

<h2>Bit jako vypínač</h2>
<p>V počítači je bit napětí na drátu: vysoké napětí znamená 1, nízké 0. O všechno se starají <dfn>tranzistory</dfn>, drobné vypínače, které místo prstu ovládá zase elektřina. Když se několik tranzistorů vhodně propojí, vznikne <dfn>logické hradlo</dfn>: součástka, která z jednoho nebo dvou bitů na vstupu spočítá jeden bit na výstupu.</p>
<p>Z hradel se skládá úplně všechno: sčítačky, paměti i celý procesor. Moderní procesor jich obsahuje miliardy.</p>

<h2>Hradla a jejich značky</h2>
<p>Operace AND, OR, XOR a NOT znáš z lekce 15. Teď je potkáš jako skutečné součástky. Ve schématech se kreslí těmito značkami, vstupy jsou vlevo a výstup vpravo:</p>
<div class="w" data-w="gates"></div>
<p>Malé kolečko na výstupu znamená <b>negaci</b>, tedy prohození 0 a 1. Proto je NAND opakem AND, NOR opakem OR a XNOR opakem XOR.</p>

<h2>Pravdivostní tabulka</h2>
<p>Pravdivostní tabulka vypíše všechny kombinace vstupů a u každé, co ukáže výstup. Obvod se dvěma vstupy má 4 řádky, se třemi vstupy 8 řádků a s n vstupy 2<sup>n</sup> řádků. Je to stejné jako počet hodnot v n bitech.</p>
<p>Řádky se píšou ve stejném pořadí, jako když počítáš ve dvojkové soustavě: 00, 01, 10, 11.</p>

<h2>Sčítačka z hradel</h2>
<p>Když sčítáš dva bity, můžou nastat čtyři případy: 0 + 0 = 0, 0 + 1 = 1, 1 + 0 = 1 a 1 + 1 = 10<sub>2</sub>. Výsledek má dvě číslice: <b>součet S</b> (pravá číslice) a <b>přenos P</b> (levá číslice). Podívej se na tabulku:</p>
<ul>
<li>součet S je 1, když se bity liší. To je přesně <b>XOR</b>,</li>

</ul>

<div class="w" data-w="circuit" data-preset="full"></div>

<div class="note"><span class="tape blue">Zajímavost</span><p>Hradlo NAND je univerzální: dá se z něj postavit úplně každé jiné hradlo. Tady je XOR ze čtyř hradel NAND. Výrobci čipů toho využívají, protože stačí vyrábět jeden typ hradla.</p><div class="w" data-w="circuit" data-preset="nand"></div></div>

<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>jak spolu pracují procesor a paměť,</li>
<li>co jsou registry a jak vypadá strojový kód,</li>
<li>jak procesor provádí program krok za krokem.</li>
</ul></section>

<h2>Program je jen řada čísel</h2>
<p><dfn>Paměť</dfn> je dlouhá řada buněk. Každá buňka má číslo, kterému se říká <dfn>adresa</dfn>, a uchovává jeden bajt. V paměti je uložený program i data, se kterými program pracuje. Pro paměť je obojí stejné: jen čísla.</p>
<p><dfn>Procesor</dfn> si z paměti postupně čte instrukce a provádí je. Instrukce jsou jednoduché: načti číslo, přičti číslo, ulož číslo, skoč jinam. Složité programy vznikají tím, že se jich provedou miliony za sekundu.</p>

<h2>Registry: paměť přímo v procesoru</h2>
<p>Procesor má pár malých a velmi rychlých pamětí, kterým se říká <dfn>registry</dfn>. Náš cvičný procesor BD-8 jich má jen několik:</p>
<ul>
<li><b>PC</b> (čítač instrukcí) ukazuje adresu další instrukce,</li>
<li><b>IR</b> (registr instrukce) drží právě prováděnou instrukci,</li>
<li><b>A</b> (akumulátor) je pracovní registr, ve kterém se počítá,</li>
<li><b>příznaky</b> C a Z si pamatují, jestli poslední výpočet přetekl a jestli vyšla nula.</li>
</ul>
<p>Sčítání a odčítání obstarává <b>ALU</b>, tedy sčítačka z hradel z lekce 16.</p>

<h2>Strojový kód</h2>
<p>Procesor BD-8 má instrukce dlouhé jeden bajt. Horní čtyři bity říkají, <b>co</b> se má udělat (kód operace), dolní čtyři bity, <b>s čím</b> (adresa buňky nebo malé číslo). Bajt 0001 1110 tak znamená: kód 0001 je LDA, adresa 1110 je 14. Tedy „načti do A číslo z buňky 14“.</p>
<div class="w" data-w="isa"></div>
<p>Lidé místo jedniček a nul píšou zkratky jako LDA 14. Tomuhle zápisu se říká <dfn>jazyk symbolických adres</dfn> (assembler). Překladač ho pak převede na čísla.</p>

<h2>Načti, dekóduj, proveď</h2>
<p>Procesor pořád dokola opakuje tři kroky:</p>
<ol class="steps">
<li><b>Načtení.</b> Z adresy, na kterou ukazuje PC, zkopíruje bajt do registru IR a PC zvětší o jedna.</li>
<li><b>Dekódování.</b> Rozdělí bajt na kód operace a adresu a zjistí, co má dělat.</li>
<li><b>Provedení.</b> Instrukci provede: třeba sečte, uloží výsledek nebo přepíše PC, a tím skočí jinam.</li>
</ol>
<p>Program, který sečte 28 + 14, vypadá v paměti takhle:</p>

<template id="tpl-lekce-18">
<section class="goals"><span class="tape">Co se naučíš</span><ul>
<li>čím se liší qubit od obyčejného bitu,</li>
<li>co je superpozice a co se stane při měření,</li>
<li>co je provázání a k čemu se kvantové počítače hodí.</li>
</ul></section>
<p>Tahle lekce je bonus. Nečeká se, že všemu porozumíš napoprvé. Kvantová fyzika překvapuje i vědce.</p>

<h2>Bit, nebo qubit?</h2>
<p>Obyčejný bit je vždycky buď 0, nebo 1. <dfn>Qubit</dfn> (kvantový bit) může být v <dfn>superpozici</dfn>: v jakési směsi obou stavů najednou. Zapisuje se pomocí dvou čísel, kterým se říká <dfn>amplitudy</dfn>. Jedna patří stavu |0⟩, druhá stavu |1⟩. Značka |0⟩ se čte „ket nula“ a znamená prostě stav nula.</p>
<p>Například stav (|0⟩ + |1⟩)/√2 má obě amplitudy rovné 1/√2, tedy asi 0,71.</p>

<h2>Měření</h2>
<p>Do qubitu se nedá jen tak nahlédnout. Když ho <b>změříš</b>, vyjde vždycky obyčejná 0, nebo 1. Pravděpodobnost výsledku je <b>druhá mocnina amplitudy</b>: 0,71 · 0,71 ≈ 0,5, takže u stavu (|0⟩ + |1⟩)/√2 padne 0 i 1 s pravděpodobností 50 %. Po měření superpozice zmizí a qubit zůstane v tom stavu, který vyšel.</p>
<p>Vyzkoušej si jeden qubit. Klikni na políčko na drátu, dej tam bránu H a změř ho stokrát:</p>
<div class="w" data-w="qubit"></div>

<h2>Kvantové brány</h2>
<p>S qubity se pracuje pomocí <dfn>kvantových bran</dfn>, obdoby hradel:</p>
<ul>
<li><b>X</b> překlopí |0⟩ na |1⟩ a naopak, je to kvantové NOT,</li>
<li><b>H</b> (Hadamardova brána) udělá z |0⟩ rovnoměrnou superpozici,</li>
<li><b>Z</b> otočí znaménko amplitudy u |1⟩,</li>
<li><b>S</b> vynásobí amplitudu u |1⟩ imaginární jednotkou i.</li>
</ul>
<p>Amplitudy můžou být záporné, a proto se umějí navzájem <b>vyrušit</b>. Zkus v ukázce dát dvě brány H za sebou: první udělá superpozici, druhá ji zase složí zpátky na |0⟩. Tomu se říká <dfn>interference</dfn> a je to hlavní trik kvantových algoritmů: správné výsledky se posilují, špatné se ruší.</p>

<h2>Víc qubitů a provázání</h2>
<p>Dva qubity mají čtyři možné výsledky měření (00, 01, 10, 11) a stav popisují čtyři amplitudy. Tři qubity mají osm amplitud a n qubitů 2<sup>n</sup>. Padesát qubitů už potřebuje přes biliardu čísel, a proto se velké kvantové počítače na obyčejném počítači nedají nasimulovat.</p>
<p>Brána <b>CNOT</b> působí na dva qubity: když je řídicí qubit 1, překlopí cílový. Když dáš na první qubit H a pak CNOT, vznikne <dfn>provázaný</dfn> stav (|00⟩ + |11⟩)/√2. Oba qubity pak při měření vyjdou vždycky stejně, i když každý zvlášť je náhodný. Změříš jeden a hned víš, co ukáže druhý.</p>

<h2>K čemu jsou kvantové počítače</h2>
<ul>
<li><b>Simulace přírody.</b> Molekuly se řídí kvantovou fyzikou, takže kvantový počítač by mohl pomoct s vývojem léků nebo nových materiálů.</li>
<li><b>Šifry.</b> Shorův algoritmus umí rychle rozložit velká čísla na prvočinitele. Dostatečně velký kvantový počítač by tak prolomil dnešní šifru RSA, proto už se zavádějí nové, odolnější šifry.</li>
<li><b>Hledání.</b> Groverův algoritmus prohledá neuspořádaná data rychleji než obyčejný počítač.</li>
</ul>
<div class="note"><span class="tape blue">Realita</span><p>Qubity jsou velmi křehké: stačí teplo nebo drobné rušení a superpozice se rozpadne. Mnohé kvantové procesory se proto chladí skoro na absolutní nulu. Největší dnešní kvantové procesory mají stovky až tisíce qubitů a pořád dělají hodně chyb. Tvůj notebook ale nenahradí: hodí se jen na některé speciální úlohy.</p></div>

<div class="note"><span class="tape red">Vyzkoušej</span><p>V <a href="#kvantum">kvantové laboratoři</a> čeká deset úloh: od překlopení qubitu po tři provázané qubity. A ve volném režimu můžeš zkoumat cokoli.</p></div>

  add(fn) { if (this.dead) { try { fn(); } catch (e) { /* */ } return; } this.fns.push(fn); }

    const step = t => { if (this.dead) return; const dt = Math.min(.05, Math.max(0, (t - last) / 1000)); last = t; if (fn(dt, t) !== false) id = requestAnimationFrame(step); };
    id = requestAnimationFrame(step);
    this.add(() => cancelAnimationFrame(id));
  }

/* ---------- česká typografie: nezlomitelná mezera za jednopísmennými předložkami ---------- */

    let h = '<div class="wt-scroll"><table class="wt"><tbody>';
    if (st >= 1) h += `<tr class="wt-exp"><th>mocnina</th>${ds.map((_, i) => `<td>${base}<sup>${n - 1 - i}</sup></td>`).join('')}</tr><tr class="wt-w"><th>váha</th>${ds.map((_, i) => `<td>${fmt(w(i))}</td>`).join('')}</tr>`;
    h += `<tr class="wt-d"><th>číslice</th>${ds.map(d => `<td class="${st >= 2 ? (d ? 'hot' : 'dim') : ''}">${DIG[d]}</td>`).join('')}</tr>`;
    if (st >= 2 && letters.length) h += `<tr class="wt-v"><th>hodnota</th>${ds.map(d => `<td>${d}</td>`).join('')}</tr>`;
    if (st >= 2) h += `<tr class="wt-p"><th>${base === 2 ? 'bereme' : 'součin'}</th>${ds.map((d, i) => `<td class="${d ? '' : 'dim'}">${base === 2 ? (d ? fmt(w(i)) : '–') : `${d} · ${fmt(w(i))}<br><b>${fmt(d * w(i))}</b>`}</td>`).join('')}</tr>`;
    h += '</tbody></table></div>';
    if (st >= 3) {
      const terms = ds.map((d, i) => d ? fmt(d * w(i)) : null).filter(Boolean);
      h += `<p class="calc-line">${terms.length ? terms.join(' + ') : '0'} = <b>${fmt(total)}</b><sub>10</sub></p>`;
    }
    return h;
  };
  const firstWeights = Array.from({ length: Math.min(n, 4) }, (_, k) => fmt(base ** k)).join(', ');
  return [
    { html: table(0), note: `Převádíme číslo <b class="mono">${str}<sub>${base}</sub></b> do desítkové soustavy. Má ${n} ${plural(n, 'číslici', 'číslice', 'číslic')}.` },
    { html: table(1), note: `Nad každou číslici napíšeme váhu jejího řádu. Začínáme zprava: ${firstWeights}${n > 4 ? '…' : '.'} Každá váha je ${TIMES[base]} větší než ta vpravo od ní.` },
    { html: table(2), note: base === 2 ? 'Jednička znamená „tuhle váhu započítej“, nula „přeskoč“.' : `Každou číslici vynásobíme vahou jejího řádu.${letters.length ? ' Písmena nejdřív přepíšeme na čísla: ' + letters.map(d => `${DIG[d]} = ${d}`).join(', ') + '.' : ''}` },
    { html: table(3), note: `Nakonec všechno sečteme: ${str}<sub>${base}</sub> = <b>${fmt(total)}</b><sub>10</sub>.` },
  ];
}

/** Hornerovo schéma: zleva, výsledek × základ + číslice. */
function stepsHorner(str, base) {
  str = String(str).toUpperCase().replace(/^0+(?=.)/, '');
  const ds = [...str].map(c => DIG.indexOf(c));
  const rows = []; let acc = 0;
  ds.forEach(d => { const nv = acc * base + d; rows.push({ acc, d, nv }); acc = nv; });
  const render = k => {
    let h = `<div class="hn"><div class="hn-digits mono">${ds.map((d, i) => `<span class="${i < k - 1 ? 'used' : ''}${i === k - 1 ? 'cur' : ''}">${DIG[d]}</span>`).join('')}</div>`;
    if (k) h += `<table class="hn-t"><tbody>${rows.slice(0, k).map((r, j) => `<tr${j === k - 1 ? ' class="new"' : ''}><td>${fmt(r.acc)} · ${base} + ${r.d}</td><td>=</td><td><b>${fmt(r.nv)}</b></td></tr>`).join('')}</tbody></table>`;
    return h + '</div>';
  };
  const steps = [{ html: render(0), note: `Začínáme s výsledkem 0. Číslice čísla ${str}<sub>${base}</sub> budeme brát zleva.` }];
  rows.forEach((r, j) => steps.push({ html: render(j + 1), note: `${j + 1}. číslice zleva je ${dv(r.d, base)}. Dosavadní výsledek ${fmt(r.acc)} vynásobíme ${BASE[base].ins} a přičteme ji: ${fmt(r.acc)} · ${base} + ${r.d} = <b>${fmt(r.nv)}</b>.` }));
  steps[steps.length - 1].note += ` Hotovo: ${str}<sub>${base}</sub> = <b>${fmt(acc)}</b><sub>10</sub>.`;
  return steps;
}

/** Postupné dělení základem, zbytky se čtou odspodu. */
function stepsDivision(n, base) {
  const rows = []; let q = n;
  do { rows.push({ n: q, q: Math.floor(q / base), r: q % base }); q = Math.floor(q / base); } while (q > 0);
  const result = rows.map(r => DIG[r.r]).reverse().join('');
  const render = (k, final) => {
    let h = `<div class="dv-wrap"><table class="dv"><thead><tr><th>dělení</th><th>podíl</th><th>zbytek</th>${final ? '<th>čti</th>' : ''}</tr></thead><tbody>`;
    rows.slice(0, k).forEach((r, j) => {
      h += `<tr${j === k - 1 && !final ? ' class="new"' : ''}><td>${fmt(r.n)} : ${base}</td><td>${fmt(r.q)}</td><td class="rem">${r.r > 9 ? `${r.r} → <b>${DIG[r.r]}</b>` : `<b>${r.r}</b>`}</td>${final && j === 0 ? `<td class="up" rowspan="${k}" aria-label="čti odspodu nahoru"></td>` : ''}</tr>`;
    });
    if (k === 0) h += `<tr class="new"><td>${fmt(n)} : ${base}</td><td>?</td><td class="rem">?</td></tr>`;
    h += '</tbody></table></div>';
    if (final) h += `<p class="calc-line">${fmt(n)}<sub>10</sub> = <b>${result}</b><sub>${base}</sub></p>`;
    return h;
  };
  const B = BASE[base];
  const steps = [{ html: render(0), note: `Převádíme ${fmt(n)}<sub>10</sub> do ${B.gen} soustavy. Budeme opakovaně dělit ${B.ins} a zapisovat zbytky.` }];
  rows.forEach((r, j) => {
    const check = base === 2
      ? `${fmt(r.n)} je ${r.r ? 'liché' : 'sudé'}: 2 · ${fmt(r.q)}${r.r ? ' + 1' : ''} = ${fmt(r.n)}`
      : `${base} · ${fmt(r.q)} = ${fmt(base * r.q)} a ${fmt(r.n)} − ${fmt(base * r.q)} = ${r.r}`;
    steps.push({ html: render(j + 1), note: `${fmt(r.n)} : ${base} = ${fmt(r.q)}, zbytek <b>${r.r}</b>${r.r > 9 ? ` (zapíšeme jako ${DIG[r.r]})` : ''}. <span class="muted">(${check})</span> ${r.q === 0 ? 'Podíl je 0, končíme.' : 'Pokračujeme s podílem.'}` });
  });
  steps.push({ html: render(rows.length, true), note: `Zbytky přečteme <b>odspodu nahoru</b>: ${fmt(n)}<sub>10</sub> = <b>${result}</b><sub>${base}</sub>.` });
  return steps;
}

/** Odečítání vah od největší (placení mincemi 128, 64, 32 …). */
function stepsCoins(n) {
  if (n === 0) return [{ html: '<p class="calc-line"><b>0</b><sub>2</sub></p>', note: 'Nula je ve dvojkové soustavě taky 0. Není co platit.' }];
  const L = n.toString(2).length;
  const ws = Array.from({ length: L }, (_, k) => 2 ** (L - 1 - k));
  const rows = []; let rest = n;
  ws.forEach(w => { const take = rest >= w; rows.push({ w, take, before: rest, after: take ? rest - w : rest }); if (take) rest -= w; });
  const render = k => {
    let h = `<div class="coins">${ws.map((w, i) => `<span class="coin${i < k ? (rows[i].take ? ' take' : ' skip') : ''}${i === k - 1 ? ' cur' : ''}">${fmt(w)}</span>`).join('')}</div>`;
    h += `<div class="coin-bits mono">${ws.map((_, i) => `<span class="${i < k ? (rows[i].take ? 'b1' : 'b0') : 'bq'}">${i < k ? (rows[i].take ? 1 : 0) : '?'}</span>`).join('')}</div>`;
    h += `<p class="calc-line">Zbývá zaplatit: <b>${fmt(k ? rows[k - 1].after : n)}</b></p>`;
    return h;
  };
  const steps = [{ html: render(0), note: `Máme „zaplatit“ ${fmt(n)}. Největší váha, která se do ${fmt(n)} vejde, je ${fmt(ws[0])}. Od ní začneme.` }];
  rows.forEach((r, i) => steps.push({ html: render(i + 1), note: r.take
    ? `Vejde se ${fmt(r.w)} do ${fmt(r.before)}? <b>Ano</b> → píšeme 1 a odečteme: ${fmt(r.before)} − ${fmt(r.w)} = ${fmt(r.after)}.`
    : `Vejde se ${fmt(r.w)} do ${fmt(r.before)}? <b>Ne</b> → píšeme 0.` }));
  steps[steps.length - 1].note += ` Zbývá 0, hotovo: ${fmt(n)}<sub>10</sub> = <b>${toB(n, 2)}</b><sub>2</sub>.`;
  return steps;
}

/** Mřížka pro písemné počty. rows: [{cells: [od jednotek…], sign, cls}] nebo {rule: true}. */
function colsHtml(W, rows, active) {
  let h = `<div class="cols-scroll"><div class="cols" style="--w:${W}">`;
  for (const r of rows) {
    if (r.rule) { h += '<div class="c-rule"></div>'; continue; }
    h += `<div class="c-sign">${r.sign || ''}</div>`;
    for (let i = W - 1; i >= 0; i--) {
      const v = r.cells[i];
      h += `<div class="c ${r.cls || ''}${i === active ? ' act' : ''}${r.mark && r.mark[i] ? ' ' + r.mark[i] : ''}">${v == null ? '' : (typeof v === 'number' ? (DIG[v] ?? String(v)) : v)}</div>`;
    }
  }
  return h + '</div></div>';
}

function stepsAdd(a, b, base, opts = {}) {
  const bits = opts.bits || 0;
  const A = digs(a, base, bits), B = digs(b, base, bits);
  const len = Math.max(A.length, B.length), W = len + 1;
  const carry = Array(W).fill(null), R = Array(W).fill(null), mark = Array(W).fill(null);
  const rows = () => [{ cls: 'carry', cells: carry }, { cells: A }, { cells: B, sign: '+' }, { rule: true }, { cls: 'res', cells: R.slice(), mark }];
  const steps = [{ html: colsHtml(W, rows(), -1), note: 'Čísla zapíšeme pod sebe, zarovnaná vpravo. Sčítáme po sloupcích zprava doleva.' }];
  let c = 0;
  for (let i = 0; i < len; i++) {
    const x = A[i] ?? 0, y = B[i] ?? 0, s = x + y + c;
    R[i] = s % base; const nc = Math.floor(s / base);
    let note = `${i + 1}. sloupec zprava: ${dv(x, base)} + ${dv(y, base)}${c ? ` + ${c} (přenos)` : ''} = `;
    if (base === 2) note += s < 2 ? `<b>${s}</b> → píšeme ${s}.` : `${s}, dvojkově <b>${toB(s, 2)}</b> → píšeme ${s % 2} a 1 přenášíme do dalšího sloupce.`;
    else note += s < base ? `${s}${s > 9 ? ` = ${DIG[s]}` : ''} → píšeme <b>${DIG[s]}</b>.` : `${s}, to je 16 a víc → ${s} − 16 = ${s - 16}${s - 16 > 9 ? ` = ${DIG[s - 16]}` : ''}, píšeme <b>${DIG[s - 16]}</b> a 1 přenášíme.`;
    if (nc) carry[i + 1] = nc;
    c = nc;
    steps.push({ html: colsHtml(W, rows(), i), note });
  }
  if (c) { R[len] = c; if (bits) mark[len] = 'drop'; steps.push({ html: colsHtml(W, rows(), len), note: `Zbyl přenos ${c}. Zapíšeme ho na začátek výsledku.` }); }
  const sum = a + b;
  let fin = `Výsledek: <b>${toB(sum, base)}</b><sub>${base}</sub>. Kontrola v desítkové soustavě: ${fmt(a)} + ${fmt(b)} = ${fmt(sum)}.`;
  if (bits && sum >= base ** bits) fin = `Přenos z nejvyššího řádu se do ${bits} bitů nevejde a zahodí se. Zbyde <b>${grp(toB(sum % base ** bits, base, bits))}</b><sub>${base}</sub> = ${fmt(sum % base ** bits)}.`;
  steps.push({ html: colsHtml(W, rows(), -1), note: fin });
  return steps;
}

function stepsSub(a, b, base) {
  const A = digs(a, base), B = digs(b, base), W = A.length;
  const brw = Array(W).fill(null), R = Array(W).fill(null);
  const rows = () => [{ cls: 'carry', cells: brw }, { cells: A }, { cells: B, sign: '−' }, { rule: true }, { cls: 'res', cells: R.slice() }];
  const steps = [{ html: colsHtml(W, rows(), -1), note: 'Menšenec nahoře, menšitel dole, zarovnané vpravo. Odčítáme po sloupcích zprava doleva.' }];
  let bi = 0;
  for (let i = 0; i < W; i++) {
    const x = A[i], y = B[i] ?? 0; let d = x - y - bi, nb = 0;
    let note = `${i + 1}. sloupec zprava: ${dv(x, base)} − ${dv(y, base)}${bi ? ' − 1 (výpůjčka)' : ''}`;
    if (d < 0) {
      d += base; nb = 1;
      note += ` nejde, vyšlo by záporné číslo. Vypůjčíme si ${base} z vyššího řádu: ${base} + ${x} − ${y}${bi ? ' − 1' : ''} = ${d}${d > 9 ? ` = ${DIG[d]}` : ''} → píšeme <b>${DIG[d]}</b> a do dalšího sloupce zapíšeme výpůjčku.`;
    } else note += ` = ${d}${d > 9 ? ` = ${DIG[d]}` : ''} → píšeme <b>${DIG[d]}</b>.`;
    R[i] = d; if (nb && i + 1 < W) brw[i + 1] = 1; bi = nb;
    steps.push({ html: colsHtml(W, rows(), i), note });
  }
  const res = a - b, rs = toB(res, base);
  steps.push({ html: colsHtml(W, rows(), -1), note: `Výsledek: <b>${rs}</b><sub>${base}</sub>${W > rs.length ? ' (nuly na začátku nepíšeme)' : ''}. Kontrola: ${fmt(a)} − ${fmt(b)} = ${fmt(res)}.` });
  return steps;
}

function stepsMul(a, b, base) {
  const A = digs(a, base), B = digs(b, base), prod = a * b, P = digs(prod, base);
  const As = toB(a, base);
  if (B.length === 1) {
    const d = B[0], W = Math.max(P.length, A.length);
    const carry = Array(W).fill(null), R = Array(W).fill(null);
    const rows = () => [{ cls: 'carry', cells: carry }, { cells: A }, { cells: B, sign: '·' }, { rule: true }, { cls: 'res', cells: R.slice() }];
    const steps = [{ html: colsHtml(W, rows(), -1), note: `Násobíme jednou číslicí. Postupujeme zprava doleva a každou číslici horního čísla vynásobíme číslem ${dv(d, base)}.` }];
    let c = 0;
    for (let i = 0; i < A.length; i++) {
      const p = A[i] * d + c, nc = Math.floor(p / base); R[i] = p % base;
      let note = `${i + 1}. číslice zprava: ${dv(A[i], base)} · ${dv(d, base)}${c ? ` + ${c} (přenos)` : ''} = ${p}`;
      note += p < base ? `${p > 9 ? ` = ${DIG[p]}` : ''} → píšeme <b>${DIG[p]}</b>.` : ` = ${nc} · ${base} + ${p % base} → píšeme <b>${DIG[p % base]}</b> a přenášíme ${nc}.`;
      if (nc && i + 1 < W) carry[i + 1] = nc;
      c = nc; steps.push({ html: colsHtml(W, rows(), i), note });
    }
    if (c) { R[A.length] = c; steps.push({ html: colsHtml(W, rows(), A.length), note: `Zbyl přenos ${c}. Zapíšeme ho na začátek výsledku.` }); }
    steps.push({ html: colsHtml(W, rows(), -1), note: `Výsledek: <b>${toB(prod, base)}</b><sub>${base}</sub>. Kontrola v desítkové soustavě: ${fmt(a)} · ${fmt(b)} = ${fmt(prod)}.` });
    return steps;
  }
  const parts = B.map((d, j) => ({ d, j, pd: d === 0 ? Array(A.length).fill(0) : digs(a * d, base) }));
  const W = Math.max(P.length, ...parts.map(p => p.j + p.pd.length));
  parts.forEach(p => { const cells = Array(W).fill(null); for (let t = 0; t < p.j; t++) cells[t] = '<span class="ph">·</span>'; p.pd.forEach((v, t) => { cells[p.j + t] = v; }); p.cells = cells; });
  const carry = Array(W).fill(null), R = Array(W).fill(null);
  const rows = (k, sum) => {
    const rs = [{ cells: A }, { cells: B, sign: '·' }, { rule: true }];
    if (sum) rs.push({ cls: 'carry', cells: carry });
    parts.slice(0, k).forEach((p, i) => rs.push({ cls: 'part', cells: p.cells, sign: i ? '+' : '' }));
    if (sum) { rs.push({ rule: true }); rs.push({ cls: 'res', cells: R.slice() }); }
    return rs;
  };
  const mist = j => plural(j, 'místo', 'místa', 'míst');
  const steps = [{ html: colsHtml(W, rows(0, false), -1), note: `Zapíšeme čísla pod sebe. Horním číslem ${As}<sub>${base}</sub> budeme postupně násobit každou číslici dolního čísla, zprava doleva.` }];
  parts.forEach((p, j) => {
    let note;
    if (base === 2) note = p.d
      ? `${j + 1}. číslice dolního čísla zprava je <b>1</b> → opíšeme horní číslo${j ? `, posunuté o ${j} ${mist(j)} doleva` : ''}.`
      : `${j + 1}. číslice dolního čísla zprava je <b>0</b> → řádek samých nul${j ? `, posunutý o ${j} ${mist(j)} doleva` : ''}. Klidně ho můžeš vynechat.`;
    else note = `${As} · ${DIG[p.d]} = ${toB(a * p.d, base)}<sub>${base}</sub>${j ? `, posunuto o ${j} ${mist(j)} doleva` : ''}. (Násobí se stejně jako jednou číslicí.)`;
    steps.push({ html: colsHtml(W, rows(j + 1, false), -1), note });
  });
  steps.push({ html: colsHtml(W, rows(parts.length, true), -1), note: 'Teď mezivýsledky sečteme po sloupcích zprava doleva, stejně jako při sčítání.' });
  let c = 0;
  for (let i = 0; i < W; i++) {
    const col = parts.map(p => p.cells[i]).filter(v => typeof v === 'number');
    if (!col.length && !c) break;
    const s = col.reduce((x, y) => x + y, 0) + c, nc = Math.floor(s / base); R[i] = s % base;
    let note = `${i + 1}. sloupec: ${col.length ? col.map(v => dv(v, base)).join(' + ') : '0'}${c ? ` + ${c} (přenos)` : ''} = ${s}`;
    if (s < base) note += `${s > 9 ? ` = ${DIG[s]}` : ''} → píšeme <b>${DIG[s]}</b>.`;
    else if (base === 2) note += ` = ${toB(s, 2)}<sub>2</sub> → píšeme <b>${s % 2}</b> a přenášíme ${nc}.`;
    else note += ` = ${nc} · 16 + ${s % 16} → píšeme <b>${DIG[s % 16]}</b> a přenášíme ${nc}.`;
    if (nc && i + 1 < W) carry[i + 1] = nc;
    c = nc;
    steps.push({ html: colsHtml(W, rows(parts.length, true), i), note });
  }
  steps.push({ html: colsHtml(W, rows(parts.length, true), -1), note: `Výsledek: <b>${toB(prod, base)}</b><sub>${base}</sub>. Kontrola: ${fmt(a)} · ${fmt(b)} = ${fmt(prod)}.` });
  return steps;
}

/* ---------- skupiny bitů (dvojková ↔ šestnáctková / osmičková) ---------- */
function groupsHtml(bin, size = 4) {
  const L = Math.ceil(bin.length / size) * size, padded = bin.padStart(L, '0'), added = L - bin.length;
  const ws = Array.from({ length: size }, (_, k) => 2 ** (size - 1 - k));
  let h = '<div class="nibs">';
  for (let g = 0; g < L; g += size) {
    const part = padded.slice(g, g + size), v = parseInt(part, 2);
    const sum = [...part].map((ch, k) => ch === '1' ? ws[k] : null).filter(x => x !== null);
    h += `<div class="nib"><span class="ws" aria-hidden="true">${ws.map(w => `<i>${w}</i>`).join('')}</span><span class="bits">${[...part].map((ch, k) => `<span${g + k < added ? ' class="pad"' : ''}>${ch}</span>`).join('')}</span><span class="eq">${sum.length ? sum.join('+') : '0'} = ${v}</span><span class="hexd">${DIG[v]}</span></div>`;
  }
  return h + '</div>';
}
function digitBitsHtml(str, size = 4) {
  const ws = Array.from({ length: size }, (_, k) => 2 ** (size - 1 - k));
  let h = '<div class="nibs">';
  for (const ch of str) {
    const v = DIG.indexOf(ch), bits = toB(v, 2, size);
    const sum = [...bits].map((b, k) => b === '1' ? ws[k] : null).filter(x => x !== null);
    h += `<div class="nib"><span class="hexd">${ch}</span><span class="eq">${v} = ${sum.length ? sum.join('+') : '0'}</span><span class="ws" aria-hidden="true">${ws.map(w => `<i>${w}</i>`).join('')}</span><span class="bits">${[...bits].map(b => `<span>${b}</span>`).join('')}</span></div>`;
  }
  return h + '</div>';
}

/* ---------- statické tabulky do lekcí ---------- */
function weightsHtml(base, n, signed) {
  return `<div class="wstrip">${Array.from({ length: n }, (_, k) => { const e = n - 1 - k, neg = signed && k === 0; return `<div class="wcell${neg ? ' neg' : ''}"><span class="we">${neg ? '−' : ''}${base}<sup>${e}</sup></span><b>${neg ? '−' : ''}${fmt(base ** e)}</b></div>`; }).join('')}</div>`;
}
function countHtml(to) {
  const bits = toB(to, 2).length;
  const row = v => { const b = toB(v, 2, bits); return `<tr><td class="mono">${v}</td><td class="b">${[...b].map(c => `<span class="${c === '1' ? 'one' : 'zero'}">${c}</span>`).join('')}</td><td><span class="dots" aria-hidden="true">${[...b].map(c => `<i${c === '1' ? ' class="on"' : ''}></i>`).join('')}</span></td></tr>`; };
  const half = Math.ceil((to + 1) / 2);
  const table = (a, z) => `<table class="count-t"><thead><tr><th>desítkově</th><th>dvojkově</th><th>světla</th></tr></thead><tbody>${Array.from({ length: z - a }, (_, i) => row(a + i)).join('')}</tbody></table>`;
  return `<div class="count-wrap">${table(0, half)}${table(half, to + 1)}</div>`;

function nibTableHtml() {

function mountSigned(el) {
  el.innerHTML = `<div class="signed-w"><div data-p></div><div class="signed-read" aria-live="polite"></div>
    <div class="ctrl-row"><button type="button" class="key sm" data-a="neg">Změnit znaménko (−x)</button><button type="button" class="key sm" data-a="inc">+1</button><button type="button" class="key sm" data-a="dec">−1</button><button type="button" class="key sm" data-a="zero">Vynulovat</button></div>
    <p class="small muted signed-note center" aria-live="polite"></p></div>`;
  const note = $('.signed-note', el);
  const upd = () => { $('.signed-read', el).innerHTML = `<span>Se znaménkem: <b>${fmt(p.signedValue)}</b></span><span>Bez znaménka by to bylo: <b>${p.value}</b></span>`; };
  const p = new BitPanel($('[data-p]', el), { bits: 8, value: +(el.dataset.value || 0), signed: true, out: 'dec,sum', onChange: () => { upd(); note.textContent = ''; } });
  el.addEventListener('click', e => {
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
    if (a === 'neg') {
      const v = p.value, inv = (~v) & 255, res = (inv + 1) & 255;
      p.set(res);
      note.innerHTML = `Prohodíme bity: ${grp(toB(v, 2, 8))} → ${grp(toB(inv, 2, 8))}, přičteme 1: ${grp(toB(res, 2, 8))}. Z ${fmt(toSigned8(v))} je ${fmt(toSigned8(res))}.${v === 128 ? ' Číslo −128 nemá v osmi bitech kladný protějšek.' : ''}`;
    }
    if (a === 'inc') p.set(p.value + 1);

function mountLogic(el) {
  const OPS = ['AND', 'OR', 'XOR', 'NOT A', 'A << 1', 'A >> 1'];
  el.innerHTML = `<div class="logic-w"><div class="row-label">A</div><div data-a></div>
    <div class="logic-ops" role="group" aria-label="Operace">${OPS.map((o, i) => `<button type="button" class="chip${i === 0 ? ' on' : ''}" data-op="${o}" aria-pressed="${i === 0}">${esc(o)}</button>`).join('')}</div>
    <div class="row-label" data-bl>B</div><div data-b></div>
    <div class="lres"><span class="lbl">Výsledek</span><div class="lres-leds"></div><div class="calc-line" data-r></div></div></div>`;
  let op = 'AND';
  const upd = () => {
    const a = A.value, b = B.value;
    const r = op === 'AND' ? a & b : op === 'OR' ? a | b : op === 'XOR' ? a ^ b : op === 'NOT A' ? (~a) & 255 : op === 'A << 1' ? (a << 1) & 255 : a >> 1;
    const unary = !['AND', 'OR', 'XOR'].includes(op);
    $('[data-b]', el).hidden = unary; $('[data-bl]', el).hidden = unary;
    const nb = '\u00A0', bits = toB(r, 2, 8), sa = grp(toB(a, 2, 8), 4, nb), sb = grp(toB(b, 2, 8), 4, nb);
    $('.lres-leds', el).innerHTML = [...bits].map((c, i) => `<span class="led${c === '1' ? ' on' : ''}${i === 4 ? ' ng' : ''}">${c}</span>`).join('');
    const opTxt = op === 'NOT A' ? `NOT ${sa}` : op === 'A << 1' ? `${sa} &lt;&lt; 1` : op === 'A >> 1' ? `${sa} &gt;&gt; 1` : `${sa} ${op} ${sb}`;
    $('[data-r]', el).innerHTML = `${opTxt} = <b>${grp(bits, 4, nb)}</b><sub>2</sub> = ${r}<sub>10</sub> = ${toB(r, 16, 2)}<sub>16</sub>`;
  };
  const A = new BitPanel($('[data-a]', el), { bits: 8, value: 0b11001010, out: 'sum', size: 'sm', onChange: () => upd() });
  const B = new BitPanel($('[data-b]', el), { bits: 8, value: 0b10101100, out: 'sum', size: 'sm', onChange: () => upd() });
  el.addEventListener('click', e => {
    const btn = e.target.closest('[data-op]'); if (!btn) return;
    op = btn.dataset.op;
    $$('[data-op]', el).forEach(x => { x.classList.toggle('on', x === btn); x.setAttribute('aria-pressed', x === btn); });
    upd();
  });
  upd();
}

function checkEx(it, raw) { if (it.check) return !!it.check(raw); return parseNum(raw, it.base) === it.a; }
function exAnswer(it) { return it.show ?? (it.base === 10 ? fmt(it.a) : toB(it.a, it.base)); }
const GRADES = { 1: 'výborně', 2: 'chvalitebně', 3: 'dobře' };

function mountExercise(el, n) {
  const items = LESSON_EX[n] || [];
  if (!items.length) { el.remove(); return; }
  const state = items.map(() => ({ tries: 0, done: false, shown: false }));
  const prev = Store.d.lessons[n];
  el.innerHTML = `<section class="ex" aria-label="Cvičení">
    <div class="ex-head"><span class="tape red">Zkus si</span><p>Napiš odpověď a potvrď Enterem. Mezery a nuly na začátku nevadí.${prev ? ` Lekci už máš splněnou (známka ${prev}), klidně si ji zopakuj.` : ''}</p></div>
    <ol class="ex-list">${items.map((it, i) => {
      const id = `ex-${n}-${i}`;
      const mode = it.mode || (it.base === 16 ? 'text' : 'numeric');
      return `<li class="ex-item" data-i="${i}"><label class="ex-q" for="${id}">${it.q}</label><div class="ex-a"><input class="inp" id="${id}" autocomplete="off" spellcheck="false" autocapitalize="off" inputmode="${mode}"><button type="button" class="key sm" data-a="check">Zkontrolovat</button><span class="ex-fb" aria-live="polite"></span></div></li>`;
    }).join('')}</ol>
    <div class="ex-foot"><span class="ex-count small muted"></span></div></section>`;
  const ex = $('.ex', el), foot = $('.ex-foot', el);
  const li = i => $(`.ex-item[data-i="${i}"]`, el);
  const count = () => { $('.ex-count', el).textContent = `Hotovo ${state.filter(s => s.done).length} z ${items.length}`; };
  const finishIfDone = () => {
    if (!state.every(s => s.done) || $('.stamp', ex)) return;
    const mistakes = state.reduce((s, x) => s + Math.max(0, x.tries - 1) + (x.shown ? 2 : 0), 0);
    const grade = mistakes === 0 ? 1 : mistakes <= 2 ? 2 : 3;
    ex.insertAdjacentHTML('beforeend', `<div class="stamp" aria-hidden="true"><div><b>${grade}</b><span>${GRADES[grade]}</span></div></div>`);
    Store.d.lessons[n] = Math.min(Store.d.lessons[n] || 9, grade); Store.save(); checkBadges();
    const next = LESSONS.find(l => l.n === n + 1);
    foot.innerHTML = `<span class="ex-count small">Lekce je splněná. Známka: <b>${grade}</b> (${GRADES[grade]}).</span>${grade > 1 ? '<button type="button" class="key sm" data-a="retry">Zkusit znovu na jedničku</button>' : ''}${next ? `<a class="key sm primary" href="#lekce-${next.n}">Další lekce: ${next.t} →</a>` : '<a class="key sm primary" href="#hry">Všechno máš za sebou. Hurá do her →</a>'}`;
    toast(`Lekce ${n} je splněná. Známka ${grade}, ${GRADES[grade]}!`, 'ok');
    Sound.win();
    refreshLessonMarks(n);
  };
  const check = i => {
    const it = items[i], st = state[i]; if (st.done) return;
    const box = li(i), inp = $('input', box), fb = $('.ex-fb', box), raw = inp.value;
    if (!raw.trim()) { fb.className = 'ex-fb'; fb.textContent = 'Nejdřív napiš odpověď.'; inp.focus(); return; }
    st.tries++;
    if (checkEx(it, raw)) {
      st.done = true; box.classList.add('ok'); inp.classList.remove('bad'); inp.classList.add('ok'); inp.disabled = true;
      $$('button', box).forEach(b => b.remove());
      fb.className = 'ex-fb ok'; fb.textContent = pick(['Správně!', 'Přesně tak!', 'Výborně!', 'Sedí!']);
      Sound.ok(); count();
      const nxt = state.findIndex(s => !s.done);
      if (nxt >= 0) $(`input`, li(nxt)).focus({ preventScroll: true });
      finishIfDone();
    } else {
      inp.classList.remove('ok', 'shake'); inp.classList.add('bad'); void inp.offsetWidth; inp.classList.add('shake');
      Sound.bad();
      const valid = it.check || !isNaN(parseNum(raw, it.base));
      let msg = valid ? 'Zatím ne, zkus to znovu.' : invalidMsg(it.base);
      if (it.hint) msg += ` <span class="hint">Nápověda: ${it.hint}</span>`;
      fb.className = 'ex-fb bad'; fb.innerHTML = msg;
      if (st.tries >= 2 && !$('[data-a="show"]', box)) fb.insertAdjacentHTML('beforebegin', '<button type="button" class="key sm" data-a="show">Ukázat řešení</button>');
    }
  };
  const show = i => {
    const it = items[i], st = state[i]; if (st.done) return;
    const box = li(i), inp = $('input', box), fb = $('.ex-fb', box);
    st.done = true; st.shown = true; box.classList.add('shown');
    inp.value = exAnswer(it); inp.disabled = true; inp.classList.remove('bad');
    $$('button', box).forEach(b => b.remove());
    fb.className = 'ex-fb'; fb.innerHTML = `Řešení: <b class="mono">${exAnswer(it)}</b>. Podívej se do textu lekce, jak se k němu dojde.`;
    count(); finishIfDone();
  };
  el._ex = { check, show };
  if (!el._exBound) {
    el._exBound = true;
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      const item = b.closest('.ex-item');
      if (b.dataset.a === 'check' && item) el._ex.check(+item.dataset.i);
      if (b.dataset.a === 'show' && item) el._ex.show(+item.dataset.i);
      if (b.dataset.a === 'retry') { mountExercise(el, n); $('input', el)?.focus(); }
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.ex-item input')) { e.preventDefault(); el._ex.check(+e.target.closest('.ex-item').dataset.i); } });
    el.addEventListener('input', e => { if (e.target.matches('.ex-item input')) e.target.classList.remove('bad'); });
  }
  count();
}

/* ---------- připojení ukázek do textu lekcí podle data-w ---------- */
function mountConvWidget(el, kind) {
  const base = +el.dataset.base, method = el.dataset.method || (kind === 'todec' ? 'weights' : 'division');
  const withInput = el.dataset.input === '1', id = uid('cw');
  const inBase = kind === 'todec' ? base : 10;
  const label = kind === 'todec' ? `Číslo v ${BASE[base].gen} soustavě` : 'Desítkové číslo';
  el.innerHTML = `${withInput ? `<div class="w-input"><label for="${id}">${label}:</label><input class="inp" id="${id}" autocomplete="off" spellcheck="false" inputmode="${inBase === 16 ? 'text' : 'numeric'}"><span class="w-err" aria-live="polite"></span></div>` : ''}<div class="sp-host"></div>`;
  const gen = s => {
    if (kind === 'todec') return method === 'horner' ? stepsHorner(s, base) : stepsToDec(s, base);
    const v = +s; return method === 'coins' ? stepsCoins(v) : stepsDivision(v, base);
  };
  const sp = new StepPlayer($('.sp-host', el), gen(el.dataset.value));
  if (!withInput) return;
  const inp = $('#' + id, el); inp.value = el.dataset.value;
  const limit = kind === 'todec' ? (base === 2 ? 2 ** 24 - 1 : base === 16 ? 0xFFFFFF : 999999999) : (method === 'coins' ? 65535 : base === 2 ? 1048575 : 16777215);
  inp.addEventListener('input', () => {
    const err = $('.w-err', el), v = parseNum(inp.value, inBase);
    if (!cleanNum(inp.value)) { err.textContent = ''; return; }
    if (isNaN(v) || v < 0) { err.textContent = invalidMsg(inBase); return; }
    if (v > limit) { err.textContent = `Zkus menší číslo (nejvýš ${kind === 'todec' ? toB(limit, base) : fmt(limit)}), ať je postup přehledný.`; return; }
    err.textContent = '';
    sp.set(gen(kind === 'todec' ? toB(v, base) : String(v)));
  });
}

function mountColOp(el) {
  const base = +el.dataset.base, op = el.dataset.op, bits = +el.dataset.bits || 0, withInput = el.dataset.input === '1';
  const sign = { add: '+', sub: '−', mul: '·' }[op];
  const ida = uid('ca'), idb = uid('cb'), mode = base === 16 ? 'text' : 'numeric';
  el.innerHTML = `${withInput ? `<div class="w-input"><label for="${ida}">Zkus vlastní čísla (${BASE[base].short}):</label><input class="inp short" id="${ida}" autocomplete="off" spellcheck="false" inputmode="${mode}"><span class="mono" aria-hidden="true">${sign}</span><label class="sr" for="${idb}">Druhé číslo</label><input class="inp short" id="${idb}" autocomplete="off" spellcheck="false" inputmode="${mode}"><span class="w-err" aria-live="polite"></span></div>` : ''}<div class="sp-host"></div>`;
  const gen = (a, b) => op === 'add' ? stepsAdd(a, b, base, { bits }) : op === 'sub' ? stepsSub(a, b, base) : stepsMul(a, b, base);
  const sp = new StepPlayer($('.sp-host', el), gen(parseInt(el.dataset.a, base), parseInt(el.dataset.b, base)));
  if (!withInput) return;
  const ia = $('#' + ida, el), ib = $('#' + idb, el);
  ia.value = el.dataset.a; ib.value = el.dataset.b;
  const upd = () => {
    const err = $('.w-err', el), a = parseNum(ia.value, base), b = parseNum(ib.value, base);
    if (isNaN(a) || isNaN(b) || a < 0 || b < 0) { err.textContent = invalidMsg(base); return; }
    const lim = op === 'mul' ? (base === 2 ? 1023 : 0xFFF) : (base === 2 ? 65535 : 0xFFFFF);
    if (a > lim || b > lim) { err.textContent = `Zkus menší čísla (nejvýš ${toB(lim, base)}), ať se postup vejde na obrazovku.`; return; }
    if (op === 'sub' && b > a) { err.textContent = 'Dolní číslo je větší než horní, výsledek by byl záporný. Prohoď je.'; return; }
    err.textContent = ''; sp.set(gen(a, b));
  };
  ia.addEventListener('input', upd); ib.addEventListener('input', upd);
}

function mountNibbles(el) {
  const dir = el.dataset.dir, id = uid('nb'), inB = dir === 'b2h' ? 2 : 16;
  el.innerHTML = `<div class="nib-w"><div class="w-input"><label for="${id}">${dir === 'b2h' ? 'Dvojkové číslo' : 'Šestnáctkové číslo'}:</label><input class="inp" id="${id}" autocomplete="off" spellcheck="false" inputmode="${inB === 16 ? 'text' : 'numeric'}"><span class="w-err" aria-live="polite"></span></div><div class="nib-out"></div></div>`;
  const inp = $('#' + id, el); inp.value = el.dataset.value;
  const upd = () => {
    const v = parseNum(inp.value, inB), err = $('.w-err', el);
    if (isNaN(v) || v < 0) { err.textContent = cleanNum(inp.value) ? invalidMsg(inB) : ''; return; }
    if (v > 0xFFFFFFFF) { err.textContent = 'Zkus kratší číslo (nejvýš 32 bitů).'; return; }
    err.textContent = '';
    const bin = toB(v, 2), hex = toB(v, 16);
    $('.nib-out', el).innerHTML = dir === 'b2h'
      ? `${groupsHtml(bin, 4)}<p class="nib-res">${grp(bin)}<sub>2</sub> = <b>${hex}</b><sub>16</sub></p>`
      : `${digitBitsHtml(hex, 4)}<p class="nib-res">${hex}<sub>16</sub> = <b>${grp(bin)}</b><sub>2</sub>${hex.length * 4 > bin.length ? ' <span class="muted small">(nuly na začátku vynecháme)</span>' : ''}</p>`;
  };
  inp.addEventListener('input', upd); upd();
}

function mountShiftPanel(el) {
  el.innerHTML = `<div data-p></div><div class="ctrl-row mt"><button type="button" class="key sm" data-a="shl">← Posun doleva (× 2)</button><button type="button" class="key sm" data-a="shr">Posun doprava (: 2) →</button><button type="button" class="key sm" data-a="zero">Vynulovat</button><button type="button" class="key sm" data-a="rand">Náhodné číslo</button></div><p class="small muted center mt" aria-live="polite" data-note>Zkus posouvat a sleduj, jak se mění hodnota.</p>`;
  const note = $('[data-note]', el);
  const p = new BitPanel($('[data-p]', el), { bits: +el.dataset.bits || 8, value: +el.dataset.value || 0, out: el.dataset.out || 'dec,sum', onChange: () => { note.textContent = ''; } });
  el.addEventListener('click', e => {
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
    const v = p.value;
    if (a === 'shl') { const nv = (v * 2) % (p.max + 1); p.set(nv); note.innerHTML = v * 2 > p.max ? `Nejvyšší jednička „vypadla“ ven z ${p.n} bitů. Tomu se říká přetečení.` : `${grp(toB(v, 2))}<sub>2</sub> → ${grp(toB(nv, 2))}<sub>2</sub>: připsali jsme nulu, ${fmt(v)} · 2 = ${fmt(nv)}.`; }
    if (a === 'shr') { const nv = Math.floor(v / 2); p.set(nv); note.innerHTML = `${grp(toB(v, 2))}<sub>2</sub> → ${grp(toB(nv, 2))}<sub>2</sub>: škrtli jsme poslední číslici, ${fmt(v)} : 2 = ${fmt(nv)}${v % 2 ? ', zbytek 1' : ''}.`; }
    if (a === 'zero') p.set(0);
    if (a === 'rand') p.set(rnd(1, p.max >> 1));
  });
}

function copyText(text, el) {
  const fallback = () => {
    try { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) { /* */ }
    toast('Kopírování tu nejde. Text je označený, zkopíruj ho klávesami Ctrl+C.');
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(`Zkopírováno: <span class="mono">${esc(text)}</span>`), fallback);
    else fallback();
  } catch (e) { fallback(); }
}

      ['Do šestnáctkové: dělení 16', () => sp(stepsDivision(v, 16))],

      ['Do osmičkové: po trojicích', () => html(`${groupsHtml(toB(v, 2), 3)}<p class="nib-res">${grp(toB(v, 2), 3)}<sub>2</sub> = <b>${toB(v, 8)}</b><sub>8</sub></p>`)],
    ],

      ['Do dvojkové: po číslicích', () => html(`${digitBitsHtml(toB(v, 16), 4)}<p class="nib-res">${toB(v, 16)}<sub>16</sub> = <b>${grp(toB(v, 2))}</b><sub>2</sub></p>`)],

function mountCalc(box) {
  box.innerHTML = `<h2>Písemné počty s postupem</h2><p class="muted">Sčítání, odčítání a násobení pod sebou ve dvojkové nebo šestnáctkové soustavě. Postup ukáže každý sloupec i přenos.</p>

    if (op === 'sub' && b > a) { err.textContent = 'Druhé číslo je větší než první, výsledek by byl záporný. Prohoď je.'; return; }
    err.textContent = '';
    const steps = op === 'add' ? stepsAdd(a, b, base) : op === 'sub' ? stepsSub(a, b, base) : stepsMul(a, b, base);
    if (!player) player = new StepPlayer(host, steps); else player.set(steps);
  };

    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.cb) {

  });

  ia.inputMode = ib.inputMode = 'numeric';
  upd();
}

function mountPanelTool(box) {
  box.innerHTML = `<h2>Bitový panel</h2><p class="muted">Až šestnáct přepínačů. Vyzkoušej posuny, inverzi nebo čtení se znaménkem (doplňkový kód).</p>
    <div class="tool-in">
      <div class="field"><span class="lbl" id="pt-l">Počet bitů</span><div class="seg-mini" role="radiogroup" aria-labelledby="pt-l">${[4, 8, 12, 16].map(n => `<button type="button" class="chip" role="radio" data-bits="${n}" aria-checked="${n === 16}">${n}</button>`).join('')}</div></div>
      <label class="chk"><input type="checkbox" id="pt-signed"><span>se znaménkem (doplňkový kód)</span></label>
    </div>
    <div class="bp-host"></div>
    <div class="ctrl-row">
      <button type="button" class="key sm" data-p="zero">Vynulovat</button>
      <button type="button" class="key sm" data-p="inc">+1</button>
      <button type="button" class="key sm" data-p="dec">−1</button>
      <button type="button" class="key sm" data-p="inv">Prohodit všechny bity</button>
      <button type="button" class="key sm" data-p="shl">Posun ← (× 2)</button>
      <button type="button" class="key sm" data-p="shr">Posun → (: 2)</button>
      <button type="button" class="key sm" data-p="rnd">Náhodně</button>
    </div>`;
  let bits = 16, signed = false, p = null, val = 0b0000011111101010;
  const build = () => {
    const out = signed ? 'dec,udec,hex,bin,sum' : 'dec,hex,bin,sum';
    p = new BitPanel($('.bp-host', box), { bits, signed, value: val % 2 ** bits, out, size: bits > 8 ? 'sm' : '', onChange: v => { val = v; } });
    val = p.value;
  };
  box.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.bits) { bits = +b.dataset.bits; $$('[data-bits]', box).forEach(x => x.setAttribute('aria-checked', +x.dataset.bits === bits)); build(); }
    const a = b.dataset.p; if (!a) return;
    const v = p.value, m = p.max;
    if (a === 'zero') p.set(0);
    if (a === 'inc') p.set(v + 1);
    if (a === 'dec') p.set(v - 1);
    if (a === 'inv') p.set(m - v);
    if (a === 'shl') p.set(v * 2);
    if (a === 'shr') p.set(Math.floor(v / 2));
    if (a === 'rnd') p.set(rnd(0, m));
  });
  $('#pt-signed', box).addEventListener('change', e => { signed = e.target.checked; build(); });
  build();
}

/** Odpočet času hry. Ukazuje zbývající sekundy v HUD a zkracuje časový pruh. */
function gameTimer(ctx, stage, seconds, onEnd) {
  const t0 = now(); let done = false;
  const bar = $('.timebar i', stage);
  const tick = () => {
    if (done) return;
    const left = Math.max(0, seconds - (now() - t0) / 1000);
    setH(stage, 'time', `${Math.ceil(left)} s`);
    if (bar) bar.style.transform = `scaleX(${left / seconds})`;
    if (left <= 0) { done = true; onEnd(); }
  };
  ctx.scope.every(200, tick); tick();
  return { left: () => Math.max(0, seconds - (now() - t0) / 1000), stop: () => { done = true; } };
}
/** Stopky: ukazují uplynulý čas, vrací funkci, která řekne počet sekund. */
function stopwatch(ctx, stage) {
  const t0 = now();
  const f = () => setH(stage, 'time', fmtTime((now() - t0) / 1000));
  ctx.scope.every(500, f); f();
  return () => (now() - t0) / 1000;
}

  mount(stage, ctx) {

  rules: '<p>Shora padají čísla. Nastav na spínačích stejné číslo ve dvojkové soustavě a stiskni <b>Pal!</b> nebo mezerník. Zasažené číslo zmizí. Když číslo dopadne na zem, přijdeš o jeden život. Čím víc zásahů, tím rychleji to padá.</p><p>Na obtížnosti Expert spínače nepoužíváš: padají dvojková čísla a ty píšeš jejich šestnáctkový zápis. Stačí napsat dvě číslice a výstřel proběhne sám.</p><p class="small muted">Klávesnice: číslice 1 až 8 přepínají spínače zleva, mezerník nebo Enter střílí, Backspace vše vypne.</p>',
  levels: [
    { d: 'Padají desítková čísla 1–15. Nastav je na čtyřech spínačích a vystřel. Pomalé tempo, 5 životů a vidíš, kolik máš nastaveno.', bits: 4, show: 10, max: 15, fall: 15, every: 3.6, lives: 5, live: true },

    stage.innerHTML = hud([['score', 'Skóre', 0], ['lives', 'Životy', livesHtml(lives, c.lives)], ['hits', 'Zásahy', 0]]) +
      `<div class="rain-wrap"><div class="rain" aria-label="Padající čísla"><div class="rain-ground"></div><div class="rain-msg" aria-live="polite"></div></div>
       <div class="rain-ctrl">${hexMode
        ? `<div class="hexbuf mono" aria-live="polite">_ _</div><div class="hexpad">${[...DIG].map(ch => `<button type="button" class="key" data-hx="${ch}">${ch}</button>`).join('')}</div><div class="rain-btns"><button type="button" class="key sm" data-g="bs">Smazat znak</button></div>`
        : `<div data-panel></div><div class="rain-btns"><button type="button" class="key primary big" data-g="fire">Pal! <kbd>mezerník</kbd></button><button type="button" class="key" data-g="clear">Vše vypnout</button></div>`}</div></div>`;
    const rain = $('.rain', stage), msg = $('.rain-msg', stage);

    const panel = hexMode ? null : new BitPanel($('[data-panel]', stage), { bits: c.bits, out: c.live ? 'dec' : '', keys: true, scope: ctx.scope, size: 'sm', noKeyClick: true });
    const drops = [];
    const label = v => c.show === 16 ? `${toB(v, 16, 2)}<sub>16</sub>` : c.show === 2 ? `${grp(toB(v, 2, 8))}<sub>2</sub>` : `${v}<sub>10</sub>`;
    const answer = v => hexMode ? `${toB(v, 16, 2)}<sub>16</sub>` : `${grp(toB(v, 2, c.bits))}<sub>2</sub>`;
    const spawn = () => {
      const n = clamp(Math.floor(W / 120), 2, 6), lw = W / n;
      const busy = new Set(drops.filter(d => d.y < 80).map(d => d.lane));
      const free = [...Array(n).keys()].filter(i => !busy.has(i)); if (!free.length) return;
      let v, guard = 0; do v = rnd(1, c.max); while (drops.some(d => d.v === v) && guard++ < 50);
      const el = document.createElement('div'); el.className = 'drop'; el.innerHTML = label(v); rain.appendChild(el);
      const lane = pick(free), w = el.offsetWidth, h = el.offsetHeight;
      const x = clamp(lane * lw + (lw - w) / 2 + rnd(-8, 8), 4, Math.max(4, W - w - 4));
      const d = { el, v, lane, x, y: -h - 4, h }; drops.push(d);
      el.style.transform = `translate(${x}px, ${d.y}px)`;

    const remove = d => { const i = drops.indexOf(d); if (i >= 0) drops.splice(i, 1); };

      msg.innerHTML = `Zásah! ${label(d.v)} = ${answer(d.v)} · +${pts} b.`;
    };
    const fire = v => {
      if (over) return;
      const targets = drops.filter(d => d.v === v).sort((a, b) => b.y - a.y);
      if (targets.length) { hitDrop(targets[0]); if (panel) panel.set(0, true); }
      else {

        d.y += vy * dt; d.el.style.transform = `translate(${d.x}px, ${d.y}px)`;

      const bufEl = $('.hexbuf', stage);

      const type = ch => { if (over) return; buf += ch; Sound.click(); if (buf.length >= 2) { const v = parseInt(buf, 16); buf = ''; fire(v); } showBuf(); };
      ctx.scope.listen(stage, 'click', e => {
        const h = e.target.closest('[data-hx]'); if (h) type(h.dataset.hx);
        if (e.target.closest('[data-g="bs"]')) { buf = buf.slice(0, -1); showBuf(); }
      });
      ctx.scope.listen(document, 'keydown', e => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        let ch = null;
        if (/^Digit[0-9]$/.test(e.code)) ch = e.code.slice(5);
        else if (/^Numpad[0-9]$/.test(e.code)) ch = e.code.slice(6);
        else if (/^Key[A-F]$/.test(e.code)) ch = e.code.slice(3);
        if (ch) { e.preventDefault(); type(ch); }
        else if (e.key === 'Backspace') { e.preventDefault(); buf = buf.slice(0, -1); showBuf(); }
      });
      showBuf();
    } else {
      ctx.scope.listen(stage, 'click', e => {
        const g = e.target.closest('[data-g]')?.dataset.g;
        if (g === 'fire') fire(panel.value);
        if (g === 'clear') panel.set(0);

        if (e.target.closest && e.target.closest('input, textarea')) return;
        if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); fire(panel.value); }
        else if (e.key === 'Backspace') { e.preventDefault(); panel.set(0); }
      });
    }
  },
};

    { d: 'Obrázek 8 × 8, řádky zadané šestnáctkově. Dvě číslice jsou dvě čtveřice bitů. Správný řádek se rozsvítí.', n: 8, clue: 16, heads: 'nib', live: true },

      h += `<span class="clue"><span>${clueTxt(target[r], cb[r])}</span>${c.cur ? `<span class="cur" data-cur="${r}">teď 0</span>` : ''}</span><span class="rowlamp" data-lamp="${r}"></span>`;

       <p class="g-fb" aria-live="polite"></p>

    const pix = $('.pix', stage), elapsed = stopwatch(ctx, stage);
    const rowVal = r => grid[r].reduce((s, b) => s * 2 + b, 0);
    const updRow = r => {
      const v = rowVal(r);
      if (c.cur) $(`[data-cur="${r}"]`, stage).textContent = `teď ${v}`;
      $(`[data-lamp="${r}"]`, stage).className = 'rowlamp' + (c.live && v === target[r] ? ' ok' : '');
    };
    const checkWin = () => {
      if (!grid.every((_, r) => rowVal(r) === target[r])) return;

      }
    });
    for (let r = 0; r < n; r++) updRow(r);
  },
};

const G_BARVY = {

    const nextBtn = () => `<button type="button" class="key primary" data-g="next">${round >= c.rounds ? 'Zobrazit výsledek' : 'Další kolo →'}</button>`;
    ctx.scope.listen(box, 'click', e => { if (e.target.closest('[data-g="next"]')) { next(); return; } if (onPick) onPick(e); });

      setH(stage, 'round', `${round}/${c.rounds}`); t0 = now(); onPick = null; onSubmit = null;

        while (opts.length < 4 && guard++ < 300) { const o = tgt.slice(); for (let j = 0, k = rnd(1, 2); j < k; j++) { const ch = rnd(0, 2); o[ch] = pick(vals.filter(v => v !== o[ch])); } if (!opts.some(x => key(x) === key(o))) opts.push(o); }

/** Úroveň podle odpovědí: ans[i] je 'ok', 'bad', nebo 'nevim'. */
function placementLevel(ans) {
  const ok = ans.filter(a => a === 'ok').length;
  const okIn = idx => idx.filter(i => ans[i] === 'ok').length;
  if (ok === 0) return 0;
  if (ok >= 10) return 4;
  const bin = okIn([0, 1, 2, 3, 4]), hex = okIn([5, 6, 7]);
  if (ok >= 7 && hex >= 2 && bin >= 3) return 3;
  if ((ok >= 5 && bin >= 3) || bin >= 4) return 2;
  return 1;
}

function checkBadges(silent = false) {
  if (typeof BADGES === 'undefined') return;
  const fresh = [];
  for (const b of BADGES) { let ok = false; try { ok = b.ok(); } catch (e) { ok = false; } if (ok && !Store.d.badges[b.id]) { Store.d.badges[b.id] = todayStr(); fresh.push(b); } }
  if (!fresh.length) return;
  Store.save();
  if (!silent) fresh.forEach((b, k) => setTimeout(() => { toast(`Nový odznak: <b>${b.t}</b>`, 'ok'); Sound.pop(); }, 400 + k * 900));
}

/* ---------- pomocné výběry možností ---------- */
/** Podobná čísla jako v: o bit jinak, o jedničku vedle, prohozené číslice… */
function nearNums(v, max, base) {
  const c = new Set(), bits = Math.max(2, toB(Math.max(1, max), 2).length);
  for (let k = 0; k < bits; k++) c.add(v ^ (1 << k));
  c.add(v + 1); c.add(v - 1);
  if (base === 16) { c.add(v + 16); c.add(v - 16); const h = toB(v, 16); if (h.length > 1) c.add(parseInt([...h].reverse().join(''), 16)); }
  if (base === 2) { c.add(v * 2); c.add(v >> 1); c.add(parseInt([...toB(v, 2)].reverse().join(''), 2)); }
  if (base === 10) { c.add(v + 10); c.add(v - 10); c.add(v + 2); c.add(v - 2); }
  return [...c].filter(x => Number.isInteger(x) && x >= 0 && x <= max && x !== v);
}
/** Vybere k možností (včetně správné v) a zamíchá je. Vrací { vals, ok }. */
function optsFrom(v, cands, max, k = 4) {
  const out = [v];
  for (const x of shuffle(cands)) { if (out.length >= k) break; if (Number.isInteger(x) && x >= 0 && x <= max && !out.includes(x)) out.push(x); }
  let guard = 0;
  while (out.length < k && guard++ < 300) { const x = rnd(0, Math.max(max, k * 2)); if (!out.includes(x)) out.push(x); }
  const vals = shuffle(out);
  return { vals, ok: vals.indexOf(v) };
}
/** Totéž pro libovolná celá čísla (i záporná). */
function optsAny(v, cands, k = 4) {
  const out = [v];
  for (const x of shuffle(cands)) { if (out.length >= k) break; if (Number.isInteger(x) && !out.includes(x)) out.push(x); }
  let d = 1;
  while (out.length < k) { if (!out.includes(v + d)) out.push(v + d); d = d > 0 ? -d : -d + 1; }
  const vals = shuffle(out);
  return { vals, ok: vals.indexOf(v) };
}

const hexH = v => `${toB(v, 16)}<sub>16</sub>`;

    const { vals, ok } = optsFrom(v, nearNums(v, max, to), max);
    return { kind: 'conv', q: `Kolik je <b class="mono">${numHtml(v, from)}</b> v ${BASE[to].gen} soustavě?`, opts: vals.map(x => numHtml(x, to)), ok, why: `${numHtml(v, from)} = ${numHtml(v, to)}. ${explainConv(from, to, v)}` };
  },
  addbin(L) {
    const w = L <= 2 ? 3 : L <= 4 ? 4 : L <= 7 ? 6 : 8, m = 2 ** w - 1;
    const a = rnd(1, m), b = rnd(1, m), s = a + b;
    const { vals, ok } = optsFrom(s, [a ^ b, a | b, s ^ (1 << rnd(0, w)), s ^ (1 << rnd(0, w)), s + 1, s - 1], 2 * m + 1);
    return { kind: 'addbin', q: `Kolik je <b class="mono">${binH(a)} + ${binH(b)}</b>?`, opts: vals.map(x => binH(x)), ok, why: `${a} + ${b} = ${s}, dvojkově ${binH(s)}. Pozor na přenos: 1 + 1 = 10<sub>2</sub>.` };
  },
  subbin(L) {
    const w = L <= 4 ? 4 : L <= 7 ? 6 : 8;
    const a = rnd(2 ** (w - 1), 2 ** w - 1), b = rnd(1, a - 1), d = a - b;
    const { vals, ok } = optsFrom(d, [a ^ b, a & ~b, d ^ (1 << rnd(0, w - 1)), d + 1, d - 1, d + 2], 2 ** w - 1);
    return { kind: 'subbin', q: `Kolik je <b class="mono">${binH(a)} − ${binH(b)}</b>?`, opts: vals.map(x => binH(x)), ok, why: `${a} − ${b} = ${d}, dvojkově ${binH(d)}. Zkouška: ${binH(d)} + ${binH(b)} = ${binH(a)}.` };
  },
  mulbin(L) {
    const a = rnd(3, L <= 6 ? 7 : 15), b = rnd(2, L <= 6 ? 5 : 7), p = a * b;
    const { vals, ok } = optsFrom(p, [p ^ (1 << rnd(0, 3)), a * (b + 1), a * (b - 1), a + b, p ^ (1 << rnd(2, 6)), p + a], 255);
    return { kind: 'mulbin', q: `Kolik je <b class="mono">${binH(a)} · ${binH(b)}</b>?`, opts: vals.map(x => binH(x)), ok, why: `${a} · ${b} = ${p}, dvojkově ${binH(p)}. Násobíš posouváním a sčítáním: za každou jedničku ve druhém čísle přičteš posunuté první.` };
  },
  hexcalc(L) {
    const big = L >= 7, sub = L >= 6 && rng() < .4;
    let a = rnd(0x10, big ? 0xFFF : 0x9F), b = rnd(0x08, big ? 0xFFF : 0x7F);
    if (sub && b > a) [a, b] = [b, a];
    if (sub && a === b) a += 0x11;
    const r = sub ? a - b : a + b, op = sub ? '−' : '+';
    const { vals, ok } = optsFrom(r, [r ^ 0x10, r - 0x10, r + 0x10, r + 1, r - 1, r ^ 0x100, r + 6], 0x2000);
    return { kind: 'hexcalc', q: `Kolik je <b class="mono">${hexH(a)} ${op} ${hexH(b)}</b>?`, opts: vals.map(hexH), ok, why: `${a} ${op} ${b} = ${r} = ${hexH(r)}. Když je součet v řádu aspoň 16, píšeš součet − 16 a přenášíš 1.` };
  },
  logic(L) {
    const w = L <= 4 ? 4 : 8, mask = 2 ** w - 1, a = rnd(1, mask), b = rnd(1, mask);
    const op = pick(['AND', 'OR', 'XOR']), r = op === 'AND' ? a & b : op === 'OR' ? a | b : a ^ b;
    const { vals, ok } = optsFrom(r, [a & b, a | b, a ^ b, ~r & mask, r ^ (1 << rnd(0, w - 1)), ~(a & b) & mask], mask);
    const rule = { AND: 'AND dá 1 jen tam, kde mají 1 obě čísla.', OR: 'OR dá 1 tam, kde má 1 aspoň jedno číslo.', XOR: 'XOR dá 1 tam, kde se bity liší.' }[op];
    return { kind: 'logic', q: `Kolik je <b class="mono">${grp(toB(a, 2, w))} ${op} ${grp(toB(b, 2, w))}</b>?`, opts: vals.map(x => `<span class="mono">${grp(toB(x, 2, w))}</span>`), ok, why: `${rule} Výsledek: ${grp(toB(r, 2, w))}.` };
  },
  twos(L) {
    if (rng() < .5) {
      const v = rnd(129, 254), s = v - 256;
      const { vals, ok } = optsAny(s, [v, -(v - 128), s - 1, s + 1, -(255 - v)]);
      return { kind: 'twos', q: `Jakou hodnotu má <b class="mono">${grp(toB(v, 2, 8))}</b> v osmibitovém doplňkovém kódu?`, opts: vals.map(x => fmt(x)), ok, why: `Nejvyšší bit má váhu −128: −128 + ${v - 128} = ${fmt(s)}.` };
    }
    const n = rnd(2, 120), code = 256 - n;
    const { vals, ok } = optsFrom(code, [n | 128, ~n & 255, code ^ 1, n, code ^ 2], 255);
    return { kind: 'twos', q: `Jak se zapíše <b>−${n}</b> v osmibitovém doplňkovém kódu?`, opts: vals.map(x => `<span class="mono">${grp(toB(x, 2, 8))}</span>`), ok, why: `${n} = ${grp(toB(n, 2, 8))}, prohodit bity: ${grp(toB(~n & 255, 2, 8))}, přičíst 1: ${grp(toB(code, 2, 8))}.` };
  },
  color(L) {
    const ch = rnd(0, 2), v = rnd(16, 250), cs = [rnd(0, 255), rnd(0, 255), rnd(0, 255)]; cs[ch] = v;
    const code = cs.map(x => toB(x, 16, 2)).join('');
    const name = ['červená', 'zelená', 'modrá'][ch];
    const { vals, ok } = optsFrom(v, [...nearNums(v, 255, 16), cs[(ch + 1) % 3], cs[(ch + 2) % 3]], 255);
    return { kind: 'color', q: `<span class="sw-dot" style="background:#${code}" aria-hidden="true"></span>Barva má kód <b class="mono">#${code}</b>. Kolik je v ní ${name === 'červená' ? 'červené' : name === 'zelená' ? 'zelené' : 'modré'} složky v desítkové soustavě?`, opts: vals.map(x => fmt(x)), ok, why: `Pořadí je RR GG BB. ${name[0].toUpperCase() + name.slice(1)} je ${code.slice(ch * 2, ch * 2 + 2)}<sub>16</sub> = ${v}.` };
  },
  theory(L) {
    const pool = THEORY.filter(t => t.L <= L);
    const t = weighted(pool.map(x => [x, 1 + Math.max(0, 3 - (L - x.L))]));
    const order = shuffle([0, 1, 2, 3]);
    return { kind: 'theory', q: t.q, opts: order.map(i => t.a[i]), ok: order.indexOf(0), why: t.why };
  },
};
/** Které druhy úloh se hodí pro úroveň L a jak často. */
function taskWeights(L) {
  const w = [['conv', 5], ['theory', 3], ['addbin', L >= 2 ? 2 : 1]];
  if (L >= 2) w.push(['logic', 1]);
  if (L >= 3) w.push(['subbin', 1], ['logic', 1]);
  if (L >= 4) w.push(['hexcalc', 2], ['color', 1]);
  if (L >= 5) w.push(['mulbin', 2]);
  if (L >= 6) w.push(['twos', 2], ['subbin', 1]);
  return w;
}
/** Vygeneruje jednu úlohu pro úroveň L (1–10). */
function genTask(L, kind) {
  L = clamp(Math.round(L), 1, 10);
  const k = kind && TASK_KINDS[kind] ? kind : weighted(taskWeights(L));
  return TASK_KINDS[k](L);
}

/* ---------- zobrazení otázky se čtyřmi možnostmi ---------- */
const MC_KEYS = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3 };
/**
 * Zobrazí otázku do host. Po odpovědi zavolá onAnswer(správně, index).
 * Vrací { answer(i), timeout(), done }.
 */
function mountMC(host, task, { scope = viewScope, onAnswer = null, label = '' } = {}) {
  if (host._mcScope) host._mcScope.dispose();
  const sc = host._mcScope = new Scope(scope);
  host.innerHTML = `<div class="mcq${task.kind === 'theory' ? '' : ' num'}">${label ? `<span class="lbl">${label}</span>` : ''}<div class="mcq-q">${task.q}</div>
    <div class="mcq-opts">${task.opts.map((o, i) => `<button type="button" class="mcq-opt" data-i="${i}"><span class="mcq-k mono" aria-hidden="true">${i + 1}</span><span class="mcq-t">${o}</span></button>`).join('')}</div>
    <p class="mcq-fb" aria-live="polite"></p></div>`;
  const st = { done: false };
  const answer = i => {
    if (st.done) return; st.done = true;
    const ok = i === task.ok;
    $$('.mcq-opt', host).forEach((b, j) => { b.disabled = true; if (j === task.ok) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); });
    const fb = $('.mcq-fb', host);
    fb.className = 'mcq-fb ' + (ok ? 'ok' : 'bad');
    fb.innerHTML = `<b>${i < 0 ? 'Čas vypršel.' : ok ? pick(['Správně!', 'Přesně tak!', 'Výborně!']) : 'Vedle.'}</b>${task.why ? ` <span class="mcq-why">${task.why}</span>` : ''}`;
    if (ok) Sound.ok(); else Sound.bad();
    if (onAnswer) onAnswer(ok, i);
  };
  sc.listen($('.mcq-opts', host), 'click', e => { const b = e.target.closest('.mcq-opt'); if (b && !b.disabled) answer(+b.dataset.i); });
  sc.listen(document, 'keydown', e => {
    if (st.done || !host.isConnected || (e.target.closest && e.target.closest('input, textarea, select')) || document.querySelector('.modal')) return;
    const k = MC_KEYS[e.code];
    if (k != null && k < task.opts.length) { e.preventDefault(); answer(k); }
  });
  return { answer, timeout: () => answer(-1), get done() { return st.done; } };
}

/* ---------- značky hradel (americký styl), střed v bodě 0,0 ---------- */

  const OR = 'M-24 -20Q-4 -20 20 0Q-4 20 -24 20Q-14 0 -24 -20Z';
  const XOR = 'M-19 -20Q1 -20 23 0Q1 20 -19 20Q-9 0 -19 -20Z';

    case 'NOR': return { body: `<path class="cg-body" d="${OR}"/>${bub(24.5)}`, tip: 29 };
    case 'XOR': return { body: `${XB}<path class="cg-body" d="${XOR}"/>`, tip: 23 };
    case 'XNOR': return { body: `${XB}<path class="cg-body" d="${XOR}"/>${bub(27.5)}`, tip: 32 };
    case 'NOT': return { body: `<path class="cg-body" d="${TRI}"/>${bub(20.5)}`, tip: 25 };

}
/** Celá značka hradla včetně přívodů. n = počet vstupů (1 nebo 2). */
function gateGlyph(type, n) {

}
const gateIcon = (t, cls = 'pal-ico') => `<svg class="${cls}" viewBox="-34 -25 68 50" aria-hidden="true">${gateGlyph(t)}</svg>`;

/* ---------- vyhodnocení obvodu zadaného seznamem hradel ---------- */
/** def = { ins:[{id}], gates:[{id, in:[…]}], outs:[{id, src}] }, typeOf(g) vrací typ hradla nebo null. */
function circValues(def, typeOf, inVals) {
  const val = {}, gm = {};
  def.gates.forEach(g => { gm[g.id] = g; });
  def.ins.forEach(i => { val[i.id] = inVals[i.id] ? 1 : 0; });

    if (id in val) return val[id];
    const g = gm[id]; if (!g || d > 60) return null;
    const t = typeOf(g);
    const xs = g.in.map(s => ev(s, d + 1));
    val[id] = !t || xs.some(x => x == null) ? null : CIRC_GATES[t].f(...xs);
    return val[id];
  };
  def.gates.forEach(g => ev(g.id, 0));
  def.outs.forEach(o => { val[o.id] = ev(o.src, 0); });

}
/** Všechny kombinace vstupů a cílové výstupy. První vstup je nejvyšší bit. */
function circRows(P) {
  const n = P.ins.length, rows = [];
  for (let r = 0; r < 2 ** n; r++) {
    const ins = {}; P.ins.forEach((inp, k) => { ins[inp.id] = (r >> (n - 1 - k)) & 1; });
    const t = P.tgt(ins), tgt = {}; P.outs.forEach(o => { tgt[o.id] = t[o.id] ? 1 : 0; });

/* ---------- automatické rozložení schématu do sloupců ---------- */
/** Rozmístí položky jedné vrstvy co nejblíž přáním, ale s minimálními rozestupy (izotonická regrese). */

/* ---------- animace signálu: světlo se rozlévá po drátu a nese bit ---------- */
function makeToken(layer, v) {
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('class', 'ctok ' + (v ? 'on' : 'off'));
  g.innerHTML = `<circle r="8.5"></circle><text y="3.6">${v}</text>`;
  layer.appendChild(g);
  return g;
}
/**
 * specs: [{ w: { g, base, lit }, v: 0|1, at: ms, dur: ms, done(), cancel() }]
 * Dráty se rozsvěcují (nebo zhasínají) postupně a po nich jede kolečko s bitem.
 */
function signalWave(scope, tokLayer, specs) {
  if (!specs.length) return;
  const t0 = now();

  scope.add(() => specs.forEach(k => { if (k.st === 1) { clear(k); if (k.cancel) k.cancel(); } }));
  specs.forEach(k => { k.st = 0; });
  scope.loop(() => {
    const t = now() - t0; let alive = false;
    for (const k of specs) {

const WAVE_T = 420;

/* ---------- vykreslené schéma hádanky ---------- */

const CIRC_TPL = [
  { n: 2, g: [['g1', ['A', 'B']]], o: [['Y', 'g1']] },
  { n: 2, g: [['g1', ['A', 'B']], ['g2', ['g1']]], o: [['Y', 'g2']] },
