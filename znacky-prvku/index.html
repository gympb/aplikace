:root{--hd:#20262F;--tile:#2B313A;--bg:#F2F3F5;--card:#fff;--tx:#1F2329;--mut:#646B76;--pri:#D7262E;--pri2:#B21E25;--ok:#15803d;--okb:#dcfce7;--ko:#b91c1c;--kob:#fee2e2;--bd:#E3E5E9;--back:#FFF4F4;--warn:#B45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171C;--card:#1E232B;--tx:#EEF0F3;--mut:#9AA3AE;--bd:#2E3540;--ok:#4ade80;--okb:#12341f;--ko:#f87171;--kob:#3b1618;--pri:#E5383F;--back:#2A1E22;--warn:#D97706;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171C;--card:#1E232B;--tx:#EEF0F3;--mut:#9AA3AE;--bd:#2E3540;--ok:#4ade80;--okb:#12341f;--ko:#f87171;--kob:#3b1618;--pri:#E5383F;--back:#2A1E22;--warn:#D97706;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 'Outfit',system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px;min-height:100vh}
header{background:var(--hd);color:#fff;padding:18px 18px 26px;display:flex;align-items:flex-end;gap:8px;max-width:560px;margin:0 auto;position:relative;box-shadow:0 0 0 100vmax var(--hd);clip-path:inset(0 -100vmax)}
header .ht{flex:1;padding:0 120px 30px 0;position:relative;z-index:1;pointer-events:none}
header h1{margin:0;font-size:31px;line-height:1.02;font-weight:800;letter-spacing:-.01em}header h1 span{color:var(--pri);display:block}
header p{margin:8px 0 0;color:#C9CED6;font-size:15px}
header .mw{position:absolute;right:0;bottom:0;width:168px;z-index:0;cursor:pointer}header .mw:focus{outline:none}
header .masc{width:100%;height:auto;display:block;pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14%);mask-image:linear-gradient(to right,transparent 0,#000 14%);transform-origin:50% 100%}
header .sv{position:absolute;left:180px;top:22px;z-index:2;font-family:'Caveat','Segoe Print','Bradley Hand','Noteworthy','Comic Sans MS',cursive;font-size:21px;font-weight:700;color:#fff;transform:rotate(-10deg);transform-origin:left center;white-space:nowrap;pointer-events:none}
header.cm{padding:12px 16px 30px}header.cm .ht{padding:0 0 4px}header.cm h1{font-size:20px}header.cm h1 span{display:inline;margin-left:6px}header.cm p,header.cm .sv,header.cm .mw,header.cm .bub{display:none}
@media (max-width:380px){header .sv{font-size:18px;left:178px}header .mw{width:150px}header h1{font-size:28px}}
.eye{position:absolute;width:10.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#F8F5E8;overflow:hidden;pointer-events:none}
.eye i{position:absolute;left:50%;top:50%;width:28%;height:28%;margin:-14% 0 0 -14%;border-radius:50%;background:#140808;transition:transform .35s ease}
.eye::after{content:'';position:absolute;inset:0;background:#E6B78E;transform:scaleY(0);transform-origin:top;transition:transform .09s}
.mw.blink .eye::after{transform:scaleY(1)}
.mw.roll .eye i{animation:roll 1.3s ease-in-out}@keyframes roll{0%{transform:translate(0,0)}20%{transform:translate(155%,-80%)}40%{transform:translate(0,-170%)}60%{transform:translate(-155%,-80%)}80%{transform:translate(-90%,60%)}100%{transform:translate(0,0)}}
.mw.tilt .masc{animation:tilt 1.1s ease-in-out}@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.5deg)}55%{transform:rotate(1.2deg)}80%{transform:rotate(-.6deg)}}
.mw.lookl .eye i{transform:translate(-165%,15%)}.mw.lookr .eye i{transform:translate(165%,-15%)}.mw.lookup .eye i{transform:translate(0,-160%)}
.spk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0}
.mw.spark .spk{animation:spk .9s ease-out}@keyframes spk{0%{opacity:0;transform:scale(.8)}25%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.12)}}
.mw.spark .masc{animation:hop .6s ease}@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-2px)}60%{transform:translateY(0)}}
.bub{position:absolute;right:130px;top:44px;width:200px;background:#fff;color:#1F2329;border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.35;font-weight:500;box-shadow:0 6px 20px #0005;opacity:0;transform:translateY(6px) scale(.95);transition:opacity .25s,transform .25s;pointer-events:none;z-index:3}
.bub::after{content:'';position:absolute;right:-7px;top:24px;border:8px solid transparent;border-left-color:#fff;border-right:0}.bub.on{opacity:1;transform:none}
main{position:relative;z-index:1;background:var(--bg);border-radius:30px 30px 0 0;margin:-26px auto 0;padding:22px 16px 24px;max-width:560px;min-height:calc(100vh - 160px)}
footer.ver{max-width:560px;margin:0 auto;text-align:center;font-size:11px;color:var(--mut);padding:6px 16px 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #0000000a}
h2{font-size:18px;margin:8px 2px 10px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tl{position:relative;text-align:left;border:0;border-radius:16px;padding:16px 14px;min-height:126px;background:var(--tile);color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.tl.red{background:var(--pri)}.tl svg.ic{position:absolute;left:14px;top:14px}.tl b{font-size:19px}.tl small{font-size:13px;opacity:.82}.tl .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);opacity:.9}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;padding:0 6px;border-radius:9px;background:var(--tile);color:#fff;font-weight:700;font-size:14px;vertical-align:middle}
.bar{height:7px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width .25s}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px 3px;border-radius:10px;font:inherit;font-size:14px;font-weight:500;min-height:40px;cursor:pointer}
.seg button.on{background:var(--tile);color:#fff;font-weight:600}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--pri);cursor:pointer;box-shadow:0 2px 0 var(--pri2)}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:600;box-shadow:none}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}.btn.okb{background:var(--ok);box-shadow:none}.btn.kob{background:var(--ko);box-shadow:none}.btn:disabled{opacity:.6}
input.t{width:100%;padding:13px 14px;font:inherit;font-size:17px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}input.t:focus{outline:none;border-color:var(--pri)}
.lk{border:0;background:none;color:var(--pri);font:inherit;font-weight:600;font-size:14px;padding:8px 0;cursor:pointer}
.x{float:right;border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer;padding:0 4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--hd);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5;justify-content:center}
nav button{flex:1;max-width:120px;border:0;background:none;color:#C9CED6;font:inherit;font-size:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}nav button.on{color:var(--pri);font-weight:600}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;white-space:nowrap;background:var(--bd);color:var(--tx);border:0;font-family:inherit;cursor:pointer}.pill.on{background:var(--tile);color:#fff}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.sticky{position:sticky;bottom:76px;margin-top:14px;z-index:2}
/* seznam prvků */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.ch{display:flex;align-items:center;gap:7px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:6px 7px;font:inherit;font-size:13px;text-align:left;cursor:pointer;min-height:44px;position:relative;overflow:hidden}
.ch .gc{min-width:30px;height:28px;font-size:14px;border-radius:8px;flex-shrink:0}.ch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.on{border-color:var(--pri)}.ch.on .gc{background:var(--pri)}.ch i{position:absolute;left:0;bottom:0;height:3px;background:var(--ok)}
/* periodická tabulka */
.ptw{overflow-x:auto;margin:0 -16px;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
.pt{display:grid;grid-template-columns:22px repeat(18,36px);grid-auto-rows:40px;gap:3px;width:max-content}
.pt .e{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:7px;font:inherit;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;line-height:1}
.pt .e b{font-size:14px;font-weight:700}.pt .e small{font-size:8px;color:var(--mut);margin-top:2px}
.pt .e.on{background:var(--pri);border-color:var(--pri);color:#fff}.pt .e.on small{color:#fff9}
.pt .e i{position:absolute;left:0;bottom:0;height:3px;background:var(--ok)}.pt .e.on i{background:#fff}
.pt .h{border:0;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:0;border-radius:6px}.pt .h:hover{background:var(--bd)}
.pt .ph{border:1.5px dashed var(--bd);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--mut);text-align:center;line-height:1.1}
.pt .gap{height:8px}
/* karta */
.scene{perspective:1100px;margin:14px 0 12px}
.fc{position:relative;height:260px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1);cursor:pointer}.fc.f{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:var(--card);border:1px solid var(--bd);box-shadow:0 2px 0 var(--bd),0 8px 24px #0000000f;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}

 }

 }

function oddQ(){
 const common=data.map((_,i)=>i).filter(i=>SS.includes(SYM[i]));
 for(let tries=0;tries<400;tries++){
  const c=rnd(CATS),pref=c.m.filter(i=>SS.includes(SYM[i])),src=pref.length>=3&&Math.random()<.85?pref:c.m;if(src.length<3)continue;
  const three=shuf(src).slice(0,3);
  const cands=common.filter(i=>!inC(c,i));
  const nearP=cands.filter(i=>three.some(t=>ptDist(i,t)<=1));
  const pair={'lehké platinové kovy':'těžké platinové kovy','těžké platinové kovy':'lehké platinové kovy','ušlechtilé kovy':'neušlechtilé kovy','neušlechtilé kovy':'ušlechtilé kovy'}[c.n];
  const pc=pair&&Math.random()<.5?CATS.find(o=>o.n===pair).m.filter(i=>cands.includes(i)):[];
  const odd=rnd(pc.length?pc:nearP.length&&Math.random()<.7?nearP:cands);
  if(odd==null||!oddOk(c,three,odd))continue;
  const oc=CATS.filter(o=>o!==c&&o.m.includes(odd)&&!three.every(t=>o.m.includes(t)));if(!oc.length)continue;
  const rank=o=>(o.t===c.t?0:o.t==='jm'||o.t==='zn'?2:1)+Math.random()*.5;
  return{c,three,odd,oc:oc.sort((a,b)=>rank(a)-rank(b))[0]};
 }
 return null;
}
function oddGame(){
 let n=0,ok=0;const N=10,t0=Date.now();
 const iv=setInterval(()=>{const t=$('#tm');if(t)t.textContent=fmtT(Date.now()-t0)},500);KILL=()=>clearInterval(iv);
 const q=()=>{
  if(n>=N){clearInterval(iv);KILL=null;const ms=Date.now()-t0,b0=S.games.odd,best=!b0||ok>b0.s||(ok===b0.s&&ms<b0.ms);if(best)S.games.odd={s:ok,ms};save();if(ok===N)checkBadges('odd');return gameOver('Vetřelec',`${ok} / ${N} · ${fmtT(ms)}`,best&&b0,'g6')}
  const Qd=oddQ();if(!Qd){n=N;return q()}const opts=shuf([...Qd.three,Qd.odd]);
  $('#app').innerHTML=gameHead(`Vetřelec · ${n+1} / ${N} · správně ${ok} · ${TIM} <span id="tm">${fmtT(Date.now()-t0)}</span>`)+
   `<p style="text-align:center;font-size:18px;margin:16px 0 12px">Který prvek mezi ostatní <b>nepatří</b>?</p>
   <div class="og">${opts.map(j=>`<button class="opt big2" data-j="${j}" style="padding:16px 8px">${SYM[j]}<div class="mut" style="font-size:13px;font-weight:500">${esc(nm(j))}</div></button>`).join('')}</div><div id="fb"></div>`;
  bindQuit();
  $$('[data-j]').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,good=j===Qd.odd;if(good)ok++;buzz(good);
   $$('[data-j]').forEach(x=>{x.disabled=true;if(+x.dataset.j===Qd.odd)x.classList.add('ok');else if(x===b)x.classList.add('ko')});
   $('#fb').innerHTML=`<div class="fb ${good?'ok':'ko'}" style="margin-top:4px"><b>${good?'Správně!':'Zatím ne'}</b><div class="r">${Qd.three.map(i=>SYM[i]).join(', ')} jsou ${Qd.c.n}. <b>${SYM[Qd.odd]}</b> (${esc(nm(Qd.odd))}) ${Qd.oc?'patří mezi '+Qd.oc.n:'mezi ně nepatří'}.</div></div><div class="nxbar"><button class="btn" id="nx">${n+1>=N?'Výsledek':'Další'}</button></div>`;
   $('#nx').onclick=()=>{n++;q()}});
 };q();
}

function labScene(e,state){
 /* e = počet chyb 0–7, state: '', 'win', 'boom' */
 const boom=e>=LABMAX,win=state==='win',lit=e>=1&&!win&&!boom,big=e>=5,liq=e>=4?'#7CC243':'#4FA3E0';
 const flame=lit?`<g class="lf"><path d="M60 ${big?58:70}c-6 8-8 13-8 17a8 8 0 0 0 16 0c0-4-2-9-8-17z" fill="#F59E0B"/><path d="M60 ${big?68:76}c-3 5-4 8-4 10a4 4 0 0 0 8 0c0-2-1-5-4-10z" fill="#FDE68A"/></g>`:'';
 const bubbles=e>=2&&!boom?[0,1,2,3].map(k=>`<circle class="lb" cx="${53+k*5}" cy="62" r="${1.6+k%2}" fill="#fff" opacity=".8" style="animation-delay:${k*.35}s"/>`).join(''):'';
 const vapor=e>=3&&!boom?[0,1,2].map(k=>`<circle class="lv" cx="${60+(k-1)*4}" cy="22" r="${5+k*2+(e>=6?4:0)}" fill="${e>=4?'#8CCB5E':'#AEB9C4'}" opacity=".6" style="animation-delay:${k*.6}s"/>`).join(''):'';
 const crack=e>=5&&!boom?`<path d="M52 50l4 6-3 5 5 6" stroke="#374151" stroke-width="1.6" fill="none" stroke-linecap="round"/>`:'';
 const flask=boom?`<g fill="#9FB4C4" opacity=".9"><path d="M44 84l6-8 3 8z"/><path d="M66 84l-3-10 8 6z"/><path d="M57 84l2-6 3 6z"/></g><g fill="#7CC243"><circle cx="40" cy="82" r="4"/><circle cx="78" cy="80" r="3"/></g>`
  :`<path d="M55 30v14l-14 22a4 4 0 0 0 3.4 6h31.2a4 4 0 0 0 3.4-6L65 44V30" fill="#fff" fill-opacity=".7" stroke="#6B7C8B" stroke-width="2.4" stroke-linejoin="round"/><path d="M46.5 57h27L79 66a3 3 0 0 1-2.6 4.5H43.6A3 3 0 0 1 41 66z" fill="${liq}"/><rect x="53" y="26" width="14" height="4" rx="1.5" fill="#6B7C8B"/>${bubbles}${crack}`;
 const svgApp=`<svg class="lapp" viewBox="0 0 120 120" aria-hidden="true">${boom?'':`<path d="M38 100l6-24M82 100l-6-24M40 76h40" stroke="#7B8794" stroke-width="2.6" stroke-linecap="round"/>`}<rect x="52" y="86" width="16" height="14" rx="2" fill="#6B7280"/><rect x="45" y="98" width="30" height="6" rx="2" fill="#4B5563"/>${flame}${flask}${vapor}</svg>`;
 const eyesCls=win?'':e>=6?'up':e>=5?'sm':e>=2?'lk':'';

function hangGame(pool,hard){
 let streak=0;const MAXE=LABMAX,RK=hard?'hangH':'hang',rec0=S.games[RK]||0,gid=hard?'g8':'g7';
 const word=()=>{
  const i=rnd(pool),w=nm(i),guessed=new Set();let errs=0,over=false,shown=!hard;
  const solved=()=>[...w].every(ch=>!/[a-zà-ž]/i.test(ch)||guessed.has(deacc(ch)));
  const draw=()=>{
   const win=over&&solved();
   $('#app').innerHTML=gameHead(`V laboratoři s Vondrysem${hard?' (těžká)':''} · v řadě: <b>${streak}</b> · rekord ${S.games[RK]||0}`)+
   `<div class="card" style="margin-top:12px;padding:10px">
     ${hard?`<div class="mut">Nápověda</div><div style="font-size:16px;line-height:1.4;margin:2px 0 8px">${esc(CLUE[SYM[i]]||'')}</div>`:''}
     ${labScene(errs,win?'win':errs>=MAXE?'boom':'')}
     <div class="row" style="margin-top:8px;min-height:30px">${shown||over?`<div style="font-size:26px;font-weight:800;line-height:1">${SYM[i]} <span class="mut" style="font-size:14px;font-weight:600">Z = ${i+1}</span></div>`:`<button class="lk" id="rv" style="padding:4px 0" ${errs+2>=MAXE?'disabled style="opacity:.4"':''}>Ukázat značku (+2 chyby)</button>`}<span class="mut">Chyby: ${errs} / ${MAXE}</span></div>
   </div>
   <div class="hw" style="text-align:center;font-size:30px;font-weight:700;letter-spacing:.14em;margin:12px 0;overflow-wrap:anywhere">${[...w].map(ch=>!/[a-zà-ž]/i.test(ch)?ch:(guessed.has(deacc(ch))||over)?`<span style="${over&&!guessed.has(deacc(ch))?'color:var(--pri)':''}">${ch}</span>`:'_').join('')}</div>
   ${over?'':`<div class="keys">${'abcdefghijklmnopqrstuvwxyz'.split('').map(ch=>{const used=guessed.has(ch),hit=used&&deacc(w).includes(ch);return `<button data-ch="${ch}" ${used?'disabled':''} style="${used?(hit?'background:var(--okb);border-color:var(--ok)':'opacity:.35'):''}">${ch}</button>`}).join('')}</div><p class="mut" style="text-align:center;margin:6px 0 0">Písmena s háčkem a čárkou se doplní sama.</p>`}
   <div id="fb"></div>`;
   bindQuit();

 const len=.65,buf=AC.createBuffer(1,Math.floor(AC.sampleRate*len),AC.sampleRate),d=buf.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,2.4);

 hd(true);
 if(!CL.ready){$('#app').innerHTML='<p class="mut">Načítám…</p>';return}
 if(!CL.db){$('#app').innerHTML=`<div class="card"><b>Třída</b><p>Testy od učitele a třídní žebříček fungují, když máš aplikaci otevřenou na claude.ai přihlášený(á) a učitel ti ji nasdílel.</p><p class="mut">Procvičování, hry a pokrok fungují i bez toho.</p></div>`;return}
 const act=CL.tests.filter(t=>t.active),rows=CL.board.filter(b=>b.nick).sort((a,b)=>(b.known||0)-(a.known||0)||(b.badges||0)-(a.badges||0)).slice(0,30);
 $('#app').innerHTML=`<div class="card"><b>Tvoje jméno / přezdívka</b><p class="mut" style="margin:4px 0 8px">Pod ním tě uvidí učitel u testů a spolužáci v žebříčku. Bez jména v žebříčku nejsi.</p><div class="row"><input class="t" id="nick" maxlength="24" value="${esc(S.student)}" placeholder="např. Jana K."><button class="btn sm" id="sn">Uložit</button></div></div>
 ${CL.teacher?teacherHtml():''}
 <h2>Testy</h2>${act.length?act.map(t=>{const r=CL.mine[t.id]||S.done[t.id];return `<div class="card"><div class="row"><b>${esc(t.title)}</b>${r?`<span class="tag">✓ ${r.score}/${r.n}</span>`:''}</div><div class="mut">${t.items.length} otázek · ${MODES[t.mode]} · ${({symbol:'značka → název',name:'název → značka',both:'oba směry'})[t.dir]}</div>${r?'<p class="mut" style="margin:6px 0 0">Odevzdáno. Test lze vyplnit jen jednou.</p>':`<p style="margin:8px 0 0"><button class="btn sm" data-tt="${t.id}">Spustit test</button></p>`}</div>`}).join(''):'<p class="mut" style="margin:0 2px 12px">Teď nejsou zadané žádné testy.</p>'}
 <h2>Třídní žebříček</h2><div class="card">${rows.length?rows.map((b,i)=>`<div class="row lb ${b.id===CL.uid?'me':''}"><span><span class="rk r${i}">${i+1}</span>${esc(b.nick)}${b.id===CL.uid?' (ty)':''}</span><span><small class="mut">${b.badges||0} odznaků</small> <b>${b.known||0}</b> <small class="mut">prvků</small></span></div>`).join(''):'<p class="mut" style="margin:0">Zatím tu nikdo není. Ulož si jméno a procvičuj!</p>'}</div>`;
 $('#sn').onclick=()=>{S.student=$('#nick').value.trim().slice(0,24);save();boardPush();toast(S.student?'Jméno uloženo.':'Jméno smazáno, nejsi v žebříčku.')};
 $$('[data-tt]').forEach(b=>b.onclick=async()=>{const t=CL.tests.find(x=>x.id===b.dataset.tt);if(!S.student.trim()&&!await askYN('Nemáš vyplněné jméno – učitel tě nepozná. Pokračovat?'))return;
  const list=t.items.map(idxOf).filter(i=>i>=0);startRound(list,{test:t,mode:t.mode,dir:t.dir,lat:t.set==='lat'})});
 if(CL.teacher)bindTeacher();
}
function teacherHtml(){
 return `<div class="card"><b>Pro učitele</b><details ${CL.tests.length?'':'open'}><summary>+ Nový test</summary>
 <input class="t" id="tt" placeholder="Název testu, např. Značky – 1.A" value="${esc(TF.title)}" style="margin:6px 0 10px">
 ${seg('ts',[['zs','ZŠ'],['ss','SŠ'],['lat','Latina'],['all','Vše'],['own','Můj výběr']],TF.set)}
 ${seg('tm2',[['choice','Výběr ze 4'],['type','Psaní']],TF.mode)}
 ${seg('td',[['symbol','Značka → název'],['name','Název → značka'],['both','Mix']],TF.dir)}
 ${seg('tn',[['10','10 otázek'],['15','15'],['20','20'],['30','30']],String(TF.n))}
 <button class="btn" id="mk">Vytvořit a zadat test</button></details>
 ${CL.tests.map(t=>`<div class="trow"><div class="row"><b>${esc(t.title)}</b><span class="tag ${t.active?'':'off'}">${t.active?'zadaný':'skrytý'}</span></div><div class="mut">${t.items.length} otázek · ${MODES[t.mode]} · ${new Date(t.created).toLocaleDateString('cs')}</div>
 <div class="row" style="gap:6px;margin-top:6px;justify-content:flex-start"><button class="btn sm" data-res="${t.id}">Výsledky</button><button class="btn s sm" data-act="${t.id}">${t.active?'Skrýt':'Zadat'}</button><button class="btn s sm" data-del="${t.id}">Smazat</button></div><div id="r_${t.id}"></div></div>`).join('')}</div>`;
}
function bindTeacher(){
 const sync=()=>{TF.title=$('#tt').value};
 bindSeg('ts',v=>{sync();TF.set=v;klass()});bindSeg('tm2',v=>{sync();TF.mode=v;klass()});bindSeg('td',v=>{sync();TF.dir=v;klass()});bindSeg('tn',v=>{sync();TF.n=+v;klass()});
 $('#mk').onclick=async()=>{sync();const pool=TF.set==='own'?S.selected:SETS[TF.set];
  if(!TF.title.trim())return toast('Zadej název testu.');if(pool.length<TF.n)return toast(`Sada má jen ${pool.length} prvků – sniž počet otázek.`);
  try{await CL.db.collection('tests').add({title:TF.title.trim().slice(0,60),set:TF.set,mode:TF.mode,dir:TF.dir,items:shuf(pool).slice(0,TF.n).map(i=>SYM[i]),active:true,created:Date.now()});TF.title='';toast('Test vytvořen a zadán.')}catch(e){toast('Test se nepodařilo uložit ('+(e.code||'chyba')+').')}};
 $$('[data-act]').forEach(b=>b.onclick=()=>{const t=CL.tests.find(x=>x.id===b.dataset.act);CL.db.doc('tests/'+t.id).update({active:!t.active}).catch(()=>toast('Nepovedlo se.'))});
 $$('[data-del]').forEach(b=>b.onclick=async()=>{if(await askYN('Smazat test? Výsledky žáků zůstanou uložené, ale nebudou se zobrazovat.','Smazat'))CL.db.doc('tests/'+b.dataset.del).delete().catch(()=>toast('Nepovedlo se.'))});
 $$('[data-res]').forEach(b=>b.onclick=()=>{const id=b.dataset.res;if(RES.has(id)){RES.delete(id);$('#r_'+id).innerHTML=''}else{RES.add(id);loadRes(id)}});
 RES.forEach(id=>{if($('#r_'+id))loadRes(id);else RES.delete(id)});
}
const RES=new Set();
async function loadRes(id){const box=$('#r_'+id);if(!box)return;if(!box.innerHTML)box.innerHTML='<p class="mut">Načítám…</p>';
  try{const s=await CL.db.collection('results').get();const box2=$('#r_'+id);if(!box2)return;const rs=s.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.tests&&r.tests[id]).map(r=>({nick:r.nick||'(bez jména)',...r.tests[id]})).sort((a,b)=>b.score-a.score||a.ms-b.ms);
   const errs={};rs.forEach(r=>(r.wrong||[]).forEach(f=>errs[f]=(errs[f]||0)+1));const top=Object.entries(errs).sort((a,b)=>b[1]-a[1]).slice(0,6);
   const avg=rs.length?Math.round(rs.reduce((a,r)=>a+r.score/r.n,0)/rs.length*100):0;
   box2.innerHTML=rs.length?`<p class="mut">Odevzdalo ${rs.length} · průměr ${avg} %</p><table>${rs.map(r=>`<tr><td>${esc(r.nick)}</td><td><b>${r.score}/${r.n}</b></td><td>${fmtT(r.ms)}</td><td class="mut">${new Date(r.at).toLocaleString('cs',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}</td></tr>`).join('')}</table>${top.length?`<p style="margin:10px 0 4px"><b>Nejčastější chyby třídy</b></p>${top.map(([f,n])=>`<div style="margin:4px 0">${idxOf(f)>=0?chip(idxOf(f),1):esc(f)} ${idxOf(f)>=0?data[idxOf(f)][1]:''} <span class="mut">(${n}×)</span></div>`).join('')}`:''}`:'<p class="mut">Zatím nikdo neodevzdal.</p>'}
  catch(e){box.innerHTML='<p class="mut">Výsledky se nepodařilo načíst.</p>'}
}

if(!(window.claude&&window.claude.use)){const tb=$('nav [data-v="t"]');if(tb)tb.remove()}
checkBadges();render();
</script>
</body></html>
