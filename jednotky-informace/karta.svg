<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="640" height="240" role="img"><title>Žebřík jednotek od bajtu po terabajt a dvě krabice, které se liší o pár procent</title><defs>
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="wash" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="0.7"/></filter>
<filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="2"/><feColorMatrix values="0 0 0 0 .42  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .12 0"/></filter>
</defs>
<rect width="320" height="120" fill="#f3e9d0"/><rect width="320" height="120" filter="url(#paper)"/>
<g filter="url(#wash)" opacity=".85">
<rect x="22" y="86" width="52" height="14" rx="2" fill="#d9a441" opacity=".7"/>
<rect x="28" y="68" width="40" height="14" rx="2" fill="#7f9a6a" opacity=".7"/>
<rect x="34" y="50" width="28" height="14" rx="2" fill="#8ea3b0" opacity=".75"/>
<rect x="39" y="32" width="18" height="14" rx="2" fill="#c9622f" opacity=".65"/>
<rect x="150" y="48" width="64" height="46" rx="3" fill="#8ea3b0" opacity=".6"/>
<rect x="226" y="40" width="74" height="54" rx="3" fill="#d9a441" opacity=".6"/>
</g>
<g filter="url(#ink)" fill="none" stroke="#2a1e14" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
<path d="M22 100V30 M74 100V30 M22 36H74 M22 54H74 M22 72H74 M22 90H74" opacity=".0"/>
<rect x="22" y="86" width="52" height="14" rx="2"/><rect x="28" y="68" width="40" height="14" rx="2"/><rect x="34" y="50" width="28" height="14" rx="2"/><rect x="39" y="32" width="18" height="14" rx="2"/>
<path d="M150 48h64v46h-64z M150 48l8-9h64l-8 9 M214 48l8-9v46l-8 9"/>
<path d="M226 40h74v54h-74z M226 40l9-10h74l-9 10 M300 40l9-10v54l-9 10"/>
</g>
<g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#2a1e14" text-anchor="middle">
<text x="48" y="97" font-size="9">kB</text><text x="48" y="79" font-size="9">MB</text><text x="48" y="61" font-size="9">GB</text><text x="48" y="43" font-size="9">TB</text>
<text x="182" y="75" font-size="13">1 GB</text><text x="263" y="71" font-size="13">1 GiB</text>
<text x="82" y="112" font-size="8" text-anchor="start">× 1000, nebo × 1024?</text>
<text x="222" y="22" font-size="14">≠</text>
</g></svg>
