<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="640" height="240" role="img"><title>Dobromyslná postavička s osmi vypínači 01001011 počítá, že 64 + 8 + 2 + 1 dává 75, a diví se, že 1 + 1 je 10</title><defs>
