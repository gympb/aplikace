<style>
:root{
--f-head:'Montserrat','Segoe UI',system-ui,sans-serif;
--f-body:'Atkinson Hyperlegible Next','Segoe UI',system-ui,sans-serif;
--f-mono:'Atkinson Hyperlegible Mono',ui-monospace,Consolas,monospace;
--orange:#FF972E;--orange-t:#B85800;--orange-soft:#FFE6C8;
--bg:#F4F1EA;--card:#FFFFFF;--ink:#17140F;--ink2:#5A5446;--line:#E2DBCC;--line2:#CFC7B5;
--scope:#16130E;--grid:rgba(244,241,234,.08);--grid2:rgba(244,241,234,.2);
--analog:#BDB6A7;--cream:#F4F1EA;--bad:#FF6A4D;--good:#5DB67F;
--shadow:0 .06rem 0 rgba(60,40,10,.06),0 1.1rem 2.4rem -1.6rem rgba(60,40,10,.4);
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
--orange-t:#FFA94D;--orange-soft:#47311A;--bg:#12100C;--card:#1D1A14;--ink:#F4F1EA;--ink2:#B5AD9C;--line:#332F27;--line2:#463F34;
--scope:#0A0907;--shadow:0 1.1rem 2.4rem -1.6rem rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme=dark]{--orange-t:#FFA94D;--orange-soft:#47311A;--bg:#12100C;--card:#1D1A14;--ink:#F4F1EA;--ink2:#B5AD9C;--line:#332F27;--line2:#463F34;
--scope:#0A0907;--shadow:0 1.1rem 2.4rem -1.6rem rgba(0,0,0,.8);color-scheme:dark}
*{box-sizing:border-box}
html{font-size:clamp(9px,min(calc(100vw/96),calc(100vh/54)),80px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.1rem/1.38 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:.2rem solid var(--orange);outline-offset:.15rem}
b{font-weight:700}
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
/* hlavička */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1.6rem;padding:.9rem 2rem .6rem}
.brand{display:flex;flex-direction:column;gap:.15rem;min-width:15rem}
.back{font:600 .82rem/1 var(--f-head);color:var(--ink2);text-decoration:none;letter-spacing:.02em}
.back:hover{color:var(--orange-t)}
.brand b{font:800 1.7rem/1 var(--f-head);letter-spacing:-.01em}
.brand b span{background:linear-gradient(transparent 58%,var(--orange) 58%,var(--orange) 92%,transparent 92%);padding:0 .1rem}
.brand small{font:700 .66rem/1 var(--f-head);letter-spacing:.22em;text-transform:uppercase;color:var(--orange-t)}
.tabs{display:flex;gap:.2rem;justify-content:center;min-width:0}
.tab-b{display:flex;flex-direction:column;align-items:flex-start;gap:.2rem;padding:.55rem .6rem .6rem;border-radius:1rem;min-width:0;flex:0 1 auto;min-height:3.6rem;transition:background .2s,color .2s}
.tab-b .kap{font:700 .6rem/1 var(--f-head);letter-spacing:.2em;text-transform:uppercase;color:var(--orange-t)}
.tab-b .nm{font:700 .94rem/1.1 var(--f-head);white-space:nowrap}
.tab-b:hover{background:rgba(255,151,46,.14)}
.tab-b[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tab-b[aria-selected=true] .kap{color:var(--orange)}
.tools{display:flex;gap:.5rem}
.ib{width:3.1rem;height:3.1rem;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.ib svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed=false]{opacity:.55}
.ib:hover{background:var(--orange);color:#17140F}
.lang{display:grid;grid-auto-flow:column;gap:.2rem;background:var(--card);box-shadow:var(--shadow);border-radius:1.6rem;padding:.25rem;height:3.1rem;align-items:center}
.lang button{height:2.6rem;padding:0 .8rem;border-radius:1.3rem;font:800 calc(.9rem*var(--z)) Montserrat,sans-serif;letter-spacing:.04em;color:var(--ink2)}
.lang button.on{background:var(--ink);color:var(--bg)}
.lang button:not(.on):hover{background:var(--orange);color:#17140F}
#stage{padding:.3rem 2rem .5rem;min-height:0;overflow:hidden}
.foot{display:flex;justify-content:space-between;padding:.2rem 2rem .7rem;font:500 calc(.8rem*var(--z))/1 var(--f-mono);color:var(--ink2)}
/* rozvržení */
.tab{height:100%;display:grid;gap:1rem;min-height:0}
.tab[hidden]{display:none}
.split{display:grid;grid-template-columns:minmax(0,1fr) var(--side,27rem);gap:1rem;min-height:0}
.col{display:flex;flex-direction:column;gap:1rem;min-height:0;min-width:0}
.col>.grow{flex:1;min-height:0}
.card{background:var(--card);border-radius:1.2rem;padding:1rem 1.2rem;box-shadow:var(--shadow);min-width:0}
.side{overflow:hidden}
.side.card{display:flex;flex-direction:column;gap:.75rem}
.lbl{font:700 calc(.68rem*var(--z))/1 var(--f-head);letter-spacing:.22em;text-transform:uppercase;color:var(--orange-t)}
.ctl{display:flex;flex-direction:column;gap:.35rem}
.ctl .hd{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem}
.val{font:500 1.05rem/1 var(--f-mono);color:var(--ink)}
.val b{font-weight:500;color:var(--orange-t)}
h2.t{font:800 1.9rem/1.05 var(--f-head);margin:0;letter-spacing:-.01em}
p.n{margin:0;color:var(--ink2);font-size:calc(.95rem*var(--z));line-height:1.35}
/* scope */
.scope{position:relative;border-radius:1.2rem;background:radial-gradient(120% 140% at 50% 0%,#241F17 0%,var(--scope) 62%);overflow:hidden;box-shadow:var(--shadow);min-height:0}
:root[data-theme=dark] .scope,:root:not([data-theme=light]) .scope{outline:1px solid rgba(244,241,234,.07)}
.scope canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tag{position:absolute;left:1rem;top:.8rem;font:700 .66rem/1 var(--f-head);letter-spacing:.2em;text-transform:uppercase;color:var(--cream);opacity:.8;pointer-events:none;display:flex;gap:.7rem;align-items:center}
.tag i{display:inline-block;width:.9rem;height:.28rem;border-radius:.2rem;background:var(--orange)}
.tag i.a{background:var(--analog)}
.tag i.b{background:var(--bad)}
.badge{position:absolute;right:1rem;top:.7rem;font:500 .95rem/1 var(--f-mono);color:var(--cream);opacity:.85;pointer-events:none;text-align:right}
.scope .over{position:absolute;inset:0;overflow:hidden}
/* ovládací prvky */
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{min-height:2.7rem;padding:.45rem .95rem;border-radius:1.4rem;background:var(--bg);box-shadow:inset 0 0 0 .13rem var(--line2);font:600 calc(.95rem*var(--z))/1.1 var(--f-head);transition:background .15s,color .15s,transform .1s;white-space:nowrap}
.chip small{font:500 calc(.78rem*var(--z)) var(--f-body);opacity:.75;margin-left:.35rem}
.chip:hover{box-shadow:inset 0 0 0 .13rem var(--orange)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chips.g4{display:grid;grid-template-columns:repeat(4,1fr)}
.chips.g4 .chip{padding:.45rem .2rem;text-align:center}
.chips.g3{display:grid;grid-template-columns:repeat(3,1fr)}
.chips.g3 .chip{padding:.45rem .3rem;text-align:center}
.chips.g2{display:grid;grid-template-columns:repeat(2,1fr)}
.chips.g2 .chip{text-align:center}
.btn{min-height:3.3rem;padding:.6rem 1.4rem;border-radius:1.7rem;background:var(--orange);color:#17140F;font:700 1.05rem/1 var(--f-head);display:inline-flex;gap:.6rem;align-items:center;justify-content:center;box-shadow:0 .25rem 0 #C86D00;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(.2rem);box-shadow:0 .05rem 0 #C86D00}
.btn.sec{background:var(--bg);box-shadow:inset 0 0 0 .13rem var(--line2);color:var(--ink)}
.btn.sec:active{transform:scale(.97)}
.btn.sec:hover{box-shadow:inset 0 0 0 .13rem var(--orange)}
.btn svg{width:1.1rem;height:1.1rem;fill:currentColor}
.btn.on{background:var(--ink);color:var(--bg);box-shadow:none}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.row>.btn{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2.4rem;background:transparent;touch-action:pan-y;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:.65rem;border-radius:.4rem;background:linear-gradient(90deg,var(--orange) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:.65rem;border-radius:.4rem;background:var(--line)}
input[type=range]::-moz-range-progress{height:.65rem;border-radius:.4rem;background:var(--orange)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--card);border:.28rem solid var(--orange);margin-top:-.78rem;box-shadow:0 .2rem .6rem rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:1.7rem;height:1.7rem;border-radius:50%;background:var(--card);border:.28rem solid var(--orange)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.25rem;background:var(--bg);padding:.25rem;border-radius:1.5rem;box-shadow:inset 0 0 0 .13rem var(--line2)}
.seg .chip{box-shadow:none;background:transparent;border-radius:1.2rem;text-align:center}
.seg .chip.on{background:var(--ink);color:var(--bg)}
.callout{border-radius:.9rem;background:var(--bg);padding:.7rem .9rem;border-left:.3rem solid var(--orange);font-size:calc(.9rem*var(--z));line-height:1.35;color:var(--ink2)}
.callout b.l{display:block;font:700 calc(.62rem*var(--z))/1 var(--f-head);letter-spacing:.2em;text-transform:uppercase;color:var(--orange-t);margin-bottom:.3rem}
.status{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border-radius:1rem;font:700 1rem/1.15 var(--f-head);background:rgba(93,182,127,.18);color:var(--ink)}
.status i{width:1rem;height:1rem;border-radius:50%;background:var(--good);flex:none}
.status.bad{background:rgba(255,106,77,.18)}
.status.bad i{background:var(--bad)}
.big{font:800 3rem/1 var(--f-head);letter-spacing:-.02em}
.big u{font:600 1rem var(--f-head);text-decoration:none;color:var(--ink2);margin-left:.4rem;letter-spacing:0}
.or{color:var(--orange-t)}

/* Wing Lab Pro */
.chartbox{position:relative;height:13rem;padding:0;overflow:hidden}.chartbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.rd{display:grid;grid-template-columns:1fr auto;gap:.3rem .9rem;font:500 calc(.95rem*var(--z))/1.25 var(--f-mono)}
.rd span{color:var(--ink2);font-family:var(--f-body)}.rd b{font-weight:600;text-align:right}
.mx,.mx5,.mx7{display:none;flex-direction:column;gap:.7rem}.mx.on,.mx5.on,.mx7.on{display:flex}
.kid{border-radius:.9rem;background:var(--bg);padding:.6rem .9rem;font-size:calc(.95rem*var(--z));line-height:1.4;color:var(--ink)}
.kid b{display:block;font:700 calc(.62rem*var(--z))/1 var(--f-head);letter-spacing:.2em;text-transform:uppercase;color:var(--orange-t);margin-bottom:.3rem}
.chips.mini .chip{min-height:2.4rem}
.side{overflow:auto}
.tab-b .nm,.tab-b .kap{white-space:nowrap}
.btn{min-height:3rem}

@media (max-aspect-ratio:1/1){
html{font-size:clamp(9px,1.9vw,22px)}body{overflow:auto}.app{height:auto;min-height:100vh}#stage{overflow:visible}
.split{grid-template-columns:1fr}.scope{min-height:22rem}.top{grid-template-columns:1fr}.tabs{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cap{position:absolute;left:1rem;top:2.2rem;font:400 calc(.98rem*var(--z))/1.3 var(--f-body);color:var(--cream);opacity:.78;max-width:62%;pointer-events:none}
.tg{position:absolute;right:1rem;bottom:.7rem;gap:.4rem}
.tg .chip.on{background:var(--orange);color:#17140F}
.cmp .rw.on>div:not(.r){background:var(--orange-soft);border-radius:.5rem}
.cmp .rw[data-k]{cursor:pointer}
.side hr{border:0;border-top:1px solid var(--line);margin:.2rem 0;width:100%}
.sz .tr i.rg{background:repeating-linear-gradient(135deg,var(--orange) 0 .4rem,var(--orange-soft) .4rem .8rem)}
.side .chips.g4 .chip{min-height:2.3rem}
.bars .br{grid-template-columns:13rem 1fr 6.4rem}
.fm .br{grid-template-columns:12rem 1fr 10rem 7rem}
[hidden]{display:none!important}

.msg2{margin-top:.5rem;font-size:calc(.8rem*var(--z));line-height:1.35;color:var(--ink2)}.msg2.bad{color:var(--bad);font-weight:600}
.scope.drop{outline:.25rem dashed var(--orange);outline-offset:-.6rem}

#c1{cursor:grab;touch-action:none}#c1:active{cursor:grabbing}
.chips.mini{margin-top:.45rem;gap:.35rem}.chips.mini .chip{min-height:2rem;padding:.2rem .75rem;font-size:calc(.8rem*var(--z))}


.ib.q{font:800 1.4rem/1 var(--f-head)}
#help{position:fixed;inset:0;z-index:50;background:rgba(10,9,7,.6);display:grid;place-items:center;padding:2rem}
#help[hidden]{display:none}
#help .dlg{width:min(62rem,100%);max-height:100%;overflow:auto;background:var(--card);color:var(--ink);border-radius:1.2rem;box-shadow:0 2rem 5rem rgba(0,0,0,.5);padding:1.6rem 2rem 1.8rem;user-select:text;-webkit-user-select:text}
#help h2{margin:0 0 .2rem;font:800 1.6rem/1.15 var(--f-head)}
#help .kap{font:700 .7rem/1 var(--f-head);letter-spacing:.2em;text-transform:uppercase;color:var(--orange-t)}
#help h3{margin:1.1rem 0 .3rem;font:700 calc(.8rem*var(--z))/1 var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--orange-t)}
#help p,#help li{font-size:1.02rem;line-height:1.45;color:var(--ink2);margin:.25rem 0}
#help ul{margin:.2rem 0;padding-left:1.3rem}
#help b{color:var(--ink)}
#help .x{float:right;margin:-.3rem -.6rem 0 1rem;width:2.8rem;height:2.8rem;border-radius:50%;background:var(--bg);font:700 1.2rem/1 var(--f-head)}
#help .nav{display:flex;gap:.6rem;margin-top:1.2rem}
#help .nav button{padding:.6rem 1rem;border-radius:.8rem;background:var(--bg);font:700 calc(.9rem*var(--z))/1 var(--f-head)}

</style>

(function () {
  var dlg = document.getElementById('credits'), opener = null;

    var b = e.target.closest ? e.target.closest('[data-credits]') : null;

/* ========== fyzikální model: Joukowského profil, ideální proudění s cirkulací ========== */
/* Proudění se počítá analyticky: kružnice v rovině ζ se zobrazí na profil z = ζ + 1/ζ, cirkulace Γ vychází z Kuttovy podmínky.
   Rychlost V∞ = 1, délky v jednotkách modelu (tětiva je asi 4). Obraz je otočený tak, aby proud vždy šel zleva doprava. */
function wing(alDeg,e,f){
 const a=Math.hypot(1+e,f),beta=Math.asin(f/a),al=alDeg*Math.PI/180,G=4*Math.PI*a*Math.sin(al+beta),ca=Math.cos(al),sa=Math.sin(al);
 const N=360,P=[];let xmin=1e9,yle=0;
 for(let i=0;i<N;i++){const t=i/N*TAU,zx=-e+a*Math.cos(t),zy=f+a*Math.sin(t),m=zx*zx+zy*zy,px=zx+zx/m,py=zy-zy/m;P.push([px,py]);if(px<xmin){xmin=px;yle=py}}

 const toS=(zx,zy)=>{const rx=zx-mid;return[rx*ca+zy*sa,-rx*sa+zy*ca]};
 w.toS=toS;w.out=P.map(p=>toS(p[0],p[1]));w.LE=toS(xmin,yle);w.TE=toS(2,0);
 /* tloušťka a prohnutí z obrysu */
 let th=0,cb=0;
 for(let k=1;k<50;k++){const x0=xmin+chord*k/50;let hi=-1e9,lo=1e9;
  for(let i=0;i<N;i++){const A=P[i],B=P[(i+1)%N];if((A[0]-x0)*(B[0]-x0)<=0&&A[0]!==B[0]){const y=A[1]+(B[1]-A[1])*(x0-A[0])/(B[0]-A[0]);if(y>hi)hi=y;if(y<lo)lo=y}}
  if(hi>lo){th=Math.max(th,hi-lo);cb=Math.max(cb,Math.abs((hi+lo)/2-yle*(2-x0)/(2-xmin)))}}
 w.tc=th/chord;w.cc=cb/chord;
 const VV={u:0,v:0,inside:false};w.VV=VV;
 w.vel=(sx,sy)=>{
  const zx=sx*ca-sy*sa+mid,zy=sx*sa+sy*ca;
  const px=zx*zx-zy*zy-4,py=2*zx*zy,r=Math.hypot(px,py);
  let s1=Math.sqrt((r+px)/2),s2=Math.sqrt(Math.max(0,(r-px)/2));if(py<0)s2=-s2;

  const qx=cx+e,qy=cy-f,q2=qx*qx+qy*qy;

  if(d2<1e-10){u=ca;v=sa}else{const ux=(wx*dx+wy*dy)/d2,uy=(wy*dx-wx*dy)/d2;u=ux;v=-uy}

 /* rychlost a tlak přímo na povrchu */
 w.surf=function(n){
  const t0=Math.atan2(-f,1+e),dt=TAU/n,h=dt*.5;

  const LE=w.LE,TE=w.TE,cl2=(TE[0]-LE[0])**2+(TE[1]-LE[1])**2;let qmin=1e9;

   const t=t0+(i+.5)*dt,p=pz(t),p1=pz(t-h),p2=pz(t+h),tx_=p2[0]-p1[0],ty_=p2[1]-p1[1],ds=Math.hypot(tx_,ty_);

   const c2=cx*cx+cy*cy,ix=cx/c2,iy=-cy/c2,dx=1-(ix*ix-iy*iy),dy=-2*ix*iy,d2=dx*dx+dy*dy;
   const q=Math.sqrt((wx*wx+wy*wy)/d2),cp=1-q*q,nx=ty_/ds,ny=-tx_/ds;
   const sc=((p[0]-LE[0])*(TE[0]-LE[0])+(p[1]-LE[1])*(TE[1]-LE[1]))/cl2;
   s.X.push(p[0]);s.Y.push(p[1]);s.NX.push(nx);s.NY.push(ny);s.Q.push(q);s.CP.push(cp);s.DS.push(ds);s.S.push(sc);

 };
 w.sf=null;w.getSf=()=>w.sf||(w.sf=w.surf(300));
 return w;
}

function mkP(n,L=7){const p={n,L,x:new Float32Array(n),y:new Float32Array(n),h:[]};for(let i=0;i<n;i++)p.h.push(new Float32Array(L*2));return p}

  const h=p.h[i];for(let k=p.L-1;k>0;k--){h[2*k]=h[2*k-2];h[2*k+1]=h[2*k-1]}
  h[0]=p.x[i];h[1]=p.y[i];
  let x=p.x[i],y=p.y[i],a=w.vel(x,y);
  if(a.inside){pSpawn(p,i,v,false);continue}
  const mx=x+a.u*dt/2,my=y+a.v*dt/2,b=w.vel(mx,my);

  ${box('wing',[[tx('Řekni dětem','Say to the children'),tx('Křídlo je zvláštně tvarované: vzduch nad ním urychlí a celý proud sklopí dolů. Nad křídlem je proto méně tlaku a pod ním víc, takže ho vzduch nese nahoru. Když letadlo letí dost rychle, unese se.','The wing has a special shape: it speeds the air above it and turns the whole stream downward. So there is less pressure above and more below, and the air carries the wing up. If the aircraft flies fast enough, it holds itself up.')],[tx('Zeptej se dřív','Ask first'),tx('Proč musí letadlo před vzletem hodně rozjet po dráze?','Why must an aircraft speed up a lot on the runway before takeoff?')],[tx('Zkus ve třídě','Try in class'),tx('Dva svisle visící papíry 10 cm od sebe: foukni mezi ně. Papíry se k sobě přiblíží, protože mezi nimi je rychlý vzduch a menší tlak.','Two papers hanging 10 cm apart: blow between them. They come closer together, because the air between is fast and the pressure is lower.')]])}
  ${call(tx('Pozor na mýty (pro učitele)','Beware of myths (for teachers)'),tx('Neříkej, že vzduch nahoře musí „dohnat“ vzduch dole: není to pravda (kapitola 4, závod částic). Papírový pokus ukazuje, že rychlý proud znamená nižší tlak. Celé křídlo je složitější: tlaky i odklon proudu popisují totéž (kapitola 4).','Do not say the air on top must "catch up" with the air below: it is not true (chapter 4, particle race). The paper experiment shows that fast flow means lower pressure. The whole wing is subtler: the pressures and the deflected flow describe the same thing (chapter 4).'))}
 </aside></div>`},
 init(){HOOK.k7=()=>{P7.init=false}},
 anim(dt){T7+=dt;if(S.k7==='paper'){const b=S.blow/100;for(let i=0;i<PA.n;i++){PA.x[i]+=dt*(.1+.9*b)*.55;if(PA.x[i]>1){PA.x[i]-=1;PA.y[i]=Math.random()}}for(let i=0;i<PB.n;i++){PB.x[i]+=dt*.05;if(PB.x[i]>1){PB.x[i]-=1;PB.y[i]=Math.random()}}}
  else if(v7)pStep(P7,k7w(),v7,dt*2.2)},
 render(){

   const g=setup(cv),x=g.x,R=g.R,w=g.w,h=g.h,b=S.blow/100,sm=b*b*(3-2*b),thE=(-72+75*sm)*Math.PI/180;LG.c7=g;
   const x0=w*.17,y0=h*.5,Lp=w*.52,pts=[];let px=x0,py=y0;pts.push([px,py]);
   for(let i=1;i<=40;i++){const s=i/40,th=thE*Math.pow(s,.9)+Math.sin(T7*9+s*14)*.05*b*s;px+=Math.cos(th)*Lp/40;py-=Math.sin(th)*Lp/40;pts.push([px,py])}

   for(let i=0;i<PA.n;i++){const sx=PA.x[i]*(w-R*3)+R*1.5,sy=y0-R*1.2-PA.y[i]*h*.3,L=(.08+.92*b)*w*.07;x.moveTo(sx,sy);x.lineTo(sx+L,sy)}x.stroke();
   for(let i=0;i<PB.n;i++)dot(x,PB.x[i]*(w-R*3)+R*1.5,y0+R*2.2+PB.y[i]*h*.28,R*.17,'rgba(244,241,234,.6)');
   /* papír */
   x.beginPath();x.strokeStyle='#F4F1EA';x.lineWidth=R*.45;x.lineJoin='round';pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
   x.fillStyle='#E2B98F';x.beginPath();x.roundRect?x.roundRect(x0-R*2.8,y0-R*1.2,R*2.8,R*2.4,R*.7):x.rect(x0-R*2.8,y0-R*1.2,R*2.8,R*2.4);x.fill();
   /* tlaky */
   const L0=R*3.6,La=L0*(1-.55*b);
   [-1.6,0,1.6].forEach(o=>{const ax=mid[0]+o*R*1.6;arrow(x,ax,mid[1]+R*1.1+L0,ax,mid[1]+R*1.1,'#FF972E',4,R*.9);arrow(x,ax,mid[1]-R*1.1-La,ax,mid[1]-R*1.1,'#4DA3FF',4,R*.9)});
   TH(x,tx('rychlý vzduch: míň tlaku','fast air: less pressure'),w-R*1.4,y0-h*.36,R*1.05,'#4DA3FF','right');
   TH(x,tx('klidný vzduch: víc tlaku','calm air: more pressure'),w-R*1.4,y0+h*.4,R*1.05,'#FF972E','right');
   arrow(x,R*1.5,y0-R*3.4,R*7,y0-R*3.4,'#F4F1EA',3,R*.9);T(x,tx('foukání','blowing'),R*1.5,y0-R*4.6,R*.9,'rgba(244,241,234,.85)');
   if(b>.45)TH(x,tx('papír se zvedne!','the paper lifts!'),x0+Lp*.35,y0-h*.17+R*0,R*1.3,'#F4F1EA','center');
   SUBT(7,'<i></i>'+tx('Pokus s papírem (znázornění)','Paper experiment (illustration)'),'');
  }else{
   const w=k7w(),g=mkView(cv,0,0,5.6),x=g.x,R=g.R;v7={xmin:g.xmin,xmax:g.xmax,ymin:g.ymin,ymax:g.ymax};if(!P7.init){pInit(P7,v7);P7.init=true}
   drawP(g,P7,'rgba(244,241,234,.8)',2);drawWing(g,w,S.k7==='hand'?'#E2B98F':'#F4F1EA');

     if(cp<0)arrow(x,px,py,px+nx*L,py+ny*L,'#4DA3FF',3.4,R*.7);else arrow(x,px+nx*L,py+ny*L,px,py,'#FF972E',3.4,R*.7)})

   }
   arrow(x,g.X(g.xmin+.3),g.Y(g.ymax-.7),g.X(g.xmin+1.8),g.Y(g.ymax-.7),'#F4F1EA',2.5);T(x,tx('vítr','wind'),g.X(g.xmin+.3),g.Y(g.ymax-1.2),R*.9,'rgba(244,241,234,.85)');
   SUBT(7,'<i></i>'+(S.k7==='hand'?tx('Nakloněná dlaň ve větru','A tilted hand in the wind'):tx('Křídlo v proudu vzduchu','A wing in the air stream')),'');
  }
 }});
 OUT.blow=()=>`<b>${S.blow}</b> %`;OUT.hand=()=>`<b>${S.hand}</b> °`;OUT.wang=()=>`<b>${S.wang}</b> °`;

(function(){

const TIT=[[ 'Jak vzduch obtéká křídlo','How air flows around a wing'],['Proč je vzduch nad křídlem rychlejší','Why the air is faster above the wing'],['Tlak a „sání“ nad křídlem','Pressure and "suction" above the wing'],['Dvě vysvětlení vztlaku a jeden mýtus','Two explanations of lift and one myth'],['Cirkulace, rozběhový vír a přetažení','Circulation, the starting vortex and the stall'],['Víry na koncích křídel','Vortices at the wingtips'],['Jak to vysvětlit dětem na základní škole','How to explain it to primary school children']];
const CH=[
 {a:tx('<p>Křídlo je tvarované tak, aby při letu vzniklo síla směrem nahoru, vztlak. Aplikace počítá proudění kolem profilu křídla v ideálním modelu bez tření a ukazuje ho jako proudnice a pohybující se částice kouře.</p>','<p>A wing is shaped so that flight produces an upward force, lift. The app computes the flow around a wing profile in an ideal model without friction and shows it as streamlines and moving smoke particles.</p>'),
  x:[[['Jak model funguje','How the model works'],tx('<p>Profil vzniká matematickým zobrazením kružnice (Joukowského transformace). Kolem kružnice umíme proudění spočítat přesně, přenesením dostaneme proudění kolem křídla. Cirkulace Γ se určí tak, aby vzduch plynule odtékal z ostré odtokové hrany (Kuttova podmínka).</p>','<p>The profile comes from a mathematical mapping of a circle (the Joukowski transformation). Flow around a circle can be computed exactly, and mapping it gives the flow around the wing. The circulation Γ is chosen so that air leaves the sharp trailing edge smoothly (the Kutta condition).</p>')],
     [['Co model neumí','What the model cannot do'],tx('<p>Nezná tření vzduchu a mezní vrstvu, a proto nepočítá odpor ani odtržení proudu při velkém sklonu. Pro malé sklony dává dobrý obraz vztlaku, nad asi 14° už skutečné křídlo vztlak ztrácí (kapitola 5).</p>','<p>It knows nothing about air friction and the boundary layer, so it computes neither drag nor flow separation at large angles. For small angles it gives a good picture of lift, but above about 14° a real wing loses lift (chapter 5).</p>')]],
  c:U([tx('Zvětši sklon a sleduj, jak se stagnační bod posouvá pod náběžnou hranu.','Increase the angle and watch the stagnation point move below the leading edge.'),tx('Zvol souměrný profil a sklon 0°: proudění je nahoře i dole stejné, vztlak je nulový.','Choose the symmetric profile and 0°: the flow is the same above and below and lift is zero.')]),
  d:tx('Křídlo odklání proud a nad sebou ho zrychluje. Tak vznikne síla nahoru.','The wing deflects the flow and speeds it up above itself. That is how an upward force arises.')},
 {a:tx('<p>Barva ukazuje rychlost vzduchu v každém místě: žlutá je rychlé proudění, fialová pomalé. Šipky a světlé čárky u částic ukazují směr a rychlost.</p>','<p>The color shows the air speed at every point: yellow is fast flow, purple is slow. Arrows and the light streaks on particles show direction and speed.</p>'),
  x:[[['Proč je vzduch nahoře rychlejší','Why the air is faster on top'],tx('<p>Proudnice nad křídlem se zhušťují a zhuštěné proudnice znamenají rychlejší proudění. Příčinu dává cirkulace (kapitola 5): kolem křídla se vzduch točí po směru hodin, takže nahoře rychlost proudu zvětšuje a dole zmenšuje.</p>','<p>The streamlines above the wing crowd together, and crowded streamlines mean faster flow. The cause is circulation (chapter 5): around the wing the air turns clockwise, so it adds to the stream speed on top and takes away below.</p>')]],
  c:U([tx('Přetáhni sondu A nad křídlo a sondu B pod něj a porovnej rychlosti.','Drag probe A above the wing and probe B below it and compare the speeds.'),tx('Dej sondu daleko před křídlo: rychlost je skoro stejná jako rychlost letu.','Put a probe far ahead of the wing: its speed is almost the same as the airspeed.')]),

 {a:tx('<p>Rychlost a tlak spolu souvisejí. Součinitel Cp říká, o kolik je tlak nižší nebo vyšší než v klidném vzduchu, v násobcích dynamického tlaku ½ρV².</p>','<p>Speed and pressure are linked. The coefficient Cp tells how much the pressure is lower or higher than in still air, in multiples of the dynamic pressure ½ρV².</p>'),
  x:[[['Sání nahoře, přetlak dole','Suction on top, overpressure below'],tx('<p>Na horní straně je podtlak, který křídlo táhne nahoru. Na spodní straně je přetlak, který ho tlačí nahoru. U běžných sklonů nese větší část vztlaku horní strana. Aplikace to počítá z tlaků na povrchu a ukazuje v procentech.</p>','<p>On the top there is lower pressure that pulls the wing up. On the bottom there is higher pressure that pushes it up. At ordinary angles the top carries the larger part of lift. The app computes this from the surface pressures and shows it in percent.</p>')],
     [['Kolik je „sání“','How big is the "suction"'],tx('<p>Podtlak je řádu tisíců pascalů, tedy jen pár procent atmosférického tlaku. Stačí, protože plocha křídla je velká.</p>','<p>The suction is on the order of thousands of pascals, only a few percent of atmospheric pressure. It is enough because the wing area is large.</p>')]],
  c:U([tx('Souměrný profil, sklon 0°: tlaky nahoře a dole jsou stejné a vztlak je nulový.','Symmetric profile, 0°: the pressures above and below are equal and lift is zero.'),tx('Zvyšuj rychlost letu: tlaky rostou s druhou mocninou rychlosti.','Raise the airspeed: pressures grow with the square of speed.')]),
  d:tx('Vztlak je součet sání nad křídlem a přetlaku pod ním. Plocha mezi křivkami v grafu je právě vztlak.','Lift is the sum of the suction above the wing and the overpressure below it. The area between the curves in the graph is the lift.')},
 {a:tx('<p>Vztlak se dá vysvětlit dvěma způsoby, které se nevylučují. Tlakový: rychlejší vzduch má nižší tlak. Odklonový: křídlo vychýlí proud dolů a reakcí je síla nahoru.</p>','<p>Lift can be explained in two ways that do not exclude each other. The pressure one: faster air has lower pressure. The deflection one: the wing turns the stream downward and the reaction is a force upward.</p>'),
  x:[[['Mýtus o stejné době','The equal transit time myth'],tx('<p>Častá, ale nesprávná představa tvrdí, že se vzduch nad a pod křídlem po rozdělení musí potkat za křídlem ve stejný okamžik. Závod částic ukazuje, že částice nad křídlem je u odtokové hrany dřív. Nic ji nenutí čekat.</p>','<p>A common but wrong idea says that air going over and under the wing must meet behind it at the same moment. The particle race shows that the particle over the wing reaches the trailing edge sooner. Nothing makes it wait.</p>')],
     [['Proč platí obě vysvětlení','Why both explanations hold'],tx('<p>Bernoulliho rovnice i Newtonovy zákony plynou ze stejných pohybových rovnic vzduchu. Jedno vysvětlení popisuje síly na povrchu, druhé změnu hybnosti proudu. Proč mají rychlost a odklon proudu právě takovou hodnotu, vysvětlí až cirkulace (kapitola 5).</p>','<p>The Bernoulli equation and Newton\'s laws both follow from the same equations of air motion. One explanation describes forces on the surface, the other the change of the stream\'s momentum. Why speed and deflection have exactly these values is explained by circulation (chapter 5).</p>')]],
  c:U([tx('Pusť časovou čáru a porovnej časy částic A a B.','Release the time line and compare the times of particles A and B.'),tx('Přepni na odklon proudu: před křídlem vzduch stoupá, za ním klesá.','Switch to deflected flow: ahead of the wing the air rises, behind it sinks.')]),
  d:tx('Rychlejší vzduch nad křídlem a proud vychýlený dolů jsou dva pohledy na tentýž jev.','Faster air above the wing and a stream turned downward are two views of the same event.')},
 {a:tx('<p>Vztlak a cirkulace jsou spojené. Cirkulace Γ je „oběh“ rychlosti kolem křídla. Vzorec Kutty a Žukovského říká, že vztlak na jednotku rozpětí je L = ρ·V·Γ.</p>','<p>Lift and circulation are connected. The circulation Γ is the "going round" of the velocity around the wing. The Kutta–Joukowski formula says that lift per unit span is L = ρ·V·Γ.</p>'),
  x:[[['Rozběhový vír','The starting vortex'],tx('<p>Celková cirkulace v ideálním proudění zůstává nulová (Kelvinova věta). Když křídlo nabírá cirkulaci Γ po směru hodin, utrhne se od odtokové hrany vír opačného směru a zůstane za křídlem na místě rozjezdu. V aplikaci je vidět, že součet obou je nula.</p>','<p>In ideal flow the total circulation stays zero (Kelvin\'s theorem). When the wing gains clockwise circulation Γ, a vortex of the opposite sense breaks off the trailing edge and stays behind where the start happened. The app shows that the sum of both is zero.</p>')],
     [['Přetažení','The stall'],tx('<p>Při příliš velkém sklonu se proud neudrží u horní strany a odtrhne se. Za křídlem vznikají neuspořádané víry a vztlak prudce klesne. Obrázek v aplikaci je schematický, nejde o výpočet.</p>','<p>At too large an angle the flow does not stay on the upper side and separates. Disordered vortices form behind the wing and lift drops sharply. The picture in the app is a sketch, not a calculation.</p>')]],
  c:U([tx('Změň sklon: rozběh se spustí znovu a ukáže silnější nebo slabší vír.','Change the angle: the start runs again and shows a stronger or weaker vortex.'),tx('Přepni na přetažení a zvyš sklon nad 14°.','Switch to the stall and raise the angle above 14°.')]),
  d:tx('Křídlo nese cirkulaci a stejně velkou opačnou cirkulaci nechává za sebou ve víru.','The wing carries circulation and leaves an equal opposite circulation behind in a vortex.')},
 {a:tx('<p>Křídlo konečného rozpětí nemá vztlak na koncích. Vzduch zespodu, kde je vyšší tlak, obtéká konce nahoru a stáčí se do dvou protiběžných vírů.</p>','<p>A wing of finite span has no lift at its tips. Air from below, where the pressure is higher, flows round the tips upward and curls into two counter-rotating vortices.</p>'),
  x:[[['Jak jsou víry velké','How big the vortices are'],tx('<p>Při eliptickém rozložení vztlaku je Γ₀ = 4L / (π·ρ·V·b). Víry jsou od sebe ve vzdálenosti b₀ = π·b/4 a pár klesá rychlostí U = Γ₀ / (2π·b₀).</p>','<p>With elliptical lift distribution Γ₀ = 4L / (π·ρ·V·b). The vortices are b₀ = π·b/4 apart and the pair sinks at U = Γ₀ / (2π·b₀).</p>')],
     [['Proč na tom záleží','Why it matters'],tx('<p>Za těžkým letadlem je vzduch zvířený a může ohrozit menší letadlo, které za ním letí. Proto se při vzletech a přistáních dodržují odstupy.</p>','<p>Behind a heavy aircraft the air is churned and can endanger a smaller aircraft following it. That is why separations are kept at takeoff and landing.</p>')]],
  c:U([tx('Přepni z malého letadla na dopravní: cirkulace víru vzroste.','Switch from the small aircraft to the airliner: the vortex circulation grows.'),tx('Zvětšuj rozpětí při stejné hmotnosti: cirkulace klesá.','Increase the span at the same mass: the circulation falls.')]),
  d:tx('Čím těžší letadlo a čím pomaleji letí, tím silnější víry za sebou nechává.','The heavier the aircraft and the slower it flies, the stronger the vortices it leaves behind.')},
 {a:tx('<p>Tato kapitola je pomůcka pro učitele, kteří vysvětlují princip křídla dětem na základní škole (asi 3. až 5. třída). Nemá vzorce. Má tři scény: papír, dlaň a křídlo. U každé je věta, kterou lze říct dětem, otázka k hádání před pokusem a pokus, který lze udělat ve třídě.</p>','<p>This chapter is a tool for teachers explaining how a wing works to primary school children (about grades 3 to 5). It has no formulas. It has three scenes: paper, hand and wing. Each has something to say to the children, a question to guess before the experiment and an experiment that can be done in class.</p>'),
  x:[[['Jak ji použít','How to use it'],U([tx('Nejdřív se zeptej dětí, co se stane. Nech je hádat.','First ask the children what will happen. Let them guess.'),tx('Pak ukaž pokus nebo scénu.','Then show the experiment or the scene.'),tx('Vysvětli jednou větou, používej slova „rychlý vzduch“ a „méně tlaku“.','Explain in one sentence, use the words "fast air" and "less pressure".')])],
     [['Čemu se vyhnout','What to avoid'],U([tx('Neříkej, že vzduch nahoře musí „dohnat“ vzduch dole.','Do not say the air on top must "catch up" with the air below.'),tx('Pokusy dělej pod dohledem a ruce z oken vozidel nikdy nevystrkuj.','Run experiments under supervision and never put hands out of vehicle windows.')])]],
  c:U([tx('Začni papírem: je to nejjednodušší pokus.','Start with the paper: it is the simplest experiment.'),tx('Pak ukaž dlaň a nakláněním ukaž, že vzduch míří dolů.','Then show the hand and tilt it to show that the air goes down.'),tx('Nakonec ukaž křídlo a spoj všechno do jednoho obrazu.','Finally show the wing and join everything into one picture.')]),
  d:tx('Rychlý vzduch tlačí méně a křídlo odhání vzduch dolů, takže vzduch nese křídlo nahoru.','Fast air pushes less and the wing throws air downward, so the air carries the wing upward.')},
];
