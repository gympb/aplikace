<script>
'use strict';
/* ========== pomocné funkce ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
let LANG='cs';try{LANG=localStorage.getItem('hdr-lang')||''}catch(e){}
if(LANG!=='cs'&&LANG!=='en')LANG=/^cs|^sk/i.test(navigator.language||'cs')?'cs':'en';
const tx=(c,e)=>LANG==='en'?e:c;
const nf=(n,d=0)=>(+n).toLocaleString(LANG==='en'?'en-US':'cs-CZ',{maximumFractionDigits:d,minimumFractionDigits:0});
const nits=L=>nf(L,L>=100?0:L>=10?1:L>=1?2:L>=.1?2:L>=.01?3:4);
const pct=(r,d=1)=>nf(r*100,r*100<1?2:d)+' %';
const TAU=Math.PI*2;
const log10=Math.log10;
const fL=L=>L<1?nf(L,Math.round(-Math.log10(L))):nf(L);

/* ========== fyzika: přenosové funkce a tone mapping ========== */
const PQc={m1:2610/16384,m2:2523/4096*128,c1:3424/4096,c2:2413/4096*32,c3:2392/4096*32};
const pqE=n=>{n=clamp(n,0,1);const p=Math.pow(n,1/PQc.m2);return 10000*Math.pow(Math.max(p-PQc.c1,0)/(PQc.c2-PQc.c3*p),1/PQc.m1)};      // signál 0–1 → nity (SMPTE ST 2084)
const pqI=L=>{const y=Math.pow(clamp(L,0,10000)/10000,PQc.m1);return Math.pow((PQc.c1+PQc.c2*y)/(1+PQc.c3*y),PQc.m2)};                  // nity → signál 0–1
const gamE=(v,Lw=100)=>Lw*Math.pow(clamp(v,0,1),2.4);                                                                                // BT.1886 (bez zdvihu černé)
const gamI=(L,Lw=100)=>Math.pow(clamp(L/Lw,0,1),1/2.4);
const HA=.17883277,HB=.28466892,HC=.55991073;
const hlgInv=e=>e<=.5?e*e/3:(Math.exp((e-HC)/HA)+HB)/12;
const hlgE=(v,Lw=1000)=>{const g=1.2+.42*log10(Lw/1000);return Lw*Math.pow(hlgInv(clamp(v,0,1)),g)};                                       // HLG (BT.2100) na displeji s vrcholem Lw
/* BT.2390: stlačení jasu z masteringu (vrchol Lw) na displej (vrchol Ld); černá = 0 */
function eetf(L,Lw,Ld){
 if(L<=0)return 0;
 if(Lw<=Ld)return Math.min(L,Lw);
 const pw=pqI(Lw),pd=pqI(Ld),mx=pd/pw,ks=1.5*mx-.5;
 const e1=Math.min(1,pqI(Math.min(L,Lw))/pw);
 let e2=e1;
 if(e1>=ks){const t=(e1-ks)/(1-ks),t2=t*t,t3=t2*t;e2=(2*t3-3*t2+1)*ks+(t3-2*t2+t)*(1-ks)+(-2*t3+3*t2)*mx}
 return pqE(e2*pw);
}

/* ========== barvy a plátno ========== */
const C={};
function readC(){const cs=getComputedStyle(document.documentElement);['orange','orange-t','bg','card','ink','ink2','line','line2','scope','analog','cream','bad','good','blue'].forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim())}
const REM=()=>parseFloat(getComputedStyle(document.documentElement).fontSize)||16;
function setup(cv){
 const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
 const w=Math.max(20,Math.round(r.width)),h=Math.max(20,Math.round(r.height));
 if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
 const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);
 return{x,w,h,R:REM()};
}
function T(x,s,px,py,size,col,al='left',font='Atkinson Hyperlegible Mono',wt=500,base='middle'){x.font=`${wt} ${size}px "${font}",monospace`;x.fillStyle=col;x.textAlign=al;x.textBaseline=base;x.fillText(s,px,py)}
function TH(x,s,px,py,size,col,al='left'){T(x,s,px,py,size,col,al,'Montserrat',700)}
function line(x,x1,y1,x2,y2,col,w=1,dash){x.beginPath();x.strokeStyle=col;x.lineWidth=w;x.setLineDash(dash||[]);x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.setLineDash([])}
function dot(x,px,py,r,col){x.beginPath();x.fillStyle=col;x.arc(px,py,r,0,TAU);x.fill()}
const GR='rgba(244,241,234,.09)',GR2='rgba(244,241,234,.22)',TXT='rgba(244,241,234,.6)';
/* souřadnice ukazatele uvnitř plátna */
function ptr(e,cv){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,h:r.height}}
function drag(cv,fn){
 let on=false;
 cv.addEventListener('pointerdown',e=>{on=true;cv.setPointerCapture(e.pointerId);fn(ptr(e,cv),e)});
 cv.addEventListener('pointermove',e=>{if(on)fn(ptr(e,cv),e)});
 const off=()=>{on=false};cv.addEventListener('pointerup',off);cv.addEventListener('pointercancel',off);
}
/* logaritmická osa */
const lg=(L,a,b,p0,p1)=>p0+(log10(Math.max(L,1e-12))-log10(a))/(log10(b)-log10(a))*(p1-p0);

/* ========== stav ========== */

const IMAP={tv:L=>100*Math.log(L/100)/Math.log(40),lux:v=>v};
const S={tab:0,
 // 1 Jas
 pk1:1000,pnl:'oled',lux:0,
 // 2 Přenosová funkce
 ysc:'log',code:512,
 // 3 Bity
 bits:8,reg:'dark',lupa:true,dith:false,pq3:true,pr3:.5,
 // 4 Barvy
 gm709:true,gmP3:true,gm2020:true,cx:.17,cy:.797,
 // 5 Metadata
 tvp:600,sc:5,fr:0,ovl:true,play:false,
 // 6 Formáty
 fsel:'',cont:'hdr10',dvp:'8',cap:{hdr10:true,hdr10p:false,dv:true,hlg:false}};
const OUT={},ACT={},TABS=[];
function set(k,v){S[k]=v;refresh()}
let _rq=0;
function refresh(){if(_rq)return;_rq=requestAnimationFrame(()=>{_rq=0;sync();const t=TABS[S.tab];t&&t.render&&t.render()})}
function sync(){
 $$('[data-k][data-v]').forEach(el=>el.classList.toggle('on',String(S[el.dataset.k])===el.dataset.v));
 $$('input[data-k]').forEach(el=>{let v=S[el.dataset.k];if(el.dataset.map)v=IMAP[el.dataset.map](v);el.value=v;el.style.setProperty('--p',((el.value-el.min)/(el.max-el.min)*100)+'%')});
 $$('[data-o]').forEach(el=>{const f=OUT[el.dataset.o];if(f){const h=f();if(el.innerHTML!==h)el.innerHTML=h}});
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-k][data-v],[data-act]');if(!el)return;
 if(el.dataset.act){ACT[el.dataset.act]&&ACT[el.dataset.act](el.dataset.v,el);return}
 let v=el.dataset.v;if(/^-?\d+(\.\d+)?$/.test(v))v=+v;else if(v==='true')v=true;else if(v==='false')v=false;set(el.dataset.k,v);
});
document.addEventListener('input',e=>{
 const el=e.target;if(el.type!=='range'||!el.dataset.k)return;
 let v=+el.value;if(el.dataset.map)v=MAPS[el.dataset.map](v);set(el.dataset.k,v);
});

/* ========== rámec aplikace ========== */
const ICON={
 theme:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>',
 full:'<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
};

function go(i){
 if(S.play)ACT.play();
 S.tab=i;
 $$('#stage>.tab').forEach((s,j)=>s.hidden=j!==i);

}

 try{const th=localStorage.getItem('hdr-theme');if(th==='dark'||th==='light')document.documentElement.dataset.theme=th}catch(e){}

 $('#tBack').textContent=tx('← Všechny školní aplikace','← All school apps');$('#tSub').textContent=tx('Gymnázium Příbram · GymTV · Informatika','Gymnázium Příbram · GymTV · Computer science');
 $('#tabs').setAttribute('aria-label',tx('Záložky','Tabs'));
 $('#bThm').setAttribute('aria-label',tx('Světlý nebo tmavý vzhled','Light or dark theme'));$('#bFul').setAttribute('aria-label',tx('Celá obrazovka','Fullscreen'));
 $$('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.v===LANG));
 $('#fL').textContent=tx('Autor: Ivo Bešťák · Licence CC BY 4.0 · Aktualizace: 12. 11. 2026','Author: Ivo Bešťák · License CC BY 4.0 · Updated: 12. 11. 2026');
 $('#fR').textContent=tx('Počítá se v prohlížeči, nic se neodesílá. Obrazovky HDR jen simulují.','Computed in your browser, nothing is sent. The screens only simulate HDR.');
 readC();window.hdrHelpInit&&hdrHelpInit();
 $('#bThm').innerHTML=ICON.theme;$('#bFul').innerHTML=ICON.full;
 const nav=$('#tabs'),st=$('#stage');
 TABS.forEach((t,i)=>{
  nav.insertAdjacentHTML('beforeend',`<button class="tab-b" role="tab" aria-selected="false" data-act="tab" data-v="${i}"><span class="kap">${tx('kap.','ch.')} ${i+1}</span><span class="nm">${t.name}</span></button>`);
  st.insertAdjacentHTML('beforeend',`<section class="tab" hidden data-t="${i}" style="${t.side?'--side:'+t.side+';':''}">${t.build()}</section>`);
 });
 ACT.tab=v=>go(+v);
 TABS.forEach(t=>t.init&&t.init());
 document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||!$('#help').hidden)return;if(e.key==='ArrowRight')go((S.tab+1)%TABS.length);if(e.key==='ArrowLeft')go((S.tab+TABS.length-1)%TABS.length)});
 new ResizeObserver(()=>refresh()).observe(st);
 matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{readC();refresh()});
 window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(n>=1&&n<=TABS.length&&n-1!==S.tab)go(n-1)});
 const h=parseInt(location.hash.slice(1));go(h>=1&&h<=TABS.length?h-1:0);
 document.fonts&&document.fonts.ready.then(()=>{readC();refresh()});
}
</script>
<script>
/* ===== 1 Světlo a jas ===== */
(function(){
const PNL={lcd:{b:.1,n:'LCD'},mini:{b:.005,n:'Mini-LED'},oled:{b:.0005,n:'OLED'}};
const REFL=.02; // odrazivost obrazovky (orientačně)
const amb=()=>REFL*S.lux/Math.PI;
const beff=()=>PNL[S.pnl].b+amb();
const ratio=(pk=S.pk1)=>(pk+amb())/beff();
const MK=[
 [.001,tx('Hvězdná obloha','Starlit sky')],
 [.05,tx('Krajina za úplňku','Moonlit landscape')],
 [48,tx('Kino (DCI)','Cinema (DCI)')],
 [130,tx('Papír v kanceláři','Paper in an office')],
 [5000,tx('Modrá obloha','Clear blue sky')],
 [25000,tx('Papír na slunci','Paper in sunlight')]];
OUT.k_ratio=()=>`${nf(ratio())}<u>: 1</u>`;
OUT.k_ratio_s=()=>tx(`SDR (100 nit) by při stejné černé a stejných odlescích mělo ${nf(ratio(100))} : 1.`,`SDR (100 nit) with the same black and reflections would reach ${nf(ratio(100))} : 1.`);
OUT.k_ev=()=>`${nf(Math.log2(ratio()),1)}<u>EV</u>`;
OUT.k_ev_s=()=>tx(`SDR: ${nf(Math.log2(ratio(100)),1)} EV. Jeden EV znamená dvojnásobek jasu.`,`SDR: ${nf(Math.log2(ratio(100)),1)} EV. One EV is a doubling of luminance.`);
OUT.k_b=()=>`${nits(beff())}<u>nit</u>`;
OUT.k_b_s=()=>tx(`Panel ${nits(PNL[S.pnl].b)} nit + odlesky místnosti ${nits(amb())} nit.`,`Panel ${nits(PNL[S.pnl].b)} nit + room reflections ${nits(amb())} nit.`);
OUT.luxv=()=>`<b>${nf(S.lux)}</b> lx`;
OUT.pkv=()=>`<b>${nf(S.pk1)}</b> nit`;
TABS.push({name:tx('Světlo a jas','Light and nits'),side:'27rem',
 build(){
  return `<div class="split"><div class="col">
   <div class="scope grow"><canvas id="c1"></canvas>
    <div class="tag"><span><i class="a"></i>SDR</span><span><i></i>${tx('Tvoje TV','Your TV')}</span><span><i class="b"></i>${tx('Kontejner PQ','PQ container')}</span><span><i class="r"></i>${tx('Odlesky místnosti','Room reflections')}</span></div>
    <div class="badge">${tx('jas v nitech (cd/m²), log. osa','luminance in nits (cd/m²), log axis')}</div></div>
   <div class="kpis">
    <div class="card kpi"><span class="lbl">${tx('Kontrast TV','TV contrast')}</span><div class="big or" data-o="k_ratio"></div><small data-o="k_ratio_s"></small></div>
    <div class="card kpi"><span class="lbl">${tx('Rozsah','Range')}</span><div class="big" data-o="k_ev"></div><small data-o="k_ev_s"></small></div>
    <div class="card kpi"><span class="lbl">${tx('Efektivní černá','Effective black')}</span><div class="big" data-o="k_b"></div><small data-o="k_b_s"></small></div>
   </div></div>
   <div class="side card">
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Nejvyšší jas TV','TV peak luminance')}</span><span class="val" data-o="pkv"></span></div>
     <div class="chips g3">${[[100,'100 · SDR'],[300,'300'],[600,'600'],[1000,'1 000'],[2000,'2 000'],[4000,'4 000']].map(a=>`<button class="chip" data-k="pk1" data-v="${a[0]}">${a[1]}</button>`).join('')}</div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Typ panelu (hloubka černé)','Panel type (black level)')}</span></div>
     <div class="chips g3"><button class="chip" data-k="pnl" data-v="lcd">LCD<small>0,1</small></button><button class="chip" data-k="pnl" data-v="mini">Mini-LED<small>0,005</small></button><button class="chip" data-k="pnl" data-v="oled">OLED<small>0,0005</small></button></div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Osvětlení místnosti','Room lighting')}</span><span class="val" data-o="luxv"></span></div>
     <input type="range" data-k="lux" data-map="lux" min="0" max="500" step="10">
     <div class="chips g4">${[[0,tx('tma','dark')],[50,tx('večer','evening')],[150,tx('pokoj','room')],[400,tx('den','day')]].map(a=>`<button class="chip" data-k="lux" data-v="${a[0]}" style="padding:.3rem .1rem;font-size:.82rem">${a[1]}</button>`).join('')}</div></div>
    <div class="callout"><b class="l">${tx('Co z toho plyne','Takeaway')}</b>${tx('Světlo z lampy se odráží od obrazovky a zvedá černou. I při 50 lx se z „nekonečného“ kontrastu OLED stane jen několik tisíc : 1. HDR potřebuje šeřit.','Light from a lamp reflects off the screen and lifts the blacks. Even at 50 lx the “infinite” contrast of an OLED shrinks to a few thousand : 1. HDR wants a dim room.')}</div>
    <div class="callout" style="margin-top:auto"><b class="l">${tx('Pozor','Note')}</b>${tx('Běžný monitor má vrchol kolem 300 nit, takže HDR sám nezobrazí. Aplikace HDR počítá a kreslí do grafů.','An ordinary monitor peaks around 300 nit, so it cannot show HDR itself. This app computes HDR and draws it in charts.')}</div>
   </div></div>`;
 },
 render(){
  const cv=$('#c1');if(!cv)return;
  const {x,w,h,R}=setup(cv);
  const A=1e-4,B=1e5,x0=R*1.8,x1=w-R*1.8,X=L=>lg(L,A,B,x0,x1);
  const topM=R*8.4,axisY=h-R*2.6;
  // mřížka dekád
  for(let p=-4;p<=5;p++){const px=X(10**p);line(x,px,topM-R*.9,px,axisY,p%2?GR:GR2,1);T(x,fL(10**p),px,axisY+R*.95,R*.74,TXT,'center')}
  line(x,x0,axisY,x1,axisY,GR2,1.2);
  TH(x,tx('jas [nit]','luminance [nit]'),x1,axisY+R*2,R*.7,TXT,'right');
  // odlesky místnosti
  const Bf=beff(),La=amb();
  const bh=Math.max(R,Math.min(R*3.3,(axisY-topM)/3-R*.9)),gap=Math.max(R*.3,(axisY-topM-3*bh)/3.1);
  const rowY=i=>topM+gap*.6+i*(bh+gap);
  if(La>A*1.05){const xr=X(Math.max(La,A));x.fillStyle='rgba(255,106,77,.17)';x.fillRect(x0,topM-R*.3,xr-x0,axisY-topM+R*.3);line(x,xr,topM-R*.3,xr,axisY,C.bad,1.5,[5,4]);TH(x,tx('odlesky','reflections'),Math.min(xr+R*.5,x1-R*6),axisY-R*.7,R*.7,C.bad)}
  // pruhy
  const bars=[
   {y:rowY(0),lo:Bf,hi:100+La,col:C.analog,t:`SDR · 100 nit`,e:Math.log2((100+La)/Bf)},
   {y:rowY(1),lo:Bf,hi:S.pk1+La,col:C.orange,t:tx(`Tvoje TV · ${nf(S.pk1)} nit`,`Your TV · ${nf(S.pk1)} nit`),e:Math.log2((S.pk1+La)/Bf)},
   {y:rowY(2),lo:A,hi:10000,col:C.blue,t:tx('PQ (HDR10, HDR10+, Dolby Vision) · 0 až 10 000 nit','PQ (HDR10, HDR10+, Dolby Vision) · 0 to 10,000 nit'),e:0,open:true}];
  bars.forEach(b=>{
   const xa=X(Math.max(b.lo,A)),xb=X(b.hi);
   x.fillStyle=b.col;x.beginPath();x.roundRect(xa,b.y,Math.max(2,xb-xa),bh,bh*.28);x.fill();
   if(b.open){const g=x.createLinearGradient(xa,0,xa+R*6,0);g.addColorStop(0,'rgba(10,9,7,.85)');g.addColorStop(1,'rgba(10,9,7,0)');x.fillStyle=g;x.fillRect(xa,b.y,R*6,bh)}
   x.font=`700 ${R*.95}px Montserrat,sans-serif`;const tw=x.measureText(b.t).width;
   const inside=xb-xa>tw+R*2.4;
   TH(x,b.t,inside?xa+R*(b.open?3.6:1):xb+R*.8,b.y+bh/2,R*.95,inside?'#17140F':C.cream);
   if(b.e){const lab=nf(b.e,1)+' EV';const lw=R*5;TH(x,lab,inside?xb-R*.8:xb+R*.8+tw+R*1.2,b.y+bh/2,R*.82,inside?'#17140F':TXT,inside?'right':'left')}
   // černá
   if(!b.open)line(x,xa,b.y-R*.2,xa,b.y+bh+R*.2,C.cream,2);
  });
  T(x,tx('černá ≈ ','black ≈ ')+nits(Bf)+' nit',X(Math.max(Bf,A))+R*.5,rowY(1)+bh+gap*.5,R*.7,TXT);
  // značky ze života
  const rowsL=[R*3.7,R*5.3,R*6.9];
  MK.forEach((m,i)=>{
   const px=X(m[0]),ly=rowsL[i%3];
   line(x,px,ly+R*.55,px,axisY,'rgba(244,241,234,.28)',1,[2,4]);
   dot(x,px,axisY,R*.2,C.cream);
   x.font=`700 ${R*.78}px Montserrat,sans-serif`;const nw=x.measureText(m[1]).width;
   const lx=clamp(px,x0+nw/2,x1-nw/2);
   TH(x,m[1],lx,ly-R*.28,R*.78,C.cream,'center');
   T(x,nits(m[0])+' nit',lx,ly+R*.5,R*.68,TXT,'center');
  });
  TH(x,tx('Slunce ≈ 1,6 · 10⁹ nit →','Sun ≈ 1.6 · 10⁹ nit →'),x1,axisY-R*1.2,R*.78,TXT,'right');
 }});
})();
</script>
<script>
/* ===== 2 Přenosová funkce ===== */
(function(){
const FN=[
 {id:'gam',n:tx('Gama 2,4 (SDR, 100 nit)','Gamma 2.4 (SDR, 100 nit)'),f:v=>gamE(v,100),col:'#BDB6A7',k:'a'},
 {id:'pq',n:'PQ (SMPTE ST 2084)',f:pqE,col:'#FF972E',k:''},
 {id:'hlg',n:tx('HLG (displej 1 000 nit)','HLG (1,000 nit display)'),f:v=>hlgE(v,1000),col:'#5DB67F',k:'g'}];
const BANDS=[[0,1],[1,10],[10,100],[100,1000],[1000,10001]];
const BCOL=['rgba(255,151,46,.2)','rgba(255,151,46,.4)','rgba(255,151,46,.62)','rgba(255,151,46,.82)','#FF972E'];
function shares(f){
 const c=[0,0,0,0,0];
 for(let i=0;i<=1023;i++){const L=f(i/1023);const k=L<1?0:L<10?1:L<100.0001?2:L<1000.0001?3:4;c[k]++}
 return c.map(v=>v/1024);
}
const SH=FN.map(f=>shares(f.f));
const bl=['< 1','1–10','10–100','100–1 000','1 000–10 000'];
OUT.cv=()=>`<b>${nf(S.code/1023*100,1)} %</b> · ${tx('kód','code')} ${S.code}`;
OUT.rd2=()=>{const v=S.code/1023;return FN.map(f=>`<span><i class="k" style="background:${f.col}"></i>${f.n.split(' (')[0]}</span><b>${nits(f.f(v))} nit</b>`).join('')};
OUT.pqnote=()=>{const v=S.code/1023,L=pqE(v);return tx(`U PQ znamená signál ${nf(v*100,1)} % vždy přibližně ${nits(L)} nit, na jakékoli TV. U gama a HLG je to jen podíl z vrcholu displeje.`,`With PQ, a signal of ${nf(v*100,1)} % always means about ${nits(L)} nit, on any TV. With gamma and HLG it is only a share of the display peak.`)};
OUT.pqhalf=()=>tx(`Pod 100 nit leží u PQ ${pct(SH[1][0]+SH[1][1]+SH[1][2],0)} kódů, u gama 100 %. PQ tedy rozděluje kódy podle toho, jak oko vnímá jas, ne podle fyziky.`,`Under 100 nit PQ spends ${pct(SH[1][0]+SH[1][1]+SH[1][2],0)} of its codes, gamma 100 %. PQ allocates codes the way the eye perceives brightness, not the way physics scales.`);
TABS.push({name:tx('Přenosová funkce','Transfer function'),side:'27rem',
 build(){
  return `<div class="split"><div class="col">
   <div class="scope grow"><canvas id="c2"></canvas>
    <div class="tag">${FN.map(f=>`<span><i class="${f.k}"></i>${f.n}</span>`).join('')}</div>
    <div class="badge">${tx('signál (kód 0–1023) → jas displeje','signal (code 0–1023) → display luminance')}</div></div>
   <div class="card" style="padding:.75rem 1rem;display:flex;flex-direction:column;gap:.45rem">
    <div class="lbl">${tx('Kam padnou kódové hodnoty (podíl z 1 024 kódů)','Where the code values land (share of 1,024 codes)')}</div>
    ${FN.map((f,i)=>`<div class="brow"><div class="nm">${f.n.split(' (')[0]}<small>${i==0?tx('do 100 nit','up to 100 nit'):i==1?tx('do 10 000 nit','up to 10,000 nit'):tx('do 1 000 nit','up to 1,000 nit')}</small></div><div class="band">${SH[i].map((s,j)=>s>0?`<i style="width:${s*100}%;background:${BCOL[j]}">${s>.07?nf(s*100,0)+' %':''}</i>`:'').join('')}</div></div>`).join('')}
    <div class="legend"><span>${tx('jas v nitech:','luminance in nits:')}</span>${bl.map((b,j)=>`<span><i style="background:${BCOL[j]}"></i>${b}</span>`).join('')}</div>
   </div></div>
   <div class="side card">
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Osa jasu','Luminance axis')}</span></div>
     <div class="chips g3"><button class="chip" data-k="ysc" data-v="lin10k">${tx('Lin. 10 000','Lin. 10,000')}</button><button class="chip" data-k="ysc" data-v="lin1k">${tx('Lin. 1 000','Lin. 1,000')}</button><button class="chip" data-k="ysc" data-v="log">${tx('Logaritmická','Logarithmic')}</button></div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Sonda: úroveň signálu','Probe: signal level')}</span><span class="val" data-o="cv"></span></div>
     <input type="range" data-k="code" min="0" max="1023" step="1">
     <div class="chips g4">${[[256,'25 %'],[512,'50 %'],[768,'75 %'],[1023,'100 %']].map(a=>`<button class="chip" data-k="code" data-v="${a[0]}">${a[1]}</button>`).join('')}</div></div>
    <div class="rd" data-o="rd2"></div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%;margin:.1rem 0">
    <div class="callout"><b class="l">${tx('PQ je absolutní','PQ is absolute')}</b><span data-o="pqnote"></span></div>
    <div class="callout"><b class="l">${tx('Proč nová křivka','Why a new curve')}</b><span data-o="pqhalf"></span></div>
    <div class="callout" style="margin-top:auto"><b class="l">HLG</b>${tx('Hybrid Log-Gamma je relativní jako gama a bez metadat. Hodí se do živého vysílání a nahoře se chová jako logaritmus.','Hybrid Log-Gamma is relative like gamma and needs no metadata. It suits live broadcast and behaves like a logarithm at the top.')}</div>
   </div></div>`;
 },
 init(){drag($('#c2'),p=>{const R=REM(),x0=R*3.6,x1=p.w-R*1.6;S.code=Math.round(clamp((p.x-x0)/(x1-x0),0,1)*1023);refresh()})},
 render(){
  const cv=$('#c2');if(!cv)return;
  const {x,w,h,R}=setup(cv);
  const x0=R*3.6,x1=w-R*1.6,y0=R*3.4,y1=h-R*2.6;
  const mode=S.ysc,lo=mode==='log'?1e-3:0,hi=mode==='lin1k'?1000:10000;
  const X=c=>x0+c/1023*(x1-x0);
  const Y=L=>mode==='log'?lg(Math.max(L,lo),lo,hi,y1,y0):y1-clamp(L/hi,0,2)*(y1-y0);
  // mřížka
  for(let c=0;c<=1023;c+=1023/4){line(x,X(c),y0,X(c),y1,GR,1);T(x,nf(c/1023*100)+' %',X(c),y1+R*1,R*.74,TXT,'center')}
  if(mode==='log'){for(let p=-3;p<=4;p++){const py=Y(10**p);line(x,x0,py,x1,py,p%1?GR:GR2,1);T(x,fL(10**p),x0-R*.6,py,R*.74,TXT,'right')}}
  else{const st=mode==='lin1k'?200:2000;for(let L=0;L<=hi;L+=st){const py=Y(L);line(x,x0,py,x1,py,GR2,1);T(x,nf(L),x0-R*.6,py,R*.74,TXT,'right')}}
  line(x,x0,y1,x1,y1,GR2,1.2);line(x,x0,y0,x0,y1,GR2,1.2);
  TH(x,tx('jas [nit]','luminance [nit]'),x0-R*2.9,y0-R*1.5,R*.72,TXT);
  TH(x,tx('úroveň signálu','signal level'),x1,y1+R*2,R*.72,TXT,'right');
  // referenční čáry 100 a 1000
  [[100,'SDR 100 nit'],[1000,tx('HLG 1 000 nit','HLG 1,000 nit')]].forEach(r=>{if(mode==='lin1k'&&r[0]>1000)return;const py=Y(r[0]);line(x,x0,py,x1,py,'rgba(244,241,234,.28)',1,[4,5]);TH(x,r[1],x1-R*.4,py-R*.6,R*.68,TXT,'right')});
  // křivky
  x.save();x.beginPath();x.rect(x0,y0-2,x1-x0,y1-y0+4);x.clip();
  FN.forEach(f=>{
   x.beginPath();x.strokeStyle=f.col;x.lineWidth=R*.2;x.lineJoin='round';let st=false;
   for(let i=0;i<=320;i++){const c=i/320*1023,L=f.f(c/1023);if(mode==='log'&&L<lo){st=false;continue}const px=X(c),py=Y(L);if(!st){x.moveTo(px,py);st=true}else x.lineTo(px,py)}
   x.stroke();
  });
  x.restore();
  // sonda
  const px=X(S.code);line(x,px,y0,px,y1,'rgba(244,241,234,.55)',1.2,[3,4]);
  const v=S.code/1023;
  FN.forEach(f=>{const L=f.f(v);if(mode==='log'&&L<lo)return;const py=Y(L);if(py<y0-2)return;dot(x,px,py,R*.42,'#17140F');dot(x,px,py,R*.3,f.col)});
  const lx=px>x1-R*9?px-R*.8:px+R*.8,al=px>x1-R*9?'right':'left';
  FN.forEach((f,i)=>{const L=f.f(v);TH(x,nits(L)+' nit',lx,y1-R*(1.3+i*1.45),R*.85,f.col,al)});
 }});
})();

<script>
/* ===== 3 Bity a banding ===== */
(function(){
const REG={dark:[.04,.14],mid:[.40,.50],bright:[.80,.90]};
const stepPQ=(L,N)=>{const M=2**N-1,c=clamp(pqI(L)*M,1e-3,M-1);return pqE((c+1)/M)/pqE(c/M)-1};
const stepG=(L,N)=>{const M=2**N-1,c=clamp(gamI(L,100)*M,1e-3,M-1);return Math.pow((c+1)/c,2.4)-1};
const Lp=()=>Math.pow(10,-3+7*S.pr3);
const rng=()=>{const M=2**S.bits-1;if(!S.lupa)return REG[S.reg];const v=pqI(Lp()),h=Math.min(12/M,.5),a=clamp(v-h,0,1-2*h);return [a,a+2*h]};
const lv=()=>{const [a,b]=rng(),M=2**S.bits-1;return Math.max(1,Math.floor(b*M)-Math.ceil(a*M)+1)};
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let off=null;
OUT.lv=()=>{const n=lv(),[a,b]=rng();return `<b>${nf(n)}</b> ${tx(n===1?'odstín':n<5?'odstíny':'odstínů',n===1?'shade':'shades')}`};
OUT.lv2=()=>{const n=lv(),[a,b]=rng();return tx(`V úseku signálu ${nf(a*100,1)}–${nf(b*100,1)} % je při ${S.bits} bitech jen ${nf(n)} odstínů, krok je ${nf(100/(2**S.bits-1),3)} % celého rozsahu signálu.`,`In the signal range ${nf(a*100,1)}–${nf(b*100,1)} % there are only ${nf(n)} shades at ${S.bits} bits; one step is ${nf(100/(2**S.bits-1),3)} % of the full signal range.`)};
OUT.pl=()=>`<b>${nits(Lp())}</b> nit`;
OUT.rd3=()=>{const L=Lp();return `<span><i class="k" style="background:#FF972E"></i>PQ · ${S.bits} bit</span><b>${pct(stepPQ(L,S.bits),2)}</b><span><i class="k" style="background:#BDB6A7"></i>${tx('Gama · ','Gamma · ')}${S.bits} bit</span><b>${L<=100?pct(stepG(L,S.bits),2):tx('mimo (>100 nit)','n/a (>100 nit)')}</b>`};
OUT.why=()=>tx(`PQ potřebuje pokrýt 10 000 nit. Při 10 bitech je krok ve světlech kolem ${nf(stepPQ(1000,10)*100,2)} %, tedy těsně u hranice viditelnosti. Proto se HDR distribuuje s 10 bity a Dolby Vision počítá až s 12.`,`PQ has to cover 10,000 nit. At 10 bits the step in the highlights is about ${nf(stepPQ(1000,10)*100,2)} %, right at the edge of visibility. That is why HDR is delivered in 10 bits and Dolby Vision allows up to 12.`);
TABS.push({name:tx('Bity a banding','Bits and banding'),side:'27rem',
 build(){
  return `<div class="split"><div class="col">
   <div class="scope" style="flex:1 1 0"><canvas id="c3a"></canvas>
    <div class="tag"><span>${tx('Plynulý přechod, kvantovaný na zvolený počet bitů','A smooth gradient, quantised to the chosen bit depth')}</span></div>
    <div class="badge" data-o="lv"></div></div>
   <div class="scope" style="flex:1.1 1 0"><canvas id="c3b"></canvas>
    <div class="tag"><span><i></i>${tx('PQ, zvolená hloubka','PQ, chosen depth')}</span><span><i class="a"></i>${tx('Gama 2,4','Gamma 2.4')}</span><span><i class="w"></i>${tx('PQ 8, 10, 12 b','PQ 8, 10, 12 b')}</span></div>
    <div class="badge">${tx('krok jasu mezi sousedními kódy','luminance step between neighbouring codes')}</div></div>
   </div>
   <div class="side card">
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Bitová hloubka','Bit depth')}</span></div>
     <div class="chips g4">${[6,8,10,12].map(v=>`<button class="chip" data-k="bits" data-v="${v}">${v} b</button>`).join('')}</div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Úsek signálu (skok sondy)','Signal range (jump probe)')}</span></div>
     <div class="chips g3"><button class="chip" data-k="reg" data-v="dark">${tx('Stíny','Shadows')}</button><button class="chip" data-k="reg" data-v="mid">${tx('Středy','Mids')}</button><button class="chip" data-k="reg" data-v="bright">${tx('Světla','Highlights')}</button></div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Lupa na kontrast','Contrast magnifier')}</span></div>
     <div class="seg"><button class="chip" data-k="lupa" data-v="true">${tx('Zapnuto','On')}</button><button class="chip" data-k="lupa" data-v="false">${tx('Vypnuto','Off')}</button></div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Rozptyl (dithering)','Dithering')}</span></div>
     <div class="seg"><button class="chip" data-k="dith" data-v="false">${tx('Bez','Off')}</button><button class="chip" data-k="dith" data-v="true">${tx('S rozptylem','On')}</button></div></div>
    <div class="callout"><b class="l">${tx('Co vidíš','What you see')}</b><span data-o="lv2"></span> ${tx('Lupa roztáhne okolí sondy (posuvník níže nebo graf kroků) přes celou stupnici, aby šly kroky vidět i na 8bitovém monitoru.','The magnifier stretches the neighbourhood of the probe (slider below or the step chart) across the whole scale so steps show even on an 8-bit monitor.')}</div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Sonda: jas','Probe: luminance')}</span><span class="val" data-o="pl"></span></div>
     <input type="range" data-k="pr3" min="0" max="1" step="0.002">
     <div class="rd" data-o="rd3"></div></div>
    <div class="callout" style="margin-top:auto"><b class="l">${tx('Proč 10 bitů','Why 10 bits')}</b><span data-o="why"></span></div>
   </div></div>`;
 },
 init(){
  drag($('#c3b'),p=>{const R=REM(),x0=R*3.8,x1=p.w-R*1.6;S.pr3=clamp((p.x-x0)/(x1-x0),0,1);refresh()});
  off=document.createElement('canvas');
  $$('[data-k=reg]').forEach(b=>b.addEventListener('click',()=>{const c={dark:.09,mid:.45,bright:.85}[b.dataset.v];S.pr3=clamp((log10(pqE(c))+3)/7,0,1);refresh()}));
 },
 render(){
  /* --- pruh přechodu --- */
  let cv=$('#c3a');if(!cv)return;
  let {x,w,h,R}=setup(cv);
  const [a,b]=rng(),M=2**S.bits-1,vp=pqI(Lp());
  const sx=R*2.2,sw=Math.round(w-R*4.4),sy=R*3.2,sh=Math.round(h-R*6.8);
  if(sw>10&&sh>10){
   off.width=sw;off.height=sh;const ox=off.getContext('2d'),im=ox.createImageData(sw,sh),d=im.data,rnd=mul(5);
   for(let j=0;j<sh;j++)for(let i=0;i<sw;i++){
    const v=a+(b-a)*i/(sw-1);let u=v*M;
    if(S.dith)u+=rnd()+rnd()-1;
    const q=clamp(Math.round(u),0,M)/M;
    const g=S.lupa?clamp((q-a)/(b-a),0,1):q;
    const k=(j*sw+i)*4,c=Math.round(g*255);d[k]=d[k+1]=d[k+2]=c;d[k+3]=255;
   }
   ox.putImageData(im,0,0);x.imageSmoothingEnabled=false;x.drawImage(off,sx,sy,sw,sh);
   x.strokeStyle='rgba(244,241,234,.25)';x.lineWidth=1;x.strokeRect(sx,sy,sw,sh);
   // značky hranic stupňů
   const n=lv();if(n<=70){for(let k=Math.ceil(a*M);k<=Math.floor(b*M);k++){const px=sx+((k/M-a)/(b-a))*sw;line(x,px,sy+sh,px,sy+sh+R*.7,C.orange,1.4)}}
   T(x,tx('signál ','signal ')+nf(a*100,S.lupa?1:0)+' %',sx,sy+sh+R*1.6,R*.8,TXT,'left');
   T(x,nf(b*100,S.lupa?1:0)+' %',sx+sw,sy+sh+R*1.6,R*.8,TXT,'right');
   if(S.lupa&&vp>=a&&vp<=b){const px=sx+((vp-a)/(b-a))*sw;line(x,px,sy-R*.5,px,sy,C.orange,2);x.fillStyle=C.orange;x.beginPath();x.moveTo(px-R*.45,sy-R*.9);x.lineTo(px+R*.45,sy-R*.9);x.lineTo(px,sy-R*.45);x.fill();T(x,nits(Lp())+' nit',px,sy-R*1.5,R*.8,C.orange,'center')}
   T(x,tx(S.lupa?'lupa sleduje sondu: zvětšený okolní úsek signálu':'lupa vypnuta: jas tak, jak ho zobrazí monitor','magnifier '+(S.lupa?'follows the probe: enlarged neighbourhood':'off: shown as the monitor would')),sx+sw/2,sy+sh+R*1.6,R*.8,TXT,'center');
  }
  /* --- graf kroků --- */
  cv=$('#c3b');
  ({x,w,h,R}=setup(cv));
  const x0=R*3.8,x1=w-R*1.6,y0=R*3.4,y1=h-R*2.6;
  const LA=1e-3,LB=1e4,YA=.001,YB=1;
  const X=L=>lg(L,LA,LB,x0,x1),Y=r=>lg(clamp(r,YA,YB),YA,YB,y1,y0);
  for(let p=-3;p<=4;p++){const px=X(10**p);line(x,px,y0,px,y1,GR2,1);T(x,fL(10**p),px,y1+R*1,R*.74,TXT,'center')}
  [.001,.01,.1,1].forEach(r=>{const py=Y(r);line(x,x0,py,x1,py,GR2,1);T(x,nf(r*100,r<.01?1:0)+' %',x0-R*.6,py,R*.74,TXT,'right')});
  TH(x,tx('jas [nit]','luminance [nit]'),x1,y1+R*2,R*.72,TXT,'right');
  TH(x,tx('krok','step'),x0-R*3.1,y0-R*1.5,R*.72,TXT);
  // hranice viditelnosti
  const py1=Y(.01);x.fillStyle='rgba(255,106,77,.1)';x.fillRect(x0,y0,x1-x0,py1-y0);
  line(x,x0,py1,x1,py1,C.bad,1.4,[6,5]);TH(x,tx('nad čarou je krok vidět jako pruh (hranice ≈ 1 %, orientačně)','above the line a step shows as a band (threshold ≈ 1 %, approximate)'),x1-R*.5,y0+R*1,R*.72,C.bad,'right');
  const curve=(fn,col,lw,lo,hi,dash)=>{x.beginPath();x.strokeStyle=col;x.lineWidth=lw;x.setLineDash(dash||[]);let st=false;
   for(let i=0;i<=300;i++){const L=Math.pow(10,log10(lo)+(log10(hi)-log10(lo))*i/300),r=fn(L);if(!isFinite(r)){st=false;continue}const px=X(L),py=Y(r);if(!st){x.moveTo(px,py);st=true}else x.lineTo(px,py)}
   x.stroke();x.setLineDash([])};
  x.save();x.beginPath();x.rect(x0,y0-1,x1-x0,y1-y0+2);x.clip();
  [8,10,12].forEach(n=>{if(n!==S.bits)curve(L=>stepPQ(L,n),'rgba(244,241,234,.35)',R*.1,LA,LB)});
  curve(L=>stepG(L,S.bits),C.analog,R*.2,LA,100);
  curve(L=>stepPQ(L,S.bits),C.orange,R*.24,LA,LB);
  x.restore();
  [8,10,12].forEach(n=>{if(n!==S.bits){const r=stepPQ(LB*.999,n);TH(x,n+' b',x1-R*.3,Y(r)-R*.55,R*.66,'rgba(244,241,234,.55)','right')}});
  const L=Lp(),px=X(L);line(x,px,y0,px,y1,'rgba(244,241,234,.55)',1.2,[3,4]);
  dot(x,px,Y(stepPQ(L,S.bits)),R*.4,C.orange);if(L<=100)dot(x,px,Y(stepG(L,S.bits)),R*.4,C.analog);
 }});
})();

<script>
/* ===== 4 Barvy ===== */
(function(){
/* spektrální křivka CIE 1931 (2°), vlnové délky po 10 nm: [nm, x, y] */
const LOC=[[380,.1741,.005],[390,.1738,.0049],[400,.1733,.0048],[410,.1726,.0048],[420,.1714,.0051],[430,.1689,.0069],[440,.1644,.0109],[450,.1566,.0177],[460,.144,.0297],[470,.1241,.0578],[480,.0913,.1327],[490,.0454,.295],[500,.0082,.5384],[510,.0139,.7502],[520,.0743,.8338],[530,.1547,.8059],[540,.2296,.7543],[550,.3016,.6923],[560,.3731,.6245],[570,.4441,.5547],[580,.5125,.4866],[590,.5752,.4242],[600,.627,.3725],[610,.6658,.334],[620,.6915,.3083],[630,.7079,.292],[640,.719,.2809],[650,.726,.274],[660,.73,.27],[670,.732,.268],[680,.7334,.2666],[690,.7344,.2656],[700,.7347,.2653]];
const GM=[
 {id:'709',n:'BT.709 (SDR, sRGB)',p:[[.64,.33],[.30,.60],[.15,.06]],col:'#F4F1EA',dash:[2,5],w:2},
 {id:'P3',n:tx('DCI-P3 (kino, D65)','DCI-P3 (cinema, D65)'),p:[[.68,.32],[.265,.69],[.15,.06]],col:'#FF972E',dash:[9,5],w:2.4},
 {id:'2020',n:tx('BT.2020 (UHD, HDR)','BT.2020 (UHD, HDR)'),p:[[.708,.292],[.170,.797],[.131,.046]],col:'#7DB8FF',dash:[],w:2.6}];
const W65=[.3127,.3290];
const area=p=>Math.abs(p[0][0]*(p[1][1]-p[2][1])+p[1][0]*(p[2][1]-p[0][1])+p[2][0]*(p[0][1]-p[1][1]))/2;
const AR=GM.map(g=>area(g.p)/area(GM[0].p));
function inPoly(px,py,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const xi=P[i][1],yi=P[i][2],xj=P[j][1],yj=P[j][2];if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))c=!c}return c}
function inTri(px,py,p){const d=(a,b,c)=>(a[0]-c[0])*(b[1]-c[1])-(b[0]-c[0])*(a[1]-c[1]);const q=[px,py],d1=d(q,p[0],p[1]),d2=d(q,p[1],p[2]),d3=d(q,p[2],p[0]);return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0))}
const M709=[[3.2404542,-1.5371385,-0.4985314],[-0.969266,1.8760108,0.041556],[0.0556434,-0.2040259,1.0572252]];
const M2020=[[1.7166512,-0.3556708,-0.2533663],[-0.6666844,1.6164812,0.0157685],[0.0176399,-0.0427706,0.9421031]];
const mv=(M,v)=>M.map(r=>r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);
const sRGBe=v=>{v=clamp(v,0,1);return v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055};
const b2020e=v=>{v=clamp(v,0,1);return v<.018053968510807?4.5*v:1.09929682680944*Math.pow(v,.45)-.09929682680944};
let fill=null;
function buildFill(){
 const Wd=400,Ht=450,cv=document.createElement('canvas');cv.width=Wd;cv.height=Ht;
 const c=cv.getContext('2d'),im=c.createImageData(Wd,Ht),d=im.data;
 for(let j=0;j<Ht;j++)for(let i=0;i<Wd;i++){
  const xx=(i+.5)/Wd*.8,yy=(1-(j+.5)/Ht)*.9,k=(j*Wd+i)*4;
  if(yy<.004||!inPoly(xx,yy,LOC)){d[k+3]=0;continue}
  const X=xx/yy,Z=(1-xx-yy)/yy,l=mv(M709,[X,1,Z]).map(v=>Math.max(0,v)),m=Math.max(l[0],l[1],l[2])||1;
  d[k]=Math.round(sRGBe(l[0]/m)*255);d[k+1]=Math.round(sRGBe(l[1]/m)*255);d[k+2]=Math.round(sRGBe(l[2]/m)*255);d[k+3]=255;
 }
 c.putImageData(im,0,0);return cv;
}
const wide=()=>{try{return CSS.supports('color','color(rec2020 0 0 0)')}catch(e){return false}};
function swatch(x,y){
 const XYZ=[x/y,1,(1-x-y)/y],l2=mv(M2020,XYZ),mx=Math.max(l2[0],l2[1],l2[2]),s=mx>0?.7/mx:1,t=XYZ.map(v=>v*s);
 const a=mv(M2020,t),b=mv(M709,t);
 const sr=`rgb(${b.map(v=>Math.round(sRGBe(v)*255)).join(',')})`;
 const wr=wide()?`color(rec2020 ${a.map(v=>b2020e(v).toFixed(4)).join(' ')})`:sr;
 return{wr,sr};
}
function dseg(px,py,a,b){const dx=b[1]-a[1],dy=b[2]-a[2],t=clamp(((px-a[1])*dx+(py-a[2])*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(px-(a[1]+t*dx),py-(a[2]+t*dy))}
const inLoc=(x,y)=>inPoly(x,y,LOC)||LOC.some((q,i)=>i&&dseg(x,y,LOC[i-1],q)<.006);
OUT.xy=()=>`x = <b>${nf(S.cx,3)}</b> · y = <b>${nf(S.cy,3)}</b>`;
OUT.rd4=()=>{
 if(!inLoc(S.cx,S.cy))return `<span style="grid-column:1/3">${tx('Tohle už není viditelná barva: leží mimo podkovu.','This is not a visible colour: it lies outside the horseshoe.')}</span>`;

  const a=RES.map(r=>r?pct(r.dim,0):'');
  const dm=RES.map(r=>r.dim),same=Math.max(...dm)-Math.min(...dm)<.005;
  $('#sum5').innerHTML=`<b class="l">${tx('Výsledek na této TV','Result on this TV')}</b>`+(same?tx(`TV s vrcholem ${nf(Ld)} nit: všechny tři metody dopadly stejně (statická ${a[0]}, HDR10+ ${a[1]}, Dolby Vision ${a[2]}). Metadata se tu neliší, protože tato scéna nebo snímek dosahuje nejvyššího jasu filmu, nebo se vejde do možností TV.`,`TV with a ${nf(Ld)} nit peak: all three methods came out the same (static ${a[0]}, HDR10+ ${a[1]}, Dolby Vision ${a[2]}). The metadata does not differ here because this scene or frame reaches the film’s peak, or fits within the TV.`):tx(`TV s vrcholem ${nf(Ld)} nit: statická metadata zbytečně ztmavila ${a[0]} obrazu, HDR10+ ${a[1]} a Dolby Vision ${a[2]}. Dynamická metadata nic nepřidávají, jen neříkají TV, že film dosahuje ${nf(rr(MAXCLL))} nit.`,`TV with a ${nf(Ld)} nit peak: static metadata needlessly dimmed ${a[0]} of the picture, HDR10+ ${a[1]} and Dolby Vision ${a[2]}. Dynamic metadata adds nothing; it just stops claiming the film reaches ${nf(rr(MAXCLL))} nit.`));
  curve(img,s,f);timeline();
  sync();
 }});
function curve(img,s,f){
 const cv=$('#c5c');if(!cv)return;
 const {x,w,h,R}=setup(cv),Ld=S.tvp;
 const x0=R*3.6,x1=w-R*1.4,y0=R*4.2,y1=h-R*2.8,A=.1,B=5000;
 const X=L=>lg(L,A,B,x0,x1),Y=L=>lg(Math.max(L,A),A,B,y1,y0);
 for(let p=-1;p<=3;p++)[1,3].forEach(m=>{const L=10**p*m;if(L<A||L>B)return;if(m===3&&p>2)return;const px=X(L),py=Y(L);line(x,px,y0,px,y1,m===1?GR2:GR,1);line(x,x0,py,x1,py,m===1?GR2:GR,1);if(m===1){T(x,fL(L),px,y1+R*1,R*.72,TXT,'center');T(x,fL(L),x0-R*.6,py,R*.72,TXT,'right')}});
 line(x,x0,y1,x1,y1,GR2,1.2);line(x,x0,y0,x0,y1,GR2,1.2);
 TH(x,tx('vstup [nit]','input [nit]'),x1,y1+R*2,R*.72,TXT,'right');TH(x,tx('výstup [nit]','output [nit]'),x0-R*3,y0-R*1.1,R*.72,TXT);
 // histogram snímku
 const nb=56,hist=new Float32Array(nb);for(let i=0;i<img.length;i++){const b=Math.floor((log10(img[i])-log10(A))/(log10(B)-log10(A))*nb);if(b>=0&&b<nb)hist[b]++}
 const hm=Math.max(...hist);x.fillStyle='rgba(244,241,234,.16)';hist.forEach((c,i)=>{const bx=x0+i/nb*(x1-x0),bh=Math.sqrt(c/hm)*(y1-y0)*.34;x.fillRect(bx,y1-bh,(x1-x0)/nb-1,bh)});
 T(x,tx('rozložení jasu v tomto snímku','luminance in this frame'),x0+R*.4,y1-R*.8,R*.68,'rgba(244,241,234,.5)');
 line(x,x0,Y(A),x1,Y(B),'rgba(244,241,234,.25)',1,[4,5]);
 // TV vrchol a vrchol snímku
 line(x,x0,Y(Ld),x1,Y(Ld),C.good,1.5,[3,4]);TH(x,tx('vrchol TV ','TV peak ')+nf(Ld)+' nit',x0+R*.5,Y(Ld)-R*.7,R*.72,C.good);
 const pk=PK[s][f];line(x,X(pk),y0,X(pk),y1,'rgba(244,241,234,.5)',1.2,[2,4]);TH(x,tx('vrchol snímku','frame peak'),X(pk)-R*.4,y0+R*.8,R*.68,TXT,'right');
 // křivky
 [METH[0],METH[1],METH[2]].forEach((m,mi)=>{
  const Lw=m.Lw(s,f);x.beginPath();x.strokeStyle=m.col;x.lineWidth=R*(mi===0?.28:mi===1?.2:.13);x.lineJoin='round';let st=false;
  for(let i=0;i<=240;i++){const L=Math.pow(10,log10(A)+(log10(B)-log10(A))*i/240),o=Lw<=Ld?Math.min(L,Ld):eetf(L,Lw,Ld),px=X(L),py=Y(Math.min(o,L));if(L>Lw&&Lw<=Ld)break;if(!st){x.moveTo(px,py);st=true}else x.lineTo(px,py)}
  x.stroke();
 });
}
function timeline(){
 const cv=$('#c5t');if(!cv)return;
 const {x,w,h,R}=setup(cv),Ld=S.tvp,n=NS*NF;
 const x0=R*1.4,x1=w-R*1.2,y0=R*4.4,y1=h-R*1.8,A=1,B=5000;
 const X=i=>x0+i/n*(x1-x0),Y=L=>lg(Math.max(L,A),A,B,y1,y0);
 [1,10,100,1000].forEach(L=>{const py=Y(L);line(x,x0,py,x1,py,GR2,1);T(x,nf(L),x0+R*.2,py-R*.6,R*.66,'rgba(244,241,234,.45)')});
 // plocha: vrchol snímku
 x.beginPath();x.moveTo(X(0),y1);for(let i=0;i<n;i++){const L=PK[Math.floor(i/NF)][i%NF];x.lineTo(X(i),Y(L));x.lineTo(X(i+1),Y(L))}x.lineTo(X(n),y1);x.closePath();x.fillStyle='rgba(244,241,234,.13)';x.fill();
 // průměr snímku
 x.beginPath();for(let i=0;i<n;i++){const L=AV[Math.floor(i/NF)][i%NF];const py=Y(L);i?x.lineTo(X(i),py):x.moveTo(X(i),py);x.lineTo(X(i+1),py)}x.strokeStyle='rgba(244,241,234,.4)';x.lineWidth=1;x.stroke();
 // oddělovače scén
 for(let s=0;s<NS;s++){const px=X(s*NF);if(s)line(x,px,y0-R*.8,px,y1,GR2,1);TH(x,SCN[s].sn,px+R*.35,y0-R*1.5,R*.66,s===S.sc?C.cream:'rgba(244,241,234,.5)')}
 // Lw
 x.lineJoin='round';
 line(x,x0,Y(MAXCLL),x1,Y(MAXCLL),METH[0].col,R*.26,[R*.7,R*.4]);
 x.beginPath();x.strokeStyle=METH[1].col;x.lineWidth=R*.2;for(let s=0;s<NS;s++){const py=Y(SMAX[s]);x.moveTo(X(s*NF),py);x.lineTo(X((s+1)*NF),py)}x.stroke();
 x.beginPath();x.strokeStyle=METH[2].col;x.lineWidth=R*.13;for(let i=0;i<n;i++){const L=PK[Math.floor(i/NF)][i%NF],py=Y(L);i?x.lineTo(X(i),py):x.moveTo(X(i),py);x.lineTo(X(i+1),py)}x.stroke();
 line(x,x0,Y(Ld),x1,Y(Ld),C.good,1.5,[3,4]);
 // kurzor
 const ci=S.sc*NF+S.fr,cx=X(ci+.5);line(x,cx,y0-R*.8,cx,y1,C.cream,1.6);dot(x,cx,Y(PK[S.sc][S.fr]),R*.38,C.cream);
 T(x,tx('Lw = referenční maximum, které TV dostane v metadatech · klepni a vyber snímek','Lw = the reference maximum the TV receives in the metadata · tap to pick a frame'),x1,y1+R*.95,R*.68,TXT,'right');
}
})();
</script>

<script>
/* ===== Nápověda a štítek PLUS ===== */
(function(){
const H=[
{t:tx('Světlo a jas','Light and nits'),
 a:tx('Jas se měří v <b>nitech</b> (1 nit = 1 cd/m², svítivost na plochu). Oko zvládne rozsah mnoha řádů, od hvězdného světla po slunce, a dokáže ho vnímat zhruba logaritmicky. Proto je osa v aplikaci logaritmická: každý řádek žebříku je desetkrát jasnější než ten pod ním.','Luminance is measured in <b>nits</b> (1 nit = 1 cd/m², light intensity per area). The eye copes with many orders of magnitude, from starlight to the sun, and perceives them roughly logarithmically. That is why the axis here is logarithmic: every rung is ten times brighter than the one below.'),
 b:tx('SDR se masteruje pro jas kolem 100 nit a černou blízko nuly. HDR (High Dynamic Range) rozšiřuje rozsah nahoru až k 10 000 nit v signálu a umožňuje současně tmavé stíny a oslnivé odlesky. Skutečné televize dnes dosahují řádově stovek až tisíců nit, OLED má černou téměř dokonalou, LCD s lokálním stmíváním (Mini-LED) vyšší vrchol.','SDR is mastered for about 100 nit with black near zero. HDR (High Dynamic Range) extends the signal up to 10,000 nit and allows deep shadows and dazzling highlights at the same time. Real TVs today reach hundreds to thousands of nits; OLED has near-perfect black, LCD with local dimming (Mini-LED) a higher peak.'),
 c:[tx('Přepni typ panelu a sleduj efektivní černou a kontrast: LCD má vyšší vrchol, OLED nižší černou.','Switch the panel type and watch effective black and contrast: LCD has the higher peak, OLED the lower black.'),
    tx('Zvyšuj osvětlení místnosti. Odrazy světla zvedají černou, takže i drahý panel ztrácí kontrast.','Raise the room lighting. Reflections lift the black, so even an expensive panel loses contrast.'),
    tx('Sleduj poměr kontrastu a počet clon (EV): ukazuje, kolikrát se jas zdvojnásobí od černé k vrcholu.','Watch the contrast ratio and the number of stops (EV): it shows how many times luminance doubles from black to peak.')],
 d:tx('Kontrast televize není jen údaj z krabice. Rozhoduje poměr vrcholu a černé včetně odrazů v místnosti. HDR vyžaduje ztlumit okolí.','A TV contrast is not just the number on the box. What matters is peak versus black including reflections in the room. HDR calls for a dimmed environment.')},
{t:tx('Přenosová funkce','Transfer function'),
 a:tx('<b>Přenosová funkce</b> převádí číslo v signálu (kód) na jas displeje. Dělení kódů má být takové, aby krok mezi sousedními kódy oko nevidělo jako schod. Klasická <b>gama</b> (BT.1886, přibližně 2,4) vznikla pro jas, který je dnes malý a je relativní: 100 % signálu je vždy vrchol displeje.','The <b>transfer function</b> turns a number in the signal (code) into display luminance. The spacing of codes should keep the step between neighbours below what the eye notices. Classic <b>gamma</b> (BT.1886, about 2.4) was designed for what is by today\'s standards a low luminance and is relative: 100 % signal is always the display peak.'),
 b:tx('<b>PQ</b> (SMPTE ST 2084) je absolutní: kód odpovídá pevnému jasu v nitech na jakékoli televizi a je odvozen od citlivosti oka na kontrast. Používají ho HDR10, HDR10+ i Dolby Vision. <b>HLG</b> (BT.2100, BBC a NHK) je relativní jako gama a nepotřebuje metadata, proto se hodí pro živé vysílání a zůstává zpětně kompatibilní se SDR.','<b>PQ</b> (SMPTE ST 2084) is absolute: a code means a fixed luminance in nits on any TV and is derived from the eye\'s contrast sensitivity. HDR10, HDR10+ and Dolby Vision all use it. <b>HLG</b> (BT.2100, BBC and NHK) is relative like gamma and needs no metadata, so it suits live broadcast and stays backward compatible with SDR.'),
 c:[tx('Přepínej osu na lineární a logaritmickou. V lineární je vidět, jak malá část grafu zbývá stínům.','Switch the axis between linear and logarithmic. In linear you see how little of the graph is left for shadows.'),
    tx('Posouvej sondu a porovnej, kolik nit každá křivka přiřadí stejné úrovni signálu.','Move the probe and compare how many nits each curve assigns to the same signal level.'),
    tx('V pruzích dole sleduj, kolik kódů připadá na jednotlivá pásma jasu.','In the bars below see how many codes land in each luminance band.')],
 e:[tx('<b>Světlo je lineární, oko není.</b> Fyzika světla je jednoduchá: dvojnásobek fotonů je dvojnásobný jas a kamerový snímač to takto také zaznamenává. Oko ale jas nevnímá jako rozdíl, nýbrž jako <b>poměr</b>. Změnu si všimneme, když se jas změní asi o 1 až 2 % své hodnoty (Weberův zákon, orientačně; ve tmě je práh o něco vyšší). Rozdíl 1 nit je při jasu 2 nit obrovský skok, při jasu 1 000 nit nepostřehnutelný. Čtyři nit mezi 100 a 104 nit je stejně viditelné jako 0,04 nit mezi 1 a 1,04 nit.','<b>Light is linear, the eye is not.</b> The physics of light is simple: twice the photons is twice the luminance, and a camera sensor records it that way. But the eye does not perceive luminance as a difference, it perceives a <b>ratio</b>. We notice a change when luminance shifts by about 1 to 2 % of its value (Weber\'s law, approximately; in the dark the threshold is somewhat higher). A difference of 1 nit is a huge jump at 2 nit and imperceptible at 1,000 nit. Four nits between 100 and 104 nit are just as visible as 0.04 nit between 1 and 1.04 nit.'),
 tx('<b>Co by udělalo lineární uložení při 8 bitech.</b> Máme 255 úrovní stejně od sebe vzdálených. Relativní krok mezi sousedními kódy je <b>1 / kód</b>: u kódu 100 je 1 %, u kódu 10 už 10 % a u kódu 2 celých 50 %. Hranice viditelnosti (1 %) se tedy dosáhne až kolem kódu 100, tedy 39 % vrcholového jasu. Všechno tmavší, což je z hlediska vnímání většina obrazu, by mělo viditelné schody. A přitom světla by byla zbytečně jemná: horní polovina jasu (jediná clona, tedy jedno zdvojnásobení) by spotřebovala polovinu všech kódů, 128, a její kroky by měly 0,4 až 0,8 %, což oko nerozliší. Po clonách to vypadá takto: 128, 64, 32, 16, 8, 4, 2 a 1 kód. Spodní tři clony dostanou dohromady 7 kódů. Lineární 8 bitů tak pokryje jen asi 8 clon a stíny rozdrobí na pár hrubých schodů.','<b>What linear storage at 8 bits would do.</b> We have 255 equally spaced levels. The relative step between neighbouring codes is <b>1 / code</b>: at code 100 it is 1 %, at code 10 already 10 % and at code 2 a full 50 %. The visibility limit (1 %) is therefore reached only around code 100, which is 39 % of the peak luminance. Everything darker, which in terms of perception is most of the picture, would show visible steps. And the highlights would be needlessly fine: the upper half of luminance (a single stop, one doubling) would use half of all codes, 128, and its steps would be 0.4 to 0.8 %, which the eye cannot tell apart. Stop by stop it looks like this: 128, 64, 32, 16, 8, 4, 2 and 1 codes. The bottom three stops together get 7 codes. Linear 8 bits thus covers only about 8 stops and breaks the shadows into a few coarse steps.'),
 tx('<b>Kolik bitů by lineární uložení potřebovalo.</b> Pro nejtmavší použitelný odstín musí být krok nejvýše 1 % jeho jasu, takže přibližně platí: <b>počet úrovní ≈ 100 × kontrast</b> (poměr nejjasnějšího a nejtmavšího odstínu). Pro starší SDR s kontrastem asi 100 : 1 je to kolem 10 000 úrovní, tedy 13 až 14 bitů (při tolerantnějším 2 % práhu asi o bit méně, odtud „12 až 14“). Pro kontrast 1 000 : 1 je to asi 17 bitů. U HDR s rozsahem například 0,005 až 10 000 nit, tedy 2 000 000 : 1, by to bylo kolem 28 bitů. To jsou řádové odhady (skutečný práh závisí na jasu, adaptaci oka i šumu), ale ukazují směr: bez zakřivení křivky by se signál nedal rozumně přenášet ani ukládat.','<b>How many bits linear storage would need.</b> For the darkest usable shade the step must be at most 1 % of its luminance, so roughly: <b>number of levels ≈ 100 × contrast</b> (ratio of brightest to darkest shade). For older SDR with a contrast of about 100:1 that is around 10,000 levels, i.e. 13 to 14 bits (about one bit less with a more tolerant 2 % threshold, hence “12 to 14”). For a contrast of 1,000:1 it is about 17 bits. For HDR spanning, say, 0.005 to 10,000 nit, i.e. 2,000,000:1, it would be around 28 bits. These are order-of-magnitude estimates (the real threshold depends on luminance, eye adaptation and noise), but they show the direction: without bending the curve, the signal could not reasonably be transmitted or stored.'),
 tx('<b>Co s tím udělá přenosová funkce.</b> Rozdělí kódy tak, aby byl <b>poměr</b> sousedních úrovní přibližně stejný, ne jejich rozdíl. Příklad u 8 bitů: při jasu 4 % vrcholu má lineární uložení kód 10 a krok 10 %, gama 2,4 má kód asi 66 a krok asi 3,6 %. Při 1 % vrcholu je to u lineárního kódu kolem 39 %, u gamy kolem 6 %. Gama je tedy mnohem lepší, ale u 8 bitů je ve světlech těsně u hranice viditelnosti a ve stínech ji překračuje, proto 8bitové SDR video v tmavých přechodech někdy pruhuje. PQ je navržena tak, aby měla kroky zhruba stejně velké v celém rozsahu až do 10 000 nit; při 10 bitech vycházejí kolem 1 %, tedy těsně u hranice. Přesně to ukazuje graf v kapitole 3.','<b>What the transfer function does about it.</b> It spaces the codes so that the <b>ratio</b> of neighbouring levels is about the same, not their difference. Example at 8 bits: at 4 % of peak luminance linear storage has code 10 and a 10 % step, while gamma 2.4 has code about 66 and a step of about 3.6 %. At 1 % of peak it is about 39 % for linear and about 6 % for gamma. Gamma is far better, but at 8 bits it is only just at the visibility limit in the highlights and exceeds it in the shadows, which is why 8-bit SDR video sometimes bands in dark gradients. PQ is designed to keep steps about equally large across the whole range up to 10,000 nit; at 10 bits they come out around 1 %, right at the limit. This is exactly what the chart in chapter 3 shows.'),
 tx('<b>Jak gama vznikla.</b> Obrazovky s elektronkou CRT nemají lineární odezvu: jas roste přibližně s napětím umocněným na 2,2 až 2,5. To nikdo nevymyslel, byla to vlastnost elektronové trubice. Při zavádění televizního vysílání bylo levnější předem zkreslit signál jednou u kamery (mocninou asi 0,45), než vkládat korekci do milionů přijímačů. Příjemným vedlejším účinkem bylo, že se tím kódy rozdělily podobně jako citlivost oka a šum vysílání ve stínech nebyl tolik vidět. Gama tedy vznikla ze dvou důvodů zároveň: z fyziky trubice a z úspory.','<b>How gamma came about.</b> CRT screens do not respond linearly: luminance grows roughly as voltage raised to the power 2.2 to 2.5. Nobody invented that, it was a property of the electron tube. When television broadcasting was introduced it was cheaper to pre-distort the signal once at the camera (by a power of about 0.45) than to build a correction into millions of receivers. A pleasant side effect was that the codes ended up spaced much like the eye\'s sensitivity, and transmission noise in the shadows was less visible. So gamma has two roots at once: tube physics and savings.'),
 tx('<b>Co se dělo potom.</b> Plochým panelům (LCD, OLED) gama fyzicky není potřeba, ale napodobují ji, aby fungovaly s veškerým dosavadním obsahem. Standard BT.709 (1990) popsal kódování pro kameru, ale odezvu displeje dlouho ponechal nevyjasněnou. Teprve BT.1886 (2011) ji ustálil na gamě 2,4 pro referenční displej asi 100 nit.','<b>What happened next.</b> Flat panels (LCD, OLED) do not need gamma physically, but they imitate it so they work with all existing content. BT.709 (1990) defined the camera encoding but left the display response unspecified for a long time. Only BT.1886 (2011) settled it as gamma 2.4 for a reference display of about 100 nit.'),
 tx('<b>Proč nestačí pro HDR a jak vznikl PQ.</b> Gama byla odvozena pro jas kolem 100 nit a omezenou černou a při rozsahu až 10 000 nit by rozdělovala kódy nevhodně: příliš mnoho do světel, příliš málo do stínů. Inženýři společnosti Dolby proto odvodili novou křivku přímo z měření citlivosti oka na kontrast (Bartenův model) a vznikla <b>PQ</b>, standardizovaná jako SMPTE ST 2084 (2014) a zahrnutá do BT.2100 (2016). <b>HLG</b> vyvinuly v letech 2014 až 2015 BBC a NHK pro živé vysílání, kde nelze posílat metadata a signál musí vypadat rozumně i na starších televizích. Na rozdíl od PQ se proto drží blízko gamy a nahoře se stáčí k logaritmu.','<b>Why it is not enough for HDR and how PQ arose.</b> Gamma was derived for about 100 nit and a limited black, and over a range up to 10,000 nit it would allocate codes badly: too many to the highlights, too few to the shadows. Dolby engineers therefore derived a new curve directly from measurements of the eye\'s contrast sensitivity (the Barten model), and <b>PQ</b> emerged, standardised as SMPTE ST 2084 (2014) and included in BT.2100 (2016). <b>HLG</b> was developed by the BBC and NHK around 2014 to 2015 for live broadcast, where metadata cannot be sent and the signal must look reasonable on older TVs too. Unlike PQ it therefore stays close to gamma and bends towards a logarithm at the top.')],
 d:tx('PQ věnuje většinu kódů pásmu pod 100 nit, tedy tomu, kde je oko nejcitlivější, a zbytek pokrývá až do 10 000 nit.','PQ spends most of its codes below 100 nit, where the eye is most sensitive, and covers the rest up to 10,000 nit.')},
{t:tx('Bity a banding','Bits and banding'),
 a:tx('Signál je uložen v konečném počtu úrovní: 8 bitů dává 256, 10 bitů 1 024, 12 bitů 4 096 úrovní. Když je krok mezi úrovněmi pro oko viditelný, vznikají v plynulých přechodech (obloha, kouř, stín) pruhy neboli <b>banding</b>.','The signal is stored in a finite number of levels: 8 bits give 256, 10 bits 1,024, 12 bits 4,096. When the step between levels is visible, smooth gradients (sky, smoke, shadow) show stripes, known as <b>banding</b>.'),
 b:tx('Oko vidí změnu jasu zhruba od jednoho procenta (Weberův zákon, orientačně). Na grafu kroků proto čára kolem 1 % odděluje bezpečné a viditelné. Při 10 bitech zůstává PQ blízko hranice, u 8 bitů by ji překračoval. Proto se HDR distribuuje s 10 bity a Dolby Vision počítá až s 12. <b>Dithering</b> (rozptyl) přidá do obrazu šum, který pruhy rozbije a oku vrátí plynulý dojem.','The eye notices a luminance change from about one percent (Weber\'s law, approximately). On the step chart a line near 1 % therefore separates safe from visible. At 10 bits PQ stays near the limit, at 8 bits it would cross it. That is why HDR is delivered in 10 bits and Dolby Vision allows up to 12. <b>Dithering</b> adds noise that breaks up the stripes and restores a smooth impression.'),
 c:[tx('Sniž bitovou hloubku na 6 nebo 8 a zapni lupu: okolí sondy se roztáhne přes celý pruh a schody jsou vidět i na obyčejném monitoru. Sondou pohybuj v grafu dole.','Lower the bit depth to 6 or 8 and turn on the magnifier: the neighbourhood of the probe is stretched across the whole strip and steps show even on a plain monitor. Move the probe in the chart below.'),
    tx('Tlačítky Stíny, Středy a Světla přeskoč sondou do jiné části a sleduj, kolik odstínů v okolí zbývá (bez lupy je to celý úsek).','Use the Shadows, Mids and Highlights buttons to jump the probe to another part and see how many shades remain around it (without the magnifier it is the whole range).'),
    tx('Zapni rozptyl a všimni si, že stejný počet úrovní vypadá plynuleji.','Turn dithering on and notice that the same number of levels looks smoother.')],
 d:tx('Více bitů neznamená jasnější obraz, ale jemnější odstupňování. HDR s 8 bity by pruhovalo.','More bits does not mean a brighter picture, only finer gradation. HDR with 8 bits would show banding.')},
{t:tx('Barvy','Colour'),
 a:tx('Barvy popisuje diagram <b>CIE 1931 xy</b>: podkova je rozsah všech barev, které člověk vidí, a trojúhelník ukazuje, co umí zobrazit konkrétní standard. Rohy trojúhelníku jsou tři základní barvy (primáry) displeje.','Colours are described by the <b>CIE 1931 xy</b> diagram: the horseshoe is the range of all colours people see and the triangle shows what a given standard can display. The corners of the triangle are the display\'s three primary colours.'),
 b:tx('SDR používá gamut <b>BT.709</b> (stejné primáry jako sRGB). Digitální kino používá <b>DCI-P3</b> (plocha v diagramu asi 1,36×), HDR formáty ho obvykle nesou v kontejneru <b>BT.2020</b> (asi 1,89×). Kontejner neznamená, že televize pokryje celý prostor: dobré televize dnes zvládají většinu P3 a jen část BT.2020. Barvy mimo možnosti displeje se musí zmenšit (gamut mapping).','SDR uses the <b>BT.709</b> gamut (same primaries as sRGB). Digital cinema uses <b>DCI-P3</b> (about 1.36× the area in the diagram) and HDR formats usually carry it in a <b>BT.2020</b> container (about 1.89×). A container does not mean the TV covers the whole space: good TVs today cover most of P3 and only part of BT.2020. Colours outside the display\'s reach have to be compressed (gamut mapping).'),
 c:[tx('Zapínej a vypínej trojúhelníky a porovnej jejich velikost.','Toggle the triangles and compare their sizes.'),
    tx('Klepni do diagramu a vyber barvu: aplikace řekne, které gamuty ji obsahují.','Tap the diagram to pick a colour: the app says which gamuts contain it.'),
    tx('Sleduj poměry ploch a vzorky nasycených barev, které SDR nezobrazí.','Watch the area ratios and the swatches of saturated colours SDR cannot show.')],
 d:tx('Širší gamut znamená sytější barvy. Na běžném monitoru ho uvidíš jen přibližně, proto jsou vzorky orientační.','A wider gamut means more saturated colours. On an ordinary monitor you see it only approximately, so the swatches are indicative.')},
{t:tx('Metadata','Metadata'),
 a:tx('Televize má nižší vrcholový jas, než na jaký byl film vymaštrován. Musí proto jasy nad svým vrcholem stlačit (<b>tone mapping</b>). K tomu potřebuje vědět, jak jasný film vlastně je. Tuto informaci nesou <b>metadata</b>.','A TV has a lower peak than the film was mastered for. It has to compress luminances above its peak (<b>tone mapping</b>). To do that it needs to know how bright the film actually is. That information is carried by <b>metadata</b>.'),
 b:tx('<b>HDR10</b> má metadata statická: jedna dvojice čísel (MaxCLL a MaxFALL, tedy nejjasnější bod a nejjasnější snímek) platí pro celý film. Když je jediný záblesk 4 000 nit, televize stlačuje i tmavé scény, jako by bylo třeba. <b>HDR10+</b> a <b>Dolby Vision</b> mají metadata dynamická: ta se mění po scénách, případně po snímcích, takže tmavá scéna zůstane téměř nedotčená. V aplikaci jsou oba dynamické formáty zjednodušeny: HDR10+ jako maximum scény, Dolby Vision jako maximum snímku.','<b>HDR10</b> has static metadata: one pair of numbers (MaxCLL and MaxFALL, the brightest point and the brightest frame) holds for the whole film. If a single flash reaches 4,000 nit, the TV compresses even dark scenes as if it were needed. <b>HDR10+</b> and <b>Dolby Vision</b> use dynamic metadata: it changes per scene, or per frame, so a dark scene stays almost untouched. In the app both dynamic formats are simplified: HDR10+ as the scene maximum, Dolby Vision as the frame maximum.'),
 c:[tx('Vyber scénu (třeba zasněžená krajina) a změň vrchol televize. Statická metadata ztmaví větší část obrazu.','Choose a scene (for example the snowy landscape) and change the TV peak. Static metadata dims a larger part of the picture.'),
    tx('Zapni označení zbytečně ztmavených míst: oranžová označuje body, které televize mohla zobrazit věrně, ale stlačila je.','Turn on the marking of needlessly dimmed areas: orange marks points the TV could have shown faithfully but compressed.'),
    tx('Prohlédni si graf s křivkou stlačení a časovou osu filmu, kde je vidět, o co jasnější je statická hodnota než skutečná scéna.','Look at the tone-curve chart and the film timeline to see how much higher the static value is than the actual scene.')],
 d:tx('Dynamická metadata nepřidávají jas. Jen přestávají tvrdit, že film je jasnější, než právě je.','Dynamic metadata adds no brightness. It just stops claiming that the film is brighter than it currently is.')},
{t:tx('Formáty','Formats'),
 a:tx('<b>HDR10</b> je základ: PQ, 10 bitů, BT.2020 a statická metadata, otevřený a povinný pro prakticky každou HDR televizi. <b>HDR10+</b> k němu přidává dynamická metadata a je kompatibilní s HDR10. <b>Dolby Vision</b> je licencovaný formát s dynamickými metadaty a až 12 bity. <b>HLG</b> je určen pro vysílání.','<b>HDR10</b> is the base: PQ, 10 bits, BT.2020 and static metadata, open and supported by practically every HDR TV. <b>HDR10+</b> adds dynamic metadata and is compatible with HDR10. <b>Dolby Vision</b> is a licensed format with dynamic metadata and up to 12 bits. <b>HLG</b> is meant for broadcast.'),
 b:tx('Většina souborů s Dolby Vision (např. profil 8.1) nese i základ HDR10, takže televize bez Dolby Vision zobrazí HDR10. Profil 5 základ nemá a na televizi bez Dolby Vision vypadá fádně, protože se nepřevede. Co televize umí, musí podporovat jak její obrazový procesor, tak aplikace nebo přehrávač.','Most Dolby Vision files (for example profile 8.1) also carry an HDR10 base, so a TV without Dolby Vision shows HDR10. Profile 5 has no base and looks washed out on a TV without Dolby Vision because it is not converted. What the TV can do depends on both its image processor and the app or player.'),
 c:[tx('V simulátoru vyber typ obsahu a zapni či vypni schopnosti televize.','In the simulator choose the content type and turn the TV\'s capabilities on or off.'),
    tx('Sleduj, v jakém formátu se obsah nakonec zobrazí a co se ztratí.','Watch in which format the content is finally shown and what is lost.'),
    tx('Zkus obsah Dolby Vision profil 5 na televizi bez Dolby Vision.','Try Dolby Vision profile 5 content on a TV without Dolby Vision.')],
 d:tx('Zpětná kompatibilita funguje jen tehdy, když soubor základní vrstvu skutečně obsahuje.','Backward compatibility works only if the file really contains the base layer.')}];
let open=false;
function render(){
 const h=H[S.tab]||H[0],last=S.tab>=H.length-1;
 const el=$('#help .dlg');
 el.innerHTML=`<button class="x" data-act="help" aria-label="${tx('Zavřít','Close')}">✕</button>
  <div class="kap">${tx('kap.','ch.')} ${S.tab+1} · ${tx('vysvětlení','explanation')}</div><h2>${h.t}</h2>
  <h3>${tx('Co to je','What it is')}</h3><p>${h.a}</p><p>${h.b}</p>
  ${h.e?`<h3>${tx('Proč přenosová funkce a jak vznikla','Why a transfer function and how it arose')}</h3>${h.e.map(x=>`<p>${x}</p>`).join('')}`:''}<h3>${tx('Co zkusit','What to try')}</h3><ul>${h.c.map(x=>`<li>${x}</li>`).join('')}</ul>
  <h3>${tx('Co si odnést','Takeaway')}</h3><p><b>${h.d}</b></p>
  <div class="pl"><span class="plus" style="margin:0 .4rem 0 0;vertical-align:baseline">PLUS</span>${tx('značí obsah nad rámec učiva přiřazených ročníků. Celá tato aplikace je určena zájemcům o techniku obrazu, ne povinné učivo.','marks content beyond the curriculum of the assigned years. This whole app is meant for those interested in display and image technology, not for required material.')}</div>
  <div class="nav"><button data-act="hnav" data-v="-1">← ${tx('Předchozí kapitola','Previous chapter')}</button><button data-act="hnav" data-v="1">${tx('Další kapitola','Next chapter')} →</button></div>`;
}
ACT.help=()=>{open=!open;const e=$('#help');e.hidden=!open;if(open){render();$('#help .x').focus()}else $('#bHelp').focus()};
ACT.hnav=v=>{go((S.tab+ +v+H.length)%H.length);render();$('#help .dlg').scrollTop=0};
document.addEventListener('keydown',e=>{if(open&&e.key==='Escape')ACT.help()});
document.addEventListener('click',e=>{if(open&&e.target.id==='help')ACT.help()});
window.hdrHelpInit=function(){
 const p=$('#tPlus');p.title=tx('Aplikace obsahuje učivo nad rámec přiřazených ročníků','The app contains material beyond the assigned years\' curriculum');
 const b=$('#bHelp');b.textContent='?';b.setAttribute('aria-label',tx('Vysvětlení k této kapitole','Explanation of this chapter'));b.title=b.getAttribute('aria-label');
};
})();
</script>
<script>
/* ===== 6 Formáty a kompatibilita ===== */
(function(){
const COLS=[
 {id:'sdr',n:'SDR',s:tx('pro srovnání','for comparison'),c:'sdr'},
 {id:'h10',n:'HDR10',s:tx('základ HDR','the HDR base'),c:'hdr10'},
 {id:'h10p',n:'HDR10+',s:tx('dynamická metadata','dynamic metadata'),c:'hdr10p'},
 {id:'dv',n:'Dolby Vision',s:tx('dynamická, vlastní','dynamic, proprietary'),c:'dv8'},
 {id:'hlg',n:'HLG',s:tx('živé vysílání','live broadcast'),c:'hlg'}];
const ROWS=[
 [tx('Přenosová funkce','Transfer function'),[tx('gama 2,4 (BT.1886)','gamma 2.4 (BT.1886)'),'PQ (SMPTE ST 2084)','PQ (ST 2084)','PQ (ST 2084)','HLG (BT.2100)']],
 [tx('Bitová hloubka','Bit depth'),['8 bit','10 bit','10 bit',tx('10 bit, až 12 bit','10 bit, up to 12 bit'),'10 bit']],
 ['Metadata',[tx('žádná','none'),tx('statická: ST 2086, MaxCLL, MaxFALL','static: ST 2086, MaxCLL, MaxFALL'),tx('dynamická: SMPTE ST 2094-40','dynamic: SMPTE ST 2094-40'),tx('dynamická: Dolby, ST 2094-10','dynamic: Dolby, ST 2094-10'),tx('žádná','none')]],
 [tx('Barevný prostor','Colour space'),['BT.709',tx('BT.2020 (mastering často P3)','BT.2020 (often mastered in P3)'),'BT.2020','BT.2020','BT.2020']],
 [tx('Mastering (typicky)','Mastering (typical)'),[tx('100 nit','100 nit'),tx('1 000 až 4 000 nit','1,000 to 4,000 nit'),tx('1 000 až 4 000 nit','1,000 to 4,000 nit'),tx('až 4 000 nit, formát počítá s 10 000','up to 4,000 nit, format allows 10,000'),tx('referenčně 1 000 nit, relativní','1,000 nit reference, relative')]],
 [tx('Licence','Licensing'),['—',tx('otevřený standard, bez poplatků','open standard, royalty-free'),tx('bez poplatku za technologii, certifikace','no technology fee, certification'),tx('proprietární, poplatky Dolby','proprietary, Dolby fees'),tx('otevřený, bez poplatků (BBC, NHK)','open, royalty-free (BBC, NHK)')]],
 [tx('Vznik','Introduced'),[tx('desítky let','decades'),'2015','2017','2014','2015']],
 [tx('Na TV bez podpory','On a TV without support'),['—',tx('SDR nebo vybledlý obraz','SDR or a washed-out picture'),tx('přehraje se jako HDR10','plays as HDR10'),tx('profil 8.1 jako HDR10, profil 5 ne','profile 8.1 as HDR10, profile 5 not'),tx('SDR v BT.2020, o něco plošší','SDR in BT.2020, slightly flat')]],
 [tx('Typické použití','Typical use'),[tx('běžné vysílání, DVD, Blu-ray','regular broadcast, DVD, Blu-ray'),tx('UHD Blu-ray (povinný), streamy, hry','UHD Blu-ray (mandatory), streams, games'),tx('streamy, UHD Blu-ray (volitelný)','streams, UHD Blu-ray (optional)'),tx('streamy, UHD Blu-ray (volitelný)','streams, UHD Blu-ray (optional)'),tx('živé vysílání a sport','live broadcast and sport')]]];
const CONT=[['sdr','SDR'],['hdr10','HDR10'],['hdr10p','HDR10+'],['dv8',tx('Dolby Vision 8.1','Dolby Vision 8.1')],['dv5',tx('Dolby Vision 5','Dolby Vision 5')],['hlg','HLG']];
const CAPS=[['hdr10','HDR10'],['hdr10p','HDR10+'],['dv','Dolby Vision'],['hlg','HLG']];
function evalC(c,cap){
 const A=(r,lv,t)=>({r,lv,t});
 switch(c){
  case 'sdr':return A('SDR','good',tx('Obyčejný obraz bez HDR. HDR TV ho zobrazí jako SDR; umělé „rozšíření“ jasu, pokud ho TV nabízí, skutečné HDR nenahradí.','An ordinary picture without HDR. An HDR TV shows it as SDR; any artificial brightness “boost” the TV offers is no substitute for real HDR.'));
  case 'hdr10':return cap.hdr10?A('HDR10','good',tx('Základní HDR: PQ, 10 bitů, statická metadata. Tohle umí každá HDR TV.','Base HDR: PQ, 10 bit, static metadata. Every HDR TV does this.')):A(tx('SDR (nebo vybledlý obraz)','SDR (or a washed-out picture)'),'bad',tx('TV nezná PQ ani BT.2020. Podle přehrávače se HDR převede na SDR, nebo bude obraz vybledlý.','The TV does not know PQ or BT.2020. Depending on the player, HDR is converted to SDR or the picture looks washed out.'));
  case 'hdr10p':return cap.hdr10p?A('HDR10+','good',tx('TV čte dynamická metadata po scénách a ladí tone mapping pro každou z nich.','The TV reads per-scene dynamic metadata and tunes tone mapping for each scene.')):cap.hdr10?A('HDR10','warn',tx('HDR10+ je postavený na HDR10: TV dynamická metadata ignoruje a použije statická. Obraz je dobrý, jen bez ladění po scénách.','HDR10+ is built on HDR10: the TV ignores the dynamic metadata and uses the static. The picture is good, just without per-scene tuning.')):A('SDR','bad',tx('TV nemá HDR, zobrazí SDR.','The TV has no HDR, it shows SDR.'));
  case 'dv8':return cap.dv?A('Dolby Vision','good',tx('TV čte dynamická metadata Dolby po snímcích a ladí obraz podle svých možností.','The TV reads Dolby’s per-frame dynamic metadata and tunes the picture to its capabilities.')):cap.hdr10?A('HDR10','warn',tx('Profil 8.1 nese základ kompatibilní s HDR10, takže TV bez Dolby Vision ukáže HDR10.','Profile 8.1 carries an HDR10-compatible base, so a TV without Dolby Vision shows HDR10.')):A('SDR','bad',tx('TV nemá HDR, zobrazí SDR.','The TV has no HDR, it shows SDR.'));
  case 'dv5':return cap.dv?A('Dolby Vision','good',tx('Profil 5 je jen pro Dolby Vision a obraz je zakódovaný jinak než HDR10.','Profile 5 is Dolby Vision only and the picture is encoded differently from HDR10.')):A(tx('Špatné barvy','Wrong colours'),'bad',tx('Profil 5 nemá záložní vrstvu HDR10. Bez Dolby Vision se obraz zobrazí s ošklivým zelenofialovým nádechem, nebo se nepřehraje vůbec.','Profile 5 has no HDR10 fallback layer. Without Dolby Vision the picture appears with a nasty green-purple cast, or does not play at all.'));
  case 'hlg':return cap.hlg?A('HLG','good',tx('HLG je relativní, bez metadat. TV ho zobrazí podle svého vrcholu.','HLG is relative and needs no metadata. The TV renders it according to its own peak.')):A(tx('SDR v BT.2020','SDR in BT.2020'),'warn',tx('HLG je zpětně kompatibilní: TV bez HLG ho ukáže jako SDR v BT.2020. Trochu plošší, ale použitelné.','HLG is backward compatible: a TV without HLG shows it as SDR in BT.2020. Slightly flat, but usable.'));
 }
}
TABS.push({name:tx('Formáty','Formats'),side:'27rem',
 build(){
  const cells=[];
  cells.push('<div class="h"></div>');
  COLS.forEach(c=>cells.push(`<div class="h" data-act="fsel" data-v="${c.id}" data-c="${c.id}">${c.n}<small>${c.s}</small></div>`));
  ROWS.forEach(r=>{cells.push(`<div class="r">${r[0]}</div>`);r[1].forEach((t,i)=>cells.push(`<div class="c" data-act="fsel" data-v="${COLS[i].id}" data-c="${COLS[i].id}">${t}</div>`))});
  return `<div class="split"><div class="col"><div class="card grow" style="overflow:hidden"><div class="fmt" id="fmt">${cells.join('')}</div></div></div>
   <div class="side card">
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Co přehráváš','What you play')}</span></div>
     <div class="chips g2">${CONT.map(c=>`<button class="chip" data-k="cont" data-v="${c[0]}">${c[1]}</button>`).join('')}</div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Co umí tvoje TV','What your TV supports')}</span></div>
     <div class="chips g2">${CAPS.map(c=>`<button class="chip" data-act="cap" data-v="${c[0]}" data-cap="${c[0]}">${c[1]}</button>`).join('')}</div></div>
    <div class="cmpflow" style="grid-template-columns:1fr auto 1fr"><div><small>${tx('Zdroj','Source')}</small><b id="fl0"></b></div><i>→</i><div class="res"><small>${tx('TV zobrazí','The TV shows')}</small><b id="fl1"></b></div></div>
    <div class="status" id="fst"><i></i><span></span></div>
    <div class="callout" id="fnote"></div>
    <div class="callout" style="margin-top:auto"><b class="l">${tx('Zkus','Try')}</b>${tx('Vypni všechno a zvol HDR10: dostaneš SDR TV. Pak zapni jen Dolby Vision a přepínej profil 8.1 a 5.','Switch everything off and pick HDR10: that is an SDR TV. Then turn on only Dolby Vision and switch between profile 8.1 and 5.')}</div>
   </div></div>`;
 },
 init(){
  ACT.fsel=v=>{S.fsel=S.fsel===v?'':v;const c=COLS.find(c=>c.id===v);if(S.fsel&&c)S.cont=c.c;refresh()};
  ACT.cap=v=>{S.cap={...S.cap,[v]:!S.cap[v]};refresh()};
 },
 render(){
  $$('#fmt [data-c]').forEach(e=>e.classList.toggle('sel',e.dataset.c===S.fsel));
  $$('[data-cap]').forEach(b=>b.classList.toggle('on',!!S.cap[b.dataset.cap]));
  const r=evalC(S.cont,S.cap);if(!r)return;
  $('#fl0').textContent=CONT.find(c=>c[0]===S.cont)[1];$('#fl1').textContent=r.r;
  const st=$('#fst');st.className='status'+(r.lv==='good'?'':r.lv==='warn'?' warn':' bad');
  st.querySelector('span').textContent=r.lv==='good'?tx('Funguje naplno','Works fully'):r.lv==='warn'?tx('Funguje se zálohou','Works via fallback'):tx('Nefunguje dobře','Does not work well');
  $('#fnote').textContent=r.t;
 }});
})();
</script>
<script>boot();</script>
</body>
