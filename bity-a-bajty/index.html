<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bity a bajty</title>
<meta name="description" content="Bity, bajty, kilobajty a kibibajty: šest krátkých kroků, převody po žebříčku, rychlost přenosu, kapacita disku a opakování, které se přizpůsobí tomu, co ti dělá potíže.">
<meta name="author" content="Ivo Bešťák">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBFAF7">
<link rel="stylesheet" href="fonty/fonty.css">
<style>
:root{
  --bg:#FBFAF7;--card:#FFFFFF;--ink:#1B2230;--ink2:#505A6B;--ink3:#6B7486;--line:#E2DED4;--line2:#CFC9BB;
  --si:#2457C5;--si-bg:#E6EDFB;--iec:#C2410C;--iec-bg:#FCEBDD;
  --ok:#17794A;--ok-bg:#E3F2E9;--bad:#B3261E;--bad-bg:#FBE7E5;--warn:#8A5A00;--warn-bg:#FAF0D8;
  --on:#FFFFFF;--focus:#1B2230;--shadow:0 1px 2px rgba(27,34,48,.06);
  --font:'Atkinson Hyperlegible Next',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Atkinson Hyperlegible Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181F;--card:#1C222C;--ink:#E9ECF2;--ink2:#B4BCCB;--ink3:#8E98AA;--line:#2C3441;--line2:#3B4556;
  --si:#8FB0FF;--si-bg:#202C4A;--iec:#FFA574;--iec-bg:#43291B;
  --ok:#5DD39B;--ok-bg:#16332A;--bad:#FF8D84;--bad-bg:#40201F;--warn:#F0C265;--warn-bg:#3A2F15;
  --on:#101420;--focus:#E9ECF2;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181F;--card:#1C222C;--ink:#E9ECF2;--ink2:#B4BCCB;--ink3:#8E98AA;--line:#2C3441;--line2:#3B4556;
  --si:#8FB0FF;--si-bg:#202C4A;--iec:#FFA574;--iec-bg:#43291B;
  --ok:#5DD39B;--ok-bg:#16332A;--bad:#FF8D84;--bad-bg:#40201F;--warn:#F0C265;--warn-bg:#3A2F15;
  --on:#101420;--focus:#E9ECF2;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--font);min-height:100vh;min-height:100dvh}
.shell{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
a{color:var(--si)}
main:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{line-height:1.25;margin:0}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0 0 12px}
b,strong{font-weight:700}
.mono,code{font-family:var(--mono);font-size:.94em}
.nb{white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;font-size:15px}
.top a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink2);text-decoration:none}
.top a:hover{text-decoration:underline}
.brand{display:flex;align-items:baseline;gap:8px;margin:2px 0 16px}
.brand small{color:var(--ink3);font-size:15px}
.lead{color:var(--ink2);margin:6px 0 18px}
.muted{color:var(--ink2)}
.small{font-size:15px}
.tiny{font-size:13.5px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:transparent}
.card h3{margin-bottom:6px}
.stack>*+*{margin-top:12px}
.btn{appearance:none;font:inherit;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.block{display:flex;width:100%}
.btn.quiet{border-color:var(--line2);font-weight:400;color:var(--ink2)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{min-height:44px;padding:8px 14px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.split{justify-content:space-between}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13.5px;font-weight:700;background:var(--line);color:var(--ink2)}
.pill.si{background:var(--si-bg);color:var(--si)}.pill.iec{background:var(--iec-bg);color:var(--iec)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.si-t{color:var(--si);font-weight:700}.iec-t{color:var(--iec);font-weight:700}

/* přehled kroků */
.steps{list-style:none;margin:0;padding:0}
.stepcard{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;min-height:76px}
.stepcard:hover{border-color:var(--line2)}
.stepcard .no{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700}
.stepcard.done .no{background:var(--ok);border-color:var(--ok);color:var(--on)}
.stepcard.rec{border-color:var(--si);box-shadow:0 0 0 1px var(--si)}
.stepcard h3{margin-bottom:2px}
.stepcard p{margin:0;color:var(--ink2);font-size:15.5px}
.pips{display:flex;gap:5px;margin-top:8px}
.pip{width:18px;height:6px;border-radius:3px;background:var(--line);}
.pip.k{background:var(--ok)}.pip.w{background:var(--warn)}.pip.p{background:var(--si)}

/* průběh kroku */
.prog{display:flex;gap:4px;margin:4px 0 14px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--ink)}
.prog i.cur{background:var(--si)}
.eyebrow{font-size:14px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.nav2{display:flex;gap:10px;margin-top:16px}
.nav2 .btn{flex:1}
.nav2 .btn.back{flex:none;min-width:56px}

/* odpovědi */
.opts{display:grid;gap:10px;margin:14px 0}
.opt{appearance:none;font:inherit;text-align:left;min-height:56px;padding:12px 16px;border-radius:12px;border:2px solid var(--line2);background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:12px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--ink2)}
.opt .t{flex:1}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);color:var(--on)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);color:var(--on)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.numrow{display:flex;gap:10px;margin:14px 0 8px}
.num{flex:1;min-width:0;font:600 22px var(--mono);min-height:56px;padding:8px 14px;border-radius:12px;border:2px solid var(--line2);background:var(--card);color:var(--ink)}
.num:focus{border-color:var(--ink);outline:none}
.unit{align-self:center;font:600 18px var(--mono);color:var(--ink2);min-width:3ch}
.fb{border-radius:12px;padding:14px 16px;margin:12px 0;border:2px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb.info{background:var(--warn-bg);border-color:var(--warn)}
.fb h3{font-size:17px;margin-bottom:4px}
.fb p:last-child{margin-bottom:0}
.hint{background:var(--si-bg);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:16px}
details.sol{margin:8px 0 0}
details.sol summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
ol.calc{margin:6px 0 0;padding-left:22px}
ol.calc li{margin:4px 0}
.q{font-size:19px;font-weight:600;line-height:1.4}
.q .mono{font-weight:600}

/* pracovní prvky */
.worked li{margin:0 0 10px}
.wk{list-style:none;padding:0;margin:0}
.wk li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px;display:flex;gap:10px}
.wk li b.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px}
.wk li.res{border-color:var(--ok);background:var(--ok-bg)}
.wk li.res b.n{background:var(--ok);color:var(--on)}
.wk li.blank{border-style:dashed}
table.t{width:100%;border-collapse:collapse;font-size:15.5px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:13.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
table.t td.r,table.t th.r{text-align:right}
table.t td.m{font-family:var(--mono);font-size:14.5px}
.scroll{overflow-x:auto}

/* žebříček */
.ladder{display:flex;flex-direction:column;align-items:stretch;gap:0;margin:8px 0}
.rung{appearance:none;font:inherit;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 16px;border-radius:12px;border:2px solid var(--line2);background:var(--card);color:var(--ink);cursor:pointer;text-align:left}
.rung b{font-family:var(--mono);font-size:18px}
.rung span{font-size:14px;color:var(--ink3)}
.ladder.si .rung.sel{border-color:var(--si);background:var(--si-bg)}
.ladder.iec .rung.sel{border-color:var(--iec);background:var(--iec-bg)}
.ladder .gap{display:flex;align-items:center;justify-content:center;height:26px;font:600 14px var(--mono);color:var(--ink3)}
.ladder.si .gap{color:var(--si)}.ladder.iec .gap{color:var(--iec)}
.lres{min-height:52px}

/* bity */
.bits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.bit{appearance:none;font:700 24px var(--mono);height:56px;min-width:40px;border-radius:10px;border:2px solid var(--line2);background:var(--card);color:var(--ink3);cursor:pointer}
.bit.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.bitval{text-align:center;font:600 20px var(--mono)}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
.stepper b{font:700 20px var(--mono);min-width:7ch;text-align:center}
.sq{width:44px;height:44px;padding:0}

/* konvertor */
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-weight:700;font-size:15px;color:var(--ink2)}
select,input.txt{font:inherit;font-size:18px;min-height:52px;padding:8px 12px;border-radius:12px;border:2px solid var(--line2);background:var(--card);color:var(--ink);width:100%}
input.txt{font-family:var(--mono);font-weight:600}
.res{font:700 26px/1.3 var(--mono);word-break:break-word}
.seg{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:14px}
.seg a{flex:1;text-align:center;text-decoration:none;color:var(--ink2);min-height:44px;display:grid;place-items:center;border-radius:9px;font-weight:700;font-size:15px}
.seg a.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.swap{align-self:end}
.bars{display:grid;gap:6px;margin-top:6px}
.bar{height:14px;border-radius:7px}
.bar.si{background:var(--si)}.bar.iec{background:var(--iec)}
.cmp{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;align-items:center;font-size:15px}
.cmp b{font-family:var(--mono)}

/* spodní lišta */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;color:var(--ink3);text-decoration:none;font-size:13.5px;font-weight:700;position:relative}
.tabbar a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--ink)}
.tabbar a.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:var(--on);font-size:12px;display:grid;place-items:center;padding:0 5px}
footer.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--ink3)}
footer.foot p{margin:0 0 4px}
.copybox{font:500 13px/1.4 var(--mono);width:100%;min-height:96px;padding:10px;border-radius:12px;border:2px solid var(--line2);background:var(--card);color:var(--ink);resize:vertical;word-break:break-all}
.big{font:700 40px/1 var(--mono)}
.qbox{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){:root:not([data-rm]) .opt,:root:not([data-rm]) .btn,:root:not([data-rm]) .rung{transition:background-color .15s,border-color .15s}}
@media print{.tabbar,.top,.nav2,.seg{display:none}body{background:#fff;color:#000}.card{break-inside:avoid;box-shadow:none}}
@media (min-width:700px){body{font-size:18px}.shell{padding-top:8px}}
</style>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:16px">Aplikace potřebuje zapnutý JavaScript.</p></noscript>
<script>
'use strict';
/* ===== pomocné funkce ===== */
const NB = ' ';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const near = (a, b) => Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 864e5);
const dateCz = d => { const x = new Date(d * 864e5); return x.getUTCDate() + '. ' + (x.getUTCMonth() + 1) + '. ' + x.getUTCFullYear(); };

/* číslo v české úpravě: mezera po tisících, desetinná čárka */
function fmt(n, sig = 10) {
  if (!isFinite(n)) return '–';
  if (n === 0) return '0';
  const neg = n < 0, a = Math.abs(n);
  let s;
  if (Number.isInteger(a) && a < 9007199254740992) s = String(a);
  else {
    const r = parseFloat(a.toPrecision(sig));
    s = (r >= 1e21 || r < 1e-9) ? r.toExponential() : r.toLocaleString('en-US', { useGrouping: false, maximumFractionDigits: 20 });
  }
  let [i, d] = s.split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, NB);
  return (neg ? '−' : '') + i + (d ? ',' + d : '');
}
const pw = (b, e) => `${b}<sup>${e}</sup>`;
/* vstup od žáka: čárka nebo tečka, mezery se ignorují */
function parseNum(s) {
  s = String(s).trim().replace(/[\s  ]/g, '').replace(',', '.').replace('−', '-');
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return Number(s);
}

/* ===== jednotky ===== */
const BYTES = { bit: 1 / 8, kbit: 125, Mbit: 125e3, Gbit: 125e6, B: 1, kB: 1e3, MB: 1e6, GB: 1e9, TB: 1e12, KiB: 1024, MiB: 1048576, GiB: 1073741824, TiB: 1099511627776 };
const SI = ['B', 'kB', 'MB', 'GB', 'TB'];
const IEC = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
const NAMES = { bit: 'bit', kbit: 'kilobit', Mbit: 'megabit', Gbit: 'gigabit', B: 'bajt', kB: 'kilobajt', MB: 'megabajt', GB: 'gigabajt', TB: 'terabajt', KiB: 'kibibajt', MiB: 'mebibajt', GiB: 'gibibajt', TiB: 'tebibajt' };
const conv = (v, f, t) => v * BYTES[f] / BYTES[t];
const unitHtml = u => IEC.includes(u) && u !== 'B' ? `<span class="iec-t">${u}</span>` : (SI.includes(u) && u !== 'B' ? `<span class="si-t">${u}</span>` : u);
const isIec = u => IEC.includes(u) && u !== 'B';

/* ===== úložiště postupu ===== */
const KEY = 'bity-a-bajty:v1';
const INT = [0, 1, 2, 4, 8, 16, 32];
let S;
function defState() { return { i: {}, st: {}, pl: null, g: { best: 0, n: 0 }, th: 'auto', rm: false, fl: {} }; }
function load() {
  try { const o = JSON.parse(localStorage.getItem(KEY)); if (o && typeof o === 'object') return Object.assign(defState(), o); } catch (e) {}
  return defState();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
S = load();
const M = k => S.i[k] || null;
function record(skill, ok, hinted) {
  const t = today(), m = S.i[skill] || { b: 0, d: t, ok: 0, bad: 0 };
  if (ok) { m.ok++; if (hinted) { m.d = Math.max(m.d, t + 1); } else { m.b = Math.min(m.b + 1, 6); m.d = t + INT[m.b]; } }
  else { m.bad++; m.b = 0; m.d = t; }
  S.i[skill] = m; save();
}
const dueList = () => Object.keys(S.i).filter(k => S.i[k].d <= today()).sort((a, b) => (S.i[a].b - S.i[b].b) || (S.i[a].d - S.i[b].d));
const pipState = k => { const m = M(k); if (!m) return ''; if (m.b >= 2) return 'k'; if (m.b === 0 && m.bad > 0) return 'w'; return 'p'; };

/* ===== generování úloh ===== */
const lab = (v, unit, sig) => fmt(v, sig || 10) + (unit ? NB + unit : '');
/* numerická úloha s možnostmi výběru: wrong = [[hodnota, vysvětlení chyby], ...] */
function mk(o) {
  const sig = o.sig || 10;
  const opts = [{ v: o.ans, t: lab(o.ans, o.unit, sig), ok: true }];
  for (const [v, why] of o.wrong) {
    if (!isFinite(v) || v <= 0 && o.pos !== false || near(v, o.ans) || opts.some(x => near(x.v, v))) continue;
    opts.push({ v, t: lab(v, o.unit, sig), why });
    if (opts.length === 4) break;
  }
  o.opts = shuffle(opts); o.kind = 'num';
  return o;
}
/* úloha s výběrem: opts = [{t, ok, why}] */
function mkc(o, keepOrder) { o.opts = keepOrder ? o.opts : shuffle(o.opts); o.kind = 'choice'; return o; }
const calc = a => `<ol class="calc">${a.map(x => `<li>${x}</li>`).join('')}</ol>`;

const GEN = {};
GEN['bit-bajt'] = () => {
  if (Math.random() < .5) {
    const n = pick([3, 5, 6, 12, 16, 25, 64, 125]);
    return mk({ skill: 'bit-bajt', q: `Kolik bitů je <b class="mono">${n} B</b>?`, ans: n * 8, unit: 'bit',
      wrong: [[n / 8, 'Dělil jsi osmi. Bajt je větší než bit, takže bitů je víc: násobíš.'], [n * 10, 'Mezi bajtem a bitem je osmička, ne desítka.'], [n * 1024, 'Číslo 1 024 patří předponám kibi, mebi… Mezi bajtem a bitem je jen 8.'], [n * 4, 'Bajt má osm bitů, ne čtyři (čtyři má jen půlbajt, nibble).']],
      steps: ['Bajt je větší než bit, bitů bude víc → násobím.', '1 B = 8 bit.', `${n} · 8 = <b>${n * 8} bit</b>`],
      hint: 'Je bajt větší, nebo menší než bit? Podle toho násobíš, nebo dělíš.', hint2: 'Jeden bajt je osm bitů.', meta: { t: 'bit-bajt', v: n, from: 'B', to: 'bit' } });
  }

const LETTER = ['A', 'B', 'C', 'D'];
function runTasks(host, specs, o) {
  specs = specs.map(s => ({ ...s })); let k = 0; const firstTry = [];
  const next = () => { if (k >= specs.length) return finish(); show(); };
  const finish = () => {
    const ok = firstTry.filter(Boolean).length;
    const weak = [...new Set(specs.filter((s, i) => firstTry[i] === false).map(s => SKILLS[s.skill] || ''))].filter(Boolean);
    host.innerHTML = `<div class="card"><h2>${o.doneTitle || 'Hotovo'}</h2><p class="lead" style="margin-bottom:8px">Správně na první pokus: <b>${ok} z ${firstTry.length}</b>.</p>${weak.length ? `<p class="small">K opakování: ${weak.join(', ')}. Vrátí se v části <b>Na dnešek</b>.</p>` : '<p class="small">Bez chyby. Dobrá práce.</p>'}</div>`;
    if (o.onFinish) o.onFinish(ok, firstTry.length);
  };
  const show = () => {
    const spec = specs[k], mode = spec.fixed ? 'choice' : (o.forceChoice ? 'choice' : modeFor(spec.skill));
    const t = spec.fixed || taskFor(spec.skill, mode);
    const isNum = t.mode === 'num' || (!spec.fixed && mode === 'num' && t.kind === 'num');
    let hints = 0, answered = false;
    host.innerHTML = `<div class="qbox"><span class="eyebrow">Úloha ${k + 1} z ${specs.length}${spec.retry ? ' · znovu' : ''}</span><span class="pill">${isNum ? 'napiš číslo' : 'vyber odpověď'}</span></div>
    <div class="card"><p class="q">${t.q}</p>${t.lines ? `<ol class="calc" style="margin-top:10px">${t.lines.map(l => `<li>${l}</li>`).join('')}</ol>` : ''}</div>
    ${isNum ? `<div class="numrow"><input class="num" id="ans" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="Odpověď" placeholder="?"><span class="unit">${esc(t.unit || '')}</span></div><button class="btn primary block" id="chk">Zkontrolovat</button><p class="tiny" style="margin:8px 0 0">Desetinná čárka i mezery jsou v pořádku.</p>`
      : `<div class="opts">${t.opts.map((p, i) => `<button class="opt" data-i="${i}"><span class="k">${LETTER[i]}</span><span class="t">${p.t}</span></button>`).join('')}</div>`}
    <div class="row" style="margin-top:6px">${t.hint ? '<button class="btn quiet sm" id="hintb">Nápověda</button>' : ''}</div><div id="hints"></div><div id="fb" aria-live="polite"></div>`;
    const done = (ok, msgBad) => {
      if (answered) return; answered = true;
      if (o.record !== false) record(spec.skill, ok, hints > 0);
      if (!spec.retry) firstTry.push(ok); else firstTry.push(null);
      if (!ok && !spec.retry && o.retry !== false && !spec.fixed) specs.push({ skill: spec.skill, retry: true });
      const right = isNum ? `${fmt(t.ans)} ${t.unit || ''}`.trim() : t.opts.find(p => p.ok).t;
      const sol = t.steps ? `<details class="sol" ${ok ? '' : 'open'}><summary>Postup</summary>${calc(t.steps)}</details>` : '';
      $('#fb', host).innerHTML = ok
        ? `<div class="fb ok"><h3>Správně${hints ? ' (s nápovědou)' : ''}</h3>${sol}</div>`
        : `<div class="fb bad"><h3>Ještě ne</h3>${msgBad ? `<p>${msgBad}</p>` : ''}<p>Správně je <b class="mono">${right}</b>.</p>${sol}</div>`;
      const last = k + 1 >= specs.length || (!ok && !spec.retry && o.retry !== false && !spec.fixed ? false : k + 1 >= specs.length);
      $('#fb', host).insertAdjacentHTML('beforeend', `<button class="btn primary block" id="nxt" style="margin-top:12px">${k + 1 >= specs.length ? 'Zobrazit výsledek' : 'Další úloha'}</button>`);
      $('#nxt', host).onclick = () => { k++; next(); window.scrollTo(0, 0); };
      $('#nxt', host).focus({ preventScroll: true });
      $('#fb', host).scrollIntoView({ block: 'nearest', behavior: S.rm ? 'auto' : 'smooth' });
    };
    if (isNum) {
      const inp = $('#ans', host), check = () => {
        if (answered) return;
        const u = parseNum(inp.value);
        if (!isFinite(u)) { $('#fb', host).innerHTML = '<div class="fb info"><p>Zapiš číslo, např. 2560 nebo 12,5.</p></div>'; inp.focus(); return; }
        const tol = Math.max(t.tolAbs || 0, 1e-9 * Math.abs(t.ans));
        const ok = Math.abs(u - t.ans) <= tol;
        let why = '';
        if (!ok) { const w = t.opts.find(p => !p.ok && Math.abs(p.v - u) <= Math.max(t.tolAbs || 0, 1e-9 * Math.abs(p.v))); why = w ? w.why : ''; }
        inp.disabled = true; $('#chk', host).disabled = true; done(ok, why);
      };
      $('#chk', host).onclick = check;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      inp.focus({ preventScroll: true });
    } else {
      host.querySelector('.opts').onclick = e => {
        const b = e.target.closest('.opt'); if (!b || answered) return;
        const p = t.opts[+b.dataset.i];
        $$('.opt', host).forEach((x, i) => { x.disabled = true; if (t.opts[i].ok) x.classList.add('ok'); else if (x === b) x.classList.add('bad'); else x.classList.add('dim'); });
        done(!!p.ok, p.ok ? '' : p.why || '');
      };
    }
    const hb = $('#hintb', host);
    if (hb) hb.onclick = () => {
      if (answered) return; hints++;
      $('#hints', host).innerHTML = `<div class="hint">${hints === 1 || !t.hint2 ? t.hint : t.hint + '<br><b>Ještě víc:</b> ' + t.hint2}</div>`;
      if (hints >= 2 || !t.hint2) hb.disabled = true;
    };
  };
  show();
}

function mount(tab, inner, after) {
  APP().innerHTML = shell(tab, inner);

  m.focus({ preventScroll: true }); window.scrollTo(0, 0);
}

function pips(st) { return `<div class="pips" aria-label="Dovednosti: ${st.skills.filter(k => pipState(k) === 'k').length} z ${st.skills.length} zvládnuté">${st.skills.map(k => `<span class="pip ${pipState(k)}" title="${SKILLS[k]}"></span>`).join('')}</div>`; }
function home() {
  const pl = S.pl;
  const inner = `<p class="lead">Šest krátkých kroků od bitu po disk, který „nemá, co měl mít“. Každý krok začíná otázkou, pak výklad, příklad a procvičení.</p>
  ${pl ? '' : `<div class="card"><h3>Kde začít?</h3><p class="muted small">Tři otázky bez známkování. Podle nich ti doporučím první krok.</p><a class="btn block" href="#/test">Udělat krátký test</a></div>`}
  <ol class="steps">${STEPS.map(st => { const done = S.st[st.id]; const rec = pl && pl.rec === st.id && !done; return `<li><a class="stepcard ${done ? 'done' : ''} ${rec ? 'rec' : ''}" href="#/krok/${st.id}/0"><span class="no">${done ? '✓' : st.id}</span><span><h3>${st.title}${rec ? ' <span class="pill si">doporučeno</span>' : ''}</h3><p>${st.goal}</p>${pips(st)}</span></a></li>`; }).join('')}</ol>`;
  mount('uc', inner);
}

function stepView(n, i) {
  const st = STEPS[n - 1]; if (!st) return home();
  const sc = st.screens[i]; if (!sc) return home();
  const total = st.screens.length, gating = ['tip', 'worked', 'fade', 'practice'].includes(sc.t);
  const last = i === total - 1;
  const inner = `<div class="prog" aria-hidden="true">${st.screens.map((_, k) => `<i class="${k < i ? 'on' : k === i ? 'cur' : ''}"></i>`).join('')}</div>
  <p class="eyebrow">Krok ${n} · ${st.title}</p><h2 id="sh" style="margin-bottom:12px">${sc.h || ({ tip: 'Nejdřív tip', practice: 'Procvič si to', sum: 'Shrnutí' }[sc.t])}</h2><div id="body"></div>
  <div class="nav2"><a class="btn back" ${i > 0 ? `href="#/krok/${n}/${i - 1}"` : 'href="#/"'} aria-label="Zpět">←</a><button class="btn primary" id="nx" ${gating ? 'disabled' : ''}>${last ? 'Hotovo' : 'Pokračovat'}</button></div>`;
  mount('uc', inner, m => {
    const body = $('#body', m), nx = $('#nx', m), unlock = () => { nx.disabled = false; };
    nx.onclick = () => {
      if (last) { S.st[n] = today(); save(); location.hash = n < STEPS.length ? `#/krok/${n + 1}/0` : '#/'; }
      else location.hash = `#/krok/${n}/${i + 1}`;
    };
    if (S.st[n] && gating) unlock();
    if (sc.t === 'txt') { body.innerHTML = sc.html; mountVis(body); }
    else if (sc.t === 'sum') {
      body.innerHTML = `<div class="card"><ul style="margin:0;padding-left:20px">${sc.items.map(x => `<li style="margin:6px 0">${x}</li>`).join('')}</ul></div>${n < STEPS.length ? `<p class="small muted">Dál: krok ${n + 1}, ${STEPS[n].title}.</p>` : '<p class="small muted">To je poslední krok. Opakování najdeš v části Na dnešek.</p>'}`;
    } else if (sc.t === 'tip') {
      body.innerHTML = `<div class="card"><p class="q">${sc.q}</p><p class="small muted" style="margin:6px 0 0">Tip bez hodnocení: zkus odhadnout, ještě to nemusíš umět.</p></div><div class="opts">${sc.opts.map((p, k) => `<button class="opt" data-i="${k}"><span class="k">${LETTER[k]}</span><span class="t">${p.t}</span></button>`).join('')}</div><div id="fb" aria-live="polite"></div>`;
      body.querySelector('.opts').onclick = e => {
        const b = e.target.closest('.opt'); if (!b || b.disabled) return;
        const p = sc.opts[+b.dataset.i];
        $$('.opt', body).forEach((x, k) => { x.disabled = true; if (sc.opts[k].ok) x.classList.add('ok'); else if (x === b) x.classList.add('bad'); else x.classList.add('dim'); });
        $('#fb', body).innerHTML = `<div class="fb ${p.ok ? 'ok' : 'info'}"><h3>${p.ok ? 'Přesně tak' : 'Zatím ne, a to je v pořádku'}</h3>${p.ok ? '' : `<p>${p.why}</p>`}<p>${sc.reveal}</p></div>`;
        unlock();
      };
    } else if (sc.t === 'worked') {
      let shown = 1;
      const draw = () => {
        body.innerHTML = `<div class="card"><p class="q" style="margin:0">${sc.q}</p></div><ol class="wk">${sc.steps.slice(0, shown).map((s, k) => `<li class="${k === sc.steps.length - 1 ? 'res' : ''}"><b class="n">${k + 1}</b><span>${s}</span></li>`).join('')}</ol>${shown < sc.steps.length ? '<button class="btn block" id="more">Další krok</button>' : ''}`;
        if (shown < sc.steps.length) { const mb = $('#more', body); mb.onclick = () => { shown++; draw(); const m2 = $('#more', body); (m2 || nx).focus({ preventScroll: true }); }; } else unlock();
      };
      draw();
    } else if (sc.t === 'fade') {
      body.innerHTML = `<div class="card"><p class="q" style="margin:0">${sc.q}</p></div><ol class="wk">${sc.shown.map((s, k) => `<li><b class="n">${k + 1}</b><span>${s}</span></li>`).join('')}<li class="blank"><b class="n">${sc.shown.length + 1}</b><span>${sc.blank}</span></li></ol>
      <div class="numrow"><input class="num" id="ans" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="Doplň výsledek" placeholder="?"><span class="unit">${sc.unit}</span></div><button class="btn primary block" id="chk">Zkontrolovat</button><div id="fb" aria-live="polite"></div>`;
      const inp = $('#ans', body), tolAbs = sc.tolAbs || 0; let tries = 0;
      const check = () => {
        const u = parseNum(inp.value); if (!isFinite(u)) { $('#fb', body).innerHTML = '<div class="fb info"><p>Zapiš číslo.</p></div>'; return; }
        const ok = Math.abs(u - sc.ans) <= Math.max(tolAbs, 1e-9 * Math.abs(sc.ans)); tries++;
        if (ok) { inp.disabled = true; $('#chk', body).disabled = true; $('#fb', body).innerHTML = `<div class="fb ok"><h3>Správně</h3><p><b class="mono">${sc.blank} ${fmt(sc.ans)} ${sc.unit}</b></p></div>`; unlock(); }
        else if (tries < 2) { $('#fb', body).innerHTML = '<div class="fb info"><h3>Ještě ne</h3><p>Zkus to znovu. Projdi výše uvedené kroky: násobíš, nebo dělíš?</p></div>'; inp.select(); }
        else { inp.disabled = true; $('#chk', body).disabled = true; $('#fb', body).innerHTML = `<div class="fb bad"><h3>Správně je ${fmt(sc.ans)} ${sc.unit}</h3><p>Pokračuj, v procvičování si to zopakuješ.</p></div>`; unlock(); }
      };

    } else if (sc.t === 'practice') {
      runTasks(body, sc.skills.map(skill => ({ skill })), { doneTitle: 'Procvičeno', onFinish: unlock });
    }
  });
}

/* ===== nástroje ===== */
const TOOLTABS = [['prevodnik', 'Převodník'], ['tahak', 'Tahák'], ['hra', 'Hra'], ['postup', 'Postup']];

}
const SERIES_OF = u => ['bit', 'kbit', 'Mbit', 'Gbit'].includes(u) ? 'bit' : (u === 'B' ? 'B' : (isIec(u) ? 'iec' : 'si'));

  const series = sf === 'B' ? st : sf, same = (sf === st) || sf === 'B' || st === 'B' ? (sf === st || (sf === 'B' && st !== 'bit') || (st === 'B' && sf !== 'bit')) : false;
  const small = x => BYTES[x] < 1 ? 1 : 0;
  const lines = [];
  if (f === t) return { res, lines: ['Obě jednotky jsou stejné, číslo se nemění.'] };

    lines.push(`Cíl <b>${t}</b> je ${down ? 'menší' : 'větší'} jednotka (${down ? 'níž' : 'výš'} na žebříčku) → ${down ? 'násobím' : 'dělím'}.`, `Schodů: ${k}, každý ${fmt(base)} → ${fmt(base ** k)}.`, down ? `${fmt(v)} · ${fmt(base ** k)} = <b>${fmt(res, 10)} ${t}</b>` : `${fmt(v)} : ${fmt(base ** k)} = <b>${fmt(res, 10)} ${t}</b>`);
  } else if (series === 'bit' && sf === st) {

    lines.push(`Cíl <b>${t}</b> je ${down ? 'menší' : 'větší'} jednotka → ${down ? 'násobím' : 'dělím'}.`, `Schodů: ${k}, každý 1 000 → ${fmt(1000 ** k)}.`, down ? `${fmt(v)} · ${fmt(1000 ** k)} = <b>${fmt(res, 10)} ${t}</b>` : `${fmt(v)} : ${fmt(1000 ** k)} = <b>${fmt(res, 10)} ${t}</b>`);

  lines.push(`Kontrola odhadem: ${t} je ${bigger ? 'větší' : 'menší'} jednotka než ${f}, číslo má být ${bigger ? 'menší' : 'větší'}. ${(bigger ? res < v : res > v) ? '✓ Sedí.' : '✗ Nesedí, zkontroluj zadání.'}`);

function converter(host) {

function cheat(host) {

/* ===== hra: odhad řádu ===== */
const GITEMS = [['znak textu', 1], ['SMS zpráva', 140], ['normostrana textu', 2e3], ['krátký e-mail', 5e4], ['kniha jako čistý text', 5e5], ['fotka z mobilu', 3e6], ['skladba v MP3', 4e6], ['aplikace do mobilu', 1e8], ['film v HD (2 hodiny)', 4e9], ['instalace Windows', 2.5e10], ['velká počítačová hra', 1e11], ['disk v notebooku', 5.12e11], ['externí disk', 2e12]];

  for (let n = 0; n < 500; n++) {

}
function game(host) {

  const intro = () => { host.innerHTML = `<div class="card"><h3>Odhad řádu</h3><p class="muted">Osm otázek: kolikrát je jedna věc větší než druhá? Odhadni řád (10×, 100×, 1 000×…). Bez času a bez trestných bodů, velikosti jsou typické a přibližné.</p>${S.g.best ? `<p class="small">Tvůj nejlepší výsledek: <b>${S.g.best} z ${N}</b></p>` : ''}</div><button class="btn primary block" id="st">Začít</button>`; $('#st', host).onclick = () => { k = 0; score = 0; ask(); }; };
  const ask = () => {
    const p = gamePair(), set = new Set([p.r]); for (const d of shuffle([-1, 1, 2, -2])) { if (set.size >= 4) break; if (p.r + d >= 1) set.add(p.r + d); }
    const opts = shuffle([...set].slice(0, 4)).sort((a, b) => a - b);
    host.innerHTML = `<div class="qbox"><span class="eyebrow">Otázka ${k + 1} z ${N}</span><span class="pill">${score} správně</span></div><div class="card"><p class="q">Kolikrát je <b>${p.big[0]}</b> větší než <b>${p.small[0]}</b>?</p></div><div class="opts">${opts.map((r, i) => `<button class="opt" data-r="${r}"><span class="k">${LETTER[i]}</span><span class="t">asi ${lbl(r)}</span></button>`).join('')}</div><div id="fb" aria-live="polite"></div>`;
    host.querySelector('.opts').onclick = e => {
      const b = e.target.closest('.opt'); if (!b || b.disabled) return; const ok = +b.dataset.r === p.r; if (ok) score++;
      $$('.opt', host).forEach(x => { x.disabled = true; if (+x.dataset.r === p.r) x.classList.add('ok'); else if (x === b) x.classList.add('bad'); else x.classList.add('dim'); });
      $('#fb', host).innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}"><h3>${ok ? 'Přesně' : 'Ne tak docela'}</h3><p>${p.big[0]} ≈ ${sizeLabel(p.big[1])}, ${p.small[0]} ≈ ${sizeLabel(p.small[1])}. Poměr je asi ${fmt(10 ** p.r)}×.</p></div><button class="btn primary block" id="nx2" style="margin-top:12px">${k + 1 >= N ? 'Výsledek' : 'Další'}</button>`;
      $('#nx2', host).onclick = () => { k++; k >= N ? end() : ask(); };
      $('#nx2', host).focus({ preventScroll: true });
    };
  };
  const end = () => { S.g.n++; S.g.best = Math.max(S.g.best, score); save(); host.innerHTML = `<div class="card"><h2>${score} z ${N}</h2><p class="muted">${score >= 6 ? 'Máš dobrý cit pro velikosti dat.' : 'Řády se časem ustálí. Zkus to znovu a využij tahák.'}</p></div><button class="btn primary block" id="ag">Hrát znovu</button>`; $('#ag', host).onclick = () => { k = 0; score = 0; ask(); }; };
  intro();
}

/* ===== postup, záloha, nastavení ===== */
function encode() {
  const c = { v: 1, i: {}, st: S.st, g: S.g.best };
  for (const k in S.i) { const m = S.i[k]; c.i[k] = [m.b, m.d, m.ok, m.bad]; }
  const j = JSON.stringify(c), b = btoa(unescape(encodeURIComponent(j))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

}

  let h = 0; for (let i = 0; i < p[1].length; i++) h = (h * 31 + p[1].charCodeAt(i)) % 65521;
  if (h.toString(16) !== p[2]) throw 0;

}

  for (const k in (c.st || {})) if (+k >= 1 && +k <= STEPS.length && Number.isFinite(c.st[k])) S.st[k] = Math.min(S.st[k] || 1e9, c.st[k]);

  save();
}
function applyTheme() { const r = document.documentElement; if (S.th === 'light' || S.th === 'dark') r.dataset.theme = S.th; else delete r.dataset.theme; if (S.rm) r.dataset.rm = '1'; else delete r.dataset.rm; }
function progress(host) {
  const labels = { k: 'zvládnuto', w: 'slabé', p: 'učím se', '': 'nezačato' };
  const code = encode();
  host.innerHTML = `<div class="card"><h3>Dovednosti</h3><table class="t"><tbody>${Object.keys(SKILLS).map(k => { const s = pipState(k), m = M(k); return `<tr><td>${SKILLS[k]}</td><td class="r"><span class="pill ${s === 'k' ? 'ok' : s === 'w' ? 'warn' : s === 'p' ? 'si' : ''}">${labels[s]}</span>${m ? `<br><span class="tiny">další ${m.d <= today() ? 'dnes' : dateCz(m.d)}</span>` : ''}</td></tr>`; }).join('')}</tbody></table></div>
  <div class="card"><h3>Záloha postupu</h3><p class="small muted">Postup je jen v tomto prohlížeči. Zkopíruj kód a vlož ho na jiném zařízení.</p><textarea class="copybox" id="code" readonly aria-label="Kód zálohy">${code}</textarea><div class="row" style="margin:8px 0 16px"><button class="btn sm" id="cp">Kopírovat kód</button><span id="cpm" class="small muted" aria-live="polite"></span></div>
  <div class="field"><label for="imp">Vložit kód z jiného zařízení</label><textarea class="copybox" id="imp" style="min-height:70px" placeholder="BB1.…"></textarea></div><button class="btn sm" id="im">Načíst (sloučí se s tímto postupem)</button><p id="imm" class="small" aria-live="polite" style="margin-top:8px"></p></div>
  <div class="card"><h3>Přidat na plochu</h3><p class="small"><b>iPhone / iPad (Safari):</b> Sdílet → Přidat na plochu.<br><b>Android (Chrome):</b> menu ⋮ → Přidat na plochu / Instalovat.</p></div>
  <div class="card"><h3>Vzhled</h3><div class="row" role="group" aria-label="Motiv">${[['auto', 'Podle systému'], ['light', 'Světlý'], ['dark', 'Tmavý']].map(([v, n]) => `<button class="btn sm ${S.th === v ? 'primary' : ''}" data-th="${v}" aria-pressed="${S.th === v}">${n}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn sm ${S.rm ? 'primary' : ''}" id="rm" aria-pressed="${!!S.rm}">Omezit animace: ${S.rm ? 'zapnuto' : 'vypnuto'}</button></div></div>
  <div class="card"><h3>Smazat postup</h3><p class="small muted">Vymaže opakování, hotové kroky i rekord ve hře v tomto prohlížeči.</p><button class="btn sm" id="rs">Smazat postup</button></div>`;
  $('#cp', host).onclick = async () => { const ta = $('#code', host); try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); document.execCommand('copy'); } $('#cpm', host).textContent = 'Zkopírováno.'; };
  $('#im', host).onclick = () => { const m = $('#imm', host); try { const c = decode($('#imp', host).value); mergeIn(c); m.textContent = 'Postup načten.'; setTimeout(route, 700); } catch (e) { m.textContent = 'Kód se nepodařilo přečíst. Zkopíruj ho celý, od BB1 po konec.'; } };
  $$('[data-th]', host).forEach(b => b.onclick = () => { S.th = b.dataset.th; save(); applyTheme(); progress(host); });
  $('#rm', host).onclick = () => { S.rm = !S.rm; save(); applyTheme(); progress(host); };
  const rs = $('#rs', host); rs.onclick = () => { if (rs.dataset.c) { S = defState(); save(); applyTheme(); location.hash = '#/'; route(); } else { rs.dataset.c = 1; rs.textContent = 'Opravdu smazat? Klepni znovu'; } };
}

/* ===== směrování ===== */
function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const r = p[0] || '';
  try {
    if (r === 'krok') stepView(+p[1], +p[2] || 0);
    else if (r === 'dnes') todayView();
    else if (r === 'nastroje') tools(p[1]);
    else if (r === 'test') placement();
    else home();
  } catch (e) { APP().innerHTML = '<div class="shell"><p>Něco se pokazilo. <a href="#/">Zpět na začátek</a></p></div>'; console.error(e); }
}
window.addEventListener('hashchange', route);
applyTheme();
route();
window.__BB = { GEN, SKILLS, taskFor, fmt, parseNum, conv, BYTES, STEPS, encode, decode, dueList, S: () => S };
</script>
