<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Šestnáctková soustava</title>
<meta name="description" content="Sedm krátkých kroků od číslic A až F po převody mezi dvojkovou, šestnáctkovou a desítkovou soustavou: čtveřice bitů, váhy 16, dělení šestnácti, bajty a barvy. Opakování se přizpůsobí tomu, co ti dělá potíže.">
<meta name="author" content="Ivo Bešťák">
<meta name="theme-color" content="#FBFAF7">
<link rel="stylesheet" href="fonty/fonty.css">
<style>
:root{
  --bg:#FBFAF7;--card:#FFFFFF;--ink:#1B2230;--ink2:#505A6B;--ink3:#6B7486;--line:#E2DED4;--line2:#CFC9BB;
  --si:#2457C5;--si-bg:#E6EDFB;--iec:#B93B0A;--iec-bg:#FCEBDD;
  --ok:#17794A;--ok-bg:#E3F2E9;--bad:#B3261E;--bad-bg:#FBE7E5;--warn:#8A5A00;--warn-bg:#FAF0D8;
  --on:#FFFFFF;--focus:#1B2230;--shadow:0 1px 2px rgba(27,34,48,.06);
  --font:'Atkinson Hyperlegible Next',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Atkinson Hyperlegible Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181F;--card:#1C222C;--ink:#E9ECF2;--ink2:#B4BCCB;--ink3:#8E98AA;--line:#2C3441;--line2:#3B4556;
  --si:#8FB0FF;--si-bg:#202C4A;--iec:#FFA574;--iec-bg:#43291B;
  --ok:#5DD39B;--ok-bg:#16332A;--bad:#FF8D84;--bad-bg:#40201F;--warn:#F0C265;--warn-bg:#3A2F15;
  --on:#101420;--focus:#E9ECF2;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181F;--card:#1C222C;--ink:#E9ECF2;--ink2:#B4BCCB;--ink3:#8E98AA;--line:#2C3441;--line2:#3B4556;
  --si:#8FB0FF;--si-bg:#202C4A;--iec:#FFA574;--iec-bg:#43291B;
  --ok:#5DD39B;--ok-bg:#16332A;--bad:#FF8D84;--bad-bg:#40201F;--warn:#F0C265;--warn-bg:#3A2F15;
  --on:#101420;--focus:#E9ECF2;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--font);min-height:100vh;min-height:100dvh}
.shell{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
a{color:var(--si)}
main:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{line-height:1.25;margin:0}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0 0 12px}
b,strong{font-weight:700}
.mono,code{font-family:var(--mono);font-size:.94em}
.nb{white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;font-size:15px}
.top a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink2);text-decoration:none}
.top a:hover{text-decoration:underline}
.cr-btn{font:inherit;font-size:14px;color:var(--ink3);background:none;border:0;min-height:44px;padding:0 4px;cursor:pointer;text-decoration:underline}
.cr-btn:hover{color:var(--ink)}
dialog.cr{max-width:min(30rem,calc(100vw - 32px));width:100%;border:1px solid var(--line2);border-radius:14px;padding:20px 22px;background:var(--card);color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog.cr::backdrop{background:rgba(10,14,22,.55)}
dialog.cr h2{margin:0 0 12px;font-size:20px}
dialog.cr dl{margin:0 0 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px}
dialog.cr dt{color:var(--ink3)}
dialog.cr dd{margin:0}
dialog.cr p{margin:0 0 14px;font-size:15px;color:var(--ink2)}
dialog.cr button.cr-x{font:inherit;font-weight:700;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--ink);cursor:pointer}
.brand{display:flex;align-items:baseline;gap:8px;margin:2px 0 16px}
.brand small{color:var(--ink3);font-size:15px}
.lead{color:var(--ink2);margin:6px 0 18px}
.muted{color:var(--ink2)}
.small{font-size:15px}
.tiny{font-size:13.5px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:transparent}
.card h3{margin-bottom:6px}
.stack>*+*{margin-top:12px}
.btn{appearance:none;font:inherit;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.block{display:flex;width:100%}
.btn.quiet{border-color:var(--line2);font-weight:400;color:var(--ink2)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{min-height:44px;padding:8px 14px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.split{justify-content:space-between}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13.5px;font-weight:700;background:var(--line);color:var(--ink2)}
.pill.si{background:var(--si-bg);color:var(--si)}.pill.iec{background:var(--iec-bg);color:var(--iec)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.si-t{color:var(--si);font-weight:700}.iec-t{color:var(--iec);font-weight:700}

/* přehled kroků */
.steps{list-style:none;margin:0;padding:0}
.stepcard{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;min-height:76px}
.stepcard:hover{border-color:var(--line2)}
.stepcard .no{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700}
.stepcard.done .no{background:var(--ok);border-color:var(--ok);color:var(--on)}
.stepcard.rec{border-color:var(--si);box-shadow:0 0 0 1px var(--si)}
.stepcard h3{margin-bottom:2px}
.stepcard p{margin:0;color:var(--ink2);font-size:15.5px}
.pips{display:flex;gap:5px;margin-top:8px}
.pip{width:18px;height:6px;border-radius:3px;background:var(--line);}
.pip.k{background:var(--ok)}.pip.w{background:repeating-linear-gradient(45deg,var(--warn) 0 3px,transparent 3px 6px);outline:1.5px solid var(--warn);outline-offset:-1px}.pip.p{background:var(--si)}

/* průběh kroku */
.prog{display:flex;gap:4px;margin:4px 0 14px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--ink)}
.prog i.cur{background:var(--si)}
.eyebrow{font-size:14px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.nav2{display:flex;gap:10px;margin-top:16px}
.nav2 .btn{flex:1}
.nav2 .btn.back{flex:none;min-width:56px}

/* odpovědi */
.opts{display:grid;gap:10px;margin:14px 0}
.opt{appearance:none;font:inherit;text-align:left;min-height:56px;padding:12px 16px;border-radius:12px;border:2px solid var(--line2);background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:12px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--ink2)}
.opt .t{flex:1}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);color:var(--on)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);color:var(--on)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.numrow{display:flex;gap:10px;margin:14px 0 8px}
.num{flex:1;min-width:0;font:600 22px var(--mono);min-height:56px;padding:8px 14px;border-radius:12px;border:2px solid var(--line2);background:var(--card);color:var(--ink)}
.num:focus{border-color:var(--ink);outline:none}
.unit{align-self:center;font:600 18px var(--mono);color:var(--ink2);min-width:3ch}
.fb{border-radius:12px;padding:14px 16px;margin:12px 0;border:2px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb.info{background:var(--warn-bg);border-color:var(--warn)}
.fb h3{font-size:17px;margin-bottom:4px}
.fb p:last-child{margin-bottom:0}
.hint{background:var(--si-bg);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:16px}
details.sol{margin:8px 0 0}
details.sol summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
ol.calc{margin:6px 0 0;padding-left:22px}
ol.calc li{margin:4px 0}
.q{font-size:19px;font-weight:600;line-height:1.4}
.q .mono{font-weight:600}

/* pracovní prvky */
.worked li{margin:0 0 10px}
.wk{list-style:none;padding:0;margin:0}
.wk li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px;display:flex;gap:10px}
.wk li b.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px}
.wk li.res{border-color:var(--ok);background:var(--ok-bg)}
.wk li.res b.n{background:var(--ok);color:var(--on)}
.wk li.blank{border-style:dashed}
table.t{width:100%;border-collapse:collapse;font-size:15.5px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:13.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
table.t td.r,table.t th.r{text-align:right}
table.t td.m{font-family:var(--mono);font-size:14.5px}
.scroll{overflow-x:auto}

/* žebříček */
.ladder{display:flex;flex-direction:column;align-items:stretch;gap:0;margin:8px 0}
.rung{appearance:none;font:inherit;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 16px;border-radius:12px;border:2px solid var(--line2);background:var(--card);color:var(--ink);cursor:pointer;text-align:left}
.rung b{font-family:var(--mono);font-size:18px}
.rung span{font-size:14px;color:var(--ink3)}
.ladder.si .rung.sel{border-color:var(--si);background:var(--si-bg)}
.ladder.iec .rung.sel{border-color:var(--iec);background:var(--iec-bg)}
.ladder .gap{display:flex;align-items:center;justify-content:center;height:26px;font:600 14px var(--mono);color:var(--ink3)}
.ladder.si .gap{color:var(--si)}.ladder.iec .gap{color:var(--iec)}
.lres{min-height:52px}

/* bity */
.bits{display:flex;flex-wrap:nowrap;justify-content:center;gap:2px;margin:10px 0}
.card.bitcard{padding-left:6px;padding-right:6px}
.bit{appearance:none;font:700 22px var(--mono);height:56px;flex:0 0 calc((100% - 14px) / 8);min-width:0;padding:0;border-radius:10px;border:2px solid var(--line2);background:var(--card);color:var(--ink3);cursor:pointer}
.bit.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.bitval{text-align:center;font:600 20px var(--mono)}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
.stepper b{font:700 20px var(--mono);min-width:7ch;text-align:center}
.sq{width:44px;height:44px;padding:0}

/* konvertor */
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-weight:700;font-size:15px;color:var(--ink2)}
select,input.txt{font:inherit;font-size:18px;min-height:52px;padding:8px 12px;border-radius:12px;border:2px solid var(--line2);background:var(--card);color:var(--ink);width:100%}
input.txt{font-family:var(--mono);font-weight:600}
.res{font:700 26px/1.3 var(--mono);word-break:break-word}
.seg{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:14px}
.seg a{flex:1;text-align:center;text-decoration:none;color:var(--ink2);min-height:44px;display:grid;place-items:center;border-radius:9px;font-weight:700;font-size:15px}
.seg a.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.swap{align-self:end}
.bars{display:grid;gap:6px;margin-top:6px}
.bar{height:14px;border-radius:7px}
.bar.si{background:var(--si)}.bar.iec{background:var(--iec)}
.cmp{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;align-items:center;font-size:15px}
.cmp b{font-family:var(--mono)}

/* spodní lišta */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;color:var(--ink3);text-decoration:none;font-size:13.5px;font-weight:700;position:relative}
.tabbar a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--ink)}
.tabbar a.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:var(--on);font-size:12px;display:grid;place-items:center;padding:0 5px}
footer.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--ink3)}
footer.foot p{margin:0 0 4px}
.copybox{font:500 13px/1.4 var(--mono);width:100%;min-height:96px;padding:10px;border-radius:12px;border:2px solid var(--line2);background:var(--card);color:var(--ink);resize:vertical;word-break:break-all}
.big{font:700 40px/1 var(--mono)}
.qbox{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){:root:not([data-rm]) .opt,:root:not([data-rm]) .btn,:root:not([data-rm]) .rung{transition:background-color .15s,border-color .15s}}
@media print{.tabbar,.top,.nav2,.seg{display:none}body{background:#fff;color:#000}.card{break-inside:avoid;box-shadow:none}}
@media (min-width:700px){body{font-size:18px}.shell{padding-top:8px}}

sup,sub{font-size:max(13px,.75em)}
details.svp summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700}

.btn.primary[disabled]{background:transparent;color:var(--ink3);border:2px dashed var(--line2);opacity:1}
.gate{text-align:center;margin:8px 0 0}
.sernote{margin:10px 0 0;line-height:2}
.sernote .pill{min-width:56px;text-align:center;margin-right:6px;border:1.5px solid currentColor;line-height:1.4}

/* ilustrace */
.ill{margin:4px 0 14px;text-align:center}
.ill svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.ill .st{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ill .fc{fill:var(--card)}.ill .fi{fill:var(--ink)}
.ill rect.st:not(.fc):not(.fi){fill:none}
.ill .cellbox{stroke:var(--ink);stroke-width:1.5}
.ill .stsi{fill:var(--si-bg);stroke:var(--si);stroke-width:2.5}
.ill .stiec{fill:var(--iec-bg);stroke:var(--iec);stroke-width:2.5}
.ill .stsi2{stroke:var(--si);fill:none}.ill .stiec2{stroke:var(--iec);fill:none}
.ill text{font-family:var(--mono);fill:var(--ink)}
.ill .num{font-size:26px;font-weight:700}
.ill .num.s{font-size:16px}
.ill .cell{font-size:16px;font-weight:700;fill:var(--ink)}.ill .cell.on{fill:var(--card)}
.ill .un{font-size:17px;font-weight:700}
.ill .un.si{fill:var(--si)}.ill .un.iec{fill:var(--iec)}
.ill .cap{font-family:var(--font);font-size:14px;fill:var(--ink2)}

/* dvojková soustava */
.bitcol{flex:0 0 calc((100% - 14px) / 8);min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.bitcol .bit{flex:none;width:100%}
.wt{font:600 13.5px var(--mono);color:var(--ink3)}
.bit[disabled]{cursor:default;opacity:1}
.plus{display:inline-block;vertical-align:middle;margin-left:.4em;padding:.1em .5em;border-radius:4px;background:#1b2a4a;color:#fff;font:700 12px/1.4 var(--font);letter-spacing:.08em;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .plus{background:#9db0d8;color:#0f161b}}
:root[data-theme="dark"] .plus{background:#9db0d8;color:#0f161b}
.gscroll{overflow-x:auto;margin:10px 0}

/* šestnáctková soustava */
.sw{display:inline-block;width:26px;height:26px;border-radius:6px;border:2px solid var(--ink);vertical-align:middle;margin-right:6px}
.card.gridcard{padding-left:6px;padding-right:6px}
.ng{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 8px;margin:10px 0}
.nbk{display:flex;flex-direction:column;align-items:center}
.nbits{display:flex;gap:2px}
.nar{font:700 16px/1 var(--mono);color:var(--ink3);height:24px;display:grid;place-items:center}
.nhx{display:flex;justify-content:center}
.gf,.gc{width:40px;height:44px;display:grid;place-items:center;font:700 22px var(--mono);color:var(--ink);text-align:center;padding:0}
.gf.gs{color:var(--si)}
.gf.gq{border:2px dashed var(--line2);border-radius:8px}
.nhx .gf,.gc.gh{width:56px;font-size:24px}
.nhx .gf{border:2px solid var(--ink);border-radius:8px}
.nhx .gf.gs{border-color:var(--si)}
.gc{border:2px solid var(--line2);border-radius:8px;background:var(--card)}
.gc:focus{border-color:var(--ink);outline:none;background:var(--si-bg)}
.gc.ok{border-color:var(--ok);background:var(--ok-bg)}
.gc.bad{border-color:var(--bad);background:var(--bad-bg)}
.gc:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
@media (max-width:380px){.nbits .gc,.nbits .gf{width:36px}.ng{gap:12px 6px}}
.hb{display:flex;justify-content:center;gap:8px;margin:10px 0}
.hbg{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.hb:not(.two) .hbg{max-width:240px}
.hbits{display:flex;gap:2px;width:100%}
.hbits .bitcol{flex:1 1 0}
.hbits .bit{height:52px;font-size:20px}
.hdig{font:700 30px/1.1 var(--mono)}
.hsum{font:500 13.5px var(--mono);color:var(--ink3);min-height:20px;text-align:center}
@media (max-width:379px){.hb.two{flex-direction:column}}
footer.foot{margin-top:28px}
</style>

<body>
<div id="root"></div>
<dialog class="cr" id="credits" aria-labelledby="cr-h">
  <h2 id="cr-h">Autor a licence</h2>
  <dl>

<script>
'use strict';
/* ===== pomocné funkce ===== */
const NB = ' ';

const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const dateCz = d => { const x = new Date(d * 864e5); return x.getUTCDate() + '. ' + (x.getUTCMonth() + 1) + '. ' + x.getUTCFullYear(); };

/* číslo v české úpravě: mezera po tisících, desetinná čárka */
function fmt(n, sig = 10) {

/* vstup od žáka: čárka nebo tečka, mezery se ignorují */

/* ===== úložiště postupu ===== */
const KEY = 'sestnactkova-soustava:v1';
const INT = [0, 1, 2, 4, 8, 16, 32];
let S;
function defState() { return { i: {}, st: {}, pl: null, g: { best: 0, b2: 0, n: 0 }, th: 'auto', rm: false, fl: {}, cal: [0, 0, 0, 0, 0, 0, 0] }; }

  try { const o = JSON.parse(localStorage.getItem(KEY)); if (o && typeof o === 'object') { const d = Object.assign(defState(), o); if (!Array.isArray(d.cal) || d.cal.length !== 7 || d.cal.some(x => !Number.isFinite(x))) d.cal = [0, 0, 0, 0, 0, 0, 0]; return d; } } catch (e) {}

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
S = load();
const M = k => S.i[k] || null;
function record(skill, ok, hinted) {

const dueList = () => Object.keys(S.i).filter(k => S.i[k].d <= today()).sort((a, b) => (S.i[a].b - S.i[b].b) || (S.i[a].d - S.i[b].d));
const pipState = k => { const m = M(k); if (!m) return ''; if (m.b >= 2) return 'k'; if (m.b === 0 && m.bad > 0) return 'w'; return 'p'; };
/* ===== šestnáctková soustava: pomocné funkce ===== */
const HX = '0123456789ABCDEF';
const bn = (n, w) => { let s = n.toString(2); if (w) s = s.padStart(w, '0'); return s; };

const B2r = s => `<span class="mono nb">${s}<sub>2</sub></span>`;
const H16 = v => `<span class="mono nb">${typeof v === 'number' ? hx(v) : v}<sub>16</sub></span>`;
const rev = s => s.split('').reverse().join('');
const bl = n => n.toString(2).length;
const nibsOf = (v, n) => bn(v, n * 4).match(/.{4}/g);
const decomp4 = x => x === 0 ? '0' : [8, 4, 2, 1].filter(w => x & w).join(' + ');
function parseBin(s) { s = String(s).replace(/[\s  ]/g, ''); if (!/^[01]+$/.test(s) || s.length > 40) return NaN; return parseInt(s, 2); }

/* ===== generování úloh ===== */
const lab = (v, unit, sig) => fmt(v, sig || 10) + (unit ? NB + unit : '');
function mk(o) {

/* odpověď dvojkově: o.ans = hodnota, o.w = počet bitů (násobek čtyř); chybná volba je hodnota nebo řetězec bitů */
function mkb2(o) {

/* odpověď šestnáctkově: o.ans = hodnota, o.dig = počet číslic; chybná volba je hodnota nebo řetězec číslic */
function mkh(o) {

function mkc(o, keepOrder) { o.opts = keepOrder ? o.opts : shuffle(o.opts); o.kind = 'choice'; return o; }

/* úroveň náročnosti podle zvládnutí dovednosti: 0 začínám, 1 umím, 2 zvládnuto */
const lvl = k => { const m = M(k), b = m ? m.b : 0; return b >= 4 ? 2 : b >= 2 ? 1 : 0; };

/* postup převodu dvojková → šestnáctková */

const GEN = {};

}

const ICONS = {

};
function shell(tab, inner) {
  const due = dueList().length;
  return `<div class="shell"><div class="top"><a href="../">← Všechny školní aplikace</a><button type="button" class="cr-btn" data-credits aria-haspopup="dialog">Autor a licence</button></div><div class="brand"><h1>Šestnáctková soustava</h1><small>rychlé učení</small></div><main id="main" tabindex="-1">${inner}</main><footer class="foot"><p>Autor: Ivo Bešťák · Licence CC BY 4.0 · Aktualizace: 16. 11. 2026</p></footer></div>
  <div class="tabbar"><nav aria-label="Hlavní navigace"><a href="#/" class="${tab === 'uc' ? 'on' : ''}" ${tab === 'uc' ? 'aria-current="page"' : ''}>${ICONS.learn}Učit se</a><a href="#/dnes" class="${tab === 'dnes' ? 'on' : ''}" ${tab === 'dnes' ? 'aria-current="page"' : ''}>${ICONS.today}Na dnešek${due ? `<span class="badge" aria-label="k opakování: ${due}">${due}</span>` : ''}</a><a href="#/nastroje" class="${tab === 'nastroje' ? 'on' : ''}" ${tab === 'nastroje' ? 'aria-current="page"' : ''}>${ICONS.tools}Nástroje</a></nav></div>`;
}
const APP = () => $('#root');
function mount(tab, inner, after) {
  APP().innerHTML = shell(tab, inner);
  const m = $('#main'); if (after) after(m);
  m.focus({ preventScroll: true }); window.scrollTo(0, 0);
}

function pips(st) { return `<div class="pips" aria-label="Dovednosti: ${st.skills.filter(k => pipState(k) === 'k').length} z ${st.skills.length} zvládnuté">${st.skills.map(k => `<span class="pip ${pipState(k)}" title="${SKILLS[k]}"></span>`).join('')}</div>`; }
const plusNote = `<div class="card"><p class="small" style="margin:0"><span class="plus" style="margin:0">PLUS</span> Tento krok jde nad rámec učiva přiřazených ročníků. Je dobrovolný a pomáhá počítat rychleji a bezpečněji.</p></div>`;
const fshow = sc => sc.hex ? hx(sc.ans) : sc.bin ? g4(bn(sc.ans)) : fmt(sc.ans);
const goalCard = (st, after) => `<div class="card goal"><h3>${after ? 'Umíš to teď?' : 'Cíl kroku'}</h3><p class="small muted" style="margin:0 0 4px">${after ? 'Cíl byl: po kroku umíš' : 'Po tomto kroku umíš:'}</p><ul class="small" style="margin:0;padding-left:20px">${st.can.map(x => `<li style="margin:3px 0">${x}</li>`).join('')}</ul><p class="tiny" style="margin:8px 0 0">${after ? 'Ověřil jsi to v procvičení. Co se nepovedlo, vrátí se v části Na dnešek.' : 'Ověříš to v procvičení na konci kroku.'}</p></div>`;
function stepView(n, i) {
  const st = STEPS[n - 1]; if (!st) return home();
  const sc = st.screens[i]; if (!sc) return home();
  const total = st.screens.length, gating = ['tip', 'worked', 'fade', 'gridfade', 'practice'].includes(sc.t);
  const last = i === total - 1;
  const inner = `<div class="prog" aria-hidden="true">${st.screens.map((_, k) => `<i class="${k < i ? 'on' : k === i ? 'cur' : ''}"></i>`).join('')}</div>
  <p class="eyebrow">Krok ${n} · ${st.title}${st.plus ? ' <span class="plus">PLUS</span>' : ''}</p>${i === 0 ? goalCard(st) + (st.plus ? plusNote : '') : ''}<h2 id="sh" style="margin-bottom:12px">${sc.h || ({ tip: 'Nejdřív tip', practice: 'Procvič si to', sum: 'Shrnutí' }[sc.t])}</h2><div id="body"></div>${sc.t === 'sum' ? goalCard(st, true) : ''}
  <div class="nav2"><a class="btn back" ${i > 0 ? `href="#/krok/${n}/${i - 1}"` : 'href="#/"'} aria-label="Zpět">←</a><button class="btn primary" id="nx" ${gating ? 'disabled' : ''}>${last ? 'Hotovo' : 'Pokračovat'}</button></div>${gating ? `<p class="tiny gate" id="gate">${{ tip: 'Vyber odpověď, pak můžeš pokračovat.', worked: 'Projdi všechny kroky příkladu.', fade: 'Doplň poslední krok.', gridfade: 'Doplň pole a zkontroluj je.', practice: 'Dokonči procvičení.' }[sc.t]}</p>` : ''}`;
  mount('uc', inner, m => {
    const body = $('#body', m), nx = $('#nx', m), unlock = () => { nx.disabled = false; const g = $('#gate', m); if (g) g.remove(); };
    nx.onclick = () => {
      if (last) { S.st[n] = today(); save(); location.hash = n < STEPS.length ? `#/krok/${n + 1}/0` : '#/'; }
      else location.hash = `#/krok/${n}/${i + 1}`;
    };
    if (S.st[n] && gating) unlock();
    if (sc.t === 'txt') { body.innerHTML = sc.html; mountVis(body); }
    else if (sc.t === 'sum') {
      body.innerHTML = `<div class="card"><ul style="margin:0;padding-left:20px">${sc.items.map(x => `<li style="margin:6px 0">${x}</li>`).join('')}</ul></div>${n < STEPS.length ? `<p class="small muted">Dál: krok ${n + 1}, ${STEPS[n].title}.</p>` : '<p class="small muted">To je poslední krok. Opakování najdeš v části Na dnešek.</p>'}`;
    } else if (sc.t === 'tip') {
      body.innerHTML = `<div class="card" data-nocolor><p class="q">${sc.q}</p><p class="small muted" style="margin:6px 0 0">Tip bez hodnocení: zkus odhadnout, ještě to nemusíš umět.</p></div><div class="opts" data-nocolor>${sc.opts.map((p, k) => `<button class="opt" data-i="${k}"><span class="k">${LETTER[k]}</span><span class="t">${p.t}</span></button>`).join('')}</div><div id="fb" aria-live="polite"></div>`;
      body.querySelector('.opts').onclick = e => {
        const b = e.target.closest('.opt'); if (!b || b.disabled) return;
        const p = sc.opts[+b.dataset.i];
        $$('.opt', body).forEach((x, k) => { x.disabled = true; if (sc.opts[k].ok) x.classList.add('ok'); else if (x === b) x.classList.add('bad'); else x.classList.add('dim'); });
        $$('[data-nocolor]', body).forEach(e => e.removeAttribute('data-nocolor'));
        $('#fb', body).innerHTML = `<div class="fb ${p.ok ? 'ok' : 'info'}"><h3>${p.ok ? 'Přesně tak' : 'Zatím ne, a to je v pořádku'}</h3>${p.ok ? '' : `<p>${p.why}</p>`}<p>${sc.reveal}</p></div>`;
        unlock();
      };
    } else if (sc.t === 'worked') {
      let shown = 1;
      const draw = () => {
        body.innerHTML = `<div class="card"><p class="q" style="margin:0">${sc.q}</p></div><ol class="wk">${sc.steps.slice(0, shown).map((s, k) => `<li class="${k === sc.steps.length - 1 ? 'res' : ''}"><b class="n">${k + 1}</b><span>${s}</span></li>`).join('')}</ol>${shown < sc.steps.length ? '<button class="btn block" id="more">Další krok</button>' : ''}`;
        if (shown < sc.steps.length) { const mb = $('#more', body); mb.onclick = () => { shown++; draw(); const m2 = $('#more', body); (m2 || nx).focus({ preventScroll: true }); }; } else unlock();
      };
      draw();
    } else if (sc.t === 'fade') {
      const kind = sc.hex ? 'hex' : sc.bin ? 'bin' : 'num', suf = kind === 'hex' ? '<sub>16</sub>' : kind === 'bin' ? '<sub>2</sub>' : (sc.unit ? ' ' + sc.unit : '');
      body.innerHTML = `<div class="card"><p class="q" style="margin:0">${sc.q}</p></div><ol class="wk">${sc.shown.map((s, k) => `<li><b class="n">${k + 1}</b><span>${s}</span></li>`).join('')}<li class="blank"><b class="n">${sc.shown.length + 1}</b><span>${sc.blank}</span></li></ol>
      <div class="numrow"><input class="num" id="ans" inputmode="${kind === 'num' ? 'decimal' : kind === 'bin' ? 'numeric' : 'text'}" autocomplete="off" autocapitalize="${kind === 'hex' ? 'characters' : 'none'}" spellcheck="false" enterkeyhint="done" aria-label="Doplň výsledek" placeholder="${kind === 'hex' ? '3F' : kind === 'bin' ? '0101' : '?'}"><span class="unit">${kind === 'num' ? sc.unit : suf}</span></div><button class="btn primary block" id="chk">Zkontrolovat</button><div id="fb" aria-live="polite"></div>`;
      const inp = $('#ans', body); let tries = 0;
      const check = () => {
        const u = kind === 'hex' ? parseHex(inp.value) : kind === 'bin' ? parseBin(inp.value) : parseNum(inp.value); if (!isFinite(u)) { $('#fb', body).innerHTML = `<div class="fb info"><p>${kind === 'hex' ? 'Zapiš číslice 0 až 9 a písmena A až F.' : kind === 'bin' ? 'Zapiš jen nuly a jedničky.' : 'Zapiš číslo.'}</p></div>`; return; }
        const ok = u === sc.ans; tries++;
        if (ok) { inp.disabled = true; $('#chk', body).disabled = true; $('#fb', body).innerHTML = `<div class="fb ok"><h3>Správně</h3><p><b class="mono">${sc.blank} ${fshow(sc)}${suf}</b></p></div>`; unlock(); }
        else if (tries < 2) { $('#fb', body).innerHTML = '<div class="fb info"><h3>Ještě ne</h3><p>Zkus to znovu. Projdi výše uvedené kroky a zkontroluj každou číslici.</p></div>'; inp.select(); }
        else { inp.disabled = true; $('#chk', body).disabled = true; $('#fb', body).innerHTML = `<div class="fb bad"><h3>Správně je ${fshow(sc)}${suf}</h3><p>Pokračuj, v procvičování si to zopakuješ.</p></div>`; unlock(); }
      };
      $('#chk', body).onclick = check; inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    } else if (sc.t === 'gridfade') {
      runTasks(body, [{ fixed: sc.make() }], { record: false, retry: false, single: true, onFinish: unlock });
    } else if (sc.t === 'practice') {
      runTasks(body, sc.skills.map(skill => ({ skill })), { doneTitle: 'Procvičeno', onFinish: unlock });
    }
  });
}

function todayView() {
  const due = dueList(), known = Object.keys(S.i);
  const run = (host, specs, title) => runTasks(host, specs, { doneTitle: title, onFinish: () => { host.insertAdjacentHTML('beforeend', '<a class="btn block" href="#/dnes" style="margin-top:12px">Zpět</a>'); const b = $('.badge'); if (b) b.remove(); } });
  const early = !known.length;
  const nextDue = known.length ? Math.min(...known.map(k => S.i[k].d)) : null;
  const inner = `<h2>Na dnešek</h2>${early ? '<p class="lead">Tady se ti budou vracet úlohy, které potřebuješ zopakovat. Začni prvním krokem, po jeho procvičení se tu něco objeví.</p><a class="btn primary block" href="#/krok/1/0">Jít na krok 1</a>' : due.length ? `<p class="lead">K opakování je <b>${due.length}</b> ${due.length === 1 ? 'dovednost' : due.length < 5 ? 'dovednosti' : 'dovedností'}. Úlohy se střídají, ať se nenaučíš jen pořadí.</p><button class="btn primary block" id="go">Začít opakování</button><p class="small muted" style="margin-top:12px">${due.slice(0, 8).map(k => SKILLS[k]).join(' · ')}</p>` : `<div class="card"><h3>Pro dnešek hotovo</h3><p class="muted">Další opakování ${nextDue > today() ? (nextDue - today() === 1 ? 'zítra' : `za ${nextDue - today()} dní (${dateCz(nextDue)})`) : 'brzy'}. Chceš si ale zacvičit navíc?</p></div><button class="btn block" id="extra">Procvičit navíc</button>`}
  ${S.fl.pwa || early ? '' : `<div class="card" style="margin-top:16px"><h3>Aby se postup neztratil</h3><p class="small muted">Postup se ukládá jen v tomto prohlížeči. Na iPhonu se data neotevřených webů po týdnu mažou. Přidej si aplikaci na plochu (Sdílet → Přidat na plochu, na Androidu menu ⋮ → Přidat na plochu) a zálohu najdeš v Nástroje → Postup.</p><button class="btn quiet sm" id="pwa">Rozumím</button></div>`}`;

      $$('.opt', host).forEach(el => { el.disabled = true; if (+el.dataset.v === big) el.classList.add('ok'); else if (el === b) el.classList.add('bad'); else el.classList.add('dim'); });
      const sm = x < y ? x : y;
      $('#fb', host).innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}"><h3>${ok ? 'Správně' : 'Ne tak docela'}</h3><p>${H16(show(big))} = ${hexExpr(show(big))} = ${big}, ${H16(show(sm))} = ${hexExpr(show(sm))} = ${sm}.</p><p class="small">Nejdřív porovnej počet číslic, pak číslice zleva. Písmena jsou čísla: A = 10 … F = 15.</p></div><button class="btn primary block" id="nx2" style="margin-top:12px">${k + 1 >= N ? 'Výsledek' : 'Další'}</button>`;
      $('#nx2', host).onclick = () => { k++; k >= N ? end() : ask(); window.scrollTo(0, 0); }; $('#nx2', host).focus({ preventScroll: true });
    };
  };
  const end = () => { gameEnd(host, 'b2', score, N, score >= 5 ? 'Číslice A až F už nejsou záhada.' : 'Připomeň si: A = 10 … F = 15 a po F následuje 10 (šestnáct).').onclick = () => gameLarger(host); };
  ask();
}


/* ===== nástroje ===== */
const TOOLTABS = [['prevodnik', 'Převodník'], ['tahak', 'Tahák'], ['hra', 'Hry'], ['postup', 'Postup']];
function tools(tab) {
  tab = TOOLTABS.some(t => t[0] === tab) ? tab : 'prevodnik';
  const seg = `<nav class="seg" aria-label="Nástroje">${TOOLTABS.map(([k, n]) => `<a href="#/nastroje/${k}" class="${k === tab ? 'on' : ''}" ${k === tab ? 'aria-current="page"' : ''}>${n}</a>`).join('')}</nav>`;
  mount('nastroje', seg + '<div id="tool"></div>', m => ({ prevodnik: converter, tahak: cheat, hra: games, postup: progress }[tab])($('#tool', m)));
}

/* ===== postup, záloha, nastavení ===== */
function encode() {
  const c = { v: 1, i: {}, st: S.st, g: S.g.best, g2: S.g.b2 || 0, cal: S.cal };
  for (const k in S.i) { const m = S.i[k]; c.i[k] = [m.b, m.d, m.ok, m.bad]; }
  const j = JSON.stringify(c), b = btoa(unescape(encodeURIComponent(j))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  let h = 0; for (let i = 0; i < b.length; i++) h = (h * 31 + b.charCodeAt(i)) % 65521;
  return 'SS1.' + b + '.' + h.toString(16);
}
function decode(code) {
  const p = String(code).trim().split('.'); if (p.length !== 3 || p[0] !== 'SS1') throw 0;
  let h = 0; for (let i = 0; i < p[1].length; i++) h = (h * 31 + p[1].charCodeAt(i)) % 65521;
  if (h.toString(16) !== p[2]) throw 0;
  const c = JSON.parse(decodeURIComponent(escape(atob(p[1].replace(/-/g, '+').replace(/_/g, '/')))));
  if (c.v !== 1 || typeof c.i !== 'object') throw 0; return c;
}
function mergeIn(c) {
  for (const k in c.i) { if (!(k in SKILLS)) continue; const a = c.i[k]; if (!Array.isArray(a) || a.some(x => !Number.isFinite(x))) continue; const m = S.i[k]; if (!m || a[2] + a[3] > m.ok + m.bad) S.i[k] = { b: Math.max(0, Math.min(6, a[0])), d: a[1], ok: a[2], bad: a[3] }; }
  for (const k in (c.st || {})) if (+k >= 1 && +k <= STEPS.length && Number.isFinite(c.st[k])) S.st[k] = Math.min(S.st[k] || 1e9, c.st[k]);
  if (Number.isFinite(c.g)) S.g.best = Math.max(S.g.best, c.g);
  if (Number.isFinite(c.g2)) S.g.b2 = Math.max(S.g.b2 || 0, c.g2);
  if (Array.isArray(c.cal) && c.cal.length === 7 && c.cal.every(x => Number.isFinite(x) && x >= 0) && c.cal.reduce((a, b) => a + b, 0) > S.cal.reduce((a, b) => a + b, 0)) S.cal = c.cal.slice();
  save();
}
function applyTheme() { const r = document.documentElement; if (S.th === 'light' || S.th === 'dark') r.dataset.theme = S.th; else delete r.dataset.theme; if (S.rm) r.dataset.rm = '1'; else delete r.dataset.rm; }
function calCard() {
  const c = S.cal, tot = c[1] + c[3] + c[5], nv = c[6];
  if (tot + nv === 0) return '<div class="card"><h3>Odhad jistoty</h3><p class="small muted">Při procvičování můžeš před odpovědí označit, jak jsi si jistý. Tady pak uvidíš, jestli tvoje jistota odpovídá výsledkům.</p></div>';
  const rows = [['Jistě', 0], ['Spíš ano', 2], ['Hádám', 4]].map(([n, j]) => `<tr><td>${n}</td><td class="r">${c[j + 1] ? `${c[j]} z ${c[j + 1]}` : '–'}</td><td class="r">${c[j + 1] ? Math.round(100 * c[j] / c[j + 1]) + ' %' : ''}</td></tr>`).join('');
  const pc = j => c[j + 1] ? c[j] / c[j + 1] : null;
  let msg = 'Zatím je málo odpovědí na závěr. Pokračuj a přehled se zpřesní.';
  if (c[1] >= 5 && pc(0) < .8) msg = 'Když si jsi jistý, mýlíš se častěji, než čekáš. Před odpovědí si ověř váhy, přenos a zpětnou kontrolu.';
  else if (c[5] >= 5 && pc(4) >= .7) msg = 'Když hádáš, trefuješ se často. Umíš víc, než si myslíš.';
  else if (c[1] >= 5 && pc(0) >= .8) msg = 'Tvoje jistota odpovídá výsledkům.';
  return `<div class="card"><h3>Odhad jistoty</h3><table class="t"><thead><tr><th>Řekl jsi</th><th class="r">Správně</th><th class="r">Podíl</th></tr></thead><tbody>${rows}</tbody></table><p class="small" style="margin:10px 0 0">Odpovědí „Nevím“: <b>${nv}</b>. ${msg}</p><p class="tiny" style="margin:6px 0 0">Počítá se správně na první pokus, bez nápovědy.</p></div>`;
}
function progress(host) {
  const labels = { k: 'zvládnuto', w: 'slabé', p: 'učím se', '': 'nezačato' };
  const code = encode();
  host.innerHTML = `<div class="card"><h3>Dovednosti</h3><table class="t"><tbody>${Object.keys(SKILLS).map(k => { const s = pipState(k), m = M(k); return `<tr><td>${SKILLS[k]}</td><td class="r"><span class="pill ${s === 'k' ? 'ok' : s === 'w' ? 'warn' : s === 'p' ? 'si' : ''}">${labels[s]}</span>${m ? `<br><span class="tiny">další ${m.d <= today() ? 'dnes' : dateCz(m.d)}</span>` : ''}</td></tr>`; }).join('')}</tbody></table></div>
  ${calCard()}
  <div class="card"><h3>Záloha postupu</h3><p class="small muted">Postup je jen v tomto prohlížeči. Zkopíruj kód a vlož ho na jiném zařízení.</p><textarea class="copybox" id="code" readonly aria-label="Kód zálohy">${code}</textarea><div class="row" style="margin:8px 0 16px"><button class="btn sm" id="cp">Kopírovat kód</button><span id="cpm" class="small muted" aria-live="polite"></span></div>
  <div class="field"><label for="imp">Vložit kód z jiného zařízení</label><textarea class="copybox" id="imp" style="min-height:70px" placeholder="SS1.…"></textarea></div><button class="btn sm" id="im">Načíst (sloučí se s tímto postupem)</button><p id="imm" class="small" aria-live="polite" style="margin-top:8px"></p></div>
  <div class="card"><h3>Přidat na plochu</h3><p class="small"><b>iPhone / iPad (Safari):</b> Sdílet → Přidat na plochu.<br><b>Android (Chrome):</b> menu ⋮ → Přidat na plochu / Instalovat.</p></div>
  <div class="card"><h3>Vzhled</h3><div class="row" role="group" aria-label="Motiv">${[['auto', 'Podle systému'], ['light', 'Světlý'], ['dark', 'Tmavý']].map(([v, n]) => `<button class="btn sm ${S.th === v ? 'primary' : ''}" data-th="${v}" aria-pressed="${S.th === v}">${n}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn sm ${S.rm ? 'primary' : ''}" id="rm" aria-pressed="${!!S.rm}">Omezit animace: ${S.rm ? 'zapnuto' : 'vypnuto'}</button></div></div>
  <div class="card"><h3>Smazat postup</h3><p class="small muted">Vymaže opakování, hotové kroky i rekord ve hře v tomto prohlížeči.</p><button class="btn sm" id="rs">Smazat postup</button></div>`;
  $('#cp', host).onclick = async () => { const ta = $('#code', host); try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); document.execCommand('copy'); } $('#cpm', host).textContent = 'Zkopírováno.'; };
  $('#im', host).onclick = () => { const m = $('#imm', host); try { const c = decode($('#imp', host).value); mergeIn(c); m.textContent = 'Postup načten.'; setTimeout(route, 700); } catch (e) { m.textContent = 'Kód se nepodařilo přečíst. Zkopíruj ho celý, od SS1 po konec.'; } };
  $$('[data-th]', host).forEach(b => b.onclick = () => { S.th = b.dataset.th; save(); applyTheme(); progress(host); });
  $('#rm', host).onclick = () => { S.rm = !S.rm; save(); applyTheme(); progress(host); };
  const rs = $('#rs', host); rs.onclick = () => { if (rs.dataset.c) { S = defState(); save(); applyTheme(); location.hash = '#/'; route(); } else { rs.dataset.c = 1; rs.textContent = 'Opravdu smazat? Klepni znovu'; } };
}

/* ===== směrování ===== */
function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const r = p[0] || '';
  try {
    if (r === 'krok') stepView(+p[1], +p[2] || 0);
    else if (r === 'dnes') todayView();
    else if (r === 'nastroje') tools(p[1]);
    else if (r === 'test') placement();
    else home();
  } catch (e) { APP().innerHTML = '<div class="shell"><p>Něco se pokazilo. <a href="#/">Zpět na začátek</a></p></div>'; console.error(e); }
}
window.addEventListener('hashchange', route);
applyTheme();
route();
window.__SS = { GEN, SKILLS, taskFor, STEPS, encode, decode, dueList, bn, hx, g4, parseHex, parseBin, nGrid, S: () => S };
</script>
