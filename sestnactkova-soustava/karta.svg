<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="640" height="240" role="img"><title>Dobromyslná postavička ukazuje, že čtveřice bitů 1010 a 1111 se zapíšou jako šestnáctkové číslice A a F</title><defs>
