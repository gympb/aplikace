:root{--hd:#20262F;--tile:#2B313A;--bg:#F2F3F5;--card:#fff;--tx:#1F2329;--mut:#646B76;--pri:#D7262E;--pri2:#B21E25;--ok:#15803d;--okb:#dcfce7;--ko:#b91c1c;--kob:#fee2e2;--bd:#E3E5E9;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171C;--card:#1E232B;--tx:#EEF0F3;--mut:#9AA3AE;--bd:#2E3540;--ok:#4ade80;--okb:#12341f;--ko:#f87171;--kob:#3b1618;--pri:#E5383F}}
:root[data-theme="dark"]{--bg:#14171C;--card:#1E232B;--tx:#EEF0F3;--mut:#9AA3AE;--bd:#2E3540;--ok:#4ade80;--okb:#12341f;--ko:#f87171;--kob:#3b1618;--pri:#E5383F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 'Outfit',system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px;min-height:100vh}
header{background:var(--hd);color:#fff;padding:18px 18px 26px;display:flex;align-items:flex-end;gap:8px;max-width:560px;margin:0 auto;position:relative;box-shadow:0 0 0 100vmax var(--hd);clip-path:inset(0 -100vmax)}
header .ht{flex:1;padding:0 120px 30px 0;position:relative;z-index:1;pointer-events:none}
header h1{margin:0;font-size:31px;line-height:1.02;font-weight:800;letter-spacing:-.01em}header h1 span{color:var(--pri);display:block}
header p{margin:8px 0 0;color:#C9CED6;font-size:15px}
header .mw{position:absolute;right:0;bottom:0;width:168px;z-index:0;cursor:pointer;-webkit-tap-highlight-color:transparent}header .mw:focus{outline:none}header .masc{width:100%;height:auto;display:block;pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14%);mask-image:linear-gradient(to right,transparent 0,#000 14%)}
header.cm{padding:12px 16px 30px}header.cm .ht{padding-bottom:4px}header.cm h1{font-size:20px}header.cm h1 span{display:inline;margin-left:6px}header.cm p,header.cm .sv{display:none}header .sv{position:absolute;left:180px;top:22px;z-index:2;font-family:'Caveat','Segoe Print','Bradley Hand','Noteworthy','Comic Sans MS',cursive;font-size:21px;font-weight:700;color:#fff;transform:rotate(-10deg);transform-origin:left center;white-space:nowrap;pointer-events:none}@media (max-width:380px){header .sv{font-size:18px;top:22px;left:178px}header .mw{width:150px}}footer.ver{max-width:560px;margin:0 auto;background:var(--bg);text-align:center;font-size:11px;color:var(--mut);padding:6px 16px 14px}header.cm .mw{display:none}header.cm .ht{padding-right:0}
main{position:relative;z-index:1;background:var(--bg);border-radius:30px 30px 0 0;margin:-26px auto 0;padding:22px 16px 24px;max-width:560px;min-height:calc(100vh - 160px)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #0000000a}
h2{font-size:18px;margin:8px 2px 10px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.hello h2{font-size:26px;line-height:1.2;margin:0 0 16px}.hello p{margin:0 0 16px;color:var(--mut);font-size:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tl{position:relative;text-align:left;border:0;border-radius:16px;padding:16px 14px;min-height:136px;background:var(--tile);color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.tl.red{background:var(--pri)}.tl svg.ic{position:absolute;left:14px;top:14px}.tl b{font-size:19px}.tl small{font-size:13px;opacity:.82}.tl .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);opacity:.9}
.lh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}.lh b{display:flex;align-items:center;gap:8px;font-size:17px}.lh button{border:0;background:none;color:var(--pri);font:inherit;font-weight:600;font-size:14px;padding:8px 0;cursor:pointer}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}.li:first-of-type{border-top:0}.li .bx{width:22px;height:22px;border:2px solid var(--mut);border-radius:6px;flex-shrink:0}.li div{flex:1;min-width:0}.li small{color:var(--mut)}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;white-space:nowrap}
.gc{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;padding:0 6px;border-radius:9px;background:var(--tile);color:#fff;font-weight:700;font-size:14px;vertical-align:middle}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px;text-align:left;color:var(--tx);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.g .gc{align-self:flex-start}.g.on{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset}.g.on .gc{background:var(--pri)}
.g b{display:block;font-size:15px;line-height:1.2}
.bar{height:7px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px 4px;border-radius:10px;font:inherit;font-size:14px;font-weight:500;min-height:40px}
.seg button.on{background:var(--tile);color:#fff;font-weight:600}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--pri);cursor:pointer;box-shadow:0 2px 0 var(--pri2)}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:600;box-shadow:none}
.big{font-size:32px;text-align:center;padding:22px 8px;font-weight:700;overflow-wrap:anywhere}
.opt{display:block;width:100%;text-align:left;margin-bottom:9px;padding:14px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:16px;overflow-wrap:anywhere}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ko{border-color:var(--ko);background:var(--kob)}
input.t{width:100%;padding:14px;font:inherit;font-size:18px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:10px}input.t:focus{outline:none;border-color:var(--pri)}
.fb{border-radius:14px;padding:12px;margin:6px 0 12px}.fb.ok{background:var(--okb);color:var(--ok)}.fb.ko{background:var(--kob);color:var(--ko)}.fb .r{color:var(--tx);font-size:14px;margin-top:6px}
.fbm{display:flex;gap:10px;align-items:flex-start}.fbm img{width:48px;height:48px;border-radius:24px;object-fit:cover;object-position:50% 20%;background:var(--hd);flex-shrink:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--hd);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:#C9CED6;font:inherit;font-size:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}nav button.on{color:var(--pri);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}.stats b{display:block;font-size:22px}
.days{display:flex;gap:6px;align-items:flex-end;height:80px}.days div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.days i{display:block;background:var(--pri);border-radius:6px 6px 0 0;min-height:3px}
details{margin-bottom:10px}summary{cursor:pointer;font-weight:600;padding:4px 0}table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}td{padding:6px 4px;border-top:1px solid var(--bd);vertical-align:top}td:first-child{white-space:nowrap;padding-right:10px}
.x{float:right;border:0;background:none;color:var(--mut);font-size:22px}
.pop{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99;animation:fi .3s}.pc{background:var(--card);border-radius:26px;padding:24px 20px;text-align:center;max-width:360px;width:100%;animation:pp .6s cubic-bezier(.2,1.5,.4,1)}@keyframes pp{from{transform:scale(.3);opacity:0}}@keyframes fi{from{opacity:0}}.cf{position:fixed;top:-16px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall linear forwards;z-index:100}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}.shine{animation:sh 1.6s ease-in-out infinite alternate;transform-origin:center}@keyframes sh{to{transform:scale(1.06) rotate(-2deg)}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}.btn.okb{background:var(--ok);box-shadow:none}.btn.kob{background:var(--ko);box-shadow:none}.btn:disabled{opacity:.6}
.lk{border:0;background:none;font-size:18px;cursor:pointer;padding:2px 6px}
.og{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt.sm{text-align:center;padding:11px;margin:0;font-weight:600}
.pc.left{text-align:left;max-height:88vh;overflow:auto}.pc.left h2{margin-top:0}.stp{background:var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0 12px;font-size:15px;display:grid;gap:4px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;z-index:120;max-width:90vw;text-align:center;animation:fi .3s;box-shadow:0 6px 20px #0004}
input.t.f{font-family:ui-monospace,Menlo,monospace;margin-bottom:6px}.prev{font-size:24px;font-weight:700;text-align:center;min-height:34px}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0}.keys button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 0;font:inherit;font-size:17px;font-weight:600}
.pairs{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:12px}.pairs>div{display:grid;gap:8px;align-content:start}
.pb{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px 8px;font:inherit;font-size:16px;min-height:56px;overflow-wrap:anywhere}.pb.nm{font-size:14px}
.pb.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,var(--card))}.pb.ok{border-color:var(--ok);background:var(--okb);opacity:.55}.pb.bad{border-color:var(--ko);background:var(--kob);animation:sk .35s}
@keyframes sk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:12px}.bd{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center;opacity:.38;filter:grayscale(1)}.bd.on{opacity:1;filter:none;border-color:var(--pri)}.bd span{font-size:26px;display:block}.bd small{font-size:11px;line-height:1.2;display:block;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 10px;font:inherit;font-size:13px}#bc button{font-size:12px;padding:8px 2px;white-space:nowrap}.chip.on{border-color:var(--tile);background:var(--tile);color:#fff;font-weight:600}.chip .gc{height:22px;min-width:26px;font-size:11px;margin-right:4px;border-radius:6px}.chip.on .gc{background:var(--pri)}
.tag{font-size:12px;background:var(--okb);color:var(--ok);padding:3px 8px;border-radius:10px;white-space:nowrap}.tag.off{background:var(--bd);color:var(--mut)}
.teach details{margin:8px 0}.trow{border-top:1px solid var(--bd);padding:10px 0}.teach table td{font-size:13px}
.lb{padding:7px 4px;border-bottom:1px solid var(--bd)}.lb:last-child{border:0}.lb.me{background:color-mix(in srgb,var(--pri) 10%,transparent);border-radius:8px}
select{font:inherit;padding:6px 8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
tr[data-d]{cursor:pointer}.oxr{padding:10px 12px}.oxo{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}.oxb{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 0;font:inherit;font-weight:700;font-size:15px;min-height:44px}.oxb.on{border-color:var(--tile);background:var(--tile);color:#fff}.oxb.ok{border-color:var(--ok);background:var(--okb)}.oxb.ko{border-color:var(--ko);background:var(--kob)}nav button{padding:6px 2px}
.mh{display:flex;align-items:center;gap:10px;font-size:20px}.mh img{width:44px;height:44px;border-radius:22px;object-fit:cover;object-position:50% 18%;background:var(--hd);flex-shrink:0}
.endm{width:96px;height:96px;border-radius:48px;object-fit:cover;object-position:50% 18%;background:var(--hd);display:block;margin:0 auto 8px;border:3px solid var(--pri)}
.rk{display:inline-flex;width:24px;height:24px;border-radius:12px;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--bd);color:var(--tx);margin-right:8px}.rk.r0{background:#F5B700;color:#1F2329}.rk.r1{background:#C7CCD3;color:#1F2329}.rk.r2{background:#C9783A;color:#fff}
.pill.sm{font-size:10px;padding:1px 6px;background:var(--tile);color:#fff;border-radius:6px;vertical-align:1px}
.gh{display:flex;align-items:center;gap:10px;font-size:17px}.gh .gc{background:var(--pri)}
.lk{color:var(--pri);font-weight:600;font-size:14px;font-family:inherit}
.pc{border-radius:24px;box-shadow:0 20px 50px #0006}.pc h2{margin-top:0}.pc .btn{margin-top:6px}
.card.big{border:0;box-shadow:0 2px 0 var(--bd),0 1px 2px #0000000f}
.fb.ok{background:var(--okb)}.fb b{font-size:17px}
.ions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.ions .oxb{font-size:18px;padding:12px 0}
.cnt{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:4px}.cnt button{width:44px;height:44px;border-radius:22px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:22px;font-weight:700}.cnt b{font-size:22px;min-width:40px;text-align:center}
.fall{position:relative;height:300px;background:var(--card);border:1px solid var(--bd);border-radius:18px;margin:12px 0;overflow:hidden;background-image:linear-gradient(var(--bd) 1px,transparent 1px);background-size:100% 30px}
.fall .floor{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--pri)}
.fchip{position:absolute;left:50%;top:0;margin-left:-90px;width:180px;text-align:center;background:var(--tile);color:#fff;border-radius:14px;padding:12px 8px;font-size:26px;font-weight:700;will-change:transform}.fchip small{display:block;font-size:13px;font-weight:500}
.fchip.good{background:var(--ok)}.fchip.bad{background:var(--ko)}
.opt.fo{text-align:center;font-weight:600}.hrt{color:var(--pri);font-size:16px}.hrt.off{color:var(--bd)}
.blank{display:inline-block;min-width:44px;border-bottom:3px solid var(--pri);color:var(--pri)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mc{aspect-ratio:3/4;border:0;border-radius:12px;background:var(--tile);color:#fff;font:inherit;padding:4px;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;cursor:pointer}
.mc span{display:none}.mc.f span{font-size:17px;font-weight:700}.mc.n span{font-size:12px;line-height:1.15}
.mc::before{content:'?';font-size:24px;font-weight:800;color:#ffffff55}
.mc.up,.mc.ok{background:var(--card);color:var(--tx);border:2px solid var(--pri)}.mc.up::before,.mc.ok::before{content:none}.mc.up span,.mc.ok span{display:block}.mc.ok{border-color:var(--ok);background:var(--okb)}
.eye{position:absolute;width:10.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#F8F5E8;overflow:hidden;pointer-events:none}
.eye i{position:absolute;left:50%;top:50%;width:28%;height:28%;margin:-14% 0 0 -14%;border-radius:50%;background:#140808;transition:transform .35s ease}
.eye::after{content:'';position:absolute;inset:0;background:#E6B78E;transform:scaleY(0);transform-origin:top;transition:transform .09s}
.mw.blink .eye::after{transform:scaleY(1)}
.mw.roll .eye i{animation:roll 1.3s ease-in-out}@keyframes roll{0%{transform:translate(0,0)}20%{transform:translate(155%,-80%)}40%{transform:translate(0,-170%)}60%{transform:translate(-155%,-80%)}80%{transform:translate(-90%,60%)}100%{transform:translate(0,0)}}.mw .masc{transform-origin:50% 100%}.mw.tilt .masc{animation:tilt 1.1s ease-in-out}@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}55%{transform:rotate(4deg)}80%{transform:rotate(-2deg)}}
.mw.lookl .eye i{transform:translate(-165%,15%)}.mw.lookr .eye i{transform:translate(165%,-15%)}.mw.lookup .eye i{transform:translate(0,-160%)}
.spk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0}
.mw.spark .spk{animation:spk .9s ease-out}@keyframes spk{0%{opacity:0;transform:scale(.8)}25%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.12)}}
.mw.spark .masc{animation:hop .6s ease}@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-6px)}60%{transform:translateY(1px)}}
.bub{position:absolute;right:130px;top:44px;width:200px;background:#fff;color:#1F2329;border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.35;font-weight:500;box-shadow:0 6px 20px #0005;opacity:0;transform:translateY(6px) scale(.95);transition:opacity .25s,transform .25s;pointer-events:none;z-index:3}
.bub::after{content:'';position:absolute;right:-7px;top:24px;border:8px solid transparent;border-left-color:#fff;border-right:0}
.bub.on{opacity:1;transform:none}header.cm .bub{display:none}
.fbm img.hop{animation:hop .6s ease}.fbm img.no{animation:sk .4s}
@media (prefers-reduced-motion:reduce){.mw .masc,.mw .spk,.fbm img{animation:none!important}}
.zpet{display:block;width:100%;margin:0;background:var(--hd);padding-block:10px 8px;padding-left:max(18px,env(safe-area-inset-left,0px),calc((100% - 560px)/2 + 18px));padding-right:max(18px,env(safe-area-inset-right,0px),calc((100% - 560px)/2 + 18px));font-size:13px;font-weight:500;color:#A3AAB5;text-decoration:none}.zpet:hover{color:#fff}

function counts(f){

 parts.forEach((p,pi)=>{let mult=1;if(pi>0){const m=p.match(/^(\d+)/);if(m){mult=+m[1];p=p.slice(m[1].length)}}
  const st=[{}];const re=/([A-Z][a-z]?)|(\d+)|([(\[])|([)\]])/g;let m,last=null;
  while((m=re.exec(p))){
   if(m[1]){st[st.length-1][m[1]]=(st[st.length-1][m[1]]||0)+1;last={el:m[1]}}
   else if(m[2]){const n=+m[2];if(last&&last.el){st[st.length-1][last.el]+=n-1}else if(last&&last.grp){const g=last.grp;for(const k in g)st[st.length-1][k]=(st[st.length-1][k]||0)+g[k]*(n-1)}last=null}
   else if(m[3]){st.push({});last=null}
   else if(m[4]){const g=st.pop()||{};for(const k in g)st[st.length-1][k]=(st[st.length-1][k]||0)+g[k];last={grp:g}}
  }
  for(const k in st[0])tot[k]=(tot[k]||0)+st[0][k]*mult});

}

 if(cw.length===gw.length){
  const diff=cw.map((w,i)=>[w,gw[i]]).filter(([a,b])=>norm(a)!==norm(b));
  if(diff.length===0)return 'Chybí jen diakritika nebo pomlčka: správně „'+c+'“.';
  if(diff.length===1){const[a,b]=diff[0];
   for(const L of [ADJ,ADJF]){const x=endOf(a,L),y=endOf(b,L);
    if(x&&y&&norm(x.stem)===norm(y.stem)&&x.ox!==y.ox)return `Prvek máš správně, ale <b>oxidační číslo ne</b>: koncovka -${y.end} znamená ${ROM[y.ox]}, tady je potřeba ${ROM[x.ox]} (-${x.end}).`;
    if(x&&y&&norm(x.stem)!==norm(y.stem)&&x.ox===y.ox)return `Oxidační číslo sedí (${ROM[x.ox]}), ale <b>zaměnil(a) jsi prvek</b>: „${b}“ místo „${a}“.`}

   if(x&&y&&norm(x.stem)===norm(y.stem)&&x.ox!==y.ox)return `Centrální prvek aniontu je správně, ale <b>oxidační číslo ne</b>: -${y.end} je ${ROM[y.ox]}, správně ${ROM[x.ox]} (-${x.end}).`;

 for(const e of els)if(!(e in ox)&&FIX1[e]!==undefined&&els.length>1)ox[e]=FIX1[e];
 if(c.O&&!('O' in ox))ox.O=/peroxid/.test(n0)?-1:-2;
 if(c.H&&!('H' in ox))ox.H=/^hydrid/.test(n0)?-1:1;
 if(/NH4/.test(f)){if(/N/.test(f.replace(/\(?NH4\)?\d*/g,'')))return null;if(c.N&&!('N' in ox))ox.N=-3}

 if(unk.length===1){const e=unk[0];let s=q;for(const k in ox)s-=ox[k]*c[k];const x=s/c[e];if(!Number.isInteger(x)||x===0)return null;ox[e]=x}

 let sum=0;for(const k of els){if(!(k in ox))return null;if(ox[k]<-4||ox[k]>8||ox[k]===0)return null;sum+=ox[k]*c[k]}
 if(sum!==q)return null;

 if(adj.length&&!adj.some(a=>els.some(e=>ox[e]===a.ox)))return null;
 if(!adj.length&&/^(di|tri|tetra|penta|hexa|hepta|okta|deka|dodeka)\S*(karbid|borid|silicid|nitrid|arsenid)/.test(n0))return null;

const MONO={O:2,S:2,Se:2,Te:2,F:1,Cl:1,Br:1,I:1,N:3,H:1,P:3,C:4};
const NONMET=new Set(['H','B','C','N','O','F','Si','P','S','Cl','Se','Br','I','Te','Xe','As','At','Kr','Ge','Sb']);
const POLY=Object.assign(Object.fromEntries(ANIONS.map(a=>[a.f,a.q])),{OH:1,SH:1,CN:1});
const isPoly=an=>!/^[A-Z][a-z]?$/.test(an);
const buildF=(cat,x,an,y)=>(cat==='NH4'?(x>1?'(NH4)'+x:'NH4'):cat+(x>1?x:''))+(y>1?(isPoly(an)?'('+an+')'+y:an+y):an);
const ionH=(f,q,neg)=>fmt(f)+`<sup>${q>1?q:''}${neg?'−':'+'}</sup>`;
function ionSplit(it){
 if(!['ox','ha','oh','so','hs','sp','hy'].includes(it.g)||/[\[·^]/.test(it.f))return null;
 const m=it.f.match(/^(\(NH4\)|NH4|[A-Z][a-z]?)(\d*)(.+)$/);if(!m)return null;
 const cat=m[1].replace(/[()]/g,''),x=+(m[2]||1),rest=m[3];let an,y,k=rest.match(/^\((.+)\)(\d+)$/);
 if(k){an=k[1];y=+k[2]}else{k=rest.match(/^([A-Z][a-z]?)(\d*)$/);if(k){an=k[1];y=+(k[2]||1)}else{an=rest;y=1}}

 const C=Object.values(CP),A=Object.values(AP),core=f=>Object.keys(counts(f)).filter(e=>e!=='O'&&e!=='H');

/* ---------- hra: padající vzorky ---------- */
function fallGame(pool){
 let lives=3,score=0,combo=0,speed=48,y=0,last=0,raf=0,it=null,busy=false,alive=true;const t0=Date.now();Q={t0};
 $('#app').innerHTML=`<button class="x" id="q">✕</button><div class="mut" id="fh"></div><div class="fall" id="fz"><div class="fchip" id="ch"></div><div class="floor"></div></div><div id="fo"></div>`;
 const fz=$('#fz'),ch=$('#ch'),H=()=>fz.clientHeight-ch.offsetHeight-6;
 const head=()=>{$('#fh').innerHTML=`Padající vzorce · body <b>${score}</b> · série ${combo}${combo>=3?' (×'+(1+Math.floor(combo/3))+')':''} · ${'<span class="hrt">♥</span>'.repeat(lives)}${'<span class="hrt off">♥</span>'.repeat(3-lives)}`};
 const stop=()=>{alive=false;cancelAnimationFrame(raf)};KILL=stop;
 const next=()=>{if(!alive)return;it=rnd(pool);y=0;busy=false;ch.className='fchip';ch.innerHTML=fmt(it.f);ch.style.transform='translateY(0)';
  const opts=shuf([it,...distract(it,2)]);$('#fo').innerHTML=opts.map(o=>`<button class="opt fo" data-f="${esc(o.f)}">${esc(nm(o))}</button>`).join('');
  $$('#fo [data-f]').forEach(b=>b.onclick=()=>answer(b.dataset.f===it.f,b));last=performance.now();head()};
 const lose=(b)=>{lives--;combo=0;busy=true;ch.className='fchip bad';ch.innerHTML=fmt(it.f)+`<small>${esc(nm(it))}</small>`;if(b)b.classList.add('ko');$$('#fo [data-f]').forEach(x=>{if(x.dataset.f===it.f)x.classList.add('ok')});buzz(0);head();
  setTimeout(()=>{if(!alive)return;if(lives<=0)end();else next()},1300)};
 const answer=(ok,b)=>{if(busy||!alive)return;if(!ok)return lose(b);busy=true;combo++;score+=10*(1+Math.floor((combo-1)/3));speed=Math.min(speed*1.07,260);ch.className='fchip good';b.classList.add('ok');buzz(1);head();setTimeout(next,350)};
 const loop=t=>{if(!alive)return;const dt=(t-last)/1000;last=t;if(!busy){y+=speed*dt;if(y>=H()){y=H();ch.style.transform=`translateY(${y}px)`;lose(null)}else ch.style.transform=`translateY(${y}px)`}raf=requestAnimationFrame(loop)};
 const end=()=>{stop();KILL=null;const b=(S.games.fall||{})[S.lvl],better=!b||score>b;S.games.fall=S.games.fall||{};if(better)S.games.fall[S.lvl]=score;save();if(score>=200)checkBadges('fall');
  gameOver('fall','Konec hry',`${score} bodů`,`čas ${fmtT(Date.now()-t0)}`,better,()=>{games();$('#g_fall').click()})};
 $('#q').onclick=()=>{stop();KILL=null;Q=null;render()};
 next();raf=requestAnimationFrame(t=>{last=t;loop(t)});
}

/* ---------- hra: doplň koncovku ---------- */
function endPool(pool){
 return pool.filter(i=>['ox','ha','ky','so','hs','oh','sp'].includes(i.g)).map(it=>{const A=oxAll(it);if(!A)return null;const w=it.n[0].split(' ');
  for(let i=w.length-1;i>=0;i--){if(/amon|vodíkov|kyanat|dimer|thio/.test(w[i]))continue;for(const L of [ADJ,ADJF,ANI]){const x=endOf(w[i],L);if(x&&A.els.some(e=>A.ox[e]===x.ox))return{it,i,x,L}}}return null}).filter(Boolean);
}
function endGame(pool){
 const P=endPool(pool);if(P.length<4)return toast('Ve vybraných skupinách je málo vhodných látek.');
 let sc=0,streak=0,best=0,left=60,busy=false,tick=null;Q={t0:Date.now()};
 const stop=()=>{clearInterval(tick)};KILL=stop;
 const draw=()=>{
  const r=rnd(P),w=r.it.n[0].split(' ');w[r.i]=esc(r.x.stem)+'<span class="blank">___</span>';

  $('#app').innerHTML=`<button class="x" id="q">✕</button><div class="mut">Doplň koncovku · zbývá <b id="lf">${left}</b> s · správně ${sc} · série ${streak}</div><div class="bar"><i id="lb" style="width:${100*left/60}%"></i></div>
  <div class="card big" style="margin-top:14px">${fmt(r.it.f)}<div style="font-size:22px;font-weight:600;margin-top:8px">${w.map((x,i)=>i===r.i?x:esc(x)).join(' ')}</div></div>
  <div class="og">${opts.map(o=>`<button class="opt sm" data-e="${o}">-${o}</button>`).join('')}</div><div id="fb"></div>`;
  $('#q').onclick=()=>{stop();KILL=null;Q=null;render()};busy=false;
  $$('[data-e]').forEach(b=>b.onclick=()=>{if(busy)return;busy=true;const ok=b.dataset.e===r.x.end;
   if(ok){sc++;streak++;best=Math.max(best,streak);b.classList.add('ok');buzz(1);setTimeout(()=>left>0&&draw(),300)}
   else{streak=0;b.classList.add('ko');$$('[data-e]').forEach(x=>{if(x.dataset.e===r.x.end)x.classList.add('ok')});$('#fb').innerHTML=`<div class="fb ko" style="margin-top:8px">-${r.x.end} = ${ROM[r.x.ox]} · <b>${esc(r.it.n[0])}</b></div>`;buzz(0);setTimeout(()=>left>0&&draw(),1300)}});
 };
 tick=setInterval(()=>{left--;const lf=$('#lf'),lb=$('#lb');if(lf)lf.textContent=left;if(lb)lb.style.width=100*left/60+'%';
  if(left<=0){stop();KILL=null;const b=(S.games.ends||{})[S.lvl],better=!b||sc>b;S.games.ends=S.games.ends||{};if(better)S.games.ends[S.lvl]=sc;save();if(sc>=15)checkBadges('ends');
   gameOver('ends','Čas vypršel!',`${sc} správně`,`nejdelší série ${best}`,better,()=>{games();$('#g_ends').click()})}},1000);
 draw();
}

 $('#app').innerHTML=`<div class="card"><b>Tvoje přezdívka</b><p class="mut" style="margin:4px 0 8px">Pod ní tě uvidí spolužáci v žebříčku a učitel u testů. Bez přezdívky v žebříčku nejsi.</p><div class="row"><input class="t" id="nick" maxlength="24" value="${esc(S.nick)}" placeholder="např. Jana K." style="margin:0"><button class="btn sm" id="sn">Uložit</button></div></div>
 ${CL.teacher?teacherHtml():''}
 <h2>Testy</h2>${act.length?act.map(t=>{const r=CL.mine[t.id]||S.done[t.id];return`<div class="card"><div class="row"><b>${esc(t.title)}</b>${r?`<span class="tag">✓ ${r.score}/${r.n}</span>`:''}</div><div class="mut">${t.items.length} otázek · ${LVN[t.lvl]} · ${MODES[t.mode]}${t.mode==='choice'?' ('+({fn:'vzorec → název',nf:'název → vzorec',mix:'mix'})[t.dir]+')':''}</div>${r?'<p class="mut" style="margin:6px 0 0">Odevzdáno. Test lze vyplnit jen jednou.</p>':`<p style="margin:8px 0 0"><button class="btn sm" data-tt="${t.id}">Spustit test</button></p>`}</div>`}).join(''):'<p class="mut">Teď nejsou aktivní žádné testy.</p>'}
 <h2>Třídní žebříček</h2>${seg('bc',CATS,boardCat)}<div class="card">${rows.length?rows.map((b,i)=>`<div class="row lb ${b.id===CL.uid?'me':''}"><span><span class="rk r${i}">${i+1}</span>${esc(b.nick||'?')}${b.id===CL.uid?' (ty)':''}</span><span><small class="mut">${b.badges||0} odznaků</small> <b>${fmtT(b.rec[boardCat])}</b></span></div>`).join(''):'<p class="mut">Zatím žádný rekord v této kategorii. Buď první – dej si bezchybné kolo!</p>'}</div>`;
 $('#sn').onclick=()=>{S.nick=$('#nick').value.trim().slice(0,24);save();if(S.nick)boardPush();else CL.db.doc('board/'+CL.uid).delete().catch(()=>{});toast(S.nick?'Přezdívka uložena.':'Přezdívka smazána, nejsi v žebříčku.')};
 bindSeg('bc',v=>{boardCat=v;klass()});
 $$('[data-tt]').forEach(b=>b.onclick=async()=>{const t=CL.tests.find(x=>x.id===b.dataset.tt);if(!S.nick&&!await askYN('Nemáš přezdívku – učitel tě neuvidí podle jména. Pokračovat?'))return;
  const list=t.items.map(f=>BYF[f]).filter(Boolean);view='t';startRound(list,{test:t,mode:t.mode,dir:t.dir||'fn'})});
 if(CL.teacher)bindTeacher();
}
let TF={title:'',lvl:'z',groups:['ox'],n:10,mode:'choice',dir:'fn'};
function teacherHtml(){
 return `<div class="card teach"><b>Pro učitele</b><details ${CL.tests.length?'':'open'}><summary>+ Nový test</summary>
 <input class="t" id="tt" placeholder="Název testu, např. Oxidy – 1.A" value="${esc(TF.title)}">
 ${seg('tl',[['z',LVN.z],['p',LVN.p]],TF.lvl)}
 <div class="chips">${G.map(g=>`<button class="chip ${TF.groups.includes(g.id)?'on':''}" data-cg="${g.id}">${gi(g)} ${g.n}</button>`).join('')}</div>
 ${seg('tm2',[['choice','Výběr'],['typen','Psaní názvu'],['typef','Psaní vzorce']],TF.mode)}
 ${TF.mode==='choice'?seg('td',[['fn','Vzorec → název'],['nf','Název → vzorec'],['mix','Mix']],TF.dir):''}
 ${seg('tn',[['10','10 otázek'],['15','15'],['20','20']],String(TF.n))}
 <button class="btn" id="mk">Vytvořit test</button></details>
 ${CL.tests.map(t=>`<div class="trow"><div class="row"><b>${esc(t.title)}</b><span class="tag ${t.active?'':'off'}">${t.active?'aktivní':'skrytý'}</span></div><div class="mut">${t.items.length} otázek · ${LVN[t.lvl]} · ${MODES[t.mode]} · ${new Date(t.created).toLocaleDateString('cs')}</div>
 <div class="row" style="gap:6px;margin-top:6px"><button class="btn sm" data-res="${t.id}">Výsledky</button><button class="btn s sm" data-act="${t.id}">${t.active?'Skrýt':'Zveřejnit'}</button><button class="btn s sm" data-del="${t.id}">Smazat</button></div><div id="r_${t.id}"></div></div>`).join('')}</div>`;
}
function bindTeacher(){
 const sync=()=>{TF.title=$('#tt').value};
 bindSeg('tl',v=>{sync();TF.lvl=v;klass()});bindSeg('tm2',v=>{sync();TF.mode=v;klass()});bindSeg('td',v=>{sync();TF.dir=v;klass()});bindSeg('tn',v=>{sync();TF.n=+v;klass()});
 $$('[data-cg]').forEach(b=>b.onclick=()=>{sync();const g=b.dataset.cg;TF.groups=TF.groups.includes(g)?TF.groups.filter(x=>x!==g):[...TF.groups,g];klass()});
 $('#mk').onclick=async()=>{sync();const pool=ITEMS.filter(i=>TF.groups.includes(i.g)&&i.lv===TF.lvl);
  if(!TF.title.trim())return toast('Zadej název testu.');if(pool.length<TF.n)return toast(`Ve vybraných skupinách je jen ${pool.length} látek – přidej skupiny nebo sniž počet.`);
  try{await CL.db.collection('tests').add({title:TF.title.trim().slice(0,60),lvl:TF.lvl,groups:TF.groups,mode:TF.mode,dir:TF.dir,items:shuf(pool).slice(0,TF.n).map(i=>i.f),active:true,created:Date.now()});TF.title='';toast('Test vytvořen a zveřejněn.')}catch(e){toast('Test se nepodařilo uložit ('+(e.code||'chyba')+').')}};
 $$('[data-act]').forEach(b=>b.onclick=()=>{const t=CL.tests.find(x=>x.id===b.dataset.act);CL.db.doc('tests/'+t.id).update({active:!t.active}).catch(()=>toast('Nepovedlo se.'))});
 $$('[data-del]').forEach(b=>b.onclick=async()=>{if(await askYN('Smazat test? Výsledky studentů zůstanou uložené, ale nebudou se zobrazovat.'))CL.db.doc('tests/'+b.dataset.del).delete().catch(()=>toast('Nepovedlo se.'))});
 $$('[data-res]').forEach(b=>b.onclick=async()=>{const id=b.dataset.res,box=$('#r_'+id);box.innerHTML='<p class="mut">Načítám…</p>';
  try{const s=await CL.db.collection('results').get();const rs=s.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.tests&&r.tests[id]).map(r=>({nick:r.nick||'(bez přezdívky)',...r.tests[id]})).sort((a,b)=>b.score-a.score||a.ms-b.ms);
   const errs={};rs.forEach(r=>(r.wrong||[]).forEach(f=>errs[f]=(errs[f]||0)+1));const top=Object.entries(errs).sort((a,b)=>b[1]-a[1]).slice(0,5);
   const avg=rs.length?(rs.reduce((a,r)=>a+r.score/r.n,0)/rs.length*100).toFixed(0):0;
   box.innerHTML=rs.length?`<p class="mut">Odevzdalo ${rs.length} · průměr ${avg} %</p><table>${rs.map(r=>`<tr><td>${esc(r.nick)}</td><td><b>${r.score}/${r.n}</b></td><td>${fmtT(r.ms)}</td><td class="mut">${new Date(r.at).toLocaleString('cs',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}</td></tr>`).join('')}</table>${top.length?`<p style="margin:10px 0 4px"><b>Nejčastější chyby třídy</b></p>${top.map(([f,n])=>`<div>${fmt(f)} – ${esc(BYF[f]?nm(BYF[f]):f)} <span class="mut">(${n}×)</span></div>`).join('')}`:''}`:'<p class="mut">Zatím nikdo neodevzdal.</p>'}
  catch(e){box.innerHTML='<p class="mut">Výsledky se nepodařilo načíst.</p>'}});
}

/* ---------- maskot ---------- */
const TIPS=['-ný = I, -natý = II, -itý = III, -ičitý = IV.','-ečný / -ičný = V, -ový = VI, -istý = VII, -ičelý = VIII.','Kyslík má v oxidech oxidační číslo −II.','Součet oxidačních čísel v neutrální sloučenině je vždy 0.','Vodík má +I, jen v hydridech kovů −I.','Fluor má ve sloučeninách vždy −I.','Kovy 1. skupiny mají vždy +I, kovy 2. skupiny +II.','Soli kyslíkatých kyselin končí na -an: síran, dusičnan, uhličitan…','Hydrogen- znamená, že v soli zůstal vodík: NaHCO₃ je hydrogenuhličitan.','Halogenidy mají koncovku -id: chlorid, bromid, jodid, fluorid.','V peroxidech má kyslík −I (skupina O₂²⁻).','Kyselina sírová H₂SO₄ → síran SO₄²⁻, kyselina siřičitá H₂SO₃ → siřičitan SO₃²⁻.','Ligandy v komplexech se řadí abecedně: ammin, aqua, chlorido…','Náboje iontů vyrovnej křížovým pravidlem: Al³⁺ + O²⁻ → Al₂O₃.'];
let MT=0;
function mascot(kind,ms){const m=document.getElementById('mw');if(!m||document.getElementById('hd').classList.contains('cm'))return;
 m.classList.remove('roll','blink','spark','tilt','lookl','lookr','lookup');void m.offsetWidth;m.classList.add(kind);setTimeout(()=>m.classList.remove(kind),ms||1300)}
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function mascotIdle(){const r=Math.random();if(r<.2)mascot('blink',180);else if(r<.45)mascot('roll',1300);else if(r<.7||RM)mascot(rnd(['lookl','lookr','lookup']),1500);else if(r<.85)mascot('tilt',1100);else mascot('spark',900);
 clearTimeout(MT);MT=setTimeout(mascotIdle,3500+Math.random()*4000)}
function mascotTip(){const b=document.getElementById('bub');if(!b)return;b.textContent=rnd(TIPS);b.classList.add('on');mascot(RM?'roll':'spark',RM?1300:900);clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('on'),4500)}
(()=>{const m=document.getElementById('mw');if(!m)return;m.onclick=mascotTip;m.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();mascotTip()}};
 MT=setTimeout(()=>{mascot(RM?'roll':'spark',RM?1300:900);MT=setTimeout(mascotIdle,2500)},1000)})();

if(!(window.claude&&window.claude.use)){const tb=document.querySelector('nav [data-v="t"]');if(tb)tb.remove()}
checkBadges();render();
