:root{--hd:#20262F;--tile:#2B313A;--bg:#F2F3F5;--card:#fff;--tx:#1F2329;--mut:#646B76;--pri:#D7262E;--pri2:#B21E25;--ok:#15803d;--okb:#dcfce7;--ko:#b91c1c;--kob:#fee2e2;--bd:#E3E5E9;--wa:#b45309;--wab:#fef3c7;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171C;--card:#1E232B;--tx:#EEF0F3;--mut:#9AA3AE;--bd:#2E3540;--ok:#4ade80;--okb:#12341f;--ko:#f87171;--kob:#3b1618;--pri:#E5383F;--wa:#fbbf24;--wab:#3a2c0c}}
:root[data-theme="dark"]{--bg:#14171C;--card:#1E232B;--tx:#EEF0F3;--mut:#9AA3AE;--bd:#2E3540;--ok:#4ade80;--okb:#12341f;--ko:#f87171;--kob:#3b1618;--pri:#E5383F;--wa:#fbbf24;--wab:#3a2c0c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 'Outfit',system-ui,-apple-system,"Segoe UI",sans-serif;min-height:calc(var(--vh,1vh)*100);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--hd);color:#fff;padding:18px 18px 26px;display:flex;align-items:flex-end;gap:8px;max-width:560px;margin:0 auto;position:relative;box-shadow:0 0 0 100vmax var(--hd);clip-path:inset(0 -100vmax)}
header .ht{flex:1;padding:0 120px 30px 0;position:relative;z-index:1;pointer-events:none}
header h1{margin:0;font-size:31px;line-height:1.02;font-weight:800;letter-spacing:-.01em}header h1 span{color:var(--pri);display:block}
header p{margin:8px 0 0;color:#C9CED6;font-size:15px}
header .mw{position:absolute;right:0;bottom:0;width:168px;z-index:0}header .masc{width:100%;height:auto;display:block;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14%);mask-image:linear-gradient(to right,transparent 0,#000 14%)}
header .sv{position:absolute;left:180px;top:22px;z-index:2;font-family:'Caveat','Segoe Print','Comic Sans MS',cursive;font-size:21px;font-weight:700;color:#fff;transform:rotate(-10deg);transform-origin:left center;white-space:nowrap;pointer-events:none}
header.cm{padding:12px 16px 30px;max-width:1180px}header.cm .ht{padding:0 0 4px}header.cm h1{font-size:20px}header.cm h1 span{display:inline;margin-left:6px}header.cm p,header.cm .sv,header.cm .mw{display:none}
@media (max-width:380px){header .sv{font-size:18px;left:178px}header .mw{width:150px}}
main{position:relative;z-index:1;background:var(--bg);border-radius:30px 30px 0 0;margin:-26px auto 0;padding:22px 16px 30px;max-width:560px;min-height:calc(var(--vh,1vh)*100 - 160px)}
main.wide{max-width:1180px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #0000000a}
h2{font-size:18px;margin:8px 2px 10px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.hello h2{font-size:26px;line-height:1.2;margin:0 0 10px}.hello p{margin:0 0 16px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tl{position:relative;text-align:left;border:0;border-radius:16px;padding:16px 14px;min-height:136px;background:var(--tile);color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.tl.red{background:var(--pri)}.tl.wide{grid-column:span 2;min-height:124px}.tl svg.ic{position:absolute;left:14px;top:14px}.tl b{font-size:19px}.tl small{font-size:13px;opacity:.85}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--pri);cursor:pointer;box-shadow:0 2px 0 var(--pri2)}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:600;box-shadow:none}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px 4px;border-radius:10px;font:inherit;font-size:14px;font-weight:500;min-height:40px;cursor:pointer}
.seg button.on{background:var(--tile);color:#fff;font-weight:600}
input.t{width:100%;padding:11px 12px;font:inherit;font-size:16px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}input.t:focus{outline:none;border-color:var(--pri)}
.lab{font-size:13px;color:var(--mut);margin:12px 2px 6px;font-weight:600}
.teams-in{display:grid;gap:8px}
.tdot{display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:6px;vertical-align:-1px}
/* scoreboard */
.sb{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sbt{flex:1;min-width:120px;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:border-color .2s,transform .2s}
.sbt b{font-size:24px}.sbt span{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbt.on{border-color:var(--pri);transform:translateY(-2px);box-shadow:0 4px 14px #d7262e33}
.sbt.bump b{animation:bump .5s}@keyframes bump{40%{transform:scale(1.5);color:var(--ok)}}
.qhead{display:flex;align-items:center;gap:10px;margin:4px 2px 10px;flex-wrap:wrap}
.qhead .gc{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;padding:0 8px;border-radius:9px;background:var(--pri);color:#fff;font-weight:700;font-size:14px}
.qhead h2{margin:0;font-size:20px;flex:1}
.snd{border:0;background:var(--card);color:var(--tx);border-radius:50%;width:40px;height:40px;cursor:pointer;padding:0;flex:none;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #0000001f}.snd svg{width:25px;height:25px}.snd.off{background:transparent;color:var(--mut);box-shadow:inset 0 0 0 1.5px var(--bd)}
.rs.tau .opt,.side .rs.tau .opt{font-size:22px;padding:16px 6px}
.turn{font-weight:700;padding:6px 12px;border-radius:12px;color:#fff;font-size:15px}
.timer{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:-4px 0 12px}.timer i{display:block;height:100%;background:var(--pri);width:100%;transition:width 1s linear}
/* molecules */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.pair.one{grid-template-columns:1fr}
@media (max-width:760px){.pair{grid-template-columns:1fr}}
.mol{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.mol .mh{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px;min-height:44px}
.mol .mh b{font-size:17px}.mol .nm{font-size:15px;color:var(--mut);font-weight:600}
.mol .nm.rv{color:var(--tx)}
.d2{background:#fff;display:flex;align-items:center;justify-content:center;min-height:200px;padding:6px;border-top:1px solid var(--bd)}
.d2 svg{width:100%;height:auto;max-height:240px}
.d3{position:relative;background:radial-gradient(circle at 50% 35%,#323a46,#1a1f27);height:280px;border-top:1px solid var(--bd);touch-action:none;cursor:grab}
.d3:active{cursor:grabbing}
.d3 canvas{width:100%;height:100%;display:block}
.d3 .tip{position:absolute;left:10px;bottom:8px;font-size:12px;color:#aab3bf;pointer-events:none}
.d3 .tools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.d3 .tools button,.vbtn{border:0;background:#ffffff1f;color:#fff;border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.d3 .tools button:hover{background:#ffffff33}
.vw{display:flex;gap:6px;white-space:nowrap}.vw button{border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:10px;padding:5px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.vw button.on{background:var(--tile);color:#fff;border-color:var(--tile)}
.fm{font-size:14px;color:var(--mut);padding:0 12px 8px;min-height:20px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:-4px 2px 10px}.legend i{display:inline-block;width:11px;height:11px;border-radius:6px;margin-right:4px;vertical-align:-1px}
.tbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--tile);color:#fff;border-color:var(--tile)}.chip.hint{border-color:var(--wa);color:var(--wa)}.chip.hint.on{background:var(--wa);color:#fff}
/* answers */
.ans{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
@media (max-width:760px){.ans{grid-template-columns:1fr}}
.grp{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;display:grid;gap:8px;align-content:start}
.grp h3{margin:0 2px 2px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.opt small{display:block;font-weight:400;font-size:12.5px;color:var(--mut)}
.opt:hover:not(:disabled){border-color:var(--tile)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ko{border-color:var(--ko);background:var(--kob);animation:sk .35s}.opt.half{border-color:var(--wa);background:var(--wab)}
.opt:disabled{cursor:default}
.rs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.rs .opt{text-align:center;font-size:40px;padding:18px}
@keyframes sk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{border-radius:16px;padding:14px;margin:0 0 12px;display:flex;gap:12px;align-items:flex-start}
.fb.ok{background:var(--okb)}.fb.ko{background:var(--kob)}.fb.half{background:var(--wab)}
.fb img{width:54px;height:54px;border-radius:27px;object-fit:cover;object-position:50% 18%;background:var(--hd);flex-shrink:0}
.fb b{font-size:18px;display:block}.fb.ok b{color:var(--ok)}.fb.ko b{color:var(--ko)}.fb.half b{color:var(--wa)}
.fb p{margin:4px 0 0;color:var(--tx)}
.fb img.hop{animation:hop .6s ease}@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-6px)}}
/* tahák */
.tree{display:grid;gap:10px}
.node{border-left:4px solid var(--pri);padding:6px 0 6px 12px}.node.k{border-color:var(--tile)}
.node b{display:block;font-size:16px}.node p{margin:2px 0 0;font-size:14px;color:var(--mut)}
.sub{display:grid;gap:8px;margin:6px 0 0 6px}
.ex{font-size:13px;color:var(--tx);background:var(--bg);border-radius:8px;padding:2px 8px;display:inline-block;margin-top:4px}
.pop{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99;animation:fi .3s}
.pc{background:var(--card);border-radius:24px;padding:24px 20px;text-align:center;max-width:420px;width:100%;animation:pp .6s cubic-bezier(.2,1.5,.4,1);box-shadow:0 20px 50px #0006}
.pc h2{margin-top:0;font-size:24px}.pc .endm{width:110px;height:110px;border-radius:55px;object-fit:cover;object-position:50% 18%;background:var(--hd);display:block;margin:0 auto 10px;border:3px solid var(--pri)}
@keyframes pp{from{transform:scale(.3);opacity:0}}@keyframes fi{from{opacity:0}}
.rank{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:17px}.rank:last-child{border:0}.rank b{margin-left:auto}
.rk{display:inline-flex;width:28px;height:28px;border-radius:14px;align-items:center;justify-content:center;font-weight:700;background:var(--bd)}.rk.r0{background:#F5B700;color:#1F2329}.rk.r1{background:#C7CCD3;color:#1F2329}.rk.r2{background:#C9783A;color:#fff}
.cf{position:fixed;top:-20px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall cubic-bezier(.25,.4,.5,1) forwards;z-index:130}.cf.rd{border-radius:50%}@keyframes fall{to{transform:translate(var(--dx,0),calc(var(--vh,1vh)*112)) rotate(var(--rt,720deg))}}
.cup{display:block;margin:0 auto 6px;width:min(220px,55vw);height:auto;animation:cupin .9s cubic-bezier(.2,1.5,.4,1)}.cup .sh{animation:shine 2.4s ease-in-out infinite}@keyframes cupin{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}@keyframes shine{0%,100%{opacity:.15}50%{opacity:.6}}
.winner{text-align:center;padding:18px 14px 14px}.winner h2{font-size:28px;margin:4px 0 2px}.winner .tn{display:inline-block;padding:6px 16px;border-radius:14px;color:#fff;font-weight:800;font-size:22px;margin:4px 0 6px}
footer.ver{max-width:560px;margin:0 auto;text-align:center;font-size:11px;color:var(--mut);padding:6px 16px 14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.zpet{display:block;width:100%;margin:0;background:var(--hd);padding:10px 18px 8px max(18px,calc((100% - 560px)/2 + 18px));font-size:13px;font-weight:500;color:#A3AAB5;text-decoration:none}
/* rozložení otázky: molekuly vlevo, odpovědi vpravo */
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.side{position:sticky;top:10px;max-height:calc(var(--vh,1vh)*100 - 20px);overflow:auto;display:grid;gap:10px;align-content:start;overscroll-behavior:contain}
.side .ans{grid-template-columns:1fr;gap:8px;margin:0}
.side .grp{padding:8px;gap:6px}
.side .opt{padding:6px 12px;font-size:15px;min-height:42px;line-height:1.25}.side .opt small{font-size:11.5px}.opt .sn,.chip .sn{display:none}
.side.done .opt small{display:none}.side.done .opt:not(.ok):not(.ko):not(.half){display:none}.side.done .grp:not(:has(.ok,.ko,.half)){display:none}.side.done .opt{min-height:40px;padding:5px 12px}
.side .fb{margin:0;padding:10px}.side .fb p{font-size:14px}.side .fbw:empty,.side .nx:empty{display:none}
.side .row{gap:8px}
.side .rs{margin:0}.side .rs .opt{font-size:40px;padding:16px;min-height:80px;text-align:center}
.sq{font-weight:600;color:var(--mut);font-size:14px;margin:0 2px -4px}
.stage .pair{margin-bottom:0}
.d3{height:clamp(220px,calc(var(--vh,1vh)*100 - 380px),480px)}
.d2{height:clamp(220px,calc(var(--vh,1vh)*100 - 380px),480px);min-height:0}.d2 svg{max-height:100%;height:100%}
.d3 .tools button{min-width:40px;min-height:40px}
.fb img.acc{width:84px;height:84px;border-radius:14px;object-position:50% 30%;animation:sk .4s 2}
.boom{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;background:#0006;animation:bfade 1.5s forwards;cursor:pointer}
.boom .bw{position:relative;animation:bpop .5s cubic-bezier(.2,1.6,.4,1)}
.boom img{width:min(300px,70vw);height:auto;border-radius:24px;border:4px solid #fff;box-shadow:0 10px 40px #000a;display:block;background:var(--hd)}
.boom b{position:absolute;left:50%;top:-26px;transform:translateX(-50%) rotate(-8deg);font:800 54px/1 'Outfit',sans-serif;color:#F5B700;-webkit-text-stroke:3px #D7262E;paint-order:stroke fill;text-shadow:0 4px 0 #20262F;white-space:nowrap}
@keyframes bpop{0%{transform:scale(.3) rotate(-12deg);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bfade{0%,75%{opacity:1}100%{opacity:0}}
@media (max-width:979px){
 .qgrid{grid-template-columns:1fr;gap:10px}
 .stage .pair:not(.one){grid-template-columns:1fr;gap:6px}
 .stage .pair:not(.one) .vw{display:none}
 .stage .pair:not(.one) .mol{display:grid;grid-template-columns:1fr;position:relative}
 .stage .pair:not(.one) .mh{position:absolute;left:0;top:0;z-index:2;background:none;pointer-events:none}
 .stage .pair:not(.one) .d2,.stage .pair:not(.one) .d3{border-top:0}
 .vw button{min-height:40px} .chip .ln,.tbar .legend{display:none}.chip .sn{display:inline}.chip{padding:6px 11px}
 .stage .pair:not(.one) .mh{min-height:34px;padding:6px 10px}.stage .pair:not(.one) .mh b,.stage .pair:not(.one) .nm{font-size:13px}
 .d2,.d3{height:clamp(120px,calc((var(--vh,1vh)*100 - 470px)/2),300px)}
 .stage .pair:not(.one) .fm{position:absolute;right:0;bottom:0;padding:2px 8px;font-size:12px}
 .pair.one .d3{height:clamp(240px,calc(var(--vh,1vh)*100 - 470px),420px)}
 .tbar{margin-bottom:8px;gap:6px}
 .chip{min-height:40px}
 .side{position:sticky;top:auto;bottom:0;max-height:calc(var(--vh,1vh)*52);background:var(--bg);margin:0 -16px -30px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;box-shadow:0 -6px 20px #0000001f;z-index:5;gap:8px}
 .side .ans{gap:6px}.side .grp{grid-template-columns:repeat(3,1fr);padding:5px;gap:5px}.side .grp h3{grid-column:1/-1;font-size:11px;margin:0 2px}
 .side .opt{padding:4px 4px;font-size:13.5px;min-height:42px;text-align:center}.side .opt small,.side .opt .ln{display:none}.side .opt .sn{display:inline}
 .side.done .ans{display:none}
 .sb{margin-bottom:8px;flex-wrap:nowrap;gap:6px}.sbt{padding:4px 9px;min-width:0;border-radius:12px}.sbt b{font-size:19px}.sbt span{font-size:13px}.sbt .tdot{width:10px;height:10px;margin-right:4px}
 .qhead{margin:2px 2px 8px;flex-wrap:nowrap;gap:8px}.qhead h2{font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qhead .gc{height:26px;min-width:30px;font-size:13px}
 .turn{font-size:13px;padding:4px 9px;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .stage .pair:not(.one) .d2,.stage .pair:not(.one) .d3{height:var(--mh,clamp(120px,calc((var(--vh,1vh)*100 - 470px)/2),300px))}
 .pair.one .d3,.pair.one .d2{height:var(--mh,clamp(240px,calc(var(--vh,1vh)*100 - 470px),420px))}
 .side .grp{padding:4px 5px 5px}.side .grp h3{font-size:10.5px}
 .side .rs .opt{font-size:30px;padding:8px;min-height:56px}.side .rs.tau .opt{font-size:19px}.turn .tp{display:none}.snd{width:36px;height:36px}.snd svg{width:23px;height:23px}
 .side .fb img.acc{width:64px;height:64px}
 .fb b{font-size:16px}
}

header{cursor:pointer}body{cursor:default}header .mw{cursor:pointer;-webkit-tap-highlight-color:transparent}header .mw:focus{outline:none}header .masc{pointer-events:none}
.eye{position:absolute;width:10.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#F8F5E8;overflow:hidden;pointer-events:none}
.eye i{position:absolute;left:50%;top:50%;width:28%;height:28%;margin:-14% 0 0 -14%;border-radius:50%;background:#140808;transition:transform .35s ease}
.eye::after{content:'';position:absolute;inset:0;background:#E6B78E;transform:scaleY(0);transform-origin:top;transition:transform .09s}
.mw.blink .eye::after{transform:scaleY(1)}
.mw.roll .eye i{animation:roll 1.3s ease-in-out}
@keyframes roll{0%{transform:translate(0,0)}20%{transform:translate(155%,-80%)}40%{transform:translate(0,-170%)}60%{transform:translate(-155%,-80%)}80%{transform:translate(-90%,60%)}100%{transform:translate(0,0)}}
.mw .masc{transform-origin:50% 100%}.mw.tilt .masc{animation:tilt 1.1s ease-in-out}
@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}55%{transform:rotate(4deg)}80%{transform:rotate(-2deg)}}
.mw.lookl .eye i{transform:translate(-165%,15%)}.mw.lookr .eye i{transform:translate(165%,-15%)}.mw.lookup .eye i{transform:translate(0,-160%)}
.spk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0}
.mw.spark .spk{animation:spk .9s ease-out}
@keyframes spk{0%{opacity:0;transform:scale(.8)}25%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.12)}}
.mw.spark .masc{animation:hop .6s ease}
.bub{position:absolute;right:130px;top:44px;width:200px;background:#fff;color:#1F2329;border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.35;font-weight:500;box-shadow:0 6px 20px #0005;opacity:0;transform:translateY(6px) scale(.95);transition:opacity .25s,transform .25s;pointer-events:none;z-index:3}
.bub::after{content:'';position:absolute;right:-7px;top:24px;border:8px solid transparent;border-left-color:#fff;border-right:0}
.bub.on{opacity:1;transform:none}
header.cm .bub{display:none}
@media (prefers-reduced-motion:reduce){.mw .masc,.mw .spk{animation:none!important}}

/* ---------- automatické zvětšení na velkých obrazovkách ---------- */
let ZOOM=1;
function fitScreen(){const W=innerWidth,H=innerHeight;let z=Math.min(W/1280,H/800);z=W>=1400&&H>=860?Math.min(Math.max(z,1),2):1;z=Math.round(z*100)/100;
 const r=document.documentElement;if(z!==ZOOM){ZOOM=z;r.style.zoom=z===1?'':String(z)}r.style.setProperty('--vh',(H/z/100)+'px')}
/* mobil: molekuly se vejdou mezi hlavičku a panel odpovědí */
let FW=0,FH=0;
function fitMol(scroll){const pair=document.querySelector('.stage .pair'),side=document.querySelector('.side'),r=document.documentElement;
 if(!pair||!side||innerWidth/ZOOM>=980){r.style.removeProperty('--mh');return}
 if(side.classList.contains('done')&&!scroll)return;
 const H=innerHeight/ZOOM,n=pair.classList.contains('one')?1:2,top=pair.getBoundingClientRect().top+scrollY,sideH=side.offsetHeight;
 const calc=off=>(H-(top-off)-sideH-10-6*(n-1))/n;
 let mh=calc(0),off=0;
 if(scroll&&mh<170){const q=document.querySelector('.sb');off=Math.max(0,(q?q.getBoundingClientRect().top+scrollY:0)-4);mh=calc(off)}
 mh=Math.max(110,Math.min(n===1?420:300,Math.floor(mh)));r.style.setProperty('--mh',mh+'px');
 if(scroll&&off)requestAnimationFrame(()=>window.scrollTo(0,off))}
fitScreen();addEventListener('resize',()=>{fitScreen();const w=innerWidth,hh=innerHeight;if(Math.abs(w-FW)>2||Math.abs(hh-FH)>100){FW=w;FH=hh;fitMol(false)}});

function mat(ax,ay){const cx=Math.cos(ax),sx=Math.sin(ax),cy=Math.cos(ay),sy=Math.sin(ay);return[[cy,0,sy],[sx*sy,cx,-sx*cy],[-cx*sy,sx,cx*cy]]}

  this.ro=new ResizeObserver(()=>this.draw());this.ro.observe(box);viewers.add(this);this.draw()}

 hBack(){/* natočí vazbu C–H stereocentra od pozorovatele */const c=this.star,p=this.mol.p[c],hI=p[3],A=this.mol.a;
  const v=[A[hI][1]-A[c][1],A[hI][2]-A[c][2],A[hI][3]-A[c][3]];const n=Math.hypot(...v);const z=v.map(x=>x/n);
  let x=Math.abs(z[0])<.9?[1,0,0]:[0,1,0];const d=x[0]*z[0]+x[1]*z[1]+x[2]*z[2];x=x.map((q,i)=>q-d*z[i]);const nx=Math.hypot(...x);x=x.map(q=>q/nx);
  const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
  const target=[x,y.map(q=>-q),z.map(q=>-q)];/* vlastní rotace (det = +1), jinak by se obraz zrcadlil *//* řádky = nové osy; H míří do -z (dozadu) */
  const start=this.R,t0=performance.now();this.idle=false;
  const step=t=>{const k=Math.min(1,(t-t0)/700),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
   const M=start.map((r,i)=>r.map((q,j)=>q*(1-e)+target[i][j]*e));
   /* Gram-Schmidt */const a=M[0],b=M[1];const na=Math.hypot(...a);const a2=a.map(q=>q/na);const db=b[0]*a2[0]+b[1]*a2[1]+b[2]*a2[2];let b2=b.map((q,i)=>q-db*a2[i]);const nb=Math.hypot(...b2);b2=b2.map(q=>q/nb);
   const c2=[a2[1]*b2[2]-a2[2]*b2[1],a2[2]*b2[0]-a2[0]*b2[2],a2[0]*b2[1]-a2[1]*b2[0]];this.R=[a2,b2,c2];this.draw();if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
 draw(){const cv=this.cv,dpr=window.devicePixelRatio||1,W=this.box.clientWidth,H=this.box.clientHeight;if(!W)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}

      c.lineCap='round';c.lineWidth=w+2;c.strokeStyle='#0d1015';c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.stroke();
      c.lineWidth=w;c.strokeStyle=COL[A.e];c.beginPath();c.moveTo(ax,ay);c.lineTo(mx,my);c.stroke();c.strokeStyle=COL[B.e];c.beginPath();c.moveTo(mx,my);c.lineTo(bx,by);c.stroke()}
     c.globalAlpha=1}
   else{const p=P[q.i],r=RAD[p.e]*s;c.globalAlpha=fog(p.z);const g=c.createRadialGradient(p.x-r*.35,p.y-r*.35,r*.1,p.x,p.y,r);g.addColorStop(0,'#fff');g.addColorStop(.25,COL[p.e]);g.addColorStop(1,shade(COL[p.e]));c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,r,0,7);c.fill();c.globalAlpha=1;

    const lb=this.labels&&this.labels[q.i];if(lb){c.font='700 '+Math.max(13,.32*s)+'px Outfit,system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';const tx=p.x+r*.9,ty=p.y-r*.9,w=c.measureText(lb).width+10;c.fillStyle='#F5B700';c.beginPath();c.roundRect(tx-w/2,ty-11,w,22,8);c.fill();c.fillStyle='#1F2329';c.fillText(lb,tx,ty+1)}}}
 }

}
function shade(hex){const n=parseInt(hex.slice(1),16),f=.45;return'rgb('+[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.round(v*f)).join(',')+')'}

function mirror(m){return{...m,a:m.a.map(a=>[a[0],a[1],a[2],-a[3]]),c:m.c.map(([i,l])=>[i,l==='R'?'S':'R'])}}

  <div><b>diastereomery</b> – stereoizomery, které nejsou zrcadlové; mají různé fyzikální vlastnosti <span class="ex">glukosa × galaktosa</span><br>
   – <b>epimery</b>: liší se na jediném stereocentru · <b>anomery</b>: liší se na anomerním uhlíku (α × β)</div>
  <div><b>mezoforma</b> – má stereocentra, ale i rovinu symetrie → achirální <span class="ex">kys. mesovinná</span></div>
  <div class="mut">Konformace (natočení kolem jednoduché vazby) nejsou izomery – přecházejí na sebe volně.</div></div></div>
 </div>`}));
 app.append(h('h2',{},'Jak určit R / S'));
 app.append(h('div',{cls:'card',html:`<ol style="margin:0;padding-left:20px;display:grid;gap:6px">
 <li>Najděte <b>stereocentrum</b> (uhlík se 4 různými substituenty).</li>
 <li>Seřaďte substituenty podle <b>atomového čísla</b> prvního atomu (O > N > C > H). Při shodě porovnejte atomy dál v řetězci (–CHO má O, O, H; –CH₂OH jen O, H, H).</li>
 <li>Natočte molekulu tak, aby substituent s nejnižší prioritou (obvykle <b>H</b>) mířil <b>od vás</b>.</li>
 <li>Jděte 1 → 2 → 3: <b>po směru</b> hodinových ručiček = <b>R</b> (rectus), <b>proti směru</b> = <b>S</b> (sinister).</li></ol>
 <p class="mut" style="margin:10px 0 0">D/L (Fischerova projekce) a R/S nejsou totéž: L-alanin je S, ale L-cystein je R.</p>`}));
 app.append(h('h2',{},'Jak určit Z / E'));
 app.append(h('div',{cls:'card',html:`<ol style="margin:0;padding-left:20px;display:grid;gap:6px">
 <li>Na <b>každém uhlíku dvojné vazby</b> zvlášť porovnejte oba substituenty podle stejných pravidel CIP jako u R/S (vyšší protonové číslo = vyšší priorita).</li>
 <li>Skupiny s vyšší prioritou jsou na <b>stejné straně</b> = <b>Z</b> (zusammen), na <b>opačných stranách</b> = <b>E</b> (entgegen).</li></ol>
 <p class="mut" style="margin:10px 0 0">Z nemusí znamenat cis: u (Z)-3-methylpent-2-enu jsou methyly na opačných stranách, ale ethyl má vyšší prioritu než methyl.</p>`}));
 app.append(h('button',{cls:'btn s',on:{click:home}},'Zpět'));
