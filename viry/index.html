:root{--hd:#20262F;--tile:#2B313A;--bg:#F2F3F5;--card:#fff;--tx:#1F2329;--mut:#646B76;--pri:#D7262E;--pri2:#B21E25;--ok:#15803d;--okb:#dcfce7;--ko:#b91c1c;--kob:#fee2e2;--bd:#E3E5E9;--wa:#b45309;--wab:#fef3c7;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171C;--card:#1E232B;--tx:#EEF0F3;--mut:#9AA3AE;--bd:#2E3540;--ok:#4ade80;--okb:#12341f;--ko:#f87171;--kob:#3b1618;--pri:#E5383F;--wa:#fbbf24;--wab:#3a2c0c}}
:root[data-theme="dark"]{--bg:#14171C;--card:#1E232B;--tx:#EEF0F3;--mut:#9AA3AE;--bd:#2E3540;--ok:#4ade80;--okb:#12341f;--ko:#f87171;--kob:#3b1618;--pri:#E5383F;--wa:#fbbf24;--wab:#3a2c0c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 'Outfit',system-ui,-apple-system,"Segoe UI",sans-serif;min-height:calc(var(--vh,1vh)*100);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--hd);color:#fff;padding:18px 18px 26px;display:flex;align-items:flex-end;gap:8px;max-width:560px;margin:0 auto;position:relative;box-shadow:0 0 0 100vmax var(--hd);clip-path:inset(0 -100vmax)}
header .ht{flex:1;padding:0 120px 30px 0;position:relative;z-index:1;pointer-events:none}
header h1{margin:0;font-size:31px;line-height:1.02;font-weight:800;letter-spacing:-.01em}
header h1 span{color:var(--pri);display:block}
header p{margin:8px 0 0;color:#C9CED6;font-size:15px}
header .mw{position:absolute;right:0;bottom:0;width:168px;z-index:0}
header .masc{width:100%;height:auto;display:block;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14%);mask-image:linear-gradient(to right,transparent 0,#000 14%)}
header .sv{position:absolute;left:180px;top:22px;z-index:2;font-family:'Caveat','Segoe Print','Comic Sans MS',cursive;font-size:21px;font-weight:700;color:#fff;transform:rotate(-10deg);transform-origin:left center;white-space:nowrap;pointer-events:none}
header.cm{padding:12px 16px 30px;max-width:1180px}
header.cm .ht{padding:0 0 4px}
header.cm h1{font-size:20px}
header.cm h1 span{display:inline;margin-left:6px}
header.cm p,header.cm .sv,header.cm .mw{display:none}
@media (max-width:380px){header .sv{font-size:18px;left:178px}header .mw{width:150px}}
main{position:relative;z-index:1;background:var(--bg);border-radius:30px 30px 0 0;margin:-26px auto 0;padding:22px 16px 30px;max-width:560px;min-height:calc(var(--vh,1vh)*100 - 160px)}
main.wide{max-width:1180px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #0000000a}
h2{font-size:18px;margin:8px 2px 10px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
.hello h2{font-size:26px;line-height:1.2;margin:0 0 10px}
.hello p{margin:0 0 16px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tl{position:relative;text-align:left;border:0;border-radius:16px;padding:16px 14px;min-height:136px;background:var(--tile);color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.tl.red{background:var(--pri)}
.tl.wide{grid-column:span 2;min-height:124px}
.tl svg.ic{position:absolute;left:14px;top:14px}
.tl b{font-size:19px}
.tl small{font-size:13px;opacity:.85}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--pri);cursor:pointer;box-shadow:0 2px 0 var(--pri2)}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:600;box-shadow:none}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px 4px;border-radius:10px;font:inherit;font-size:14px;font-weight:500;min-height:40px;cursor:pointer}
.seg button.on{background:var(--tile);color:#fff;font-weight:600}
.lab{font-size:13px;color:var(--mut);margin:12px 2px 6px;font-weight:600}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--tile);color:#fff;border-color:var(--tile)}
.chip.hint{border-color:var(--wa);color:var(--wa)}
.chip.hint.on{background:var(--wa);color:#fff}
@keyframes sk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{border-radius:16px;padding:14px;margin:0 0 12px;display:flex;gap:12px;align-items:flex-start}
.fb.ok{background:var(--okb)}
.fb.ko{background:var(--kob)}
.fb.half{background:var(--wab)}
.fb img{width:54px;height:54px;border-radius:27px;object-fit:cover;object-position:50% 18%;background:var(--hd);flex-shrink:0}
.fb b{font-size:18px;display:block}
.fb.ok b{color:var(--ok)}
.fb.ko b{color:var(--ko)}
.fb.half b{color:var(--wa)}
.fb p{margin:4px 0 0;color:var(--tx)}
.fb img.hop{animation:hop .6s ease}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-6px)}}
footer.ver{max-width:560px;margin:0 auto;text-align:center;font-size:11px;color:var(--mut);padding:6px 16px 14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.zpet{display:block;width:100%;margin:0;background:var(--hd);padding:10px 18px 8px max(18px,calc((100% - 560px)/2 + 18px));font-size:13px;font-weight:500;color:#A3AAB5;text-decoration:none}
.fb img.acc{width:84px;height:84px;border-radius:14px;object-position:50% 30%;animation:sk .4s 2}
header{cursor:pointer}
header .mw{cursor:pointer;-webkit-tap-highlight-color:transparent}
header .mw:focus{outline:none}
header .masc{pointer-events:none}
.eye{position:absolute;width:10.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#F8F5E8;overflow:hidden;pointer-events:none}
.eye i{position:absolute;left:50%;top:50%;width:28%;height:28%;margin:-14% 0 0 -14%;border-radius:50%;background:#140808;transition:transform .35s ease}
.eye::after{content:'';position:absolute;inset:0;background:#E6B78E;transform:scaleY(0);transform-origin:top;transition:transform .09s}
.mw.blink .eye::after{transform:scaleY(1)}
.mw.roll .eye i{animation:roll 1.3s ease-in-out}
@keyframes roll{0%{transform:translate(0,0)}20%{transform:translate(155%,-80%)}40%{transform:translate(0,-170%)}60%{transform:translate(-155%,-80%)}80%{transform:translate(-90%,60%)}100%{transform:translate(0,0)}}
.mw .masc{transform-origin:50% 100%}
.mw.tilt .masc{animation:tilt 1.1s ease-in-out}
@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}55%{transform:rotate(4deg)}80%{transform:rotate(-2deg)}}
.mw.lookl .eye i{transform:translate(-165%,15%)}
.mw.lookr .eye i{transform:translate(165%,-15%)}
.mw.lookup .eye i{transform:translate(0,-160%)}
.spk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0}
.mw.spark .spk{animation:spk .9s ease-out}
@keyframes spk{0%{opacity:0;transform:scale(.8)}25%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.12)}}
.mw.spark .masc{animation:hop .6s ease}
.bub{position:absolute;right:130px;top:44px;width:200px;background:#fff;color:#1F2329;border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.35;font-weight:500;box-shadow:0 6px 20px #0005;opacity:0;transform:translateY(6px) scale(.95);transition:opacity .25s,transform .25s;pointer-events:none;z-index:3}
.bub::after{content:'';position:absolute;right:-7px;top:24px;border:8px solid transparent;border-left-color:#fff;border-right:0}
.bub.on{opacity:1;transform:none}
header.cm .bub{display:none}
@media (prefers-reduced-motion:reduce){.mw .masc,.mw .spk{animation:none!important}}


/* ---------- viry ---------- */
.r{color:var(--pri);font-weight:600}
header h1{font-size:29px}header:not(.cm) h1 span.r2{font-size:.86em;white-space:nowrap}
header h1 span.w{position:relative;display:inline-block;color:#fff}header h1 .w .sv{position:absolute;left:100%;top:6px;margin-left:8px;font-style:normal;transform:rotate(-12deg);transform-origin:left bottom;color:#fff;white-space:nowrap}
@media (max-width:560px){header .mw{width:128px}header .ht{padding-right:96px}header h1{font-size:27px}header h1 .w .sv{font-size:17px;top:4px;margin-left:4px}}header.cm h1 .w .sv{display:none}
@media (max-width:380px){header h1{font-size:25px}header h1 .w .sv{font-size:16px}}
.tl svg.ic{width:30px;height:30px}.tl{padding-top:52px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip.on{background:var(--hd);color:#fff;border-color:var(--hd)}.chip.dn{background:var(--okb);border-color:var(--ok);color:var(--ok)}.chip.wa{background:var(--wab);border-color:var(--wa);color:var(--wa)}
.chip.snd{display:inline-flex;align-items:center;gap:6px}
.stagew{display:grid;gap:12px}.stagew>*{min-width:0}
.stage{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px #0000000a}
.svw{position:relative;background:#e9f3fa}
.stage svg{display:block;width:100%;height:auto;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tipb{position:absolute;z-index:5;max-width:240px;background:#20262F;color:#fff;border-radius:12px;padding:8px 11px;font-size:13.5px;line-height:1.35;pointer-events:none;box-shadow:0 6px 18px #0004}.tipb b{display:block;font-size:14.5px;margin-bottom:2px;color:#fff}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:700;color:#fff;background:var(--tile);white-space:nowrap}
.stage .big{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;border:0;background:#20262Fcc;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .2s,transform .2s}

const LAB=[
 {t:'evo',n:'Jsou viry živé?',q:'Vyjádři svůj názor a obhaj ho. Sepiš, které vlastnosti živých soustav viry mají a které jim chybí.',
  h:'Projdi si znaky života: buněčná stavba, metabolismus, růst, rozmnožování, dědičnost, vývoj (evoluce), dráždivost. Které z nich platí pro virion mimo buňku a které pro virus v hostitelské buňce?',
  s:'Jednoznačná odpověď neexistuje, záleží na definici života. Pro: viry mají genetickou informaci, množí se, mutují a vyvíjejí se. Proti: nemají buňku, metabolismus ani ribozomy a mimo hostitelskou buňku jsou jen neaktivní částice. Často se proto říká, že stojí „na hranici živého a neživého“.'},
 {t:'lecba',n:'Proč antibiotika na viry nefungují',q:'Zjisti, na které struktury bakterií působí antibiotika (například penicilin). Vysvětli, proč stejná léčiva nemohou zničit virus. Proč lékař přesto někdy při viróze antibiotika předepíše?',
  h:'Porovnej stavbu bakterie a virionu. Má virus buněčnou stěnu, vlastní ribozomy nebo vlastní metabolismus?',
  s:'Antibiotika zasahují struktury a děje bakterií: tvorbu buněčné stěny (penicilin), bakteriální ribozomy, replikaci DNA. Virus nic z toho nemá, využívá vybavení naší buňky. Antibiotika při viróze pomohou jen tehdy, když se přidá bakteriální infekce. Zbytečné užívání podporuje vznik odolných (rezistentních) bakterií.'},
 {t:'lecba',n:'Kde zastavit virus',q:'Pusť si animaci cyklu retroviru (HIV). U každého kroku navrhni, jak by ho mohlo léčivo zablokovat. Pak vyhledej, které skupiny léčiv proti HIV se skutečně používají, a porovnej je se svými návrhy.',go:'animace-retro',
  h:'Hledej kroky, které hostitelská buňka sama neprovádí: reverzní transkripci, začlenění DNA, zrání virionu. Proč je výhodné cílit právě na ně?',
  s:'Používají se inhibitory vstupu a fúze, inhibitory reverzní transkriptázy, inhibitory integrázy a inhibitory proteázy (brání zrání virionu). Cílí na virové enzymy, které naše buňky nemají, takže méně poškozují hostitele. Kombinace několika léčiv ztěžuje vznik odolných mutantů. Provirus v DNA buněk ale odstranit neumíme, proto léčba HIV zatím trvá celý život.'},
 {t:'lecba',n:'Rýma a chřipka',q:'Účinných antivirotik je málo. Zjisti proč. Čím se tedy běžně léčí rýma nebo chřipka? Které léky jen tlumí příznaky a které působí přímo na virus?',
  h:'Virus se množí uvnitř našich buněk a používá jejich enzymy. Co by se stalo s buňkou, kdyby léčivo zablokovalo její ribozomy?',
  s:'Virus využívá aparát hostitelské buňky, takže je těžké zasáhnout virus a nepoškodit buňku. Navíc viry rychle mutují. Běžné virózy se proto léčí symptomaticky: klid, tekutiny, léky proti horečce a bolesti, kapky do nosu. Přímo proti viru chřipky působí například oseltamivir (blokuje enzym neuraminidázu, který virionům umožňuje opustit buňku), musí se ale podat brzy.'},
 {t:'vakc',n:'Jak funguje očkování',q:'Popiš, co se v těle stane po očkování. Jak se odborně označuje schopnost tvořit protilátky? V čem se očkování liší od prodělání nemoci?',
  h:'Hledej pojmy: antigen, protilátka, B-lymfocyt, paměťová buňka, primární a sekundární imunitní odpověď.',
  s:'Vakcína obsahuje antigen (oslabený či usmrcený původce, jeho část, nebo návod na jeho bílkovinu). Imunitní systém vytvoří protilátky a paměťové buňky (specifická, získaná imunita, imunitní paměť). Při setkání se skutečným virem je odpověď rychlejší a silnější. Na rozdíl od nemoci získáš ochranu bez rizika těžkého průběhu a komplikací.'},
 {t:'vakc',n:'Vakcíny proti covidu-19',q:'Vyhledej, na jakém principu fungují mRNA vakcíny proti onemocnění covid-19. Co přesně vakcína obsahuje a co se s tím stane v buňce? Porovnej s vektorovou vakcínou.',
  h:'Vzpomeň si na translaci. Co buňka vyrobí podle mRNA? Kterou bílkovinu koronaviru imunitní systém nejsnáze „uvidí“?',
  s:'mRNA vakcína obsahuje mRNA s návodem na povrchový glykoprotein koronaviru (spike protein), zabalenou v tukových kapénkách. Buňky podle ní na ribozomech bílkovinu vyrobí a imunitní systém si proti ní vytvoří protilátky a paměťové buňky. mRNA se do jádra nedostává a brzy se rozloží. Vektorová vakcína dopraví gen pro stejnou bílkovinu pomocí neškodného viru (adenoviru). Za vývoj mRNA vakcín získali Katalin Karikó a Drew Weissman Nobelovu cenu (2023).'},
 {t:'vakc',n:'Vymýcené pravé neštovice',q:'Pravé neštovice jsou jediná lidská nemoc, kterou se podařilo zcela vymýtit. Zjisti, kdo a kdy provedl první očkování, kdy byla nemoc prohlášena za vymýcenou a proč se to povedlo právě u ní. Proč to nejde stejně u chřipky?',
  h:'Zaměř se na tři věci: kolik má virus hostitelů, jak stabilní je jeho dědičná informace a jak snadno se nemocný pozná.',
  s:'Edward Jenner v roce 1796 očkoval chlapce kravskými neštovicemi (odtud slovo vakcína, latinsky <i>vacca</i> = kráva). WHO prohlásila neštovice za vymýcené roku 1980. Pomohlo, že virus napadá jen člověka, málo se mění, nemoc má nápadné příznaky a vakcína je účinná. Virus chřipky rychle mutuje a má zásobárnu ve zvířatech (ptáci, prasata).'},
 {t:'epi',n:'Epidemie, nebo pandemie?',q:'Vysvětli rozdíl mezi epidemií a pandemií. Najdi po dvou příkladech z historie. Kterým jedním slovem cizího původu bys pandemii popsal/a? Zjisti, kolik obětí měla španělská chřipka.',
  h:'Rozhoduje územní rozsah, ne závažnost nemoci. Předpona pan- znamená řecky „vše“.',
  s:'Epidemie je neobvykle vysoký výskyt nemoci v určité oblasti a čase (město, region, stát). Pandemie je epidemie rozšířená přes státy a kontinenty, je tedy celosvětová (globální). Příklady pandemií: španělská chřipka 1918–1920 (odhady desítek milionů obětí), covid-19, HIV/AIDS. Epidemie: ebola v západní Africe 2014–2016, sezonní chřipka v jednotlivých zemích.'},
 {t:'epi',n:'Kolektivní imunita',q:'Základní reprodukční číslo R₀ udává, kolik lidí průměrně nakazí jeden nemocný v populaci bez imunity. Spalničky mají R₀ asi 15. Jaký podíl lidí musí být imunní, aby se nemoc přestala šířit? Použij vztah: podíl = 1 − 1/R₀. Vypočítej totéž pro R₀ = 2.',
  h:'Nemoc ustupuje, když jeden nemocný nakazí v průměru méně než jednoho dalšího člověka.',
  s:'Pro spalničky: 1 − 1/15 ≈ 0,93, tedy asi 93 % lidí. Pro R₀ = 2: 1 − 1/2 = 50 %. Proto je u velmi nakažlivých nemocí nutná vysoká proočkovanost. Chrání i ty, kdo očkováni být nemohou (malé děti, lidé s poruchou imunity).'},
 {t:'evo',n:'Proč se proti chřipce očkuje každý rok',q:'Proti spalničkám stačí očkování v dětství, proti chřipce se vakcína mění každý rok. Vysvětli to. Zjisti, co znamenají pojmy antigenní drift a antigenní shift.',
  h:'Virus chřipky má RNA rozdělenou na 8 úseků a jeho RNA-polymeráza často chybuje. Co se stane, když jednu buňku napadnou dva různé kmeny chřipky?',
  s:'RNA viry mutují rychle, protože jejich polymeráza neopravuje chyby. Drobné změny povrchových glykoproteinů (antigenní drift) způsobí, že loňské protilátky virus hůř poznají. Když jednu buňku napadnou dva kmeny, mohou si vyměnit celé úseky RNA (antigenní shift). Vznikne zcela nový kmen, který může vyvolat pandemii. Virus spalniček je naproti tomu velmi stálý.'},
 {t:'evo',n:'Odkud se berou nové viry',q:'Zjisti, co je zoonóza. Vyhledej původ viru HIV a jednoho dalšího viru, který na člověka přeskočil ze zvířat. Které lidské činnosti takové přeskoky usnadňují?',
  h:'Vzpomeň si na princip klíče a zámku. Co se musí u viru změnit, aby dokázal napadnout buňky jiného druhu?',
  s:'Zoonóza je nemoc přenosná ze zvířat na člověka. HIV vznikl z viru SIV šimpanzů a dalších primátů ve střední Africe na počátku 20. století. Další příklady: ptačí chřipka, ebola (kaloni), SARS-CoV-2 (pravděpodobně netopýři). Mutace změní povrchovou bílkovinu tak, že se naváže na receptor nového hostitele. Přeskokům napomáhá kácení lesů, obchod s divokými zvířaty, velkochovy a cestování.'},
 {t:'evo',n:'Viry v naší DNA',q:'Asi 8 % lidského genomu tvoří pozůstatky dávných retrovirů. Vysvětli pomocí animace cyklu retroviru, jak se tam mohly dostat. Zjisti, k čemu člověku slouží bílkovina syncytin.',go:'animace-retro',
  h:'Co by se stalo, kdyby retrovirus začlenil svou DNA do pohlavní buňky (vajíčka nebo spermie)?',
  s:'Když se provirus začlení do DNA pohlavní buňky, dědí se na potomky jako každý jiný gen (endogenní retrovirus). Během milionů let většina těchto sekvencí zmutovala a je nefunkční. Některé ale získaly novou úlohu: syncytin, původně virový obalový glykoprotein umožňující splývání membrán, je nezbytný pro vznik placenty.'},
 {t:'vyuz',n:'Fágy místo antibiotik',q:'Bakterií odolných vůči antibiotikům přibývá. Zjisti, co je fágová terapie, kdo ji objevil a kde se používá. Jaké má výhody a nevýhody proti antibiotikům?',go:'animace-fag',
  h:'Podívej se na lytický cyklus bakteriofága. Kolik druhů bakterií jeden fág napadá? Je to výhoda, nebo nevýhoda?',
  s:'Fágová terapie léčí bakteriální infekce bakteriofágy s lytickým cyklem. Fágy objevili Frederick Twort (1915) a Félix d’Hérelle (1917). Tradici má léčba v Gruzii (Tbilisi) a v Polsku. Výhody: fág ničí jen určitý druh bakterií, množí se v místě infekce, nenapadá lidské buňky. Nevýhody: je třeba přesně určit bakterii, bakterie si mohou vytvořit odolnost i vůči fágům, imunitní systém může fágy odstranit.'},
 {t:'vyuz',n:'Viry jako nástroj',q:'Viry umějí dopravit svou nukleovou kyselinu do buňky. Vyhledej, jak toho využívá genová terapie a jak onkolytické viry. Uveď jeden konkrétní příklad léčby.',
  h:'Co kdyby se z viru odstranily geny pro jeho množení a nahradily se „užitečným“ genem?',
  s:'Virové vektory (upravené adenoviry, adenoasociované viry, retroviry) nesou místo svých genů funkční lidský gen a dopraví ho do buněk pacienta. Tak se léčí například spinální svalová atrofie nebo některé dědičné poruchy zraku a imunity. Onkolytické viry jsou upraveny tak, aby se množily jen v nádorových buňkách a ničily je. Virové vektory se používají i ve vakcínách.'},
 {t:'vyuz',n:'Obrana bakterií a genové nůžky',q:'I bakterie se virům brání. Zjisti, co je systém CRISPR-Cas a jak bakterii chrání před bakteriofágy. Jak ho dnes využívají vědci?',
  h:'Bakterie si ukládá krátké úseky DNA fágů, které přežila. K čemu jí může být taková „kartotéka“?',
  s:'Bakterie si do své DNA ukládá krátké úseky DNA fágů. Podle nich vyrobí RNA, která navede enzym Cas ke stejné sekvenci při další infekci, a enzym fágovou DNA rozstřihne. Jde o jakousi imunitní paměť bakterií. Vědci systém využívají jako přesné „genové nůžky“ k cíleným úpravám DNA. Emmanuelle Charpentier a Jennifer Doudna za to získaly Nobelovu cenu za chemii (2020).'},
 {t:'hist',n:'Objeveny dřív, než byly vidět',q:'Viry byly objeveny koncem 19. století, ale poprvé spatřeny až kolem roku 1939. Zjisti, jak Dmitrij Ivanovskij (1892) a Martinus Beijerinck (1898) dokázali, že nemoc tabáku nezpůsobuje bakterie. Proč viry nemohli vidět?',
  h:'Použili porcelánový filtr s póry menšími než bakterie. Co udělala přefiltrovaná šťáva z nemocné rostliny se zdravou rostlinou?',
  s:'Šťáva z listů tabáku napadených mozaikou zůstala nakažlivá i po průchodu filtrem, který zadržuje bakterie. Původce tedy musel být mnohem menší. Beijerinck navíc ukázal, že se množí jen v živých buňkách, a nazval ho virus (latinsky „jed“). Světelný mikroskop viry nerozliší. Uviděl je až elektronový mikroskop (Ernst Ruska, 1931), virus tabákové mozaiky byl zobrazen roku 1939.'},
 {t:'hist',n:'Pokus Hersheyho a Chaseové',q:'V roce 1952 pomohly bakteriofágy dokázat, že nositelkou dědičné informace je DNA, a ne bílkoviny. Zjisti, jak pokus probíhal. Proč se k němu fágy tak dobře hodily?',go:'animace-fag',
  h:'Podívej se na animaci: co z fága vstoupí do bakterie a co zůstane venku? Síra je v bílkovinách, fosfor v DNA.',
  s:'Alfred Hershey a Martha Chaseová označili bílkoviny fága radioaktivní sírou (³⁵S) a DNA radioaktivním fosforem (³²P). Po infekci bakterií a oddělení prázdných kapsidů našli uvnitř bakterií jen fosfor, tedy DNA. A právě podle ní vznikli noví fágové. Fág se hodil, protože ho tvoří jen DNA a bílkoviny a do buňky vstupuje pouze DNA.'},
 {t:'hist',n:'Objev, který otočil směr',q:'Dlouho platilo, že informace teče jen směrem DNA → RNA → bílkovina. Zjisti, kdo a kdy objevil reverzní transkriptázu a jak tento objev později pomohl při výzkumu viru HIV. K čemu se enzym používá v laboratořích dnes?',go:'animace-retro',
  h:'Hledej jména Howard Temin a David Baltimore. Vzpomeň si na testy PCR na covid-19: koronavirus má RNA, ale PCR množí DNA.',
  s:'Reverzní transkriptázu objevili roku 1970 nezávisle Howard Temin a David Baltimore (Nobelova cena 1975). Díky tomu bylo možné pochopit retroviry včetně HIV, který byl objeven roku 1983 v Pasteurově ústavu (Françoise Barré-Sinoussi a Luc Montagnier). Enzym se dnes používá k přepisu RNA do DNA, například při testech RT-PCR na RNA viry.'},
 {t:'onko',n:'Viry a nádory',q:'Některé viry mohou vyvolat nádorové bujení. Vysvětli, jak onkovirus změní buněčný cyklus. Zjisti, proti kterému onkoviru existuje očkování a komu se doporučuje.',
  h:'Buněčný cyklus má kontrolní body, které hlídají, kdy se buňka smí dělit. Co když virová bílkovina takovou „brzdu“ vyřadí?',
  s:'Virové bílkoviny vyřadí bílkoviny, které brzdí dělení buňky, nebo se provirus začlení do míst, kde naruší geny řídící buněčný cyklus. Buňka se pak dělí nekontrolovaně. Lidské papilomaviry (HPV) způsobují rakovinu děložního čípku a další nádory. Očkování se doporučuje dívkám i chlapcům kolem 11–14 let. Souvislost objevil Harald zur Hausen (Nobelova cena 2008).'},
 {t:'onko',n:'Virus, který přinesl gen pro rakovinu',q:'Roku 1911 přenesl Peyton Rous nádor (sarkom) z jedné slepice na druhou přefiltrovaným výtažkem bez buněk. Původcem byl retrovirus, dnes nazývaný virus Rousova sarkomu. Zjisti, co je onkogen a co protoonkogen a odkud se onkogen v tomto viru vzal. Proč bylo právě tohle pro pochopení rakoviny tak důležité?',go:'animace-retro',
