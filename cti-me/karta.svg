<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="640" height="240" role="img"><title>Učenec s knihou „Čti mě!“ stojí u rozcestníku se čtyřmi cedulemi a ptá se, kudy dál</title><defs>
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="17" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="wash" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="23" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="0.7"/></filter>
<filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 .42  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .12 0"/></filter>
<pattern id="sraf" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><path d="M0 0v3.4" stroke="#2a1e14" stroke-width=".7" opacity=".55"/></pattern>
</defs>
<rect width="320" height="120" fill="#f3e9d0"/><rect width="320" height="120" filter="url(#paper)"/>
<!-- vodové barvy -->
<g filter="url(#wash)" opacity="0.88">
<ellipse cx="160" cy="110" rx="150" ry="9" fill="#cdd3a4" opacity=".7"/>
<path d="M36 70h60l-4 28H40z" fill="#6fb3a6" opacity=".8"/>
<circle cx="66" cy="42" r="23" fill="#f0d3ab"/>
<path d="M44 36c4-16 38-20 46 0-12-7-30-8-46 0z" fill="#b9733f" opacity=".85"/>
<path d="M42 78l24-6 26 6-3 20H45z" fill="#fbf5e6"/>
<path d="M66 72l26 6-3 20H66z" fill="#f0e4c3"/>
<rect x="232" y="26" width="7" height="86" fill="#c9a36a"/>
<path d="M239 24h44l9 8-9 8h-44z" fill="#6fb3a6"/>
<path d="M232 44h-42l-9 8 9 8h42z" fill="#d9a441"/>
<path d="M239 62h46l9 8-9 8h-46z" fill="#c4633a" opacity=".85"/>
<path d="M232 80h-38l-9 8 9 8h38z" fill="#a8b46a"/>
<ellipse cx="120" cy="22" rx="26" ry="13" fill="#fffaf0"/>
</g>
<!-- sépiová linka -->
<g filter="url(#ink)" fill="none" stroke="#2a1e14" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
<path d="M10 109c60-3 120 2 180-1s90 3 120 0" stroke-width=".9" opacity=".7"/>
<circle cx="66" cy="42" r="23"/>
<path d="M44 37c3-15 38-19 46 0M50 24c6-4 12-5 20-5"/>
<circle cx="58" cy="43" r="5.5"/><circle cx="75" cy="43" r="5.5"/><path d="M63.5 43h6"/>
<circle cx="58" cy="44" r="1.3" fill="#2a1e14"/><circle cx="75" cy="44" r="1.3" fill="#2a1e14"/>
<path d="M58 55c5 5 13 5 18 0"/>
<path d="M36 70l-4 28h12M96 70l4 28H88" opacity=".9"/>
<path d="M40 100v8M52 100v8M80 100v8M92 100v8" />
<path d="M42 78l24-6 26 6-3 20H45zM66 72v26"/>
<path d="M232 26v86M239 112h-12" stroke-width="1.5"/>
<path d="M239 24h44l9 8-9 8h-44zM232 44h-42l-9 8 9 8h42zM239 62h46l9 8-9 8h-46zM232 80h-38l-9 8 9 8h38z"/>
<path d="M120 9c-14 0-26 6-26 13s12 13 26 13 26-6 26-13-12-13-26-13zM98 33l-6 8 12-6"/>
</g>
<!-- šrafy -->
<g filter="url(#ink)"><path d="M70 98h24l3-20-6 20z" fill="url(#sraf)"/><path d="M205 112h45v-3h-45z" fill="url(#sraf)"/></g>
<!-- popisky -->
<g font-family="Georgia,'Times New Roman',serif" font-style="italic" fill="#2a1e14" text-anchor="middle">
<text x="66" y="90" font-size="9.5" transform="rotate(-6 66 90)">Čti mě!</text>
<text x="261" y="36" font-size="8">pod lupou</text>
<text x="211" y="56" font-size="8">rychle</text>
<text x="262" y="74" font-size="8">laboratoř</text>
<text x="213" y="92" font-size="8">hloubat</text>
<text x="120" y="26" font-size="10">Kudy?</text>
</g>
</svg>
