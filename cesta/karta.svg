<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="640" height="240" role="img"><title>Klikatá cesta od startu k cíli s políčky, figurkami, volbou obtížnosti 1–4 a šotkem v čepici</title><defs>
<filter id="ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="19" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="wash" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="23" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="0.6"/></filter>
<filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="2"/><feColorMatrix values="0 0 0 0 .42  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .12 0"/></filter>
<pattern id="sraf" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><path d="M0 0v3.4" stroke="#2a1e14" stroke-width=".7" opacity=".6"/></pattern>
</defs>
<rect width="320" height="120" fill="#efe4c8"/><rect width="320" height="120" filter="url(#paper)"/>
<!-- cesta: vodová stopa -->
<g filter="url(#wash)" fill="none" stroke-linecap="round"><path d="M30 92C80 100 96 70 138 74S190 104 228 86S262 40 292 32" stroke="#c9a86a" stroke-width="22" opacity=".5"/></g>
<g filter="url(#ink)" fill="none" stroke="#3a2a1c" stroke-width=".9" stroke-linecap="round"><path d="M30 81C78 89 96 59 138 63S192 93 228 75S260 29 290 21" opacity=".7"/><path d="M30 103C80 111 98 81 138 85S188 115 228 97S266 51 294 43" opacity=".7"/></g>
<!-- políčka -->
<g filter="url(#ink)" stroke="#3a2a1c" stroke-width=".9">
<g fill="#fbf6e9"><circle cx="58" cy="94" r="7"/><circle cx="84" cy="86" r="7"/><circle cx="110" cy="75" r="7"/><circle cx="160" cy="81" r="7"/><circle cx="186" cy="92" r="7"/><circle cx="212" cy="91" r="7"/><circle cx="238" cy="80" r="7"/><circle cx="258" cy="60" r="7"/></g>
<circle cx="136" cy="74" r="7" fill="#e3b85a"/></g>
<g font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="7.5" fill="#3a2a1c" text-anchor="middle"><text x="58" y="96.6">1</text><text x="84" y="88.6">2</text><text x="110" y="77.6">3</text><text x="136" y="76.6">4</text><text x="160" y="83.6">5</text><text x="212" y="93.6">7</text><text x="238" y="82.6">8</text><text x="258" y="62.6">9</text></g>
<!-- start: baňka -->
<g transform="translate(22 52)"><g filter="url(#wash)"><path d="M3 30l10-18h10l10 18q2 8-6 8H9q-8 0-6-8z" fill="#8f9a5e" opacity=".6"/></g>
<g filter="url(#ink)" fill="none" stroke="#3a2a1c" stroke-width="1"><path d="M13 0v12L1 32q-2 6 6 6h22q8 0 6-6L23 12V0M11 0h14"/><path d="M7 26h22" opacity=".6"/></g>
<text x="18" y="50" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="9" fill="#3a2a1c">start</text></g>
<!-- cíl: vlajka -->
<g transform="translate(286 4)"><g filter="url(#ink)" stroke="#3a2a1c" stroke-width="1.1" fill="none"><path d="M4 2v34"/></g>
<g filter="url(#wash)"><path d="M5 3h20l-5 6 5 6H5z" fill="#b8442f" opacity=".7"/></g><g filter="url(#ink)" fill="none" stroke="#3a2a1c" stroke-width=".9"><path d="M5 3h20l-5 6 5 6H5"/></g>
<text x="2" y="46" font-family="Georgia,serif" font-style="italic" font-size="9" fill="#3a2a1c">cíl</text></g>
<!-- figurky -->
<g transform="translate(84 70)"><g filter="url(#wash)"><path d="M-5 14q5-12 10 0z" fill="#3a5f86" opacity=".65"/><circle cy="-1" r="5" fill="#3a5f86" opacity=".65"/></g><g filter="url(#ink)" fill="none" stroke="#2a1e14" stroke-width=".9"><path d="M-6 14q6-14 12 0z"/><circle cy="-1" r="5"/></g><circle cx="-1.6" cy="-1.6" r=".8" fill="#2a1e14"/><circle cx="1.6" cy="-1.6" r=".8" fill="#2a1e14"/></g>
<g transform="translate(212 75)"><g filter="url(#wash)"><path d="M-5 14q5-12 10 0z" fill="#b8442f" opacity=".6"/><circle cy="-1" r="5" fill="#b8442f" opacity=".6"/></g><g filter="url(#ink)" fill="none" stroke="#2a1e14" stroke-width=".9"><path d="M-6 14q6-14 12 0z"/><circle cy="-1" r="5"/></g><circle cx="-1.6" cy="-1.6" r=".8" fill="#2a1e14"/><circle cx="1.6" cy="-1.6" r=".8" fill="#2a1e14"/><path d="M-1.5 1.5q1.5 1.2 3 0" stroke="#2a1e14" stroke-width=".7" fill="none"/></g>
<!-- šotek Vondrys v čepici vykukuje z díry na políčku 6 -->
<g transform="translate(186 92)">
<ellipse cy="2" rx="11" ry="3.6" fill="#2a1e14" opacity=".75"/>
<g filter="url(#wash)"><circle cy="-11" r="9" fill="#e8b98e" opacity=".8"/><path d="M-8 -16q2-17 18-18q-6 6-2 15z" fill="#6b4f8a" opacity=".75"/></g>
<g filter="url(#ink)" fill="none" stroke="#2a1e14" stroke-width=".9" stroke-linecap="round"><path d="M-9 1v-10a9 9 0 0 1 18 0v10"/><path d="M-8 -16q2-17 18-18q-6 6-2 15"/><path d="M-9 -15q9-4 18-1" stroke="#b8862f" stroke-width="2"/><path d="M-5 -5q5 4 10 0"/><path d="M-6 -3q6 7 12 0" stroke-width=".6" opacity=".7"/></g>
<circle cx="10" cy="-34" r="2.4" fill="#e3b85a" stroke="#2a1e14" stroke-width=".7"/>
<circle cx="-3.5" cy="-11" r="2.6" fill="#fff" stroke="#2a1e14" stroke-width=".7"/><circle cx="3.5" cy="-11" r="2.6" fill="#fff" stroke="#2a1e14" stroke-width=".7"/><circle cx="-3" cy="-10.6" r="1" fill="#2a1e14"/><circle cx="4" cy="-10.6" r="1" fill="#2a1e14"/>
<path d="M11 -9q4-3 5 1" stroke="#2a1e14" stroke-width=".8" fill="none"/><path d="M12 -8l3 3" stroke="#2a1e14" stroke-width=".8"/>
<text x="-22" y="-26" font-family="Georgia,serif" font-style="italic" font-size="8" fill="#3a2a1c">hups!</text></g>
<!-- otázka 1–4 -->
<g transform="translate(150 22)"><g filter="url(#wash)"><rect x="-4" y="-2" width="72" height="26" rx="5" fill="#fbf6e9"/><rect x="-2" y="1" width="72" height="26" rx="5" fill="#c9b48a" opacity=".3"/></g>
<g filter="url(#ink)" fill="none" stroke="#3a2a1c" stroke-width=".9"><rect x="-4" y="-2" width="72" height="26" rx="5"/><path d="M14 24l-6 8 12-8"/></g>
<g font-family="Georgia,serif" font-style="italic" font-size="10" fill="#3a2a1c" text-anchor="middle"><text x="4" y="15">1</text><text x="22" y="15">2</text><text x="40" y="15">3</text><text x="58" y="15">4</text></g>
<g filter="url(#ink)" fill="none" stroke="#b8442f" stroke-width="1.1"><circle cx="40" cy="11.5" r="7"/></g></g>
</svg>
