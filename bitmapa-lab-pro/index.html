body{margin:0;background:var(--bg);color:var(--ink);font:400 1.1rem/1.38 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

b{font-weight:700}
[hidden]{display:none!important}
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

.tabs{display:flex;gap:.2rem;justify-content:center;min-width:0}

.ib:hover{background:var(--orange);color:#17140F}
.lang{display:grid;grid-auto-flow:column;gap:.2rem;background:var(--card);box-shadow:var(--shadow);border-radius:1.6rem;padding:.25rem;height:3.1rem;align-items:center}

.tab{height:100%;display:grid;gap:1rem;min-height:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) var(--side,27rem);gap:1rem;min-height:0}
.col{display:flex;flex-direction:column;gap:1rem;min-height:0;min-width:0}
.col>.grow{flex:1;min-height:0}
.card{background:var(--card);border-radius:1.2rem;padding:1rem 1.2rem;box-shadow:var(--shadow);min-width:0}
.side{overflow:hidden}

.side .callout{font-size:calc(.86rem*var(--z))}
.lbl{font:700 calc(.68rem*var(--z))/1 var(--f-head);letter-spacing:.22em;text-transform:uppercase;color:var(--orange-t)}

p.n{margin:0;color:var(--ink2);font-size:calc(.95rem*var(--z));line-height:1.35}

.scope{position:relative;border-radius:1.2rem;background:radial-gradient(120% 140% at 50% 0%,#241F17 0%,var(--scope) 62%);overflow:hidden;box-shadow:var(--shadow);min-height:0}
.scope canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tag{position:absolute;left:1rem;top:.8rem;font:700 .66rem/1 var(--f-head);letter-spacing:.2em;text-transform:uppercase;color:var(--cream);opacity:.8;pointer-events:none;display:flex;gap:.8rem;align-items:center}
.tag i{display:inline-block;width:.9rem;height:.28rem;border-radius:.2rem;background:var(--orange);margin-right:.35rem;vertical-align:.12rem}

.badge{position:absolute;right:1rem;top:.75rem;font:500 .8rem/1 var(--f-mono);color:var(--cream);opacity:.85;pointer-events:none;text-align:right}
/* ovládací prvky */
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{min-height:2.7rem;padding:.45rem .95rem;border-radius:1.4rem;background:var(--bg);box-shadow:inset 0 0 0 .13rem var(--line2);font:600 calc(.95rem*var(--z))/1.1 var(--f-head);transition:background .15s,color .15s,transform .1s;white-space:nowrap}
.chip small{font:500 calc(.78rem*var(--z)) var(--f-body);opacity:.75;margin-left:.35rem}
.chip:hover{box-shadow:inset 0 0 0 .13rem var(--orange)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chips.g2{display:grid;grid-template-columns:repeat(2,1fr)}

.chips.g4{display:grid;grid-template-columns:repeat(4,1fr)}
.chips.g2 .chip,.chips.g3 .chip,.chips.g4 .chip{padding:.45rem .25rem;text-align:center}
.side .chip{min-height:2.4rem}
.btn{min-height:3.3rem;padding:.6rem 1.4rem;border-radius:1.7rem;background:var(--orange);color:#17140F;font:700 1.05rem/1 var(--f-head);display:inline-flex;gap:.6rem;align-items:center;justify-content:center;box-shadow:0 .25rem 0 #C86D00;transition:transform .1s,box-shadow .1s}

.btn.on{background:var(--ink);color:var(--bg);box-shadow:none}

.row{display:flex;gap:.6rem;align-items:center}
.row>.btn{flex:1}

input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--card);border:.28rem solid var(--orange);margin-top:-.78rem;box-shadow:0 .2rem .6rem rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:1.7rem;height:1.7rem;border-radius:50%;background:var(--card);border:.28rem solid var(--orange)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.25rem;background:var(--bg);padding:.25rem;border-radius:1.5rem;box-shadow:inset 0 0 0 .13rem var(--line2)}
.seg .chip{box-shadow:none;background:transparent;border-radius:1.2rem;text-align:center;padding:.4rem .3rem}
.seg .chip.on{background:var(--ink);color:var(--bg)}
.callout{border-radius:.9rem;background:var(--bg);padding:.7rem .9rem;border-left:.3rem solid var(--orange);font-size:calc(.9rem*var(--z));line-height:1.35;color:var(--ink2)}
.callout b.l{display:block;font:700 calc(.62rem*var(--z))/1 var(--f-head);letter-spacing:.2em;text-transform:uppercase;color:var(--orange-t);margin-bottom:.3rem}
.status{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;border-radius:1rem;font:700 1.05rem/1.2 var(--f-head);background:rgba(93,182,127,.18);color:var(--ink)}
.status i{width:1rem;height:1rem;border-radius:50%;background:var(--good);flex:none}
.status.warn{background:rgba(255,151,46,.2)}.status.warn i{background:var(--orange)}
.status.bad{background:rgba(255,106,77,.18)}.status.bad i{background:var(--bad)}
.big{font:800 2.6rem/1 var(--f-head);letter-spacing:-.02em}
.big u{font:600 calc(.95rem*var(--z)) var(--f-head);text-decoration:none;color:var(--ink2);margin-left:.4rem;letter-spacing:0}
.or{color:var(--orange-t)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.kpi{display:flex;flex-direction:column;gap:.35rem;justify-content:center}
.kpi small{font:400 calc(.82rem*var(--z))/1.25 var(--f-body);color:var(--ink2)}
/* tabulka formátů */
/* kvíz kompatibility */
/* metadata */
.band{display:flex;height:1.7rem;border-radius:.5rem;overflow:hidden;gap:.12rem}
.band i{display:block;height:100%;min-width:.2rem;font:600 calc(.62rem*var(--z))/1.7rem var(--f-mono);font-style:normal;text-align:center;color:#17140F;overflow:hidden;white-space:nowrap}
.brow{display:grid;grid-template-columns:7rem 1fr;gap:.8rem;align-items:center}
.brow .nm{font:700 calc(.85rem*var(--z))/1.1 var(--f-head)}
.brow .nm small{display:block;font:400 calc(.72rem*var(--z)) var(--f-mono);color:var(--ink2);margin-top:.15rem}
.legend{display:flex;gap:.9rem;flex-wrap:wrap;font:500 calc(.72rem*var(--z)) var(--f-mono);color:var(--ink2)}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:.2rem;margin-right:.3rem;vertical-align:-.1rem}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.chips.g5{display:grid;grid-template-columns:repeat(5,1fr)}.chips.g5 .chip{padding:.45rem .1rem;text-align:center}
.rd{display:grid;grid-template-columns:auto 1fr;gap:.3rem .9rem;font:500 calc(.86rem*var(--z))/1.25 var(--f-mono)}
.rd span{color:var(--ink2)}.rd b{font-weight:500;text-align:right}.rd b.hot{color:var(--orange-t)}
.col>.scope.grow{min-height:9rem}

/* JPEG Lab Pro */
.bp{width:100%;height:8.2rem;border-radius:.7rem;background:var(--scope);display:block;touch-action:none;cursor:crosshair;box-shadow:inset 0 0 0 .13rem var(--line2)}
.chip.up{background:var(--orange-soft);box-shadow:inset 0 0 0 .13rem var(--orange)}
.chips.g6{display:grid;grid-template-columns:repeat(3,1fr)}.chips.g6 .chip{padding:.45rem .1rem;text-align:center}
.side .lbl.sp{margin-top:.15rem}
.hint{font:500 calc(.74rem*var(--z))/1.3 var(--f-mono);color:var(--ink2)}

html{font-size:clamp(9px,1.9vw,22px)}body{overflow:auto}.app{height:auto;min-height:100vh}#stage{overflow:visible}
.split{grid-template-columns:1fr}.scope{min-height:34rem}.top{grid-template-columns:1fr}.tabs{flex-wrap:wrap}.kpis{grid-template-columns:1fr}}

.tab-b{min-height:4.4rem}
.big.sm{font-size:1.75rem}
.big u{white-space:nowrap}
.sw{display:inline-block;width:1.5rem;height:1.5rem;border-radius:.35rem;vertical-align:-.28rem;margin-right:.55rem;box-shadow:inset 0 0 0 .1rem rgba(0,0,0,.35)}
.seg.modes{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:1fr 1fr}

.ctls{display:grid;grid-template-columns:1fr;gap:.2rem .9rem}.ctls .chips{grid-column:1/-1}

.tile{display:flex;flex-direction:column;gap:.3rem;align-items:flex-start;text-align:left;padding:.8rem 1rem;border-radius:1.2rem;background:var(--card);box-shadow:var(--shadow);min-height:5rem}

.tile i{font:800 1.3rem/1 var(--f-head);font-style:normal;color:var(--orange-t)}
.tile.on{background:var(--ink);color:var(--bg)}

.ctl .val{white-space:nowrap}

.facts{display:flex;flex-direction:column;gap:.25rem;padding:.6rem .8rem;border-radius:1rem;background:var(--bg)}
.facts div{display:flex;justify-content:space-between;gap:.8rem;font-size:calc(.9rem*var(--z,1))}
.facts b{font-family:var(--f-head)}.facts i{font-style:normal;color:var(--ink2);text-align:right}

.tab-b .nm{white-space:normal;font-size:.9rem;line-height:1.1;max-width:9.5rem}
.cd{font:600 .95rem/1.4 'Atkinson Hyperlegible Mono',monospace;margin-top:.15rem}.cd b{color:var(--orange-t);margin-right:.3rem}

.chn{height:.95rem;border-radius:.35rem;margin-top:.1rem;overflow:hidden;box-shadow:inset 0 0 0 .1rem var(--line2)}.chn i{display:block;height:100%}
.plist{display:grid;grid-template-columns:auto 1fr;gap:.25rem .8rem;align-items:center}.plist .chip{min-height:2rem;text-align:left;display:flex;align-items:center;padding:.2rem .7rem}.plist .sw{width:1.1rem;height:1.1rem;margin-right:.5rem;vertical-align:0}
.pc{font:600 .82rem/1.1 'Atkinson Hyperlegible Mono',monospace;white-space:nowrap}
.bn{font-size:.6em;letter-spacing:.01em}

.scope:has(#c2){background:#000}

.side.fill{display:flex;flex-direction:column;justify-content:space-between;gap:.9rem}
.side.fill .ctl,.side.fill .ctls{margin:0}
.side.fill .chip.sm{min-height:2.9rem}
.side.fill .plist .chip{min-height:2.3rem}
.side.fill input[type=range]{height:2.4rem}
.side.fill .note{margin-top:auto}

ků, videí na internetu a většiny školních projektorů.','Full HD, that is 1920 × 1080 (1080p), spread in the second half of the first decade of this century with televisions, game consoles and Blu-ray discs. It is still the most common resolution of monitors, laptops, online video and most school projectors.'],'qhd':['QHD má 2560 × 1440 pixelů, tedy čtyřikrát víc než HD Ready (proto Quad HD). Kolem roku 2010 se objevilo na 27palcových monitorech a později v nejvýkonnějších telefonech. Označení WQHD zdůrazňuje širokoúhlý poměr 16:9. Hodí se pro práci s detaily, kde už Full HD není ostré.','QHD has 2560 × 1440 pixels, four times as many as HD Ready (hence Quad HD). Around 2010 it appeared on 27-inch monitors and later in the most powerful phones. The name WQHD stresses the widescreen 16:9 ratio. It suits work with fine detail, where Full HD is no longer sharp.'],'uhd':['4K UHD má 3840 × 2160 pixelů, přesně čtyřikrát víc než Full HD. Standard ITU-R BT.2020 z roku 2012 ho zařadil do ultravysokého rozlišení (Ultra HD). První televize se objevily kolem roku 2013 a Ultra HD Blu-ray v roce 2015. Pozor: kinové 4K (DCI) má 4096 × 2160.','4K UHD has 3840 × 2160 pixels, exactly four times Full HD. The ITU-R BT.2020 standard of 2012 placed it in ultra high definition (Ultra HD). The first televisions appeared around 2013 and Ultra HD Blu-ray in 2015. Note: cinema 4K (DCI) has 4096 × 2160.'],'8k':['8K UHD má 7680 × 4320 pixelů, čtyřikrát víc než 4K a 16krát víc než Full HD. Standard z roku 2012 ho počítal už od začátku. Vyvíjela ho zejména japonská televize NHK, která v prosinci 2018 zahájila pravidelné satelitní vysílání v 8K. Obsahu je zatím málo.',"8K UHD has 7680 × 4320 pixels, four times 4K and 16 times Full HD. The 2012 standard included it from the start. It was developed above all by Japan's broadcaster NHK, which started regular satellite broadcasting in 8K in December 2018. There is little content yet."]};

  OUT.k7e=()=>fB(jpgOf(S.im7,S.q7).bytes);OUT.k7e2=()=>tx('kvalita ','quality ')+S.q7;
  OUT.k7f=()=>{const j=jpgOf(S.im7,S.q7);return '× '+nf(PNGS[S.im7]/j.bytes,PNGS[S.im7]/j.bytes<10?1:0)};
  OUT.why7=()=>{
   if(S.m7==='two')return ly()?`<b class="l">${tx('Ztrátová komprese','Lossy compression')}</b>${tx('Část údajů se nevratně zahodí, hlavně jemné detaily, které oko téměř nepozná. Soubor je výrazně menší, ale původní pixely už nejdou vrátit. Hodí se na fotografie.','Part of the data is irreversibly discarded, mostly fine detail the eye barely notices. The file is much smaller, but the original pixels cannot be restored. It suits photographs.')}`:`<b class="l">${tx('Bezeztrátová komprese','Lossless compression')}</b>${tx('Stejné údaje se zapíšou úsporněji, třeba když se opakují. Po rozbalení je každý pixel stejný jako v originálu. Hodí se na grafiku, text a archiv originálů.','The same data is written more economically, for example when it repeats. After unpacking every pixel equals the original. It suits graphics, text and archives of originals.')}`;
   if(S.m7==='rle')return `<b class="l">${tx('Zápis opakování (RLE)','Run-length encoding (RLE)')}</b>${tx('Místo desetkrát stejné barvy se zapíše „10× modrá“. Z takového zápisu se dá vrátit každý pixel, proto je to bezeztrátové. Vyplatí se u ploch jedné barvy, u šumu naopak zápis nafoukne.','Instead of the same colour ten times we write “10× blue”. Every pixel can be restored from such a record, so it is lossless. It pays off on flat areas and on noise it inflates the record.')}`;
   if(S.m7==='jpg')return `<b class="l">${tx('JPEG zahazuje detail','JPEG discards detail')}</b>${tx('Obraz se rozdělí na malé čtverce a zahodí se jemné změny, kterých si oko všimne nejméně. Čím nižší kvalita, tím menší soubor, ale tím víc se objeví kostičky a šmouhy kolem hran. Přibližte si obraz.','The picture is split into small squares and the finest changes the eye notices least are discarded. The lower the quality, the smaller the file, but the more blocks and smears appear around edges. Zoom in.')}`;
   return '';};
  OUT.hint7=()=>S.m7==='two'?tx('Pravá část je ilustrace: ztrátová komprese skutečně zahazuje údaje, jak přesně, ukazuje režim JPEG.','The right part is an illustration: lossy compression really discards data, the JPEG mode shows how.'):S.m7==='rle'?tx('Tato jednoduchá metoda je základ složitějších, které používá například GIF a PNG.','This simple method is the basis of more complex ones, used for example by GIF and PNG.'):tx('Velikosti jsou skutečné. Prohlížeč tento JPEG právě vytvořil.','The sizes are real. The browser has just created this JPEG.');
 },
 render(){
  const cv=$('#c5');if(!cv)return;const {x,w,h,R}=setup(cv);const pad=R*1.8;

   TH(x,tx('Po rozbalení','After unpacking'),x2,y0-R*1.2,R*.9,C.orange);
   draw(x,ly?lossyImg().c:small(640,480).c,x2,y0,iw,ih,true);x.strokeStyle=C.orange;x.lineWidth=2;x.strokeRect(x2,y0,iw,ih);
   TH(x,ly?tx('ilustrace: některé údaje jsou nevratně pryč','illustration: some data is gone for good'):tx('každý pixel je stejný','every pixel is the same'),x2+iw/2,y0+ih+R*1.7,R*.9,ly?C.bad:C.good,'center');
  }else if(S.m7==='rle'){
   const e=RLEX.find(q=>q.id===S.rl7)||RLEX[0],px=e.px,N=px.length,runs=rleRuns(px),cw=(w-pad*2)/N,ch=R*3.4;
   let y=R*4.4;
   TH(x,tx('Řádek pixelů: ','Row of pixels: ')+tx(e.n[0],e.n[1])+' · '+N+' '+tx('pixelů','pixels'),pad,y,R*.9,TXT);y+=R*1.6;
   px.forEach((p,i)=>{x.fillStyle=rgbS(...p);x.fillRect(pad+i*cw,y,cw,ch)});x.strokeStyle='rgba(23,20,15,.35)';x.lineWidth=1;px.forEach((p,i)=>{x.strokeRect(pad+i*cw,y,cw,ch)});
   T(x,tx('každý pixel zvlášť: ','every pixel on its own: ')+N+' × 3 B = '+N*3+' B',pad,y+ch+R*1.6,R*.9,TXT);
   y+=ch+R*5;
   TH(x,tx('Totéž po zápisu opakování: ','The same run-length coded: ')+runs.length+' '+tx('úseků','runs'),pad,y,R*.9,C.orange);y+=R*1.6;
   let cx=pad;runs.forEach(r=>{const bw=r.n*cw;x.fillStyle=rgbS(...r.c);x.fillRect(cx,y,bw,ch);x.strokeStyle=C.orange;x.lineWidth=2;x.strokeRect(cx,y,bw,ch);
    if(bw>R*2.4)TH(x,r.n+'×',cx+bw/2,y+ch/2,Math.min(R*1.3,bw*.34),fgOn(...r.c),'center');cx+=bw});
   T(x,runs.length+' × (1 B '+tx('počet','count')+' + 3 B '+tx('barva','colour')+') = '+runs.length*4+' B',pad,y+ch+R*1.6,R*.9,C.orange);
   y+=ch+R*4.6;const mx=Math.max(N*3,runs.length*4),bwm=w-pad*2-R*6;
   x.fillStyle=C.blue;x.fillRect(pad,y,bwm*N*3/mx,R*1.5);x.fillStyle=C.orange;x.fillRect(pad,y+R*2.2,bwm*runs.length*4/mx,R*1.5);
   TH(x,N*3+' B',pad+bwm*N*3/mx+R*.6,y+R*.75,R*.9,C.cream);TH(x,runs.length*4+' B',pad+bwm*runs.length*4/mx+R*.6,y+R*2.95,R*.9,C.orange);
  }else if(S.m7==='jpg'){
   const id=S.im7,jr=jpgOf(id,S.q7),f=jf(id).f,z=S.z7||1,base=img1(id).c;
   const sw=W1/z,sh=H1/z,sx=clamp(f[0]*W1-sw/2,0,W1-sw),sy=clamp(f[1]*H1-sh/2,0,H1-sh);
   let iw=(w-pad*3)/2,ih=iw*.75;const maxH=h-R*8;if(ih>maxH){ih=maxH;iw=ih/.75}
   const ox=(w-(iw*2+pad))/2,ox2=ox+iw+pad,oy=R*4.2+(h-R*4.2-R*3-ih)/2;
   TH(x,tx('Původní obrázek','Original picture'),ox,oy-R*1.1,R*.9,TXT);TH(x,tx('JPEG, kvalita ','JPEG, quality ')+S.q7,ox2,oy-R*1.1,R*.9,C.orange);
   x.imageSmoothingEnabled=z<4;x.drawImage(base,sx,sy,sw,sh,ox,oy,iw,ih);
   if(jr.c){x.drawImage(jr.c,sx,sy,sw,sh,ox2,oy,iw,ih)}else{x.fillStyle='rgba(244,241,234,.08)';x.fillRect(ox2,oy,iw,ih)}
   x.imageSmoothingEnabled=true;x.strokeStyle=GR2;x.lineWidth=1;x.strokeRect(ox,oy,iw,ih);x.strokeStyle=C.orange;x.lineWidth=2;x.strokeRect(ox2,oy,iw,ih);
  }
  renderModes();
 }});

const DET8={
 jpg:{e:[`Obraz se převede na jas a barevnost, rozdělí na bloky 8 × 8 pixelů a každý blok se matematicky přepočítá (kosinová transformace). Drobné změny se zaokrouhlí, tím se detail zahodí, a zbytek se úsporně zapíše.`,`The picture is converted to brightness and colour, split into blocks of 8 × 8 pixels and each block is recalculated mathematically (cosine transform). Small changes are rounded, which discards detail, and the rest is written economically.`],h:[`Vznikl ve skupině Joint Photographic Experts Group, standard je z roku 1992. Díky němu se fotografie dostaly na web a do digitálních fotoaparátů.`,`It was created by the Joint Photographic Experts Group, the standard dates from 1992. Thanks to it photographs got onto the web and into digital cameras.`]},
 png:{e:[`Každý pixel se nejdřív zapíše jako rozdíl proti svým sousedům, což vytvoří víc opakování. Pak se data zkomprimují metodou Deflate, stejnou jako v ZIPu. Kromě barev nese i kanál průhlednosti.`,`Each pixel is first written as a difference from its neighbours, which creates more repetition. Then the data is compressed with Deflate, the same as in ZIP. Besides colours it carries a transparency channel.`],h:[`Vznikl v roce 1995 jako volná náhrada GIFu, protože na kompresi LZW v GIFu si činila patentové nároky firma Unisys. Název se vykládá jako „PNG is Not GIF“.`,`It was created in 1995 as a free replacement for GIF, because the company Unisys claimed patents on the LZW compression used in GIF. The name is read as “PNG is Not GIF”.`]},
 gif:{e:[`Soubor má tabulku nejvýš 256 barev a pixely jsou čísla řádků v ní. Čísla se komprimují metodou LZW, která si pamatuje opakující se skupiny. Víc snímků za sebou tvoří animaci.`,`The file has a table of at most 256 colours and pixels are the numbers of its rows. The numbers are compressed with LZW, which remembers repeating groups. Several frames in a row make an animation.`],h:[`Formát vytvořil CompuServe v roce 1987. Verze 89a z roku 1989 přidala průhlednost a animace. Patent na LZW vypršel kolem roku 2004.`,`The format was created by CompuServe in 1987. Version 89a of 1989 added transparency and animation. The LZW patent expired around 2004.`]},
 webp:{e:[`Ztrátový WebP zapisuje obraz jako snímek videa kodeku VP8: odhadne bloky z okolí a uloží jen rozdíl. Bezeztrátový režim používá podobné odhady a úsporný zápis. Umí průhlednost i animaci.`,`Lossy WebP writes the picture as a frame of the VP8 video codec: it predicts blocks from their surroundings and stores only the difference. The lossless mode uses similar predictions and economical coding. It supports transparency and animation.`],h:[`Představila ho firma Google v roce 2010. Základ převzala z videokodeku, který získala koupí společnosti On2. Všechny hlavní prohlížeče ho zvládají od roku 2020.`,`Google introduced it in 2010. The basis came from a video codec acquired with the purchase of On2. All major browsers handle it since 2020.`]},
 bmp:{e:[`Hlavička říká rozměry a hloubku, pak následují pixely řádek po řádku, každý jako několik bajtů v pořadí modrá, zelená, červená. Řádky se doplňují na násobek čtyř bajtů. Komprese je jen volitelná.`,`A header states the size and depth, then pixels follow row by row, each as a few bytes in the order blue, green, red. Rows are padded to a multiple of four bytes. Compression is only optional.`],h:[`Je to původní bitmapový formát Windows z druhé poloviny osmdesátých let. Je jednoduchý, proto se dlouho používal, dnes ho nahradily úspornější formáty.`,`It is the original Windows bitmap format from the second half of the 1980s. It is simple, so it was used for a long time, today more economical formats have replaced it.`]},
 tif:{e:[`Soubor je kontejner štítků, které popisují obrazová data. Pixely se mohou zapsat bez komprese nebo s kompresí LZW, ZIP či JPEG. Jeden soubor může mít i víc stránek.`,`The file is a container of tags describing the image data. Pixels can be written without compression or with LZW, ZIP or JPEG compression. One file can also have several pages.`],h:[`Vznikl v roce 1986 u firmy Aldus pro skenery a DTP. Dodnes je oblíbený v tisku a archivech, protože nic neztrácí.`,`It was created in 1986 at Aldus for scanners and desktop publishing. It is still popular in print and archives, because it loses nothing.`]},
 heic:{e:[`Obraz se uloží jako snímek videa HEVC (H.265): bloky se odhadují z okolí a zapíše se jen rozdíl. Snímky jsou v kontejneru HEIF, který umí i více obrázků v jednom souboru.`,`The picture is stored as a frame of HEVC (H.265) video: blocks are predicted from their surroundings and only the difference is written. The frames are in the HEIF container, which can hold several images in one file.`],h:[`Kontejner HEIF vznikl ve skupině MPEG kolem roku 2015. Apple ho používá pro fotografie z iPhonu od roku 2017 (iOS 11). Kodek HEVC je patentově zatížený.`,`The HEIF container was created by MPEG around 2015. Apple has used it for iPhone photos since 2017 (iOS 11). The HEVC codec is encumbered by patents.`]},
 avif:{e:[`Obraz se uloží jako snímek videa AV1 v kontejneru HEIF. Zápis je podobný jako u HEIC, ale kodek AV1 je zdarma a při stejné kvalitě dělá často menší soubory.`,`The picture is stored as a frame of AV1 video in the HEIF container. The coding is similar to HEIC, but the AV1 codec is free and often makes smaller files at the same quality.`],h:[`Kodek AV1 vytvořila Alliance for Open Media, kterou založily například Google, Netflix a Mozilla. Formát AVIF vyšel v roce 2019.`,`The AV1 codec was created by the Alliance for Open Media, founded for example by Google, Netflix and Mozilla. The AVIF format appeared in 2019.`]},
 raw:{e:[`Ukládají se hodnoty přímo ze snímače, než se z nich spočítají barvy. Každý bod snímače vidí jen jednu ze tří barev (Bayerova mozaika), zbylé se dopočítají až při zpracování.`,`The values are stored directly from the sensor before colours are calculated from them. Every sensor point sees only one of three colours (Bayer mosaic), the rest are calculated during processing.`],h:[`RAW není jeden formát: Canon má CR2 a CR3, Nikon NEF. Společnost Adobe proto v roce 2004 navrhla otevřený DNG. Mozaiku vymyslel Bryce Bayer v Kodaku v roce 1976.`,`RAW is not one format: Canon has CR2 and CR3, Nikon NEF. Adobe therefore proposed the open DNG in 2004. The mosaic was invented by Bryce Bayer at Kodak in 1976.`]},
 ico:{e:[`Jeden soubor obsahuje několik obrázků různé velikosti (například od 16 × 16 po 256 × 256 pixelů). Každý je uložený jako BMP nebo PNG a systém vybere ten, který se hodí.`,`One file contains several pictures of different sizes (for example from 16 × 16 to 256 × 256 pixels). Each is stored as BMP or PNG and the system picks the one that fits.`],h:[`Používá ho Windows pro ikony programů a prohlížeče pro malé ikony webů (favicon).`,`Windows uses it for program icons and browsers for the small icons of websites (favicon).`]},
 psd:{e:[`Vrstvy, masky a nastavení úprav se ukládají zvlášť, aby se daly později měnit. Obrazová data se zapisují bez komprese nebo s RLE či ZIP. Soubory proto bývají velké.`,`Layers, masks and editing settings are stored separately so they can be changed later. Image data is written without compression or with RLE or ZIP. The files are therefore often large.`],h:[`Je to pracovní formát programu Adobe Photoshop, který vyšel v roce 1990. Jiné programy ho čtou jen částečně.`,`It is the working format of Adobe Photoshop, which appeared in 1990. Other programs read it only partly.`]},
 jxl:{e:[`Bezeztrátový režim předpovídá pixely z okolí. Ztrátový režim přepočítává bloky proměnné velikosti, takže se přizpůsobí obrazu. Existující JPEG umí přepsat beze ztráty a ušetří zhruba pětinu.`,`The lossless mode predicts pixels from their surroundings. The lossy mode recalculates blocks of variable size, so it adapts to the picture. It can rewrite an existing JPEG without loss and saves roughly a fifth.`],h:[`Skupina JPEG vyhlásila výzvu k návrhům v letech 2017 až 2018, první části normy vyšly v letech 2021 a 2022. Podpora v prohlížečích se několikrát změnila: Chrome ji v roce 2022 odebral, Safari ji má od roku 2023.`,`The JPEG group issued a call for proposals in 2017–2018, the first parts of the standard appeared in 2021 and 2022. Browser support has changed several times: Chrome removed it in 2022, Safari has it since 2023.`]},
 jp2:{e:[`Místo bloků používá vlnkovou transformaci celého obrazu. Při silné kompresi proto vzniká spíš rozmazání než kostičky. Jeden soubor může obsahovat i několik úrovní kvality.`,`Instead of blocks it uses a wavelet transform of the whole picture. At strong compression it therefore produces blur rather than blocks. One file can also contain several levels of quality.`],h:[`Skupina JPEG ho vydala v roce 2000 jako nástupce JPEG. Rozšířil se v digitálním kině a lékařských snímcích, na webu se příliš neprosadil.`,`The JPEG group released it in 2000 as a successor to JPEG. It spread in digital cinema and medical images, on the web it did not catch on much.`]},
 tga:{e:[`Hlavička a pak pixely, volitelně se stejné pixely za sebou zapíšou jako počet a barva (RLE, viz kapitola 7). Nese i kanál průhlednosti.`,`A header and then pixels, optionally identical pixels in a row are written as a count and a colour (RLE, see chapter 7). It also carries a transparency channel.`],h:[`Vznikl v roce 1984 u firmy Truevision pro grafické karty TARGA. Dodnes se používá pro textury ve hrách a 3D.`,`It was created in 1984 at Truevision for TARGA graphics cards. It is still used for textures in games and 3D.`]},
 exr:{e:[`Hodnoty kanálů jsou čísla s plovoucí čárkou, 16 nebo 32 bitů, takže uloží jak tmavé stíny, tak oslnivé světlo. Kanálů může být libovolně mnoho. Komprese ZIP a PIZ je bezeztrátová, B44 a DWA ztrátová.`,`Channel values are floating point numbers of 16 or 32 bits, so they store both dark shadows and dazzling light. There can be any number of channels. ZIP and PIZ compression is lossless, B44 and DWA lossy.`],h:[`Vyvinula ho filmová firma Industrial Light & Magic od roku 1999 pro efekty a v lednu 2003 ho zveřejnila jako open source.`,`It was developed by the film company Industrial Light & Magic from 1999 for effects and released as open source in January 2003.`]},
 ppm:{e:[`Nejjednodušší možný zápis: hlavička P3, rozměry, nejvyšší hodnota a pak čísla červené, zelené a modré každého pixelu jako text. Například „P3 2 1 255  255 0 0  0 0 255“ je červený a modrý pixel vedle sebe. Existuje i binární varianta P6.`,`The simplest possible coding: the header P3, the size, the highest value and then the red, green and blue numbers of each pixel as text. For example “P3 2 1 255  255 0 0  0 0 255” is a red and a blue pixel side by side. A binary variant P6 also exists.`],h:[`Rodinu formátů Netpbm (PBM, PGM, PPM) vytvořil Jef Poskanzer koncem osmdesátých let, aby se obrázky daly snadno předávat mezi programy.`,`The Netpbm family of formats (PBM, PGM, PPM) was created by Jef Poskanzer in the late 1980s so that pictures could be passed easily between programs.`]}};
const CT8={foto:{n:['Fotografie','Photograph'],why:['Plynulé přechody a miliony barev. Ztrátová komprese zahodí jemné detaily, které oko nepozná, a soubor je několikrát menší. Novější WebP, HEIC a AVIF to umějí ještě úsporněji.','Smooth gradients and millions of colours. Lossy compression drops fine detail the eye cannot notice, and the file is several times smaller. The newer WebP, HEIC and AVIF do it even more economically.']},
 logo:{n:['Logo a schéma','Logo or diagram'],why:['Ostré hrany a plné barvy. Bezeztrátový PNG zachová hrany přesně a umí plynulou průhlednost. JPEG by kolem hran dělal šum.','Sharp edges and flat colours. Lossless PNG keeps edges exact and handles smooth transparency. JPEG would add noise around edges.']},
 text:{n:['Snímek obrazovky s textem','Screenshot with text'],why:['Ostré písmo musí zůstat přesné. Bezeztrátový formát ho zachová, ztrátový by kolem písmen vytvořil mžitky.','Sharp letters must stay exact. A lossless format keeps them, a lossy one would add speckles around letters.']},
 anim:{n:['Jednoduchá animace','Simple animation'],why:['GIF zvládne animaci všude, ale má jen 256 barev. WebP a AVIF mají víc barev a menší soubory, jenže je starší programy nepřečtou.','GIF does animation everywhere, but has only 256 colours. WebP and AVIF have more colours and smaller files, but older programs cannot read them.']},
 archiv:{n:['Archiv originálů, tisk','Archive of originals, print'],why:['Nic se nesmí ztratit. Volí se formáty bez komprese nebo s bezeztrátovou kompresí a s větší bitovou hloubkou, která nechává prostor pro pozdější úpravy.','Nothing may be lost. Formats without compression or with lossless compression and a greater bit depth are chosen, which leave room for later editing.']}};
const vis8=()=>{let V=FM8.filter(f=>S.as8==='all'||(S.as8==='extra'?!f.c:f.c));if(S.ct8)V=V.filter(f=>f.s[S.ct8]>=2).sort((a,b)=>b.s[S.ct8]-a.s[S.ct8]);return V};
let HIT8={};
TABS.push({name:tx('Formáty souborů','File formats'),side:'27rem',
 build(){return `<div class="split"><div class="col">
  <div class="scope grow"><canvas id="c8"></canvas><div class="tag" data-o="tag8"></div></div>
  <div class="kpis">
   <div class="card kpi"><span class="lbl">${tx('Nejvhodnější','Most suitable')}</span><div class="big sm" data-o="k8a"></div><small data-o="k8a2"></small></div>
   <div class="card kpi"><span class="lbl">${tx('Ztrátově umí','Can compress lossy')}</span><div class="big sm" data-o="k8b"></div><small>${tx('formátů v zobrazené tabulce','formats in the shown table')}</small></div>
   <div class="card kpi"><span class="lbl">${tx('Průhlednost umí','Can do transparency')}</span><div class="big sm" data-o="k8c"></div><small>${tx('formátů v zobrazené tabulce','formats in the shown table')}</small></div>
  </div></div>
  <div class="side card">
   <div class="ctl"><div class="chips g3">${[['common','Běžné','Common'],['extra','Zajímavé','Curious'],['all','Všechny','All']].map(v=>`<button class="chip sm" data-k="as8" data-v="${v[0]}">${tx(v[1],v[2])}</button>`).join('')}</div><div class="hint" data-o="hs8"></div></div>
   <div class="ctl"><div class="hd"><span class="lbl">${tx('Co ukládáme','What we store')}</span></div><div class="chips g2" style="grid-template-columns:1fr">${Object.keys(CT8).map(k=>`<button class="chip sm" data-k="ct8" data-v="${k}">${tx(CT8[k].n[0],CT8[k].n[1])}</button>`).join('')}</div></div>
   <div class="callout" data-o="why8"></div>
   <div class="hint" data-o="hint8"></div>
  </div></div>`},
 init(){
  const best=()=>{const V=vis8();if(!S.ct8)return{m:0,L:[]};const m=Math.max(...V.map(f=>f.s[S.ct8]));return{m,L:V.filter(f=>f.s[S.ct8]===m)}};
  document.addEventListener('click',e=>{const b=e.target.closest('[data-k=ct8]');if(!b)return;if(S.ct8===b.dataset.v){e.stopPropagation();e.preventDefault();S.ct8='';refresh()}},true);
  {const cv=$('#c8');cv.style.touchAction='none';let dr=null;
   const clampS=()=>{const g=HIT8;S.sc8=Math.max(0,Math.min(g.max||0,S.sc8||0))};
   cv.addEventListener('wheel',e=>{if(!HIT8.max)return;e.preventDefault();S.sc8=(S.sc8||0)+e.deltaY;clampS();refresh()},{passive:false});
   cv.addEventListener('pointerdown',e=>{dr={y:e.clientY,s:S.sc8||0,m:false,p:ptr(e,cv)};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
   cv.addEventListener('pointermove',e=>{if(!dr)return;const dy=e.clientY-dr.y;if(Math.abs(dy)>6)dr.m=true;if(dr.m&&HIT8.max){S.sc8=dr.s-dy*(HIT8.k||1);clampS();refresh()}});
   cv.addEventListener('pointerup',e=>{const d0=dr;dr=null;if(!d0||d0.m||!HIT8.V)return;const p=d0.p,g=HIT8;const i=Math.floor((p.y-g.y0+(S.sc8||0))/g.rowH);if(p.y>=g.y0&&i>=0&&i<g.V.length){const id=g.V[i].id;S.f8=S.f8===id?'':id;refresh()}});
   cv.addEventListener('pointercancel',()=>{dr=null})}
  OUT.tag8=()=>tx('srovnání formátů podle přípon a vhodnosti','comparison of formats by extension and suitability');
  OUT.hs8=()=>S.as8==='common'?tx('Běžné formáty, které potkáte nejčastěji.','Common formats you meet most often.'):S.as8==='extra'?tx('Zajímavosti. Jejich znalost se nepožaduje.','Curiosities. Knowing them is not required.'):tx('Běžné formáty i zajímavosti. Znalost zajímavostí se nepožaduje.','Common formats and curiosities. Knowing the curiosities is not required.');
  OUT.k8a=()=>S.ct8?best().L.map(f=>f.n).join(', '):'–';OUT.k8a2=()=>S.ct8?tx(CT8[S.ct8].n[0],CT8[S.ct8].n[1]):tx('žádný obsah není vybrán','no content chosen');
  OUT.k8b=()=>{const V=vis8();return V.filter(f=>f.cm==='ly'||f.cm==='bo').length+' '+tx('z','of')+' '+V.length};
  OUT.k8c=()=>{const V=vis8();return V.filter(f=>f.tr>0).length+' '+tx('z','of')+' '+V.length};
  OUT.why8=()=>{
   if(S.f8&&vis8().some(q=>q.id===S.f8)){const f=FM8.find(q=>q.id===S.f8),t=DET8[f.id];
    return `<b class="l">${f.n} · ${f.ext.trim().replace(/ +/g,' ')}</b><b>${tx('Vlastnosti. ','Properties. ')}</b>${tx('Barev: ','Colours: ')}${tx(f.col[0],f.col[1])}. ${tx('Komprese: ','Compression: ')}${tx(f.cmT[0],f.cmT[1])}. ${tx('Průhlednost: ','Transparency: ')}${tx(f.trT[0],f.trT[1])}. ${tx('Hodí se na: ','Good for: ')}${tx(f.use[0],f.use[1])}.<br><b>${tx('Kódování (zajímavost). ','Coding (curiosity). ')}</b>${tx(t.e[0],t.e[1])}<br><b>${tx('Historie (zajímavost). ','History (curiosity). ')}</b>${tx(t.h[0],t.h[1])}`}
   if(!S.ct8)return `<b class="l">${(S.as8==='common'?tx('Běžné formáty','Common formats'):S.as8==='extra'?tx('Zajímavé formáty','Curious formats'):tx('Všechny formáty','All formats'))}</b>${tx('Není vybrán žádný obsah, tabulka ukazuje jen vlastnosti formátů. Klepněte na řádek a zobrazí se popis, kódování a historie formátu.','No content is chosen, the table shows only the properties of the formats. Tap a row to show the description, coding and history of the format.')}`;
   return `<b class="l">${tx(CT8[S.ct8].n[0],CT8[S.ct8].n[1])}</b>${tx(CT8[S.ct8].why[0],CT8[S.ct8].why[1])}`};
  OUT.hint8=()=>!S.ct8?tx('Klepnutím na vybraný obsah ho vypnete. Bez vybraného obsahu se zobrazí všechny formáty bez hodnocení. Klepnutím na řádek zobrazíte popis, kódování a historii formátu.','Tap the chosen content to turn it off. Without chosen content all formats are shown without rating. Tap a row to show its description, coding and history.'):tx('Tečky ukazují vhodnost formátu pro vybraný obsah. Zobrazují se jen vhodné formáty (aspoň dvě tečky), nejvhodnější jsou nahoře. Klepnutím na řádek zobrazíte popis, kódování a historii formátu.','The dots show how well a format suits the chosen content. Only suitable formats are shown (at least two dots), the most suitable on top. Tap a row to show the description, coding and history of the format.');
 },
 render(){
  const cv=$('#c8');if(!cv)return;const {x,w,h,R}=setup(cv);const V=vis8(),pd=R*1.6;
  const cols=[.16,.2,.19,.15,.2,.1],heads=[tx('Formát a přípona','Format and extension'),tx('Barev','Colours'),tx('Komprese','Compression'),tx('Průhlednost','Transparency'),tx('Hodí se na','Good for'),tx('Vhodnost','Suitability')];
  const tw=w-pd*2,top2=R*3.2,hh=R*2.2,rowH=Math.min((h-top2-hh-R*1.2)/4,R*7.5),m=S.ct8?Math.max(...V.map(f=>f.s[S.ct8])):0;
  let cx=pd;const xs=cols.map(c=>{const v=cx;cx+=c*tw;return v});const mx=Math.max(0,V.length*rowH+R*1.2-(h-top2-hh));S.sc8=Math.max(0,Math.min(mx,S.sc8||0));HIT8={y0:top2+hh,rowH,V,max:mx,k:h/cv.getBoundingClientRect().height};
  heads.forEach((t,i)=>{if(i<5||S.ct8)TH(x,t,xs[i]+R*.5,top2+hh/2,R*.85,TXT)});
  line(x,pd,top2+hh,pd+tw,top2+hh,GR2,1.2);
  const kk=Math.min(1,Math.max(.74,rowH/(R*4.4))),fs=R*.92*kk,cc={ly:C.orange,ll:C.good,bo:C.cream,no:TXT,nl:C.good};
  x.save();x.beginPath();x.rect(0,top2+hh+1,w,h-top2-hh);x.clip();
  V.forEach((f,r)=>{
   const y=top2+hh+r*rowH-(S.sc8||0),sc=S.ct8?f.s[S.ct8]:0,isB=false;
   if(isB)rr(x,pd-R*.4,y+rowH*.05,tw+R*.8,rowH*.9,R*.5,'rgba(255,151,46,.2)',C.orange,2);
   if(S.f8===f.id)rr(x,pd-R*.4,y+rowH*.05,tw+R*.8,rowH*.9,R*.5,'rgba(244,241,234,.1)',C.cream,2.5);
   TH(x,f.n,xs[0]+R*.5,y+rowH*.33,Math.min(R*1.35*kk,rowH*.36),isB?C.orange:C.cream);T(x,f.ext,xs[0]+R*.5,y+rowH*.72,Math.min(R*.75*kk,rowH*.2),TXT);
   [[f.col,C.cream,1],[f.cmT,cc[f.cm],2],[f.trT,f.tr?C.cream:TXT,3],[f.use,C.cream,4]].forEach(([t,colr,i])=>{
    const maxW=cols[i]*tw-R;let lines=[''];x.font=`500 ${fs}px "Atkinson Hyperlegible Next",sans-serif`;
    tx(t[0],t[1]).split(' ').forEach(wd=>{const tr=(lines[lines.length-1]+' '+wd).trim();if(x.measureText(tr).width>maxW&&lines[lines.length-1])lines.push(wd);else lines[lines.length-1]=tr});
    lines.forEach((ln,k)=>T(x,ln,xs[i]+R*.5,y+rowH/2+(k-(lines.length-1)/2)*R*1.15*kk,fs,colr,'left','Atkinson Hyperlegible Next',500));
   });
   if(S.ct8)for(let k=0;k<3;k++){x.beginPath();x.arc(xs[5]+R*1.1+k*R*1.8,y+rowH/2,R*.6*Math.max(kk,.7),0,TAU);if(k<sc){x.fillStyle=isB?C.orange:C.cream;x.fill()}else{x.strokeStyle=GR2;x.lineWidth=1.5;x.stroke()}}
   if(r<V.length-1)line(x,pd,y+rowH,pd+tw,y+rowH,GR,1);
  });
  x.restore();
  if(mx>0){const ty=top2+hh+R*.4,th=h-ty-R*.6,bh=Math.max(R*2,th*th/(th+mx));rr(x,w-R*.9,ty+(th-bh)*(S.sc8/mx),R*.35,bh,R*.17,'rgba(244,241,234,.35)',null,0)}
 }});

/* obrázek zůstává stejný při přepínání mezi kapitolami 1, 2, 4 a 6 (včetně vlastního souboru) */
{const PK={0:'img1',1:'img2',3:'img5',5:'img6'};let LG=-1;
 TABS.forEach((t,i)=>{const o=t.enter;t.enter=function(){o&&o.call(t);if(PK[i]){if(LG>=0&&LG!==i)S[PK[i]]=S[PK[LG]];LG=i}}})}

</script>

<script>
/* ===== Nápověda ke kapitolám ===== */
(function(){
const H=[
{t:tx(`Pixel`,`Pixel`),
 a:tx(`Bitmapový (rastrový) obrázek je pravidelná <b>mřížka pixelů</b>. Pixel je nejmenší bod obrazu a nese jedinou barvu zapsanou čísly. Obrázek 1280 × 960 pixelů má 1280 · 960 = 1 228 800 pixelů.`,`A bitmap (raster) picture is a regular <b>grid of pixels</b>. A pixel is the smallest dot of a picture and carries a single colour written as numbers. A picture of 1280 × 960 pixels has 1280 · 960 = 1,228,800 pixels.`),
 b:tx(`Původní obrázek vypadá ostře, protože pixely jsou drobné. Když ho lupou přiblížíte, nový detail nevznikne: uvidíte jen čtverečky. Hladký vzhled při přiblížení vytváří až prohlížeč tím, že dopočítává barvy mezi pixely.`,`The original picture looks sharp because the pixels are tiny. When you zoom in with the lens, no new detail appears: you just see squares. A smooth look when zoomed is made by the viewer, which calculates colours between pixels.`),
 eh:tx(`Co se tu děje`,`What is going on`),
 e:[tx(`<b>Souřadnice.</b> Pixel se určuje sloupcem a řádkem. V počítačové grafice se obvykle počítá od nuly a od levého horního rohu, takže první pixel má souřadnice 0, 0.`,`<b>Coordinates.</b> A pixel is identified by a column and a row. In computer graphics counting usually starts from zero and from the top left corner, so the first pixel has the coordinates 0, 0.`),
    tx(`<b>Barva jako čísla.</b> Každý pixel obsahuje tři čísla 0 až 255 (červená, zelená, modrá). Podrobněji v kapitole 3.`,`<b>Colour as numbers.</b> Every pixel holds three numbers 0 to 255 (red, green, blue). More in chapter 3.`)],
 c:[tx(`Přibližujte lupu kolečkem myši nebo posuvníkem, dokud se neobjeví jednotlivé čtverečky, a všimněte si, že každý má jednu barvu.`,`Zoom the lens with the mouse wheel or the slider until single squares appear, and notice that each has one colour.`),
    tx(`Zapněte čísla RGB a při největším zvětšení je přečtěte uvnitř pixelů.`,`Switch the RGB numbers on and at the largest magnification read them inside the pixels.`),
    tx(`Vyberte pixel na hraně střechy (nebo na hraně zkušebního obrazce) a porovnejte jeho čísla se sousedem.`,`Select a pixel on the edge of the roof (or of the test pattern) and compare its numbers with its neighbour.`)],
 d:tx(`Bitmapa je mřížka čtverečků a každý má jednu barvu zapsanou čísly.`,`A bitmap is a grid of squares and each has one colour written as numbers.`)},
{t:tx(`Paleta a bitová hloubka`,`Palette and bit depth`),
 a:tx(`Pixel nemusí nést barvu přímo. Může nést jen <b>číslo barvy v paletě</b>, tedy v tabulce barev. Číslo je zapsané <b>n bity</b>, takže paleta má nejvýše 2ⁿ barev: 1 bit dává 2 barvy, 2 bity 4, 4 bity 16 a 8 bitů 256.`,`A pixel does not have to carry a colour directly. It can carry just the <b>number of a colour in a palette</b>, that is in a table of colours. The number is written in <b>n bits</b>, so the palette has at most 2ⁿ colours: 1 bit gives 2 colours, 2 bits 4, 4 bits 16 and 8 bits 256.`),
 b:tx(`Při jednom bitu má každý pixel hodnotu 0 nebo 1, tedy jednu ze dvou barev. S víc bity se obraz přibližuje originálu, ale data rostou: jeden bit na pixel potřebuje osmkrát méně místa než osm bitů.`,`With one bit every pixel is 0 or 1, that is one of two colours. With more bits the picture gets closer to the original, but the data grow: one bit per pixel needs eight times less space than eight bits.`),
 eh:tx(`Co se tu děje`,`What is going on`),
 e:[tx(`<b>Paleta barev.</b> Barvy palety jsou vybrané podle obrázku. Aplikace je hledá tak, aby co nejlépe zastoupily barvy původního obrazu. Každý pixel pak dostane nejbližší barvu z palety.`,`<b>Colour palette.</b> The palette colours are chosen from the picture. The app looks for them so that they represent the colours of the original as well as possible. Every pixel then gets the nearest colour from the palette.`),
    tx(`<b>Odstíny šedi.</b> Při stejné bitové hloubce jsou barvy palety jen šedé a rovnoměrně rozložené od černé k bílé.`,`<b>Greys.</b> At the same bit depth the palette colours are only grey and evenly spread from black to white.`),
    tx(`<b>Paleta GIF.</b> Formát GIF má nejvýše 256 barev a každý pixel nese číslo barvy z palety. Častá byla pevná webová paleta o 216 barvách, stejná pro každý obrázek. Hodí se pro smajlíky a jednoduché animace. Barvy neodpovídají obrázku, proto je u fotografie výsledek hrubý.`,`<b>GIF palette.</b> The GIF format has at most 256 colours and every pixel carries the number of a palette colour. A common choice was the fixed web palette of 216 colours, the same for every picture. It suits smileys and simple animations. The colours do not match the picture, so the result for a photograph is coarse.`),
    tx(`<b>Velikost dat.</b> Data pixelů zabírají šířka · výška · n ÷ 8 bajtů. Paleta navíc potřebuje 3 bajty na každou barvu.`,`<b>Size of the data.</b> The pixel data take width · height · n ÷ 8 bytes. The palette needs 3 more bytes for every colour.`)],
 c:[tx(`Zvolte Paletu GIF a porovnejte ji s Barvami při 8 bitech. Která vypadá věrněji a proč?`,`Choose the GIF palette and compare it with Colours at 8 bits. Which looks more faithful and why?`),
    tx(`Při jednom bitu přečtěte nuly a jedničky vpravo a najděte, kterým barvám odpovídají.`,`At one bit read the zeros and ones on the right and find which colours they stand for.`),
    tx(`Přepněte na 2, 4 a 8 bitů a sledujte, jak se zlepšuje obraz a kolik barev v paletě přibývá.`,`Switch to 2, 4 and 8 bits and watch the picture improve and the palette grow.`),
    tx(`Porovnejte stejnou hloubku v barvách a v odstínech šedi. Kde je rozdíl nejvíc vidět?`,`Compare the same depth in colours and in greys. Where is the difference most visible?`)],
 d:tx(`Pixel nese číslo barvy z palety. n bitů dává paletu až 2ⁿ barev.`,`A pixel carries the number of a palette colour. n bits give a palette of up to 2ⁿ colours.`)},
{t:tx(`Mixér RGB`,`RGB mixer`),
 a:tx(`Displej míchá každou barvu ze tří světel: <b>červeného, zeleného a modrého (RGB)</b>. Každé má sílu 0 až 255, tedy jeden bajt. Světla se sčítají, proto se tomu říká aditivní míchání.`,`A display mixes every colour from three lights: <b>red, green and blue (RGB)</b>. Each has a strength of 0 to 255, that is one byte. Lights add up, which is why it is called additive mixing.`),
 b:tx(`Červená a zelená naplno dají žlutou, všechna tři naplno bílou, všechna vypnutá černou. Pro lidské vidění tři světla stačí, protože oko má tři druhy čípků.`,`Red and green at full make yellow, all three at full make white, all off make black. Three lights are enough for human vision because the eye has three kinds of cones.`),
 eh:tx(`Zápis barvy`,`Writing a colour`),
 e:[tx(`<b>Desítkově.</b> Tři čísla 0 až 255, například (255, 151, 46).`,`<b>In decimal.</b> Three numbers 0 to 255, for example (255, 151, 46).`),
    tx(`<b>Šestnáctkově.</b> Číslice 0–9 a A–F. Dvě číslice zapíšou jeden bajt (00 až FF), takže barva je #RRGGBB. Například 2E = 16 · 2 + 14 = 46.`,`<b>In hexadecimal.</b> Digits 0–9 and A–F. Two digits write one byte (00 to FF), so a colour is #RRGGBB. For example 2E = 16 · 2 + 14 = 46.`),
    tx(`<b>Velikost.</b> Tři kanály po 8 bitech jsou 24 bitů, tedy 3 bajty a 2²⁴ = 16 777 216 možných barev.`,`<b>Size.</b> Three channels of 8 bits are 24 bits, that is 3 bytes and 2²⁴ = 16,777,216 possible colours.`)],
 c:[tx(`Zvolte žlutou a všimněte si, že obsahuje červenou i zelenou naplno.`,`Choose yellow and notice that it contains red and green at full strength.`),
    tx(`Zapněte všechna tři světla naplno: vznikne bílá. Pak vše vypněte.`,`Turn all three lights on at full: white appears. Then turn everything off.`),
    tx(`Posuňte jen jeden posuvník a sledujte, jak se změní jedna dvojice šestnáctkových číslic.`,`Move just one slider and watch how one pair of hexadecimal digits changes.`)],
 d:tx(`Barva na displeji jsou tři čísla 0 až 255, tedy 3 bajty.`,`A colour on a display is three numbers 0 to 255, that is 3 bytes.`)},
{t:tx(`RGB kódování`,`RGB encoding`),
 a:tx(`U plné barvy nese pixel tři kódy: jeden pro <b>červenou</b>, jeden pro <b>zelenou</b> a jeden pro <b>modrou</b>. Při 8 bitech na kanál má každý kód 8 číslic a hodnoty 0 až 255, pixel má 3 · 8 = 24 bitů. Při 10 bitech jsou to hodnoty 0 až 1023 a pixel má 30 bitů.`,`In full colour a pixel carries three codes: one for <b>red</b>, one for <b>green</b> and one for <b>blue</b>. With 8 bits per channel every code has 8 digits and values 0 to 255, a pixel has 3 · 8 = 24 bits. With 10 bits the values are 0 to 1023 and a pixel has 30 bits.`),
 b:tx(`Každý bit navíc na kanál zdvojnásobí počet stupňů jasu. Z 256 stupňů je 1024, takže jsou jemnější přechody a méně viditelných pásů. Cenou je větší soubor: 30 bitů na pixel místo 24.`,`Every extra bit per channel doubles the number of brightness levels. 256 levels become 1,024, so gradients are smoother and show fewer bands. The price is a bigger file: 30 bits per pixel instead of 24.`),
 eh:tx(`Co se tu děje`,`What is going on`),
 e:[tx(`<b>Lupa.</b> Stejně jako v kapitole 1 přiblížíte obrázek, až uvidíte jednotlivé pixely. V každém pixelu jsou pak tři řádky: kód červené, zelené a modré.`,`<b>Lens.</b> As in chapter 1 you zoom in until single pixels appear. Every pixel then shows three lines: the red, green and blue code.`),
    tx(`<b>Deset bitů.</b> Zdrojový obrázek i displej mají tady 8 bitů, takže desetibitové hodnoty jsou z nich přepočtené. Ukazují, jak by kód vypadal, ne skutečné jemnější odstupňování.`,`<b>Ten bits.</b> The source picture and the display here have 8 bits, so the ten-bit values are converted from them. They show how the code would look, not the real finer steps.`),
    tx(`<b>Velikost.</b> Bez komprese je to šířka · výška · bity na pixel ÷ 8 bajtů.`,`<b>Size.</b> Without compression it is width · height · bits per pixel ÷ 8 bytes.`)],
 c:[tx(`Přibližte lupu na maximum a přečtěte tři kódy jednoho pixelu při 8 bitech.`,`Zoom the lens to the maximum and read the three codes of one pixel at 8 bits.`),
    tx(`Přepněte na 10 bitů. Kolik číslic mají teď kódy a jak se změnily hodnoty?`,`Switch to 10 bits. How many digits do the codes have now and how did the values change?`),
    tx(`Vyberte pixel a porovnejte jeho velikost: 24 a 30 bitů.`,`Select a pixel and compare its size: 24 and 30 bits.`)],
 d:tx(`Plná barva jsou tři kódy po n bitech: 8 bitů dává 24 bitů na pixel, 10 bitů dává 30.`,`Full colour is three codes of n bits: 8 bits give 24 bits per pixel, 10 bits give 30.`)},
{t:tx(`Standardní rozlišení`,`Standard resolutions`),
 a:tx(`<b>Rozlišení</b> je počet pixelů na šířku a na výšku. Počet pixelů je šířka · výška, takže při dvojnásobku obou rozměrů je pixelů čtyřikrát víc. Standardní rozlišení jsou například VGA 640 × 480, SVGA 800 × 600, HD Ready 1280 × 720, Full HD 1920 × 1080, QHD 2560 × 1440, 4K 3840 × 2160 a 8K 7680 × 4320.`,`<b>Resolution</b> is the number of pixels across and down. The pixel count is width · height, so when both dimensions double there are four times as many pixels. Standard resolutions are for example VGA 640 × 480, SVGA 800 × 600, HD Ready 1280 × 720, Full HD 1920 × 1080, QHD 2560 × 1440, 4K 3840 × 2160 and 8K 7680 × 4320.`),
 b:tx(`Obdélníky jsou vnořené do společného rohu a jejich plocha je úměrná počtu pixelů. Poměr stran standardů je 4:3 u VGA a SVGA a 16:9 u ostatních.`,`The rectangles are nested in a common corner and their area is proportional to the pixel count. The aspect ratio of the standards is 4:3 for VGA and SVGA and 16:9 for the others.`),
 c:[tx(`Klepněte na Full HD a přečtěte poměr stran a počet pixelů.`,`Tap Full HD and read the aspect ratio and the pixel count.`),
    tx(`Kolikrát větší plochu má obdélník 4K než Full HD? Ověřte to počtem pixelů.`,`How many times larger is the 4K rectangle than Full HD? Check it with the pixel counts.`),
    tx(`Které standardy mají poměr stran 4:3 a které 16:9?`,`Which standards have the 4:3 aspect ratio and which 16:9?`)],
 d:tx(`Pixely = šířka · výška.`,`Pixels = width · height.`)},
{t:tx(`Poměr stran`,`Aspect ratio`),
 a:tx(`<b>Poměr stran</b> je šířka děleno výškou. Obrazovka 16:9 je o 78 % širší než vysoká, čtverec 1:1 je stejně široký jako vysoký. Poměr nezávisí na počtu pixelů: Full HD a 4K mají stejný poměr 16:9.`,`The <b>aspect ratio</b> is width divided by height. A 16:9 screen is 78 % wider than tall, a 1:1 square is as wide as tall. The ratio does not depend on the number of pixels: Full HD and 4K both have 16:9.`),
 b:tx(`Když má obrázek jiný poměr než obrazovka, nejde ho zobrazit celý a zároveň bez pruhů. Buď se přebytek <b>ořízne</b> (obraz zaplní celou obrazovku), nebo se obraz zmenší a zbylé místo vyplní <b>černé pruhy</b>.`,`When a picture has a different ratio from the screen it cannot be shown whole and without bars at the same time. Either the excess is <b>cropped</b> (the picture fills the whole screen) or the picture is shrunk and the remaining space is filled with <b>black bars</b>.`),
 eh:tx(`Co se tu děje`,`What is going on`),
 e:[tx(`<b>Zdroj je širší než cíl.</b> Při ořezu se ztratí okraje vlevo a vpravo, při vměstnání jsou černé pruhy nahoře a dole (letterbox).`,`<b>The source is wider than the target.</b> Cropping loses the left and right edges, fitting gives black bars at the top and bottom (letterbox).`),
    tx(`<b>Zdroj je užší než cíl.</b> Při ořezu se ztratí horní a dolní okraj, při vměstnání jsou černé pruhy po stranách (pillarbox).`,`<b>The source is narrower than the target.</b> Cropping loses the top and bottom edges, fitting gives black bars at the sides (pillarbox).`),
    tx(`<b>Kino.</b> Filmový formát 2,39:1 je širší než televize 16:9, proto se na televizi objeví černé pruhy. IMAX 1,43:1 je naopak téměř čtvercový a na televizi 16:9 by měl svislé pruhy.`,`<b>Cinema.</b> The 2.39:1 film format is wider than a 16:9 television, so black bars appear on the television. IMAX 1.43:1 is almost square and on a 16:9 television it would have vertical bars.`)],
 c:[tx(`Převeďte 16:9 na 4:3 s ořezem a pak s pruhy. Co se ztratí v prvním a co zabere místo ve druhém případě?`,`Convert 16:9 to 4:3 with cropping and then with bars. What is lost in the first case and what takes up room in the second?`),
    tx(`Zvolte zdroj 2,39:1 a cíl 16:9. Kde přibudou černé pruhy?`,`Choose the source 2.39:1 and the target 16:9. Where do the black bars appear?`),
    tx(`Zvolte zdroj 1:1 a cíl 16:9 a porovnejte, kolik obrazu ztratí ořez.`,`Choose the source 1:1 and the target 16:9 and compare how much of the picture the cropping loses.`)],
 d:tx(`Různý poměr stran se řeší ořezem, nebo černými pruhy.`,`A different aspect ratio is solved by cropping or by black bars.`)},
{t:tx(`Princip komprese`,`Compression principle`),
 a:tx(`Komprese zmenšuje datový zápis obrazu. <b>Bezeztrátová</b> komprese po rozbalení obnoví obraz přesně, pixel po pixelu. <b>Ztrátová</b> komprese část údajů nevratně zahodí a po rozbalení je obraz jen podobný originálu.`,`Compression shrinks the data record of a picture. <b>Lossless</b> compression restores the picture exactly after unpacking, pixel by pixel. <b>Lossy</b> compression irreversibly discards part of the data and after unpacking the picture is only similar to the original.`),
 b:tx(`Nejjednodušší bezeztrátový trik je zápis opakování: místo deseti stejných pixelů se zapíše „10× modrá“. U ploch jedné barvy to ušetří hodně, u šumu zápis naopak zvětší. Ztrátová komprese JPEG zahodí jemné změny, kterých si oko všímá nejméně, a soubor je několikrát menší. Čím nižší kvalita, tím víc se objeví kostičky a šmouhy.`,`The simplest lossless trick is run-length coding: instead of ten identical pixels we write “10× blue”. On flat areas it saves a lot, on noise it enlarges the record. Lossy JPEG compression discards the fine changes the eye notices least and the file is several times smaller. The lower the quality, the more blocks and smears appear.`),
 eh:tx(`Co aplikace nevysvětluje`,`What the app does not explain`),
 e:[tx(`<b>Jak přesně JPEG počítá</b> aplikace nevysvětluje. Ukazuje výsledek: skutečnou velikost souboru a vzhled obrazu při zvolené kvalitě.`,`<b>How exactly JPEG calculates</b> is not explained. The app shows the result: the real file size and the look of the picture at the chosen quality.`),
    tx(`<b>Velikost PNG a JPEG</b> je skutečná, vytvořil ji právě váš prohlížeč z ukázkového obrázku.`,`<b>The PNG and JPEG sizes</b> are real, your browser has just created them from the sample picture.`)],
 c:[tx(`V režimu Dva druhy přepněte mezi bezeztrátovou a ztrátovou kompresí a porovnejte obraz po rozbalení.`,`In the Two kinds mode switch between lossless and lossy compression and compare the picture after unpacking.`),
    tx(`V režimu Opakování porovnejte logo a fotografii. Který řádek se zapíše úsporně a který ne?`,`In the Repeats mode compare the logo and the photograph. Which row is written economically and which is not?`),
    tx(`V režimu JPEG snižujte kvalitu a přibližte obraz na 10×. Kdy poprvé vidíte kostičky? Kolikrát je soubor menší než PNG?`,`In the JPEG mode lower the quality and zoom to 10×. When do you first see the blocks? How many times is the file smaller than PNG?`)],
 d:tx(`Bezeztrátová obnoví obraz přesně, ztrátová ne. Ztrátová je menší, ale nevratná.`,`Lossless restores the picture exactly, lossy does not. Lossy is smaller but irreversible.`)},
{t:tx(`Formáty souborů`,`File formats`),
 a:tx(`Formát souboru určuje, jak se pixely zapíšou na disk. Liší se <b>počtem barev</b>, tím, jestli je soubor <b>komprimovaný</b> (a zda ztrátově, nebo bezeztrátově), a tím, jestli umí <b>průhlednost</b>. Přípona v názvu (.jpg, .png) napovídá, o který formát jde.`,`A file format determines how pixels are written to disk. Formats differ in the <b>number of colours</b>, in whether the file is <b>compressed</b> (and whether lossy or lossless), and in whether they support <b>transparency</b>. The extension in the name (.jpg, .png) tells which format it is.`),
 b:tx(`Formát se volí podle obsahu. Fotografie: JPEG nebo novější WebP, HEIC a AVIF. Logo, schéma a snímek obrazovky: PNG. Jednoduchá animace: GIF. Archiv originálů a tisk: TIFF nebo RAW. Při výběru Běžné se zobrazí formáty, které je dobré znát, Zajímavé jsou doplněk bez nároku na znalost.`,`The format is chosen by content. Photographs: JPEG or the newer WebP, HEIC and AVIF. Logos, diagrams and screenshots: PNG. Simple animation: GIF. Archive of originals and print: TIFF or RAW. The Common choice shows the formats worth knowing, the Curious ones are an extra with no requirement to know them.`),
 eh:tx(`Co si všimnout`,`What to notice`),
 e:[tx(`<b>Průhlednost.</b> JPEG ji neumí. GIF má jen zapnuto nebo vypnuto, PNG a novější formáty mají plynulou.`,`<b>Transparency.</b> JPEG cannot do it. GIF has only on or off, PNG and the newer formats have smooth transparency.`),
    tx(`<b>Barvy.</b> GIF má nejvýš 256 barev, proto se na fotografie nehodí. Formáty s 10 a víc bity na kanál mají miliardy odstínů.`,`<b>Colours.</b> GIF has at most 256 colours, so it does not suit photographs. Formats with 10 or more bits per channel have billions of shades.`)],
 c:[tx(`Vyberte Fotografie a pak Logo. Které formáty se podbarví?`,`Choose Photograph and then Logo. Which formats are highlighted?`),
    tx(`Najděte formát, který neumí průhlednost, a formát, který má jen 256 barev.`,`Find a format that cannot do transparency and a format that has only 256 colours.`),
    tx(`Přepněte na Zajímavé. Který formát se hodí pro archiv originálů?`,`Switch to Curious. Which format suits an archive of originals?`)],
 d:tx(`Formát volte podle obsahu: fotografie ztrátově (JPEG), grafika bezeztrátově (PNG), archiv bez ztráty (TIFF, RAW).`,`Choose the format by content: photographs lossy (JPEG), graphics lossless (PNG), an archive without loss (TIFF, RAW).`)}];
let open=false;
function render(){
 const h=H[S.tab]||H[0];
 const el=$('#help .dlg');
 el.innerHTML=`<button class="x" data-act="help" aria-label="${tx('Zavřít','Close')}">✕</button>
  <div class="kap">${tx('kap.','ch.')} ${S.tab+1} · ${tx('vysvětlení','explanation')}</div><h2>${h.t}</h2>
  <h3>${tx('Co to je','What it is')}</h3><p>${h.a}</p><p>${h.b}</p>
  ${h.e?`<h3>${h.eh}</h3>${h.e.map(x=>`<p>${x}</p>`).join('')}`:''}
  <h3>${tx('Co zkusit','What to try')}</h3><ul>${h.c.map(x=>`<li>${x}</li>`).join('')}</ul>
  <h3>${tx('Co si odnést','Takeaway')}</h3><p><b>${h.d}</b></p>
  <div class="nav"><button data-act="hnav" data-v="-1">← ${tx('Předchozí kapitola','Previous chapter')}</button><button data-act="hnav" data-v="1">${tx('Další kapitola','Next chapter')} →</button></div>`;
}
ACT.help=()=>{open=!open;const e=$('#help');e.hidden=!open;if(open){render();$('#help .x').focus()}else $('#bHelp').focus()};

document.addEventListener('click',e=>{if(open&&e.target.id==='help')ACT.help()});

};
})();

 const c=hc();if(!c||!c.parentElement||c.parentElement.hidden||c.querySelector('.toc'))return;
 const n=S.tab,h2=c.querySelector('h2');if(!h2)return;
 const hs=[...c.querySelectorAll('h3')].filter(h=>!h.closest('.fb'));
 hs.forEach((h,k)=>{h.id='lxs'+k;h.classList.add('lxh');h.textContent=(C.num?(n+1)+'.'+(k+1):(k+1)+'.')+' '+h.textContent});
 const toc=hs.map(h=>`<button data-act="lxgo" data-v="${h.id}">${h.textContent.replace(/^[\d.]+\s/,'')}</button>`).join('')+`<button data-act="lxgo" data-v="lxG">${tx('Slovníček','Glossary')}</button>`+((C.SRC[n]||[]).length?`<button data-act="lxgo" data-v="lxS">${tx('Zdroje','Sources')}</button>`:'');
 const fb=(C.F[n]||[]).map(f=>`<div class="fbox"><b>${f[0]}</b>${f[1].replace(/\n/g,'<br>')}</div>`).join('');
 h2.insertAdjacentHTML('afterend',`<div class="toc" aria-label="${tx('Obsah','Contents')}">${toc}</div>${fb?`<div class="fb">${fb}</div>`:''}`);
 const gl=C.GL.filter(g=>allGl||g[2].includes(n)),src=C.SRC[n]||[];
 const anchor=c.querySelector('.pl')||c.querySelector('.nav');
 const html=`<h3 id="lxG" class="lxh">${tx('Slovníček','Glossary')}${allGl?'':' · '+tx('této kapitoly','of this chapter')}</h3><dl class="gl">${gl.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl><button class="lnk" data-act="lxgl">${allGl?tx('Jen pojmy této kapitoly','Only this chapter\'s terms'):tx('Zobrazit celý slovníček','Show the whole glossary')}</button>`+(src.length?`<h3 id="lxS" class="lxh">${tx('Zdroje','Sources')}</h3><ul class="srcl">${src.map(s=>`<li>${s}</li>`).join('')}</ul><p class="srcn">${tx('Údaje v nápovědě byly porovnány s těmito zdroji 13. 11. 2026. Čísla v simulaci jsou orientační.','The facts in the help were checked against these sources on 13 Nov 2026. Numbers in the simulation are indicative.')}</p>`:'');
 anchor?anchor.insertAdjacentHTML('beforebegin',html):c.insertAdjacentHTML('beforeend',html);
}
ACT.lxgo=v=>{const e=document.getElementById(v);e&&e.scrollIntoView({block:'start'})};
ACT.lxgl=()=>{allGl=!allGl;ACT.hnav('0');requestAnimationFrame(()=>ACT.lxgo('lxG'))};
['help','hnav'].forEach(k=>{const f=ACT[k];ACT[k]=function(){const r=f.apply(this,arguments);enhance();return r}});
/* ---- popisy grafů pro čtečky ---- */
function a11y(){
 Object.keys(C.D).forEach(id=>{const c=document.getElementById(id);if(c){c.setAttribute('role','img');try{c.setAttribute('aria-label',C.D[id]())}catch(e){}}});
}
const _sync=window.sync;window.sync=sync=function(){_sync();a11y()};
/* GL má u pojmu [cs,en] jako tx() texty, v lang už je rozhodnuto */
})();
</script>

<script>boot();</script>
