*{box-sizing:border-box}
html{font-size:clamp(9px,min(calc(100vw/96),calc(100vh/54)),80px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.1rem/1.38 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:.2rem solid var(--orange);outline-offset:.15rem}
b{font-weight:700}
[hidden]{display:none!important}
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
/* hlavička */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1.6rem;padding:.9rem 2rem .6rem}
.brand{display:flex;flex-direction:column;gap:.15rem;min-width:15rem}
.back{font:600 .82rem/1 var(--f-head);color:var(--ink2);text-decoration:none;letter-spacing:.02em}

.tabs{display:flex;gap:.2rem;justify-content:center;min-width:0}
.tab-b{display:flex;flex-direction:column;align-items:flex-start;gap:.2rem;padding:.55rem .75rem .6rem;border-radius:1rem;min-width:0;flex:0 1 auto;min-height:3.6rem;transition:background .2s,color .2s}

.lang{display:grid;grid-auto-flow:column;gap:.2rem;background:var(--card);box-shadow:var(--shadow);border-radius:1.6rem;padding:.25rem;height:3.1rem;align-items:center}

.foot{display:flex;justify-content:space-between;gap:1rem;padding:.2rem 2rem .7rem;font:500 calc(.8rem*var(--z))/1 var(--f-mono);color:var(--ink2)}

.tab{height:100%;display:grid;gap:1rem;min-height:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) var(--side,27rem);gap:1rem;min-height:0}
.col{display:flex;flex-direction:column;gap:1rem;min-height:0;min-width:0}

.side{overflow:hidden}

.side .callout{font-size:calc(.86rem*var(--z))}

.scope{position:relative;border-radius:1.2rem;background:radial-gradient(120% 140% at 50% 0%,#241F17 0%,var(--scope) 62%);overflow:hidden;box-shadow:var(--shadow);min-height:0}

.tag{position:absolute;left:1rem;top:.8rem;font:700 .66rem/1 var(--f-head);letter-spacing:.2em;text-transform:uppercase;color:var(--cream);opacity:.8;pointer-events:none;display:flex;gap:.8rem;align-items:center}

.badge{position:absolute;right:1rem;top:.75rem;font:500 .8rem/1 var(--f-mono);color:var(--cream);opacity:.85;pointer-events:none;text-align:right}

.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{min-height:2.7rem;padding:.45rem .95rem;border-radius:1.4rem;background:var(--bg);box-shadow:inset 0 0 0 .13rem var(--line2);font:600 calc(.95rem*var(--z))/1.1 var(--f-head);transition:background .15s,color .15s,transform .1s;white-space:nowrap}

.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chips.g2{display:grid;grid-template-columns:repeat(2,1fr)}

.btn{min-height:3.3rem;padding:.6rem 1.4rem;border-radius:1.7rem;background:var(--orange);color:#17140F;font:700 1.05rem/1 var(--f-head);display:inline-flex;gap:.6rem;align-items:center;justify-content:center;box-shadow:0 .25rem 0 #C86D00;transition:transform .1s,box-shadow .1s}

.callout{border-radius:.9rem;background:var(--bg);padding:.7rem .9rem;border-left:.3rem solid var(--orange);font-size:calc(.9rem*var(--z));line-height:1.35;color:var(--ink2)}

.status{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;border-radius:1rem;font:700 1.05rem/1.2 var(--f-head);background:rgba(93,182,127,.18);color:var(--ink)}
.status i{width:1rem;height:1rem;border-radius:50%;background:var(--good);flex:none}
.status.warn{background:rgba(255,151,46,.2)}.status.warn i{background:var(--orange)}

.big{font:800 2.6rem/1 var(--f-head);letter-spacing:-.02em}

.or{color:var(--orange-t)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.kpi{display:flex;flex-direction:column;gap:.35rem;justify-content:center}
.kpi small{font:400 calc(.82rem*var(--z))/1.25 var(--f-body);color:var(--ink2)}
/* tabulka formátů */
/* kvíz kompatibility */
/* metadata */
.band{display:flex;height:1.7rem;border-radius:.5rem;overflow:hidden;gap:.12rem}
.band i{display:block;height:100%;min-width:.2rem;font:600 calc(.62rem*var(--z))/1.7rem var(--f-mono);font-style:normal;text-align:center;color:#17140F;overflow:hidden;white-space:nowrap}
.brow{display:grid;grid-template-columns:7rem 1fr;gap:.8rem;align-items:center}
.brow .nm{font:700 calc(.85rem*var(--z))/1.1 var(--f-head)}
.brow .nm small{display:block;font:400 calc(.72rem*var(--z)) var(--f-mono);color:var(--ink2);margin-top:.15rem}
.legend{display:flex;gap:.9rem;flex-wrap:wrap;font:500 calc(.72rem*var(--z)) var(--f-mono);color:var(--ink2)}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:.2rem;margin-right:.3rem;vertical-align:-.1rem}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.chips.g5{display:grid;grid-template-columns:repeat(5,1fr)}.chips.g5 .chip{padding:.45rem .1rem;text-align:center}
.rd{display:grid;grid-template-columns:auto 1fr;gap:.3rem .9rem;font:500 calc(.86rem*var(--z))/1.25 var(--f-mono)}
.rd span{color:var(--ink2)}.rd b{font-weight:500;text-align:right}.rd b.hot{color:var(--orange-t)}
.col>.scope.grow{min-height:9rem}

/* JPEG Lab Pro */
.bp{width:100%;height:8.2rem;border-radius:.7rem;background:var(--scope);display:block;touch-action:none;cursor:crosshair;box-shadow:inset 0 0 0 .13rem var(--line2)}
.chip.up{background:var(--orange-soft);box-shadow:inset 0 0 0 .13rem var(--orange)}
.chips.g6{display:grid;grid-template-columns:repeat(3,1fr)}.chips.g6 .chip{padding:.45rem .1rem;text-align:center}
.side .lbl.sp{margin-top:.15rem}
.hint{font:500 calc(.74rem*var(--z))/1.3 var(--f-mono);color:var(--ink2)}
@media (max-aspect-ratio:1/1){
html{font-size:clamp(9px,1.9vw,22px)}body{overflow:auto}.app{height:auto;min-height:100vh}#stage{overflow:visible}
.split{grid-template-columns:1fr}.scope{min-height:34rem}.top{grid-template-columns:1fr}.tabs{flex-wrap:wrap}.kpis{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Bitmapa Lab Pro: doplňky */
.tab-b{min-height:4.4rem}
.big.sm{font-size:1.75rem}
.big u{white-space:nowrap}
.sw{display:inline-block;width:1.5rem;height:1.5rem;border-radius:.35rem;vertical-align:-.28rem;margin-right:.55rem;box-shadow:inset 0 0 0 .1rem rgba(0,0,0,.35)}
.seg.modes{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:1fr 1fr}
.seg.modes.m3{grid-template-columns:1fr}.seg.modes.m3 .chip{min-height:2.8rem}
.seg.modes .chip{display:flex;flex-direction:column;align-items:center;gap:.25rem;min-height:3.4rem;justify-content:center}
.chip.sm{min-height:2.4rem;padding:.35rem .3rem;text-align:center}
.ctls{display:grid;grid-template-columns:1fr 1fr;gap:.2rem .9rem}.ctls .chips{grid-column:1/-1}
.ctls .ctl input[type=range]{height:2rem}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.tile{display:flex;flex-direction:column;gap:.3rem;align-items:flex-start;text-align:left;padding:.8rem 1rem;border-radius:1.2rem;background:var(--card);box-shadow:var(--shadow);min-height:5rem}
.tile b{font:700 1.02rem/1.15 var(--f-head)}
.tile i{font:800 1.3rem/1 var(--f-head);font-style:normal;color:var(--orange-t)}
.tile.on{background:var(--ink);color:var(--bg)}
.tile.on i{color:var(--orange)}.tile.on .lbl{color:var(--orange)}

.ctl .val{white-space:nowrap}
.ctls .lbl{letter-spacing:.14em}
.facts{display:flex;flex-direction:column;gap:.25rem;padding:.6rem .8rem;border-radius:1rem;background:var(--bg)}
.facts div{display:flex;justify-content:space-between;gap:.8rem;font-size:calc(.9rem*var(--z,1))}
.facts b{font-family:var(--f-head)}.facts i{font-style:normal;color:var(--ink2);text-align:right}

function setup(cv){
 const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
 const w=Math.max(20,Math.round(r.width)),h=Math.max(20,Math.round(r.height));
 if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
 const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);
 return{x,w,h,R:REM()};
}
let PZ=1;
function T(x,s,px,py,size,col,al='left',font='Atkinson Hyperlegible Mono',wt=500,base='middle'){x.font=`${wt} ${size*PZ}px "${font}",monospace`;x.fillStyle=col;x.textAlign=al;x.textBaseline=base;x.fillText(s,px,py)}
function TH(x,s,px,py,size,col,al='left'){T(x,s,px,py,size,col,al,'Montserrat',700)}
function line(x,x1,y1,x2,y2,col,w=1,dash){x.beginPath();x.strokeStyle=col;x.lineWidth=w*(PZ>1?1.5:1);x.setLineDash(dash||[]);x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.setLineDash([])}
function dot(x,px,py,r,col){x.beginPath();x.fillStyle=col;x.arc(px,py,r,0,TAU);x.fill()}

function ptr(e,cv){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,h:r.height}}
function drag(cv,fn){
 let on=false;
 cv.addEventListener('pointerdown',e=>{on=true;cv.setPointerCapture(e.pointerId);fn(ptr(e,cv),e)});
 cv.addEventListener('pointermove',e=>{if(on)fn(ptr(e,cv),e)});
 const off=()=>{on=false};cv.addEventListener('pointerup',off);cv.addEventListener('pointercancel',off);
}

/* ---------- ukázkový obrázek ---------- */
const SW=128,SH=96;

const cvx=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function pol(g,col,pts){g.fillStyle=col;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill()}
function scene(){
 if(SRCI)return SRCI;

 const sky=g.createLinearGradient(0,0,0,SH*.72);sky.addColorStop(0,'#2f6fc4');sky.addColorStop(1,'#cfe6f3');g.fillStyle=sky;g.fillRect(0,0,SW,SH);
 g.fillStyle='#ffd23f';g.beginPath();g.arc(100,20,9,0,TAU);g.fill();
 g.fillStyle='rgba(255,255,255,.9)';[[24,18,8],[31,16,10],[39,19,7],[70,30,6],[76,28,8],[83,31,5]].forEach(a=>{g.beginPath();g.arc(a[0],a[1],a[2],0,TAU);g.fill()});
 pol(g,'#6b8fb0',[[0,66],[22,38],[40,60],[58,34],[84,64],[104,44],[128,62],[128,96],[0,96]]);
 g.fillStyle='#4f9a4a';g.beginPath();g.moveTo(0,70);for(let x=0;x<=SW;x+=2)g.lineTo(x,70-Math.sin(x/128*Math.PI*1.4+.5)*9);g.lineTo(SW,96);g.lineTo(0,96);g.fill();
 g.fillStyle='#3d7f3a';g.beginPath();g.moveTo(0,84);for(let x=0;x<=SW;x+=2)g.lineTo(x,84-Math.sin(x/128*Math.PI*1.1+2)*6);g.lineTo(SW,96);g.lineTo(0,96);g.fill();
 g.fillStyle='#e8d9b0';g.fillRect(70,60,22,16);pol(g,'#b8442f',[[67,60],[81,48],[95,60]]);
 g.fillStyle='#5a3b22';g.fillRect(78,67,7,9);g.fillStyle='#9fd0ea';g.fillRect(87,64,4,4);
 g.fillStyle='#5a3b22';g.fillRect(31,66,4,14);g.fillStyle='#2f6b2c';g.beginPath();g.arc(33,62,10,0,TAU);g.fill();g.fillStyle='#3f8a3a';g.beginPath();g.arc(30,59,6,0,TAU);g.fill();
 SRCI=c;return c;
}
function small(w,h){

}

/* ---------- 1 Pixel ---------- */
let G1=null;
TABS.push({name:tx('Pixel','Pixel'),side:'27rem',
 build(){return `<div class="split"><div class="col">
  <div class="scope grow"><canvas id="c1"></canvas><div class="tag">${tx('obrázek jako mřížka čísel','a picture as a grid of numbers')}</div></div>
  <div class="kpis">
   <div class="card kpi"><span class="lbl">${tx('Celý obrázek','Whole picture')}</span><div class="big sm" data-o="k1a"></div><small>${tx('šířka × výška v pixelech','width × height in pixels')}</small></div>
   <div class="card kpi"><span class="lbl">${tx('Vybraný pixel','Selected pixel')}</span><div class="big sm" data-o="k1b"></div><small>${tx('sloupec, řádek (od nuly)','column, row (from zero)')}</small></div>
   <div class="card kpi"><span class="lbl">${tx('Jeho barva','Its colour')}</span><div class="big sm" data-o="k1c"></div><small>${tx('červená, zelená, modrá','red, green, blue')}</small></div>
  </div></div>
  <div class="side card">
   <div class="ctl"><div class="hd"><span class="lbl">${tx('Šířka lupy','Lens width')}</span></div><div class="chips g3">${[16,8,4].map(v=>`<button class="chip" data-k="z1" data-v="${v}">${v} px</button>`).join('')}</div></div>
   <div class="chips g2"><button class="chip" data-k="grid1" data-v="true">${tx('Mřížka','Grid')}</button><button class="chip" data-k="grid1" data-v="false">${tx('Bez mřížky','No grid')}</button></div>
   <div class="hint">${tx('Tažením po obrázku posunete lupu, klepnutím do zvětšeniny vyberete pixel.','Drag over the picture to move the lens, tap the zoom to select a pixel.')}</div>
   ${note(tx('<b>Pixel</b> je nejmenší bod obrazu. Obrázek je mřížka pixelů a každý pixel nese jednu barvu zapsanou třemi čísly.','A <b>pixel</b> is the smallest dot of a picture. A picture is a grid of pixels and each pixel carries one colour written as three numbers.'))}
  </div></div>`},
 init(){
  OUT.k1a=()=>`64 × 48 <u>= ${nf(3072)} px</u>`;
  OUT.k1b=()=>`${S.lx+S.sc[0]}, ${S.ly+S.sc[1]}`;
  OUT.k1c=()=>{const d=small(64,48).d,i=((S.ly+S.sc[1])*64+S.lx+S.sc[0])*4;return `<i class="sw" style="background:${rgbS(d[i],d[i+1],d[i+2])}"></i>${d[i]} · ${d[i+1]} · ${d[i+2]}`};
  const cv=$('#c1');
  drag(cv,p=>{if(!G1)return;const g=G1;
   if(p.x>=g.mx&&p.x<=g.mx+g.mw&&p.y>=g.my&&p.y<=g.my+g.mh){S.sc=[clamp(Math.floor((p.x-g.mx)/g.cs),0,g.cols-1),clamp(Math.floor((p.y-g.my)/g.cs),0,g.rows-1)];refresh();return}
   if(p.x<g.mx-g.gap*.3){S.lx=clamp(Math.round((p.x-g.ax)/g.aw*64-g.cols/2),0,64-g.cols);S.ly=clamp(Math.round((p.y-g.ay)/g.ah*48-g.rows/2),0,48-g.rows);refresh()}
  });
 },
 render(){
  const cv=$('#c1');if(!cv)return;const {x,w,h,R}=setup(cv);const im=small(64,48),cols=S.z1,rows=cols*3/4;
  S.lx=clamp(S.lx,0,64-cols);S.ly=clamp(S.ly,0,48-rows);S.sc=[clamp(S.sc[0],0,cols-1),clamp(S.sc[1],0,rows-1)];
  const pad=R*1.6,gap=R*3.4,top=R*3.6;
  let mh=Math.min(h-pad-top-R*.8,(w-pad*2-gap)*.6*.75),mw=mh/.75;
  let lw=Math.min(w-pad*2-gap-mw,mw*.72),lh=lw*.75;
  const ax=pad,ay=top+(h-top-pad-lh)/2,mx=w-pad-mw,my=top+(h-top-pad-mh)/2,cs=mw/cols;

  draw(x,im.c,ax,ay,lw,lh,false);x.strokeStyle=GR2;x.lineWidth=1;x.strokeRect(ax,ay,lw,lh);
  const rx=ax+S.lx/64*lw,ry=ay+S.ly/48*lh,rw=cols/64*lw,rh=rows/48*lh;
  line(x,rx+rw,ry,mx,my,'rgba(255,151,46,.55)',1.2,[5,5]);line(x,rx+rw,ry+rh,mx,my+mh,'rgba(255,151,46,.55)',1.2,[5,5]);
  x.strokeStyle=C.orange;x.lineWidth=2.5;x.strokeRect(rx,ry,rw,rh);
  draw(x,(()=>{const t=cvx(cols,rows);t.getContext('2d').drawImage(im.c,S.lx,S.ly,cols,rows,0,0,cols,rows);return t})(),mx,my,mw,mh,false);
  const d=im.d;
  if(cols<=8){const fs=Math.min(cs*.19,R*(cols<=4?1.25:.82));
   for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const k=((S.ly+j)*64+S.lx+i)*4,r=d[k],g=d[k+1],b=d[k+2],fc=fgOn(r,g,b),cx=mx+(i+.5)*cs,cy=my+(j+.5)*cs;
    T(x,String(r),cx,cy-fs*1.15,fs,fc,'center');T(x,String(g),cx,cy,fs,fc,'center');T(x,String(b),cx,cy+fs*1.15,fs,fc,'center')}}
  if(S.grid1&&cs>=R*1.1){x.strokeStyle='rgba(23,20,15,.55)';x.lineWidth=1;x.beginPath();for(let i=0;i<=cols;i++){x.moveTo(mx+i*cs,my);x.lineTo(mx+i*cs,my+mh)}for(let j=0;j<=rows;j++){x.moveTo(mx,my+j*cs);x.lineTo(mx+mw,my+j*cs)}x.stroke()}
  x.strokeStyle=C.cream;x.lineWidth=3.5;x.strokeRect(mx+S.sc[0]*cs,my+S.sc[1]*cs,cs,cs);x.strokeStyle=C.orange;x.lineWidth=1.8;x.strokeRect(mx+S.sc[0]*cs+2,my+S.sc[1]*cs+2,cs-4,cs-4);

/* ---------- 2 Mixér RGB ---------- */
const RGBP={red:[255,0,0],green:[0,255,0],blue:[0,0,255],yellow:[255,255,0],cyan:[0,255,255],magenta:[255,0,255],white:[255,255,255],black:[0,0,0],orange:[255,151,46]};
const RGBN={red:['červená','red'],green:['zelená','green'],blue:['modrá','blue'],yellow:['žlutá','yellow'],cyan:['azurová','cyan'],magenta:['purpurová','magenta'],white:['bílá','white'],black:['černá','black'],orange:['oranžová','orange']};
const slider=(k,lbl,max)=>`<div class="ctl"><div class="hd"><span class="lbl">${lbl}</span><span class="val" data-o="v_${k}"></span></div><input type="range" data-k="${k}" min="0" max="${max}" step="1"></div>`;
TABS.push({name:tx('Mixér RGB','RGB mixer'),side:'27rem',

  <div class="scope grow"><canvas id="c2"></canvas><div class="tag">${tx('světlo se sčítá: tři čísla 0 až 255','light adds up: three numbers 0 to 255')}</div></div>

   <div class="card kpi"><span class="lbl">${tx('Desítkově','Decimal')}</span><div class="big sm" data-o="k2a"></div><small>${tx('červená, zelená, modrá','red, green, blue')}</small></div>
   <div class="card kpi"><span class="lbl">${tx('Šestnáctkově','Hexadecimal')}</span><div class="big sm" data-o="k2b"></div><small>${tx('dvě číslice na kanál','two digits per channel')}</small></div>
   <div class="card kpi"><span class="lbl">${tx('Velikost jedné barvy','Size of one colour')}</span><div class="big sm">3 <u>${tx('bajty','bytes')}</u></div><small>${tx('3 kanály · 8 bitů = 24 bitů','3 channels · 8 bits = 24 bits')}</small></div>
  </div></div>
  <div class="side card">
   <div class="ctls">${slider('r',tx('R · červená','R · red'),255)}${slider('g',tx('G · zelená','G · green'),255)}${slider('b',tx('B · modrá','B · blue'),255)}
    <div class="chips g3">${Object.keys(RGBP).map(k=>`<button class="chip sm" data-act="pre2" data-v="${k}">${tx(RGBN[k][0],RGBN[k][1])}</button>`).join('')}</div></div>
   ${note(tx('Displej míchá každou barvu ze tří světel. Každé má sílu 0 až 255, tedy jeden bajt. Červená a zelená naplno dají žlutou, všechna tři naplno bílou.','A display mixes every colour from three lights. Each has a strength of 0 to 255, that is one byte. Red and green at full make yellow, all three at full make white.'))}
  </div></div>`},
 init(){
  ['r','g','b'].forEach(k=>OUT['v_'+k]=()=>S[k]);

  OUT.k2b=()=>'#'+[S.r,S.g,S.b].map(hx2).join('');
  ACT.pre2=v=>{const a=RGBP[v];S.r=a[0];S.g=a[1];S.b=a[2];refresh()};
 },

   <div class="hint">${tx('Pravá část je ilustrace: ztrátová komprese skutečně zahazuje údaje, jak přesně, tu nevysvětlujeme.','The right part is an illustration: lossy compression really discards data, how exactly is not explained here.')}</div>
  </div></div>`},
 init(){
  const ly=()=>S.ls5==='lossy';
  OUT.k5a=()=>ly()?tx('jiný','different'):tx('stejný','the same');
  OUT.k5a2=()=>ly()?tx('některé údaje jsou nevratně pryč','some data is gone for good'):tx('každý pixel souhlasí s originálem','every pixel matches the original');
  OUT.k5b=()=>ly()?tx('ne','no'):tx('ano','yes');
  OUT.k5c=()=>ly()?'JPEG':'PNG, GIF';
  OUT.why5=()=>ly()?`<b class="l">${tx('Ztrátová komprese','Lossy compression')}</b>${tx('Část údajů se nevratně zahodí, hlavně jemné detaily, které oko téměř nepozná. Soubor je výrazně menší, ale původní pixely už nejdou vrátit. Hodí se na fotografie.','Part of the data is irreversibly discarded, mostly fine detail the eye barely notices. The file is much smaller, but the original pixels cannot be restored. It suits photographs.')}`:`<b class="l">${tx('Bezeztrátová komprese','Lossless compression')}</b>${tx('Stejné údaje se zapíšou úsporněji, třeba když se opakují. Po rozbalení je každý pixel stejný jako v originálu. Hodí se na grafiku, text a archiv originálů.','The same data is written more economically, for example when it repeats. After unpacking every pixel equals the original. It suits graphics, text and archives of originals.')}`;
 },
 render(){
  const cv=$('#c5');if(!cv)return;const {x,w,h,R}=setup(cv);const pad=R*1.8;
  const ly=S.ls5==='lossy';
  let iw=(w-pad*2-R*14)/2,ih=iw*.75;const maxH=h-R*11;if(ih>maxH){ih=maxH;iw=ih/.75}
  const gap=(w-pad*2-iw*2)/2,x1=pad,xm=pad+iw+gap/2-R*3.2,x2=w-pad-iw,y0=R*5.2+(h-R*5.2-R*3-ih)/2;
  TH(x,tx('Původní obrázek','Original picture'),x1,y0-R*1.2,R*.9,TXT);
  draw(x,small(64,48).c,x1,y0,iw,ih,false);x.strokeStyle=GR2;x.lineWidth=1;x.strokeRect(x1,y0,iw,ih);
  TH(x,tx('Soubor','File'),xm+R*3.2,y0+ih/2-R*4.6,R*.9,TXT,'center');
  const fw=R*(ly?4.2:6.4),fh=R*5;rr(x,xm+R*3.2-fw/2,y0+ih/2-fh/2,fw,fh,R*.6,ly?C.blue:C.analog);
  T(x,tx('menší','smaller'),xm+R*3.2,y0+ih/2,R*.9,'#17140F','center','Montserrat',700);
  TH(x,'→',x1+iw+gap*.12,y0+ih/2,R*1.8,C.orange,'center');TH(x,'→',x2-gap*.12,y0+ih/2,R*1.8,C.orange,'center');
  TH(x,tx('Po rozbalení','After unpacking'),x2,y0-R*1.2,R*.9,C.orange);
  draw(x,ly?lossyImg().c:small(64,48).c,x2,y0,iw,ih,false);x.strokeStyle=C.orange;x.lineWidth=2;x.strokeRect(x2,y0,iw,ih);
  TH(x,ly?tx('ilustrace: některé údaje jsou nevratně pryč','illustration: some data is gone for good'):tx('každý pixel je stejný','every pixel is the same'),x2+iw/2,y0+ih+R*1.7,R*.9,ly?C.bad:C.good,'center');
  renderModes();
 }});

</script>

<script>
/* ===== Nápověda ke kapitolám ===== */
(function(){
const H=[
{t:tx(`Pixel`,`Pixel`),
 a:tx(`Bitmapový (rastrový) obrázek je pravidelná <b>mřížka pixelů</b>. Pixel je nejmenší bod obrazu a nese jedinou barvu zapsanou čísly. Obrázek 64 × 48 pixelů má 64 · 48 = 3 072 pixelů.`,`A bitmap (raster) picture is a regular <b>grid of pixels</b>. A pixel is the smallest dot of a picture and carries a single colour written as numbers. A picture of 64 × 48 pixels has 64 · 48 = 3,072 pixels.`),
 b:tx(`Když obrázek přiblížíte, nový detail nevznikne: uvidíte jen čtverečky. Hladký vzhled při přiblížení vytváří až prohlížeč tím, že dopočítává barvy mezi pixely.`,`When you zoom a picture, no new detail appears: you just see squares. A smooth look when zoomed is made by the viewer, which calculates colours between pixels.`),
 eh:tx(`Co se tu děje`,`What is going on`),
 e:[tx(`<b>Souřadnice.</b> Pixel se určuje sloupcem a řádkem. V počítačové grafice se obvykle počítá od nuly a od levého horního rohu, takže první pixel má souřadnice 0, 0.`,`<b>Coordinates.</b> A pixel is identified by a column and a row. In computer graphics counting usually starts from zero and from the top left corner, so the first pixel has the coordinates 0, 0.`),
    tx(`<b>Barva jako čísla.</b> Každý pixel obsahuje tři čísla 0 až 255 (červená, zelená, modrá). Podrobněji v kapitole 2.`,`<b>Colour as numbers.</b> Every pixel holds three numbers 0 to 255 (red, green, blue). More in chapter 2.`)],
 c:[tx(`Posunujte lupu po obrázku a všimněte si, že každý čtvereček má jednu barvu.`,`Move the lens over the picture and notice that every square has one colour.`),
    tx(`Zúžte lupu na 4 pixely a přečtěte čísla uvnitř pixelů.`,`Narrow the lens to 4 pixels and read the numbers inside the pixels.`),
    tx(`Vyberte pixel na hraně střechy a porovnejte jeho čísla se sousedem.`,`Select a pixel on the edge of the roof and compare its numbers with its neighbour.`)],
 d:tx(`Bitmapa je mřížka čtverečků a každý má jednu barvu zapsanou čísly.`,`A bitmap is a grid of squares and each has one colour written as numbers.`)},
{t:tx(`Mixér RGB`,`RGB mixer`),
 a:tx(`Displej míchá každou barvu ze tří světel: <b>červeného, zeleného a modrého (RGB)</b>. Každé má sílu 0 až 255, tedy jeden bajt. Světla se sčítají, proto se tomu říká aditivní míchání.`,`A display mixes every colour from three lights: <b>red, green and blue (RGB)</b>. Each has a strength of 0 to 255, that is one byte. Lights add up, which is why it is called additive mixing.`),
 b:tx(`Červená a zelená naplno dají žlutou, všechna tři naplno bílou, všechna vypnutá černou. Pro lidské vidění tři světla stačí, protože oko má tři druhy čípků.`,`Red and green at full make yellow, all three at full make white, all off make black. Three lights are enough for human vision because the eye has three kinds of cones.`),
 eh:tx(`Zápis barvy`,`Writing a colour`),
 e:[tx(`<b>Desítkově.</b> Tři čísla 0 až 255, například (255, 151, 46).`,`<b>In decimal.</b> Three numbers 0 to 255, for example (255, 151, 46).`),
    tx(`<b>Šestnáctkově.</b> Číslice 0–9 a A–F. Dvě číslice zapíšou jeden bajt (00 až FF), takže barva je #RRGGBB. Například 2E = 16 · 2 + 14 = 46.`,`<b>In hexadecimal.</b> Digits 0–9 and A–F. Two digits write one byte (00 to FF), so a colour is #RRGGBB. For example 2E = 16 · 2 + 14 = 46.`),
    tx(`<b>Velikost.</b> Tři kanály po 8 bitech jsou 24 bitů, tedy 3 bajty a 2²⁴ = 16 777 216 možných barev.`,`<b>Size.</b> Three channels of 8 bits are 24 bits, that is 3 bytes and 2²⁴ = 16,777,216 possible colours.`)],
 c:[tx(`Zvolte žlutou a všimněte si, že obsahuje červenou i zelenou naplno.`,`Choose yellow and notice that it contains red and green at full strength.`),
    tx(`Zapněte všechna tři světla naplno: vznikne bílá. Pak vše vypněte.`,`Turn all three lights on at full: white appears. Then turn everything off.`),
    tx(`Posuňte jen jeden posuvník a sledujte, jak se změní jedna dvojice šestnáctkových číslic.`,`Move just one slider and watch how one pair of hexadecimal digits changes.`)],
 d:tx(`Barva na displeji jsou tři čísla 0 až 255, tedy 3 bajty.`,`A colour on a display is three numbers 0 to 255, that is 3 bytes.`)},
{t:tx(`Barevná hloubka`,`Colour depth`),
 a:tx(`<b>Bit</b> má dvě hodnoty, 0 nebo 1. Pixel zapsaný n bity může mít 2ⁿ různých hodnot. U šedotónového obrazu je hodnotou odstín šedi: 1 bit dává 2 odstíny, 3 bity 8 odstínů, 8 bitů 256 odstínů.`,`A <b>bit</b> has two values, 0 or 1. A pixel written with n bits can have 2ⁿ different values. For a greyscale picture the value is a shade of grey: 1 bit gives 2 shades, 3 bits 8 shades, 8 bits 256 shades.`),
 b:tx(`Každý další bit počet odstínů zdvojnásobí, ale pro oko přínos klesá. Při málo bitech vznikají viditelné pásy tam, kde má být plynulý přechod.`,`Every further bit doubles the number of shades, but the benefit to the eye falls. With few bits visible bands appear where a smooth gradient should be.`),
 eh:tx(`Od šedi k barvě`,`From grey to colour`),
 e:[tx(`<b>Barevná hloubka</b> je počet bitů na pixel. Barevný obraz má tři kanály; při 8 bitech na kanál je to 24 bitů a 2²⁴ = 16 777 216 barev.`,`<b>Colour depth</b> is the number of bits per pixel. A colour picture has three channels; at 8 bits per channel that is 24 bits and 2²⁴ = 16,777,216 colours.`),
    tx(`<b>Paleta.</b> Některé obrazy mají jen omezenou paletu, třeba 256 barev, a pixel odkazuje na barvu číslem z palety, tedy 8 bitů na pixel.`,`<b>Palette.</b> Some pictures have a limited palette, for example 256 colours, and a pixel refers to a colour by a number from the palette, that is 8 bits per pixel.`)],
 c:[tx(`Posuňte posuvník z 8 bitů na 1 a sledujte, kdy se plynulý přechod rozpadne na pásy.`,`Move the slider from 8 bits to 1 and watch when the smooth gradient breaks into bands.`),
    tx(`Zvolte 3 bity a přečtěte kódy pod paletou: kolik jich je?`,`Choose 3 bits and read the codes under the palette: how many are there?`),
    tx(`Porovnejte 4 a 8 bitů a rozhodněte, zda rozdíl poznáte.`,`Compare 4 and 8 bits and decide whether you can see the difference.`)],
 d:tx(`n bitů dává 2ⁿ hodnot. Každý bit navíc počet zdvojnásobí.`,`n bits give 2ⁿ values. Every extra bit doubles the number.`)},
{t:tx(`Formáty a rozlišení`,`Formats and resolution`),
 a:tx(`<b>Rozlišení</b> je počet pixelů na šířku a na výšku. Počet pixelů je šířka · výška, takže při dvojnásobku obou rozměrů je pixelů čtyřikrát víc. Standardní rozlišení jsou například HD 1280 × 720, Full HD 1920 × 1080 a 4K 3840 × 2160.`,`<b>Resolution</b> is the number of pixels across and down. The pixel count is width · height, so when both dimensions double there are four times as many pixels. Standard resolutions are for example HD 1280 × 720, Full HD 1920 × 1080 and 4K 3840 × 2160.`),
 b:tx(`Velikost obrázku bez komprese je pixely · bity na pixel ÷ 8. Full HD ve 24 bitech: 1920 · 1080 · 3 B = 6 220 800 B, asi 6,2 MB. Soubor na disku bývá menší, protože je komprimovaný (kapitola 5).`,`The size of a picture without compression is pixels · bits per pixel ÷ 8. Full HD at 24 bits: 1920 · 1080 · 3 B = 6,220,800 B, about 6.2 MB. A file on disk is usually smaller because it is compressed (chapter 5).`),
 eh:tx(`Formáty souborů`,`File formats`),
 e:[tx(`<b>BMP</b> bývá bez komprese. <b>GIF</b> je bezeztrátový, má nejvýše 256 barev, jednoduchou průhlednost a animace. <b>PNG</b> je bezeztrátový s plnou barvou a plynulou průhledností. <b>JPEG</b> je ztrátový a hodí se na fotografie.`,`<b>BMP</b> is usually uncompressed. <b>GIF</b> is lossless, has at most 256 colours, simple transparency and animation. <b>PNG</b> is lossless with full colour and smooth transparency. <b>JPEG</b> is lossy and suits photographs.`),
    tx(`<b>Pravidlo výběru.</b> Fotografie: JPEG. Logo, schéma, snímek obrazovky: PNG. Jednoduchá animace: GIF. Archiv originálů: bezeztrátový formát.`,`<b>Rule of choice.</b> Photographs: JPEG. Logos, diagrams, screenshots: PNG. Simple animation: GIF. Archive of originals: a lossless format.`)],
 c:[tx(`V režimu Rozlišení přepínejte šířku a sledujte, jak se obraz skládá z čtverečků.`,`In the Resolution mode switch the width and watch the picture build from squares.`),
    tx(`Ve standardních rozlišeních vyberte Full HD a 24 bitů a přečtěte velikost.`,`In the standard resolutions choose Full HD and 24 bits and read the size.`),
    tx(`Ve formátech klepněte na čtyři druhy obsahu a řekněte, proč by jiný formát nevyhovoval.`,`In the formats tap the four kinds of content and say why another format would not suit.`)],
 d:tx(`Pixely = šířka · výška. Velikost bez komprese = pixely · bity ÷ 8. Formát volte podle obsahu.`,`Pixels = width · height. Size without compression = pixels · bits ÷ 8. Choose the format by content.`)},
{t:tx(`Princip komprese`,`Compression principle`),
 a:tx(`Komprese zmenšuje datový zápis obrazu. <b>Bezeztrátová</b> komprese po rozbalení obnoví obraz přesně, pixel po pixelu. <b>Ztrátová</b> komprese část údajů nevratně zahodí a po rozbalení je obraz jen podobný originálu.`,`Compression shrinks the data record of a picture. <b>Lossless</b> compression restores the picture exactly after unpacking, pixel by pixel. <b>Lossy</b> compression irreversibly discards part of the data and after unpacking the picture is only similar to the original.`),
 b:tx(`Ztrátová komprese soubor zmenší víc, ale zahozené údaje už nejdou vrátit, proto se hodí tam, kde drobné rozdíly oko nepozná (fotografie). Na ostré hrany, text a grafiku se používá bezeztrátová.`,`Lossy compression shrinks the file more, but discarded data cannot be brought back, so it suits places where the eye cannot see small differences (photographs). Lossless compression is used for sharp edges, text and graphics.`),
 eh:tx(`Co aplikace nevysvětluje`,`What the app does not explain`),
 e:[tx(`<b>Jak komprese uvnitř funguje</b> tato aplikace nevysvětluje, soustředí se na princip a na výběr formátu.`,`<b>How compression works inside</b> is not explained in this app, it focuses on the principle and on choosing a format.`)],
 c:[tx(`Přepněte mezi bezeztrátovou a ztrátovou kompresí a porovnejte obrázek po rozbalení.`,`Switch between lossless and lossy compression and compare the picture after unpacking.`),
    tx(`Všimněte si, že u ztrátové komprese už původní pixely nelze obnovit.`,`Notice that with lossy compression the original pixels cannot be restored.`)],
 d:tx(`Bezeztrátová obnoví obraz přesně, ztrátová ne. Ztrátová je menší, ale nevratná.`,`Lossless restores the picture exactly, lossy does not. Lossy is smaller but irreversible.`)}];

PLAN:[

 [[tx('Dva druhy komprese','Two kinds of compression'),tx('bezeztrátová: po rozbalení přesně originál; ztrátová: část údajů pryč','lossless: exactly the original after unpacking; lossy: part of the data gone')],[tx('Pravidlo výběru','Rule of choice'),tx('fotografie JPEG, grafika PNG, animace GIF','photographs JPEG, graphics PNG, animation GIF')]]],
GL:[
 [tx('Pixel','Pixel'),tx('Nejmenší bod bitmapy, nese jednu barvu zapsanou čísly.','The smallest dot of a bitmap, carries one colour written as numbers.'),[0,1]],

 [tx('Rozlišení','Resolution'),tx('Počet pixelů na šířku a na výšku.','The number of pixels across and down.'),[3]],

<script>
/* ===== Lab Pro: profil obrazovky, projekční režim, strukturovaná nápověda, okno Pro učitele, popisy grafů ===== */
(function(){
const C=window.LXC,NS=C.ns;
/* ---- styly ---- */
const st=document.createElement('style');st.textContent=`
.lxd{position:fixed;inset:0;z-index:50;background:rgba(10,9,7,.6);display:grid;place-items:center;padding:2rem}
.lxd[hidden]{display:none}
.lxd .dlg{width:min(54rem,100%);max-height:100%;overflow:auto;background:var(--card);color:var(--ink);border-radius:1.2rem;box-shadow:0 2rem 5rem rgba(0,0,0,.5);padding:1.6rem 2rem 1.8rem;user-select:text;-webkit-user-select:text}
.lxd h2{margin:0 0 .2rem;font:800 1.6rem/1.15 var(--f-head)}
.lxd .kap{font:700 .7rem/1 var(--f-head);letter-spacing:.2em;text-transform:uppercase;color:var(--orange-t)}
.lxd h3{margin:1.1rem 0 .3rem;font:700 .8rem/1 var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--orange-t)}
.lxd p,.lxd li{font-size:1.02rem;line-height:1.45;color:var(--ink2);margin:.25rem 0}
.lxd ul{margin:.2rem 0;padding-left:1.3rem}.lxd b{color:var(--ink)}
.lxd .x{float:right;margin:-.3rem -.6rem 0 1rem;width:2.8rem;height:2.8rem;border-radius:50%;background:var(--bg);font:700 1.2rem/1 var(--f-head)}
.lxd .opt{display:block;width:100%;text-align:left;margin:.4rem 0;padding:.65rem 1rem;border-radius:.9rem;background:var(--bg);box-shadow:inset 0 0 0 .13rem var(--line2)}
.lxd .opt.on{box-shadow:inset 0 0 0 .2rem var(--orange);background:var(--orange-soft)}
.lxd .opt b{display:block;font:700 1.05rem/1.2 var(--f-head)}
.lxd .opt span{display:block;margin-top:.15rem;font-size:.92rem;line-height:1.35;color:var(--ink2)}
.lxd .chp{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.3rem 0}
.lxd .chp button{padding:.6rem .8rem;border-radius:.9rem;background:var(--bg);box-shadow:inset 0 0 0 .13rem var(--line2);font:700 .95rem/1.1 var(--f-head)}
.lxd .chp button.on{background:var(--ink);color:var(--card);box-shadow:none}
.lxd .det{margin-top:.8rem;padding:.7rem .9rem;border-radius:.9rem;background:var(--bg);font-size:.92rem;line-height:1.4;color:var(--ink2)}
.lxd table{width:100%;border-collapse:collapse;margin:.3rem 0;font-size:.95rem}
.lxd td,.lxd th{padding:.4rem .5rem;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top;color:var(--ink2)}
.lxd th{font:700 .8rem/1.2 var(--f-head);color:var(--ink)}
.lxh{margin:1.2rem 0 .2rem!important;font:700 1.12rem/1.25 var(--f-head)!important;letter-spacing:0!important;text-transform:none!important;color:var(--ink)!important;scroll-margin-top:.5rem}
.fb{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.5rem;margin:.7rem 0 .2rem}
.fbox{padding:.55rem .8rem;border-radius:.8rem;background:var(--bg);font:500 .9rem/1.4 var(--f-mono);color:var(--ink);border-left:.25rem solid var(--orange)}
.fbox b{display:block;font:700 .66rem/1.2 var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--orange-t);margin-bottom:.2rem}
.toc{display:flex;flex-wrap:wrap;gap:.35rem .45rem;margin:.6rem 0 .1rem}
.toc button,.lnk{padding:.35rem .75rem;border-radius:1rem;background:var(--bg);font:600 .85rem/1 var(--f-head)}
.lnk{margin-top:.2rem}
.gl{margin:.3rem 0}.gl dt{font-weight:700;color:var(--ink);font-size:1rem}.gl dd{margin:0 0 .4rem;color:var(--ink2);font-size:.98rem;line-height:1.4}
.srcl{font-size:.92rem}.srcl a{color:var(--orange-t);text-decoration:underline}.srcn{font-size:.85rem}
/* hlavička: dvě tlačítka navíc */
.top{gap:1rem}.tab-b{padding:.5rem .4rem .55rem}.tab-b .nm{font-size:.88rem}.ib{width:2.8rem;height:2.8rem}.lang{height:2.8rem}.lang button{height:2.3rem;padding:0 .65rem}
html{--z:1}html[data-proj]{--z:1.15;--grid:rgba(244,241,234,.16);--grid2:rgba(244,241,234,.34)}
`;document.head.appendChild(st);
/* ---- profil a projekční režim ---- */
const PROF={panel:{proj:true},monitor:{proj:false}};
const PN={panel:{n:tx('Panel ve třídě','Classroom panel'),s:tx('Zrcadlení z počítače na interaktivní panel 4K, světlá třída, diváci 6 až 8 m daleko. Větší písmo a výraznější čáry. Výchozí volba.','Mirrored from a computer to a 4K interactive panel, bright classroom, viewers 6 to 8 m away. Larger text and stronger lines. Default.')},
 monitor:{n:tx('Monitor','Monitor'),s:tx('Běžný monitor (například 24 palců) nebo notebook, práce zblízka.','An ordinary monitor (for example 24 inch) or a laptop, working up close.')}};
S.prof='panel';S.proj=false;
function applyProj(on){S.proj=!!on;document.documentElement.toggleAttribute('data-proj',!!on);PZ=on?1.12:1;try{readC()}catch(e){}}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(NS+'-'+k);if(v===null)localStorage.removeItem(NS+'-'+k);else localStorage.setItem(NS+'-'+k,v)}catch(e){return null}}
function applyProfile(id,explicit){if(!PROF[id])id='panel';S.prof=id;ls('prof',id);if(explicit)ls('proj',null);applyProj(PROF[id].proj)}
function detect(){const d=window.devicePixelRatio||1;return{w:Math.round((screen.width||0)*d),h:Math.round((screen.height||0)*d),dpr:d}}
{const p=ls('prof'),j=ls('proj');applyProfile(PROF[p]?p:'panel',false);if(j==='1'||j==='0')applyProj(j==='1')}
/* ---- dialogy ---- */
const $0=document.querySelector.bind(document);
function mk(id){const d=document.createElement('div');d.id=id;d.className='lxd';d.hidden=true;d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.innerHTML='<div class="dlg"></div>';($0('.app')||document.body).appendChild(d);return d}
const dP=mk('lxprof'),dT=mk('lxtch');
const helpEl=()=>$0('#hlp')||$0('#help');
function closeHelp(){const h=helpEl();if(h&&!h.hidden)ACT.help()}
const nfx=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function renderProf(){
 const d=detect();
 dP.firstChild.innerHTML=`<button class="x" data-act="lxprof" aria-label="${tx('Zavřít','Close')}">✕</button>
 <div class="kap">${tx('nastavení','settings')}</div><h2>${tx('Obrazovka a promítání','Screen and projection')}</h2>
 <h3>${tx('Kde se aplikace promítá','Where the app is shown')}</h3>
 ${Object.keys(PROF).map(id=>`<button class="opt${S.prof===id?' on':''}" data-act="lxprofset" data-v="${id}"><b>${PN[id].n}</b><span>${PN[id].s}</span></button>`).join('')}
 <h3>${tx('Projekční režim','Projection mode')}</h3>
 <div class="chp"><button class="${S.proj?'on':''}" data-act="lxproj" data-v="1">${tx('Zapnuto: větší písmo a čáry','On: larger text and lines')}</button><button class="${S.proj?'':'on'}" data-act="lxproj" data-v="0">${tx('Vypnuto','Off')}</button></div>
 <div class="det">${tx(`Prohlížeč hlásí: ${nfx(d.w)}×${nfx(d.h)} bodů · zvětšení ${String(Math.round(d.dpr*100)/100).replace('.',',')}×. Aplikace se přizpůsobí velikosti okna v poměru 16:9, na 4K i Full HD.`,`The browser reports: ${nfx(d.w)}×${nfx(d.h)} dots · scaling ${Math.round(d.dpr*100)/100}×. The app adapts to the window size at 16:9, on 4K and Full HD alike.`)}</div>`;
}
function renderTch(){
 dT.firstChild.innerHTML=`<button class="x" data-act="lxtch" aria-label="${tx('Zavřít','Close')}">✕</button>
 <div class="kap">${tx('pro učitele','for teachers')}</div><h2>${tx('Předvolby a postup hodiny','Presets and lesson flow')}</h2>
 <h3>${tx('Předvolby jedním klepnutím','One-tap presets')}</h3>
 ${C.PRE.map((p,i)=>`<button class="opt" data-act="lxtchgo" data-v="${i}"><b>${p.t}</b><span>${p.d}</span></button>`).join('')}
 <h3>${tx('Doporučený postup','Suggested flow')} (${C.min})</h3>
 <table><tr><th>#</th><th>${tx('Téma','Topic')}</th><th>${tx('Čas','Time')}</th><th>${tx('Co ukázat','What to show')}</th></tr>${C.PLAN.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>
 <h3>${tx('Poznámky','Notes')}</h3><ul>${C.NOTES.map(n=>`<li>${n}</li>`).join('')}<li>${tx('Ovládání: klávesy ← a → přepínají kapitoly, tlačítko ? otevře vysvětlení, tlačítko obrazovky nastaví promítání.','Controls: the ← and → keys switch chapters, the ? button opens the explanation, the screen button sets projection.')}</li></ul>`;
}
let oP=false,oT=false;
function setP(v){oP=v;dP.hidden=!v;if(v){closeHelp();if(oT)setT(false);renderProf();dP.querySelector('.x').focus()}else $0('#bProf').focus()}
function setT(v){oT=v;dT.hidden=!v;if(v){closeHelp();if(oP)setP(false);renderTch();dT.querySelector('.x').focus()}else $0('#bTch').focus()}
ACT.lxprof=()=>setP(!oP);ACT.lxtch=()=>setT(!oT);
ACT.lxprofset=v=>{applyProfile(v,true);renderProf();refresh()};
ACT.lxproj=v=>{applyProj(v==='1');ls('proj',v==='1'?'1':'0');renderProf();refresh()};
ACT.lxtchgo=v=>{C.PRE[+v].f();setT(false);refresh()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(oP)setP(false);if(oT)setT(false)}});
[dP,dT].forEach(d=>d.addEventListener('click',e=>{if(e.target===d){oP&&setP(false);oT&&setT(false)}}));
window.addEventListener('keydown',e=>{if((oP||oT)&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))e.stopPropagation()},true);
/* tlačítka v záhlaví */
{const tools=$0('.tools'),h=$0('#bHelp')||$0('#bHlp');
 const mkb=(id,act,svg,t)=>{const b=document.createElement('button');b.className='ib';b.id=id;b.dataset.act=act;b.innerHTML='<svg viewBox="0 0 24 24">'+svg+'</svg>';b.title=t;b.setAttribute('aria-label',t);tools.insertBefore(b,h||tools.firstChild)};
 mkb('bTch','lxtch','<path d="M4 5h16v11H4zM8 20h8M12 16v4M8 9h8M8 12h5"/>',tx('Pro učitele: předvolby a postup','For teachers: presets and flow'));
 mkb('bProf','lxprof','<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/>',tx('Obrazovka a promítání','Screen and projection'));}
/* ---- strukturovaná nápověda: úprava hotového okna ---- */
let allGl=false;
const hc=()=>$0('#hlp .box')||$0('#help .dlg');
function enhance(){
 const c=hc();if(!c||!c.parentElement||c.parentElement.hidden||c.querySelector('.toc'))return;
 const n=S.tab,h2=c.querySelector('h2');if(!h2)return;
 const hs=[...c.querySelectorAll('h3')].filter(h=>!h.closest('.fb'));
 hs.forEach((h,k)=>{h.id='lxs'+k;h.classList.add('lxh');h.textContent=(C.num?(n+1)+'.'+(k+1):(k+1)+'.')+' '+h.textContent});
 const toc=hs.map(h=>`<button data-act="lxgo" data-v="${h.id}">${h.textContent.replace(/^[\d.]+\s/,'')}</button>`).join('')+`<button data-act="lxgo" data-v="lxG">${tx('Slovníček','Glossary')}</button>`+((C.SRC[n]||[]).length?`<button data-act="lxgo" data-v="lxS">${tx('Zdroje','Sources')}</button>`:'');
 const fb=(C.F[n]||[]).map(f=>`<div class="fbox"><b>${f[0]}</b>${f[1].replace(/\n/g,'<br>')}</div>`).join('');
 h2.insertAdjacentHTML('afterend',`<div class="toc" aria-label="${tx('Obsah','Contents')}">${toc}</div>${fb?`<div class="fb">${fb}</div>`:''}`);
 const gl=C.GL.filter(g=>allGl||g[2].includes(n)),src=C.SRC[n]||[];
 const anchor=c.querySelector('.pl')||c.querySelector('.nav');
 const html=`<h3 id="lxG" class="lxh">${tx('Slovníček','Glossary')}${allGl?'':' · '+tx('této kapitoly','of this chapter')}</h3><dl class="gl">${gl.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl><button class="lnk" data-act="lxgl">${allGl?tx('Jen pojmy této kapitoly','Only this chapter\'s terms'):tx('Zobrazit celý slovníček','Show the whole glossary')}</button>`+(src.length?`<h3 id="lxS" class="lxh">${tx('Zdroje','Sources')}</h3><ul class="srcl">${src.map(s=>`<li>${s}</li>`).join('')}</ul><p class="srcn">${tx('Údaje v nápovědě byly porovnány s těmito zdroji 13. 11. 2026. Čísla v simulaci jsou orientační.','The facts in the help were checked against these sources on 13 Nov 2026. Numbers in the simulation are indicative.')}</p>`:'');
 anchor?anchor.insertAdjacentHTML('beforebegin',html):c.insertAdjacentHTML('beforeend',html);
}
ACT.lxgo=v=>{const e=document.getElementById(v);e&&e.scrollIntoView({block:'start'})};
ACT.lxgl=()=>{allGl=!allGl;ACT.hnav('0');requestAnimationFrame(()=>ACT.lxgo('lxG'))};
['help','hnav'].forEach(k=>{const f=ACT[k];ACT[k]=function(){const r=f.apply(this,arguments);enhance();return r}});
/* ---- popisy grafů pro čtečky ---- */
function a11y(){
 Object.keys(C.D).forEach(id=>{const c=document.getElementById(id);if(c){c.setAttribute('role','img');try{c.setAttribute('aria-label',C.D[id]())}catch(e){}}});
}
const _sync=window.sync;window.sync=sync=function(){_sync();a11y()};
/* GL má u pojmu [cs,en] jako tx() texty, v lang už je rozhodnuto */
})();
</script>
