<pattern id="sraf2" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(-50)"><path d="M0 0v3.4" stroke="#2a1e14" stroke-width=".6" opacity=".45"/></pattern>
