.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}

.kpi small{font:400 .82rem/1.25 var(--f-body);color:var(--ink2)}
/* tabulka formátů */
/* kvíz kompatibility */
/* metadata */
.band{display:flex;height:1.7rem;border-radius:.5rem;overflow:hidden;gap:.12rem}
.band i{display:block;height:100%;min-width:.2rem;font:600 .62rem/1.7rem var(--f-mono);font-style:normal;text-align:center;color:#17140F;overflow:hidden;white-space:nowrap}
.brow{display:grid;grid-template-columns:7rem 1fr;gap:.8rem;align-items:center}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}

.rd{display:grid;grid-template-columns:auto 1fr;gap:.3rem .9rem;font:500 .86rem/1.25 var(--f-mono)}

.col>.scope.grow{min-height:9rem}
.brand b span.plus{display:inline-block;vertical-align:middle;margin-left:.6rem;padding:.2rem .5rem;border-radius:.3rem;background:#1b2a4a;color:#fff;font:700 .62rem/1.2 var(--f-head);letter-spacing:.1em}

@media (max-aspect-ratio:1/1){
html{font-size:clamp(9px,1.9vw,22px)}body{overflow:auto}.app{height:auto;min-height:100vh}#stage{overflow:visible}
.split{grid-template-columns:1fr}.scope{min-height:34rem}.top{grid-template-columns:1fr}.tabs{flex-wrap:wrap}.kpis{grid-template-columns:1fr}}
.hlp{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:1.2rem;background:rgba(10,8,5,.62)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
'use strict';
/* ========== pomocné funkce ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
let LANG='cs';try{LANG=localStorage.getItem('vlp-lang')||''}catch(e){}
if(LANG!=='cs'&&LANG!=='en')LANG=/^cs|^sk/i.test(navigator.language||'cs')?'cs':'en';
const tx=(c,e)=>LANG==='en'?e:c;
const nf=(n,d=0)=>(+n).toLocaleString(LANG==='en'?'en-US':'cs-CZ',{maximumFractionDigits:d,minimumFractionDigits:0});
const pct=(r,d=1)=>nf(r*100,r*100<1?2:d)+' %';
const TAU=Math.PI*2;
const log10=Math.log10;

/* ========== barvy a plátno ========== */
const C={};
function readC(){const cs=getComputedStyle(document.documentElement);['orange','orange-t','bg','card','ink','ink2','line','line2','scope','analog','cream','bad','good','blue'].forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim())}
const REM=()=>parseFloat(getComputedStyle(document.documentElement).fontSize)||16;
function setup(cv){
 const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
 const w=Math.max(20,Math.round(r.width)),h=Math.max(20,Math.round(r.height));
 if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
 const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);
 return{x,w,h,R:REM()};
}
function T(x,s,px,py,size,col,al='left',font='Atkinson Hyperlegible Mono',wt=500,base='middle'){x.font=`${wt} ${size}px "${font}",monospace`;x.fillStyle=col;x.textAlign=al;x.textBaseline=base;x.fillText(s,px,py)}
function TH(x,s,px,py,size,col,al='left'){T(x,s,px,py,size,col,al,'Montserrat',700)}
function line(x,x1,y1,x2,y2,col,w=1,dash){x.beginPath();x.strokeStyle=col;x.lineWidth=w;x.setLineDash(dash||[]);x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.setLineDash([])}
function dot(x,px,py,r,col){x.beginPath();x.fillStyle=col;x.arc(px,py,r,0,TAU);x.fill()}
const GR='rgba(244,241,234,.09)',GR2='rgba(244,241,234,.22)',TXT='rgba(244,241,234,.6)';
/* souřadnice ukazatele uvnitř plátna */
function ptr(e,cv){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,h:r.height}}
function drag(cv,fn){
 let on=false;
 cv.addEventListener('pointerdown',e=>{on=true;cv.setPointerCapture(e.pointerId);fn(ptr(e,cv),e)});
 cv.addEventListener('pointermove',e=>{if(on)fn(ptr(e,cv),e)});
 const off=()=>{on=false};cv.addEventListener('pointerup',off);cv.addEventListener('pointercancel',off);
}
/* logaritmická osa */
const lg=(L,a,b,p0,p1)=>p0+(log10(Math.max(L,1e-12))-log10(a))/(log10(b)-log10(a))*(p1-p0);

/* ========== stav ========== */
const MAPS={mins:v=>Math.round(v/5)*5,q:v=>v};
const IMAP={mins:v=>v,q:v=>v};
const S={tab:0,
 // 1 Cesta obrazu
 chain:'tv',fmt1:'fhd',st1:0,
 // 2 Surový tok
 res:'fhd',fps:25,bits:10,chroma:'422',pipe:'t2',
 // 3 Barvy
 cs:'420',v3:'res',
 // 4 Snímky
 gop:12,bf:2,mot:'mid',mc:true,play:false,
 // 5 DCT a vlnka
 meth:'dct',q5:55,v5:'res',
 // 6 Kodeky
 cdc:'hevc',dom:'tv',
 // 7 Kapacita
 f7:'fhd',c7:'hevc',mux:'t2',mins:120,fm:'dcp'};
const OUT={},ACT={},TABS=[];
function set(k,v){S[k]=v;refresh()}
let _rq=0;
function refresh(){if(_rq)return;_rq=requestAnimationFrame(()=>{_rq=0;sync();const t=TABS[S.tab];t&&t.render&&t.render()})}
function sync(){
 $$('[data-k][data-v]').forEach(el=>el.classList.toggle('on',String(S[el.dataset.k])===el.dataset.v));
 $$('input[data-k]').forEach(el=>{let v=S[el.dataset.k];if(el.dataset.map)v=IMAP[el.dataset.map](v);el.value=v;el.style.setProperty('--p',((el.value-el.min)/(el.max-el.min)*100)+'%')});
 $$('[data-o]').forEach(el=>{const f=OUT[el.dataset.o];if(f){const h=f();if(el.innerHTML!==h)el.innerHTML=h}});
}
document.addEventListener('click',e=>{
 if(e.target.id==='hlp'){ACT.helpx();return}
 const el=e.target.closest('[data-k][data-v],[data-act]');if(!el)return;
 if(el.dataset.act){ACT[el.dataset.act]&&ACT[el.dataset.act](el.dataset.v,el);return}
 let v=el.dataset.v;if(/^-?\d+(\.\d+)?$/.test(v))v=+v;else if(v==='true')v=true;else if(v==='false')v=false;set(el.dataset.k,v);
});
document.addEventListener('input',e=>{
 const el=e.target;if(el.type!=='range'||!el.dataset.k)return;
 let v=+el.value;if(el.dataset.map)v=MAPS[el.dataset.map](v);set(el.dataset.k,v);
});

/* ========== rámec aplikace ========== */

<script>
/* ===== společná data a výpočty ===== */
const FM={
 sd:{w:720,h:576,n:'SD 576'},
 hd:{w:1280,h:720,n:'HD 720'},
 fhd:{w:1920,h:1080,n:'Full HD'},
 uhd:{w:3840,h:2160,n:'4K UHD'},
 q8:{w:7680,h:4320,n:'8K UHD'},
 d2:{w:2048,h:1080,n:'DCI 2K'},
 d4:{w:4096,h:2160,n:'DCI 4K'}};
const CH={'444':{s:3,n:'4:4:4'},'422':{s:2,n:'4:2:2'},'420':{s:1.5,n:'4:2:0'}};
const px=f=>FM[f].w*FM[f].h;
const raw=(f,fps,bits,ch)=>px(f)*fps*bits*CH[ch].s;               // bit/s, surový obraz
function fR(b){                                                  // tok čitelně
 if(b>=1e9)return nf(b/1e9,b>=1e10?1:2)+' Gb/s';
 if(b>=1e6)return nf(b/1e6,b>=1e8?0:b>=1e7?1:2)+' Mb/s';
 return nf(b/1e3,0)+' kb/s';
}
function fS(B){                                                  // velikost čitelně (bajty)
 if(B>=1e12)return nf(B/1e12,2)+' TB';
 if(B>=1e9)return nf(B/1e9,B>=1e11?0:1)+' GB';
 if(B>=1e6)return nf(B/1e6,B>=1e8?0:1)+' MB';
 return nf(B/1e3,0)+' kB';
}
/* kodeky: bpp = bitů na pixel pro stejný vizuální dojem (orientační model), rel = podíl toku proti MPEG-2 */
const COD={
 mpeg2:{n:'MPEG-2',rel:100,yr:1995,fam:'blok'},
 avc:{n:'H.264 / AVC',rel:50,yr:2003,fam:'blok'},
 hevc:{n:'H.265 / HEVC',rel:27,yr:2013,fam:'blok'},
 av1:{n:'AV1',rel:22,yr:2018,fam:'blok'},
 vvc:{n:'H.266 / VVC',rel:15,yr:2020,fam:'blok'}};
const bpp=c=>.29*COD[c].rel/100;
/* tok kodéru pro televizi: pixely za sekundu × bpp, větší obraz je o něco úspornější */
const vrate=(f,fps,c)=>px(f)*fps*bpp(c)*Math.pow(2073600/px(f),.25);
const DCPMAX=250e6;
/* bitové kapacity (orientační) */
const PIPE={
 t2:{n:'DVB-T2',b:40e6,sub:()=>tx('multiplex, orientačně','multiplex, approx')},
 s2:{n:'DVB-S2',b:45e6,sub:()=>tx('transpondér, orientačně','transponder, approx')},
 st:{n:tx('Stream','Streaming'),b:15e6,sub:()=>tx('domácí linka pro 4K','home line for 4K')},
 bd:{n:'Blu-ray',b:40e6,sub:()=>tx('video, nejvýš','video, at most')},
 ubd:{n:'UHD Blu-ray',b:144e6,sub:()=>tx('celkem, nejvýš','total, at most')},
 dcp:{n:'DCP',b:DCPMAX,sub:()=>tx('JPEG 2000, nejvýš','JPEG 2000, at most')}};
const MEDIA=[
 {n:'DVD',B:4.7e9},{n:'Blu-ray',B:25e9},{n:'BD 50',B:50e9},{n:'UHD BD',B:100e9},{n:'SSD 256',B:256e9}];
</script>
<script>
/* ===== 1 Cesta obrazu ===== */
(function(){
const fps1=()=>S.chain==='tv'?(S.fmt1==='uhd'?50:25):24;
const FMTS={tv:['fhd','uhd'],cin:['d2','d4']};
function stages(){
 const f=S.fmt1,fp=fps1();
 if(S.chain==='tv'){
  const stu=raw(f,fp,10,'422'),dist=vrate(f,fp,'hevc');
  return[
   {n:tx('Kamera','Camera'),c:tx('snímač, surová data RAW','sensor, RAW data'),b:px(f)*fp*12,k:'raw',
    d:tx('Snímač kamery pod barevnou mozaikou dává jednu 12bitovou hodnotu na pixel. Barevný obraz z ní teprve vznikne.','The sensor under a colour mosaic gives one 12-bit value per pixel. The colour picture is only computed from it.')},
   {n:tx('Studio','Studio'),c:tx('nekomprimovaně, 10 bitů, 4:2:2','uncompressed, 10 bit, 4:2:2'),b:stu,k:'raw',
    d:tx('V režii a mezi přístroji běží obraz bez komprese po kabelech SDI nebo po síti IP. Proto jsou nutné gigabitové linky.','In the control room, picture runs uncompressed over SDI cables or an IP network. That needs gigabit links.')},
   {n:tx('Archiv a výměna','Archive and exchange'),c:tx('ProRes, XDCAM, asi 5 : 1','ProRes, XDCAM, about 5:1'),b:stu/5,k:'comp',
    d:tx('Pro střih a výměnu se každý snímek stlačí zvlášť. Kvalita je téměř beze ztráty a střih je rychlý, protože snímky na sobě nezávisí.','For editing and exchange every frame is compressed on its own. Quality is nearly lossless and cutting is fast, because frames do not depend on each other.')},
   {n:tx('Kodér vysílače','Broadcast encoder'),c:'HEVC (H.265)',b:dist,k:'comp',
    d:tx('Tady se tok rozhodne. Kodér využije podobnost sousedních snímků a vyhodí, co oko nepozná. Z gigabitů zbydou jednotky až desítky Mb/s.','This is where the rate is decided. The encoder exploits similarity of neighbouring frames and drops what the eye cannot see. Gigabits shrink to a few or tens of Mb/s.')},
   {n:tx('Přenos domů','Delivery home'),c:tx('DVB-T2, satelit, stream','DVB-T2, satellite, stream'),b:dist,k:'comp',
    d:tx('Do jednoho multiplexu se vejde několik programů. Tok k divákovi se už nezmenšuje a nesmí přesáhnout kapacitu kanálu.','Several programmes share one multiplex. The rate to the viewer no longer shrinks and must not exceed the channel capacity.')},
   {n:tx('Televize','Television'),c:tx('dekodér a displej, 8 bitů RGB','decoder and display, 8 bit RGB'),b:raw(f,fp,8,'444'),k:'raw',
    d:tx('Dekodér v televizi z malého toku dopočítá každý pixel všech snímků. Panel dostane obraz zase bez komprese.','The decoder in the TV rebuilds every pixel of every frame from the small stream. The panel gets uncompressed picture again.')}];
 }
 const mas=raw(f,24,12,'444');
 return[
  {n:tx('Kamera','Camera'),c:tx('snímač, surová data RAW','sensor, RAW data'),b:px(f)*24*12,k:'raw',
   d:tx('Kinokamera zapisuje surová 12bitová data snímače, často na větším čipu a ve vyšším rozlišení, než má výsledné kino.','A cinema camera records raw 12-bit sensor data, often on a bigger chip and in higher resolution than the final cinema.')},
  {n:tx('Střih a barvy','Edit and grade'),c:tx('12 bitů, 4:4:4, prostor XYZ','12 bit, 4:4:4, XYZ space'),b:mas,k:'raw',
   d:tx('Kino má vlastní barevný prostor XYZ, 12 bitů na kanál a plné barvy v každém pixelu. Takový master je obrovský.','Cinema uses its own colour space XYZ, 12 bits per channel and full colour in every pixel. Such a master is enormous.')},
  {n:tx('Kodér DCP','DCP encoder'),c:tx('JPEG 2000, nejvýš 250 Mb/s','JPEG 2000, at most 250 Mb/s'),b:DCPMAX,k:'comp',
   d:tx('Kino používá vlnkovou kompresi JPEG 2000. Každý snímek je samostatný, bez predikce, a tok je přísně omezen. Soubor se šifruje a otevře ho jen klíč KDM.','Cinema uses JPEG 2000 wavelet compression. Every frame stands alone, with no prediction, and the rate is strictly capped. The file is encrypted and only a KDM key opens it.')},
  {n:tx('Přeprava','Transport'),c:tx('disk, síť nebo satelit','drive, network or satellite'),b:DCPMAX,k:'comp',
   d:tx('Film putuje do kina jako sada souborů DCP na disku nebo po síti. Velikost je řádově stovky GB.','The film travels to the cinema as a DCP file set on a drive or over a network. Size is of the order of hundreds of GB.')},
  {n:tx('Kinoserver','Cinema server'),c:tx('dekódování JPEG 2000','JPEG 2000 decoding'),b:DCPMAX,k:'comp',
   d:tx('Server soubor dešifruje a v reálném čase dekóduje. Každý snímek se dá rozbalit zvlášť, takže nejsou potřeba žádné odkazy na snímky okolní.','The server decrypts and decodes in real time. Every frame unpacks on its own, so no references to neighbouring frames are needed.')},
  {n:tx('Projektor','Projector'),c:tx('nekomprimovaně do čipu','uncompressed to the chip'),b:mas,k:'raw',
   d:tx('Projektor dostane znovu plná 12bitová data všech pixelů a promítne je. Komprese se po cestě vrátila na původní tok.','The projector again gets full 12-bit data of every pixel and projects it. The compression has been undone on the way back to the original rate.')}];
}
let G={};
OUT.k1a=()=>{const s=stages();return fR(Math.max(...s.map(a=>a.b)))};
OUT.k1a_s=()=>tx('Nejvyšší tok na cestě. Takhle velký je obraz, dokud se nestlačí.','Highest rate on the path. That is how large the picture is until it is compressed.');
OUT.k1b=()=>{const s=stages();return fR(Math.min(...s.map(a=>a.b)))};
OUT.k1b_s=()=>S.chain==='tv'?tx('Tok ke divákovi po stlačení kodekem HEVC (model).','Rate to the viewer after HEVC compression (model).'):tx('Strop toku v kině po stlačení JPEG 2000.','Rate ceiling in the cinema after JPEG 2000.');
OUT.k1c=()=>{const s=stages();return`<span class="or">${nf(Math.max(...s.map(a=>a.b))/Math.min(...s.map(a=>a.b)),0)}</span><u>: 1</u>`};
OUT.k1c_s=()=>tx('Tolikrát je surový obraz větší než stlačený.','The raw picture is this many times bigger than the compressed one.');
OUT.fmts1=()=>FMTS[S.chain].map(f=>`<button class="chip${S.fmt1===f?' on':''}" data-k="fmt1" data-v="${f}">${FM[f].n}<small>${FM[f].w}×${FM[f].h} · ${f==='uhd'?50:S.chain==='tv'?25:24} fps</small></button>`).join('');
OUT.stl1=()=>stages().map((a,i)=>`<button class="chip${S.st1===i?' on':''}" data-k="st1" data-v="${i}" style="text-align:left">${i+1} · ${a.n}</button>`).join('');
OUT.d1=()=>{const a=stages()[S.st1];return`<b class="l">${a.n} · ${fR(a.b)}</b>${a.c}.<br>${a.d}`};
OUT.chainseg=()=>[['tv',tx('Televize','Television')],['cin',tx('Kino','Cinema')]].map(a=>`<button class="chip${S.chain===a[0]?' on':''}" data-act="chain" data-v="${a[0]}">${a[1]}</button>`).join('');
ACT.chain=v=>{S.chain=v;S.fmt1=v==='tv'?'fhd':'d4';S.st1=0;refresh()};
TABS.push({help:()=>`<h4>${tx('Jak to číst','How to read it')}</h4><p>${tx('Každý pruh je jedna etapa cesty. Šedý pruh je obraz bez komprese, modrý je stlačený. Délka pruhu je tok v bitech za sekundu na logaritmické ose, takže každý dílek je desetkrát víc. Kodér obraz stlačuje, dekodér ho vrací.','Each bar is one stage of the path. A grey bar is uncompressed picture, a blue one is compressed. Bar length is the rate in bits per second on a log axis, so every step is ten times more. An encoder compresses the picture, a decoder restores it.')}</p>`+`<h4>${tx('Označení PLUS','PLUS label')}</h4><p>${tx('Celá aplikace jde nad rámec učiva přiřazených ročníků.','The whole app goes beyond the curriculum of the assigned years.')}</p>`+`<h4>${tx('Co z toho plyne','Takeaway')}</h4><p>${tx('Obraz je na začátku i na konci cesty stejně velký. Komprese je jen prostřední úsek, kde se obraz musí vejít do kanálu nebo na disk.','The picture is equally big at the start and at the end of the path. Compression is only the middle section, where the picture has to fit into a channel or onto a disk.')}</p>`,name:tx('Cesta obrazu','Picture path'),side:'27rem',
 build(){
  return `<div class="split"><div class="col">
   <div class="scope grow"><canvas id="c1"></canvas>
    <div class="tag"><span><i class="a"></i>${tx('Nekomprimované','Uncompressed')}</span><span><i class="b"></i>${tx('Komprimované','Compressed')}</span><span><i></i>${tx('Vybraná etapa','Selected stage')}</span></div>
    <div class="badge">${tx('tok v bitech za sekundu, logaritmická osa','rate in bits per second, log axis')}</div></div>
   <div class="kpis">
    <div class="card kpi"><span class="lbl">${tx('Surový obraz','Raw picture')}</span><div class="big" data-o="k1a"></div><small data-o="k1a_s"></small></div>
    <div class="card kpi"><span class="lbl">${tx('Po kompresi','After compression')}</span><div class="big or" data-o="k1b"></div><small data-o="k1b_s"></small></div>
    <div class="card kpi"><span class="lbl">${tx('Poměr','Ratio')}</span><div class="big" data-o="k1c"></div><small data-o="k1c_s"></small></div>
   </div></div>
   <div class="side card">
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Kam obraz míří','Where the picture goes')}</span></div>
     <div class="seg" data-o="chainseg"></div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Formát','Format')}</span></div><div class="chips g2" data-o="fmts1"></div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Etapa cesty','Stage of the path')}</span></div><div class="chips g2" data-o="stl1"></div></div>
    <div class="callout" data-o="d1"></div>
   </div></div>`;
 },
 init(){
  const cv=$('#c1');
  cv.addEventListener('pointerdown',e=>{const p=ptr(e,cv);if(!G.rowH)return;const i=Math.floor((p.y-G.top)/G.rowH);if(i>=0&&i<6)set('st1',i)});
 },
 render(){
  const cv=$('#c1');if(!cv)return;
  const {x,w,h,R}=setup(cv);
  const st=stages(),A=1e6,B=3e11,x0=R*17,x1=w-R*8.2,X=b=>lg(b,A,B,x0,x1);
  const top=R*3.1,axisY=h-R*2.4,rowH=(axisY-top)/6;G={top,rowH};
  for(let p=6;p<=11;p++){const pxx=X(10**p);line(x,pxx,top-R*.5,pxx,axisY,p%3?GR:GR2,1);
   const lab=p<9?nf(10**(p-6))+' Mb/s':nf(10**(p-9))+' Gb/s';T(x,lab,pxx,axisY+R*.95,R*.72,TXT,'center')}
  line(x,x0,axisY,x1,axisY,GR2,1.2);
  st.forEach((a,i)=>{
   const y=top+i*rowH,bh=Math.min(rowH*.62,R*3),cy=y+rowH/2,sel=i===S.st1;
   if(sel){x.fillStyle='rgba(255,151,46,.13)';x.fillRect(R*.6,y+rowH*.04,w-R*1.2,rowH*.92)}
   TH(x,(i+1)+' · '+a.n,R*1.2,cy-R*.5,R*.98,sel?C.orange:C.cream);
   T(x,a.c.length>34?a.c.slice(0,33)+'…':a.c,R*1.2,cy+R*.62,R*.68,TXT);
   const xb=X(a.b);
   x.fillStyle=sel?C.orange:a.k==='raw'?C.analog:C.blue;x.beginPath();x.roundRect(x0,cy-bh/2,Math.max(3,xb-x0),bh,bh*.28);x.fill();
   TH(x,fR(a.b),xb+R*.7,cy,R*1.0,sel?C.orange:C.cream);
   if(i>0){const r=st[i-1].b/a.b;if(Math.abs(Math.log(r))>.2){
    const t=r>1?'÷ '+nf(r,r>=10?0:1):'× '+nf(1/r,1/r>=10?0:1);
    TH(x,t,w-R*1.2,cy,R*.95,r>1?C.blue:C.bad,'right')}}
  });
 }});
})();

<script>
/* ===== 2 Surový tok ===== */
(function(){
const RES=['sd','hd','fhd','uhd','q8','d2','d4'];
const cur=()=>raw(S.res,S.fps,S.bits,S.chroma);
const frameB=()=>px(S.res)*S.bits*CH[S.chroma].s/8;
OUT.k2a=()=>fR(cur());
OUT.k2a_s=()=>`${FM[S.res].w} × ${FM[S.res].h} × ${S.fps} ${tx('snímků','frames')} × ${S.bits} ${tx('bitů','bits')} × ${CH[S.chroma].s} ${tx('vzorku na pixel','samples per pixel')}`;
OUT.k2b=()=>fS(frameB());
OUT.k2b_s=()=>tx('Jeden snímek. Za sekundu jich je '+S.fps+'.','One frame. There are '+S.fps+' per second.');
OUT.k2c=()=>fS(cur()/8*60);
OUT.k2c_s=()=>tx('Jedna minuta nekomprimovaného obrazu. Film na 2 hodiny by měl '+fS(cur()/8*7200)+'.','One minute of uncompressed picture. A 2-hour film would be '+fS(cur()/8*7200)+'.');
OUT.fpsv=()=>`<b>${S.fps}</b> fps`;
OUT.pipes2=()=>Object.keys(PIPE).map(k=>`<button class="chip${S.pipe===k?' on':''}" data-k="pipe" data-v="${k}">${PIPE[k].n}</button>`).join('');
OUT.d2=()=>{

<script>
/* ===== 3 Barvy a podvzorkování ===== */
(function(){
const W=128,H=72;
let src=null,Y,CB,CR,oc1,oc2;
function makeSrc(){
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 const gr=g.createLinearGradient(0,0,W,0);gr.addColorStop(0,'#1d8fa0');gr.addColorStop(1,'#2b4fb0');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='#f2d34a';g.fillRect(0,H-14,W,14);
 g.fillStyle='#d8261f';g.beginPath();g.arc(30,30,18,0,TAU);g.fill();
 g.strokeStyle='#27c25a';g.lineWidth=1;g.beginPath();g.arc(30,30,21,0,TAU);g.stroke();
 for(let i=0;i<16;i++){g.fillStyle=i%2?'#d8261f':'#ffffff';g.fillRect(62+i*2,8,1,22)}
 g.fillStyle='#ffffff';g.font='700 15px Montserrat,Arial,sans-serif';g.textBaseline='top';g.fillText('KINO',58,42);
 g.strokeStyle='#e83ea8';g.lineWidth=1;g.beginPath();g.moveTo(2,H-3);g.lineTo(124,H-18);g.stroke();
 g.fillStyle='#8a2be2';g.fillRect(100,38,22,12);g.fillStyle='#ff7a00';g.fillRect(104,41,14,6);
 src=g.getImageData(0,0,W,H);
 const n=W*H;Y=new Float32Array(n);CB=new Float32Array(n);CR=new Float32Array(n);
 for(let i=0;i<n;i++){const r=src.data[i*4],gg=src.data[i*4+1],b=src.data[i*4+2];
  const y=.2126*r+.7152*gg+.0722*b;Y[i]=y;CB[i]=(b-y)/1.8556;CR[i]=(r-y)/1.5748}
 oc1=document.createElement('canvas');oc1.width=W;oc1.height=H;oc2=document.createElement('canvas');oc2.width=W;oc2.height=H;
}
function sub(P,sch){
 const o=new Float32Array(W*H);
 if(sch==='444'){o.set(P);return o}
 const bw=2,bh=sch==='420'?2:1;
 for(let by=0;by<H;by+=bh)for(let bx=0;bx<W;bx+=bw){
  let s=0;for(let j=0;j<bh;j++)for(let i=0;i<bw;i++)s+=P[(by+j)*W+bx+i];
  s/=bw*bh;for(let j=0;j<bh;j++)for(let i=0;i<bw;i++)o[(by+j)*W+bx+i]=s}
 return o;
}
function toRGB(y,cb,cr,out,i){
 const r=y+1.5748*cr,b=y+1.8556*cb,g=(y-.2126*r-.0722*b)/.7152;
 out[i*4]=clamp(r,0,255);out[i*4+1]=clamp(g,0,255);out[i*4+2]=clamp(b,0,255);out[i*4+3]=255;
}
let ERR=0;
function build(sch,view){
 const cb=sub(CB,sch),cr=sub(CR,sch);
 const a=new ImageData(W,H),b=new ImageData(W,H);let e=0;
 for(let i=0;i<W*H;i++){
  if(view==='chroma'){toRGB(128,CB[i],CR[i],a.data,i);toRGB(128,cb[i],cr[i],b.data,i)}
  else{
   src&&(a.data[i*4]=src.data[i*4],a.data[i*4+1]=src.data[i*4+1],a.data[i*4+2]=src.data[i*4+2],a.data[i*4+3]=255);
   toRGB(Y[i],cb[i],cr[i],b.data,i);
   if(view==='diff'){for(let k=0;k<3;k++)b.data[i*4+k]=clamp(128+(b.data[i*4+k]-a.data[i*4+k])*4,0,255)}
  }
 }
 // střední chyba vždy z výsledku proti originálu
 const t=new Uint8ClampedArray(W*H*4);
 for(let i=0;i<W*H;i++)toRGB(Y[i],cb[i],cr[i],t,i);
 for(let i=0;i<W*H;i++)for(let k=0;k<3;k++)e+=Math.abs(t[i*4+k]-src.data[i*4+k]);
 ERR=e/(W*H*3);
 if(view==='diff')for(let i=0;i<W*H;i++)for(let k=0;k<3;k++)a.data[i*4+k]=128;
 return[a,b];
}
const SAVE={'444':0,'422':1/3,'420':.5};
OUT.k3a=()=>`${CH[S.cs].s}<u>${tx('vzorku / pixel','samples / pixel')}</u>`;
OUT.k3a_s=()=>tx('Jas má vzorek v každém pixelu, barvu sdílí 1, 2 nebo 4 pixely.','Luma has a sample in every pixel, colour is shared by 1, 2 or 4 pixels.');
OUT.k3b=()=>`<span class="or">${nf(SAVE[S.cs]*100,0)} %</span>`;
OUT.k3b_s=()=>tx('Tolik dat ušetří podvzorkování, a to ještě před jakoukoli další kompresí.','This much data is saved by subsampling, before any other compression.');
OUT.k3c=()=>{if(!src)makeSrc();build(S.cs,'res');return`${nf(ERR,1)}<u>/ 255</u>`};
OUT.k3c_s=()=>tx('Průměrná chyba barvy v testovacím obrazu. Je největší na ostrých barevných hranách.','Mean colour error in the test picture. It is largest on sharp coloured edges.');
OUT.d3=()=>({
 '444':tx('Plné barvy v každém pixelu. Používá se při střihu, grafice a v kině (DCP má 4:4:4).','Full colour in every pixel. Used in editing, graphics and cinema (DCP is 4:4:4).'),
 '422':tx('Barva má poloviční šířku. Je to standard studií (SDI, ProRes 422, XDCAM).','Colour has half the width. This is the studio standard (SDI, ProRes 422, XDCAM).'),
 '420':tx('Barva má poloviční šířku i výšku. Takhle vysílá televize, takhle jsou stlačená videa na webu, disky Blu-ray i UHD Blu-ray.','Colour has half the width and height. This is how television broadcasts, how web videos, Blu-ray and UHD Blu-ray are stored.')}[S.cs]);
function mini(){
 const cv=$('#c3b');if(!cv)return;
 const {x,w,h,R}=setup(cv);
 const gw=4,gh=2,cw=Math.min(w/(gw+.6),h/(gh+.6)),ox=(w-cw*gw)/2,oy=(h-cw*gh)/2;
 const bw=2,bh=S.cs==='420'?2:1;
 x.lineWidth=1;
 for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){x.strokeStyle=C.line2;x.strokeRect(ox+i*cw,oy+j*cw,cw,cw);
  if(S.cs==='444'){x.fillStyle=C.orange;x.globalAlpha=.35;x.fillRect(ox+i*cw+2,oy+j*cw+2,cw-4,cw-4);x.globalAlpha=1}}
 if(S.cs!=='444')for(let j=0;j<gh;j+=bh)for(let i=0;i<gw;i+=bw){
  x.fillStyle=C.orange;x.globalAlpha=.35;x.fillRect(ox+i*cw+2,oy+j*cw+2,cw*bw-4,cw*bh-4);x.globalAlpha=1;
  dot(x,ox+(i+bw/2)*cw,oy+(j+bh/2)*cw,cw*.11,C.orange)}
 for(let j=0;j<gh;j++)for(let i=0;i<gw;i++)dot(x,ox+(i+.5)*cw,oy+(j+.5)*cw,cw*.07,C.ink);
}
TABS.push({help:()=>`<h4>${tx('Jak to číst','How to read it')}</h4><p>${tx('Obraz se rozloží na jas (Y), který nese ostrost, a dva barevné rozdíly (Cb, Cr). Podvzorkování nechá jas v každém pixelu a barvu sdílí skupina pixelů. Čísla 4:2:0 popisují blok 4 × 2 pixely: kolik barevných vzorků je v horním a kolik ve spodním řádku. Podívej se na červený kruh a na pruhy, tam se chyba pozná nejlépe.','The picture is split into luma (Y), which carries sharpness, and two colour differences (Cb, Cr). Subsampling keeps luma in every pixel while a group of pixels shares colour. The numbers in 4:2:0 describe a block of 4 × 2 pixels: how many colour samples are in the top and in the bottom row. Look at the red circle and the stripes, the error shows best there.')}</p>`+`<h4>${tx('Proč to funguje','Why it works')}</h4><p>${tx('Oko má mnohem víc tyčinek pro jas než čípků pro barvu, a proto ostrost vnímáme hlavně z jasu. Barevné detaily jde ztratit skoro bez povšimnutí.','The eye has far more rods for luminance than cones for colour, so sharpness is mostly seen in luma. Colour detail can be lost almost unnoticed.')}</p>`,name:tx('Barvy','Colour'),side:'27rem',
 build(){
  return `<div class="split"><div class="col">
   <div class="scope grow"><canvas id="c3"></canvas>

    <div class="ctl"><div class="hd"><span class="lbl">${tx('Co ukázat','What to show')}</span></div>
     <div class="seg"><button class="chip" data-k="v3" data-v="res">${tx('Výsledek','Result')}</button><button class="chip" data-k="v3" data-v="chroma">${tx('Jen barva','Colour only')}</button><button class="chip" data-k="v3" data-v="diff">${tx('Chyba ×4','Error ×4')}</button></div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Blok 4 × 2 pixely','Block of 4 × 2 pixels')}</span></div>
     <div style="height:6.2rem;position:relative"><canvas id="c3b" style="position:absolute;inset:0;width:100%;height:100%"></canvas></div>
     <p class="n">${tx('Černá tečka je vzorek jasu, oranžová plocha je jeden vzorek barvy.','A black dot is a luma sample, an orange area is one colour sample.')}</p></div>

  TH(x,l1,x0,y0-R*.8,R*.9,C.cream);TH(x,l2,x0+iw+gap,y0-R*.8,R*.9,C.orange);

<script>
/* ===== 4 Čas: snímky I, P, B ===== */
(function(){
const FPS=25;
const MOT={still:{p:.07,b:.035,dx:0},mid:{p:.22,b:.1,dx:4},fast:{p:.48,b:.28,dx:10}};
function gop(){
 const N=S.gop,bf=S.bf;
 const a=[];
 for(let i=0;i<N;i++){
  if(i===0)a.push('I');
  else if(bf===0||N===1)a.push('P');
  else a.push(i%(bf+1)===0?'P':'B');
 }
 if(N===1)return['I'];
 return a;
}
const size=t=>t==='I'?1:t==='P'?MOT[S.mot].p:MOT[S.mot].b;
const avg=()=>{const g=gop();return g.reduce((s,t)=>s+size(t),0)/g.length};
/* ukázková scéna pro kompenzaci pohybu */
const SW=96,SH=54,OS=22;
function bgTex(x,y){return 90+60*Math.sin(x*.55)*Math.cos(y*.42)+25*Math.sin((x+y)*1.3)}
function objTex(u,v){return 150+80*Math.sin(u*.9+v*.3)*Math.cos(v*.8)+((u+v)%5===0?-60:0)}
const OX0=26,OY0=16;
function scene(dx){
 const f0=new Float32Array(SW*SH),f1=new Float32Array(SW*SH),pr=new Float32Array(SW*SH);
 const draw=(f,ox)=>{for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){
  const u=x-ox,v=y-OY0;f[y*SW+x]=(u>=0&&u<OS&&v>=0&&v<OS)?objTex(u,v):bgTex(x,y)}};
 draw(f0,OX0);draw(f1,OX0+dx);
 for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){
  const u=x-(OX0+dx),v=y-OY0;
  pr[y*SW+x]=(u>=0&&u<OS&&v>=0&&v<OS)?f0[y*SW+(x-dx)]:f0[y*SW+x]}
 return{f0,f1,pr};
}
let SC=null,SCk=-1,res=0,resPct=0;
function sceneUpdate(){
 const dx=MOT[S.mot].dx;
 if(SCk!==dx){SC=scene(dx);SCk=dx}
 const out=new Float32Array(SW*SH);let e=0,nz=0;
 const ref=S.mc?SC.pr:SC.f0;
 for(let i=0;i<SW*SH;i++){const d=Math.abs(SC.f1[i]-ref[i]);out[i]=d;e+=d;if(d>8)nz++}
 res=e/(SW*SH);resPct=nz/(SW*SH);
 return out;
}
OUT.r4=()=>{
 const g=gop(),m=avg(),iOnly=1;
 return`<span>${tx('Skupina snímků (GOP)','Group of pictures (GOP)')}</span><b>${g.length} ${tx('snímků','frames')}</b>
 <span>${tx('Průměrný snímek proti I','Average frame vs I')}</span><b class="hot">${nf(m*100,0)} %</b>
 <span>${tx('Úspora proti samým I','Saving vs all-I')}</span><b>${nf((1-m)*100,0)} %</b>
 <span>${tx('Čekání na přepnutí kanálu (nejhůř)','Channel-change wait (worst)')}</span><b class="${S.gop/FPS>1.2?'hot':''}">${nf(S.gop/FPS,2)} s</b>
 <span>${tx('Nutné změny po pohybu','Changes left after motion')}</span><b>${nf(resPct*100,0)} %</b>`;
};
OUT.gopv=()=>`<b>${S.gop}</b> ${tx('snímků','frames')}`;
OUT.d4=()=>S.gop===1
 ?tx('Samé snímky I: každý je samostatný jako fotka. Střih na snímek přesně, rychlé přepnutí, ale velký tok. Tak funguje kino (JPEG 2000) a výměnné formáty (ProRes).','All I frames: each stands alone like a photo. Frame-accurate cutting and instant access, but a large rate. This is how cinema (JPEG 2000) and exchange formats (ProRes) work.')
 :tx('Snímek I je celý obraz. P ukládá jen změny proti předchozímu snímku, B se dívá dopředu i dozadu a je nejmenší. Na kanál se vstoupí jen při dalším I, proto televize čeká.','An I frame is the whole picture. P stores only changes from the previous frame, B looks forwards and backwards and is the smallest. A channel can only be entered at the next I, which is why TV waits.');
TABS.push({help:()=>`<h4>${tx('Jak to číst','How to read it')}</h4><p>${tx('Snímek I je celý obraz jako fotka. P ukládá jen změny proti předchozímu snímku, B využívá snímek předchozí i následující. Dole je ukázka pohybu: bez predikce se uloží každá změna pixelu, s predikcí kodér jen určí, kam se předmět posunul, a uloží drobný zbytek.','An I frame is the whole picture like a photo. P stores only changes from the previous frame, B uses both the previous and the next one. Below is a motion demo: without prediction every pixel change is stored, with prediction the encoder only states where the object moved and stores a small residual.')}</p>`,name:tx('Snímky I P B','I, P, B frames'),side:'27rem',
 build(){
  return `<div class="split"><div class="col">
   <div class="scope grow"><canvas id="c4"></canvas>
    <div class="tag"><span><i></i>I</span><span><i class="b"></i>P</span><span><i class="g"></i>B</span></div>
    <div class="badge">${tx('výška sloupce = velikost snímku (I = 100 %)','bar height = frame size (I = 100 %)')}</div></div>
   <div class="scope" style="flex:none;height:19rem"><canvas id="c4b"></canvas>
    <div class="tag">${tx('Pohyb mezi dvěma snímky','Motion between two frames')}</div></div>
   </div>
   <div class="side card">
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Délka skupiny snímků','GOP length')}</span><span class="val" data-o="gopv"></span></div>
     <div class="chips g5">${[1,6,12,25,50].map(f=>`<button class="chip" data-k="gop" data-v="${f}">${f===1?tx('jen I','I only'):f}</button>`).join('')}</div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Snímky B mezi P','B frames between P')}</span></div>
     <div class="seg"><button class="chip" data-k="bf" data-v="0">0</button><button class="chip" data-k="bf" data-v="2">2</button></div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Pohyb v obraze','Motion in the picture')}</span></div>
     <div class="seg"><button class="chip" data-k="mot" data-v="still">${tx('Stojí','Still')}</button><button class="chip" data-k="mot" data-v="mid">${tx('Střední','Medium')}</button><button class="chip" data-k="mot" data-v="fast">${tx('Rychlý','Fast')}</button></div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Predikce pohybu','Motion compensation')}</span></div>
     <div class="seg"><button class="chip" data-k="mc" data-v="false">${tx('Vypnutá','Off')}</button><button class="chip" data-k="mc" data-v="true">${tx('Zapnutá','On')}</button></div></div>
    <div class="rd" data-o="r4"></div>
    <div class="callout" data-o="d4"></div>
   </div></div>`;
 },
 render(){
  const cv=$('#c4');if(!cv)return;
  {const {x,w,h,R}=setup(cv);
   const g=gop(),N=g.length,x0=R*1.8,x1=w-R*1.8,top=R*3.4,base=h-(N<=26?R*4.4:R*2.2),bw=(x1-x0)/N,bar=Math.min(bw*.78,R*3.2);
   line(x,x0,base,x1,base,GR2,1.2);
   const col={I:C.orange,P:C.blue,B:C.good};
   const cx=i=>x0+bw*(i+.5);
   // závislosti
   if(N<=26&&N>1){
    x.lineWidth=1.4;
    let lastRef=0;
    for(let i=0;i<N;i++){
     const t=g[i];
     if(t==='P'){const prev=g.slice(0,i).map((k,j)=>k!=='B'?j:-1).filter(j=>j>=0).pop();
      arc(x,cx(i),cx(prev),base+R*.2,R*(1.2+Math.min(2,(i-prev)*.2)),C.blue,true)}
     if(t==='B'){const prev=g.slice(0,i).map((k,j)=>k!=='B'?j:-1).filter(j=>j>=0).pop();
      let nxt=-1;for(let j=i+1;j<N;j++)if(g[j]!=='B'){nxt=j;break}
      if(prev>=0)arc(x,cx(i),cx(prev),base+R*.2,R*.8,C.good,false);
      if(nxt>=0)arc(x,cx(i),cx(nxt),base+R*.2,R*.8,C.good,false)}
    }
   }
   g.forEach((t,i)=>{
    const hh=Math.max(R*.25,size(t)*(base-top));
    x.fillStyle=col[t];x.beginPath();x.roundRect(cx(i)-bar/2,base-hh,bar,hh,Math.min(bar*.3,R*.3));x.fill();
    if(N<=26)T(x,t,cx(i),base+R*.95,R*.8,TXT,'center');
   });
   // průměr
   const m=avg()*(base-top),yy=base-m;
   line(x,x0,yy,x1,yy,C.cream,1.5,[6,5]);
   TH(x,tx('průměr ','average ')+nf(avg()*100,0)+' %',x1,yy-R*.8,R*.9,C.cream,'right');
   if(N>1)TH(x,tx('Další I: čekání až ','Next I: wait up to ')+nf(N/FPS,2)+' s',x1,top-R*1.3,R*.9,N/FPS>1.2?C.bad:TXT,'right');
  }
  // pohyb
  const cb=$('#c4b');
  {const {x,w,h,R}=setup(cb);
   const out=sceneUpdate();
   const gap=R*1.2,top=R*3.2,sc=Math.min((w-gap*4)/3/SW,(h-top-R*.8)/SH),iw=SW*sc,ih=SH*sc,x0=(w-iw*3-gap*2)/2,y0=top+(h-top-R*.8-ih)/2;
   const pan=(f,ox,fn)=>{const o=document.createElement('canvas');o.width=SW;o.height=SH;const gx=o.getContext('2d'),id=gx.createImageData(SW,SH);
    for(let i=0;i<SW*SH;i++){const v=fn(f[i]);id.data[i*4]=v[0];id.data[i*4+1]=v[1];id.data[i*4+2]=v[2];id.data[i*4+3]=255}
    gx.putImageData(id,0,0);x.imageSmoothingEnabled=false;x.drawImage(o,ox,y0,iw,ih);x.strokeStyle=C.line2;x.strokeRect(ox,y0,iw,ih)};
   const g=v=>{v=clamp(v,0,255);return[v,v*.95,v*.85]};
   pan(SC.f0,x0,g);pan(SC.f1,x0+iw+gap,g);
   pan(out,x0+(iw+gap)*2,v=>{const k=clamp(v*3,0,255);return[k,k*.6,20]});
   TH(x,tx('Snímek n','Frame n'),x0,y0-R*.8,R*.9,C.cream);
   TH(x,tx('Snímek n + 1','Frame n + 1'),x0+iw+gap,y0-R*.8,R*.9,C.cream);
   TH(x,(S.mc?tx('Zbytek s predikcí pohybu','Residual with motion compensation'):tx('Zbytek bez predikce','Residual without prediction'))+' · '+nf(resPct*100,0)+' %',x0+(iw+gap)*2,y0-R*.8,R*.9,S.mc?C.good:C.orange);
  }
 }});
function arc(x,x1,x2,y,r,col,solid){
 x.beginPath();x.strokeStyle=col;x.globalAlpha=solid?.9:.55;x.moveTo(x1,y);x.quadraticCurveTo((x1+x2)/2,y+r*2,x2,y);x.stroke();x.globalAlpha=1;
}
})();
</script>
<script>
/* ===== 5 Prostor: blokové DCT × vlnka ===== */
(function(){
const W=128,H=72,N=W*H;
let IMG=null;
const QB=[16,11,10,16,24,40,51,61,12,12,14,19,26,58,60,55,14,13,16,24,40,57,69,56,14,17,22,29,51,87,80,62,18,22,37,56,68,109,103,77,24,35,55,64,81,104,113,92,49,64,78,87,103,121,120,101,72,92,95,98,112,100,103,99];
const D=[];for(let u=0;u<8;u++){D[u]=new Float32Array(8);for(let x=0;x<8;x++)D[u][x]=(u===0?Math.SQRT1_2:1)*.5*Math.cos((2*x+1)*u*Math.PI/16)}
function makeImg(){
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#c9c9c9');gr.addColorStop(.6,'#6a6a6a');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='#f4f4f4';g.beginPath();g.arc(98,16,9,0,TAU);g.fill();
 g.fillStyle='#3b3b3b';g.beginPath();g.moveTo(0,52);g.lineTo(28,22);g.lineTo(52,50);g.lineTo(72,30);g.lineTo(100,54);g.lineTo(128,40);g.lineTo(128,72);g.lineTo(0,72);g.fill();
 let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let y=56;y<72;y++)for(let x=0;x<W;x++){const v=70+rnd()*110;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(x,y,1,1)}
 for(let i=0;i<14;i++){g.fillStyle=i%2?'#101010':'#f0f0f0';g.fillRect(8+i*2,6,1,16)}
 g.fillStyle='#ffffff';g.font='700 13px Montserrat,Arial,sans-serif';g.textBaseline='top';g.fillText('KINO',40,6);
 g.strokeStyle='#ffffff';g.lineWidth=1;g.beginPath();g.moveTo(4,70);g.lineTo(60,40);g.stroke();
 const d=g.getImageData(0,0,W,H).data;IMG=new Float32Array(N);
 for(let i=0;i<N;i++)IMG[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
}
/* --- DCT 8×8 --- */
function dctF(img){
 const o=new Float32Array(N),b=new Float32Array(64),t=new Float32Array(64);
 for(let by=0;by<H;by+=8)for(let bx=0;bx<W;bx+=8){
  for(let y=0;y<8;y++)for(let x=0;x<8;x++)b[y*8+x]=img[(by+y)*W+bx+x]-128;
  for(let v=0;v<8;v++)for(let x=0;x<8;x++){let s=0;for(let y=0;y<8;y++)s+=D[v][y]*b[y*8+x];t[v*8+x]=s}
  for(let v=0;v<8;v++)for(let u=0;u<8;u++){let s=0;for(let x=0;x<8;x++)s+=D[u][x]*t[v*8+x];o[(by+v)*W+bx+u]=s}
 }
 return o;
}
function dctI(co){
 const o=new Float32Array(N),b=new Float32Array(64),t=new Float32Array(64);
 for(let by=0;by<H;by+=8)for(let bx=0;bx<W;bx+=8){
  for(let v=0;v<8;v++)for(let u=0;u<8;u++)b[v*8+u]=co[(by+v)*W+bx+u];
  for(let v=0;v<8;v++)for(let x=0;x<8;x++){let s=0;for(let u=0;u<8;u++)s+=D[u][x]*b[v*8+u];t[v*8+x]=s}
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){let s=0;for(let v=0;v<8;v++)s+=D[v][y]*t[v*8+x];o[(by+y)*W+bx+x]=clamp(s+128,0,255)}
 }
 return o;
}
const dctCtx=new Uint8Array(N);for(let y=0;y<H;y++)for(let x=0;x<W;x++)dctCtx[y*W+x]=(y%8)*8+(x%8);
const dctStep=new Float32Array(N);for(let i=0;i<N;i++)dctStep[i]=QB[dctCtx[i]];
/* --- vlnka 5/3, 3 úrovně --- */
const tmp=new Float32Array(Math.max(W,H));
function f1(a,off,st,n){
 const h=n>>1;
 for(let i=0;i<h;i++){const l=a[off+2*i*st],r=a[off+(2*i+2<n?2*i+2:2*i)*st];tmp[h+i]=a[off+(2*i+1)*st]-.5*(l+r)}
 for(let i=0;i<h;i++){const dm=i>0?tmp[h+i-1]:tmp[h+i];tmp[i]=a[off+2*i*st]+.25*(dm+tmp[h+i])}
 for(let i=0;i<n;i++)a[off+i*st]=tmp[i];
}
function i1(a,off,st,n){
 const h=n>>1;
 for(let i=0;i<h;i++){const dm=i>0?a[off+(h+i-1)*st]:a[off+(h+i)*st];tmp[2*i]=a[off+i*st]-.25*(dm+a[off+(h+i)*st])}
 for(let i=0;i<h;i++){const l=tmp[2*i],r=2*i+2<n?tmp[2*i+2]:tmp[2*i];tmp[2*i+1]=a[off+(h+i)*st]+.5*(l+r)}
 for(let i=0;i<n;i++)a[off+i*st]=tmp[i];
}
function wavF(img){
 const a=new Float32Array(N);for(let i=0;i<N;i++)a[i]=img[i]-128;
 for(let l=0;l<3;l++){const w=W>>l,h=H>>l;
  for(let y=0;y<h;y++)f1(a,y*W,1,w);
  for(let x=0;x<w;x++)f1(a,x,W,h)}
 return a;
}
function wavI(co){
 const a=Float32Array.from(co);
 for(let l=2;l>=0;l--){const w=W>>l,h=H>>l;
  for(let x=0;x<w;x++)i1(a,x,W,h);
  for(let y=0;y<h;y++)i1(a,y*W,1,w)}
 for(let i=0;i<N;i++)a[i]=clamp(a[i]+128,0,255);
 return a;
}
const wavCtx=new Uint8Array(N),wavStep=new Float32Array(N);
const WP={ll:.3,g:[0,1,1.4,1.6],hh:1.4,th:.3};
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
 let c=0;
 if(!(x<W>>3&&y<H>>3)){
  let L;
  for(L=3;L>=1;L--){if(x<(W>>(L-1))&&y<(H>>(L-1)))break}
  const inX=x>=(W>>L),inY=y>=(H>>L);
  c=1+(3-L)*3+((inX&&!inY?1:!inX&&inY?2:3)-1);
 }
 wavCtx[y*W+x]=c;
}
function wavSetup(){
 for(let i=0;i<N;i++){const c=wavCtx[i];let wt;
  if(c===0)wt=WP.ll;else{const L=3-Math.floor((c-1)/3),type=(c-1)%3+1;wt=WP.g[L]*(type===3?WP.hh:1)}
  wavStep[i]=wt}
}
wavSetup();
/* --- kvantování a odhad velikosti --- */
function quant(co,step,k,q,th=.5){for(let i=0;i<N;i++){const v=co[i]/(step[i]*k);q[i]=v<0?-Math.floor(-v+th):Math.floor(v+th)}}
function entropy(q,ctx,nc,nb){
 if(nb)nc*=3;
 const maps=[];for(let c=0;c<nc;c++)maps.push(new Map());const cnt=new Int32Array(nc);
 for(let i=0;i<N;i++){
  let c=ctx[i];
  if(nb){const x=i%W,y=(i/W)|0;let n=0;
   if(x>0&&q[i-1])n++;if(x<W-1&&q[i+1])n++;if(y>0&&q[i-W])n++;if(y<H-1&&q[i+W])n++;
   c=c*3+(n>2?2:n)}
  const m=maps[c];m.set(q[i],(m.get(q[i])||0)+1);cnt[c]++}
 let bits=0;for(let c=0;c<nc;c++){const n=cnt[c];if(!n)continue;maps[c].forEach(v=>{bits-=v*Math.log2(v/n)})}
 return bits;
}
function solve(co,step,ctx,nc,target,th,nb){
 const q=new Int32Array(N);let lo=Math.log(.02),hi=Math.log(200),k=1;
 for(let it=0;it<22;it++){k=Math.exp((lo+hi)/2);quant(co,step,k,q,th);const b=entropy(q,ctx,nc,nb);if(b>target)lo=Math.log(k);else hi=Math.log(k)}
 quant(co,step,k,q,th);
 return{q,k,bits:entropy(q,ctx,nc,nb)};
}
function recon(q,step,k,inv){const c=new Float32Array(N);for(let i=0;i<N;i++)c[i]=q[i]*step[i]*k;return inv(c)}
const d1=v=>(+v).toLocaleString(LANG==='en'?'en-US':'cs-CZ',{minimumFractionDigits:1,maximumFractionDigits:1});
const psnr=(a,b)=>{let e=0;for(let i=0;i<N;i++){const d=a[i]-b[i];e+=d*d}e/=N;return e<1e-6?99:10*Math.log10(255*255/e)};
let R5=null,key='',cD=null,cW=null;
function compute(){
 if(!IMG)makeImg();
 if(!cD){cD=dctF(IMG);cW=wavF(IMG)}
 const kk=S.q5;if(key===kk)return R5;key=kk;
 const target=N*8/kk;
 const d=solve(cD,dctStep,dctCtx,64,target,.5,false),w=solve(cW,wavStep,wavCtx,10,target,WP.th,true);
 const rd=recon(d.q,dctStep,d.k,dctI),rw=recon(w.q,wavStep,w.k,wavI);
 let zd=0,zw=0;for(let i=0;i<N;i++){if(!d.q[i])zd++;if(!w.q[i])zw++}
 R5={rd,rw,pd:psnr(IMG,rd),pw:psnr(IMG,rw),bd:d.bits/N,bw:w.bits/N,zd:zd/N,zw:zw/N};
 return R5;
}
OUT.k5a=()=>{const r=compute();return`${d1(r.pd)}<u>dB</u>`};
OUT.k5a_s=()=>{const r=compute();return tx('Blokové DCT (televize). Nulových koeficientů '+nf(r.zd*100,0)+' %.','Block DCT (television). Zero coefficients '+nf(r.zd*100,0)+' %.')};
OUT.k5b=()=>{const r=compute();return`<span class="or">${d1(r.pw)}</span><u>dB</u>`};
OUT.k5b_s=()=>{const r=compute();return tx('Vlnka (kino, JPEG 2000). Nulových koeficientů '+nf(r.zw*100,0)+' %.','Wavelet (cinema, JPEG 2000). Zero coefficients '+nf(r.zw*100,0)+' %.')};
OUT.k5c=()=>`${nf(8/S.q5,2)}<u>${tx('bitu / pixel','bit / pixel')}</u>`;
OUT.k5c_s=()=>tx('Oba kodéry dostaly stejný rozpočet. Surový obraz má 8 bitů na pixel.','Both encoders got the same budget. The raw picture has 8 bits per pixel.');
OUT.qv=()=>`<b>${S.q5}</b> : 1`;
OUT.d5=()=>`<b class="l">${tx('Co je vidět','What to look for')}</b>`+(S.q5<20
 ?tx('Při slabší kompresi jsou oba obrazy téměř stejné. Rozdíl je jen v tom, kde se chyba objeví.','At light compression both pictures look nearly equal. The difference is only where the error shows.')
 :tx('Čísla v dB vycházejí podobně, ale chyba vypadá jinak. DCT rozbije obraz na čtverce 8 × 8 a vzniknou kostičky. Vlnka bloky nemá, celý obraz jen měkne a hrany zůstanou souvislé.','The dB values come out similar, but the error looks different. DCT breaks the picture into 8 × 8 squares and blocks appear. A wavelet has no blocks, the whole picture only softens and edges stay continuous.'));
function panel(x,arr,ox,oy,pw,ph,err,label,sub,col,R){
 const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d'),id=g.createImageData(W,H);
 for(let i=0;i<N;i++){let v=arr[i];if(err)v=clamp(128+(arr[i]-IMG[i])*5,0,255);id.data[i*4]=v;id.data[i*4+1]=v;id.data[i*4+2]=v;id.data[i*4+3]=255}
 g.putImageData(id,0,0);x.imageSmoothingEnabled=false;x.drawImage(o,ox,oy,pw,ph);x.strokeStyle=C.line2;x.lineWidth=1;x.strokeRect(ox,oy,pw,ph);
 TH(x,label,ox,oy-R*1.5,R*.95,col);T(x,sub,ox,oy-R*.55,R*.72,TXT);
}
TABS.push({help:()=>`<h4>${tx('Jak to funguje','How it works')}</h4><p>${tx('Obraz se převede na koeficienty: DCT je počítá po blocích 8 × 8, vlnka po celém obraze ve třech úrovních. Kvantování zaokrouhlí koeficienty, drobné se vynulují a zbytek se zapíše úsporně.','The picture is turned into coefficients: DCT computes them in 8 × 8 blocks, a wavelet over the whole picture in three levels. Quantization rounds them, small ones become zero and the rest is stored compactly.')}</p>`+`<h4>${tx('Jak to číst','How to read it')}</h4><p>${tx('Všechny tři obrazy jsou stejně velké v datech. Údaj v dB (PSNR) říká, jak blízko je výsledek originálu: čím víc, tím líp. Neříká však, jak chyba vypadá, proto je dole chyba zesílená pětkrát. Posuň míru komprese a sleduj, kdy se objeví kostičky.','All three pictures take the same amount of data. The dB value (PSNR) says how close the result is to the original: more is better. It does not tell how the error looks, so the error is magnified five times below. Move the compression ratio and see when blocks appear.')}</p>`+`<h4>${tx('Pozor','Note')}</h4><p>${tx('Jde o zjednodušený model. Kodéry HEVC a AV1 mají k DCT ještě filtry, které bloky vyhlazují.','This is a simplified model. HEVC and AV1 encoders add filters to the DCT that smooth the blocks.')}</p>`,name:tx('DCT a vlnka','DCT and wavelet'),side:'27rem',
 build(){
  return `<div class="split"><div class="col">
   <div class="scope grow"><canvas id="c5"></canvas>
    <div class="badge">${tx('stejná velikost dat, jen jas (šedá)','same data size, luma only (grey)')}</div></div>
   <div class="kpis">
    <div class="card kpi"><span class="lbl">${tx('Kvalita DCT','DCT quality')}</span><div class="big" data-o="k5a"></div><small data-o="k5a_s"></small></div>
    <div class="card kpi"><span class="lbl">${tx('Kvalita vlnky','Wavelet quality')}</span><div class="big" data-o="k5b"></div><small data-o="k5b_s"></small></div>
    <div class="card kpi"><span class="lbl">${tx('Rozpočet dat','Data budget')}</span><div class="big" data-o="k5c"></div><small data-o="k5c_s"></small></div>
   </div></div>
   <div class="side card">
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Míra komprese','Compression ratio')}</span><span class="val" data-o="qv"></span></div>
     <input type="range" data-k="q5" min="4" max="80" step="1">
     <div class="chips g4">${[8,16,32,64].map(v=>`<button class="chip" data-k="q5" data-v="${v}">${v} : 1</button>`).join('')}</div></div>
    <div class="callout" data-o="d5"></div>
   </div></div>`;
 },
 render(){
  const cv=$('#c5');if(!cv)return;
  const {x,w,h,R}=setup(cv);
  const r=compute();
  const gap=R*1.3,top=R*2.6,rg=R*3.2,sc=Math.min((w-gap*4)/3/W,(h-top-rg-R*1)/2/H),pw=W*sc,ph=H*sc,x0=(w-pw*3-gap*2)/2;
  const y0=top+R*1.5+(h-top-R*1.5-R*1-2*ph-rg)/2,y1=y0+ph+rg;
  panel(x,IMG,x0,y0,pw,ph,false,tx('Originál','Original'),tx('8 bitů na pixel','8 bits per pixel'),C.cream,R);
  panel(x,r.rd,x0+pw+gap,y0,pw,ph,false,tx('Blokové DCT','Block DCT'),tx('televize · MPEG-2, AVC, HEVC','television · MPEG-2, AVC, HEVC')+' · '+d1(r.pd)+' dB',C.blue,R);
  panel(x,r.rw,x0+(pw+gap)*2,y0,pw,ph,false,tx('Vlnka','Wavelet'),tx('kino · JPEG 2000','cinema · JPEG 2000')+' · '+d1(r.pw)+' dB',C.orange,R);
  panel(x,r.rd,x0+pw+gap,y1,pw,ph,true,tx('Chyba DCT ×5','DCT error ×5'),tx('šedá = bez chyby','grey = no error'),C.blue,R);
  panel(x,r.rw,x0+(pw+gap)*2,y1,pw,ph,true,tx('Chyba vlnky ×5','Wavelet error ×5'),tx('šedá = bez chyby','grey = no error'),C.orange,R);
  TH(x,tx('Kolik se ztratilo','What was lost'),x0,y1+ph*.4,R*1.1,C.cream);
  T(x,tx('Chyba je zvětšená pětkrát.','The error is magnified five times.'),x0,y1+ph*.4+R*1.5,R*.75,TXT);
  T(x,tx('Skvrny jsou ztracený detail.','Spots are lost detail.'),x0,y1+ph*.4+R*2.6,R*.75,TXT);
 }});
})();

<script>

 {id:'mpeg2',dom:'tv',n:'MPEG-2',yr:'1995',mode:'inter',fam:tx('DCT v blocích 16 × 16','DCT in 16 × 16 blocks'),b:()=>vrate(F,FP,'mpeg2'),

 {id:'prores',dom:'cin',n:'ProRes 422 HQ',yr:'2007',mode:'intra',fam:tx('DCT, každý snímek zvlášť','DCT, every frame alone'),b:()=>184e6,

 {id:'j2k',dom:'cin',n:'JPEG 2000 (DCP)',yr:'2000',mode:'intra',fam:tx('vlnka, každý snímek zvlášť','wavelet, every frame alone'),b:()=>DCPMAX,

TABS.push({help:()=>`<h4>${tx('Jak to číst','How to read it')}</h4><p>${tx('Délka pruhu je tok pro Full HD při stejném vizuálním dojmu. Procenta vpravo ukazují tok proti MPEG-2. Kodeky s predikcí mezi snímky jsou úsporné, ale snímky na sobě závisejí. ProRes a JPEG 2000 ukládají každý snímek zvlášť: tok je mnohem vyšší, ale střih a přístup k libovolnému snímku jsou snadné.','Bar length is the rate for Full HD at the same visual quality. Percentages on the right show the rate against MPEG-2. Codecs with prediction between frames are economical, but frames depend on each other. ProRes and JPEG 2000 store each frame alone: the rate is much higher, but editing and access to any frame are easy.')}</p>`,name:tx('Kodeky','Codecs'),side:'27rem',
 build(){

    <div class="ctl"><div class="hd"><span class="lbl">${tx('Kodek','Codec')}</span></div><div class="chips g2" data-o="cdl"></div></div>
    <div class="rd" data-o="r6"></div>
    <div class="callout" data-o="d6"></div>

 },

   x.fillStyle=sel?C.orange:c.mode==='inter'?C.blue:C.analog;x.beginPath();x.roundRect(x0,cy-bh/2,Math.max(3,xb-x0),bh,bh*.28);x.fill();
   TH(x,fR(c.b()),xb+R*.7,cy,R*1.0,sel?C.orange:C.cream);
   if(c.mode==='inter'){const rel=c.b()/vrate(F,FP,'mpeg2');TH(x,nf(rel*100,0)+' %',w-R*1.2,cy,R*.95,TXT,'right')}
   x.globalAlpha=1;
  });
  TH(x,tx('proti MPEG-2','vs MPEG-2'),w-R*1.2,top-R*.8,R*.78,TXT,'right');
 }});
let G6={};
})();

<script>
/* ===== 7 Kapacita a velikost ===== */
(function(){
const F7=['sd','hd','fhd','uhd'];
const CODS=['mpeg2','avc','hevc','av1','vvc'];
const FILM={
 stream:{n:tx('Stream 4K','Streaming 4K'),b:()=>15e6},
 tv:{n:tx('Televize (model)','TV (model)'),b:()=>vrate(S.f7,fps7(),S.c7)},
 bd:{n:'Blu-ray',b:()=>35e6},
 ubd:{n:'UHD Blu-ray',b:()=>90e6},
 dcp:{n:'DCP',b:()=>DCPMAX}};
const fps7=()=>S.f7==='uhd'?50:25;

OUT.t7=()=>`<span><i></i>${PIPE[S.mux].n} · ${fR(cap())} · ${FM[S.f7].n}</span>`;

OUT.r7=()=>{
 const r=rate(S.c7),n=Math.floor(cap()/r),sz=fsize(),fits=MEDIA.filter(m=>m.B>=sz).map(m=>m.n);
 return`<span>${tx('Tok jednoho programu','Rate of one programme')}</span><b class="hot">${fR(r)}</b>
 <span>${tx('Programů v kanálu','Programmes in the channel')}</span><b class="hot">${n}</b>
 <span>${tx('Při MPEG-2 by jich bylo','With MPEG-2 there would be')}</span><b>${Math.floor(cap()/rate('mpeg2'))}</b>
 <span>${tx('Film','Film')} ${S.mins} min</span><b class="hot">${fS(sz)}</b>
 <span>${tx('Nejmenší médium','Smallest medium')}</span><b>${fits[0]||tx('žádné z nabízených','none listed')}</b>`;
};
OUT.fmt7=()=>F7.map(f=>`<button class="chip${S.f7===f?' on':''}" data-k="f7" data-v="${f}" style="padding:.4rem .1rem;font-size:.86rem">${FM[f].n}</button>`).join('');
OUT.d7=()=>{
 const r=rate(S.c7),n=Math.floor(cap()/r);
 return n<1?`<b class="l">${tx('Nevejde se','Does not fit')}</b>${tx('Jeden program je větší než celý kanál. Je třeba účinnější kodek nebo menší obraz.','One programme is bigger than the whole channel. A more efficient codec or a smaller picture is needed.')}`
 :`<b class="l">${tx('Proč se to řeší','Why it matters')}</b>${tx('Kapacita kanálu je pevná, každý ušetřený bit znamená místo pro další program.','Channel capacity is fixed, every saved bit makes room for another programme.')}`;
};
TABS.push({help:()=>`<h4>${tx('Jak to číst','How to read it')}</h4><p>${tx('Nahoře: každý blok je jeden program v kanálu. Dole: velikost filmu je tok krát délka. Zelená čára = film se vejde, červená = nevejde.','Top: each block is one programme in the channel. Bottom: film size is rate times length. Green line = film fits, red = it does not.')}</p>`,name:tx('Kapacita','Capacity'),side:'27rem',
 build(){
  return `<div class="split"><div class="col">
   <div class="scope grow"><canvas id="c7"></canvas>
    <div class="tag" data-o="t7"></div><div class="badge">${tx('programy v jednom kanálu','programmes in one channel')}</div></div>
   <div class="scope grow"><canvas id="c7b"></canvas>

   </div>
   <div class="side card">
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Rozlišení programu','Programme resolution')}</span></div><div class="chips g4" data-o="fmt7"></div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Kodek','Codec')}</span></div>
     <div class="chips g3">${CODS.map(c=>`<button class="chip" data-k="c7" data-v="${c}" style="padding:.4rem .1rem;font-size:.84rem">${COD[c].n.replace('H.264 / ','').replace('H.265 / ','').replace('H.266 / ','')}</button>`).join('')}</div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Kanál','Channel')}</span></div>
     <div class="seg"><button class="chip" data-k="mux" data-v="t2">DVB-T2</button><button class="chip" data-k="mux" data-v="s2">DVB-S2</button></div></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Délka filmu','Film length')}</span><span class="val" data-o="mins7"></span></div>
     <input type="range" data-k="mins" data-map="mins" min="30" max="240" step="5"></div>
    <div class="ctl"><div class="hd"><span class="lbl">${tx('Jak je film stlačen','How the film is compressed')}</span></div>
     <div class="chips g3">${Object.keys(FILM).map(k=>`<button class="chip" data-k="fm" data-v="${k}" style="padding:.4rem .1rem;font-size:.82rem">${FILM[k].n}</button>`).join('')}</div></div>
    <div class="rd" data-o="r7"></div>
   </div></div>`;
 },
 render(){

   const x0=R*10.2,x1=w-R*2,top=R*3,bot=h-R*.8,rowH=(bot-top)/CODS.length,bh=Math.min(rowH*.66,R*2.4);

   CODS.forEach((c,i)=>{
    const y=top+i*rowH+rowH/2,sel=S.c7===c,r=rate(c),n=Math.floor(Cp/r);

    TH(x,nm,R*1.2,y-R*.5,R*.98,sel?C.orange:C.cream);

    x.fillStyle='rgba(244,241,234,.07)';x.beginPath();x.roundRect(x0,y-bh/2,x1-x0,bh,bh*.25);x.fill();
    for(let k=0;k<n;k++){const a=X(k*r),b=X((k+1)*r);x.fillStyle=sel?C.orange:C.blue;x.globalAlpha=k%2?.8:1;x.beginPath();x.roundRect(a+1,y-bh/2,Math.max(1,b-a-2),bh,bh*.2);x.fill();x.globalAlpha=1}
    if(n<1){x.fillStyle='rgba(255,106,77,.5)';x.beginPath();x.roundRect(x0,y-bh/2,x1-x0,bh,bh*.25);x.fill()}
   });
  }
  const cb=$('#c7b');if(cb){
   const {x,w,h,R}=setup(cb);
   const A=1,B=600,x0=R*1.8,x1=w-R*5,X=g=>lg(g,A,B,x0,x1),axisY=h-R*2.2,top=R*5.4;
   [1,2,5,10,20,50,100,200,500].forEach(g=>{const pxx=X(g);line(x,pxx,top-R*.8,pxx,axisY,[1,10,100].includes(g)?GR2:GR,1);T(x,g+'',pxx,axisY+R*.95,R*.72,TXT,'center')});
   line(x,x0,axisY,x1,axisY,GR2,1.2);
   const sz=fsize()/1e9,bh=Math.min((axisY-top)*.5,R*3),by=axisY-(axisY-top)/2;
   x.fillStyle=C.orange;x.beginPath();x.roundRect(x0,by-bh/2,Math.max(3,X(Math.max(sz,A))-x0),bh,bh*.25);x.fill();
   TH(x,fS(fsize()),X(Math.max(sz,A))+R*.8>x1-R*5?X(Math.max(sz,A))-R*.8:X(Math.max(sz,A))+R*.8,by,R*1.2,X(Math.max(sz,A))+R*.8>x1-R*5?'#17140F':C.orange,X(Math.max(sz,A))+R*.8>x1-R*5?'right':'left');
   MEDIA.forEach((m,i)=>{
    const g=m.B/1e9,pxx=X(g),fits=m.B>=fsize(),ly=top-R*(i%2?2.7:1.4);
    line(x,pxx,ly+R*1.05,pxx,axisY,fits?C.good:C.bad,1.5,[4,4]);
    TH(x,m.n,pxx,ly-R*.2,R*.78,fits?C.good:C.bad,'center');T(x,nf(g,g<10?1:0)+' GB',pxx,ly+R*.55,R*.66,TXT,'center');
   });
  }
 }});
})();

<script>
/* ===== Výkladová část nápovědy ke každému kroku ===== */
(function(){
const H=(t,items)=>()=>`<p class="lead">${t}</p>`+items.map(([k,v])=>`<h4>${k}</h4><p>${v}</p>`).join('');
const INTRO=[
H(tx('Z kamery na obrazovku nebo plátno vede dlouhá cesta. Obraz se nasnímá, upraví, stlačí, přenese a na konci znovu rozbalí. Tato kapitola ukazuje celou cestu najednou a hlavně to, kde je obraz velký a kde malý.','The way from the camera to the screen is long. The picture is captured, edited, compressed, transmitted and unpacked again at the end. This chapter shows the whole path at once and, above all, where the picture is big and where small.'),[
 [tx('Proč se video komprimuje','Why video is compressed'),tx('Nestlačený obraz Full HD má řádově jednotky gigabitů za sekundu. Televizní kanál unese desítky megabitů, disk nebo internet ještě méně. Obraz se proto musí zmenšit zhruba stokrát až tisíckrát.','Uncompressed Full HD has a rate of the order of gigabits per second. A television channel carries tens of megabits, a disc or the internet even less. The picture therefore has to shrink roughly a hundred to a thousand times.')],
 [tx('Kodér a dekodér','Encoder and decoder'),tx('Kodér (encoder) obraz stlačí, dekodér (decoder) ho z tokového souboru znovu složí. Dohodnutému pravidlu, podle kterého to oba dělají, se říká kodek (codec).','An encoder compresses the picture, a decoder rebuilds it from the stream. The agreed rule both follow is called a codec.')],
 [tx('Televize a kino','Television and cinema'),tx('Televize musí vejít do vysílacího kanálu, a proto tok silně stlačuje a nechá si zbytek spočítat v přijímači. Kino má vlastní disk a velký sál, proto drží vyšší tok a ukládá každý snímek zvlášť.','Television has to fit into a broadcast channel, so it compresses heavily and lets the receiver compute the rest. Cinema has its own drive and a large screen, so it keeps a higher rate and stores every frame alone.')],
 [tx('Logaritmická osa','Logarithmic axis'),tx('Tok se mění o mnoho řádů. Proto je osa logaritmická: každý dílek je desetkrát víc než předchozí.','The rate varies over many orders of magnitude. The axis is therefore logarithmic: every step is ten times the previous one.')]]),
H(tx('Surový tok je počet bitů, které by za sekundu vyprodukoval nestlačený obraz. Bez něj nelze posoudit, jak moc je komprese potřeba.','The raw rate is the number of bits per second an uncompressed picture would produce. Without it, you cannot judge how much compression is needed.'),[
 [tx('Vzorec','Formula'),tx('Tok = šířka × výška × snímky za sekundu × bity na vzorek × vzorky na pixel. Například Full HD, 25 snímků za sekundu, 8 bitů a 3 vzorky (R, G, B) dává 1920 × 1080 × 25 × 8 × 3 ≈ 1,2 Gb/s.','Rate = width × height × frames per second × bits per sample × samples per pixel. For example Full HD, 25 frames per second, 8 bits and 3 samples (R, G, B) gives 1920 × 1080 × 25 × 8 × 3 ≈ 1.2 Gb/s.')],
 [tx('Co tok nejvíc zvedá','What raises it most'),tx('Roste s počtem pixelů, tedy čtyřnásobně při dvojnásobném rozlišení na šířku i výšku, a lineárně s počtem snímků a bitovou hloubkou. 4K, 50 snímků a HDR proto znamenají mnohonásobek SD.','It grows with the number of pixels, so fourfold when width and height both double, and linearly with frame rate and bit depth. 4K, 50 frames and HDR therefore mean many times SD.')],
 [tx('Poměr komprese','Compression ratio'),tx('Poměr je surový tok dělený tokem kanálu. Ukazuje, kolikrát musí kodek obraz zmenšit, aby se vešel.','The ratio is the raw rate divided by the channel rate. It tells how many times the codec has to shrink the picture to make it fit.')]]),
H(tx('Oko vnímá ostrost hlavně v jasu, barvu vidí hrubší. Kodeky toho využívají: jas nechají celý a barevnou informaci uloží jen pro skupiny pixelů.','The eye sees sharpness mainly in luma and colour more coarsely. Codecs exploit this: they keep luma in full and store colour information only for groups of pixels.'),[
 [tx('Y, Cb, Cr','Y, Cb, Cr'),tx('Místo R, G, B se obraz zapíše jako jas Y a dva barevné rozdíly Cb a Cr. Jas nese detail, rozdíly nesou odstín. Převodní koeficienty určuje norma, pro HD je to BT.709.','Instead of R, G, B the picture is written as luma Y and two colour differences Cb and Cr. Luma carries detail, the differences carry hue. The conversion coefficients are set by a standard, for HD it is BT.709.')],
 [tx('Podvzorkování 4:4:4, 4:2:2, 4:2:0','Subsampling 4:4:4, 4:2:2, 4:2:0'),tx('4:4:4 má barvu v každém pixelu (3 vzorky na pixel). 4:2:2 sdílí barvu ve dvojicích vodorovně (2 vzorky), 4:2:0 ve čtveřicích 2 × 2 (1,5 vzorku). Televize a streaming používají 4:2:0, ušetří tím polovinu dat.','4:4:4 has colour in every pixel (3 samples per pixel). 4:2:2 shares colour in horizontal pairs (2 samples), 4:2:0 in 2 × 2 groups (1.5 samples). Television and streaming use 4:2:0, which halves the data.')],
 [tx('Kde to vadí','Where it hurts'),tx('Na ostrých barevných hranách, například červený text na modrém pozadí, a při pozdějším stříhání a klíčování. Proto se ve studiu a při střihu drží 4:2:2 nebo 4:4:4.','On sharp colour edges, for example red text on blue, and in later editing and keying. That is why studios and editing keep 4:2:2 or 4:4:4.')]]),
H(tx('Po sobě jdoucí snímky jsou si velmi podobné. Kodek proto nemusí ukládat každý celý, stačí zapsat změny.','Consecutive frames are very similar. A codec therefore does not have to store each one completely, it only records the changes.'),[
 [tx('Snímek I (intra)','I frame (intra)'),tx('Celý obraz zakódovaný sám o sobě, jako fotografie. Je největší a je jediný možný vstupní bod: do proudu lze vstoupit jen na snímku I.','A whole picture coded by itself, like a photograph. It is the largest and the only possible entry point: a stream can only be entered at an I frame.')],
 [tx('Snímek P a B','P and B frames'),tx('P popisuje změny proti předchozímu snímku. B se opírá o předchozí i následující snímek, je nejmenší, ale musí počkat na budoucí snímek.','P describes changes from the previous frame. B relies on both the previous and the next frame, is the smallest, but has to wait for a future frame.')],
 [tx('GOP a přepínání kanálů','GOP and channel change'),tx('Skupina snímků (GOP) začíná snímkem I. Delší skupina šetří data, ale po přepnutí kanálu se čeká na další I, v televizi proto bývá zhruba půl až dvě sekundy.','A group of pictures (GOP) starts with an I frame. A longer group saves data, but after a channel change you wait for the next I, which is why television usually uses about half to two seconds.')],
 [tx('Predikce pohybu','Motion compensation'),tx('Pohybuje-li se předmět, kodér neukládá nové pixely. Najde, kam se blok posunul, uloží vektor posunu a jen drobný zbytek. Dole vidíte, o kolik se zbytek zmenší.','When an object moves, the encoder does not store new pixels. It finds where the block moved, stores the motion vector and only a small residual. Below you can see how much the residual shrinks.')]]),
H(tx('Hlavní kompresní trik: obraz se převede z pixelů na koeficienty, kde se důležité od nedůležitého oddělí snadněji. Nedůležité se zahodí a zbytek se zapíše úsporně.','The main compression trick: the picture is turned from pixels into coefficients, where important and unimportant parts separate more easily. The unimportant is thrown away and the rest is stored compactly.'),[
 [tx('DCT','DCT'),tx('Diskrétní kosinová transformace rozloží blok 8 × 8 pixelů na 64 koeficientů: první je průměr, další popisují postupně jemnější vzory. Většina energie obrazu je v několika prvních.','The discrete cosine transform splits an 8 × 8 pixel block into 64 coefficients: the first is the average, the next describe progressively finer patterns. Most of the picture energy is in the first few.')],
 [tx('Kvantování','Quantization'),tx('Koeficienty se zaokrouhlí na hrubší stupnici, drobné se vynulují. Tady vzniká ztráta a podle ní se řídí kvalita i velikost. Posuvník míry komprese ji zvyšuje.','Coefficients are rounded to a coarser scale and the small ones become zero. This is where loss occurs and it governs both quality and size. The compression slider increases it.')],
 [tx('Proč kostičky','Why blocks'),tx('Každý blok se kóduje zvlášť, proto se při silné kompresi objeví čtvercové kostičky. Vlnka pracuje s celým obrazem, nemá hranice bloků a chyba je měkká, rozmazaná. Proto ji volí digitální kino (JPEG 2000).','Each block is coded separately, so under heavy compression square blocks appear. A wavelet works on the whole picture, has no block borders and the error is soft, blurred. That is why digital cinema chose it (JPEG 2000).')],
 [tx('PSNR v dB','PSNR in dB'),tx('Číselná míra podobnosti s originálem. Vyšší je lepší, ale oko soudí i podle tvaru chyby, ne jen podle čísla.','A numerical measure of similarity to the original. Higher is better, but the eye also judges by the shape of the error, not only by the number.')]]),
H(tx('Kodeky se vyvíjely po generacích. Každá další dosáhla stejného dojmu s menším tokem, za cenu většího výpočetního výkonu.','Codecs evolved in generations. Each one achieved the same look at a lower rate, at the cost of more computing power.'),[
 [tx('Televizní kodeky','Television codecs'),tx('MPEG-2 (DVD, starší vysílání), H.264/AVC (Blu-ray, HD, web), H.265/HEVC (DVB-T2, 4K), AV1 (streaming bez licenčních poplatků) a H.266/VVC. Každá generace zhruba půlí tok proti předchozí.','MPEG-2 (DVD, older broadcast), H.264/AVC (Blu-ray, HD, web), H.265/HEVC (DVB-T2, 4K), AV1 (streaming without licence fees) and H.266/VVC. Each generation roughly halves the rate of the previous one.')],
 [tx('Kinematografické a střihové kodeky','Cinema and editing codecs'),tx('ProRes a JPEG 2000 ukládají každý snímek zvlášť. Tok je mnohem vyšší, ale střih na snímek přesně a přístup k libovolnému snímku jsou snadné a kvalita zůstává vysoká i po opakovaných úpravách.','ProRes and JPEG 2000 store every frame alone. The rate is much higher, but frame-accurate editing and access to any frame are easy and quality stays high after repeated edits.')],
 [tx('Proč se nepoužije vždy nejnovější','Why not always the newest'),tx('Novější kodek vyžaduje výkonnější dekodér v přijímači, často patentové licence a mnohem delší kódování. Starší formát proto přežívá, dokud ho umí každé zařízení.','A newer codec needs a more powerful decoder in the receiver, often patent licences and much longer encoding. An older format therefore survives while every device can play it.')]]),
H(tx('Všechno předchozí se nakonec měří na kapacitě: kolik programů se vejde do kanálu a jak velký bude film.','Everything above is finally measured by capacity: how many programmes fit into a channel and how big a film will be.'),[
 [tx('Kapacita kanálu','Channel capacity'),tx('Pozemní vysílání DVB-T2 i družicové DVB-S2 mají v jednom multiplexu pevný tok. Počet programů je kapacita dělená tokem jednoho programu, proto účinnější kodek znamená víc programů.','Terrestrial DVB-T2 and satellite DVB-S2 have a fixed rate in one multiplex. The number of programmes is the capacity divided by the rate of one programme, so a more efficient codec means more programmes.')],
 [tx('Velikost filmu','Film size'),tx('Velikost = tok × délka / 8 (bajty). Dvě hodiny při 35 Mb/s dají přibližně 31 GB, což se nevejde na jednovrstvý Blu-ray, ale vejde na dvouvrstvý.','Size = rate × length / 8 (bytes). Two hours at 35 Mb/s give about 31 GB, which does not fit a single-layer Blu-ray but fits a dual-layer one.')],
 [tx('Digitální kino (DCP)','Digital cinema (DCP)'),tx('Balíček DCP má strop 250 Mb/s a je šifrovaný. Proti nestlačenému 4K to je zhruba třicetinásobné zmenšení, přitom každý snímek zůstává samostatný.','A DCP has a cap of 250 Mb/s and is encrypted. Compared with uncompressed 4K that is roughly a thirtyfold reduction, with every frame still standalone.')],
 [tx('Pozor na jednotky','Mind the units'),tx('Tok se udává v bitech (Mb/s), velikost souboru v bajtech (GB). Bajt má 8 bitů a výrobci médií počítají 1 GB jako miliardu bajtů.','Rate is given in bits (Mb/s), file size in bytes (GB). A byte has 8 bits and media makers count 1 GB as a billion bytes.')]])
];
TABS.forEach((t,i)=>{const old=t.help;t.help=()=>INTRO[i]()+(old?`<h4 class="hs">${tx('Jak aplikaci číst a ovládat','How to read and use the app')}</h4>`+old():'')});
})();
