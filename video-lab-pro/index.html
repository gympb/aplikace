/* ---------- 1 Cesta obrazu ---------- */
{t:P('Cesta obrazu','The path of the picture'),
 a:P(`Obraz projde od kamery k divákovi dlouhou cestou: snímač, studio, střih, kodér, přenos, dekodér a displej. Na většině cesty je obraz <b>nekomprimovaný</b> a obrovský, jen krátký úsek uprostřed je <b>komprimovaný</b>. Tato kapitola ukazuje celou cestu najednou a u každé etapy tok, tedy kolik <b>bitů za sekundu</b> obrazem protéká.`,
     `The picture travels a long way from camera to viewer: sensor, studio, edit, encoder, transmission, decoder and display. For most of the path it is <b>uncompressed</b> and enormous; only a short stretch in the middle is <b>compressed</b>. This chapter shows the whole path at once and, for every stage, the rate, that is how many <b>bits per second</b> flow through it.`),
 b:P(`<b>Kodér</b> (encoder) obraz stlačí a <b>dekodér</b> (decoder) ho z malého toku znovu složí. Dohodnutému postupu, který oba znají, se říká <b>kodek</b> (z „coder + decoder“). Televize a kino řeší stejný problém, ale jinak: televize musí vejít do vysílacího kanálu, a proto stlačuje velmi silně a přenechává výpočet přijímači. Kino má vlastní disk, velké plátno a vyšší nároky na kvalitu, takže drží mnohem vyšší tok a každý snímek ukládá zvlášť.`,
     `The <b>encoder</b> compresses the picture and the <b>decoder</b> rebuilds it from the small stream. The agreed procedure both know is called a <b>codec</b> (from “coder + decoder”). Television and cinema solve the same problem differently: television has to fit into a broadcast channel, so it compresses very heavily and leaves the computing to the receiver. Cinema has its own drive, a big screen and higher quality demands, so it keeps a much higher rate and stores every frame alone.`),
 r:P(`Každý pruh je jedna etapa cesty. Šedý pruh je obraz bez komprese, modrý je stlačený. Délka pruhu je tok v bitech za sekundu na <b>logaritmické ose</b>, takže každý dílek je desetkrát víc než ten před ním. Čísla vpravo (÷ a ×) říkají, kolikrát se tok mezi sousedními etapami zmenšil nebo zvětšil. Klepnutím na pruh nebo na tlačítko etapy zobrazíte její popis.`,
     `Each bar is one stage of the path. A grey bar is an uncompressed picture, a blue one is compressed. Bar length is the rate in bits per second on a <b>logarithmic axis</b>, so every step is ten times more than the previous one. The numbers on the right (÷ and ×) say how many times the rate shrank or grew between neighbouring stages. Tap a bar or a stage button to see its description.`),
 e:[
  {h:P('Proč je nestlačený obraz tak obrovský','Why an uncompressed picture is so huge'),
   p:[P(`Full HD má přes dva miliony pixelů a každý nese tři čísla (červenou, zelenou, modrou). Při 25 snímcích za sekundu a 8 bitech na číslo je to asi <b>1,2 Gb/s</b>, tedy zhruba 150 MB každou sekundu. Kinový master ve 4K, 24 snímků za sekundu, 12 bitů a plné barvy dává přibližně <b>7,6 Gb/s</b>. Žádný vysílač, internetová linka ani disk takový tok neunese. Komprese proto není luxus, ale podmínka, aby obraz vůbec doputoval k divákovi.`,
        `Full HD has over two million pixels and each carries three numbers (red, green, blue). At 25 frames per second and 8 bits per number that is about <b>1.2 Gb/s</b>, roughly 150 MB every second. A cinema master in 4K, 24 frames per second, 12 bits and full colour comes to about <b>7.6 Gb/s</b>. No transmitter, internet line or disc can carry that. Compression is therefore not a luxury but the condition for the picture to reach the viewer at all.`)]},
  {h:P('Co všechno se z obrazu dá vyhodit','What can be thrown out of a picture'),
   p:[P(`Kodeky využívají čtyři druhy nadbytečnosti. <b>Prostorová</b>: sousední pixely jsou si podobné (obloha, zeď), takže stačí popsat změnu místo každé hodnoty. <b>Časová</b>: sousední snímky jsou si podobné, takže stačí popsat, co se změnilo. <b>Vjemová</b>: oko nevidí jemné barevné detaily ani slabé jasové změny v hustém obraze, takže je lze ztratit. <b>Statistická</b>: časté hodnoty dostanou krátký zápis a vzácné delší (podobně jako v morseovce). První tři druhy zahazují informaci, čtvrtý ne.`,
        `Codecs exploit four kinds of redundancy. <b>Spatial</b>: neighbouring pixels are alike (sky, wall), so it is enough to describe change instead of every value. <b>Temporal</b>: neighbouring frames are alike, so it is enough to describe what changed. <b>Perceptual</b>: the eye does not see fine colour detail or faint luminance changes in a busy picture, so they can be lost. <b>Statistical</b>: frequent values get a short code and rare ones a longer one (as in Morse code). The first three discard information, the fourth does not.`),
        P(`Kapitoly 3 až 5 tyto triky ukazují jednotlivě: podvzorkování barev (vjemová), snímky I, P a B (časová), DCT a vlnka s kvantováním (prostorová a vjemová).`,
          `Chapters 3 to 5 show these tricks one by one: chroma subsampling (perceptual), I, P and B frames (temporal), DCT and wavelet with quantization (spatial and perceptual).`)]},
  {h:P('Televize a kino, dvě různé cesty','Television and cinema, two different paths'),
   p:[P(`<b>Televize.</b> Ve studiu a mezi přístroji běží obraz nekomprimovaně po kabelech SDI (HD-SDI má asi 1,5 Gb/s, pro 4K se používají 12G-SDI nebo síť IP). Pro střih a výměnu se stlačí „po snímcích“ (ProRes, XDCAM, zhruba 5 : 1 se skoro nepoznatelnou ztrátou). Teprve kodér vysílače stlačí obraz na jednotky až desítky Mb/s. Tam, v kodéru a v kanálu, se rozhoduje o kvalitě, kterou uvidí divák.`,
        `<b>Television.</b> In the studio and between devices the picture runs uncompressed over SDI cables (HD-SDI is about 1.5 Gb/s, 4K uses 12G-SDI or an IP network). For editing and exchange it is compressed “frame by frame” (ProRes, XDCAM, roughly 5:1 with a barely visible loss). Only the broadcast encoder compresses the picture down to a few or tens of Mb/s. That is where the quality the viewer sees is decided, in the encoder and in the channel.`),
        P(`<b>Kino.</b> Digitální kino (standard DCI) má vlastní barevný prostor XYZ, 12 bitů na kanál a plné barvy v každém pixelu. Film se stlačí kodekem JPEG 2000 nejvýše na <b>250 Mb/s</b>, což je při 4K zhruba třicetinásobné zmenšení. Každý snímek je samostatný, soubor (DCP) se šifruje a otevře ho jen klíč KDM pro konkrétní kino a čas. Kinoserver snímky dekóduje v reálném čase a projektor dostane znovu plná 12bitová data.`,
          `<b>Cinema.</b> Digital cinema (the DCI standard) has its own colour space XYZ, 12 bits per channel and full colour in every pixel. The film is compressed with JPEG 2000 to at most <b>250 Mb/s</b>, which for 4K is roughly a thirtyfold reduction. Every frame is standalone, the file (DCP) is encrypted and opened only by a KDM key for a specific cinema and time. The cinema server decodes the frames in real time and the projector again receives full 12-bit data.`)]},
  {h:P('Dekódování obraz „nevrací“, jen ho skládá znovu','Decoding does not “return” the picture, it rebuilds it'),
   p:[P(`Poslední etapy mají zase velký tok, ale není to týž obraz jako na začátku. U ztrátové komprese (televize, DCP) je to obraz, který se původnímu jen blíží. Kodér ví, jak ho dekodér složí, a zahazuje jen to, co oko nepozná. Proto je tok na displeji znovu stejný: panel potřebuje hodnotu každého pixelu každého snímku, ať už se k ní kodek dostal jakkoli.`,
        `The last stages again have a large rate, but it is not the same picture as at the start. With lossy compression (television, DCP) it is a picture that only approaches the original. The encoder knows how the decoder will rebuild it and discards only what the eye will not notice. That is why the rate at the display is large again: the panel needs a value for every pixel of every frame, however the codec arrived at it.`)]}],
 c:[P(`Přepínejte <b>Televize</b> a <b>Kino</b> a porovnejte, kolik etap má obraz nekomprimovaných a kde se tok láme.`,`Switch between <b>Television</b> and <b>Cinema</b> and compare how many stages are uncompressed and where the rate breaks.`),
    P(`Změňte formát (Full HD, 4K UHD, DCI 2K, DCI 4K) a sledujte, jak se mění nejvyšší tok, tok po kompresi a poměr mezi nimi.`,`Change the format (Full HD, 4K UHD, DCI 2K, DCI 4K) and watch how the highest rate, the rate after compression and the ratio between them change.`),
    P(`Projděte etapy jednu po druhé a u každé si přečtěte, proč má právě takový tok. Zjistěte, ve kterém místě se tok zmenší nejvíc.`,`Go through the stages one by one and read why each has the rate it has. Find where the rate shrinks the most.`)],
 d:P(`Obraz je velký téměř celou cestu a jen kratičký úsek mezi kodérem a dekodérem je malý. Komprese je most mezi „velkým“ studiem nebo kinem a „malým“ kanálem k divákovi.`,`The picture is big for almost the whole path and only a short stretch between encoder and decoder is small. Compression is the bridge between the “big” studio or cinema and the “small” channel to the viewer.`)},

/* ---------- 2 Surový tok ---------- */
{t:P('Surový tok','Raw rate'),
 a:P(`<b>Surový tok</b> je počet bitů, které by za sekundu vyprodukoval obraz bez jakékoli komprese. Je to základní číslo, od kterého se odvíjí všechno ostatní: teprve když víme, jak velký obraz je, poznáme, kolikrát ho musí kodek zmenšit, aby se vešel do kanálu nebo na disk.`,
     `The <b>raw rate</b> is the number of bits per second the picture would produce without any compression. It is the base number everything else follows from: only when we know how big the picture is can we tell how many times a codec has to shrink it to fit a channel or a disc.`),
 b:P(`Tok je součin pěti čísel: <b>šířka × výška × snímky za sekundu × bity na vzorek × vzorky na pixel</b>. Například Full HD, 25 snímků za sekundu, 8 bitů a 3 vzorky (R, G, B): 1920 × 1080 × 25 × 8 × 3 ≈ 1,24 Gb/s. Jeden snímek má 1920 × 1080 × 3 = 6,2 MB, jedna minuta asi 9,3 GB a dvouhodinový film kolem 1,1 TB.`,
     `The rate is a product of five numbers: <b>width × height × frames per second × bits per sample × samples per pixel</b>. For example Full HD, 25 frames per second, 8 bits and 3 samples (R, G, B): 1920 × 1080 × 25 × 8 × 3 ≈ 1.24 Gb/s. One frame is 1920 × 1080 × 3 = 6.2 MB, one minute about 9.3 GB and a two-hour film around 1.1 TB.`),
 r:P(`Nahoře je šedý pruh surového obrazu a pod ním modré pruhy kapacit kanálů a médií. Osa je logaritmická, každý dílek je desetkrát víc. Svislá oranžová čárka označuje zvolený kanál a číslo nad ní říká, <b>kolikrát je třeba obraz zmenšit</b>, aby se do kanálu vešel. Čtyři karty vlevo dole ukazují tok, velikost jednoho snímku a jedné minuty.`,
     `At the top is the grey bar of the raw picture and below it the blue bars of channel and medium capacities. The axis is logarithmic, every step is ten times more. The vertical orange line marks the chosen channel and the number above it says <b>how many times the picture must shrink</b> to fit. The cards below show the rate and the size of one frame and one minute.`),
 e:[
  {h:P('Co tok nejvíc zvedá','What raises the rate most'),
   p:[P(`Počet pixelů roste s druhou mocninou rozlišení: 4K má čtyřikrát víc pixelů než Full HD a 8K šestnáctkrát. Snímková frekvence a bitová hloubka tok zvyšují lineárně: 50 místo 25 snímků za sekundu je dvojnásobek, 12 místo 8 bitů je jeden a půl násobek. 4K 50p s 10 bity a podvzorkováním 4:2:0 jsou přibližně <b>6,2 Gb/s</b>, 8K 60p s 12 bity a plnými barvami asi <b>72 Gb/s</b>. Proto se s každým vylepšením obrazu (rozlišení, plynulost, HDR) problém komprese zhoršuje.`,
        `The number of pixels grows with the square of resolution: 4K has four times the pixels of Full HD and 8K sixteen times. Frame rate and bit depth raise the rate linearly: 50 instead of 25 frames per second doubles it, 12 instead of 8 bits makes it one and a half times. 4K 50p with 10 bits and 4:2:0 subsampling is about <b>6.2 Gb/s</b>, 8K 60p with 12 bits and full colour about <b>72 Gb/s</b>. That is why every improvement of the picture (resolution, smoothness, HDR) makes the compression problem worse.`)]},
  {h:P('Snímková frekvence a bity na vzorek','Frame rate and bits per sample'),
   p:[P(`<b>24</b> snímků za sekundu je tradice filmu, <b>25</b> a <b>50</b> používá evropská televize (kvůli síťovému kmitočtu 50 Hz), <b>30</b> a <b>60</b> se používají hlavně v Americe a Japonsku. Rychlý pohyb, například sport, potřebuje 50 nebo 60. <b>8 bitů</b> dává 256 odstínů na kanál, <b>10 bitů</b> 1 024 a <b>12 bitů</b> 4 096. Pro HDR je potřeba aspoň 10 bitů, jinak se v plynulých přechodech objeví pruhy (banding).`,
        `<b>24</b> frames per second is film tradition, <b>25</b> and <b>50</b> are used by European television (because of the 50 Hz mains), <b>30</b> and <b>60</b> mostly in America and Japan. Fast motion, for example sport, needs 50 or 60. <b>8 bits</b> give 256 shades per channel, <b>10 bits</b> 1,024 and <b>12 bits</b> 4,096. HDR needs at least 10 bits, otherwise stripes (banding) appear in smooth gradients.`)]},
  {h:P('Jednotky: bit, bajt a Mb/s','Units: bit, byte and Mb/s'),
   p:[P(`Tok se udává v <b>bitech</b> za sekundu (kb/s, Mb/s, Gb/s), velikost souboru v <b>bajtech</b> (MB, GB, TB). Bajt má 8 bitů, takže tok 8 Mb/s je 1 MB za sekundu. V telekomunikacích i u výrobců médií se předpony počítají desítkově (1 Mb = 1 000 000 bitů, 1 GB = miliarda bajtů). Operační systémy někdy počítají po 1 024, a proto disk „25 GB“ ukazují jako menší číslo. Aplikace počítá všude desítkově.`,
        `Rate is given in <b>bits</b> per second (kb/s, Mb/s, Gb/s), file size in <b>bytes</b> (MB, GB, TB). A byte has 8 bits, so 8 Mb/s is 1 MB per second. In telecommunications and with media makers the prefixes are decimal (1 Mb = 1,000,000 bits, 1 GB = a billion bytes). Operating systems sometimes count in 1,024s, which is why a “25 GB” disc is shown as a smaller number. The app uses decimal everywhere.`)]},
  {h:P('Kanály a média v porovnání','Channels and media compared'),
   p:[P(`Pruhy kapacit jsou <b>orientační</b>: pozemní multiplex DVB-T2 a družicový transpondér DVB-S2 nesou desítky Mb/s, domácí linka pro 4K stream asi 15 Mb/s, video na disku Blu-ray nejvýše asi 40 Mb/s, UHD Blu-ray celkem nejvýše 144 Mb/s a digitální kino 250 Mb/s. Skutečné hodnoty závisejí na nastavení vysílače, chybové ochraně a dalších službách. Pro srovnání řádů jsou ale dostačující: surový obraz je o <b>dva až tři řády</b> větší než kterýkoli z nich.`,
        `The capacity bars are <b>approximate</b>: a DVB-T2 terrestrial multiplex and a DVB-S2 satellite transponder carry tens of Mb/s, a home line for a 4K stream about 15 Mb/s, Blu-ray video at most about 40 Mb/s, UHD Blu-ray 144 Mb/s in total and digital cinema 250 Mb/s. Real values depend on transmitter settings, error protection and other services. For comparing orders of magnitude they are good enough: the raw picture is <b>two to three orders of magnitude</b> bigger than any of them.`)]}],
 c:[P(`Přepněte rozlišení z Full HD na 4K a 8K a sledujte, jak tok roste. Pak změňte snímkovou frekvenci a bitovou hloubku a porovnejte, který parametr tok zvedá nejvíc.`,`Switch the resolution from Full HD to 4K and 8K and watch the rate grow. Then change the frame rate and bit depth and compare which parameter raises the rate the most.`),
    P(`Vyberte kanál (DVB-T2, stream, Blu-ray, DCP) a čtěte číslo nad oranžovou čárkou: kolikrát je třeba obraz zmenšit.`,`Pick a channel (DVB-T2, stream, Blu-ray, DCP) and read the number above the orange line: how many times the picture must shrink.`),
    P(`Přepněte podvzorkování z 4:4:4 na 4:2:0: tok klesne na polovinu, aniž by se změnilo rozlišení nebo počet snímků.`,`Switch the subsampling from 4:4:4 to 4:2:0: the rate drops by half without any change of resolution or frame count.`)],
 d:P(`Surový tok je součin pěti čísel a roste s každým zlepšením obrazu. Ukazuje, jak daleko je obraz od kanálu, a tím i to, jak moc musí komprese zasáhnout.`,`The raw rate is a product of five numbers and grows with every improvement of the picture. It shows how far the picture is from the channel and therefore how much the compression has to do.`)},

/* ---------- 3 Barvy ---------- */
{t:P('Barvy a podvzorkování','Colour and subsampling'),
 a:P(`Oko vnímá ostrost hlavně z <b>jasu</b>, barvu vidí hrubší. Kodeky toho využívají: obraz rozdělí na jas a barvu, jas nechají v plném rozlišení a barvu uloží jen pro skupiny pixelů. Tomu se říká <b>podvzorkování barev</b> (chroma subsampling). Je to nejlevnější úspora, jakou komprese nabízí: polovina dat za cenu, kterou u fotografie a filmu prakticky nepoznáte.`,
     `The eye gets sharpness mainly from <b>luma</b> and sees colour more coarsely. Codecs exploit this: they split the picture into luma and colour, keep luma at full resolution and store colour only for groups of pixels. This is called <b>chroma subsampling</b>. It is the cheapest saving compression offers: half of the data at a cost you hardly notice in photographs and film.`),
 b:P(`Místo složek R, G, B se obraz zapíše jako <b>jas Y</b> a dva <b>barevné rozdíly Cb a Cr</b> (modrá minus jas, červená minus jas). Jas nese detail, rozdíly nesou odstín. Zápis <b>4:4:4</b> znamená barvu v každém pixelu (3 vzorky na pixel), <b>4:2:2</b> sdílí barvu po dvojicích vodorovně (2 vzorky), <b>4:2:0</b> po čtveřicích 2 × 2 (1,5 vzorku). Ušetří se tedy 0 %, 33 % a 50 % dat.`,
     `Instead of R, G, B components the picture is written as <b>luma Y</b> and two <b>colour differences Cb and Cr</b> (blue minus luma, red minus luma). Luma carries detail, the differences carry hue. <b>4:4:4</b> means colour in every pixel (3 samples per pixel), <b>4:2:2</b> shares colour in horizontal pairs (2 samples), <b>4:2:0</b> in 2 × 2 groups (1.5 samples). That saves 0 %, 33 % and 50 % of the data.`),
 r:P(`Vlevo je originál a vpravo obraz po podvzorkování. Přepínač „Co ukázat“ mění pohled: <b>Výsledek</b> je celý obraz, <b>Jen barva</b> ukazuje jen barevné složky (jas je zešedlý) a <b>Chyba ×4</b> ukazuje rozdíl proti originálu zesílený čtyřikrát (šedá = bez chyby). Nejlépe se chyba pozná na červeném kruhu, na pruzích, na písmenech a na růžové šikmé čáře. Schéma vpravo ukazuje, co se uloží z bloku 4 × 4 pixely: bílé body jsou vzorky jasu, oranžové kroužky vzorky barvy.`,
     `On the left is the original and on the right the picture after subsampling. The “What to show” switch changes the view: <b>Result</b> is the whole picture, <b>Colour only</b> shows only the colour components (luma is greyed) and <b>Error ×4</b> shows the difference from the original magnified four times (grey = no error). The error is best seen on the red circle, the stripes, the letters and the pink diagonal line. The diagram on the right shows what is stored from a block of 4 × 4 pixels: white dots are luma samples, orange circles are colour samples.`),
 e:[
  {h:P('Jak se z RGB stane jas a barevné rozdíly','How RGB becomes luma and colour differences'),
   p:[P(`Jas se spočte jako vážený součet: pro HD podle normy <b>BT.709</b> je Y = 0,2126 R + 0,7152 G + 0,0722 B. Zelená má největší váhu, protože ji oko vnímá jako nejjasnější, modrá nejmenší. Barevné rozdíly jsou Cb = (B − Y) / 1,8556 a Cr = (R − Y) / 1,5748; dělení je jen přeškálování, aby se vešly do stejného rozsahu. Šedá nebo bílá má rozdíly nulové, takže i černobílý obraz „nemá barvu“ a podvzorkování mu nemůže ublížit. Pro SD se používá starší norma BT.601 s jinými koeficienty a pro 4K HDR BT.2020. Při špatném výběru se barvy mírně posunou.`,
        `Luma is computed as a weighted sum: for HD, according to the <b>BT.709</b> standard, Y = 0.2126 R + 0.7152 G + 0.0722 B. Green carries the greatest weight because the eye sees it as brightest, blue the least. The colour differences are Cb = (B − Y) / 1.8556 and Cr = (R − Y) / 1.5748; the division only rescales them to fit the same range. Grey or white has zero differences, so a black-and-white picture “has no colour” and subsampling cannot hurt it. SD uses the older BT.601 with different coefficients and 4K HDR uses BT.2020. With a wrong choice colours shift slightly.`)]},
  {h:P('Co znamenají čísla 4:2:0','What the numbers 4:2:0 mean'),
   p:[P(`Zápis popisuje blok široký <b>4 pixely a vysoký 2 řádky</b>. První číslo (4) je šířka bloku. Druhé je počet vzorků barvy v prvním řádku, třetí počet <i>nových</i> vzorků ve druhém řádku. Ve 4:4:4 jsou barevné vzorky 4 a 4, ve 4:2:2 jsou 2 a 2 (barva je v každém druhém sloupci, ale v obou řádcích), ve 4:2:0 jsou 2 a 0 (druhý řádek barvu přebírá z prvního). Výsledek je pro 4:2:0 jeden vzorek barvy na čtverec 2 × 2 pixely, tedy čtvrtinová barevná rozlišení vodorovně i svisle.`,
        `The notation describes a block <b>4 pixels wide and 2 rows high</b>. The first number (4) is the block width. The second is the number of colour samples in the first row, the third the number of <i>new</i> samples in the second row. In 4:4:4 the colour samples are 4 and 4, in 4:2:2 they are 2 and 2 (colour in every second column, but in both rows), in 4:2:0 they are 2 and 0 (the second row takes colour from the first). The result for 4:2:0 is one colour sample per 2 × 2 pixel square, that is a quarter of the colour resolution (half horizontally and half vertically).`),
        P(`Barevné složky Cb a Cr se pak komprimují stejně jako jas (DCT, kvantování), jen jsou menší. Podvzorkování se provádí před touto kompresí a není to náhrada za ni, ale další, nezávislý krok.`,
          `The Cb and Cr components are then compressed like luma (DCT, quantization), they are just smaller. Subsampling is done before this compression and is not a substitute for it but an additional, independent step.`)]},
  {h:P('Kde podvzorkování vadí a kde ne','Where subsampling hurts and where it does not'),
   p:[P(`V přírodním obraze (obloha, tváře, listí) jsou barvy plynulé a rozdíl nepoznáte. Chyba se projeví na <b>ostrých barevných hranách</b>: červený text na modrém pozadí, tenké barevné čáry, titulky, grafika. Barva se kolem hrany „rozlije“ přes celý čtverec a vznikají lemy. Jas zůstává ostrý, proto je chyba nenápadná. Nepříjemné je to u počítače připojeného k televizi v režimu 4:2:0: barevný text je rozmazaný. Při střihu a klíčování (zelené plátno) se hrany barev opakovaně zpracovávají, a proto studia drží 4:2:2 nebo 4:4:4 a podvzorkují až naposledy, před vysíláním.`,
        `In a natural picture (sky, faces, leaves) colours are smooth and you cannot see the difference. The error shows on <b>sharp colour edges</b>: red text on a blue background, thin coloured lines, subtitles, graphics. Colour “spills” over the whole square around an edge and fringes appear. Luma stays sharp, which is why the error is inconspicuous. It is annoying when a computer is connected to a television in 4:2:0 mode: coloured text is blurred. In editing and keying (green screen) colour edges are processed repeatedly, which is why studios keep 4:2:2 or 4:4:4 and subsample only at the very end, before broadcast.`)]},
  {h:P('Kde se který formát používá','Where each format is used'),
   p:[P(`<b>4:2:0</b>: televizní vysílání, streaming, DVD, Blu-ray, UHD Blu-ray, YouTube (a také JPEG a MPEG-2). <b>4:2:2</b>: studiová technika (SDI), ProRes 422, XDCAM, profesionální kamery. <b>4:4:4</b>: střih a grafika, počítačová obrazovka, digitální kino (DCP je ve 4:4:4 a ve 12 bitech). Karta „Chyba barvy“ dole ukazuje střední absolutní odchylku všech tří kanálů RGB na stupnici 0 až 255 na testovacím obrázku.`,
        `<b>4:2:0</b>: television broadcast, streaming, DVD, Blu-ray, UHD Blu-ray, YouTube (and JPEG and MPEG-2 too). <b>4:2:2</b>: studio equipment (SDI), ProRes 422, XDCAM, professional cameras. <b>4:4:4</b>: editing and graphics, computer screens, digital cinema (DCP is 4:4:4 and 12 bit). The “Colour error” card below shows the mean absolute deviation of all three RGB channels on a 0 to 255 scale on the test picture.`)]}],
 l:{cs:`Podvzorkování barev je do detailu rozebráno v aplikaci JPEG Lab Pro (otevře se na nové kartě):`,en:`Chroma subsampling is covered in detail in the JPEG Lab Pro app (opens in a new tab):`,links:[[2,'Barvy: podvzorkování','Colour: subsampling']]},
 c:[P(`Přepínejte 4:4:4, 4:2:2 a 4:2:0 a sledujte, jak klesá počet vzorků na pixel a jak roste chyba barvy. Všimněte si, že úspora je 0 %, 33 % a 50 %.`,`Switch between 4:4:4, 4:2:2 and 4:2:0 and watch the samples per pixel fall and the colour error rise. Notice that the saving is 0 %, 33 % and 50 %.`),
    P(`Zvolte <b>Jen barva</b>: uvidíte, jak hrubá je barevná složka, kterou kodek uloží. Pak přepněte na <b>Chyba ×4</b> a hledejte, kde chyba sedí. Nejvíc na ostrých barevných hranách.`,`Choose <b>Colour only</b>: you will see how coarse the colour component stored by the codec is. Then switch to <b>Error ×4</b> and look for where the error sits. Mostly on sharp colour edges.`),
    P(`Sledujte schéma 4 × 4 pixely a počet hodnot na pixel. Ve 4:2:0 je to 24 hodnot na 16 pixelů, tedy 1,5.`,`Watch the 4 × 4 pixel diagram and the values per pixel. In 4:2:0 it is 24 values per 16 pixels, that is 1.5.`)],
 d:P(`Podvzorkování je nejlevnější úspora: polovina dat za cenu, kterou u přirozeného obrazu nepoznáte, u ostrých barevných hran ano.`,`Subsampling is the cheapest saving: half of the data at a cost you cannot see in natural pictures but can on sharp colour edges.`)},

/* ---------- 4 Snímky I P B ---------- */
{t:P('Čas: snímky I, P a B','Time: I, P and B frames'),
 a:P(`Po sobě jdoucí snímky jsou si velmi podobné: při 25 snímcích za sekundu se mezi dvěma z nich změní jen malá část obrazu. Kodek proto nemusí ukládat každý snímek celý, stačí zapsat <b>změny</b>. Tak se využívá <b>časová nadbytečnost</b>, největší zdroj úspor ve videu.`,
     `Consecutive frames are very similar: at 25 frames per second only a small part of the picture changes between two of them. A codec therefore does not have to store every frame in full, it is enough to record the <b>changes</b>. That exploits <b>temporal redundancy</b>, the largest source of savings in video.`),
 b:P(`<b>Snímek I</b> (intra) je celý obraz zakódovaný sám o sobě, jako fotografie. <b>Snímek P</b> (predicted) popisuje změny proti předchozímu snímku. <b>Snímek B</b> (bidirectional) se opírá o předchozí i následující snímek a je nejmenší. Skupina snímků od jednoho I po další se nazývá <b>GOP</b> (group of pictures). Delší GOP šetří data, ale po přepnutí kanálu se čeká na další snímek I.`,
     `An <b>I frame</b> (intra) is a whole picture coded by itself, like a photograph. A <b>P frame</b> (predicted) describes changes from the previous frame. A <b>B frame</b> (bidirectional) relies on both the previous and the next frame and is the smallest. A group of frames from one I to the next is called a <b>GOP</b> (group of pictures). A longer GOP saves data, but after a channel change you wait for the next I frame.`),
 r:P(`Nahoře je každý snímek skupiny jako sloupec: výška je velikost snímku (I = 100 %), barva říká typ (oranžová I, modrá P, zelená B). Oblouky pod sloupci ukazují závislosti: P se opírá o předchozí I nebo P, B o předchozí i následující. Přerušovaná čára je průměrná velikost snímku a nápis vpravo nahoře říká, jak dlouho se nejhůř čeká na další snímek I. Dole je ukázka pohybu: snímek <i>n</i>, snímek <i>n + 1</i> a <b>zbytek</b>, tedy to, co se musí uložit navíc.`,
     `At the top every frame of the group is a column: height is the frame size (I = 100 %), colour tells the type (orange I, blue P, green B). Arcs under the columns show dependencies: P relies on the previous I or P, B on the previous and the next. The dashed line is the average frame size and the text at the top right says how long the wait for the next I frame is at worst. Below is a motion demo: frame <i>n</i>, frame <i>n + 1</i> and the <b>residual</b>, that is what must be stored in addition.`),
 e:[
  {h:P('Predikce pohybu: nehledat změnu, ale pohyb','Motion compensation: look for motion, not change'),
   p:[P(`Pohybuje-li se předmět, změní se při prostém porovnání snímků mnoho pixelů, ačkoli jde o týž předmět o kousek vedle. Kodér proto obraz rozdělí na bloky a pro každý blok <b>hledá v předchozím snímku podobné místo</b>. Uloží jen <b>vektor posunu</b> (o kolik pixelů a kterým směrem) a <b>zbytek</b> (rozdíl mezi předpovědí a skutečností). Moderní kodeky hledají posun s přesností na čtvrtinu pixelu. Zbytek bývá skoro nulový, a tedy se dá uložit malým počtem bitů.`,
        `When an object moves, a plain comparison of frames shows many pixels changed, although it is the same object a little further along. The encoder therefore splits the picture into blocks and, for each block, <b>looks for a similar place in the previous frame</b>. It stores only the <b>motion vector</b> (how many pixels and in which direction) and the <b>residual</b> (the difference between prediction and reality). Modern codecs search the shift with quarter-pixel precision. The residual is usually nearly zero and so can be stored in few bits.`),
        P(`Ukázka dole to ukazuje na posouvajícím se předmětu. Bez predikce je zbytek tam, kde se předmět pohnul. S predikcí zbývá jen pruh odkrytého pozadí, který v předchozím snímku vidět nebyl. Údaj v procentech říká, kolik pixelů se musí zvlášť opravit.`,
          `The demo below shows it on a moving object. Without prediction the residual is wherever the object moved. With prediction only a strip of uncovered background remains, which was not visible in the previous frame. The percentage says how many pixels must be corrected separately.`)]},
  {h:P('Pořadí snímků a proč B snímky vyžadují čekání','Frame order and why B frames need waiting'),
   p:[P(`Snímek B se opírá i o <i>budoucí</i> snímek, a ten tedy musí dekodér dostat dřív. Snímky se proto neposílají v pořadí zobrazení, ale v pořadí dekódování: místo I B B P se pošle I P B B a dekodér je před zobrazením přeskládá. To zvyšuje zpoždění (latenci) a vyžaduje paměť. Proto se pro živé přenosy s nízkým zpožděním (videokonference, hry) snímky B omezují nebo vypínají, kdežto pro film a televizi se používají, protože dávají nejlepší účinnost.`,
        `A B frame relies on a <i>future</i> frame too, so the decoder must receive that first. Frames are therefore not sent in display order but in decoding order: instead of I B B P, I P B B is sent and the decoder reorders them before display. This increases the delay (latency) and requires memory. That is why B frames are limited or disabled for low-latency live transmission (video calls, games), whereas film and television use them because they give the best efficiency.`)]},
  {h:P('Délka GOP je kompromis','GOP length is a compromise'),
   p:[P(`<b>Dlouhý GOP</b> má málo snímků I (ty jsou největší), takže je úsporný. Nevýhodou je, že na kanál se vstoupí jen na snímku I: televize po přepnutí čeká až na další I, proto bývá GOP v televizi dlouhý zhruba půl až dvě sekundy. Také když se v přenosu ztratí část dat, chyba se šíří přes snímky P a B až do dalšího snímku I. <b>Krátký GOP</b> je robustnější a rychleji se přepíná, ale je dražší. Také se v něm dá snáz přetáčet a střihat: přehrávač skočí na nejbližší snímek I před zvoleným místem.`,
        `A <b>long GOP</b> has few I frames (the largest ones), so it is economical. The drawback is that a channel can only be entered at an I frame: after a channel change a television waits for the next I, which is why a GOP in television is roughly half a second to two seconds long. Also, when part of the data is lost in transmission, the error spreads over P and B frames until the next I frame. A <b>short GOP</b> is more robust and switches faster but costs more. It is also easier to seek and cut in: a player jumps to the nearest I frame before the chosen position.`),
        P(`<b>GOP o délce 1</b> jsou samé snímky I. Žádná predikce, žádné závislosti, střih na snímek přesně a okamžitý přístup k libovolnému snímku. Tok je ale mnohem vyšší. Tak pracuje digitální kino (JPEG 2000) i střihové formáty (ProRes).`,
          `A <b>GOP of length 1</b> is all I frames. No prediction, no dependencies, frame-accurate cutting and instant access to any frame. The rate is, however, much higher. That is how digital cinema (JPEG 2000) and editing formats (ProRes) work.`)]},
  {h:P('Jak model počítá velikost snímků','How the model computes frame sizes'),
   p:[P(`Aplikace používá zjednodušený model: snímek I má velikost 100 %, snímek P a B jen zlomek podle množství pohybu (stojící obraz: P asi 7 %, B asi 3,5 %; střední pohyb: 22 % a 10 %; rychlý pohyb: 48 % a 28 %). Skutečné poměry závisejí na obraze a kodéru, ale směr je správný: čím víc pohybu, tím větší jsou snímky P a B a tím menší je úspora.`,
        `The app uses a simplified model: an I frame is 100 %, P and B frames only a fraction depending on the amount of motion (still picture: P about 7 %, B about 3.5 %; medium motion: 22 % and 10 %; fast motion: 48 % and 28 %). Real ratios depend on the picture and the encoder, but the direction is right: the more motion, the bigger the P and B frames and the smaller the saving.`)]}],
 c:[P(`Nastavte délku skupiny na <b>jen I</b>, pak na 12 a 50 a sledujte průměrnou velikost snímku, úsporu a čekání při přepnutí kanálu. Zjistěte, kde už čekání přestává být přijatelné.`,`Set the group length to <b>I only</b>, then to 12 and 50 and watch the average frame size, the saving and the channel change wait. Find where the wait stops being acceptable.`),
    P(`Přidejte dva snímky B mezi P a všimněte si oblouků: B se opírá o dva snímky. Zkuste to při různém pohybu v obraze.`,`Add two B frames between P frames and notice the arcs: a B frame relies on two frames. Try it with different motion in the picture.`),
    P(`Zvyšte pohyb na Rychlý a přepněte <b>Predikci pohybu</b> z Vypnuté na Zapnutou: zbytek dole se dramaticky zmenší, ale úplně nezmizí.`,`Raise the motion to Fast and switch <b>Motion compensation</b> from Off to On: the residual below shrinks dramatically but does not vanish completely.`)],
 d:P(`Snímek I je jediný, který stojí sám. Ostatní se opírají o své sousedy, a proto je video úsporné a zároveň závislé na tom, že snímky dorazí v pořádku.`,`The I frame is the only one that stands alone. The others rely on their neighbours, which is why video is economical and at the same time dependent on frames arriving intact.`)},

/* ---------- 5 DCT a vlnka ---------- */
{t:P('DCT a vlnka','DCT and wavelet'),
 a:P(`Hlavní trik prostorové komprese: obraz se z pixelů převede na <b>koeficienty</b>, kde se důležité od nedůležitého oddělí snadněji. Nedůležité se zahodí a zbytek se zapíše úsporně. Existují dvě hlavní rodiny: <b>DCT</b> po blocích (televize, JPEG, H.264, HEVC) a <b>vlnka</b> pro celý obraz (digitální kino, JPEG 2000).`,
     `The main trick of spatial compression: the picture is converted from pixels to <b>coefficients</b>, where the important is easier to separate from the unimportant. The unimportant is discarded and the rest stored compactly. There are two main families: <b>DCT</b> in blocks (television, JPEG, H.264, HEVC) and <b>wavelet</b> for the whole picture (digital cinema, JPEG 2000).`),
 b:P(`<b>DCT</b> (diskrétní kosinová transformace) rozloží blok 8 × 8 pixelů na 64 koeficientů: první je průměr bloku, další popisují stále jemnější vzory. Hladký obraz má většinu energie v několika prvních. <b>Kvantování</b> koeficienty zaokrouhlí na hrubší stupnici a drobné vynuluje: tady vzniká ztráta a podle ní se řídí kvalita i velikost. <b>Vlnka</b> obraz opakovaně rozdělí na zhrublý náhled a podrobnosti a nepracuje s bloky.`,
     `The <b>DCT</b> (discrete cosine transform) splits a block of 8 × 8 pixels into 64 coefficients: the first is the block average, the others describe progressively finer patterns. A smooth picture has most of its energy in the first few. <b>Quantization</b> rounds the coefficients to a coarser scale and zeroes the small ones: this is where the loss occurs and it governs both quality and size. The <b>wavelet</b> repeatedly splits the picture into a coarse preview and details and does not work with blocks.`),
 r:P(`Všechny tři obrazy v horním řádku mají v modelu <b>stejnou velikost dat</b>: originál, výsledek blokové DCT a výsledek vlnky. Pod nimi je chyba proti originálu zesílená pětkrát (šedá = bez chyby, černá a bílá = odchylka). Karty dole ukazují kvalitu v dB (PSNR) pro obě metody a rozpočet dat v bitech na pixel. Posuvníkem nebo tlačítky 8 : 1 až 64 : 1 volíte míru komprese.`,
     `All three pictures in the top row have the <b>same amount of data</b> in the model: the original, the block DCT result and the wavelet result. Below them is the error against the original magnified five times (grey = no error, black and white = deviation). The cards below show the quality in dB (PSNR) for both methods and the data budget in bits per pixel. The slider or the 8:1 to 64:1 buttons set the compression ratio.`),
 e:[
  {h:P('DCT: proč kosinové vzory','DCT: why cosine patterns'),
   p:[P(`Blok 8 × 8 se zapíše jako součet 64 pevných vzorů (různě hustých vodorovných a svislých „vln“) s různou vahou. Nejjednodušší vzor je jednolitá plocha (koeficient DC, průměr), dál přibývá kmitání. Přirozený obraz je hladký, takže jemné vzory mají malé váhy a po zaokrouhlení vyjdou nulové. DCT sama nic nezničí: s 64 koeficienty vrátí blok přesně. Úspora vzniká až kvantováním a následným zápisem, kde nuly zaberou téměř nic. H.264 a HEVC používají celočíselné aproximace DCT v různých velikostech (4 × 4 až 32 × 32), JPEG a MPEG-2 klasickou 8 × 8.`,
        `A block of 8 × 8 is written as a sum of 64 fixed patterns (horizontal and vertical “waves” of various density) with various weights. The simplest pattern is a flat surface (the DC coefficient, the average), then oscillation increases. A natural picture is smooth, so the fine patterns have small weights and become zero after rounding. The DCT itself destroys nothing: with 64 coefficients it returns the block exactly. The saving comes only from quantization and the following coding, where zeros take almost nothing. H.264 and HEVC use integer approximations of the DCT in various sizes (4 × 4 to 32 × 32), JPEG and MPEG-2 the classic 8 × 8.`),
        P(`Koeficienty se čtou „cik-cak“ od pomalých změn k rychlým, takže nuly tvoří dlouhý souvislý konec, který se zapíše jedním krátkým kódem. Dokončení obstarává entropické kódování (Huffmanovy kódy, aritmetické kódování CABAC), které je bezeztrátové.`,
          `Coefficients are read in a zigzag from slow changes to fast ones, so the zeros form a long continuous tail that is written with one short code. The finishing is done by entropy coding (Huffman codes, CABAC arithmetic coding), which is lossless.`)]},
  {h:P('Kvantování: jediný krok, který ztrácí','Quantization: the only step that loses'),
   p:[P(`Každý koeficient se vydělí kvantovacím krokem a zaokrouhlí na celé číslo. Hrubý krok = méně různých hodnot = méně bitů, ale větší chyba. Kodek volí větší kroky pro vysoké frekvence (jemné vzory), které oko vnímá hůř, a menší pro nízké. Právě tady kodér rozhoduje o kompromisu kvalita proti velikosti. Posuvník míry komprese v aplikaci tuto hrubost zvyšuje: model hledá takovou kvantizaci, která u obou metod vede ke stejnému počtu bitů.`,
        `Each coefficient is divided by a quantization step and rounded to an integer. A coarse step means fewer different values, fewer bits, but a larger error. A codec uses larger steps for high frequencies (fine patterns), which the eye sees less, and smaller ones for low frequencies. This is where the encoder decides the trade-off between quality and size. The compression slider in the app raises this coarseness: the model searches for the quantization that leads to the same number of bits for both methods.`)]},
  {h:P('Proč DCT dělá kostičky a vlnka ne','Why DCT makes blocks and the wavelet does not'),
   p:[P(`Každý blok 8 × 8 se kóduje <b>samostatně</b>. Při silné kvantizaci se průměr sousedních bloků zaokrouhlí různě a na hranici vznikne skok: čtvercové <b>kostičky</b> (blocking). Kolem ostrých hran navíc vznikají jemné prstence (ringing). Novější kodeky (H.264, HEVC) proto za dekódováním používají <b>deblokační filtr</b>, který hranice bloků vyhlazuje. DCT v televizním videu tedy nepracuje samostatně: používá se spolu s filtry, takže skutečná obrazová chyba je menší než v tomto zjednodušeném modelu.`,
        `Every 8 × 8 block is coded <b>on its own</b>. Under strong quantization the average of neighbouring blocks is rounded differently and a jump appears at the border: square <b>blocks</b> (blocking). Fine rings (ringing) also appear around sharp edges. Newer codecs (H.264, HEVC) therefore apply a <b>deblocking filter</b> after decoding, which smooths block borders. DCT in television video therefore does not work alone: it is used together with filters, so the real picture error is smaller than in this simplified model.`)]},
  {h:P('Vlnka: obraz po úrovních','Wavelet: the picture in levels'),
   p:[P(`Vlnková transformace obraz rozdělí na <b>zhrublou verzi</b> (poloviční rozlišení, podpásmo LL) a tři sady <b>podrobností</b> (vodorovné, svislé a úhlopříčné hrany). Zhrublý obraz se rozdělí stejně znovu a znovu, v aplikaci ve třech úrovních. Žádné bloky: transformace pracuje s celým obrazem, a proto kvantování obraz jen měkce rozmazává, hrany zůstávají souvislé a nevznikají kostičky. Chyba je jiná než u DCT, i když hodnota PSNR vychází podobně.`,
        `The wavelet transform splits the picture into a <b>coarse version</b> (half resolution, the LL subband) and three sets of <b>details</b> (horizontal, vertical and diagonal edges). The coarse picture is split the same way again and again, in three levels in the app. There are no blocks: the transform works on the whole picture, so quantization only blurs it softly, edges stay continuous and no blocks appear. The error is different from DCT, even though the PSNR comes out similar.`),
        P(`JPEG 2000 používá vlnku ve dvou variantách: reverzibilní 5/3 (umí bezeztrátový zápis; ta je v aplikaci) a 9/7 pro ztrátovou kompresi. Díky tomu lze ze 4K souboru dekódovat jen nižší úrovně a dostat <b>2K obraz</b> bez celého dekódování. Kinoserver s 2K projektorem tak přehraje 4K DCP.`,
          `JPEG 2000 uses the wavelet in two variants: the reversible 5/3 (it can write losslessly; that one is in the app) and 9/7 for lossy compression. Because of that only the lower levels of a 4K file can be decoded to get a <b>2K picture</b> without full decoding. A cinema server with a 2K projector can therefore play a 4K DCP.`),
        P(`Proč kino volí vlnku: žádné kostičky, každý snímek je nezávislý (střih, šifrování, chyba se nešíří), podpora 12 bitů a změna rozlišení. Cenou je vyšší výpočetní nárok a menší účinnost při nízkých tocích, kterou televize potřebuje, ale kino při 250 Mb/s ne.`,
          `Why cinema chooses the wavelet: no blocks, every frame is independent (editing, encryption, an error does not spread), 12-bit support and scalable resolution. The price is higher computing demand and lower efficiency at low rates, which television needs but cinema at 250 Mb/s does not.`)]},
  {h:P('PSNR a proč číslo nestačí','PSNR and why a number is not enough'),
   p:[P(`<b>PSNR</b> (špičkový poměr signálu k šumu) se počítá ze střední kvadratické chyby: PSNR = 10 · log₁₀(255² / MSE). Čím vyšší dB, tím blíž originálu; každých asi 6 dB znamená poloviční amplitudu chyby. U 8bitových obrazů se zhruba udává: pod 25 dB je chyba zřetelná, 30 až 40 dB je dobrá kvalita. Testovací obrázek v aplikaci je syntetický a obsahuje šum a ostré proužky, proto vychází nižší hodnoty. Číslo ale neříká, jak chyba vypadá: oko hůř snáší pravidelné kostičky než měkké rozmazání při stejném PSNR. Praktické kodéry proto používají i složitější míry (SSIM, VMAF) a nakonec soud lidského oka.`,
        `<b>PSNR</b> (peak signal-to-noise ratio) is computed from the mean squared error: PSNR = 10 · log₁₀(255² / MSE). The higher the dB, the closer to the original; every ~6 dB means half the error amplitude. For 8-bit pictures it is roughly stated: below 25 dB the error is clear, 30 to 40 dB is good quality. The test picture in the app is synthetic and contains noise and sharp stripes, which is why lower values come out. But the number does not say what the error looks like: the eye tolerates regular blocks worse than soft blur at the same PSNR. Practical encoders therefore also use more complex measures (SSIM, VMAF) and finally the judgement of the human eye.`)]}],
 l:{cs:`Blok 8 × 8, koeficienty DCT i kvantovací tabulky si můžete projít po jednotlivých krocích v aplikaci JPEG Lab Pro (otevře se na nové kartě):`,en:`You can walk through the 8 × 8 block, DCT coefficients and quantization tables step by step in the JPEG Lab Pro app (opens in a new tab):`,links:[[3,'DCT','DCT'],[4,'Kvantování','Quantization']]},
 c:[P(`Zvyšujte míru komprese z 8 : 1 na 64 : 1 a sledujte, kdy se v blokové DCT objeví kostičky a jak se mění obraz vlnky. Porovnejte obě chyby v dolním řádku.`,`Raise the compression ratio from 8:1 to 64:1 and watch when blocks appear in the block DCT and how the wavelet picture changes. Compare both errors in the bottom row.`),
    P(`Všimněte si, že údaj v dB vychází u obou metod podobně, ale chyby vypadají úplně jinak: čtverce proti měkkému rozmazání.`,`Notice that the dB value comes out similar for both methods but the errors look completely different: squares against soft blur.`),
    P(`Sledujte, kde se v obraze chyba nejvíc ukazuje: ostré proužky, nápis KINO, hrana a zrnitá plocha dole.`,`Watch where in the picture the error shows most: sharp stripes, the KINO lettering, the edge and the grainy area at the bottom.`)],
 d:P(`Komprese obrazu je převod na koeficienty, zahození drobných a úsporný zápis zbytku. DCT dělá kostičky, vlnka měkké rozmazání. Proto televize volí první a kino druhou.`,`Image compression is conversion to coefficients, discarding the small ones and compact coding of the rest. DCT makes blocks, the wavelet soft blur. That is why television chooses the first and cinema the second.`)},

/* ---------- 6 Kodeky ---------- */
{t:P('Kodeky','Codecs'),
 a:P(`Kodeky se vyvíjely po generacích. Každá další dosáhla stejného obrazového dojmu s menším tokem, za cenu většího výpočetního výkonu. Tato kapitola srovnává <b>tok pro Full HD při stejném vizuálním dojmu</b> u televizních kodeků, které využívají predikci mezi snímky, a u kinových a střihových kodeků, které ukládají každý snímek zvlášť.`,
     `Codecs have evolved in generations. Each new one achieved the same visual impression with a lower rate, at the cost of more computing power. This chapter compares the <b>rate for Full HD at the same visual quality</b> for television codecs, which use prediction between frames, and for cinema and editing codecs, which store every frame alone.`),
 b:P(`<b>MPEG-2</b> (1995): DVD, starší vysílání. <b>H.264 / AVC</b> (2003): Blu-ray, HD vysílání, web, zhruba poloviční tok proti MPEG-2. <b>H.265 / HEVC</b> (2013): DVB-T2, 4K, UHD Blu-ray, HDR. <b>AV1</b> (2018): bez licenčních poplatků, streaming. <b>H.266 / VVC</b> (2020): slibuje další polovinu toku. Mezi kodeky „po snímcích“ patří <b>ProRes</b> (střih a výměna) a <b>JPEG 2000</b> (digitální kino).`,
     `<b>MPEG-2</b> (1995): DVD, older broadcast. <b>H.264 / AVC</b> (2003): Blu-ray, HD broadcast, web, about half the rate of MPEG-2. <b>H.265 / HEVC</b> (2013): DVB-T2, 4K, UHD Blu-ray, HDR. <b>AV1</b> (2018): royalty-free, streaming. <b>H.266 / VVC</b> (2020): promises another half of the rate. “Frame by frame” codecs include <b>ProRes</b> (editing and exchange) and <b>JPEG 2000</b> (digital cinema).`),
 r:P(`Délka pruhu je tok pro Full HD, 25 snímků za sekundu, při stejném vizuálním dojmu, na <b>logaritmické ose</b>. Modré pruhy jsou kodeky s predikcí mezi snímky, šedé kodeky ukládající každý snímek zvlášť. Procenta vpravo ukazují tok proti MPEG-2. Přepínač „Zvýraznit“ zdůrazní televizní nebo kinové a střihové kodeky. Klepnutím na řádek nebo tlačítko kodeku zobrazíte jeho popis.`,
     `Bar length is the rate for Full HD, 25 frames per second, at the same visual quality, on a <b>logarithmic axis</b>. Blue bars are codecs with prediction between frames, grey bars are codecs storing every frame alone. Percentages on the right show the rate against MPEG-2. The “Highlight” switch emphasises television or cinema and editing codecs. Tap a row or a codec button to see its description.`),
 e:[
  {h:P('Co se od MPEG-2 zlepšovalo','What improved from MPEG-2 onwards'),
   p:[P(`Všechny televizní kodeky stojí na stejné kostře (predikce mezi snímky, transformace, kvantování, entropické kódování) a od sebe se liší jemnějšími nástroji. <b>Větší a pružnější bloky</b>: MPEG-2 pracuje s makrobloky 16 × 16, AVC je dělí dál, HEVC používá stromové bloky až 64 × 64 a AV1 i VVC až 128 × 128. Velké plochy se tak kódují jedním popisem, malé detaily dostanou malé bloky. <b>Lepší predikce</b>: víc referenčních snímků, přesnější vektory pohybu, predikce uvnitř snímku z okolních pixelů. <b>Lepší transformace a filtry</b>: celočíselné transformace různých velikostí, deblokační a další filtry. <b>Lepší entropické kódování</b>: aritmetické kódování CABAC místo Huffmanových kódů.`,
        `All television codecs stand on the same frame (prediction between frames, transform, quantization, entropy coding) and differ in finer tools. <b>Larger and more flexible blocks</b>: MPEG-2 works with 16 × 16 macroblocks, AVC divides them further, HEVC uses tree blocks up to 64 × 64 and AV1 and VVC up to 128 × 128. Large areas are coded with a single description, small details get small blocks. <b>Better prediction</b>: more reference frames, more precise motion vectors, prediction inside the frame from surrounding pixels. <b>Better transforms and filters</b>: integer transforms of various sizes, deblocking and other filters. <b>Better entropy coding</b>: CABAC arithmetic coding instead of Huffman codes.`)]},
  {h:P('Čísla v modelu','The numbers in the model'),
   p:[P(`Model počítá tok jako počet pixelů za sekundu × bitů na pixel. Pro Full HD 25p vychází přibližně: MPEG-2 <b>15 Mb/s</b>, AVC <b>7,5</b>, HEVC <b>4,1</b>, AV1 <b>3,3</b> a VVC <b>2,3 Mb/s</b>. Jde o <b>orientační model</b>, nikoli měření. Skutečné toky se liší podle obsahu (klidný dokument nebo akční film), nastavení kodéru a pásma kvality. Poměry mezi generacemi ale odpovídají tomu, co výrobci udávají: každá generace zhruba půlí tok.`,
        `The model computes the rate as pixels per second × bits per pixel. For Full HD 25p it comes out roughly: MPEG-2 <b>15 Mb/s</b>, AVC <b>7.5</b>, HEVC <b>4.1</b>, AV1 <b>3.3</b> and VVC <b>2.3 Mb/s</b>. It is an <b>approximate model</b>, not a measurement. Real rates differ with the content (a quiet documentary or an action film), encoder settings and quality band. The ratios between generations, however, correspond to what the makers state: every generation roughly halves the rate.`)]},
  {h:P('Proč se nepoužívá vždy nejnovější kodek','Why the newest codec is not always used'),
   p:[P(`Nový kodek potřebuje výkonnější <b>dekodér</b>: televize, telefony a přehrávače ho musí umět, nejlépe v hardwaru, jinak se zahřívají a vybíjejí baterii. Kódování bývá mnohonásobně pomalejší než dekódování (AV1 a VVC kódují mnohem déle než AVC), proto se hodí pro obsah, který se kóduje jednou a přehrává mnohokrát, hůř pro živé přenosy. Přidávají se <b>patentové licence</b>: HEVC je zatížen licencemi několika uskupení, což zpomalilo jeho nástup, a z toho důvodu vznikl bezplatný AV1. Starší formát proto přežívá, dokud ho umí každé zařízení: H.264 se dodnes dekóduje všude.`,
        `A new codec needs a more powerful <b>decoder</b>: televisions, phones and players must support it, preferably in hardware, otherwise they get hot and drain the battery. Encoding is often many times slower than decoding (AV1 and VVC encode much longer than AVC), so they suit content that is encoded once and played many times, and live broadcast less well. <b>Patent licences</b> come in: HEVC carries licences from several groups, which slowed its uptake, and that is why the royalty-free AV1 was created. An older format therefore survives while every device can play it: H.264 is still decoded everywhere.`)]},
  {h:P('Kodeky po snímcích: ProRes a JPEG 2000','Frame-by-frame codecs: ProRes and JPEG 2000'),
   p:[P(`<b>ProRes 422 HQ</b> (Apple, 2007) používá DCT a každý snímek zvlášť: pro Full HD je tok kolem <b>180 Mb/s</b>. Žádná predikce znamená, že střih je přesně na snímek, přístup k libovolnému snímku okamžitý a kvalita zůstává vysoká i po opakovaném zpracování. <b>JPEG 2000</b> v digitálním kině je omezen na <b>250 Mb/s</b>. Oba kodeky mají mnohem vyšší tok než televizní, ale tam, kde se nepřenáší vzduchem, to nevadí.`,
        `<b>ProRes 422 HQ</b> (Apple, 2007) uses DCT and every frame alone: for Full HD the rate is around <b>180 Mb/s</b>. No prediction means cutting is frame-accurate, access to any frame is instant and quality stays high after repeated processing. <b>JPEG 2000</b> in digital cinema is capped at <b>250 Mb/s</b>. Both codecs have a much higher rate than television ones, but where the signal is not sent over the air this does not matter.`)]},
  {h:P('Kodek není totéž co formát souboru','A codec is not the same as a file format'),
   p:[P(`Soubor MP4, MKV nebo MXF je <b>kontejner</b>: krabice, která obsahuje video (kódované kodekem), zvuk, titulky a časové značky. Stejné video H.264 může být v MP4, MKV i MOV. U vysílání se video, zvuk a data skládají do <b>transportního proudu</b> (MPEG-TS). Při výběru formátu se proto ptáme na kodek (jak je obraz stlačen) i na kontejner (jak je zabalen).`,
        `An MP4, MKV or MXF file is a <b>container</b>: a box that holds video (coded by a codec), audio, subtitles and timestamps. The same H.264 video can be in MP4, MKV and MOV. In broadcasting, video, audio and data are put together into a <b>transport stream</b> (MPEG-TS). When choosing a format we therefore ask about the codec (how the picture is compressed) and the container (how it is packed).`)]}],
 c:[P(`Klepejte postupně na řádky MPEG-2, AVC, HEVC, AV1 a VVC a sledujte, jak pruh i procenta klesají.`,`Tap the rows MPEG-2, AVC, HEVC, AV1 and VVC one after another and watch the bar and percentages fall.`),
    P(`Přepněte „Zvýraznit“ na <b>Kino a střih</b>: ProRes a JPEG 2000 mají tok o více než řád vyšší než HEVC. Zkuste vysvětlit, proč to kino a střih nevadí.`,`Switch “Highlight” to <b>Cinema and edit</b>: ProRes and JPEG 2000 have a rate more than an order of magnitude above HEVC. Try to explain why that does not matter in cinema and editing.`),
    P(`U každého kodeku si přečtěte popis a použití. Najděte, který kodek se používá pro DVB-T2 v ČR a který pro disk UHD Blu-ray.`,`Read the description and use of each codec. Find which codec is used for DVB-T2 in the Czech Republic and which for UHD Blu-ray discs.`)],
 d:P(`Každá generace kodeku zhruba půlí tok, ale platí se výpočetním výkonem a licencemi. Kino a střih volí vyšší tok výměnou za nezávislost snímků.`,`Each codec generation roughly halves the rate, but the price is computing power and licences. Cinema and editing choose a higher rate in return for independent frames.`)},

/* ---------- 7 Kapacita ---------- */
{t:P('Kapacita a velikost','Capacity and size'),
 a:P(`Všechno předchozí se nakonec měří na <b>kapacitě</b>: kolik programů se vejde do vysílacího kanálu a jak velký bude film na disku. Kapacita je pevná, a proto každý ušetřený bit znamená místo pro další program nebo menší soubor.`,
     `Everything above is finally measured by <b>capacity</b>: how many programmes fit into a broadcast channel and how big a film will be on a disc. Capacity is fixed, so every saved bit means room for another programme or a smaller file.`),
 b:P(`Počet programů je <b>kapacita kanálu děleno tokem jednoho programu</b>. Velikost filmu je <b>tok × délka / 8</b> (bajtů). Obě čísla závisejí na rozlišení a hlavně na kodeku: stejný multiplex DVB-T2 unese několik programů v MPEG-2, ale desítky v moderních kodecích.`,
     `The number of programmes is the <b>channel capacity divided by the rate of one programme</b>. Film size is <b>rate × length / 8</b> (bytes). Both depend on resolution and above all on the codec: the same DVB-T2 multiplex carries a few programmes in MPEG-2 but many more in modern codecs.`),
 r:P(`<b>Horní graf</b>: celý pruh je kapacita zvoleného kanálu a barevné bloky v něm jsou programy. Pro každý kodek vidíte, kolik jich v kanálu je a jaký tok má jeden program. Kodek, který se nevejde ani jednou, je označen „nevejde se“. <b>Dolní graf</b>: velikost filmu je oranžový pruh na logaritmické ose (GB) a svislé čáry označují média. Zelená čára = film se vejde, červená = nevejde. Karty a seznam v panelu uvádějí tok programu, počet programů, velikost filmu a nejmenší vyhovující médium.`,
     `<b>Top chart</b>: the whole bar is the capacity of the chosen channel and the coloured blocks in it are programmes. For every codec you see how many fit in the channel and what the rate of one programme is. A codec that does not fit even once is marked “does not fit”. <b>Bottom chart</b>: film size is the orange bar on a logarithmic axis (GB) and vertical lines mark media. A green line = the film fits, red = it does not. The panel lists the programme rate, the number of programmes, the film size and the smallest suitable medium.`),
 e:[
  {h:P('Kolik programů se vejde do multiplexu','How many programmes fit in a multiplex'),
   p:[P(`V modelu je kapacita DVB-T2 asi 40 Mb/s a Full HD 25p dává: MPEG-2 <b>2 programy</b>, AVC <b>5</b>, HEVC <b>9</b>, AV1 <b>12</b> a VVC <b>17</b>. Nový kodek tedy nevylepší jen kvalitu: umožní vysílat víc programů nebo vyšší rozlišení. Právě proto byl přechod na DVB-T2 a HEVC pro vysílání tak důležitý. V praxi se používá <b>statistický multiplex</b>: programy se nedělí rovným dílem, ale z jedné společné zásoby bitů dostává víc ten, který má právě rychlou scénu, a ten s klidnou scénou si bity „půjčí“. Tím se využije kanál efektivněji, než by naznačovalo prosté dělení.`,
        `In the model the DVB-T2 capacity is about 40 Mb/s and Full HD 25p gives: MPEG-2 <b>2 programmes</b>, AVC <b>5</b>, HEVC <b>9</b>, AV1 <b>12</b> and VVC <b>17</b>. A new codec thus improves not only quality: it allows more programmes or a higher resolution. That is exactly why the switch to DVB-T2 and HEVC was so important for broadcasting. In practice <b>statistical multiplexing</b> is used: programmes are not given equal shares but draw from one common pool of bits, so the one with a fast scene gets more and the one with a quiet scene “lends” bits. That uses the channel more efficiently than simple division would suggest.`)]},
  {h:P('Velikost filmu a médium','Film size and medium'),
   p:[P(`Dvouhodinový film při 15 Mb/s (4K stream) má kolem <b>13,5 GB</b>, při 35 Mb/s (Blu-ray) asi <b>31,5 GB</b>, při 90 Mb/s (UHD Blu-ray) asi <b>81 GB</b> a při 250 Mb/s (DCP) asi <b>225 GB</b>. Jednovrstvý Blu-ray má 25 GB, dvouvrstvý 50 GB a UHD Blu-ray 100 GB (trojvrstvý), DVD jen 4,7 GB. Film s tokem Blu-ray se tedy vejde jen na dvouvrstvý disk. Výrobci disků počítají 1 GB jako miliardu bajtů.`,
        `A two-hour film at 15 Mb/s (4K stream) is around <b>13.5 GB</b>, at 35 Mb/s (Blu-ray) about <b>31.5 GB</b>, at 90 Mb/s (UHD Blu-ray) about <b>81 GB</b> and at 250 Mb/s (DCP) about <b>225 GB</b>. A single-layer Blu-ray holds 25 GB, a dual-layer one 50 GB and a UHD Blu-ray 100 GB (triple-layer), a DVD only 4.7 GB. A film at the Blu-ray rate therefore fits only a dual-layer disc. Disc makers count 1 GB as a billion bytes.`)]},
  {h:P('Streaming a kolísavý tok','Streaming and a varying rate'),
   p:[P(`Streamovací služby nevysílají jeden tok, ale <b>několik verzí téhož filmu</b> v různých rozlišeních a tocích (adaptivní streamování, HLS nebo DASH). Přehrávač podle rychlosti linky průběžně přepíná mezi nimi, takže se obraz zhorší, ale nezastaví. Při 15 Mb/s pro 4K je kvalita možná jen díky moderním kodekům (HEVC, AV1). Skutečný tok se také mění: klidné scény potřebují málo, akce hodně. Údaj „tok“ je proto vždy průměr nebo strop.`,
        `Streaming services do not send one stream but <b>several versions of the same film</b> at different resolutions and rates (adaptive streaming, HLS or DASH). The player switches between them according to the line speed, so the picture gets worse but does not stop. At 15 Mb/s for 4K the quality is possible only thanks to modern codecs (HEVC, AV1). The real rate also varies: quiet scenes need little, action a lot. The “rate” figure is therefore always an average or a ceiling.`)]},
  {h:P('Digitální kino: strop a šifrování','Digital cinema: the ceiling and encryption'),
   p:[P(`Balíček DCP má strop <b>250 Mb/s</b> pro video a je šifrovaný. Při 4K, 12 bitech a plných barvách je surový tok kolem 7,6 Gb/s, takže stačí zhruba <b>třicetinásobné</b> zmenšení. Velikost celovečerního DCP bývá stovky GB a do kin se posílá na discích nebo po síti. Klíč KDM platí pro konkrétní kinoserver a čas promítání.`,
        `A DCP has a ceiling of <b>250 Mb/s</b> for video and is encrypted. With 4K, 12 bits and full colour the raw rate is around 7.6 Gb/s, so a roughly <b>thirtyfold</b> reduction is enough. A feature-length DCP is hundreds of GB and is sent to cinemas on drives or over a network. The KDM key is valid for a specific cinema server and screening time.`)]},
  {h:P('Co se do kapacity nepočítá','What capacity does not count'),
   p:[P(`Aplikace počítá jen video. Zvuk (u televize stovky kb/s, u kina nekomprimovaných až několik Mb/s), titulky, teletext, průvodce programem a <b>chybová ochrana</b> kanálu (FEC) také spotřebují část kapacity. Užitečný tok pro video je tedy vždy o něco menší než hrubá kapacita. Hodnoty kapacit jsou proto orientační.`,
        `The app counts only video. Audio (hundreds of kb/s for television, up to several Mb/s uncompressed in cinema), subtitles, teletext, the programme guide and the channel’s <b>error protection</b> (FEC) also use up part of the capacity. The useful rate for video is therefore always somewhat smaller than the gross capacity. The capacity values are therefore approximate.`)]}],
 c:[P(`Přepněte rozlišení z SD na 4K a sledujte, jak klesá počet programů v kanálu. Pak změňte kodek z MPEG-2 na AV1 nebo VVC.`,`Switch the resolution from SD to 4K and watch the number of programmes in the channel fall. Then change the codec from MPEG-2 to AV1 or VVC.`),
    P(`Přepněte kanál z DVB-T2 na DVB-S2 a porovnejte, o kolik programů se změní kapacita.`,`Switch the channel from DVB-T2 to DVB-S2 and compare by how many programmes the capacity changes.`),
    P(`Posuňte délku filmu a vyberte, jak je film stlačen (stream, Blu-ray, UHD Blu-ray, DCP). Najděte nejmenší médium, na které se vejde, a délku, při které už se nevejde.`,`Move the film length and choose how the film is compressed (stream, Blu-ray, UHD Blu-ray, DCP). Find the smallest medium it fits on and the length at which it no longer fits.`)],
 d:P(`Kapacita kanálu i média je pevná. Účinnější kodek neznamená jen lepší obraz, ale hlavně víc programů v kanálu a menší soubory.`,`Channel and medium capacity is fixed. A more efficient codec means not only a better picture but above all more programmes in a channel and smaller files.`)}
];
let open=false;
function render(){
 const h=H[S.tab]||H[0],box=$('#hlp .box');
 const sec=(k,body)=>`<h3>${k}</h3>${body}`;
 const links=h.l?`<h3>${tx('Kde to zkusit podrobněji','Where to explore further')}</h3><p>${tx(h.l.cs,h.l.en)} ${h.l.links.map(([n,cs,en])=>XL(n,cs,en)).join('')}</p>`:'';
 box.innerHTML=`<button class="x ib" data-act="help" aria-label="${tx('Zavřít','Close')}">✕</button>
  <div class="kap">${tx('kap.','ch.')} ${S.tab+1} · ${tx('vysvětlení','explanation')}</div><h2 id="hlpT">${h.t}</h2>
  ${sec(tx('Co to je','What it is'),`<p>${h.a}</p><p>${h.b}</p>`)}
  ${sec(tx('Jak číst obrazovku','How to read the screen'),`<p>${h.r}</p>`)}
  ${h.e.map(x=>sec(x.h,x.p.map(q=>`<p>${q}</p>`).join(''))).join('')}
  ${links}
  ${sec(tx('Co zkusit','What to try'),`<ul>${h.c.map(x=>`<li>${x}</li>`).join('')}</ul>`)}
  ${sec(tx('Co si odnést','Takeaway'),`<p><b>${h.d}</b></p>`)}
  <div class="pl"><span class="plusb">PLUS</span>${tx('značí obsah nad rámec učiva přiřazených ročníků. Celá tato aplikace je určena zájemcům o techniku obrazu, ne povinné učivo.','marks content beyond the curriculum of the assigned years. This whole app is meant for those interested in image and video technology, not for required material.')}</div>
  <div class="nav"><button data-act="hnav" data-v="-1">← ${tx('Předchozí kapitola','Previous chapter')}</button><button data-act="hnav" data-v="1">${tx('Další kapitola','Next chapter')} →</button></div>`;
}
ACT.help=()=>{const e=$('#hlp');if(!e.hidden){ACT.helpx();return}render();e.hidden=false;$('#bHlp').classList.add('on');box0().scrollTop=0;$('#hlp .x').focus()};
const box0=()=>$('#hlp .box');
ACT.helpx=()=>{$('#hlp').hidden=true;$('#bHlp').classList.remove('on');$('#bHlp').focus()};
ACT.hnav=v=>{go((S.tab+ +v+H.length)%H.length);render();box0().scrollTop=0};
})();
</script>
<script>boot();</script>
