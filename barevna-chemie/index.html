:root{--hd:#20262F;--tile:#2B313A;--bg:#F2F3F5;--card:#fff;--tx:#1F2329;--mut:#646B76;--pri:#D7262E;--pri2:#B21E25;--ok:#15803d;--okb:#dcfce7;--ko:#b91c1c;--kob:#fee2e2;--bd:#E3E5E9;--wa:#b45309;--wab:#fef3c7;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171C;--card:#1E232B;--tx:#EEF0F3;--mut:#9AA3AE;--bd:#2E3540;--ok:#4ade80;--okb:#12341f;--ko:#f87171;--kob:#3b1618;--pri:#E5383F;--wa:#fbbf24;--wab:#3a2c0c}}
:root[data-theme="dark"]{--bg:#14171C;--card:#1E232B;--tx:#EEF0F3;--mut:#9AA3AE;--bd:#2E3540;--ok:#4ade80;--okb:#12341f;--ko:#f87171;--kob:#3b1618;--pri:#E5383F;--wa:#fbbf24;--wab:#3a2c0c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 'Outfit',system-ui,-apple-system,"Segoe UI",sans-serif;min-height:calc(var(--vh,1vh)*100);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--hd);color:#fff;padding:18px 18px 26px;display:flex;align-items:flex-end;gap:8px;max-width:560px;margin:0 auto;position:relative;box-shadow:0 0 0 100vmax var(--hd);clip-path:inset(0 -100vmax)}
header .ht{flex:1;padding:0 120px 30px 0;position:relative;z-index:1;pointer-events:none}
header h1{margin:0;font-size:31px;line-height:1.02;font-weight:800;letter-spacing:-.01em}
header h1 span{color:var(--pri);display:block}
header p{margin:8px 0 0;color:#C9CED6;font-size:15px}
header .mw{position:absolute;right:0;bottom:0;width:168px;z-index:0}
header .masc{width:100%;height:auto;display:block;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14%);mask-image:linear-gradient(to right,transparent 0,#000 14%)}
header .sv{position:absolute;left:180px;top:22px;z-index:2;font-family:'Caveat','Segoe Print','Comic Sans MS',cursive;font-size:21px;font-weight:700;color:#fff;transform:rotate(-10deg);transform-origin:left center;white-space:nowrap;pointer-events:none}
header.cm{padding:12px 16px 30px;max-width:1180px}
header.cm .ht{padding:0 0 4px}
header.cm h1{font-size:20px}
header.cm h1 span{display:inline;margin-left:6px}
header.cm p,header.cm .sv,header.cm .mw{display:none}
@media (max-width:380px){header .sv{font-size:18px;left:178px}header .mw{width:150px}}
main{position:relative;z-index:1;background:var(--bg);border-radius:30px 30px 0 0;margin:-26px auto 0;padding:22px 16px 30px;max-width:560px;min-height:calc(var(--vh,1vh)*100 - 160px)}
main.wide{max-width:1180px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #0000000a}
h2{font-size:18px;margin:8px 2px 10px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
.hello h2{font-size:26px;line-height:1.2;margin:0 0 10px}
.hello p{margin:0 0 16px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tl{position:relative;text-align:left;border:0;border-radius:16px;padding:16px 14px;min-height:136px;background:var(--tile);color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.tl.red{background:var(--pri)}
.tl.wide{grid-column:span 2;min-height:124px}
.tl svg.ic{position:absolute;left:14px;top:14px}
.tl b{font-size:19px}
.tl small{font-size:13px;opacity:.85}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--pri);cursor:pointer;box-shadow:0 2px 0 var(--pri2)}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:600;box-shadow:none}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px 4px;border-radius:10px;font:inherit;font-size:14px;font-weight:500;min-height:40px;cursor:pointer}
.seg button.on{background:var(--tile);color:#fff;font-weight:600}
.lab{font-size:13px;color:var(--mut);margin:12px 2px 6px;font-weight:600}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--tile);color:#fff;border-color:var(--tile)}
.chip.hint{border-color:var(--wa);color:var(--wa)}
.chip.hint.on{background:var(--wa);color:#fff}
@keyframes sk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{border-radius:16px;padding:14px;margin:0 0 12px;display:flex;gap:12px;align-items:flex-start}
.fb.ok{background:var(--okb)}
.fb.ko{background:var(--kob)}
.fb.half{background:var(--wab)}
.fb img{width:54px;height:54px;border-radius:27px;object-fit:cover;object-position:50% 18%;background:var(--hd);flex-shrink:0}
.fb b{font-size:18px;display:block}
.fb.ok b{color:var(--ok)}
.fb.ko b{color:var(--ko)}
.fb.half b{color:var(--wa)}
.fb p{margin:4px 0 0;color:var(--tx)}
.fb img.hop{animation:hop .6s ease}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-6px)}}
footer.ver{max-width:560px;margin:0 auto;text-align:center;font-size:11px;color:var(--mut);padding:6px 16px 14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.zpet{display:block;width:100%;margin:0;background:var(--hd);padding:10px 18px 8px max(18px,calc((100% - 560px)/2 + 18px));font-size:13px;font-weight:500;color:#A3AAB5;text-decoration:none}
.fb img.acc{width:84px;height:84px;border-radius:14px;object-position:50% 30%;animation:sk .4s 2}
header{cursor:pointer}
header .mw{cursor:pointer;-webkit-tap-highlight-color:transparent}
header .mw:focus{outline:none}
header .masc{pointer-events:none}
.eye{position:absolute;width:10.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#F8F5E8;overflow:hidden;pointer-events:none}
.eye i{position:absolute;left:50%;top:50%;width:28%;height:28%;margin:-14% 0 0 -14%;border-radius:50%;background:#140808;transition:transform .35s ease}
.eye::after{content:'';position:absolute;inset:0;background:#E6B78E;transform:scaleY(0);transform-origin:top;transition:transform .09s}
.mw.blink .eye::after{transform:scaleY(1)}
.mw.roll .eye i{animation:roll 1.3s ease-in-out}
@keyframes roll{0%{transform:translate(0,0)}20%{transform:translate(155%,-80%)}40%{transform:translate(0,-170%)}60%{transform:translate(-155%,-80%)}80%{transform:translate(-90%,60%)}100%{transform:translate(0,0)}}
.mw .masc{transform-origin:50% 100%}
.mw.tilt .masc{animation:tilt 1.1s ease-in-out}
@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}55%{transform:rotate(4deg)}80%{transform:rotate(-2deg)}}
.mw.lookl .eye i{transform:translate(-165%,15%)}
.mw.lookr .eye i{transform:translate(165%,-15%)}
.mw.lookup .eye i{transform:translate(0,-160%)}
.spk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0}
.mw.spark .spk{animation:spk .9s ease-out}
@keyframes spk{0%{opacity:0;transform:scale(.8)}25%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.12)}}
.mw.spark .masc{animation:hop .6s ease}
.bub{position:absolute;right:130px;top:44px;width:200px;background:#fff;color:#1F2329;border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.35;font-weight:500;box-shadow:0 6px 20px #0005;opacity:0;transform:translateY(6px) scale(.95);transition:opacity .25s,transform .25s;pointer-events:none;z-index:3}
.bub::after{content:'';position:absolute;right:-7px;top:24px;border:8px solid transparent;border-left-color:#fff;border-right:0}
.bub.on{opacity:1;transform:none}
header.cm .bub{display:none}
@media (prefers-reduced-motion:reduce){.mw .masc,.mw .spk{animation:none!important}}


/* ---------- viry ---------- */
.r{color:var(--pri);font-weight:600}
header h1{font-size:29px}header:not(.cm) h1 span.r2{font-size:.86em;white-space:nowrap}
header h1 span.w{position:relative;display:inline-block;color:#fff}header h1 .w .sv{position:absolute;left:100%;top:6px;margin-left:8px;font-style:normal;transform:rotate(-12deg);transform-origin:left bottom;color:#fff;white-space:nowrap}
@media (max-width:560px){header .mw{width:128px}header .ht{padding-right:96px}header h1{font-size:27px}header h1 .w .sv{font-size:17px;top:4px;margin-left:4px}}header.cm h1 .w .sv{display:none}
@media (max-width:380px){header h1{font-size:25px}header h1 .w .sv{font-size:16px}}
.tl svg.ic{width:30px;height:30px}.tl{padding-top:52px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip.on{background:var(--hd);color:#fff;border-color:var(--hd)}.chip.dn{background:var(--okb);border-color:var(--ok);color:var(--ok)}.chip.wa{background:var(--wab);border-color:var(--wa);color:var(--wa)}
.chip.snd{display:inline-flex;align-items:center;gap:6px}
.stagew{display:grid;gap:12px}.stagew>*{min-width:0}
.stage{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px #0000000a}
.svw{position:relative;background:#e9f3fa}
.stage svg{display:block;width:100%;height:auto;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tipb{position:absolute;z-index:5;max-width:240px;background:#20262F;color:#fff;border-radius:12px;padding:8px 11px;font-size:13.5px;line-height:1.35;pointer-events:none;box-shadow:0 6px 18px #0004}.tipb b{display:block;font-size:14.5px;margin-bottom:2px;color:#fff}

.mol3 svg{display:block;width:100%;height:auto}
.mol3 .hint3{position:absolute;right:10px;bottom:8px;font-size:12px;color:#5b6472;background:#ffffffcc;border-radius:10px;padding:2px 8px}
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cmp .sc{cursor:pointer}
.cmp .sc .tx b{font-size:15px}
.sline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt-sw{display:inline-flex;align-items:center;gap:8px}
.qz .oc .sw{width:20px;height:20px;border-radius:10px}
.qfig{background:var(--card)}
.qfig svg{max-width:340px;margin:0 auto}
.lt{margin:0 0 12px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
.tbl th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.tbl tr.on td{background:var(--wab)}
.tbl td .sw{margin-right:6px}
.eq{font-size:17px;font-weight:600;text-align:center;margin:8px 0;letter-spacing:.01em}
@media (min-width:620px){.gal{grid-template-columns:repeat(3,minmax(0,1fr))}.cmp{gap:12px}}
@media (min-width:980px){
 .gal{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
 .det{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}.det .bigil{position:sticky;top:10px}
 .wheelw{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
 .ionsg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px;align-items:start}
 .mtab{grid-template-columns:1fr 1fr}
 .tiles.bc{grid-template-columns:repeat(4,1fr)}
}

sub{font-size:.72em;line-height:0;vertical-align:-.25em}
.tbl td:nth-child(2){white-space:nowrap}
@media (min-width:980px){.tiles.bc .tl.half{grid-column:span 2}}
.splw svg{max-width:540px;margin:0 auto}.flow svg{max-width:600px;margin:0 auto}
.cmp.c4{grid-template-columns:repeat(2,minmax(0,1fr))}@media (min-width:620px){.cmp.c4{grid-template-columns:repeat(4,minmax(0,1fr))}}

.rib{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:0 0 14px}
.ribe{display:flex;flex-direction:column;gap:5px;min-width:0;height:100%}
.ribd{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:center;flex:1;min-height:46px;padding:7px 4px;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.rdot{width:15px;height:15px;border-radius:8px;border:1.5px solid #0003;padding:0;cursor:pointer;transition:transform .15s}
.rdot:hover{transform:scale(1.3)}
.ribl{min-height:28px;border:0;background:none;font:inherit;font-size:11.5px;text-align:center;color:var(--mut);line-height:1.2;cursor:pointer;padding:0}
.pvb{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.pvb b{display:block;margin-top:8px;font-size:17px}.pvb p{font-size:14.5px}
.pvb svg{display:block;width:100%;max-width:260px;height:auto;border-radius:12px}
.era{margin-top:18px;scroll-margin-top:10px}
.erah{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 2px 4px}
.erah h3{margin:0;font-size:22px}.erah span{color:var(--pri);font-weight:700;font-size:14px}
.hc{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px;scroll-margin-top:12px;align-items:start}
.hc.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--pri)}100%{box-shadow:0 0 0 0 transparent}}
.hil svg{display:block;width:100%;height:auto;border-radius:12px}
.hy{color:var(--pri);font-weight:700;font-size:13.5px}
.hn{font-size:19px;display:block;line-height:1.2;margin:1px 0}
.hf{color:var(--mut);font-size:13.5px;margin:0 0 6px}
.htx p{margin:8px 0 0;font-size:15px}
.htx .hch{font-size:14px;background:var(--bg);border-radius:10px;padding:8px 10px}
.htx .ex{margin-top:8px}
.hul{margin:0 0 12px;padding-left:20px}.hul li{margin:0 0 6px}
.htx{grid-column:1/-1}.hhd{align-self:center}
@media (min-width:980px){.hlist{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.hlist .hc{margin:0}.hc{grid-template-columns:150px minmax(0,1fr)}.hil{grid-row:span 2}.htx{grid-column:2}.hhd{align-self:start}}
/* nižší horní lišta a menší mezery nahoře */
header{padding:14px 18px 22px}
header .ht{padding-bottom:18px}
header p{margin-top:5px}
main{padding-top:12px}
.back{margin:0 0 2px}
.back+h2,.back+.row h2,.back+.det{margin-top:2px}
@media (max-width:560px){header .mw{width:118px}header .ht{padding-right:90px}}

.rdot.on{transform:scale(1.35);box-shadow:0 0 0 2.5px var(--card),0 0 0 4.5px var(--tx)}
.ribl.on{color:var(--tx);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.hpv .hc{border:2px solid var(--tx);margin-bottom:12px;position:relative}
.hpv .hhd{padding-right:30px}
.hx{position:absolute;right:8px;top:6px;width:34px;height:34px;border-radius:17px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:22px;line-height:1;cursor:pointer}
.hpv{animation:none}
.tl{justify-content:flex-start}.tl b{line-height:1.2;margin-bottom:2px}

.ex.hs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.ex.hs .chip{flex:none}
.winfo{min-height:230px}
.cap{min-height:68px}

</style>
</head>

 {id:'niso47',f:'NiSO₄·7H₂O',n:'heptahydrát síranu nikelnatého',st:'s',c:'#3c9a4c',cn:'zelená',m:'dd',ion:'Ni2',ab:[8,0],k:1,lam:'absorbuje fialové (asi 400 nm) a červené (asi 720 nm) světlo',
  w:'Kationt Ni²⁺ (d⁸) obklopený vodou má dva hlavní absorpční pásy: ve fialové a v červené oblasti. Prostřední část spektra prochází, takže vidíme zelenou.'},
 {id:'feso47',f:'FeSO₄·7H₂O',n:'heptahydrát síranu železnatého (zelená skalice)',st:'s',c:'#9ed3b8',cn:'světle modrozelená',m:'dd',ion:'Fe2',ab:[0],k:1,lam:'absorbuje slabě, hlavně červené a blízké infračervené záření',
  w:'Kationt Fe²⁺ (d⁶) absorbuje slabě a hlavně v červené a blízké infračervené oblasti, proto je barva jen světle modrozelená.|Na vzduchu se Fe²⁺ postupně oxiduje na Fe³⁺ a krystaly hnědnou.'},
 {id:'fecl36',f:'FeCl₃·6H₂O',n:'hexahydrát chloridu železitého',st:'s',c:'#c98a1d',cn:'žlutohnědá',m:'ct',ion:'Fe3',ab:[8,7],lam:'absorbuje fialové a modré světlo',
  w:'Fe³⁺ má konfiguraci d⁵ a jeho d–d přechody jsou velmi slabé. Žlutohnědou barvu způsobuje přenos náboje z ligandů (Cl⁻, OH⁻) na Fe³⁺. Absorbuje fialovou a modrou část spektra.'},
 {id:'k2cr2o7',f:'K₂Cr₂O₇',n:'dichroman draselný',st:'s',c:'#ee6a12',cn:'oranžová',m:'ct',ion:'Cr6',ab:[7,8],k:1,lam:'absorbuje modré a fialové světlo',
  w:'Atom chromu má oxidační číslo VI, odpovídá mu konfigurace d⁰. d–d přechod tedy nastat nemůže. Barvu způsobuje přenos náboje: elektron se excituje z atomu kyslíku do prázdného d‑orbitalu atomu chromu. Absorbuje se modrá a fialová část spektra, vidíme oranžovou.'},
 {id:'k2cro4',f:'K₂CrO₄',n:'chroman draselný',st:'s',c:'#f4cf0a',cn:'žlutá',m:'ct',ion:'Cr6',ab:[8],lam:'absorbuje fialové a blízké ultrafialové záření',
  w:'Stejně jako u dichromanu jde o přenos náboje z kyslíku na chrom(VI). Chroman absorbuje kratší vlnové délky (fialovou a blízkou UV), proto je žlutý.|V kyselém prostředí přechází žlutý chroman na oranžový dichroman.'},
 {id:'kmno4',f:'KMnO₄',n:'manganistan draselný',st:'s',c:'#3d0f45',cn:'tmavě fialová, téměř černá',m:'ct',ion:'Mn7',ab:[4,3],k:1,gl:1,lam:'absorbuje zelené a žlutozelené světlo (asi 525–545 nm)',
  w:'Atom manganu má oxidační číslo VII (d⁰), d–d přechod není možný. Sytou barvu způsobuje přenos náboje z kyslíku na mangan, který absorbuje zelenou a žlutozelenou část spektra. Propuštěná červená a modrá dávají purpurově fialovou.|Krystaly absorbují tak silně, že vypadají téměř černé s kovovým leskem.'},
 {id:'mncl24',f:'MnCl₂·4H₂O',n:'tetrahydrát chloridu manganatého',st:'s',c:'#f2c2cc',cn:'světle růžová',m:'dd',ion:'Mn2',ab:[4],k:1,lam:'absorbuje velmi slabě (přechody jsou zakázané)',
  w:'Mn²⁺ má konfiguraci d⁵: v každém d‑orbitalu je jeden elektron a všechny mají stejný spin. Každý d–d přechod by vyžadoval změnu spinu a takový přechod je „zakázaný“, probíhá jen vzácně. Látka proto absorbuje jen nepatrně a je světle růžová.'},
 {id:'crcl36',f:'CrCl₃·6H₂O',n:'hexahydrát chloridu chromitého',st:'s',c:'#2c6a3a',cn:'tmavě zelená',m:'dd',ion:'Cr3',ab:[8,1],k:1,lam:'absorbuje fialové a oranžové světlo',
  w:'Kationt Cr³⁺ (d³) má d–d přechody ve viditelné oblasti. V této látce jsou v okolí Cr³⁺ kromě molekul vody i chloridové anionty, proto je tmavě zelená. Čistý kationt [Cr(H₂O)₆]³⁺ je šedofialový.'},
 {id:'cr2o3',f:'Cr₂O₃',n:'oxid chromitý',st:'s',c:'#4d7a35',cn:'zelená',m:'dd',ion:'Cr3',ab:[7,1],lam:'absorbuje modré a oranžové světlo',
  w:'d–d přechody kationtu Cr³⁺ (d³) absorbují modrou a oranžovou až červenou část spektra, zelená prochází. Používá se jako pigment (chromová zeleň).|Tentýž kationt Cr³⁺ zabudovaný v korundu Al₂O₃ je obklopen silněji, rozštěpení je větší a vzniká červený rubín.'},
 {id:'fe2o3',f:'Fe₂O₃',n:'oxid železitý',st:'s',c:'#8a2e18',cn:'červenohnědá',m:'ct',ion:'Fe3',ab:[8,7,4],lam:'absorbuje fialové, modré a zelené světlo',
  w:'Přenos náboje O²⁻ → Fe³⁺ spolu se slabými d–d přechody absorbuje fialovou, modrou i zelenou část spektra. Zbylá červená a oranžová dávají barvu rzi a hematitu.'},
 {id:'cuo',f:'CuO',n:'oxid měďnatý',st:'s',c:'#1d1d1f',cn:'černá',m:'band',ion:'Cu2',ab:[0,1,2,3,4,5,6,7,8],lam:'absorbuje celou viditelnou oblast',
  w:'Oxid měďnatý je polovodič s úzkým zakázaným pásem (asi 1,3 eV). Absorbuje fotony celé viditelné oblasti, proto je černý.'},
 {id:'cu2o',f:'Cu₂O',n:'oxid měďný',st:'s',c:'#b3281e',cn:'červená',m:'band',ion:'Cu1',ab:[8,7,6,5,4,3,2],lam:'absorbuje vše od fialové po žlutou (zakázaný pás asi 2 eV)',
  w:'Cu⁺ má konfiguraci d¹⁰, d–d přechod tedy nastat nemůže. Oxid měďný je ale polovodič: elektron se excituje z valenčního do vodivostního pásu. Absorbují se fotony s energií větší než asi 2 eV, tedy fialová až žlutá část spektra. Zbývá červená.'},
 {id:'cucl',f:'CuCl',n:'chlorid měďný',st:'s',c:'#f1f2ee',cn:'bílá',m:'none',ion:'Cu1',ab:[],lam:'viditelné světlo neabsorbuje',
  w:'Kationt Cu⁺ má zcela zaplněné d‑orbitaly (d¹⁰). Elektron se nemá kam excitovat, a proto je CuCl bílý. Na vlhkém vzduchu se oxiduje a zelená.'},
 {id:'tio2',f:'TiO₂',n:'oxid titaničitý',st:'s',c:'#fbfbfb',cn:'zářivě bílá',m:'none',ion:'Ti4',ab:[],lam:'absorbuje až ultrafialové záření',
  w:'Ti⁴⁺ má konfiguraci d⁰, v d‑orbitalech nemá žádný elektron, který by se mohl excitovat. Přenos náboje O²⁻ → Ti⁴⁺ absorbuje až ultrafialové záření. Viditelné světlo se jen rozptyluje, proto je TiO₂ zářivě bílý.|Používá se jako titanová běloba v barvách, papíru a zubních pastách.'},
 {id:'zno',f:'ZnO',n:'oxid zinečnatý',st:'s',c:'#f8f8f6',cn:'bílá',m:'none',ion:'Zn2',ab:[],lam:'absorbuje jen ultrafialové záření',
  w:'Zn²⁺ má zcela zaplněné d‑orbitaly (d¹⁰), elektron se nemá kam excitovat. ZnO absorbuje jen ultrafialové záření (proto je v opalovacích krémech). Viditelné světlo rozptyluje, a je tedy bílý.'},
 {id:'nacl',f:'NaCl',n:'chlorid sodný',st:'s',c:'#f7f8f8',cn:'bílá',m:'none',ab:[],k:1,lam:'absorbuje jen ultrafialové záření',
  w:'Kationty Na⁺ i anionty Cl⁻ mají elektronovou konfiguraci vzácného plynu a absorbují jen ultrafialové záření.|Velký krystal soli je průhledný. Prášek je bílý, protože se světlo rozptyluje a odráží na mnoha drobných krystalcích.'},
 {id:'hgs',f:'HgS',n:'sulfid rtuťnatý (rumělka)',st:'s',c:'#c8261c',cn:'červená',m:'band',ab:[8,7,6,5,4,3,2],lam:'absorbuje fialové až žluté světlo (zakázaný pás asi 2 eV)',
  w:'Hg²⁺ má konfiguraci d¹⁰, barvu tedy nezpůsobují d–d přechody. Rumělka je polovodič se zakázaným pásem asi 2 eV. Absorbuje fialovou až žlutou část spektra, a je proto červená.'},
 {id:'cds',f:'CdS',n:'sulfid kademnatý',st:'s',c:'#f2b705',cn:'žlutá',m:'band',ab:[8,7],lam:'absorbuje fialové a modré světlo (zakázaný pás asi 2,4 eV)',
  w:'Cd²⁺ má konfiguraci d¹⁰. Sulfid kademnatý je polovodič se zakázaným pásem asi 2,4 eV. Absorbuje fialovou a modrou část spektra, zbytek dává žlutou (kadmiová žluť).'},
 {id:'s8',f:'S₈',n:'síra',st:'s',c:'#f1dc35',cn:'žlutá',m:'mol',ab:[8,7],lam:'absorbuje fialové a modré světlo',
  w:'V molekulách S₈ absorbují elektrony fialové a modré světlo (přechod do vyššího molekulového orbitalu). Proto je síra žlutá.'},
 {id:'i2s',f:'I₂',n:'jod (krystalický)',st:'s',c:'#3a3046',cn:'šedočerná s fialovým leskem',m:'mol',ab:[8,7,6,5,4,3,2,1],k:1,gl:1,lam:'v pevném stavu absorbuje téměř celou viditelnou oblast',
  w:'Krystaly jodu absorbují většinu viditelného světla, proto jsou téměř černé s fialovým kovovým leskem. Páry jodu a jeho roztok v nepolárním rozpouštědle jsou fialové.'},
 {id:'karoten',f:'β-karoten',n:'C₄₀H₅₆ (barvivo mrkve)',st:'s',c:'#f07a12',cn:'oranžová',m:'pi',ab:[7,6],lam:'absorbuje modré a zelenomodré světlo (asi 450–480 nm)',
  w:'Molekula má 11 konjugovaných dvojných vazeb. Delokalizované π‑elektrony mají malý rozdíl energetických hladin, a tak absorbují už viditelné světlo, modrou a zelenomodrou část. Vidíme oranžovou.'},
 {id:'berlin',f:'Fe₄[Fe(CN)₆]₃',n:'hexakyanoželeznatan železitý (berlínská modř)',st:'s',c:'#1b2f7a',cn:'tmavě modrá',m:'ct',ion:'Fe3',ab:[0,1],lam:'absorbuje oranžové a červené světlo (asi 700 nm)',
  w:'Obsahuje kationty Fe²⁺ i Fe³⁺ spojené kyanidovými můstky. Elektron se excituje z Fe²⁺ na Fe³⁺ (přenos náboje mezi kovy) a absorbuje přitom oranžové a červené světlo. Vidíme tmavě modrou.'},
 /* ---------- sraženiny ---------- */
 {id:'agcl',f:'AgCl',n:'chlorid stříbrný',st:'ppt',c:'#f6f6f3',cn:'bílá',m:'none',ion:'Ag1',ab:[],lam:'přenos náboje absorbuje jen ultrafialové záření',
  w:'Ag⁺ má konfiguraci d¹⁰. Přenos náboje Cl⁻ → Ag⁺ absorbuje jen ultrafialové záření, proto je sraženina bílá.|Na světle se AgCl rozkládá za vzniku stříbra a šedne.'},
 {id:'agbr',f:'AgBr',n:'bromid stříbrný',st:'ppt',c:'#efe7b8',cn:'nažloutlá',m:'ct',ion:'Ag1',ab:[8],lam:'absorbuje okraj fialové oblasti',
  w:'Bromidový anion odevzdá elektron snadněji než chloridový. Přenos náboje Br⁻ → Ag⁺ proto absorbuje už okraj fialové oblasti a sraženina je nažloutlá.'},
 {id:'agi',f:'AgI',n:'jodid stříbrný',st:'ppt',c:'#f1d65a',cn:'žlutá',m:'ct',ion:'Ag1',ab:[8,7],lam:'absorbuje fialové a část modrého světla',
  w:'Jodidový anion je největší a elektron odevzdá nejsnáze. Přenos náboje I⁻ → Ag⁺ absorbuje fialovou i část modré oblasti, sraženina je žlutá.|Řada AgCl → AgBr → AgI ukazuje, jak se absorpce posouvá k delším vlnovým délkám.'},
 {id:'cuoh2',f:'Cu(OH)₂',n:'hydroxid měďnatý',st:'ppt',c:'#5aa7e0',cn:'světle modrá',m:'dd',ion:'Cu2',ab:[0,1],lam:'absorbuje červené a oranžové světlo',
  w:'Kationt Cu²⁺ (d⁹): d–d přechod jako u modré skalice. Sraženina vzniká, když roztok měďnaté soli reaguje s hydroxidem: Cu²⁺ + 2 OH⁻ → Cu(OH)₂.'},
 {id:'feoh3',f:'Fe(OH)₃',n:'hydroxid železitý',st:'ppt',c:'#a14f1c',cn:'rezavě hnědá',m:'ct',ion:'Fe3',ab:[8,7,6],lam:'absorbuje fialové a modré světlo',
  w:'Fe³⁺ (d⁵): barvu způsobuje hlavně přenos náboje z OH⁻ na Fe³⁺. Absorbuje fialovou a modrou část spektra, sraženina je rezavě hnědá.'},
 {id:'pbi2',f:'PbI₂',n:'jodid olovnatý („zlatý déšť“)',st:'ppt',c:'#f6c818',cn:'zlatožlutá',m:'band',ab:[8,7],gl:1,lam:'absorbuje fialové a modré světlo (zakázaný pás asi 2,3 eV)',
  w:'Olovo není přechodný kov (Pb²⁺ má 5d¹⁰ 6s²). Jodid olovnatý je polovodič, absorbuje fialovou a modrou část spektra, a je proto žlutý.|Z horkého roztoku krystalizuje v lesklých šupinkách: „zlatý déšť“.'},
 /* ---------- roztoky ---------- */
 {id:'cuaq',f:'[Cu(H₂O)₆]²⁺',n:'roztok CuSO₄ (hexaakvaměďnatý kationt)',st:'aq',c:'#3d8fe0',al:.78,cn:'modrá',m:'dd',ion:'Cu2',ab:[0,1],lam:'absorbuje červené a oranžové světlo (maximum asi 800 nm)',
  w:'V roztoku tvoří Cu²⁺ (d⁹) akvakomplex se šesti molekulami vody. d–d přechod absorbuje široký pás v červené a oranžové oblasti, propouští modrou.'},
 {id:'cunh3',f:'[Cu(NH₃)₄(H₂O)₂]²⁺',n:'tetraammin-diakvaměďnatý kationt',st:'aq',c:'#2335b5',al:.95,cn:'tmavě modrá (azurová)',m:'dd',ion:'Cu2',ab:[1,2],lam:'absorbuje oranžové světlo (asi 600 nm)',
  w:'Amoniak je silnější ligand než voda. Rozštěpení d‑orbitalů se zvětší a absorbuje se světlo s vyšší energií, oranžové (asi 600 nm). Roztok je proto tmavě modrý až modrofialový.|Vzniká, když roztok CuSO₄ reaguje s nadbytkem amoniaku.'},
 {id:'coaq',f:'[Co(H₂O)₆]²⁺',n:'roztok CoCl₂ (hexaakvakobaltnatý kationt)',st:'aq',c:'#e0668d',al:.62,cn:'růžová',m:'dd',ion:'Co2',ab:[4],lam:'absorbuje zelené světlo (asi 510 nm)',
  w:'Co²⁺ (d⁷) obklopený šesti molekulami vody (oktaedr) absorbuje zelenou část spektra. Roztok je růžový.'},
 {id:'cocl4',f:'[CoCl₄]²⁻',n:'tetrachlorokobaltnatanový anion (CoCl₂ v konc. HCl)',st:'aq',c:'#2d4fd0',al:.95,cn:'sytě modrá',m:'dd',ion:'Co2',ab:[0,1],lam:'absorbuje červené a oranžové světlo',
  w:'V koncentrované kyselině chlorovodíkové obklopí Co²⁺ čtyři chloridové anionty, které tvoří čtyřstěn. d–d přechody se posunou do červené a oranžové oblasti a navíc zesílí, roztok je sytě modrý.|Ředěním vodou se vrací růžová barva [Co(H₂O)₆]²⁺.'},
 {id:'niaq',f:'[Ni(H₂O)₆]²⁺',n:'roztok NiSO₄ (hexaakvanikelnatý kationt)',st:'aq',c:'#44b06a',al:.7,cn:'zelená',m:'dd',ion:'Ni2',ab:[8,0],lam:'absorbuje fialové (asi 400 nm) a červené (asi 720 nm) světlo',
  w:'Ni²⁺ (d⁸) má dva absorpční pásy, ve fialové a v červené oblasti. Prostřední, zelená část spektra prochází.'},
 {id:'kmno4aq',f:'MnO₄⁻',n:'roztok KMnO₄ (manganistanový anion)',st:'aq',c:'#8a1b8f',al:.9,cn:'fialová',m:'ct',ion:'Mn7',ab:[4,3],lam:'absorbuje zelené a žlutozelené světlo (asi 525–545 nm)',
  w:'Mangan(VII) má konfiguraci d⁰. Barvu způsobuje přenos náboje z kyslíku na mangan, absorbuje se zelená a žlutozelená část. Červená a modrá, které projdou, dávají fialovou.|Absorpce je tak silná, že i velmi zředěný roztok je zřetelně růžovofialový.'},
 {id:'cr2o7aq',f:'Cr₂O₇²⁻',n:'roztok K₂Cr₂O₇ (dichromanový anion)',st:'aq',c:'#f07a1a',al:.85,cn:'oranžová',m:'ct',ion:'Cr6',ab:[7,8],lam:'absorbuje modré a fialové světlo',
  w:'Chrom(VI), d⁰. Přenos náboje O → Cr absorbuje modrou a fialovou část spektra, roztok je oranžový.|V roztoku se ustavuje rovnováha 2 CrO₄²⁻ + 2 H⁺ ⇌ Cr₂O₇²⁻ + H₂O: v kyselém prostředí převládá oranžový dichroman, v zásaditém žlutý chroman.'},
 {id:'cro4aq',f:'CrO₄²⁻',n:'roztok K₂CrO₄ (chromanový anion)',st:'aq',c:'#f5d21a',al:.85,cn:'žlutá',m:'ct',ion:'Cr6',ab:[8],lam:'absorbuje fialové a blízké ultrafialové záření (asi 370 nm)',
  w:'Chrom(VI), d⁰. Přenos náboje O → Cr absorbuje fialovou a blízkou ultrafialovou oblast, roztok je žlutý.'},
 {id:'fecl3aq',f:'FeCl₃(aq)',n:'roztok chloridu železitého',st:'aq',c:'#d9a028',al:.75,cn:'žlutá až žlutohnědá',m:'ct',ion:'Fe3',ab:[8,7],lam:'absorbuje fialové a modré světlo',
  w:'Samotný kationt [Fe(H₂O)₆]³⁺ je jen bledě fialový. Ve vodě ale Fe³⁺ hydrolyzuje a vznikají kationty [Fe(OH)(H₂O)₅]²⁺ a chlorokomplexy. U nich přenos náboje absorbuje fialovou a modrou část spektra, takže roztok je žlutý až žlutohnědý.'},
 {id:'feso4aq',f:'[Fe(H₂O)₆]²⁺',n:'roztok FeSO₄ (hexaakvaželeznatý kationt)',st:'aq',c:'#bfe3c4',al:.45,cn:'světle zelená',m:'dd',ion:'Fe2',ab:[0],lam:'absorbuje slabě, v červené a blízké infračervené oblasti',
  w:'Fe²⁺ (d⁶) absorbuje slabě a hlavně v blízké infračervené oblasti, roztok je proto jen světle zelený.'},
 {id:'fescn',f:'[Fe(SCN)(H₂O)₅]²⁺',n:'thiokyanatanoželezitý kationt',st:'aq',c:'#a3101a',al:.95,cn:'krvavě červená',m:'ct',ion:'Fe3',ab:[6,7],lam:'absorbuje modré a zelenomodré světlo (asi 480 nm)',
  w:'Thiokyanatanový anion SCN⁻ se váže na Fe³⁺. Přenos náboje SCN⁻ → Fe³⁺ absorbuje modrou a zelenomodrou část spektra, vidíme krvavě červenou.|Tato reakce slouží k důkazu kationtů Fe³⁺.'},
 {id:'ti3aq',f:'[Ti(H₂O)₆]³⁺',n:'roztok TiCl₃ (hexaakvatitanitý kationt)',st:'aq',c:'#8a4fb5',al:.8,cn:'fialová',m:'dd',ion:'Ti3',ab:[5,4,3],lam:'absorbuje široký pás se středem asi 500 nm (zelená až žlutozelená)',
  w:'Učebnicový příklad d–d přechodu. Ti³⁺ má jediný d‑elektron (d¹), který se po absorpci fotonu excituje z nižší hladiny na vyšší. Široký pás kolem 500 nm absorbuje zelenou a žlutozelenou část, roztok je fialový.'},
 {id:'sc3aq',f:'[Sc(H₂O)₆]³⁺',n:'roztok ScCl₃ (akvakomplex skanditého kationtu)',st:'aq',c:'#e3f1f8',al:.3,cn:'bezbarvá',m:'none',ion:'Sc3',ab:[],lam:'viditelné světlo neabsorbuje',
  w:'Sc³⁺ má konfiguraci argonu, tedy d⁰. Žádný d‑elektron, žádný d–d přechod. Roztok je bezbarvý.'},

 {q:'Barva halogenů se mění od světle žlutého F₂ po fialový I₂. Co se děje s energií absorbovaného fotonu?',o:['klesá, absorbuje se delší vlnová délka','roste, absorbuje se kratší vlnová délka','zůstává stejná, mění se jen intenzita','klesá, absorbuje se kratší vlnová délka'],a:0,e:'F₂ absorbuje fialovou (vysoká energie), I₂ zelenou a žlutozelenou (nižší energie). Kratší vlnová délka = vyšší energie.'},
 {q:'Bezvodý CuSO₄ je bílý, pentahydrát modrý. Proč?',o:['Molekuly vody kolem Cu²⁺ zvětší rozštěpení d‑orbitalů a absorpce se posune do viditelné oblasti.','Molekuly vody jsou samy modré a modrou barvu propůjčí krystalu.','Voda zredukuje Cu²⁺ na Cu⁺, který je modrý.','Bez vody má Cu²⁺ konfiguraci d¹⁰, a proto je bílý.'],a:0,e:'Cu²⁺ je d⁹ v obou látkách. Rozhodují ligandy: se sulfátem absorbuje v infračervené, s vodou v červené oblasti.'},
 {q:'Který foton má největší energii?',o:['fialový (400 nm)','modrý (470 nm)','zelený (530 nm)','červený (680 nm)'],a:0,e:'E = h·c/λ. Čím kratší vlnová délka, tím větší energie fotonu.'},
 {q:'K modrému roztoku CuSO₄ přidáš nadbytek amoniaku a roztok ztmavne do sytě modré. Proč?',o:['NH₃ je silnější ligand, rozštěpení se zvětší a absorbuje se kratší vlnová délka.','NH₃ je slabší ligand, rozštěpení se zmenší a absorbuje se delší vlnová délka.','NH₃ oxiduje Cu²⁺ na Cu³⁺, který je tmavě modrý.','NH₃ je modrý plyn a roztok jím zbarví.'],a:0,e:'[Cu(NH₃)₄(H₂O)₂]²⁺ absorbuje oranžovou (asi 600 nm) místo červené (asi 800 nm).'},
 {q:'Cu⁺ má konfiguraci d¹⁰, a přesto je Cu₂O červený. Co jeho barvu způsobuje?',o:['pásový přechod v polovodiči','d–d přechod kationtu Cu⁺','konjugované π‑elektrony','zakázaný přechod se změnou spinu'],a:0,e:'Cu₂O je polovodič se zakázaným pásem asi 2 eV, absorbuje fialovou až žlutou část spektra.'},
 {q:'Který kationt má konfiguraci [Ar] 3d⁹?',o:['Cu²⁺','Zn²⁺','Ni²⁺','Cu⁺'],a:0,e:'<sub>29</sub>Cu: [Ar] 3d¹⁰ 4s¹ → <sub>29</sub>Cu²⁺ odevzdá elektron 4s a jeden 3d.'},
 {q:'Roztok absorbuje zelené světlo (500–560 nm). Jakou má barvu?',o:['purpurovou (červenofialovou)','zelenou','žlutou','modrou'],a:0,e:'Zelená a purpurová jsou komplementární barvy. Takto vzniká barva manganistanu a fenolftaleinu.'},
 {q:'Kolik d‑elektronů má kationt Co²⁺?',o:['7','5','9','6'],a:0,e:'<sub>27</sub>Co: [Ar] 3d⁷ 4s² → <sub>27</sub>Co²⁺: [Ar] 3d⁷.'},
 {q:'Proč jsou sloučeniny Mn²⁺ jen bledě růžové?',o:['Má d⁵ se stejnými spiny a d–d přechody jsou zakázané.','Má d⁰ a nemá žádný d‑elektron.','Má d¹⁰ a vyšší hladina je plná.','Absorbuje jen v infračervené oblasti, protože je d⁹.'],a:0,e:'Přechod by vyžadoval změnu spinu, proto probíhá velmi vzácně a absorpce je slabá.'}];

/* bádání */
const LAB=[
 {n:'Modrá skalice v kahanu',q:'Modrou skalici zahříváš ve zkumavce. Zbělá a u ústí zkumavky se objeví kapičky. Po vychladnutí na ni kápneš vodu a opět zmodrá. Vysvětli, co se děje s okolím kationtu Cu²⁺.',h:'Počet d‑elektronů Cu²⁺ se nemění. Co se mění kolem kationtu?',s:'CuSO₄·5H₂O ztratí krystalovou vodu za vzniku bezvodého CuSO₄. Kationt Cu²⁺ (d⁹) pak obklopují síranové anionty, rozštěpení d‑orbitalů se zmenší a absorpce se posune do infračervené oblasti, látka je bílá. Voda se opět naváže jako ligand a modrá barva se vrátí.',sub:'cuso4'},
 {n:'Indikátor vlhkosti',q:'Silikagel s chloridem kobaltnatým je suchý modrý a vlhký růžový. Navrhni, jak bys ho „nabil“ zpět na modrou, a vysvětli barevnou změnu.',h:'Porovnej [Co(H₂O)₆]²⁺ a [CoCl₄]²⁻.',s:'Zahřátím (vysušením) se odstraní voda. Kolem Co²⁺ se místo molekul vody uplatní chloridy (čtyřstěnné uspořádání), absorbuje se červená a oranžová část spektra a gel je modrý. S vodou vzniká oktaedrický [Co(H₂O)₆]²⁺, který absorbuje zelenou a je růžový. Počet d‑elektronů (d⁷) se nemění.',sub:'cocl4'},
 {n:'Sousedé v tabulce',q:'Měď a zinek jsou v periodické tabulce sousedé. Proč je roztok CuSO₄ modrý, ale roztok ZnSO₄ bezbarvý? Odpověz pomocí elektronové konfigurace.',h:'Napiš konfiguraci Cu²⁺ a Zn²⁺ a nakresli obsazení nižší a vyšší hladiny d‑orbitalů.',s:'<sub>29</sub>Cu²⁺: [Ar] 3d⁹, na vyšší hladině je jedno volné místo, elektron z nižší hladiny se může excitovat, d–d přechod absorbuje červenou. <sub>30</sub>Zn²⁺: [Ar] 3d¹⁰, vyšší hladina je plná, elektron se nemá kam excitovat a ve viditelné oblasti nic neabsorbuje.',sub:'znaq'},
 {n:'Fialový d⁰',q:'Mn⁷⁺ v manganistanu má konfiguraci d⁰, stejně jako Ti⁴⁺ v bílém TiO₂. Proč je manganistan sytě fialový?',h:'d–d přechod to být nemůže. Odkud jinud se může elektron excitovat?',s:'Barvu způsobuje přenos náboje: elektron se excituje z atomu kyslíku do prázdného d‑orbitalu manganu. U Mn(VII) s velkým kladným nábojem stačí menší energie (viditelné světlo, zelená část), u Ti⁴⁺ je potřeba ultrafialové záření.',sub:'kmno4aq'},
 {n:'Důkaz absorbované barvy',q:'Navrhni pokus, kterým ukážeš, že roztok CuSO₄ absorbuje červené světlo a propouští modré. Máš k dispozici barevné LED svítilny nebo barevné fólie.',h:'Co uvidíš, když na roztok posvítíš červeně? A modře?',s:'Posvítíš skrz kyvetu s roztokem červenou LED: na stínítku je stopa výrazně slabší (červené světlo se absorbuje). Modré světlo projde téměř nezeslabené. Přesněji to změří spektrofotometr: absorpční maximum je kolem 800 nm.',sub:'cuaq'},
 {n:'Halogeny tmavnou',q:'F₂ je světle žlutý, Cl₂ žlutozelený, páry Br₂ červenohnědé a páry I₂ fialové. Co z toho vyvodíš o rozdílu energetických hladin v molekulách halogenů?',h:'Kterou barvu absorbuje Cl₂ a kterou I₂? Která má vyšší energii?',s:'Cl₂ absorbuje fialovou a UV, I₂ zelenou a žlutozelenou. Od fluoru k jodu se rozdíl energetických hladin zmenšuje, absorbuje se delší vlnová délka (nižší energie) a barva postupně tmavne.',sub:'i2g'},
 {n:'Červený, i když d¹⁰',q:'Cu⁺ má zaplněné d‑orbitaly, a přece je oxid měďný Cu₂O červený. CuCl je bílý. Jak to?',h:'Cu₂O je polovodič.',s:'U Cu₂O nejde o d–d přechod. Je to polovodič se zakázaným pásem asi 2 eV: absorbuje každý foton s větší energií, tedy fialovou až žlutou část. Zbývá červená. CuCl má zakázaný pás mnohem širší (absorbuje jen UV), proto je bílý.',sub:'cu2o'},
 {n:'Amoniak a měď',q:'K roztoku CuSO₄ přikapáváš roztok amoniaku. Nejdřív vznikne světle modrá sraženina, v nadbytku amoniaku se rozpustí za vzniku tmavě modrého roztoku. Popiš obě děje a vysvětli, proč roztok ztmavne.',h:'Amoniak je ve vodě slabá zásada a zároveň dobrý ligand.',s:'Nejprve OH⁻ z roztoku amoniaku reaguje s Cu²⁺ za vzniku sraženiny Cu(OH)₂. V nadbytku NH₃ se sraženina rozpustí za vzniku [Cu(NH₃)₄(H₂O)₂]²⁺. NH₃ je silnější ligand než voda, rozštěpení je větší, absorbuje se oranžové světlo (asi 600 nm) místo červeného, a roztok je proto tmavě modrý.',sub:'cunh3'},
 {n:'Chroman, nebo dichroman?',q:'Do žlutého roztoku K₂CrO₄ přidáš kyselinu sírovou a roztok zoranžoví. Po přidání NaOH opět zežloutne. Zapiš rovnováhu a vysvětli změnu barvy.',h:'Oxidační číslo chromu se nemění.',s:'2 CrO₄²⁻ + 2 H⁺ ⇌ Cr₂O₇²⁻ + H₂O. Kyselina posune rovnováhu doprava (oranžový dichroman), hydroxid doleva (žlutý chroman). Chrom má v obou aniontech oxidační číslo VI (d⁰), barvu způsobuje přenos náboje, který u dichromanu absorbuje delší vlnové délky (i modrou).',sub:'cr2o7aq'},
 {n:'Bílá, nebo bezbarvá?',q:'Kostka cukru je bílá, roztok cukru bezbarvý a velký krystal kamenné soli průhledný. Vysvětli rozdíl mezi bílou a bezbarvou látkou.',h:'Absorbuje některá z těchto látek viditelné světlo?',s:'Žádná z nich viditelné světlo neabsorbuje. Velký krystal i roztok světlo propouštějí, proto jsou průhledné, bezbarvé. Prášek nebo kostka z mnoha drobných krystalků světlo na hranicích krystalků mnohokrát odráží a rozptyluje všemi směry, takže k oku přichází celé bílé spektrum a látka vypadá bílá.',sub:'nacl'}];

const GR=(()=>{
let U=0;const uid=()=>'b'+(++U);
const hx=c=>{c=c.replace('#','');return [0,2,4].map(i=>parseInt(c.substr(i,2),16))};
const toH=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return toH(A.map((v,i)=>v+(B[i]-v)*t))};
const sh=(c,t)=>t>0?mix(c,'#ffffff',t):mix(c,'#000000',-t);
const lum=c=>{const [r,g,b]=hx(c).map(v=>v/255);return .2126*r+.7152*g+.0722*b};
const rnd=(i,s)=>{const v=Math.sin(i*12.9898+s*78.233)*43758.5453;return v-Math.floor(v)};
const r1=v=>Math.round(v*10)/10;
const RAD=Math.PI/180;
const FF='font-family="Outfit,Arial,sans-serif"';
const wrap=(inner,vb='0 0 200 160',extra='')=>'<svg viewBox="'+vb+'" xmlns="http://www.w3.org/2000/svg" '+extra+'>'+inner+'</svg>';
const shades=c=>{const L=lum(c);if(L>.86)return{hi:'#ffffff',lo:'#cbd2da',lo2:'#a3adb9',white:1};if(L<.1)return{hi:sh(c,.3),lo:sh(c,-.35),lo2:'#000000'};return{hi:sh(c,.42),lo:sh(c,-.3),lo2:sh(c,-.56)}};

const star=(x,y,r,col,op)=>'<path d="M'+r1(x)+' '+r1(y-r)+'Q'+r1(x+r*.18)+' '+r1(y-r*.18)+' '+r1(x+r)+' '+r1(y)+'Q'+r1(x+r*.18)+' '+r1(y+r*.18)+' '+r1(x)+' '+r1(y+r)+'Q'+r1(x-r*.18)+' '+r1(y+r*.18)+' '+r1(x-r)+' '+r1(y)+'Q'+r1(x-r*.18)+' '+r1(y-r*.18)+' '+r1(x)+' '+r1(y-r)+'Z" fill="'+col+'" opacity="'+op+'"/>';

   out.push({q:'Roztok má barvu '+swn(o)+'. Kterou část spektra hlavně absorbuje?',o:[swn(i),...d.map(swn)],a:0,e:'Vidíme komplementární barvu k absorbované. K barvě '+WH[o].n+' je komplementární '+WH[i].n+'.',rv:'Roztok je '+WH[o].n+', absorbuje:',g:'kruh'})}});return out}
function itemsDn(){const L=ION.filter(I=>I.t==='dd'||I.t==='d0'||I.t==='d10');return shuf(L).slice(0,8).map(I=>{const a=AT[I.el],n=a[3];
  const ok=I.d>0&&I.d<10;const vt=d=>(d>0&&d<10)?'barevný':'bezbarvý';
  const cf=(d,s)=>a[0]+' '+n+'d'+GR.sup(d)+(s?' '+(n+1)+'s'+GR.sup(s):'');
  /* typická chyba: odebrat elektrony nejdřív z d */
  const wd=Math.max(0,a[1]-I.q),ws=a[2]-Math.max(0,I.q-a[1]);
  let alt=[[cf(I.d),vt(I.d)],[cf(I.d),ok?'bezbarvý':'barevný'],[cf(wd,ws),vt(wd)]];
  let d2=I.d===10?9:I.d===0?1:I.d+(I.d>5?-1:1);if(cf(d2)===alt[2][0])d2=Math.min(10,Math.max(0,I.d+(I.d>5?1:-1)));
  alt.push([cf(d2),vt(d2)]);
  const seen=new Set(),opts=[];alt.forEach(x=>{const t=x[0]+' · '+x[1];if(!seen.has(t)){seen.add(t);opts.push(t)}});
  while(opts.length<4){const d3=(I.d+opts.length*2)%11,t=cf(d3)+' · '+vt(d3);if(!seen.has(t)){seen.add(t);opts.push(t)}}
  return{q:'Kationt <b><sub>'+ZN[I.el]+'</sub>'+I.s+'</b> ('+EN[I.el]+': '+GR.cfgText(I)+'). Jakou má konfiguraci a je jeho akvakomplex barevný?',o:opts,a:0,
   e:'<sub>'+ZN[I.el]+'</sub>'+I.s+': '+GR.cfgText(I,1)+'. '+(I.d===0?'Žádný d‑elektron, d–d přechod nemůže nastat.':I.d===10?'d‑orbitaly jsou plné, elektron se nemá kam excitovat.':'Elektron může absorbovat viditelné světlo a excitovat se z nižší hladiny na vyšší.')+' Nejdřív se odevzdávají elektrony '+(n+1)+'s.',rv:I.s+':',g:'ion-'+I.k}})}
function itemsPoznej(){const pool=SUB.filter(s=>s.ab.length&&s.st!=='l');const pick=shuf(pool).slice(0,8);
 const grp=x=>x.st==='l'?'g':x.st;
 return pick.map(s=>{const ok=x=>x!==s&&colorDist(x.c,s.c)>90&&x.f!==s.f;let far=shuf(pool.filter(x=>ok(x)&&grp(x)===grp(s))).slice(0,3);
  if(far.length<3)far=far.concat(shuf(pool.filter(x=>ok(x)&&!far.includes(x))).slice(0,3-far.length));
  return{q:'Která látka je na obrázku? ('+ST[s.st]+')',fig:GR.ill(s),o:[s.f+' <span class="mut">– '+s.n+'</span>',...far.map(x=>x.f+' <span class="mut">– '+x.n+'</span>')],a:0,e:s.f+': '+s.n+'. '+s.w.split('|')[0],rv:'Na obrázku byl',g:'latka-'+s.id}})}
function colorDist(a,b){const A=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),B=[1,3,5].map(i=>parseInt(b.substr(i,2),16));return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2])}
function viewTest(q){const k=q.slice(5);
