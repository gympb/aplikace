<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="640" height="240" role="img"><title>Vondrys ukazuje hranol rozkládající světlo, modrou skalici, fialový manganistan a žlutozelený chlor</title><defs>
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="19" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="wash" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="23" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="0.7"/></filter>
<filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="2"/><feColorMatrix values="0 0 0 0 .42  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .12 0"/></filter>
<pattern id="sraf" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><path d="M0 0v3.4" stroke="#2a1e14" stroke-width=".7" opacity=".6"/></pattern>
</defs><rect width="320" height="120" fill="#efe4c8"/><rect width="320" height="120" filter="url(#paper)"/>
